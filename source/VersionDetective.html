<script type="application/json" id="filedata">[{"p": "analyzer.py", "s": 27378, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Read-only analysis engine for VersionDetective.\n\nEverything in this module only READS files.  Nothing here writes to,\nmoves or deletes a user file.\n\nPipeline\n--------\n1. ``extract(path)`` -> FileInfo (content lines / cells, hashes,\n   internal modified datetime, or an error reason that is shown to\n   the user, never silently dropped).\n2. ``build_groups()`` -> stage 1: identical-content groups\n   (deterministic), stage 2: version *candidate* groups (name-stem +\n   content similarity evidence; never auto-confirmed).\n3. ``rank_latest()`` -> latest candidate with reasons, including\n   branch detection (two versions each holding content the other\n   lacks -> no verdict).\n4. ``diff_infos()`` -> line-level (text) or cell-level (xlsx/csv)\n   diff with counts and examples.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport difflib\nimport hashlib\nimport io\nimport os\nimport re\nimport zipfile\nimport zlib\nfrom dataclasses import dataclass, field\nfrom datetime import datetime, timezone\nfrom xml.etree import ElementTree as ET\n\nMAX_FULL_PARSE_BYTES = 100 * 1024 * 1024  # >100MB: hash only\nWARN_FILE_COUNT = 2000\n\nTEXT_EXTS = {\".txt\", \".md\"}\nOFFICE_TEXT_EXTS = {\".docx\", \".pptx\"}\nCELL_EXTS = {\".xlsx\"}\nCSV_EXTS = {\".csv\"}\nPDF_EXTS = {\".pdf\"}\nSUPPORTED_EXTS = TEXT_EXTS | OFFICE_TEXT_EXTS | CELL_EXTS | CSV_EXTS | PDF_EXTS\n\n\n# ----------------------------------------------------------------------\n# Data model\n# ----------------------------------------------------------------------\n\n@dataclass\nclass FileInfo:\n    path: str\n    name: str\n    ext: str\n    size: int = 0\n    mtime: float = 0.0\n    status: str = \"ok\"           # ok | hash_only | error\n    error_reason: str = \"\"       # i18n key suffix, e.g. \"encrypted\"\n    kind: str = \"none\"           # text | cells | none\n    lines: list = field(default_factory=list)   # text content\n    cells: dict = field(default_factory=dict)   # (sheet, coord) -> value\n    content_hash: str = \"\"       # hash of extracted content (or bytes)\n    file_hash: str = \"\"          # sha256 of raw bytes\n    internal_modified: datetime | None = None\n    internal_source: str = \"\"    # \"office\" | \"pdf\" | \"\"\n\n    @property\n    def effective_dt(self) -> datetime:\n        \"\"\"Internal content datetime wins over the file mtime.\"\"\"\n        if self.internal_modified is not None:\n            return self.internal_modified\n        return datetime.fromtimestamp(self.mtime, tz=timezone.utc)\n\n    @property\n    def dt_source(self) -> str:\n        if self.internal_modified is not None:\n            return self.internal_source  # office / pdf\n        return \"mtime\"\n\n    def sim_items(self) -> set:\n        \"\"\"Item set used for similarity / diff-direction judgements.\"\"\"\n        if self.kind == \"cells\":\n            return {f\"{s}!{c}={v}\" for (s, c), v in self.cells.items()}\n        if self.kind == \"text\":\n            return set(self.lines)\n        return set()\n\n    def content_keys(self) -> set:\n        \"\"\"Identity keys of the content pieces, WITHOUT values.\n\n        Used for branch detection: a spreadsheet cell whose value\n        was edited keeps its coordinate key, so an ordinary edit is\n        not mistaken for a divergence.  A branch needs content keys\n        that are entirely absent from the other side, both ways.\n        \"\"\"\n        if self.kind == \"cells\":\n            return set(self.cells.keys())\n        if self.kind == \"text\":\n            return set(self.lines)\n        return set()\n\n    def stem_key(self) -> str:\n        return stem_key(self.name)\n\n\n# ----------------------------------------------------------------------\n# Name stems (version words removed)\n# ----------------------------------------------------------------------\n\n_VERSION_PATTERNS = [\n    r\"本当の最終版\", r\"最終版\", r\"最終\", r\"提出用\", r\"提出\", r\"修正版\", r\"修正\",\n    r\"改訂版\", r\"改訂\", r\"更新版\", r\"更新\", r\"新版\", r\"旧版\", r\"コピー\",\n    r\"ドラフト\", r\"下書き\", r\"完成版\", r\"確定版\", r\"正式版\",\n    r\"final\", r\"draft\", r\"copy\", r\"rev(?:ision)?\", r\"ver(?:sion)?\",\n    r\"v(?=\\d)\", r\"r(?=\\d)\",\n]\n_VERSION_RE = re.compile(\n    r\"(?:\" + \"|\".join(_VERSION_PATTERNS) + r\")\\s*\\d*(?:\\.\\d+)*\",\n    re.IGNORECASE)\n_DATE_RE = re.compile(\n    r\"(?:20\\d{2}[-_/年]?\\s?\\d{1,2}[-_/月]?\\s?\\d{1,2}日?\"\n    r\"|20\\d{6,8}|\\d{1,2}[-_/]\\d{1,2})\")\n_NUM_SUFFIX_RE = re.compile(r\"(?:\\(\\d+\\)|（\\d+）|[\\s_\\-]\\d{1,3})$\")\n_SEP_RE = re.compile(r\"[\\s_\\-・．.、,，()（）\\[\\]]+\")\n\n\ndef stem_key(name: str) -> str:\n    \"\"\"Normalised document stem: file name minus extension, version\n    words, dates and copy numbers.  Two files of the same document in\n    different versions should land on the same stem key.\"\"\"\n    stem = os.path.splitext(name)[0].lower()\n    prev = None\n    while prev != stem:\n        prev = stem\n        stem = _VERSION_RE.sub(\" \", stem)\n        stem = _DATE_RE.sub(\" \", stem)\n        stem = _NUM_SUFFIX_RE.sub(\"\", stem.strip())\n    return _SEP_RE.sub(\"\", stem)\n\n\ndef stem_tokens(name: str) -> set:\n    stem = os.path.splitext(name)[0].lower()\n    stem = _VERSION_RE.sub(\" \", stem)\n    stem = _DATE_RE.sub(\" \", stem)\n    return {t for t in _SEP_RE.split(stem) if t}\n\n\ndef stem_similarity(a: str, b: str) -> float:\n    ka, kb = stem_key(a), stem_key(b)\n    if ka and ka == kb:\n        return 1.0\n    ta, tb = stem_tokens(a), stem_tokens(b)\n    if not ta or not tb:\n        return 0.0\n    return len(ta & tb) / len(ta | tb)\n\n\n# ----------------------------------------------------------------------\n# Content extraction (read-only, stdlib only)\n# ----------------------------------------------------------------------\n\ndef _sha256_bytes(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\n\ndef _content_hash(lines=None, cells=None) -> str:\n    h = hashlib.sha256()\n    if cells:\n        for key in sorted(cells):\n            h.update(f\"{key[0]}!{key[1]}={cells[key]}\\n\".encode(\"utf-8\"))\n    else:\n        for line in lines or []:\n            h.update((line + \"\\n\").encode(\"utf-8\"))\n    return h.hexdigest()\n\n\ndef _norm_line(s: str) -> str:\n    return re.sub(r\"\\s+\", \" \", s).strip()\n\n\ndef _parse_core_xml(zf: zipfile.ZipFile):\n    \"\"\"docProps/core.xml -> dcterms:modified as aware datetime.\"\"\"\n    try:\n        data = zf.read(\"docProps/core.xml\")\n    except KeyError:\n        return None\n    try:\n        root = ET.fromstring(data)\n    except ET.ParseError:\n        return None\n    for el in root.iter():\n        if el.tag.endswith(\"}modified\") or el.tag == \"modified\":\n            txt = (el.text or \"\").strip()\n            if txt:\n                try:\n                    dt = datetime.fromisoformat(txt.replace(\"Z\", \"+00:00\"))\n                    if dt.tzinfo is None:\n                        dt = dt.replace(tzinfo=timezone.utc)\n                    return dt\n                except ValueError:\n                    return None\n    return None\n\n\n_NS_W = \"{http://schemas.openxmlformats.org/wordprocessingml/2006/main}\"\n_NS_A = \"{http://schemas.openxmlformats.org/drawingml/2006/main}\"\n_NS_SS = \"{http://schemas.openxmlformats.org/spreadsheetml/2006/main}\"\n_NS_R = \"{http://schemas.openxmlformats.org/officeDocument/2006/relationships}\"\n_NS_REL = \"{http://schemas.openxmlformats.org/package/2006/relationships}\"\n\n\ndef _extract_docx(zf: zipfile.ZipFile) -> list:\n    root = ET.fromstring(zf.read(\"word/document.xml\"))\n    lines = []\n    for para in root.iter(_NS_W + \"p\"):\n        text = \"\".join(t.text or \"\" for t in para.iter(_NS_W + \"t\"))\n        text = _norm_line(text)\n        if text:\n            lines.append(text)\n    return lines\n\n\ndef _extract_pptx(zf: zipfile.ZipFile) -> list:\n    lines = []\n    names = sorted(n for n in zf.namelist()\n                   if re.match(r\"ppt/slides/slide\\d+\\.xml$\", n))\n    for name in names:\n        root = ET.fromstring(zf.read(name))\n        slide_no = int(re.search(r\"(\\d+)\\.xml$\", name).group(1))\n        for para in root.iter(_NS_A + \"p\"):\n            text = \"\".join(t.text or \"\" for t in para.iter(_NS_A + \"t\"))\n            text = _norm_line(text)\n            if text:\n                lines.append(f\"[slide {slide_no}] {text}\")\n    return lines\n\n\ndef _col_name(idx: int) -> str:\n    name = \"\"\n    idx += 1\n    while idx:\n        idx, rem = divmod(idx - 1, 26)\n        name = chr(65 + rem) + name\n    return name\n\n\ndef _extract_xlsx(zf: zipfile.ZipFile) -> dict:\n    shared = []\n    if \"xl/sharedStrings.xml\" in zf.namelist():\n        root = ET.fromstring(zf.read(\"xl/sharedStrings.xml\"))\n        for si in root.iter(_NS_SS + \"si\"):\n            shared.append(\"\".join(t.text or \"\"\n                                  for t in si.iter(_NS_SS + \"t\")))\n    wb = ET.fromstring(zf.read(\"xl/workbook.xml\"))\n    rels = {}\n    if \"xl/_rels/workbook.xml.rels\" in zf.namelist():\n        rroot = ET.fromstring(zf.read(\"xl/_rels/workbook.xml.rels\"))\n        for rel in rroot.iter(_NS_REL + \"Relationship\"):\n            rels[rel.get(\"Id\")] = rel.get(\"Target\")\n    cells = {}\n    sheets_el = wb.find(_NS_SS + \"sheets\")\n    if sheets_el is None:\n        return cells\n    for pos, sheet in enumerate(sheets_el.iter(_NS_SS + \"sheet\")):\n        sname = sheet.get(\"name\") or f\"Sheet{pos + 1}\"\n        target = rels.get(sheet.get(_NS_R + \"id\"), \"\")\n        path = \"xl/\" + target.lstrip(\"/\")\n        if path not in zf.namelist():\n            path = f\"xl/worksheets/sheet{pos + 1}.xml\"\n        if path not in zf.namelist():\n            continue\n        root = ET.fromstring(zf.read(path))\n        for c in root.iter(_NS_SS + \"c\"):\n            coord = c.get(\"r\") or \"\"\n            ctype = c.get(\"t\")\n            value = \"\"\n            if ctype == \"inlineStr\":\n                is_el = c.find(_NS_SS + \"is\")\n                if is_el is not None:\n                    value = \"\".join(t.text or \"\"\n                                    for t in is_el.iter(_NS_SS + \"t\"))\n            else:\n                v = c.find(_NS_SS + \"v\")\n                if v is not None and v.text is not None:\n                    if ctype == \"s\":\n                        try:\n                            value = shared[int(v.text)]\n                        except (ValueError, IndexError):\n                            value = v.text\n                    else:\n                        value = v.text\n            value = _norm_line(str(value))\n            if value:\n                cells[(sname, coord)] = value\n    return cells\n\n\ndef _decode_text_bytes(data: bytes) -> str:\n    for enc in (\"utf-8-sig\", \"utf-16\", \"shift_jis\", \"latin-1\"):\n        try:\n            return data.decode(enc)\n        except (UnicodeDecodeError, UnicodeError):\n            continue\n    return data.decode(\"utf-8\", errors=\"replace\")\n\n\ndef _extract_csv(data: bytes) -> dict:\n    text = _decode_text_bytes(data)\n    cells = {}\n    reader = csv.reader(io.StringIO(text))\n    for r, row in enumerate(reader):\n        for cidx, value in enumerate(row):\n            value = _norm_line(value)\n            if value:\n                cells[(\"CSV\", f\"{_col_name(cidx)}{r + 1}\")] = value\n    return cells\n\n\n_PDF_MODDATE_RE = re.compile(rb\"/ModDate\\s*\\(\\s*D:([0-9]{4,14})\")\n_PDF_ENCRYPT_RE = re.compile(rb\"/Encrypt\\b\")\n\n\ndef _pdf_moddate(data: bytes):\n    m = _PDF_MODDATE_RE.search(data)\n    if not m:\n        return None\n    digits = m.group(1).decode(\"ascii\", errors=\"ignore\")\n    try:\n        dt = datetime.strptime(digits[:14].ljust(14, \"0\"), \"%Y%m%d%H%M%S\")\n        return dt.replace(tzinfo=timezone.utc)\n    except ValueError:\n        return None\n\n\ndef _pdf_stream_text(data: bytes) -> list:\n    \"\"\"Best-effort text from uncompressed/FlateDecode content streams.\n\n    Handles literal (...) and hex <...> strings in Tj / TJ / '\n    operators with WinAnsi-ish bytes and UTF-16BE hex strings.\n    Anything more exotic degrades to 'no text found' (the caller\n    then reports the PDF as hash-only), never to a crash.\n    \"\"\"\n    lines = []\n    for m in re.finditer(rb\"stream\\r?\\n\", data):\n        start = m.end()\n        end = data.find(b\"endstream\", start)\n        if end < 0:\n            continue\n        raw = data[start:end]\n        try:\n            raw = zlib.decompress(raw)\n        except zlib.error:\n            pass  # uncompressed stream: use as-is\n        cur = []\n\n        def flush():\n            if cur:\n                lines.append(\"\".join(cur))\n                cur.clear()\n\n        token_re = re.compile(\n            rb\"\\((?:\\\\.|[^\\\\()])*\\)|<([0-9A-Fa-f\\s]+)>\"\n            rb\"|\\b(Tj|TJ|'|Td|TD|Tm|T\\*)\\b\", re.DOTALL)\n        pos = 0\n        pending = []  # string pieces waiting for a show operator\n        for tm in token_re.finditer(raw):\n            tok = tm.group(0)\n            op = tm.group(2)\n            if op is not None:\n                if op in (b\"Tj\", b\"TJ\", b\"'\"):\n                    cur.extend(pending)\n                    pending = []\n                    if op == b\"'\":\n                        flush()\n                elif op in (b\"Td\", b\"TD\", b\"Tm\", b\"T*\"):\n                    pending = []\n                    flush()\n                continue\n            if tok.startswith(b\"(\"):\n                body = tok[1:-1]\n                body = re.sub(rb\"\\\\([()\\\\])\", rb\"\\1\", body)\n                body = body.replace(rb\"\\\\n\", b\" \").replace(rb\"\\\\r\", b\" \")\n                pending.append(body.decode(\"latin-1\", errors=\"replace\"))\n            else:\n                hexs = re.sub(rb\"\\s+\", b\"\", tm.group(1) or b\"\")\n                try:\n                    bts = bytes.fromhex(hexs.decode(\"ascii\"))\n                except ValueError:\n                    continue\n                if bts.startswith(b\"\\xfe\\xff\"):\n                    pending.append(bts[2:].decode(\"utf-16-be\",\n                                                  errors=\"replace\"))\n                else:\n                    pending.append(bts.decode(\"latin-1\", errors=\"replace\"))\n            pos = tm.end()\n        flush()\n    out = []\n    for line in lines:\n        line = _norm_line(line)\n        if line:\n            out.append(line)\n    return out\n\n\ndef extract(path: str) -> FileInfo:\n    \"\"\"Parse one file read-only.  Never raises: failures come back as\n    status='error' with a reason key so the UI can list the file.\"\"\"\n    info = FileInfo(path=path, name=os.path.basename(path),\n                    ext=os.path.splitext(path)[1].lower())\n    try:\n        st = os.stat(path)\n        info.size = st.st_size\n        info.mtime = st.st_mtime\n    except OSError:\n        info.status = \"error\"\n        info.error_reason = \"unreadable\"\n        return info\n\n    try:\n        with open(path, \"rb\") as fh:\n            data = fh.read()\n    except OSError:\n        info.status = \"error\"\n        info.error_reason = \"unreadable\"\n        return info\n    info.file_hash = _sha256_bytes(data)\n\n    if info.size > MAX_FULL_PARSE_BYTES:\n        info.status = \"hash_only\"\n        info.error_reason = \"too_large\"\n        info.content_hash = info.file_hash\n        return info\n\n    ext = info.ext\n    try:\n        if ext in (\".docx\", \".xlsx\", \".pptx\"):\n            if not zipfile.is_zipfile(io.BytesIO(data)):\n                info.status = \"error\"\n                info.error_reason = \"corrupt\"\n                return info\n            with zipfile.ZipFile(io.BytesIO(data)) as zf:\n                if zf.testzip() is not None:\n                    info.status = \"error\"\n                    info.error_reason = \"corrupt\"\n                    return info\n                info.internal_modified = _parse_core_xml(zf)\n                if info.internal_modified is not None:\n                    info.internal_source = \"office\"\n                if ext == \".docx\":\n                    info.lines = _extract_docx(zf)\n                    info.kind = \"text\"\n                elif ext == \".pptx\":\n                    info.lines = _extract_pptx(zf)\n                    info.kind = \"text\"\n                else:\n                    info.cells = _extract_xlsx(zf)\n                    info.kind = \"cells\"\n        elif ext in TEXT_EXTS:\n            text = _decode_text_bytes(data)\n            info.lines = [ln for ln in\n                          (_norm_line(x) for x in text.splitlines()) if ln]\n            info.kind = \"text\"\n        elif ext in CSV_EXTS:\n            info.cells = _extract_csv(data)\n            info.kind = \"cells\"\n        elif ext in PDF_EXTS:\n            if _PDF_ENCRYPT_RE.search(data):\n                info.status = \"error\"\n                info.error_reason = \"encrypted\"\n                info.content_hash = info.file_hash\n                return info\n            info.internal_modified = _pdf_moddate(data)\n            if info.internal_modified is not None:\n                info.internal_source = \"pdf\"\n            info.lines = _pdf_stream_text(data)\n            if info.lines:\n                info.kind = \"text\"\n            else:\n                info.status = \"hash_only\"\n                info.error_reason = \"pdf_no_text\"\n        else:\n            info.status = \"hash_only\"\n            info.error_reason = \"unsupported\"\n    except (zipfile.BadZipFile, ET.ParseError, KeyError, zlib.error):\n        info.status = \"error\"\n        info.error_reason = \"corrupt\"\n        info.content_hash = info.file_hash\n        return info\n    except Exception:\n        info.status = \"error\"\n        info.error_reason = \"unreadable\"\n        info.content_hash = info.file_hash\n        return info\n\n    if info.kind == \"cells\":\n        info.content_hash = _content_hash(cells=info.cells)\n    elif info.kind == \"text\":\n        info.content_hash = _content_hash(lines=info.lines)\n    else:\n        info.content_hash = info.file_hash\n    if info.status == \"ok\" and info.kind == \"none\":\n        info.status = \"hash_only\"\n    return info\n\n\ndef scan_folder(root: str, recursive: bool):\n    \"\"\"Yield file paths under root (read-only walk).\"\"\"\n    if recursive:\n        for dirpath, _dirs, files in os.walk(root):\n            for f in sorted(files):\n                yield os.path.join(dirpath, f)\n    else:\n        for f in sorted(os.listdir(root)):\n            p = os.path.join(root, f)\n            if os.path.isfile(p):\n                yield p\n\n\n# ----------------------------------------------------------------------\n# Grouping\n# ----------------------------------------------------------------------\n\n@dataclass\nclass Group:\n    gid: int\n    kind: str                    # exact | candidate\n    members: list                # list[FileInfo]\n    similarity: float = 0.0      # min pairwise content similarity\n    stem: str = \"\"\n    manual_latest: str = \"\"      # path chosen by the user as latest\n\n    def title(self) -> str:\n        return self.stem or (self.members[0].stem_key()\n                             if self.members else \"\")\n\n\ndef content_similarity(a: FileInfo, b: FileInfo) -> float:\n    if a.kind == \"cells\" and b.kind == \"cells\":\n        # Coordinate-aware: a cell present on both sides counts even\n        # when its value was edited (half credit), so a spreadsheet\n        # revision is not scored as a near-unrelated document.\n        ka, kb = set(a.cells), set(b.cells)\n        if not ka or not kb:\n            return 0.0\n        both = ka & kb\n        same = sum(1 for k in both if a.cells[k] == b.cells[k])\n        return (same + 0.5 * (len(both) - same)) / len(ka | kb)\n    ia, ib = a.sim_items(), b.sim_items()\n    if not ia or not ib:\n        return 0.0\n    return len(ia & ib) / len(ia | ib)\n\n\nSTAGE2_MIN_STEM = 0.6\nSTAGE2_MIN_CONTENT = 0.45\n\n\ndef build_groups(infos, rejected_pairs=None, forced_merges=None):\n    \"\"\"Two-stage grouping.\n\n    Stage 1 (exact): identical content_hash -> same component, a\n    deterministic fact.\n    Stage 2 (candidate): an edge is added only when BOTH the name\n    stem evidence (stem similarity >= 0.6) AND the content\n    similarity (>= 0.45) support it.  Components containing any\n    stage-2 edge are 'candidate' groups: proposals with visible\n    evidence, never verdicts.\n\n    rejected_pairs: set of frozenset({pathA, pathB}) the user split.\n    forced_merges: set of frozenset({pathA, pathB}) the user merged.\n    Returns (groups, singles).\n    \"\"\"\n    rejected_pairs = rejected_pairs or set()\n    forced_merges = forced_merges or set()\n    usable = [i for i in infos if i.status in (\"ok\", \"hash_only\")\n              and i.content_hash]\n    parent = {i.path: i.path for i in usable}\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n\n    def union(a, b):\n        ra, rb = find(a), find(b)\n        if ra != rb:\n            parent[ra] = rb\n\n    stage2_edges = set()\n    by_hash = {}\n    for info in usable:\n        by_hash.setdefault(info.content_hash, []).append(info)\n    for same in by_hash.values():\n        for other in same[1:]:\n            union(same[0].path, other.path)\n\n    n = len(usable)\n    for x in range(n):\n        for y in range(x + 1, n):\n            a, b = usable[x], usable[y]\n            pair = frozenset((a.path, b.path))\n            if pair in rejected_pairs:\n                continue\n            if find(a.path) == find(b.path):\n                continue\n            if a.kind == \"none\" or b.kind == \"none\":\n                continue  # no content evidence for unsupported formats\n            if stem_similarity(a.name, b.name) < STAGE2_MIN_STEM:\n                continue\n            if content_similarity(a, b) < STAGE2_MIN_CONTENT:\n                continue\n            union(a.path, b.path)\n            stage2_edges.add(pair)\n\n    for pair in forced_merges:\n        pa, pb = tuple(pair)\n        if pa in parent and pb in parent:\n            union(pa, pb)\n            stage2_edges.add(pair)\n\n    comps = {}\n    for info in usable:\n        comps.setdefault(find(info.path), []).append(info)\n\n    groups, singles = [], []\n    gid = 0\n    for members in comps.values():\n        if len(members) == 1:\n            singles.append(members[0])\n            continue\n        gid += 1\n        member_paths = {m.path for m in members}\n        edge_roots = set()\n        for pair in stage2_edges:\n            if len(pair & member_paths) == 2:\n                edge_roots.add(find(next(iter(pair))))\n        has_stage2 = find(members[0].path) in edge_roots\n        sims = []\n        if has_stage2:\n            for x in range(len(members)):\n                for y in range(x + 1, len(members)):\n                    s = content_similarity(members[x], members[y])\n                    if s > 0:\n                        sims.append(s)\n        groups.append(Group(\n            gid=gid,\n            kind=\"candidate\" if has_stage2 else \"exact\",\n            members=sorted(members, key=lambda m: m.effective_dt),\n            similarity=min(sims) if sims else 0.0,\n            stem=members[0].stem_key()))\n    groups.sort(key=lambda g: (g.kind != \"exact\", g.title()))\n    return groups, singles\n\n\n# ----------------------------------------------------------------------\n# Latest-candidate ranking + branch detection\n# ----------------------------------------------------------------------\n\n@dataclass\nclass LatestVerdict:\n    candidate: FileInfo | None\n    reasons: list                # list of (i18n key, params dict)\n    branch: bool = False\n    branch_with: FileInfo | None = None\n\n\ndef rank_latest(group: Group) -> LatestVerdict:\n    members = group.members\n    if not members:\n        return LatestVerdict(None, [])\n    if group.manual_latest:\n        for m in members:\n            if m.path == group.manual_latest:\n                return LatestVerdict(m, [(\"reason_manual\", {})])\n    if len(members) == 1:\n        return LatestVerdict(members[0], [(\"reason_only\", {})])\n\n    cand = max(members, key=lambda m: m.effective_dt)\n    reasons = []\n    src_key = {\"office\": \"reason_dt_office\", \"pdf\": \"reason_dt_pdf\",\n               \"mtime\": \"reason_dt_mtime\"}[cand.dt_source]\n    reasons.append((src_key, {\"dt\": _fmt_dt(cand.effective_dt)}))\n\n    cand_items = cand.sim_items()\n    cand_keys = cand.content_keys()\n    branch_with = None\n    if cand_keys:\n        for other in members:\n            if other is cand:\n                continue\n            other_keys = other.content_keys()\n            if not other_keys:\n                continue\n            if (other_keys - cand_keys) and (cand_keys - other_keys):\n                branch_with = other\n                break\n    if branch_with is not None:\n        reasons.append((\"reason_branch\", {\"other\": branch_with.name}))\n        return LatestVerdict(None, reasons, branch=True,\n                             branch_with=branch_with)\n\n    if cand_items:\n        others_union = set()\n        for m in members:\n            if m is not cand:\n                others_union |= m.sim_items()\n        added = cand_items - others_union\n        if added:\n            reasons.append((\"reason_unique_content\", {\"n\": len(added)}))\n        oldest = min(members, key=lambda m: m.effective_dt)\n        if oldest is not cand:\n            mag = len(cand_items ^ oldest.sim_items())\n            if mag:\n                reasons.append((\"reason_magnitude\",\n                                {\"n\": mag, \"other\": oldest.name}))\n    return LatestVerdict(cand, reasons)\n\n\ndef _fmt_dt(dt: datetime) -> str:\n    return dt.astimezone(timezone.utc).strftime(\"%Y-%m-%d %H:%M\")\n\n\n# ----------------------------------------------------------------------\n# Diff\n# ----------------------------------------------------------------------\n\n@dataclass\nclass DiffResult:\n    kind: str                    # text | cells | none\n    added: int = 0\n    deleted: int = 0\n    changed_cells: list = field(default_factory=list)\n    added_cells: int = 0\n    removed_cells: int = 0\n    lines: list = field(default_factory=list)  # (mark, text)\n\n\ndef diff_infos(a: FileInfo, b: FileInfo, max_lines: int = 400) -> DiffResult:\n    \"\"\"Diff from a (older/left) to b (newer/right).\"\"\"\n    if a.kind == \"cells\" and b.kind == \"cells\":\n        res = DiffResult(kind=\"cells\")\n        keys = sorted(set(a.cells) | set(b.cells))\n        for key in keys:\n            va, vb = a.cells.get(key), b.cells.get(key)\n            if va is None:\n                res.added_cells += 1\n                res.changed_cells.append((key[0], key[1], \"\", vb))\n            elif vb is None:\n                res.removed_cells += 1\n                res.changed_cells.append((key[0], key[1], va, \"\"))\n            elif va != vb:\n                res.changed_cells.append((key[0], key[1], va, vb))\n        return res\n    if a.kind == \"text\" and b.kind == \"text\":\n        res = DiffResult(kind=\"text\")\n        sm = difflib.SequenceMatcher(a=a.lines, b=b.lines, autojunk=False)\n        for tag, i1, i2, j1, j2 in sm.get_opcodes():\n            if tag == \"equal\":\n                continue\n            if tag in (\"delete\", \"replace\"):\n                for line in a.lines[i1:i2]:\n                    res.deleted += 1\n                    if len(res.lines) < max_lines:\n                        res.lines.append((\"-\", line))\n            if tag in (\"insert\", \"replace\"):\n                for line in b.lines[j1:j2]:\n                    res.added += 1\n                    if len(res.lines) < max_lines:\n                        res.lines.append((\"+\", line))\n        return res\n    return DiffResult(kind=\"none\")\n\n\ndef summarize_pair(a: FileInfo, b: FileInfo) -> dict:\n    \"\"\"Counts-only summary used on the group view.\"\"\"\n    d = diff_infos(a, b)\n    return {\"added\": d.added, \"deleted\": d.deleted,\n            \"changed_cells\": len(d.changed_cells),\n            \"added_cells\": d.added_cells,\n            \"removed_cells\": d.removed_cells,\n            \"kind\": d.kind}\n"}, {"p": "app.py", "s": 42026, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"VersionDetective — main window.\n\nDesign: a floating pill command bar on top, a narrow rail of\ncase-file cards on the side, and a version genealogy (family tree)\nas the centrepiece, with a side-by-side \"spread\" diff underneath.\nNo band header, no list-and-button-rows house style.\n\nThe app only ever READS the files it analyses.  It never deletes a\nfile and never rewrites one; the only writes are approved moves to an\narchive folder (see mover.py) and the app's own settings/log.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport ctypes\nimport os\nimport sys\nfrom datetime import timezone\n\nfrom PySide6.QtCore import Qt, QThread, Signal\nfrom PySide6.QtGui import QColor\nfrom PySide6.QtWidgets import (\n    QApplication, QCheckBox, QComboBox, QDialog, QFileDialog, QFrame,\n    QHBoxLayout, QLabel, QLineEdit, QListWidget, QListWidgetItem,\n    QMainWindow, QMessageBox, QProgressBar, QPushButton, QScrollArea,\n    QSplitter, QTableWidget, QTableWidgetItem, QVBoxLayout, QWidget,\n)\n\nimport analyzer\nimport fonts\nimport icons\nimport mover\nimport theme\nfrom analyzer import FileInfo, Group\nfrom appinfo import APP_ID, display_name\nfrom genealogy import GenealogyCanvas, NodeView\nfrom i18n import LANGS, RTL_LANGS, tr\n\n\ndef _fmt_dt(info: FileInfo) -> str:\n    return info.effective_dt.astimezone(timezone.utc).strftime(\"%Y-%m-%d %H:%M\")\n\n\ndef _src_key(info: FileInfo) -> str:\n    return {\"office\": \"src_office\", \"pdf\": \"src_pdf\"}.get(\n        info.dt_source, \"src_mtime\")\n\n\n# ----------------------------------------------------------------------\n# Background scan\n# ----------------------------------------------------------------------\n\nclass ScanWorker(QThread):\n    progress = Signal(int, int)\n    finished_scan = Signal(list)\n\n    def __init__(self, paths):\n        super().__init__()\n        self._paths = paths\n        self._cancel = False\n\n    def cancel(self):\n        self._cancel = True\n\n    def run(self):\n        infos = []\n        total = len(self._paths)\n        for i, path in enumerate(self._paths):\n            if self._cancel:\n                break\n            infos.append(analyzer.extract(path))\n            if i % 10 == 0 or i == total - 1:\n                self.progress.emit(i + 1, total)\n        self.finished_scan.emit(infos)\n\n\n# ----------------------------------------------------------------------\n# Rail case card\n# ----------------------------------------------------------------------\n\nclass CaseCard(QFrame):\n    clicked = Signal(int)\n\n    def __init__(self, gid: int):\n        super().__init__()\n        self.gid = gid\n        self.setObjectName(\"railCard\")\n        self.setAttribute(Qt.WidgetAttribute.WA_Hover, True)\n        theme.soft_shadow(self, blur=14, dy=2, alpha=16)\n        self.setMinimumHeight(78)\n        self.setCursor(Qt.CursorShape.PointingHandCursor)\n        lay = QHBoxLayout(self)\n        lay.setContentsMargins(12, 9, 12, 9)\n        lay.setSpacing(10)\n        self.count = QLabel()\n        self.count.setObjectName(\"railCount\")\n        lay.addWidget(self.count)\n        right = QVBoxLayout()\n        right.setSpacing(2)\n        self.title = QLabel()\n        self.title.setObjectName(\"railTitle\")\n        self.title.setWordWrap(False)\n        self.badge = QLabel()\n        self.meta = QLabel()\n        self.meta.setObjectName(\"railMeta\")\n        self.meta.setWordWrap(True)\n        right.addWidget(self.title)\n        right.addWidget(self.badge)\n        right.addWidget(self.meta)\n        lay.addLayout(right, 1)\n\n    def mousePressEvent(self, event):\n        self.clicked.emit(self.gid)\n        super().mousePressEvent(event)\n\n    def set_selected(self, on: bool):\n        self.setProperty(\"selected\", \"true\" if on else \"false\")\n        self.style().unpolish(self)\n        self.style().polish(self)\n\n\n# ----------------------------------------------------------------------\n# Archive proposal dialog\n# ----------------------------------------------------------------------\n\nclass ArchiveDialog(QDialog):\n    def __init__(self, parent, lang, members, archive_dir):\n        super().__init__(parent)\n        self.lang = lang\n        self.members = members\n        self.setWindowTitle(tr(lang, \"move_title\"))\n        self.resize(560, 420)\n        lay = QVBoxLayout(self)\n        hint = QLabel(tr(lang, \"move_hint\"))\n        hint.setWordWrap(True)\n        lay.addWidget(hint)\n        row = QHBoxLayout()\n        row.addWidget(QLabel(tr(lang, \"archive_folder\")))\n        self.dir_edit = QLineEdit(archive_dir)\n        row.addWidget(self.dir_edit, 1)\n        choose = QPushButton(tr(lang, \"choose_folder\"))\n        choose.clicked.connect(self._choose)\n        row.addWidget(choose)\n        lay.addLayout(row)\n        self.list = QListWidget()\n        for info, checked in members:\n            item = QListWidgetItem(info.name)\n            item.setFlags(item.flags() | Qt.ItemFlag.ItemIsUserCheckable)\n            item.setCheckState(Qt.CheckState.Checked if checked\n                               else Qt.CheckState.Unchecked)\n            item.setData(Qt.ItemDataRole.UserRole, info.path)\n            self.list.addItem(item)\n        lay.addWidget(self.list, 1)\n        btns = QHBoxLayout()\n        self.undo_btn = QPushButton(tr(lang, \"undo_move\"))\n        self.undo_btn.setIcon(icons.icon(\"undo\", theme.INDIGO_DEEP))\n        btns.addWidget(self.undo_btn)\n        btns.addStretch(1)\n        cancel = QPushButton(tr(lang, \"cancel\"))\n        cancel.clicked.connect(self.reject)\n        btns.addWidget(cancel)\n        self.exec_btn = QPushButton(tr(lang, \"move_execute\"))\n        self.exec_btn.setObjectName(\"primary\")\n        self.exec_btn.setIcon(icons.icon(\"archive\", \"#FFFFFF\"))\n        btns.addWidget(self.exec_btn)\n        lay.addLayout(btns)\n\n    def _choose(self):\n        d = QFileDialog.getExistingDirectory(\n            self, tr(self.lang, \"archive_folder\"),\n            self.dir_edit.text())\n        if d:\n            self.dir_edit.setText(d)\n\n    def checked_paths(self):\n        out = []\n        for i in range(self.list.count()):\n            item = self.list.item(i)\n            if item.checkState() == Qt.CheckState.Checked:\n                out.append(item.data(Qt.ItemDataRole.UserRole))\n        return out\n\n\n# ----------------------------------------------------------------------\n# Main window\n# ----------------------------------------------------------------------\n\nclass MainWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.settings = mover.load_settings()\n        self.lang = self.settings.get(\"lang\", \"ja\")\n        if self.lang not in dict(LANGS):\n            self.lang = \"ja\"\n        self.infos: list[FileInfo] = []\n        self.groups: list[Group] = []\n        self.singles: list[FileInfo] = []\n        self.selected_gid = None\n        self.selected_path = None\n        self.rejected_pairs: set = set()\n        self.forced_merges: set = set()\n        self.merge_source_gid = None\n        self.root_folder = \"\"\n        self.worker: ScanWorker | None = None\n        self._build_ui()\n        self.retranslate()\n        self.setAcceptDrops(True)\n\n    # ------------------------------------------------------------------\n    # UI construction\n    # ------------------------------------------------------------------\n    def _build_ui(self):\n        self.setWindowTitle(display_name(self.lang))\n        self.resize(1220, 780)\n        central = QWidget()\n        self.setCentralWidget(central)\n        root = QVBoxLayout(central)\n        root.setContentsMargins(14, 12, 14, 12)\n        root.setSpacing(10)\n\n        # ---- floating pill command bar ----\n        bar = QFrame()\n        bar.setObjectName(\"commandBar\")\n        theme.soft_shadow(bar, blur=24, dy=4, alpha=28)\n        bl = QHBoxLayout(bar)\n        bl.setContentsMargins(20, 10, 14, 10)\n        bl.setSpacing(12)\n        titles = QVBoxLayout()\n        titles.setSpacing(0)\n        self.cmd_title = QLabel()\n        self.cmd_title.setObjectName(\"cmdTitle\")\n        self.cmd_tagline = QLabel()\n        self.cmd_tagline.setObjectName(\"cmdTagline\")\n        titles.addWidget(self.cmd_title)\n        titles.addWidget(self.cmd_tagline)\n        bl.addLayout(titles)\n        bl.addSpacing(8)\n        self.open_btn = QPushButton()\n        self.open_btn.setObjectName(\"primary\")\n        self.open_btn.setIcon(icons.icon(\"folder\", \"#FFFFFF\"))\n        self.open_btn.clicked.connect(self.choose_folder)\n        bl.addWidget(self.open_btn)\n        self.recursive_chk = QCheckBox()\n        self.recursive_chk.setChecked(\n            bool(self.settings.get(\"recursive\", True)))\n        bl.addWidget(self.recursive_chk)\n        self.search_edit = QLineEdit()\n        self.search_edit.setObjectName(\"searchEdit\")\n        self.search_edit.textChanged.connect(self._rebuild_rail)\n        bl.addWidget(self.search_edit, 1)\n        self.progress = QProgressBar()\n        self.progress.setFixedWidth(170)\n        self.progress.hide()\n        bl.addWidget(self.progress)\n        self.cancel_btn = QPushButton()\n        self.cancel_btn.hide()\n        self.cancel_btn.clicked.connect(self._cancel_scan)\n        bl.addWidget(self.cancel_btn)\n        self.lang_label = QLabel()\n        bl.addWidget(self.lang_label)\n        self.lang_combo = QComboBox()\n        self.lang_combo.setObjectName(\"langCombo\")\n        for code, name in LANGS:\n            self.lang_combo.addItem(name, code)\n        self.lang_combo.setCurrentIndex(\n            [c for c, _ in LANGS].index(self.lang))\n        self.lang_combo.currentIndexChanged.connect(self._lang_changed)\n        bl.addWidget(self.lang_combo)\n        root.addWidget(bar)\n\n        # ---- status row ----\n        srow = QHBoxLayout()\n        self.root_label = QLabel()\n        self.root_label.setObjectName(\"railMeta\")\n        srow.addWidget(self.root_label)\n        self.status_label = QLabel()\n        self.status_label.setObjectName(\"statusLabel\")\n        srow.addWidget(self.status_label, 1)\n        self.warn_label = QLabel()\n        self.warn_label.setObjectName(\"warnLabel\")\n        srow.addWidget(self.warn_label)\n        root.addLayout(srow)\n\n        # ---- body: rail + main panel ----\n        split = QSplitter(Qt.Orientation.Horizontal)\n        split.setChildrenCollapsible(False)\n        root.addWidget(split, 1)\n\n        rail = QWidget()\n        rail.setFixedWidth(272)\n        rl = QVBoxLayout(rail)\n        rl.setContentsMargins(2, 2, 6, 2)\n        rl.setSpacing(8)\n        self.rail_head = QLabel()\n        self.rail_head.setObjectName(\"railHead\")\n        rl.addWidget(self.rail_head)\n        self.rail_scroll = QScrollArea()\n        self.rail_scroll.setWidgetResizable(True)\n        self.rail_scroll.setFrameShape(QFrame.Shape.NoFrame)\n        self.rail_host = QWidget()\n        self.rail_lay = QVBoxLayout(self.rail_host)\n        self.rail_lay.setContentsMargins(0, 0, 0, 0)\n        self.rail_lay.setSpacing(8)\n        self.rail_lay.addStretch(1)\n        self.rail_scroll.setWidget(self.rail_host)\n        rl.addWidget(self.rail_scroll, 1)\n        self.singles_head = QLabel()\n        self.singles_head.setObjectName(\"railHead\")\n        rl.addWidget(self.singles_head)\n        self.singles_list = QListWidget()\n        self.singles_list.setMaximumHeight(110)\n        rl.addWidget(self.singles_list)\n        self.errors_head = QLabel()\n        self.errors_head.setObjectName(\"railHead\")\n        rl.addWidget(self.errors_head)\n        self.errors_list = QListWidget()\n        self.errors_list.setMaximumHeight(110)\n        rl.addWidget(self.errors_list)\n        split.addWidget(rail)\n\n        panel = QFrame()\n        panel.setObjectName(\"panel\")\n        theme.soft_shadow(panel, blur=24, dy=4, alpha=22)\n        pl = QVBoxLayout(panel)\n        pl.setContentsMargins(18, 14, 18, 14)\n        pl.setSpacing(10)\n\n        head = QHBoxLayout()\n        self.group_title = QLabel()\n        self.group_title.setObjectName(\"bigTitle\")\n        self.group_title.setWordWrap(True)\n        head.addWidget(self.group_title, 1)\n        self.kind_badge = QLabel()\n        head.addWidget(self.kind_badge)\n        self.branch_badge = QLabel()\n        self.branch_badge.setObjectName(\"branchBadge\")\n        self.branch_badge.hide()\n        head.addWidget(self.branch_badge)\n        self.merge_btn = QPushButton()\n        self.merge_btn.setIcon(icons.icon(\"branch\", theme.INDIGO_DEEP))\n        self.merge_btn.clicked.connect(self._toggle_merge_mode)\n        head.addWidget(self.merge_btn)\n        self.archive_btn = QPushButton()\n        self.archive_btn.setObjectName(\"accent\")\n        self.archive_btn.setIcon(icons.icon(\"archive\", theme.AMBER))\n        self.archive_btn.clicked.connect(self.open_archive)\n        head.addWidget(self.archive_btn)\n        pl.addLayout(head)\n\n        self.sim_label = QLabel()\n        self.sim_label.setObjectName(\"reasonText\")\n        pl.addWidget(self.sim_label)\n\n        self.reasons_title = QLabel()\n        self.reasons_title.setObjectName(\"panelTitle\")\n        pl.addWidget(self.reasons_title)\n        self.reasons_label = QLabel()\n        self.reasons_label.setObjectName(\"reasonText\")\n        self.reasons_label.setWordWrap(True)\n        pl.addWidget(self.reasons_label)\n\n        self.canvas = GenealogyCanvas()\n        self.canvas.nodeClicked.connect(self._node_clicked)\n        self.gene_scroll = QScrollArea()\n        self.gene_scroll.setWidget(self.canvas)\n        self.gene_scroll.setWidgetResizable(False)\n        self.gene_scroll.setFrameShape(QFrame.Shape.NoFrame)\n        self.gene_scroll.setMinimumHeight(160)\n        pl.addWidget(self.gene_scroll)\n\n        drow = QHBoxLayout()\n        self.node_detail = QLabel()\n        self.node_detail.setObjectName(\"nodeDetail\")\n        self.node_detail.setWordWrap(True)\n        drow.addWidget(self.node_detail, 1)\n        self.set_latest_btn = QPushButton()\n        self.set_latest_btn.setIcon(icons.icon(\"star\", theme.INDIGO_DEEP))\n        self.set_latest_btn.clicked.connect(self._set_latest)\n        drow.addWidget(self.set_latest_btn)\n        self.remove_btn = QPushButton()\n        self.remove_btn.clicked.connect(self._remove_selected)\n        drow.addWidget(self.remove_btn)\n        pl.addLayout(drow)\n\n        crow = QHBoxLayout()\n        self.from_label = QLabel()\n        crow.addWidget(self.from_label)\n        self.from_combo = QComboBox()\n        self.from_combo.setMinimumWidth(170)\n        crow.addWidget(self.from_combo)\n        crow.addWidget(QLabel(\"→\"))\n        self.to_label = QLabel()\n        crow.addWidget(self.to_label)\n        self.to_combo = QComboBox()\n        self.to_combo.setMinimumWidth(170)\n        crow.addWidget(self.to_combo)\n        self.compare_btn = QPushButton()\n        self.compare_btn.setObjectName(\"primary\")\n        self.compare_btn.setIcon(icons.icon(\"diff\", \"#FFFFFF\"))\n        self.compare_btn.clicked.connect(self._show_diff)\n        crow.addWidget(self.compare_btn)\n        crow.addStretch(1)\n        self.diff_summary = QLabel()\n        self.diff_summary.setObjectName(\"reasonText\")\n        crow.addWidget(self.diff_summary)\n        pl.addLayout(crow)\n\n        srow2 = QHBoxLayout()\n        self.spread_old_head = QLabel()\n        self.spread_old_head.setObjectName(\"spreadHead\")\n        srow2.addWidget(self.spread_old_head, 1)\n        self.spread_new_head = QLabel()\n        self.spread_new_head.setObjectName(\"spreadHead\")\n        srow2.addWidget(self.spread_new_head, 1)\n        pl.addLayout(srow2)\n        self.spread = QTableWidget(0, 2)\n        self.spread.verticalHeader().setVisible(False)\n        self.spread.horizontalHeader().setVisible(False)\n        self.spread.setEditTriggers(\n            QTableWidget.EditTrigger.NoEditTriggers)\n        pl.addWidget(self.spread, 1)\n        split.addWidget(panel)\n        split.setStretchFactor(1, 1)\n\n    # ------------------------------------------------------------------\n    # i18n\n    # ------------------------------------------------------------------\n    def t(self, key, **params):\n        return tr(self.lang, key, **params)\n\n    def _lang_changed(self, idx):\n        code = self.lang_combo.itemData(idx)\n        if code and code != self.lang:\n            self.lang = code\n            self.settings[\"lang\"] = code\n            mover.save_settings(self.settings)\n            self.retranslate()\n\n    def retranslate(self):\n        app = QApplication.instance()\n        if app is not None:\n            fonts.apply_language_font(app, self.lang)\n            # Re-polish the whole tree so existing widgets adopt the\n            # (possibly new) font stack at once.  On some platforms\n            # (seen with the frozen build under Wine) an application\n            # font change alone does not re-resolve the families of\n            # widgets that already exist; an explicit re-polish does.\n            style = self.style()\n            for widget in [self, *self.findChildren(QWidget)]:\n                style.unpolish(widget)\n                style.polish(widget)\n            if self.lang in RTL_LANGS:\n                app.setLayoutDirection(Qt.LayoutDirection.RightToLeft)\n            else:\n                app.setLayoutDirection(Qt.LayoutDirection.LeftToRight)\n        self.setWindowTitle(display_name(self.lang))\n        self.cmd_title.setText(display_name(self.lang))\n        self.cmd_tagline.setText(self.t(\"app_tagline\"))\n        self.open_btn.setText(self.t(\"open_folder\"))\n        self.recursive_chk.setText(self.t(\"recursive\"))\n        self.search_edit.setPlaceholderText(self.t(\"search_groups\"))\n        self.cancel_btn.setText(self.t(\"cancel\"))\n        self.lang_label.setText(self.t(\"language\"))\n        self.rail_head.setText(self.t(\"rail_groups\"))\n        self.singles_head.setText(self.t(\"singles_title\"))\n        self.errors_head.setText(self.t(\"errors_title\"))\n        self.reasons_title.setText(self.t(\"reasons_title\"))\n        self.merge_btn.setText(self.t(\"merge_groups\"))\n        self.archive_btn.setText(self.t(\"archive_button\"))\n        self.set_latest_btn.setText(self.t(\"set_latest\"))\n        self.remove_btn.setText(self.t(\"remove_from_group\"))\n        self.from_label.setText(self.t(\"compare_from\"))\n        self.to_label.setText(self.t(\"compare_to\"))\n        self.compare_btn.setText(self.t(\"compare_button\"))\n        if not self.groups:\n            self.status_label.setText(self.t(\"status_ready\"))\n            self.group_title.setText(self.t(\"genealogy\"))\n            self.reasons_label.setText(self.t(\"genealogy_empty\"))\n            self.canvas.set_data([], rtl=self.lang in RTL_LANGS,\n                                 empty_text=self.t(\"empty_hint\"))\n        self._rebuild_rail()\n        if self.selected_gid is not None and \\\n                self._group_by_id(self.selected_gid) is not None:\n            self._show_group(self.selected_gid)\n        self._update_root_label()\n\n    def _update_root_label(self):\n        if self.root_folder:\n            self.root_label.setText(\n                f\"{self.t('root_label')}: {self.root_folder}\")\n        else:\n            self.root_label.setText(\"\")\n\n    # ------------------------------------------------------------------\n    # Scanning\n    # ------------------------------------------------------------------\n    def choose_folder(self):\n        d = QFileDialog.getExistingDirectory(\n            self, self.t(\"open_folder\"), self.root_folder)\n        if d:\n            self.start_scan(d)\n\n    def dragEnterEvent(self, event):\n        if event.mimeData().hasUrls():\n            event.acceptProposedAction()\n\n    def dropEvent(self, event):\n        for url in event.mimeData().urls():\n            path = url.toLocalFile()\n            if os.path.isdir(path):\n                self.start_scan(path)\n                return\n\n    def start_scan(self, folder):\n        if self.worker and self.worker.isRunning():\n            return\n        self.root_folder = folder\n        self._update_root_label()\n        paths = list(analyzer.scan_folder(\n            folder, self.recursive_chk.isChecked()))\n        self.settings[\"recursive\"] = self.recursive_chk.isChecked()\n        mover.save_settings(self.settings)\n        if len(paths) > analyzer.WARN_FILE_COUNT:\n            self.warn_label.setText(\n                self.t(\"warn_many_files\", n=len(paths)))\n            ans = QMessageBox.question(\n                self, self.t(\"group_candidate\"),\n                self.t(\"warn_many_files\", n=len(paths)))\n            if ans != QMessageBox.StandardButton.Yes:\n                return\n        else:\n            self.warn_label.setText(\"\")\n        self.progress.setMaximum(max(1, len(paths)))\n        self.progress.setValue(0)\n        self.progress.show()\n        self.cancel_btn.show()\n        self.open_btn.setEnabled(False)\n        self.status_label.setText(self.t(\"analyzing\"))\n        self.worker = ScanWorker(paths)\n        self.worker.progress.connect(self._scan_progress)\n        self.worker.finished_scan.connect(self._scan_done)\n        self.worker.start()\n\n    def _scan_progress(self, done, total):\n        self.progress.setValue(done)\n        self.status_label.setText(\n            self.t(\"analyzing_count\", done=done, total=total))\n\n    def _cancel_scan(self):\n        if self.worker:\n            self.worker.cancel()\n\n    def _scan_done(self, infos):\n        self.progress.hide()\n        self.cancel_btn.hide()\n        self.open_btn.setEnabled(True)\n        self.infos = infos\n        self.selected_gid = None\n        self.selected_path = None\n        self.merge_source_gid = None\n        self._regroup()\n        self.status_label.setText(self.t(\n            \"status_done\", files=len(infos), groups=len(self.groups)))\n        if self.groups:\n            self._show_group(self.groups[0].gid)\n\n    def _regroup(self):\n        self.groups, self.singles = analyzer.build_groups(\n            self.infos, self.rejected_pairs, self.forced_merges)\n        self._rebuild_rail()\n        self._rebuild_singles_errors()\n\n    # ------------------------------------------------------------------\n    # Rail\n    # ------------------------------------------------------------------\n    @staticmethod\n    def _clear_layout(lay):\n        while lay.count():\n            item = lay.takeAt(0)\n            w = item.widget()\n            if w is not None:\n                # hide + unparent immediately: a deleteLater-only\n                # widget can keep painting at its stale geometry\n                # until the event loop gets to it\n                w.hide()\n                w.setParent(None)\n                w.deleteLater()\n\n    def _rebuild_rail(self):\n        self._clear_layout(self.rail_lay)\n        query = self.search_edit.text().strip().lower()\n        shown = 0\n        for g in self.groups:\n            title = g.title()\n            if query and query not in title.lower() and not any(\n                    query in m.name.lower() for m in g.members):\n                continue\n            shown += 1\n            card = CaseCard(g.gid)\n            card.count.setText(str(len(g.members)))\n            card.title.setText(title)\n            card.title.setToolTip(title)\n            if g.kind == \"exact\":\n                card.badge.setText(self.t(\"group_exact\"))\n                card.badge.setObjectName(\"kindExact\")\n            else:\n                card.badge.setText(self.t(\"group_candidate\"))\n                card.badge.setObjectName(\"kindCandidate\")\n            card.badge.style().unpolish(card.badge)\n            card.badge.style().polish(card.badge)\n            card.meta.setText(self.t(\"group_files\", n=len(g.members)))\n            card.set_selected(g.gid == self.selected_gid)\n            card.clicked.connect(self._card_clicked)\n            self.rail_lay.addWidget(card)\n        if self.groups and not shown:\n            lbl = QLabel(self.t(\"no_groups_found\"))\n            lbl.setObjectName(\"railMeta\")\n            lbl.setWordWrap(True)\n            self.rail_lay.addWidget(lbl)\n        self.rail_lay.addStretch(1)\n\n    def _rebuild_singles_errors(self):\n        self.singles_list.clear()\n        for info in self.singles:\n            self.singles_list.addItem(QListWidgetItem(info.name))\n        self.errors_list.clear()\n        for info in self.infos:\n            if info.status == \"error\":\n                reason = self.t(\n                    \"err_\" + (info.error_reason or \"unreadable\"))\n                self.errors_list.addItem(\n                    QListWidgetItem(f\"{info.name} — {reason}\"))\n\n    def _card_clicked(self, gid):\n        if self.merge_source_gid is not None and \\\n                gid != self.merge_source_gid:\n            src = self._group_by_id(self.merge_source_gid)\n            dst = self._group_by_id(gid)\n            if src and dst and src.members and dst.members:\n                self.forced_merges.add(frozenset(\n                    (src.members[0].path, dst.members[0].path)))\n            self.merge_source_gid = None\n            self._regroup()\n            self.status_label.setText(self.t(\"merge_done\"))\n            self._show_group(gid)\n            return\n        self.merge_source_gid = None\n        self._show_group(gid)\n\n    def _group_by_id(self, gid):\n        for g in self.groups:\n            if g.gid == gid:\n                return g\n        return None\n\n    def _toggle_merge_mode(self):\n        if self.selected_gid is None:\n            return\n        if self.merge_source_gid == self.selected_gid:\n            self.merge_source_gid = None\n            self.status_label.setText(self.t(\"status_ready\"))\n        else:\n            self.merge_source_gid = self.selected_gid\n            self.status_label.setText(self.t(\"merge_mode_on\"))\n\n    # ------------------------------------------------------------------\n    # Group detail + genealogy\n    # ------------------------------------------------------------------\n    def _current_group(self):\n        return self._group_by_id(self.selected_gid)\n\n    def _caption_for(self, group, idx):\n        members = group.members\n        if idx == 0:\n            return self.t(\"first_version\")\n        prev, cur = members[idx - 1], members[idx]\n        s = analyzer.summarize_pair(prev, cur)\n        if s[\"kind\"] == \"text\":\n            return self.t(\"chg_lines\", a=s[\"added\"], d=s[\"deleted\"])\n        if s[\"kind\"] == \"cells\":\n            n = s[\"changed_cells\"] + s[\"added_cells\"] + s[\"removed_cells\"]\n            return self.t(\"chg_cells\", n=n)\n        return \"\"\n\n    def _show_group(self, gid):\n        group = self._group_by_id(gid)\n        if group is None:\n            return\n        self.selected_gid = gid\n        verdict = analyzer.rank_latest(group)\n        self._verdict = verdict\n        self.group_title.setText(group.title())\n        if group.kind == \"exact\":\n            self.kind_badge.setText(self.t(\"group_exact\"))\n            self.kind_badge.setObjectName(\"kindExact\")\n            self.sim_label.setText(\"\")\n        else:\n            self.kind_badge.setText(self.t(\"group_candidate\"))\n            self.kind_badge.setObjectName(\"kindCandidate\")\n            self.sim_label.setText(self.t(\n                \"similarity\", pct=round(group.similarity * 100)))\n        self.kind_badge.style().unpolish(self.kind_badge)\n        self.kind_badge.style().polish(self.kind_badge)\n        if verdict.branch:\n            self.branch_badge.setText(self.t(\"branch_warning\"))\n            self.branch_badge.show()\n        else:\n            self.branch_badge.hide()\n\n        # reasons text\n        lines = []\n        if verdict.candidate is not None:\n            lines.append(\n                f\"{self.t('latest_candidate')}: {verdict.candidate.name}\")\n            if group.manual_latest:\n                lines.append(self.t(\"manual_latest_badge\"))\n        for key, params in verdict.reasons:\n            lines.append(\"• \" + self.t(key, **params))\n        self.reasons_label.setText(\"\\n\".join(lines))\n\n        # genealogy nodes (chronological; members already sorted)\n        branch_path = verdict.branch_with.path if verdict.branch else None\n        cand_path = verdict.candidate.path if verdict.candidate else None\n        member_paths = [m.path for m in group.members]\n        if self.selected_path not in member_paths:\n            self.selected_path = cand_path or (\n                member_paths[-1] if member_paths else None)\n        nodes = []\n        for i, m in enumerate(group.members):\n            # short datetime under the node; the source of the\n            # datetime is spelled out in the reasons and the detail\n            # line, so the tree itself stays readable\n            dt_text = _fmt_dt(m)\n            nodes.append(NodeView(\n                path=m.path,\n                number=i + 1,\n                name=m.name,\n                dt_text=dt_text,\n                caption=self._caption_for(group, i),\n                is_latest=(m.path == cand_path),\n                is_manual=(m.path == group.manual_latest),\n                is_branch=(m.path == branch_path),\n                selected=(m.path == self.selected_path)))\n        self.canvas.set_data(\n            nodes, rtl=self.lang in RTL_LANGS,\n            branch_label=self.t(\"branch_from\") if verdict.branch else \"\")\n        self.gene_scroll.setMinimumHeight(\n            272 if verdict.branch else 172)\n        self.gene_scroll.verticalScrollBar().setValue(0)\n        self.gene_scroll.horizontalScrollBar().setValue(0)\n\n        # compare combos\n        self.from_combo.clear()\n        self.to_combo.clear()\n        for m in group.members:\n            self.from_combo.addItem(m.name, m.path)\n            self.to_combo.addItem(m.name, m.path)\n        if group.members:\n            self.from_combo.setCurrentIndex(0)\n            if cand_path:\n                self.to_combo.setCurrentIndex(\n                    [m.path for m in group.members].index(cand_path))\n            else:\n                self.to_combo.setCurrentIndex(len(group.members) - 1)\n        self._rebuild_rail()\n        self._update_node_detail()\n        self._show_diff()\n\n    def _member(self, path):\n        for info in self.infos:\n            if info.path == path:\n                return info\n        return None\n\n    def _node_clicked(self, path):\n        self.selected_path = path\n        group = self._current_group()\n        if group is not None:\n            self._show_group(group.gid)\n\n    def _update_node_detail(self):\n        info = self._member(self.selected_path) if self.selected_path \\\n            else None\n        if info is None:\n            self.node_detail.setText(self.t(\"detail_empty\"))\n            self.set_latest_btn.setEnabled(False)\n            self.remove_btn.setEnabled(False)\n            return\n        bits = [self.t(\"selected_version\", name=info.name),\n                self.t(\"version_dt\", dt=_fmt_dt(info),\n                       src=self.t(_src_key(info))),\n                f\"{info.size / 1024:.1f} KB\"]\n        if info.status == \"hash_only\":\n            bits.append(self.t(\"hash_only\"))\n        self.node_detail.setText(\"   \".join(bits))\n        self.set_latest_btn.setEnabled(True)\n        self.remove_btn.setEnabled(True)\n\n    def _set_latest(self):\n        group = self._current_group()\n        if group is None or not self.selected_path:\n            return\n        group.manual_latest = self.selected_path\n        self._show_group(group.gid)\n\n    def _remove_selected(self):\n        group = self._current_group()\n        if group is None or not self.selected_path:\n            return\n        target = self.selected_path\n        for m in group.members:\n            if m.path != target:\n                self.rejected_pairs.add(frozenset((target, m.path)))\n        if group.manual_latest == target:\n            group.manual_latest = \"\"\n        self.selected_path = None\n        keep = group.gid\n        self._regroup()\n        self.status_label.setText(self.t(\"removed_done\"))\n        g2 = self._group_by_id(keep)\n        if g2 is not None:\n            self._show_group(keep)\n        elif self.groups:\n            self._show_group(self.groups[0].gid)\n\n    # ------------------------------------------------------------------\n    # Spread diff\n    # ------------------------------------------------------------------\n    def _combo_path(self, combo):\n        return combo.currentData()\n\n    def _show_diff(self):\n        group = self._current_group()\n        if group is None:\n            return\n        a_path = self._combo_path(self.from_combo)\n        b_path = self._combo_path(self.to_combo)\n        a = self._member(a_path) if a_path else None\n        b = self._member(b_path) if b_path else None\n        self.spread.setRowCount(0)\n        if a is None or b is None:\n            self.diff_summary.setText(\"\")\n            return\n        self.spread_old_head.setText(f\"{self.t('spread_old')}: {a.name}\")\n        self.spread_new_head.setText(f\"{self.t('spread_new')}: {b.name}\")\n        d = analyzer.diff_infos(a, b)\n        if d.kind == \"cells\":\n            self.spread.setColumnCount(4)\n            self.spread.setHorizontalHeaderLabels([\n                self.t(\"col_sheet\"), self.t(\"col_cell\"),\n                self.t(\"col_before\"), self.t(\"col_after\")])\n            self.spread.horizontalHeader().setVisible(True)\n            self.diff_summary.setText(\"  \".join([\n                self.t(\"diff_cells_changed\", n=len(d.changed_cells)),\n                self.t(\"diff_cells_added\", n=d.added_cells),\n                self.t(\"diff_cells_removed\", n=d.removed_cells)]))\n            rows = d.changed_cells[:400]\n            self.spread.setRowCount(len(rows))\n            for r, (sheet, coord, old, new) in enumerate(rows):\n                for c, val in enumerate((sheet, coord, old, new)):\n                    item = QTableWidgetItem(val)\n                    if c == 2 and old:\n                        item.setBackground(QColor(theme.DEL_BG))\n                    if c == 3 and new:\n                        item.setBackground(QColor(theme.ADD_BG))\n                    self.spread.setItem(r, c, item)\n            self.spread.resizeColumnsToContents()\n            self.spread.horizontalHeader().setStretchLastSection(True)\n            return\n        self.spread.setColumnCount(2)\n        self.spread.horizontalHeader().setVisible(False)\n        if d.kind == \"none\":\n            self.diff_summary.setText(self.t(\"diff_none\"))\n            return\n        self.diff_summary.setText(\"  \".join([\n            self.t(\"diff_added\", n=d.added),\n            self.t(\"diff_deleted\", n=d.deleted)]))\n        rows = self._spread_rows(a, b)\n        self.spread.setRowCount(len(rows))\n        for r, (left, right, kind) in enumerate(rows):\n            li = QTableWidgetItem(left)\n            ri = QTableWidgetItem(right)\n            if kind == \"del\":\n                li.setBackground(QColor(theme.DEL_BG))\n            elif kind == \"add\":\n                ri.setBackground(QColor(theme.ADD_BG))\n            elif kind == \"rep\":\n                li.setBackground(QColor(theme.DEL_BG))\n                ri.setBackground(QColor(theme.ADD_BG))\n            elif kind == \"gap\":\n                li.setForeground(QColor(theme.SUBINK))\n                ri.setForeground(QColor(theme.SUBINK))\n            self.spread.setItem(r, 0, li)\n            self.spread.setItem(r, 1, ri)\n        from PySide6.QtWidgets import QHeaderView\n        hdr = self.spread.horizontalHeader()\n        hdr.setSectionResizeMode(0, QHeaderView.ResizeMode.Stretch)\n        hdr.setSectionResizeMode(1, QHeaderView.ResizeMode.Stretch)\n\n    @staticmethod\n    def _spread_rows(a: FileInfo, b: FileInfo, context=2, cap=500):\n        \"\"\"Aligned (left, right, kind) rows: changed lines face each\n        other across the spread; equal lines appear only as short\n        context around the changes.\"\"\"\n        import difflib\n        sm = difflib.SequenceMatcher(a=a.lines, b=b.lines,\n                                     autojunk=False)\n        rows = []\n        for tag, i1, i2, j1, j2 in sm.get_opcodes():\n            if tag == \"equal\":\n                seg_a = a.lines[i1:i2]\n                if len(seg_a) <= context * 2 + 1:\n                    for line in seg_a:\n                        rows.append((line, line, \"ctx\"))\n                else:\n                    for line in seg_a[:context]:\n                        rows.append((line, line, \"ctx\"))\n                    rows.append((\"…\", \"…\", \"gap\"))\n                    for line in seg_a[-context:]:\n                        rows.append((line, line, \"ctx\"))\n                continue\n            dels = a.lines[i1:i2]\n            adds = b.lines[j1:j2]\n            for k in range(max(len(dels), len(adds))):\n                left = dels[k] if k < len(dels) else \"\"\n                right = adds[k] if k < len(adds) else \"\"\n                kind = \"rep\" if (k < len(dels) and k < len(adds)) else \\\n                    (\"del\" if k < len(dels) else \"add\")\n                rows.append((left, right, kind))\n            if len(rows) >= cap:\n                break\n        return rows[:cap]\n\n    # ------------------------------------------------------------------\n    # Archive moves\n    # ------------------------------------------------------------------\n    def open_archive(self):\n        group = self._current_group()\n        if group is None:\n            return\n        verdict = self._verdict if hasattr(self, \"_verdict\") else \\\n            analyzer.rank_latest(group)\n        keep_path = None\n        if verdict.candidate is not None:\n            keep_path = verdict.candidate.path\n        members = []\n        for m in group.members:\n            if keep_path is not None:\n                members.append((m, m.path != keep_path))\n            else:\n                # branch: nothing pre-checked; the human decides all\n                members.append((m, False))\n        dlg = ArchiveDialog(self, self.lang, members,\n                            self.settings.get(\"archive_dir\", \"\"))\n        dlg.exec_btn.clicked.connect(lambda: self._exec_archive(dlg))\n        dlg.undo_btn.clicked.connect(lambda: self._undo_archive(dlg))\n        dlg.exec()\n\n    def _exec_archive(self, dlg):\n        archive_dir = dlg.dir_edit.text().strip()\n        if not archive_dir:\n            QMessageBox.warning(self, self.t(\"move_title\"),\n                                self.t(\"no_archive\"))\n            return\n        paths = dlg.checked_paths()\n        if not paths:\n            QMessageBox.warning(self, self.t(\"move_title\"),\n                                self.t(\"nothing_checked\"))\n            return\n        ans = QMessageBox.question(\n            self, self.t(\"confirm_move_title\"),\n            self.t(\"confirm_move_body\", n=len(paths)))\n        if ans != QMessageBox.StandardButton.Yes:\n            return\n        self.settings[\"archive_dir\"] = archive_dir\n        mover.save_settings(self.settings)\n        done, errors = mover.execute_moves(\n            [(p, archive_dir) for p in paths])\n        dlg.accept()\n        if errors:\n            QMessageBox.warning(\n                self, self.t(\"move_title\"),\n                self.t(\"move_errors\", n=len(errors)))\n        self.status_label.setText(self.t(\"move_done\", n=len(done)))\n        if self.root_folder:\n            self.start_scan(self.root_folder)\n\n    def _undo_archive(self, dlg):\n        done, errors = mover.undo_last_batch()\n        if not done and not errors:\n            QMessageBox.information(self, self.t(\"undo_move\"),\n                                    self.t(\"nothing_to_undo\"))\n            return\n        dlg.accept()\n        if errors:\n            QMessageBox.warning(\n                self, self.t(\"move_title\"),\n                self.t(\"move_errors\", n=len(errors)))\n        self.status_label.setText(self.t(\"undo_done\", n=len(done)))\n        if self.root_folder:\n            self.start_scan(self.root_folder)\n\n\n# ----------------------------------------------------------------------\n# Entry point (with the Wine-only font workaround used by the family)\n# ----------------------------------------------------------------------\n\ndef _under_wine():\n    \"\"\"True only under Wine (ntdll exports wine_get_version there).\n    Used solely for Wine-only stability workarounds; real Windows is\n    completely unaffected.\"\"\"\n    if sys.platform != \"win32\":\n        return False\n    try:\n        return hasattr(ctypes.WinDLL(\"ntdll\"), \"wine_get_version\")\n    except Exception:\n        return False\n\n\ndef main():\n    args = list(sys.argv)\n    if _under_wine():\n        # Wine-only: Qt's native (DirectWrite) font engine can fault\n        # in Wine 9.0 during font fallback; FreeType avoids it.\n        args += [\"-platform\", \"windows:fontengine=freetype\"]\n    app = QApplication(args)\n    try:\n        import os as _os, sys as _sys\n        from PySide6.QtGui import QIcon as _QIcon\n        _ib = getattr(_sys, \"_MEIPASS\", None) or _os.path.dirname(_os.path.abspath(__file__))\n        _ip = _os.path.join(_ib, \"assets\", \"icon.png\")\n        if _os.path.exists(_ip):\n            app.setWindowIcon(_QIcon(_ip))\n    except Exception:\n        pass\n    app.setApplicationName(APP_ID)\n    fonts.register_fonts()\n    theme.apply_theme(app)\n    # Set the UI font BEFORE any widget exists: widgets resolve\n    # their font families when they are first polished, and on some\n    # platforms a later application-font change does not re-resolve\n    # them (the frozen build under Wine kept the system default).\n    _initial_lang = mover.load_settings().get(\"lang\", \"ja\")\n    if _initial_lang not in dict(LANGS):\n        _initial_lang = \"ja\"\n    fonts.apply_language_font(app, _initial_lang)\n    if _under_wine():\n        try:\n            # The bundled fonts are registered above; only if they\n            # somehow failed to load, fall back to a plain system\n            # font (Wine's fallback chain was the crash risk, and\n            # naming one concrete family avoids it).\n            from PySide6.QtGui import QFont, QFontDatabase\n            families = set(QFontDatabase.families())\n            if families and \"Inter\" not in families \\\n                    and \"Noto Sans JP\" not in families:\n                fallback = \"Tahoma\" if \"Tahoma\" in families \\\n                    else next(iter(families))\n                app.setFont(QFont(fallback, 10))\n        except Exception:\n            pass\n    win = MainWindow()\n    win.show()\n    return app.exec()\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"}, {"p": "appinfo.py", "s": 603, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Single source of truth for the app's names.\n\nRename the app by editing ONLY this file: every display string, file\nname, data folder and bundle name derives from the values below.\n\"\"\"\n\nAPP_ID = \"VersionDetective\"\nAPP_NAME_EN = \"VersionDetective\"\nAPP_NAME_JA = \"バージョン探偵\"\n\n# File-name base used for the EXE, ZIPs, launcher scripts and .app bundle.\nFILE_BASE = \"VersionDetective\"\n\nVERSION = \"1.0.0\"\n\n\ndef display_name(lang: str) -> str:\n    \"\"\"User-visible app name in the given UI language.\"\"\"\n    if lang == \"ja\":\n        return APP_NAME_JA\n    return APP_NAME_EN\n"}, {"p": "assets/check-off-dis.png", "s": 725, "b": 1}, {"p": "assets/check-off-hover.png", "s": 752, "b": 1}, {"p": "assets/check-off.png", "s": 739, "b": 1}, {"p": "assets/check-on-dis.png", "s": 986, "b": 1}, {"p": "assets/check-on-hover.png", "s": 1085, "b": 1}, {"p": "assets/check-on.png", "s": 1061, "b": 1}, {"p": "assets/chevron-down-indigo.png", "s": 317, "b": 1}, {"p": "assets/chevron-down.png", "s": 355, "b": 1}, {"p": "assets/icon.icns", "s": 118425, "b": 1}, {"p": "assets/icon.ico", "s": 24275, "b": 1}, {"p": "assets/icon.png", "s": 44384, "b": 1}, {"p": "assets/radio-off-dis.png", "s": 1013, "b": 1}, {"p": "assets/radio-off-hover.png", "s": 1134, "b": 1}, {"p": "assets/radio-off.png", "s": 1057, "b": 1}, {"p": "assets/radio-on-dis.png", "s": 1251, "b": 1}, {"p": "assets/radio-on-hover.png", "s": 1367, "b": 1}, {"p": "assets/radio-on.png", "s": 1332, "b": 1}, {"p": "fonts.py", "s": 3131, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Bundled fonts: Inter (Latin / digits) + Noto Sans JP (Japanese).\n\nThe app ships its own fonts so the UI looks the same (and modern) on\nevery machine instead of depending on whatever the OS happens to\noffer.  Both fonts are SIL OFL 1.1; see fonts/FONTS.txt.\n\nRegistration happens once at startup via QFontDatabase.  The UI font\nis then set per language: Qt walks the family list per glyph, so\nLatin and digits render in Inter while Japanese falls through to\nNoto Sans JP in the same widget.  Arabic keeps Inter for Latin and\nuses a Naskh-style system fallback for Arabic script (the task spec\nallows a system fallback there); Chinese / Korean use the bundled\nfonts first, then the platform's own CJK fonts.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\n\nfrom PySide6.QtGui import QFont, QFontDatabase\n\n_registered = False\n\n# Base UI size: 13.5 px equivalents.  QSS rules refine per-widget\n# sizes on top of this; the point size only matters where QSS does\n# not set one.\nBASE_POINT_SIZE = 10.5\n\n_INTER = \"Inter\"\n_NOTO_JP = \"Noto Sans JP\"\n\n# Family stacks per UI language, most-preferred first.  Qt tries each\n# family in order until it finds the glyph it needs.\nSTACKS = {\n    \"ja\": [_INTER, _NOTO_JP, \"Yu Gothic UI\", \"Hiragino Sans\",\n           \"Noto Sans CJK JP\"],\n    \"zh\": [_INTER, _NOTO_JP, \"Microsoft YaHei UI\", \"PingFang SC\",\n           \"Noto Sans CJK SC\"],\n    \"ko\": [_INTER, _NOTO_JP, \"Malgun Gothic\", \"Apple SD Gothic Neo\",\n           \"Noto Sans CJK KR\"],\n    \"ar\": [_INTER, \"Noto Naskh Arabic\", \"Amiri\", \"Segoe UI\", \"Tahoma\"],\n}\nGENERIC_STACK = [_INTER, _NOTO_JP, \"Segoe UI\", \"Hiragino Sans\",\n                 \"Noto Sans CJK JP\", \"Noto Sans CJK SC\",\n                 \"Noto Sans CJK KR\", \"DejaVu Sans\"]\n\n\ndef base_dir() -> str:\n    \"\"\"Directory that holds fonts/ and assets/ (source tree, or the\n    PyInstaller _internal folder when frozen).\"\"\"\n    if getattr(sys, \"frozen\", False):\n        return getattr(sys, \"_MEIPASS\",\n                       os.path.dirname(os.path.abspath(sys.executable)))\n    return os.path.dirname(os.path.abspath(__file__))\n\n\ndef fonts_dir() -> str:\n    return os.path.join(base_dir(), \"fonts\")\n\n\ndef assets_dir() -> str:\n    return os.path.join(base_dir(), \"assets\")\n\n\ndef register_fonts() -> None:\n    \"\"\"Load every bundled font file into Qt (idempotent).\"\"\"\n    global _registered\n    if _registered:\n        return\n    _registered = True\n    folder = fonts_dir()\n    if not os.path.isdir(folder):\n        return\n    for name in sorted(os.listdir(folder)):\n        if name.lower().endswith((\".ttf\", \".otf\", \".ttc\")):\n            # A failed load is not fatal: Qt falls back to system\n            # fonts, which is exactly the old behaviour.\n            QFontDatabase.addApplicationFont(os.path.join(folder, name))\n\n\ndef stack_for(lang: str) -> list:\n    return list(STACKS.get(lang, GENERIC_STACK))\n\n\ndef apply_language_font(app, lang: str) -> None:\n    \"\"\"Set the application font to the stack for `lang`.\"\"\"\n    register_fonts()\n    font = QFont()\n    font.setFamilies(stack_for(lang))\n    font.setPointSizeF(BASE_POINT_SIZE)\n    app.setFont(font)\n"}, {"p": "fonts/FONTS.txt", "s": 889, "l": "plaintext", "c": "Bundled fonts — attribution and licenses\n=========================================\n\nThis application bundles the following open fonts.  Both are licensed\nunder the SIL Open Font License, Version 1.1 (OFL-1.1); the full\nlicense text for each font is included in this folder.\n\n1. Inter (Regular / Medium / SemiBold / Bold)\n   Copyright (c) 2016 The Inter Project Authors\n   (https://github.com/rsms/inter)\n   Source: official Inter release v4.1 (rsms/inter on GitHub)\n   License file: OFL-Inter.txt\n\n2. Noto Sans JP (Regular / Medium / Bold)\n   Copyright 2014-2021 Adobe (http://www.adobe.com/), with Reserved\n
