 the change from the previous\nversion.  The latest candidate is a larger node with a double ring.\nWhen the analyser flags a possible branch, the branch partner is drawn\non a forked lower line instead of being forced onto the main line.\n\nPure QPainter work: no text glyphs are used as icons, so rendering\nnever depends on an emoji font.  In RTL locales the caller sets\nrtl=True and the tree is mirrored (newest on the left).\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nfrom PySide6.QtCore import QPointF, QRectF, Qt, Signal\nfrom PySide6.QtGui import QColor, QFont, QFontMetrics, QPainter, QPainterPath, QPen\nfrom PySide6.QtWidgets import QWidget\n\nimport theme\n\n_SPACING = 184\n_MARGIN = 64\n_MAIN_Y = 58\n_BRANCH_Y = 176\n_R = 17\n_R_LATEST = 25\n\n\n@dataclass\nclass NodeView:\n    path: str\n    number: int            # 1-based version number (chronological)\n    name: str              # file name\n    dt_text: str           # formatted content-changed datetime + source\n    caption: str           # change size vs previous version / first\n    is_latest: bool = False\n    is_manual: bool = False\n    is_branch: bool = False\n    selected: bool = False\n\n\nclass GenealogyCanvas(QWidget):\n    nodeClicked = Signal(str)\n\n    def __init__(self, parent=None):\n        super().__init__(parent)\n        self._nodes: list[NodeView] = []\n        self._rtl = False\n        self._empty_text = \"\"\n        self._branch_label = \"\"\n        self._hit: list[tuple[QRectF, str]] = []\n        self.setMinimumHeight(150)\n        self.setMouseTracking(True)\n\n    # -- data ---------------------------------------------------------\n    def set_data(self, nodes, rtl=False, branch_label=\"\",\n                 empty_text=\"\"):\n        self._nodes = list(nodes)\n        self._rtl = rtl\n        self._branch_label = branch_label\n        self._empty_text = empty_text\n        has_branch = any(n.is_branch for n in self._nodes)\n        self.setMinimumHeight(258 if has_branch else 156)\n        n = max(1, len(self._nodes))\n        self.setMinimumWidth(int(_MARGIN * 2 + _SPACING * (n - 1) + 40))\n        self.resize(self.minimumSize())\n        self.update()\n\n    # -- geometry -----------------------------------------------------\n    def _x(self, idx: int) -> float:\n        x = _MARGIN + _SPACING * idx\n        if self._rtl:\n            total = _MARGIN * 2 + _SPACING * max(0, len(self._nodes) - 1)\n            x = total - x\n        return x\n\n    def _pos(self, idx: int, node: NodeView) -> QPointF:\n        y = _BRANCH_Y if node.is_branch else _MAIN_Y\n        return QPointF(self._x(idx), y)\n\n    # -- painting -----------------------------------------------------\n    def paintEvent(self, event):\n        p = QPainter(self)\n        p.setRenderHint(QPainter.RenderHint.Antialiasing)\n        p.setRenderHint(QPainter.RenderHint.TextAntialiasing)\n        if not self._nodes:\n            p.setPen(QColor(theme.SUBINK))\n            f = QFont(self.font())\n            f.setPointSize(11)\n            p.setFont(f)\n            box = self.rect().adjusted(24, 12, -24, -12)\n            p.drawText(box,\n                       Qt.AlignmentFlag.AlignCenter |\n                       Qt.TextFlag.TextWordWrap,\n                       self._empty_text)\n            p.end()\n            return\n\n        indigo = QColor(theme.INDIGO)\n        deep = QColor(theme.INDIGO_DEEP)\n        line = QColor(theme.LINE)\n        amber = QColor(theme.AMBER)\n\n        main_idx = [i for i, n in enumerate(self._nodes)\n                    if not n.is_branch]\n        # connectors on the main line\n        pen = QPen(line)\n        pen.setWidthF(2.5)\n        p.setPen(pen)\n        for a, b in zip(main_idx, main_idx[1:]):\n            pa = self._pos(a, self._nodes[a])\n            pb = self._pos(b, self._nodes[b])\n            p.drawLine(pa, pb)\n        # fork connectors to branch nodes\n        for i, node in enumerate(self._nodes):\n            if not node.is_branch:\n                continue\n            prev_main = max([j for j in main_idx if j < i],\n                            default=main_idx[0] if main_idx else i)\n            start = self._pos(prev_main, self._nodes[prev_main])\n            end = self._pos(i, node)\n            path = QPainterPath(start)\n            midx = (start.x() + end.x()) / 2\n            path.cubicTo(QPointF(midx, start.y()),\n                         QPointF(midx, end.y()), end)\n            p.setPen(QPen(amber, 2.5, Qt.PenStyle.DashLine))\n            p.drawPath(path)\n            if self._branch_label:\n                p.setPen(amber)\n                f = QFont(self.font())\n                f.setPointSize(9)\n                f.setBold(True)\n                p.setFont(f)\n                lx = (start.x() + end.x()) / 2 - 14\n                p.drawText(QPointF(lx, end.y() - 40),\n                           self._branch_label)\n\n        self._hit = []\n        name_font = QFont(self.font())\n        name_font.setPointSize(10)\n        name_font.setBold(True)\n        cap_font = QFont(self.font())\n        cap_font.setPointSize(9)\n        num_font = QFont(self.font())\n        num_font.setBold(True)\n\n        for i, node in enumerate(self._nodes):\n            c = self._pos(i, node)\n            r = _R_LATEST if node.is_latest else _R\n            if node.is_branch:\n                ring = amber\n            elif node.is_latest:\n                ring = indigo\n            else:\n                ring = deep\n            if node.is_latest:\n                # double ring\n                p.setPen(QPen(indigo, 2.0))\n                p.setBrush(Qt.BrushStyle.NoBrush)\n                p.drawEllipse(c, r + 6, r + 6)\n            p.setPen(QPen(ring, 3.0 if node.selected else 2.2))\n            fill = QColor(theme.INDIGO_SOFT if node.is_latest\n                          else theme.PANEL)\n            if node.selected:\n                fill = QColor(theme.INDIGO_SOFT)\n            p.setBrush(fill)\n            p.drawEllipse(c, r, r)\n            # version number inside the node\n            num_font.setPointSize(13 if node.is_latest else 11)\n            p.setFont(num_font)\n            p.setPen(deep if not node.is_latest else indigo)\n            p.drawText(QRectF(c.x() - r, c.y() - r, 2 * r, 2 * r),\n                       Qt.AlignmentFlag.AlignCenter, str(node.number))\n            self._hit.append(\n                (QRectF(c.x() - r - 8, c.y() - r - 8,\n                        2 * r + 16, 2 * r + 16), node.path))\n            # file name under the node\n            p.setFont(name_font)\n            p.setPen(QColor(theme.INK))\n            fm = QFontMetrics(name_font)\n            elided = fm.elidedText(node.name,\n                                   Qt.TextElideMode.ElideMiddle, 168)\n            w = fm.horizontalAdvance(elided)\n            p.drawText(QPointF(c.x() - w / 2, c.y() + r + 20), elided)\n            # datetime + change caption\n            p.setFont(cap_font)\n            p.setPen(QColor(theme.SUBINK))\n            for k, txt in enumerate((node.dt_text, node.caption)):\n                if not txt:\n                    continue\n                fm2 = QFontMetrics(cap_font)\n                w2 = fm2.horizontalAdvance(txt)\n                p.drawText(QPointF(c.x() - w2 / 2,\n                                   c.y() + r + 36 + 13 * k), txt)\n        p.end()\n\n    # -- interaction ----------------------------------------------------\n    def mousePressEvent(self, event):\n        pos = event.position()\n        for rect, path in self._hit:\n            if rect.contains(pos):\n                self.nodeClicked.emit(path)\n                return\n        super().mousePressEvent(event)\n"}, {"p": "i18n.py", "s": 67752, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"UI strings in 13 languages.  Instant switching from the header\ncombo; the choice is persisted; Arabic switches the layout to RTL.\"\"\"\n\n \"branch_from\": \"분기\",\n        \"reasons_title\": \"최신 후보와 이유\",\n        \"spread_old\": \"이전 버전\",\n        \"spread_new\": \"새 버전\",\n        \"compare_from\": \"비교 원본\",\n        \"compare_to\": \"비교 대상\",\n        \"no_groups_found\": \"그룹을 찾을 수 없습니다\",\n        \"hash_only\": \"해시만\",\n        \"archive_button\": \"보관 제안\",\n        \"selected_version\": \"선택됨: {name}\",\n        \"genealogy_empty\": \"그룹을 선택하면 여기에 버전 계보가 표시됩니다\",\n        \"rail_groups\": \"그룹\",\n        \"analyzing_count\": \"분석 중... {done} / {total}\",\n        \"merge_mode_on\": \"옆 목록에서 합칠 그룹을 선택하세요\",\n        \"root_label\": \"폴더\",\n    },\n}\n\nfor _code, _extra in _EXTRA.items():\n    if _code in STRINGS:\n        STRINGS[_code].update(_extra)\n"}, {"p": "icons.py", "s": 3642, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Hand-drawn icons (QPainter pixmaps).  No emoji glyphs anywhere:\nicon rendering must never depend on a colour-emoji font fallback.\"\"\"\n\nfrom PySide6.QtCore import QPointF, QRectF, Qt\nfrom PySide6.QtGui import QColor, QIcon, QPainter, QPen, QPixmap\n\n_SIZE = 48\n_cache = {}\n\n\ndef _pen(color, width=3.0):\n    pen = QPen(QColor(color))\n    pen.setWidthF(width)\n    pen.setCapStyle(Qt.PenCapStyle.RoundCap)\n    pen.setJoinStyle(Qt.PenJoinStyle.RoundJoin)\n    return pen\n\n\ndef _folder(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawRoundedRect(QRectF(6, 16, 36, 22), 3, 3)\n    p.drawLine(QPointF(6, 20), QPointF(18, 20))\n    p.drawLine(QPointF(18, 20), QPointF(21, 12))\n    p.drawLine(QPointF(21, 12), QPointF(33, 12))\n    p.drawLine(QPointF(33, 12), QPointF(36, 20))\n\n\ndef _search(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawEllipse(QPointF(21, 21), 10, 10)\n    p.drawLine(QPointF(28.5, 28.5), QPointF(40, 40))\n\n\ndef _file(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawRoundedRect(QRectF(13, 6, 22, 36), 3, 3)\n    p.drawLine(QPointF(19, 17), QPointF(29, 17))\n    p.drawLine(QPointF(19, 24), QPointF(29, 24))\n    p.drawLine(QPointF(19, 31), QPointF(25, 31))\n\n\ndef _check(p, color):\n    p.setPen(_pen(color, 4.0))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawLine(QPointF(10, 25), QPointF(20, 35))\n    p.drawLine(QPointF(20, 35), QPointF(39, 13))\n\n\ndef _undo(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawArc(QRectF(10, 12, 28, 28), 40 * 16, 260 * 16)\n    p.drawLine(QPointF(10, 20), QPointF(10, 32))\n    p.drawLine(QPointF(10, 32), QPointF(21, 30))\n\n\ndef _diff(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawRoundedRect(QRectF(7, 8, 15, 32), 2.5, 2.5)\n    p.drawRoundedRect(QRectF(26, 8, 15, 32), 2.5, 2.5)\n    p.drawLine(QPointF(11, 18), QPointF(18, 18))\n    p.drawLine(QPointF(30, 30), QPointF(37, 30))\n    p.drawLine(QPointF(33.5, 26.5), QPointF(33.5, 33.5))\n\n\ndef _archive(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawRect(QRectF(7, 10, 34, 10))\n    p.drawRoundedRect(QRectF(10, 20, 28, 18), 2.5, 2.5)\n    p.drawLine(QPointF(20, 26), QPointF(28, 26))\n\n\ndef _branch(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawEllipse(QPointF(13, 11), 4.5, 4.5)\n    p.drawEllipse(QPointF(13, 37), 4.5, 4.5)\n    p.drawEllipse(QPointF(35, 24), 4.5, 4.5)\n    p.drawLine(QPointF(13, 15.5), QPointF(13, 32.5))\n    p.drawArc(QRectF(13, 11, 22, 26), 0, 90 * 16)\n    p.drawLine(QPointF(30.5, 24), QPointF(24, 24))\n\n\ndef _star(p, color):\n    p.setPen(_pen(color))\n    p.setBrush(QColor(color))\n    import math\n    pts = []\n    for i in range(10):\n        ang = -math.pi / 2 + i * math.pi / 5\n        r = 15 if i % 2 == 0 else 6.5\n        pts.append(QPointF(24 + r * math.cos(ang), 24 + r * math.sin(ang)))\n    from PySide6.QtGui import QPolygonF\n    p.drawPolygon(QPolygonF(pts))\n\n\n_DRAWERS = {\"folder\": _folder, \"search\": _search, \"file\": _file,\n            \"check\": _check, \"undo\": _undo, \"diff\": _diff,\n            \"archive\": _archive, \"branch\": _branch, \"star\": _star}\n\n\ndef icon(name: str, color: str = \"#4F46E5\") -> QIcon:\n    key = (name, color)\n    if key in _cache:\n        return _cache[key]\n    pm = QPixmap(_SIZE, _SIZE)\n    pm.fill(Qt.GlobalColor.transparent)\n    painter = QPainter(pm)\n    painter.setRenderHint(QPainter.RenderHint.Antialiasing)\n    _DRAWERS[name](painter, color)\n    painter.end()\n    ic = QIcon(pm)\n    _cache[key] = ic\n    return ic\n"}, {"p": "MakeApp-Mac.command", "s": 4594, "l": "bash", "c": "#!/bin/bash\n# VersionDetective - build a standalone macOS app (VersionDetective.app)\n#\n# How to use (this is the standard way to get the Mac app):\n#   1. Download the VersionDetective-Source.zip and extract it.\n#   2. Double-click this file:  MakeApp-Mac.command\n#      (First time only: macOS may block it because it is unsigned.\n#       Right-click the file -> \"Open\" -> \"Open\" to run it once.)\n#   3. When the build finishes, the app appears in the \"dist\" folder:\n#         dist/VersionDetective.app\n#   4. From then on, just double-click VersionDetective.app to use it.\n#      (The .app is also unsigned, so the first launch of the app\n#       itself needs the same right-click -> \"Open\" once.)\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== VersionDetective - build the macOS app ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Building the app needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + build tools -----------------------------------\nif [ ! -x \".venv-build/bin/python\" ]; then\n  echo \"Preparing the build environment (first run only)...\"\n  $PY -m venv .venv-build || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv-build/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv-build/bin/python -m pip install PySide6 pyinstaller || { echo \"Failed to install the build tools. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nHOST_ARCH=\"$(uname -m)\"\necho \"This Mac's chip: $HOST_ARCH\"\necho \"Building VersionDetective.app (this can take a few minutes)...\"\n\n# Try a universal2 build first (one app that runs on both Apple\n# Silicon and Intel Macs). The python.org Python and PySide6 are\n# universal2, so this normally succeeds. If this Mac's Python is\n# single-architecture, the universal build fails and we fall back to\n# a native build for this Mac's chip automatically.\nBUILT_ARCH=\"\"\nif .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name VersionDetective --icon assets/icon.icns --target-arch universal2 --add-data \"fonts:fonts\" --add-data \"assets:assets\" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtMultimediaWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtTest --exclude-module tkinter app.py; then\n  BUILT_ARCH=\"universal2 (Apple Silicon + Intel)\"\nelse\n  echo \"\"\n  echo \"The universal2 build did not work on this Mac, so the app\"\n  echo \"is being built for this Mac's chip only ($HOST_ARCH).\"\n  echo \"\"\n  rm -rf dist build VersionDetective.spec\n  if .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name VersionDetective --icon assets/icon.icns --add-data \"fonts:fonts\" --add-data \"assets:assets\" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtMultimediaWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtTest --exclude-module tkinter app.py; then\n    BUILT_ARCH=\"native ($HOST_ARCH only)\"\n  else\n    echo \"The build failed. See the messages above.\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"Done! Your app is here:\"\necho \"  $(pwd)/dist/VersionDetective.app\"\necho \"Architecture of the built app: $BUILT_ARCH\"\necho \"Supported systems: macOS 11 (Big Sur) or later.\"\necho \"\"\necho \"Double-click VersionDetective.app to use it.\"\necho \"First launch only: if macOS blocks it, right-click the app\"\necho \"and choose \\\"Open\\\" once (the app is unsigned).\"\necho \"\"\nread -r -p \"Press Enter to close this window.\"\n"}, {"p": "mover.py", "s": 4661, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Approved-only file moves to an archive folder, with undo.\n\nRules (semi-automatic principle):\n- Nothing moves unless the user approved that exact item.\n- Files are NEVER deleted and NEVER overwritten: a name clash in the\n  destination gets an automatic serial suffix \" (2)\", \" (3)\", ...\n- Every executed move is appended to a persistent JSON log in the app\n  data folder, so undo works even after an app restart.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\nimport shutil\nimport sys\nfrom datetime import datetime\n\nfrom appinfo import APP_ID\n\n\ndef data_dir() -> str:\n    if sys.platform == \"darwin\":\n        base = os.path.join(os.path.expanduser(\"~\"), \"Library\",\n                            \"Application Support\")\n    elif sys.platform == \"win32\":\n        base = os.environ.get(\"APPDATA\") or os.path.expanduser(\"~\")\n    else:\n        base = os.environ.get(\n            \"XDG_DATA_HOME\",\n            os.path.join(os.path.expanduser(\"~\"), \".local\", \"share\"))\n    path = os.path.join(base, APP_ID)\n    os.makedirs(path, exist_ok=True)\n    return path\n\n\ndef settings_path() -> str:\n    return os.path.join(data_dir(), \"settings.json\")\n\n\ndef log_path() -> str:\n    return os.path.join(data_dir(), \"move_log.json\")\n\n\ndef load_settings() -> dict:\n    try:\n        with open(settings_path(), encoding=\"utf-8\") as fh:\n            return json.load(fh)\n    except (OSError, ValueError):\n        return {}\n\n\ndef save_settings(settings: dict) -> None:\n    with open(settings_path(), \"w\", encoding=\"utf-8\") as fh:\n        json.dump(settings, fh, ensure_ascii=False, indent=1)\n\n\ndef load_log() -> list:\n    try:\n        with open(log_path(), encoding=\"utf-8\") as fh:\n            data = json.load(fh)\n        return data if isinstance(data, list) else []\n    except (OSError, ValueError):\n        return []\n\n\ndef _save_log(entries: list) -> None:\n    with open(log_path(), \"w\", encoding=\"utf-8\") as fh:\n        json.dump(entries, fh, ensure_ascii=False, indent=1)\n\n\ndef unique_destination(dst_dir: str, filename: str) -> str:\n    \"\"\"Collision-free destination path: appends ' (2)', ' (3)', ...\n    before the extension instead of overwriting.\"\"\"\n    candidate = os.path.join(dst_dir, filename)\n    if not os.path.exists(candidate):\n        return candidate\n    stem, ext = os.path.splitext(filename)\n    n = 2\n    while True:\n        candidate = os.path.join(dst_dir, f\"{stem} ({n}){ext}\")\n        if not os.path.exists(candidate):\n            return candidate\n        n += 1\n\n\ndef execute_moves(moves):\n    \"\"\"Execute approved moves: list of (src_path, dst_dir).\n\n    Returns (done, errors).  Successful moves are appended to the\n    persistent log at once, all sharing one batch id.\n    \"\"\"\n    entries = load_log()\n    batch = datetime.now().strftime(\"%Y%m%d%H%M%S%f\")\n    done, errors = [], []\n    for src, dst_dir in moves:\n        try:\n            os.makedirs(dst_dir, exist_ok=True)\n            dst = unique_destination(dst_dir, os.path.basename(src))\n            shutil.move(src, dst)\n            entry = {\"time\": datetime.now().isoformat(timespec=\"seconds\"),\n                     \"batch\": batch, \"src\": src, \"dst\": dst,\n                     \"undone\": False}\n            entries.append(entry)\n            done.append(entry)\n        except (OSError, shutil.Error) as exc:\n            errors.append((src, str(exc)))\n    if done:\n        _save_log(entries)\n    return done, errors\n\n\ndef undo_last_batch():\n    \"\"\"Reverse the newest not-yet-undone batch of moves.\n\n    Returns (done, errors).  If the original location is occupied\n    again, the returned file gets a serial suffix rather than\n    overwriting anything.\n    \"\"\"\n    entries = load_log()\n    live = [e for e in entries if not e.get(\"undone\")]\n    if not live:\n        return [], []\n    batch = live[-1].get(\"batch\")\n    targets = [e for e in live if e.get(\"batch\") == batch]\n    done, errors = [], []\n    for entry in reversed(targets):\n        src_now, back_to = entry[\"dst\"], entry[\"src\"]\n        try:\n            parent = os.path.dirname(back_to)\n            if parent:\n                os.makedirs(parent, exist_ok=True)\n            dst = back_to\n            if os.path.exists(dst) and os.path.abspath(dst) != \\\n                    os.path.abspath(src_now):\n                dst = unique_destination(parent or \".\",\n                                         os.path.basename(back_to))\n            shutil.move(src_now, dst)\n            entry[\"undone\"] = True\n            entry[\"undo_dst\"] = dst\n            done.append(entry)\n        except (OSError, shutil.Error) as exc:\n            errors.append((src_now, str(exc)))\n    _save_log(entries)\n    return done, errors\n"}, {"p": "README-SOURCE.txt", "s": 929, "l": "plaintext", "c": "VersionDetective - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of VersionDetective, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-VersionDetective.bat (or: python app.py)\n- Mac: Start-VersionDetective.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 8933, "l": "plaintext", "c": "バージョン探偵 / VersionDetective\n================================================\n\n「最終版」「最終版2」「提出用_修正」「本当の最終版」…。\n共有フォルダに似た名前の版が並んだとき、どれが本当の最新かを\nファイル名ではなく「中身」から探すための道具です。\n\n\n- アプリは「グループ化」「最新候補の提示」「保管移動の案」まで。\n確定と移動は、人が承認したときだけ行われます。\n- ファイルを削除する機能はありません。ファイルの中身を書き換える\nこともありません（読み取り専用の解析だけを行います）。\n- 似ているという理由だけで別物を「同じ文書」と確定させることは\nしません。候補には必ず類似度（％）と根拠を表示します。\n\n\n1. フォルダを画面にドラッグ＆ドロップするか、「フォルダを開く」\nから選んでください（サブフォルダを含めるか切り替えられます）。\n2. 左のレールに「事件ファイル」風のグループ一覧が出ます。\n- 中身が完全一致 … 中身がバイト単位で同じファイル同士\n- 版の候補 … 名前の幹と中身の類似から「同じ文書の版らしい」\nと判断した候補。類似度と根拠を必ず表示します\n3. グループを選ぶと、中央に「版の系譜図」が出ます。古い版から\n新しい版へ横一列に並び、最新の候補は大きな二重リングで\n示されます。別々に直された疑いがある版は、琥珀色の分岐線で\n描かれ、「どちらが最新か決められません」と正直に表示します。\n4. 系譜図の節（丸）をクリックすると版の詳細が出ます。\n「これを最新に指定」で人が最新を選び直せます。\n「グループから外す」で候補から外せます。レールで別のグループを\n選び「選んだグループと合体」で2グループを1つにできます。\n5. 下半分は差分の「見開き」です。比べたい2版を選んで「差分を表示」。\n文章は行単位、Excel/CSVはセル単位（シート・番地・変更前→変更後）\nで色分け表示されます。\n6. 「古い版の保管案」から、最新以外の版を保管フォルダへ移す案を\n確認できます。移動するのはチェックして承認した分だけです。\n同名のファイルがある場合は連番を付けて上書きを避けます。\n「移動を元に戻す」で直前の移動を取り消せます（再起動後も可）。\n\n\n1. 内容が変わった日時：Word/Excel/PowerPoint は文書内部の\nメタデータ（docProps/core.xml の modified）、PDF は ModDate を\n優先します。取れない場合だけファイルの更新日時を使い、\nどちらの日時を使ったかを画面に明示します。\n※ ファイルの更新日時はコピーやダウンロードで変わってしまう\nため、内部の日時を優先する仕組みです。\n2. 差分の向き：他の版にない内容を持つ版を新しい側とみます。\n3. 変更の大きさ。\n2つの版が互いに相手にない内容を持つ場合は「分岐の可能性」と\n警告し、単独の最新を断定しません。\n\n\n- 中身を読める形式：.docx（段落）、.xlsx（セル値）、.pptx（テキスト）、\n.pdf（テキスト）、.txt /.md、.csv（セル）\n- それ以外の形式は、ハッシュと基本情報だけで扱います\n（完全一致の判定のみ可能です）。\n- 100MB を超えるファイルは中身を読まず、ハッシュのみで扱います。\n- 読み取れないファイルや暗号化されたファイルは、理由と一緒に\n画面の一覧に残ります（黙って捨てることはしません）。\n- 2,000ファイルを超えるフォルダでは先に警告を出します。\n\n\n- PDF はテキストが取り出せる場合のみ中身を比べられます。\n画像だけのスキャン PDF は比較できません。\n-.doc /.xls など旧形式（バイナリ形式）は中身を読めません。\n- 系譜図の並び順は「内容が変わった日時」の順です。両方の版に\n内部日時がない場合、順序はファイル更新日時に依存します。\n- 類似度は候補提示のためだけの目安です。最終判断は人が行って\nください。\n- このアプリは Windows / Mac 両対応ですが、開発環境での検証のみで、\n実機の Windows / Mac での動作確認はまだ行われていません。\n\n\n- Windows（EXE版）：VersionDetective-Windows.zip を展開し、\nフォルダ内の VersionDetective.exe をダブルクリック。\n- Windows（ソース版）：Python 3 と PySide6 が必要です。\nStart-VersionDetective.bat をダブルクリック（初回だけ必要な\nライブラリを自動で入れます）。\n- Mac（ソース版）：Start-VersionDetective.command をダブルクリック。\nアプリ化したい場合は MakeApp-Mac.command を実行すると\ndist/VersionDetective.app が作られます（universal2 を試し、\nだめならこの Mac のチップ専用で自動ビルドします）。\n未署名のため、初回は右クリック→「開く」が必要な場合があります。\n対応は macOS 11 以降です。\n\n【Mac版パッケージについて（正直な注記）】\n配布物の VersionDetective-Mac.zip は、完成した Mac バイナリでは\nありません。Mac の実行形式は .exe ではなく .app で、開発環境\n（Linux）では Mac 用バイナリを直接作ることができないため、\nMac.zip の中身はソース一式＋生成スクリプトです。お使いの Mac で\nMakeApp-Mac.command を一度実行すると、その Mac 上で\nVersionDetective.app が生成されます。Mac 実機での動作は未検証です。\n\n【同梱フォントについて】\n画面の文字は、アプリに同梱したフォント（欧文・数字は Inter、\n日本語は Noto Sans JP）で表示します。どちらも SIL Open Font\nLicense 1.1 のオープンソースフォントで、ライセンス全文と帰属は\nfonts フォルダ内の FONTS.txt / OFL-Inter.txt /\nOFL-NotoSansJP.txt に同梱しています。\n\n\n設定と言語の選択、移動ログは次の場所に保存されます。\n- Windows： %APPDATA%\\VersionDetective\n- Mac： ~/Library/Application Support/VersionDetective\n通信は一切行いません（完全オフライン動作）。\n\n------------------------------------------------\nEnglish summary\n------------------------------------------------\nVersionDetective finds the real latest version among\nlook-alike files (\"final\", \"final 2\", \"final_revised\", \"real final\")\nby reading their CONTENT, not their names.\n\n- The app only groups files, proposes the latest candidate with\nvisible reasons, and drafts an archive plan. A human approves\nevery move. Nothing is ever deleted; file contents are never\nmodified (read-only analysis).\n- Groups: (1) identical content, (2) version candidates shown with\na similarity % and the evidence. You can remove members or merge\ngroups by hand.\n- The main view is a version genealogy: versions on a timeline,\nthe latest candidate enlarged with a double ring, and a forked\namber line when two versions appear to have diverged (in that\ncase the app refuses to name a single \"latest\").\n- Latest ranking prefers the content-modified datetime stored\nINSIDE the document (Office docProps / PDF ModDate) over the\nfile mtime, because copying a file changes its mtime. The\ndatetime source is always shown.\n- Diffs: line level for documents/text, cell level (sheet,\naddress, before -> after) for xlsx/csv, shown as a two-page\n\"spread\".\n- Archive moves are checkbox-approved, never overwrite (serial\nsuffix on clashes), are logged, and can be undone even after a\nrestart.\n- Readable formats: docx, xlsx, pptx, pdf (text layer only), txt,\nmd, csv. Other formats are handled by hash only. Files over\n100 MB are hashed only. Unreadable/encrypted files are listed\nwith the reason.\n- 13 UI languages, switchable instantly from the right end of the\ncommand bar; Arabic switches the whole layout, including the\ngenealogy direction, to RTL.\n- Fully offline. Real Windows / Mac machines: not yet verified.\n- Mac package note: VersionDetective-Mac.zip is NOT a finished Mac\nbinary. macOS apps are .app bundles, which cannot be compiled in\nthe Linux development environment used to build this app. The\nzip contains the full source plus MakeApp-Mac.command; running\nthat script once on your own Mac builds VersionDetective.app\nthere (universal2 first, native fallback). Unverified on a real\nMac.\n- Bundled fonts: Inter (Latin/digits) and Noto Sans JP (Japanese),\nboth SIL Open Font License 1.1; license texts and attribution are\nin the fonts folder (FONTS.txt).\n"}, {"p": "requirements.txt", "s": 8, "l": "plaintext", "c": "PySide6\n"}, {"p": "Start-VersionDetective.bat", "s": 444, "l": "dos", "c": "@echo off\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo app.py が見つかりません。ZIPをすべて展開してから実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\npython -c \"import PySide6\" 2> nul\r\nif errorlevel 1 (\r\n  echo 必要なライブラリをインストールします（初回のみ）...\r\n  python -m pip install -r requirements.txt\r\n)\r\npython app.py\r\nif errorlevel 1 (\r\n  echo.\r\n  echo VersionDetective がエラーで終了しました。上記の表示を確認してください。\r\n  pause\r\n)\r\n"}, {"p": "Start-VersionDetective.command", "s": 1634, "l": "bash", "c": "#!/bin/bash\n# VersionDetective - macOS source launcher\n# Double-click this file to run VersionDetective from the source code.\n# First launch only: if macOS blocks it, right-click the file and\n# choose \"Open\" once.\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== VersionDetective (macOS, from source) ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"VersionDetective needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + dependencies (first run only) -----------------\nif [ ! -x \".venv/bin/python\" ]; then\n  echo \"Preparing the app environment (first run only)...\"\n  $PY -m venv .venv || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv/bin/python -m pip install -r requirements.txt || { echo \"Failed to install the required libraries. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nexec .venv/bin/python app.py\n"}, {"p": "tests/test_latest.py", "s": 16824, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tests for VersionDetective.\n\nRun with:  python3 tests/test_latest.py     (no pytest needed)\nCovers: exact grouping, candidate grouping (unrelated files stay\nout), latest ranking (internal datetime wins, branch -> no verdict),\ndocx line diff, xlsx cell diff, archive move + clash + undo,\nencrypted/corrupt handling, i18n key completeness, GUI smoke.\n\"\"\"\n\nimport io\nimport os\nimport sys\nimport tempfile\nimport zipfile\nfrom datetime import datetime, timedelta, timezone\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nimport analyzer  # noqa: E402\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\n\n\n# ----------------------------------------------------------------------\n# Fixture builders (stdlib only, minimal OOXML)\n# ----------------------------------------------------------------------\n\nCT = \"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">\n<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>\n<Default Extension=\"xml\" ContentType=\"application/xml\"/>\n<Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>\n<Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/>\n<Override PartName=\"/docProps/core.xml\" ContentType=\"application/vnd.openxmlformats-package.core-properties+xml\"/>\n<\/Types>\"\"\"\n\nRELS = \"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\n<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>\n<\/Relationships>\"\"\"\n\n\ndef core_xml(modified_iso):\n    return f\"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<cp:coreProperties xmlns:cp=\"http://schemas.openxmlformats.org/package/2006/metadata/core-properties\" xmlns:dcterms=\"http://purl.org/dc/terms/\">\n<dcterms:modified>{modified_iso}<\/dcterms:modified>\n<\/cp:coreProperties>\"\"\"\n\n\ndef make_docx(path, paragraphs, modified_iso=\"2025-01-01T09:00:00Z\"):\n    paras = \"\".join(\n        f'<w:p><w:r><w:t>{p}<\/w:t><\/w:r><\/w:p>' for p in paragraphs)\n    doc = f\"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"><w:body>{paras}<\/w:body><\/w:document>\"\"\"\n    with zipfile.ZipFile(path, \"w\") as zf:\n        zf.writestr(\"[Content_Types].xml\", CT)\n        zf.writestr(\"_rels/.rels\", RELS)\n        zf.writestr(\"word/document.xml\", doc)\n        zf.writestr(\"docProps/core.xml\", core_xml(modified_iso))\n\n\ndef make_xlsx(path, rows, modified_iso=\"2025-01-01T09:00:00Z\"):\n    \"\"\"rows: list of rows; each row a list of strings (sheet 'Data').\"\"\"\n    strings = []\n    index = {}\n\n    def sidx(s):\n        if s not in index:\n            index[s] = len(strings)\n            strings.append(s)\n        return index[s]\n\n    sheet_rows = []\n    for r, row in enumerate(rows, start=1):\n        cells = \"\"\n        for c, val in enumerate(row):\n            if val == \"\":\n                continue\n            coord = f\"{analyzer._col_name(c)}{r}\"\n            cells += f'<c r=\"{coord}\" t=\"s\"><v>{sidx(val)}<\/v><\/c>'\n        sheet_rows.append(f'<row r=\"{r}\">{cells}<\/row>')\n    ss = \"\".join(f\"<si><t>{s}<\/t><\/si>\" for s in strings)\n    shared = f\"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<sst xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">{ss}<\/sst>\"\"\"\n    sheet = f\"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><sheetData>{''.join(sheet_rows)}<\/sheetData><\/worksheet>\"\"\"\n    wb = \"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"><sheets><sheet name=\"Data\" sheetId=\"1\" r:id=\"rId1\"/><\/sheets><\/workbook>\"\"\"\n    wb_rels = \"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\n<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" Target=\"worksheets/sheet1.xml\"/>\n<\/Relationships>\"\"\"\n    with zipfile.ZipFile(path, \"w\") as zf:\n        zf.writestr(\"[Content_Types].xml\", CT)\n        zf.writestr(\"_rels/.rels\", RELS)\n        zf.writestr(\"xl/workbook.xml\", wb)\n        zf.writestr(\"xl/_rels/workbook.xml.rels\", wb_rels)\n        zf.writestr(\"xl/worksheets/sheet1.xml\", sheet)\n        zf.writestr(\"xl/sharedStrings.xml\", shared)\n        zf.writestr(\"docProps/core.xml\", core_xml(modified_iso))\n\n\ndef write(path, text):\n    with open(path, \"w\", encoding=\"utf-8\") as fh:\n        fh.write(text)\n\n\ndef set_mtime(path, dt):\n    ts = dt.replace(tzinfo=timezone.utc).timestamp()\n    os.utime(path, (ts, ts))\n\n\nBASE = [\"企画の目的\", \"対象は中小企業\", \"予算は100万円\", \"期間は3か月\"]\n\n\n# ----------------------------------------------------------------------\n# Tests\n# ----------------------------------------------------------------------\n\ndef test_exact_grouping():\n    with tempfile.TemporaryDirectory() as d:\n        a = os.path.join(d, \"議事録.txt\")\n        b = os.path.join(d, \"議事録_コピー.txt\")\n        c = os.path.join(d, \"別のメモ.txt\")\n        write(a, \"会議の記録\\n決定事項は3件\\n\")\n        write(b, \"会議の記録\\n決定事項は3件\\n\")\n        write(c, \"全く別の内容です\\n\")\n        infos = [analyzer.extract(p) for p in (a, b, c)]\n        groups, singles = analyzer.build_groups(infos)\n        assert len(groups) == 1, groups\n        assert groups[0].kind == \"exact\"\n        assert {m.name for m in groups[0].members} == \\\n            {\"議事録.txt\", \"議事録_コピー.txt\"}\n        assert [s.name for s in singles] == [\"別のメモ.txt\"]\n\n\ndef test_candidate_grouping_and_unrelated_stays_out():\n    with tempfile.TemporaryDirectory() as d:\n        v1 = os.path.join(d, \"企画書.docx\")\n        v2 = os.path.join(d, \"企画書_修正.docx\")\n        v3 = os.path.join(d, \"企画書_最終版.docx\")\n        other = os.path.join(d, \"請求書.docx\")\n        make_docx(v1, BASE, \"2025-01-01T09:00:00Z\")\n        make_docx(v2, BASE + [\"進め方を追加\"], \"2025-01-02T09:00:00Z\")\n        make_docx(v3, BASE + [\"進め方を追加\", \"まとめを追加\"],\n                  \"2025-01-03T09:00:00Z\")\n        make_docx(other, [\"請求先はA社\", \"金額は55万円\", \"支払期限は月末\"],\n                  \"2025-01-03T09:00:00Z\")\n        infos = [analyzer.extract(p) for p in (v1, v2, v3, other)]\n        groups, singles = analyzer.build_groups(infos)\n        assert len(groups) == 1, [(g.kind, [m.name for m in g.members])\n                                  for g in groups]\n        g = groups[0]\n        assert g.kind == \"candidate\"\n        assert len(g.members) == 3\n        assert g.similarity >= 0.45\n        assert [s.name for s in singles] == [\"請求書.docx\"]\n\n\ndef test_latest_prefers_internal_datetime():\n    with tempfile.TemporaryDirectory() as d:\n        old_internal = os.path.join(d, \"報告書_最終版.docx\")\n        new_internal = os.path.join(d, \"報告書_修正.docx\")\n        # file mtimes are the OTHER way round on purpose: the copy\n        # operation refreshed the older content's mtime.\n        # older content is a pure subset (no divergence), so the\n        # ranking itself is what is being tested here.\n        make_docx(old_internal, BASE, \"2025-01-01T09:00:00Z\")\n        make_docx(new_internal, BASE + [\"新しい追記\"],\n                  \"2025-02-01T09:00:00Z\")\n        set_mtime(old_internal, datetime(2025, 3, 1))\n        set_mtime(new_internal, datetime(2025, 1, 15))\n        infos = [analyzer.extract(p) for p in (old_internal, new_internal)]\n        groups, _ = analyzer.build_groups(infos)\n        assert len(groups) == 1\n        verdict = analyzer.rank_latest(groups[0])\n        assert not verdict.branch\n        assert verdict.candidate is not None\n        assert verdict.candidate.name == \"報告書_修正.docx\", verdict.candidate\n        keys = [k for k, _ in verdict.reasons]\n        assert \"reason_dt_office\" in keys, keys\n\n\ndef test_branch_detection_no_verdict():\n    with tempfile.TemporaryDirectory() as d:\n        v2 = os.path.join(d, \"仕様書_修正.docx\")\n        v3 = os.path.join(d, \"仕様書_最終版.docx\")\n        make_docx(v2, BASE + [\"Aさんが足した行\"], \"2025-01-02T09:00:00Z\")\n        make_docx(v3, BASE + [\"Bさんが足した行\"], \"2025-01-03T09:00:00Z\")\n        infos = [analyzer.extract(p) for p in (v2, v3)]\n        groups, _ = analyzer.build_groups(infos)\n        verdict = analyzer.rank_latest(groups[0])\n        assert verdict.branch, verdict\n        assert verdict.candidate is None\n        assert verdict.branch_with is not None\n\n\ndef test_cell_value_edit_is_not_a_branch():\n    \"\"\"Editing cell values (same coordinates) is a normal revision,\n    not a divergence: the newer spreadsheet must be the candidate.\"\"\"\n    with tempfile.TemporaryDirectory() as d:\n        a = os.path.join(d, \"見積書.xlsx\")\n        b = os.path.join(d, \"見積書_修正.xlsx\")\n        make_xlsx(a, [[\"項目\", \"金額\"], [\"作業費\", \"100\"], [\"合計\", \"100\"]],\n                  \"2025-01-01T09:00:00Z\")\n        make_xlsx(b, [[\"項目\", \"金額\"], [\"作業費\", \"120\"], [\"合計\", \"120\"],\n                      [\"備考\", \"税込\"]], \"2025-01-02T09:00:00Z\")\n        infos = [analyzer.extract(p) for p in (a, b)]\n        groups, _ = analyzer.build_groups(infos)\n        assert len(groups) == 1\n        verdict = analyzer.rank_latest(groups[0])\n        assert not verdict.branch, verdict\n        assert verdict.candidate is not None\n        assert verdict.candidate.name == \"見積書_修正.xlsx\"\n\n\ndef test_manual_latest_override():\n    with tempfile.TemporaryDirectory() as d:\n        v1 = os.path.join(d, \"案内文.txt\")\n        v2 = os.path.join(d, \"案内文_修正.txt\")\n        write(v1, \"元の文章\\n\")\n        write(v2, \"元の文章\\n新しい行\\n\")\n        infos = [analyzer.extract(p) for p in (v1, v2)]\n        groups, _ = analyzer.build_groups(infos)\n        groups[0].manual_latest = v1\n        verdict = analyzer.rank_latest(groups[0])\n        assert verdict.candidate is not None\n        assert verdict.candidate.path == v1\n        assert verdict.reasons[0][0] == \"reason_manual\"\n\n\ndef test_docx_line_diff():\n    with tempfile.TemporaryDirectory() as d:\n        a = os.path.join(d, \"a.docx\")\n        b = os.path.join(d, \"b.docx\")\n        make_docx(a, [\"1行目\", \"2行目\", \"3行目\"])\n        make_docx(b, [\"1行目\", \"2行目改\", \"3行目\", \"4行目\"])\n        ia, ib = analyzer.extract(a), analyzer.extract(b)\n        dres = analyzer.diff_infos(ia, ib)\n        assert dres.kind == \"text\"\n        assert dres.added == 2 and dres.deleted == 1, dres\n\n\ndef test_xlsx_cell_diff():\n    with tempfile.TemporaryDirectory() as d:\n        a = os.path.join(d, \"見積.xlsx\")\n        b = os.path.join(d, \"見積_修正.xlsx\")\n        make_xlsx(a, [[\"項目\", \"金額\"], [\"作業費\", \"100\"], [\"合計\", \"100\"]])\n        make_xlsx(b, [[\"項目\", \"金額\"], [\"作業費\", \"120\"], [\"合計\", \"120\"],\n                      [\"備考\", \"税込\"]])\n        ia, ib = analyzer.extract(a), analyzer.extract(b)\n        assert ia.kind == \"cells\" and ib.kind == \"cells\"\n        dres = analyzer.diff_infos(ia, ib)\n        assert dres.kind == \"cells\"\n        changed = {(s, c): (o, n) for s, c, o, n in dres.changed_cells}\n        assert changed[(\"Data\", \"B2\")] == (\"100\", \"120\"), changed\n        assert changed[(\"Data\", \"B3\")] == (\"100\", \"120\")\n        assert dres.added_cells == 2, dres  # A4, B4 added\n\n\ndef test_corrupt_and_encrypted_are_listed():\n    with tempfile.TemporaryDirectory() as d:\n        bad = os.path.join(d, \"壊れた.docx\")\n        write(bad, \"これはZIPではありません\")\n        enc = os.path.join(d, \"秘密.pdf\")\n        with open(enc, \"wb\") as fh:\n            fh.write(b\"%PDF-1.7\\n<< /Encrypt 12 0 R >>\\n\"\n                     b\"/ModDate (D:20250101120000Z)\\n%%EOF\")\n        ib = analyzer.extract(bad)\n        ie = analyzer.extract(enc)\n        assert ib.status == \"error\" and ib.error_reason == \"corrupt\", ib\n        assert ie.status == \"error\" and ie.error_reason == \"encrypted\", ie\n\n\ndef test_rejected_pair_splits_group():\n    with tempfile.TemporaryDirectory() as d:\n        a = os.path.join(d, \"メモ.txt\")\n        b = os.path.join(d, \"メモ_コピー.txt\")\n        write(a, \"同じ内容\\n\")\n        write(b, \"同じ内容\\n\")\n        infos = [analyzer.extract(p) for p in (a, b)]\n        groups, _ = analyzer.build_groups(infos)\n        assert len(groups) == 1\n        groups2, singles2 = analyzer.build_groups(\n            infos, rejected_pairs={frozenset((a, b))})\n        # stage-1 (identical content) still groups them; rejection\n        # only blocks stage-2/candidate edges and manual merges are\n        # separate.  Identical files remain an exact group by design.\n        assert len(groups2) == 1 and groups2[0].kind == \"exact\"\n\n\ndef test_move_clash_and_undo():\n    os.environ[\"XDG_DATA_HOME\"] = tempfile.mkdtemp()\n    import mover\n    with tempfile.TemporaryDirectory() as d:\n        src_dir = os.path.join(d, \"work\")\n        arc = os.path.join(d, \"archive\")\n        os.makedirs(src_dir)\n        os.makedirs(arc)\n        f1 = os.path.join(src_dir, \"旧版.txt\")\n        write(f1, \"old\\n\")\n        write(os.path.join(arc, \"旧版.txt\"), \"already there\\n\")\n        done, errors = mover.execute_moves([(f1, arc)])\n        assert not errors, errors\n        assert len(done) == 1\n        # clash avoided with a serial suffix, nothing overwritten\n        assert os.path.basename(done[0][\"dst\"]) == \"旧版 (2).txt\"\n        with open(os.path.join(arc, \"旧版.txt\"), encoding=\"utf-8\") as fh:\n            assert fh.read() == \"already there\\n\"\n        undone, uerrors = mover.undo_last_batch()\n        assert not uerrors and len(undone) == 1\n        assert os.path.exists(f1)\n        # log persisted on disk\n        log = mover.load_log()\n        assert log and log[-1][\"undone\"] is True\n\n\ndef test_i18n_complete():\n    import i18n\n    base = None\n    for code, _name in i18n.LANGS:\n        keys = set(i18n.STRINGS[code])\n        if base is None:\n            base = keys\n        assert keys == base, (code, sorted(base ^ keys))\n    # every formatted key renders in every language\n    for code, _name in i18n.LANGS:\n        for key in (\"status_done\", \"similarity\", \"chg_lines\",\n                    \"analyzing_count\", \"version_no\", \"chg_cells\"):\n            out = i18n.tr(code, key, files=1, groups=2, pct=50,\n                          a=1, d=2, done=3, total=9, n=4)\n            assert \"{\" not in out, (code, key, out)\n\n\ndef test_gui_smoke():\n    from PySide6.QtWidgets import QApplication\n    app = QApplication.instance() or QApplication([])\n    import app as appmod\n    win = appmod.MainWindow()\n    with tempfile.TemporaryDirectory() as d:\n        v1 = os.path.join(d, \"企画書.docx\")\n        v2 = os.path.join(d, \"企画書_最終版.docx\")\n        make_docx(v1, BASE, \"2025-01-01T09:00:00Z\")\n        make_docx(v2, BASE + [\"追加の行\"], \"2025-01-02T09:00:00Z\")\n        infos = [analyzer.extract(p) for p in (v1, v2)]\n        win._scan_done(infos)\n        assert win.groups, \"expected one group\"\n        assert win.canvas._nodes, \"genealogy nodes missing\"\n        assert len(win.canvas._nodes) == 2\n        # language switching incl. RTL must not raise\n        idx_ar = [c for c, _ in appmod.LANGS].index(\"ar\")\n        win.lang_combo.setCurrentIndex(idx_ar)\n        assert win.lang == \"ar\"\n        assert win.canvas._rtl is True\n        idx_en = [c for c, _ in appmod.LANGS].index(\"en\")\n        win.lang_combo.setCurrentIndex(idx_en)\n        assert win.lang == \"en\"\n        # archive dialog builds\n        dlg_members = [(i, True) for i in win.groups[0].members]\n        dlg = appmod.ArchiveDialog(win, \"en\", dlg_members, d)\n        assert dlg.list.count() == 2\n        dlg.close()\n    win.close()\n\n\ndef _run_all():\n    tests = [(k, v) for k, v in sorted(globals().items())\n             if k.startswith(\"test_\") and callable(v)]\n    failed = 0\n    for name, fn in tests:\n        try:\n            fn()\n            print(f\"PASS {name}\")\n        except Exception as exc:  # noqa: BLE001\n            failed += 1\n            import traceback\n            print(f\"FAIL {name}: {exc}\")\n            traceback.print_exc()\n    print(f\"\\n{len(tests) - failed}/{len(tests)} passed\")\n    return 1 if failed else 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(_run_all())\n"}, {"p": "theme.py", "s": 13044, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Theme for the genealogy design.\n\nA completely new look, built around a floating pill command bar and a\nversion family-tree (genealogy) canvas:\n\n- pale lavender-white ground, deep indigo (#3730A3) as the main colour\n- thin rules and generous whitespace; big numerals / typography first\n- amber reserved for the branch (fork) warning and one accent action\n\n2026 refresh: the typography now comes from the bundled fonts\n(Inter + Noto Sans JP, see fonts.py) and every control was redrawn\nin a flat, modern idiom — no bevels or heavy gradients, generous\ncorner radii, state changes carried by colour alone, custom-drawn\ncombo chevrons and check/radio indicators (assets/, drawn with\nQPainter), slim scrollbars and soft, sparing drop shadows.\n\"\"\"\n\nimport os\n\nimport fonts as _fonts\n\nBG = \"#F4F3FA\"            # pale lavender white\nPANEL = \"#FFFFFF\"\nINK = \"#232038\"           # deep plum-black\nSUBINK = \"#6E6A87\"\nINDIGO = \"#4F46E5\"\nINDIGO_MID = \"#4338CA\"\nINDIGO_DEEP = \"#3730A3\"\nINDIGO_SOFT = \"#ECEDFC\"\nINDIGO_WASH = \"#F5F5FE\"\nLINE = \"#DDDAEE\"\nLINE_STRONG = \"#C6C2DE\"\nAMBER = \"#B45309\"\nAMBER_BG = \"#FDF3E2\"\nAMBER_LINE = \"#E3B76B\"\nGREEN = \"#15803D\"\nGREEN_BG = \"#E9F7EE\"\nRED = \"#B91C1C\"\nRED_BG = \"#FBEAEA\"\nADD_BG = \"#E9F7EE\"\nDEL_BG = \"#FBEAEA\"\nDISABLED_INK = \"#ABA8C2\"\n\n# CSS stack for the few places QSS must name a family itself (the\n# main UI family is applied per-language via fonts.apply_language_font\n# and inherited everywhere else).\nUI_FAMILY_CSS = ('\"Inter\", \"Noto Sans JP\", \"Segoe UI\", '\n                 '\"Hiragino Sans\", sans-serif')\nMONO_FAMILY_CSS = ('\"Cascadia Mono\", \"Consolas\", \"SF Mono\", \"Menlo\", '\n                   '\"DejaVu Sans Mono\", monospace')\n\n\ndef apply_theme(app) -> None:\n    \"\"\"Apply palette + stylesheet.\n\n    Ground colours come from the palette, NOT from a global\n    \"QWidget { background }\" rule: a global background paints a\n    visible block behind every label's text (seen under Wine).\n    \"\"\"\n    from PySide6.QtGui import QColor, QPalette\n    _fonts.register_fonts()\n    pal = app.palette()\n    pal.setColor(QPalette.ColorRole.Window, QColor(BG))\n    pal.setColor(QPalette.ColorRole.Base, QColor(PANEL))\n    pal.setColor(QPalette.ColorRole.WindowText, QColor(INK))\n    pal.setColor(QPalette.ColorRole.Text, QColor(INK))\n    pal.setColor(QPalette.ColorRole.Highlight, QColor(INDIGO))\n    pal.setColor(QPalette.ColorRole.HighlightedText, QColor(\"#FFFFFF\"))\n    app.setPalette(pal)\n    app.setStyleSheet(stylesheet())\n\n\ndef soft_shadow(widget, blur=22, dy=3, alpha=26) -> None:\n    \"\"\"Attach a restrained drop shadow (cards, command bar, panel).\n\n    Kept deliberately faint: it only lifts the surface off the\n    lavender ground, never a heavy grey halo.\n    \"\"\"\n    from PySide6.QtGui import QColor\n    from PySide6.QtWidgets import QGraphicsDropShadowEffect\n    eff = QGraphicsDropShadowEffect(widget)\n    eff.setBlurRadius(blur)\n    eff.setOffset(0, dy)\n    eff.setColor(QColor(35, 32, 56, alpha))\n    widget.setGraphicsEffect(eff)\n\n\ndef _asset(name: str) -> str:\n    path = os.path.join(_fonts.assets_dir(), name)\n    return path.replace(os.sep, \"/\")\n\n\ndef stylesheet() -> str:\n    chev = _asset(\"chevron-down.png\")\n    chev_hot = _asset(\"chevron-down-indigo.png\")\n    chk_off = _asset(\"check-off.png\")\n    chk_off_h = _asset(\"check-off-hover.png\")\n    chk_on = _asset(\"check-on.png\")\n    chk_on_h = _asset(\"check-on-hover.png\")\n    chk_off_d = _asset(\"check-off-dis.png\")\n    chk_on_d = _asset(\"check-on-dis.png\")\n    rad_off = _asset(\"radio-off.png\")\n    rad_off_h = _asset(\"radio-off-hover.png\")\n    rad_on = _asset(\"radio-on.png\")\n    rad_on_h = _asset(\"radio-on-hover.png\")\n    rad_off_d = _asset(\"radio-off-dis.png\")\n    rad_on_d = _asset(\"radio-on-dis.png\")\n    return f\"\"\"\nQWidget {{ color: {INK}; font-size: 13px; }}\nQMainWindow {{ background: {BG}; }}\nQToolTip {{ background: {INK}; color: white; border: none;\n    padding: 5px 9px; font-size: 12px; }}\n\n/* ---- buttons: flat, colour carries the state ------------------ */\nQPushButton {{ background: {PANEL}; color: {INK};\n    border: 1px solid {LINE_STRONG}; border-radius: 10px;\n    padding: 7px 16px; font-weight: 500; }}\nQPushButton:hover {{ background: {INDIGO_WASH};\n    border-color: {INDIGO}; color: {INDIGO_DEEP}; }}\nQPushButton:pressed {{ background: {INDIGO_SOFT};\n    border-color: {INDIGO}; color: {INDIGO_DEEP}; }}\nQPushButton:disabled {{ background: {BG}; color: {DISABLED_INK};\n    border-color: {LINE}; }}\nQPushButton#primary {{ background: {INDIGO}; border: 1px solid {INDIGO};\n    color: white; font-weight: 600; }}\nQPushButton#primary:hover {{ background: {INDIGO_MID};\n    border-color: {INDIGO_MID}; color: white; }}\nQPushButton#primary:pressed {{ background: {INDIGO_DEEP};\n    border-color: {INDIGO_DEEP}; color: white; }}\nQPushButton#primary:disabled {{ background: #C7C4E8;\n    border-color: #C7C4E8; color: white; }}\nQPushButton#accent {{ background: {AMBER_BG};\n    border: 1px solid {AMBER_LINE}; color: {AMBER}; font-weight: 600; }}\nQPushButton#accent:hover {{ background: #FBEED3;\n    border-color: {AMBER}; color: {AMBER}; }}\nQPushButton#accent:pressed {{ background: #F7E3BC;\n    border-color: {AMBER}; color: {AMBER}; }}\nQPushButton#accent:disabled {{ background: {BG};\n    border-color: {LINE}; color: {DISABLED_INK}; }}\n\n/* ---- inputs ---------------------------------------------------- */\nQLineEdit {{ background: {PANEL}; border: 1px solid {LINE_STRONG};\n    border-radius: 10px; padding: 7px 12px;\n    selection-background-color: {INDIGO}; selection-color: white; }}\nQLineEdit:focus {{ border: 1.5px solid {INDIGO};\n    background: {PANEL}; }}\nQLineEdit:disabled {{ background: {BG}; color: {DISABLED_INK}; }}\nQLineEdit#searchEdit {{ border-radius: 12px; }}\nQPlainTextEdit {{ background: {PANEL}; border: 1px solid {LINE_STRONG};\n    border-radius: 12px; padding: 6px;\n    font-family: {MONO_FAMILY_CSS}; font-size: 12px;\n    selection-background-color: {INDIGO}; selection-color: white; }}\nQPlainTextEdit:focus {{ border: 1.5px solid {INDIGO}; }}\n\n/* ---- combo boxes: hand-drawn chevron --------------------------- */\nQComboBox {{ background: {PANEL}; border: 1px solid {LINE_STRONG};\n    border-radius: 10px; padding: 6px 30px 6px 12px; font-weight: 500; }}\nQComboBox:hover {{ border-color: {INDIGO}; }}\nQComboBox:on, QComboBox:focus {{ border-color: {INDIGO}; }}\nQComboBox:disabled {{ background: {BG}; color: {DISABLED_INK}; }}\nQComboBox::drop-down {{ subcontrol-origin: padding;\n    subcontrol-position: center right; width: 26px; border: none; }}\nQComboBox::down-arrow {{ image: url({chev}); width: 12px; height: 12px; }}\nQComboBox::down-arrow:hover {{ image: url({chev_hot}); }}\nQComboBox QAbstractItemView {{ background: {PANEL};\n    border: 1px solid {LINE}; border-radius: 8px; padding: 4px;\n    outline: 0; selection-background-color: {INDIGO_SOFT};\n    selection-color: {INK}; }}\nQComboBox#langCombo {{ border-radius: 12px; padding: 6px 28px 6px 12px; }}\n\n/* ---- check boxes / radio buttons: drawn indicators ------------- */\nQCheckBox {{ spacing: 8px; }}\nQCheckBox::indicator {{ width: 18px; height: 18px;\n    image: url({chk_off}); }}\nQCheckBox::indicator:hover {{ image: url({chk_off_h}); }}\nQCheckBox::indicator:checked {{ image: url({chk_on}); }}\nQCheckBox::indicator:checked:hover {{ image: url({chk_on_h}); }}\nQCheckBox::indicator:disabled {{ image: url({chk_off_d}); }}\nQCheckBox::indicator:checked:disabled {{ image: url({chk_on_d}); }}\nQRadioButton {{ spacing: 8px; }}\nQRadioButton::indicator {{ width: 18px; height: 18px;\n    image: url({rad_off}); }}\nQRadioButton::indicator:hover {{ image: url({rad_off_h}); }}\nQRadioButton::indicator:checked {{ image: url({rad_on}); }}\nQRadioButton::indicator:checked:hover {{ image: url({rad_on_h}); }}\nQRadioButton::indicator:disabled {{ image: url({rad_off_d}); }}\nQRadioButton::indicator:checked:disabled {{ image: url({rad_on_d}); }}\nQListWidget::indicator, QTreeWidget::indicator,\nQTableWidget::indicator {{ width: 18px; height: 18px;\n    image: url({chk_off}); }}\nQListWidget::indicator:checked, QTreeWidget::indicator:checked,\nQTableWidget::indicator:checked {{ image: url({chk_on}); }}\n\n/* ---- floating pill command bar ------------------------------- */\nQFrame#commandBar {{ background: {PANEL}; border: 1px solid {LINE};\n    border-radius: 24px; }}\nQLabel#cmdTitle {{ font-size: 18px; font-weight: 700; color: {INDIGO_DEEP}; }}\nQLabel#cmdTagline {{ color: {SUBINK}; font-size: 11.5px; font-weight: 500; }}\n\n/* ---- left rail: case-file mini cards ------------------------- */\nQFrame#railCard {{ background: {PANEL}; border: 1px solid {LINE};\n    border-radius: 14px; }}\nQFrame#railCard:hover {{ border-color: #A5A0D8; }}\nQFrame#railCard[selected=\"true\"] {{ background: {INDIGO_SOFT};\n    border: 1.5px solid {INDIGO}; }}\nQLabel#railTitle {{ font-size: 13px; font-weight: 600; color: {INK}; }}\nQLabel#railMeta {{ color: {SUBINK}; font-size: 11.5px; }}\nQLabel#railCount {{ font-size: 24px; font-weight: 700; color: {INDIGO_DEEP}; }}\nQLabel#railHead {{ font-size: 11px; font-weight: 700; color: {SUBINK};\n    letter-spacing: 2px; }}\n\n/* ---- badges --------------------------------------------------- */\nQLabel#kindExact {{ background: {GREEN_BG}; color: {GREEN};\n    border-radius: 8px; padding: 2px 9px; font-weight: 600; font-size: 11px; }}\nQLabel#kindCandidate {{ background: {INDIGO_SOFT}; color: {INDIGO_DEEP};\n    border-radius: 8px; padding: 2px 9px; font-weight: 600; font-size: 11px; }}\nQLabel#branchBadge {{ background: {AMBER_BG}; color: {AMBER};\n    border-radius: 8px; padding: 2px 9px; font-weight: 600; font-size: 11px; }}\nQLabel#latestBadge {{ background: {INDIGO}; color: white;\n    border-radius: 8px; padding: 2px 9px; font-weight: 600; font-size: 11px; }}\nQLabel#manualBadge {{ background: {PANEL}; color: {INDIGO_DEEP};\n    border: 1px solid {INDIGO}; border-radius: 8px; padding: 1px 8px;\n    font-weight: 600; font-size: 11px; }}\nQLabel#hashBadge {{ background: {BG}; color: {SUBINK};\n    border: 1px solid {LINE}; border-radius: 8px; padding: 1px 8px;\n    font-size: 11px; }}\n\n/* ---- main panels ---------------------------------------------- */\nQFrame#panel {{ background: {PANEL}; border: 1px solid {LINE};\n    border-radius: 18px; }}\nQLabel#bigTitle {{ font-size: 21px; font-weight: 700; color: {INK}; }}\nQLabel#panelTitle {{ font-size: 12px; font-weight: 700; color: {INDIGO_DEEP};\n    letter-spacing: 1.5px; }}\nQLabel#reasonText {{ color: {SUBINK}; font-size: 12.5px; }}\nQLabel#nodeDetail {{ font-size: 12.5px; color: {INK}; }}\nQLabel#statusLabel {{ color: {SUBINK}; font-size: 12.5px; }}\nQLabel#warnLabel {{ color: {AMBER}; font-size: 12.5px; font-weight: 600; }}\nQLabel#dropHint {{ color: {INDIGO_DEEP}; font-size: 15px; font-weight: 600; }}\nQFrame#dropZone {{ background: {INDIGO_WASH}; border: 2px dashed {INDIGO};\n    border-radius: 18px; }}\n\n/* ---- lists ------------------------------------------------------ */\nQListWidget {{ background: {PANEL}; border: 1px solid {LINE};\n    border-radius: 10px; padding: 3px; outline: 0; }}\nQListWidget::item {{ padding: 4px 6px; border-radius: 6px; }}\nQListWidget::item:selected {{ background: {INDIGO_SOFT}; color: {INK}; }}\n\n/* ---- spread (side-by-side diff) -------------------------------- */\nQLabel#spreadHead {{ font-size: 12px; font-weight: 700; color: {INDIGO_DEEP}; }}\nQTableWidget {{ background: {PANEL}; border: 1px solid {LINE};\n    border-radius: 12px; gridline-color: #ECEAF6;\n    font-family: {MONO_FAMILY_CSS}; font-size: 12px;\n    selection-background-color: {INDIGO_SOFT}; selection-color: {INK}; }}\nQHeaderView::section {{ background: {INDIGO_WASH}; color: {INDIGO_DEEP};\n    border: none; border-bottom: 1px solid {LINE}; padding: 6px;\n    font-family: {UI_FAMILY_CSS}; font-weight: 600; font-size: 12px; }}\n\n/* ---- misc ------------------------------------------------------- */\nQProgressBar {{ border: none; border-radius: 8px;\n    background: #E7E5F5; text-align: center; height: 16px;\n    color: {SUBINK}; font-size: 11px; font-weight: 600; }}\nQProgressBar::chunk {{ background: {INDIGO}; border-radius: 8px; }}\nQScrollBar:vertical {{ background: transparent; width: 10px; margin: 0; }}\nQScrollBar::handle:vertical {{ background: #CFCBEA; border-radius: 5px;\n    min-height: 32px; }}\nQScrollBar::handle:vertical:hover {{ background: #A5A0D8; }}\nQScrollBar::handle:vertical:pressed {{ background: #7C74D6; }}\nQScrollBar::add-line:vertical, QScrollBar::sub-line:vertical {{ height: 0; }}\nQScrollBar::add-page:vertical, QScrollBar::sub-page:vertical {{\n    background: none; }}\nQScrollBar:horizontal {{ background: transparent; height: 10px; margin: 0; }}\nQScrollBar::handle:horizontal {{ background: #CFCBEA; border-radius: 5px;\n    min-width: 32px; }}\nQScrollBar::handle:horizontal:hover {{ background: #A5A0D8; }}\nQScrollBar::handle:horizontal:pressed {{ background: #7C74D6; }}\nQScrollBar::add-line:horizontal, QScrollBar::sub-line:horizontal {{ width: 0; }}\nQScrollBar::add-page:horizontal, QScrollBar::sub-page:horizontal {{\n    background: none; }}\nQSplitter::handle {{ background: transparent; }}\n\"\"\"\n"}]</script>

<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
