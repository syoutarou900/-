.setStyleSheet(\n            \"font-size: 22px; font-weight: 800; padding: 12px;\"\n            \" border-radius: 10px; background: #e2e8f0; color: #334155;\")\n        res_lay.addWidget(self.overall_label)\n        self.overall_hint = QLabel()\n        self.overall_hint.setWordWrap(True)\n        self.overall_hint.setAlignment(Qt.AlignmentFlag.AlignCenter)\n        res_lay.addWidget(self.overall_hint)\n        self.btn_check = QPushButton()\n        self.btn_check.setObjectName(\"checkButton\")\n        self.btn_check.clicked.connect(self.run_check)\n        res_lay.addWidget(self.btn_check)\n        self.progress_label = QLabel()\n        self.progress_label.setWordWrap(True)\n        self.progress_label.setStyleSheet(\"color: #475569; font-size: 12px;\")\n        res_lay.addWidget(self.progress_label)\n        self.table = QTableWidget(0, 4)\n        self.table.setHorizontalHeaderLabels([\"\", \"\", \"\", \"\"])\n        self.table.verticalHeader().setVisible(False)\n        self.table.setEditTriggers(QTableWidget.EditTrigger.NoEditTriggers)\n        self.table.setWordWrap(True)\n        self.table.horizontalHeader().setStretchLastSection(False)\n        from PySide6.QtWidgets import QHeaderView\n        hh = self.table.horizontalHeader()\n        hh.setSectionResizeMode(0, QHeaderView.ResizeMode.ResizeToContents)\n        hh.setSectionResizeMode(1, QHeaderView.ResizeMode.ResizeToContents)\n        hh.setSectionResizeMode(2, QHeaderView.ResizeMode.Stretch)\n        hh.setSectionResizeMode(3, QHeaderView.ResizeMode.Stretch)\n        res_lay.addWidget(self.table)\n        self.suggest_label = QLabel()\n        self.suggest_label.setWordWrap(True)\n        self.suggest_label.setStyleSheet(\"color: #92400e; font-size: 12px;\")\n        res_lay.addWidget(self.suggest_label)\n        self.btn_export = QPushButton()\n        self.btn_export.clicked.connect(self.export_renamed)\n        self.btn_export.setEnabled(False)\n        res_lay.addWidget(self.btn_export)\n        shadow(res_card)\n        rlay.addWidget(res_card)\n        splitter.addWidget(right)\n        splitter.setSizes([520, 660])\n        main.addWidget(splitter, 1)\n\n        self.footer_label = QLabel()\n        self.footer_label.setWordWrap(True)\n        self.footer_label.setStyleSheet(\"color: #64748b; font-size: 11px;\")\n        main.addWidget(self.footer_label)\n\n    # ---------------------------------------------------------- language\n    def apply_language(self, lang):\n        if lang not in LANG_ORDER:\n            lang = \"en\"\n        self.lang = lang\n        self._save_settings()\n        idx = LANG_ORDER.index(lang)\n        if self.lang_combo.currentIndex() != idx:\n            self.lang_combo.blockSignals(True)\n            self.lang_combo.setCurrentIndex(idx)\n            self.lang_combo.blockSignals(False)\n        rtl = lang in RTL_LANGS\n        self.setLayoutDirection(\n            Qt.LayoutDirection.RightToLeft if rtl\n            else Qt.LayoutDirection.LeftToRight)\n        t = lambda k, **p: tr(lang, k, **p)\n        name = display_name(lang)\n        self.setWindowTitle(name)\n        self.title_label.setText(f\"🛡️ {name}\")\n        self.subtitle_label.setText(t(\"app_subtitle\"))\n        self.lang_label.setText(t(\"lang_label\"))\n        self.in_title.setText(t(\"hdr_input\"))\n        self.att_title.setText(t(\"hdr_attach\"))\n        self.exp_title.setText(t(\"hdr_expected\"))\n        self.res_title.setText(t(\"hdr_results\"))\n        self.lbl_to.setText(t(\"lbl_to\"))\n        self.lbl_subject.setText(t(\"lbl_subject\"))\n        self.lbl_body.setText(t(\"lbl_body\"))\n        self.lbl_country.setText(t(\"lbl_country\"))\n        self.to_edit.setPlaceholderText(t(\"ph_to\"))\n        self.btn_open_body.setText(t(\"btn_open_body\"))\n        self.btn_clear.setText(t(\"btn_clear\"))\n        self.btn_add_files.setText(t(\"btn_add_files\"))\n        self.btn_remove_file.setText(t(\"btn_remove_file\"))\n        self.btn_check.setText(t(\"btn_check\"))\n        self.btn_export.setText(t(\"btn_export_rename\"))\n        self.drop_hint.setText(t(\"drop_hint\"))\n        self.exp_hint.setText(t(\"expected_hint\"))\n        self.lbl_exp_company.setText(t(\"lbl_exp_company\"))\n        self.lbl_exp_domain.setText(t(\"lbl_exp_domain\"))\n        self.lbl_exp_amount.setText(t(\"lbl_exp_amount\"))\n        self.lbl_exp_date.setText(t(\"lbl_exp_date\"))\n        self.lbl_exp_docnum.setText(t(\"lbl_exp_docnum\"))\n        footer = t(\"footer_note\")\n        if sys.platform == \"darwin\" and not core.ocr_available():\n            # macOS only: the bundled Tesseract is a Windows binary, so\n            # OCR depends on a Homebrew install. When it is missing,\n            # say so (with the install command) instead of letting\n            # images simply come back \"unreadable\". On Windows this\n            # branch is never taken and the footer is unchanged.\n            footer += \"\\n\" + t(\"ocr_mac_missing\")\n        self.footer_label.setText(footer)\n        for i, code in enumerate(COUNTRY_CODES):\n            self.country_combo.setItemText(i, t(f\"c_{code}\"))\n        self.table.setHorizontalHeaderLabels(\n            [t(\"col_level\"), t(\"col_check\"), t(\"col_reason\"),\n             t(\"col_evidence\")])\n        self._refresh_att_list()\n        if self.report is not None:\n            self._show_report(self.report)\n        else:\n            self.overall_label.setText(t(\"overall_none\"))\n            self.overall_hint.setText(\"\")\n\n    def _country_changed(self, i):\n        self.country = self.country_combo.itemData(i)\n        self._save_settings()\n\n    # ---------------------------------------------------------- input handling\n    def _refresh_att_list(self):\n        self.att_list.clear()\n        for att in self.attachments:\n            label = f\"📎 {att.name}\"\n            if att.via_ocr:\n                label += tr(self.lang, \"ocr_badge\")\n            item = QListWidgetItem(label)\n            item.setData(Qt.ItemDataRole.UserRole, att.path)\n            self.att_list.addItem(item)\n        if self.attachments:\n            self.att_count_label.setText(\n                tr(self.lang, \"att_count\", count=len(self.attachments)))\n        else:\n            self.att_count_label.setText(tr(self.lang, \"att_none\"))\n\n    def add_attachment_paths(self, paths):\n        for path in paths:\n            if os.path.isdir(path):\n                continue\n            self.attachments.append(\n                core.read_attachment(path, ui_lang=self.lang))\n        self._refresh_att_list()\n\n    def load_eml(self, path):\n        out_dir = os.path.join(app_data_dir(), \"eml_parts\")\n        data = core.parse_eml(path, keep_attachments=True, out_dir=out_dir)\n        recipients = \", \".join(data[\"recipients\"])\n        if recipients:\n            self.to_edit.setText(recipients)\n        if data[\"subject\"]:\n            self.subject_edit.setText(data[\"subject\"])\n        if data[\"body\"]:\n            self.body_edit.setPlainText(data[\"body\"])\n        for part in data[\"attachments\"]:\n            self.attachments.append(\n                core.read_attachment(part[\"path\"], part[\"name\"],\n                                     ui_lang=self.lang))\n        self._refresh_att_list()\n\n    def load_body_file(self, path):\n        if path.lower().endswith(\".eml\"):\n            self.load_eml(path)\n            return\n        try:\n            with open(path, \"rb\") as fh:\n                text = core._decode_bytes(fh.read())\n            self.body_edit.setPlainText(text)\n        except Exception:\n            pass\n\n    def handle_dropped(self, paths):\n        for path in paths:\n            low = path.lower()\n            if low.endswith(\".eml\"):\n                self.load_eml(path)\n            elif low.endswith(\".txt\") and not self.attachments \\\n                    and not self.body_edit.toPlainText().strip():\n                self.load_body_file(path)\n            else:\n                self.add_attachment_paths([path])\n\n    def dragEnterEvent(self, event):\n        if event.mimeData().hasUrls():\n            event.acceptProposedAction()\n\n    def dropEvent(self, event):\n        paths = [u.toLocalFile() for u in event.mimeData().urls()\n                 if u.isLocalFile()]\n        if paths:\n            self.handle_dropped(paths)\n        event.acceptProposedAction()\n\n    def open_body_file(self):\n        path, _ = QFileDialog.getOpenFileName(\n            self, tr(self.lang, \"dlg_open_body\"), \"\",\n            tr(self.lang, \"filter_files\"))\n        if path:\n            self.load_body_file(path)\n\n    def add_files_dialog(self):\n        paths, _ = QFileDialog.getOpenFileNames(\n            self, tr(self.lang, \"dlg_open_att\"), \"\",\n            tr(self.lang, \"filter_files\"))\n        if paths:\n            self.handle_dropped(paths)\n\n    def remove_selected_files(self):\n        rows = sorted({i.row() for i in self.att_list.selectedIndexes()},\n                      reverse=True)\n        for r in rows:\n            if 0 <= r < len(self.attachments):\n                del self.attachments[r]\n        self._refresh_att_list()\n\n    def clear_all(self):\n        self.to_edit.clear()\n        self.subject_edit.clear()\n        self.body_edit.clear()\n        self.exp_company.clear()\n        self.exp_domain.clear()\n        self.exp_amount.clear()\n        self.exp_date.clear()\n        self.exp_docnum.clear()\n        self.attachments = []\n        self.report = None\n        self.table.setRowCount(0)\n        self.suggest_label.setText(\"\")\n        self.btn_export.setEnabled(False)\n        self._refresh_att_list()\n        self.apply_language(self.lang)\n\n    # ---------------------------------------------------------- checking\n    def build_input(self):\n        return core_checks.CheckInput(\n            recipients_text=self.to_edit.text(),\n            subject=self.subject_edit.text(),\n            body=self.body_edit.toPlainText(),\n            attachments=list(self.attachments),\n            expected_company=self.exp_company.text(),\n            expected_domain=self.exp_domain.text(),\n            expected_amount=self.exp_amount.text(),\n            expected_date=self.exp_date.text(),\n            expected_docnum=self.exp_docnum.text(),\n            country=self.country,\n            labels={\"body\": tr(self.lang, \"body_label\"),\n                    \"att\": tr(self.lang, \"att_label\")},\n        )\n\n    def run_check(self):\n        if getattr(self, \"_check_thread\", None) is not None:\n            return  # a check is already running\n        self.btn_check.setEnabled(False)\n        self.progress_label.setText(tr(self.lang, \"progress_checking\"))\n        worker = _CheckWorker(self.build_input(), self.lang)\n        thread = QThread(self)\n        worker.moveToThread(thread)\n        thread.started.connect(worker.run)\n        worker.progress.connect(\n            lambda name: self.progress_label.setText(\n                tr(self.lang, \"progress_reading\", file=name)))\n        worker.finished.connect(self._finish_check)\n        worker.finished.connect(thread.quit)\n        thread.finished.connect(worker.deleteLater)\n        thread.finished.connect(thread.deleteLater)\n        thread.finished.connect(\n            lambda: setattr(self, \"_check_thread\", None))\n        self._check_thread = thread\n        self._check_worker = worker\n        thread.start()\n\n    def _finish_check(self, report, attachments):\n        self.attachments = attachments\n        self._refresh_att_list()\n        self.report = report\n        self._show_report(report)\n        self.progress_label.setText(\"\")\n        self.btn_check.setEnabled(True)\n\n    def _show_report(self, report):\n        lang = self.lang\n        overall_key = {\"green\": \"overall_green\", \"yellow\": \"overall_yellow\",\n                       \"red\": \"overall_red\"}[report.overall]\n        self.overall_label.setText(tr(lang, overall_key))\n        self.overall_label.setStyleSheet(\n            \"font-size: 22px; font-weight: 800; padding: 12px;\"\n            \" border-radius: 10px;\"\n            f\" background: {LEVEL_BG[report.overall]};\"\n            f\" color: {LEVEL_COLORS[report.overall]};\")\n        self.overall_hint.setText(\n            tr(lang, f\"overall_hint_{report.overall}\"))\n        self.table.setRowCount(0)\n        for f in report.findings:\n            row = self.table.rowCount()\n            self.table.insertRow(row)\n            lvl = QTableWidgetItem(tr(lang, f\"level_{f.level}\"))\n            lvl.setForeground(QColor(LEVEL_COLORS[f.level]))\n            font = lvl.font()\n            font.setBold(True)\n            lvl.setFont(font)\n            reason_params = dict(f.params)\n            reason = tr(lang, f.reason_key, **reason_params) \\\n                if reason_params else tr(lang, f.reason_key)\n            items = [lvl,\n                     QTableWidgetItem(tr(lang, f\"chk_{f.check}\")),\n                     QTableWidgetItem(reason),\n                     QTableWidgetItem(f.evidence)]\n            for col, item in enumerate(items):\n                item.setBackground(QColor(LEVEL_BG[f.level]))\n                self.table.setItem(row, col, item)\n            self.table.setRowHeight(row, 44)\n        if report.rename_suggestions:\n            lines = [tr(lang, \"lbl_suggestions\")]\n            by_path = {a.path: a.name for a in self.attachments}\n            for path, new_name in report.rename_suggestions.items():\n                lines.append(f\"• {by_path.get(path, path)}  →  {new_name}\")\n            self.suggest_label.setText(\"\\n\".join(lines))\n            self.btn_export.setEnabled(True)\n        else:\n            self.suggest_label.setText(\"\")\n            self.btn_export.setEnabled(False)\n\n    def export_renamed(self):\n        if not self.report or not self.report.rename_suggestions:\n            return\n        out_dir = QFileDialog.getExistingDirectory(\n            self, tr(self.lang, \"dlg_export\"))\n        if not out_dir:\n            return\n        written = core_checks.export_renamed_copies(\n            self.report.rename_suggestions, self.attachments, out_dir)\n        QMessageBox.information(\n            self, display_name(self.lang),\n            tr(self.lang, \"msg_exported\", count=len(written)))\n\n\ndef _under_wine():\n    \"\"\"True only under Wine (ntdll exports wine_get_version only there).\n    Used solely for Wine-only stability workarounds; real Windows is\n    untouched. Non-Windows platforms (macOS, Linux) return False at\n    once - ctypes.WinDLL does not exist there.\"\"\"\n    if sys.platform != \"win32\":\n        return False\n    try:\n        import ctypes\n        return hasattr(ctypes.WinDLL(\"ntdll\"), \"wine_get_version\")\n    except Exception:\n        return False\n\n\ndef main():\n    args = list(sys.argv)\n    if _under_wine():\n        # Wine-only: Qt's native (DirectWrite) font engine can fault in\n        # Wine 9.0 during font fallback, crashing the app intermittently\n        # at startup (page fault in Qt6Core's UTF-16 scan via the font\n        # engine). The FreeType engine avoids that path.\n        args += [\"-platform\", \"windows:fontengine=freetype\"]\n    app = QApplication(args)\n    try:\n        import os as _os, sys as _sys\n        from PySide6.QtGui import QIcon as _QIcon\n        _ib = getattr(_sys, \"_MEIPASS\", None) or _os.path.dirname(_os.path.abspath(__file__))\n        _ip = _os.path.join(_ib, \"assets\", \"icon.png\")\n        if _os.path.exists(_ip):\n            app.setWindowIcon(_QIcon(_ip))\n    except Exception:\n        pass\n    app.setApplicationName(APP_ID)\n    if _under_wine():\n        try:\n            # Only when the usual Windows UI fonts are absent (e.g.\n            # Wine): fall back to an installed family so font fallback\n            # cannot crash.\n            from PySide6.QtGui import QFont, QFontDatabase\n            families = set(QFontDatabase.families())\n            if families and \"Yu Gothic UI\" not in families \\\n                    and \"Segoe UI\" not in families:\n                fallback = \"Tahoma\" if \"Tahoma\" in families \\\n                    else sorted(families)[0]\n                app.setFont(QFont(fallback))\n        except Exception:\n            pass\n    win = MainWindow()\n    win.show()\n    return app.exec()\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "appinfo.py", "sizestr": "700 B", "content": "# -*- coding: utf-8 -*-\n\"\"\"Application name - THE single place that defines the product name.\n\nFinal name (decided by the user, 2026-11-14):\n- Japanese UI title: たしかめーる\n- All other languages' UI title: TashikaMail\n- EXE name: TashikaMail.exe / ZIP names: TashikaMail-Windows.zip,\n  TashikaMail-Source.zip (all derived from APP_FILE_STEM).\n\"\"\"\n\nAPP_ID = \"TashikaMail\"\nAPP_FILE_STEM = \"TashikaMail\"\nAPP_NAME_EN = \"TashikaMail\"\nAPP_NAME_JA = \"たしかめーる\"\n\nAPP_DISPLAY = {\n    \"ja\": \"たしかめーる\",\n}\n\nAPP_VERSION = \"1.1.0\"\n\n\ndef display_name(lang):\n    \"\"\"Japanese UI shows たしかめーる; every other language TashikaMail.\"\"\"\n    return APP_DISPLAY.get(lang, APP_NAME_EN)\n"}, {"path": "core.py", "sizestr": "29.1 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Pre-send checker core: extraction + file readers.\n\nPure logic, no Qt imports, so it can be unit-tested anywhere.\n\nDesign rules (fixed by the user):\n- The app NEVER sends mail. It only checks; the human decides and sends\n  from their own mail software.\n- NO fuzzy / similarity matching. Comparisons are exact after a\n  deterministic normalization, or arithmetic.\n- Anything that could not be read is reported honestly as\n  \"needs confirmation\" (yellow), never as OK (green).\n\"\"\"\nimport datetime\nimport email\nimport email.policy\nimport os\nimport re\nimport shutil\nimport subprocess\nimport sys\nimport tempfile\nimport unicodedata\nimport zipfile\nfrom dataclasses import dataclass\nfrom decimal import Decimal, InvalidOperation\n\nGREEN, YELLOW, RED = \"green\", \"yellow\", \"red\"\nLEVEL_ORDER = {GREEN: 0, YELLOW: 1, RED: 2}\n\n\ndef worst(*levels):\n    if not levels:\n        return GREEN\n    return max(levels, key=lambda lv: LEVEL_ORDER[lv])\n\n\n# ---------------------------------------------------------------------------\n# normalization helpers\n# ---------------------------------------------------------------------------\n\ndef to_half(text):\n    \"\"\"Fullwidth digits/punct -> halfwidth, halfwidth kana -> fullwidth.\"\"\"\n    if text is None:\n        return \"\"\n    return unicodedata.normalize(\"NFKC\", str(text))\n\n\ndef parse_number(text):\n    try:\n        return Decimal(str(text).replace(\",\", \"\").replace(\" \", \"\").strip())\n    except (InvalidOperation, ValueError):\n        return None\n\n\ndef fmt_money(value):\n    if value is None:\n        return \"-\"\n    if value == value.to_integral_value():\n        return f\"{int(value):,}\"\n    return f\"{value:,.2f}\".rstrip(\"0\").rstrip(\".\")\n\n\n# ---------------------------------------------------------------------------\n# amounts\n# ---------------------------------------------------------------------------\n\n@dataclass\nclass Amount:\n    value: Decimal\n    currency: str          # JPY / USD / EUR / GBP / KRW / \"\" (unspecified)\n    kind: str              # total / subtotal / tax / plain\n    raw: str\n    context: str\n\n\n_TOTAL_WORDS = (\"合計\", \"総計\", \"請求金額\", \"請求額\", \"お支払\", \"支払金額\",\n                \"税込\", \"grand total\", \"total\", \"amount due\", \"total due\",\n                \"balance due\", \"summe\", \"gesamtbetrag\", \"montant\",\n                \"importe\", \"totale\", \"toplam\", \"합계\", \"总计\", \"총액\")\n_SUBTOTAL_WORDS = (\"小計\", \"subtotal\", \"sub-total\", \"zwischensumme\",\n                   \"소계\", \"小计\")\n_TAX_WORDS = (\"消費税\", \"税額\", \"税金\", \"tax\", \"vat\", \"mwst\", \"부가세\",\n              \"税额\")\n\n\ndef _kind_from(text):\n    low = text.lower()\n    # subtotal first: the word \"subtotal\" itself contains \"total\"\n    for w in _SUBTOTAL_WORDS:\n        if w in low:\n            return \"subtotal\"\n    for w in _TOTAL_WORDS:\n        if w in low:\n            return \"total\"\n    for w in _TAX_WORDS:\n        if w in low:\n            return \"tax\"\n    return None\n\n\ndef _amount_kind(context):\n    # The label normally sits on the same line, before the amount.\n    line = context.replace(\"\\r\", \"\").split(\"\\n\")[-1]\n    return _kind_from(line) or _kind_from(context) or \"plain\"\n\n\n_AMOUNT_PATTERNS = [\n    (r\"[¥￥]\\s*([0-9][0-9,]*\\.?[0-9]*)\", \"JPY\", 1),\n    (r\"([0-9][0-9,]*\\.?[0-9]*)\\s*(?:円|JPY)\", \"JPY\", 1),\n    (r\"([0-9][0-9,]*\\.?[0-9]*)\\s*万\\s*(?:円|JPY)\", \"JPY_MAN\", 1),\n    (r\"\\$\\s*([0-9][0-9,]*\\.?[0-9]*)\", \"USD\", 1),\n    (r\"([0-9][0-9,]*\\.?[0-9]*)\\s*(?:USD|dollars?)\", \"USD\", 1),\n    (r\"€\\s*([0-9][0-9,]*\\.?[0-9]*)\", \"EUR\", 1),\n    (r\"([0-9][0-9,]*\\.?[0-9]*)\\s*(?:EUR|euros?)\", \"EUR\", 1),\n    (r\"£\\s*([0-9][0-9,]*\\.?[0-9]*)\", \"GBP\", 1),\n    (r\"([0-9][0-9,]*\\.?[0-9]*)\\s*(?:GBP|pounds?)\", \"GBP\", 1),\n    (r\"₩\\s*([0-9][0-9,]*)\", \"KRW\", 1),\n    (r\"([0-9][0-9,]*)\\s*(?:ウォン|KRW|원)\", \"KRW\", 1),\n]\n\n\ndef extract_amounts(text):\n    \"\"\"Extract amounts with currency + label kind. Overlaps de-duplicated.\"\"\"\n    text = to_half(text or \"\")\n    found = []\n    for pattern, currency, grp in _AMOUNT_PATTERNS:\n        for m in re.finditer(pattern, text, flags=re.IGNORECASE):\n            num = parse_number(m.group(grp))\n            if num is None:\n                continue\n            cur = currency\n            if currency == \"JPY_MAN\":\n                num = num * Decimal(10000)\n                cur = \"JPY\"\n            context = text[max(0, m.start() - 30):m.start()]\n            found.append((m.start(), m.end(), Amount(\n                value=num, currency=cur, kind=_amount_kind(context),\n                raw=m.group(0), context=context.strip())))\n    found.sort(key=lambda x: (x[0], -(x[1] - x[0])))\n    out, last_end = [], -1\n    for start, end, amt in found:\n        if start < last_end:\n            continue\n        out.append(amt)\n        last_end = end\n    return out\n\n\n# ---------------------------------------------------------------------------\n# dates\n# ---------------------------------------------------------------------------\n\n@dataclass\nclass DateHit:\n    day: datetime.date\n    kind: str              # deadline / validity / generic\n    raw: str\n\n\n_MONTHS = {name: i + 1 for i, name in enumerate(\n    [\"january\", \"february\", \"march\", \"april\", \"may\", \"june\", \"july\",\n     \"august\", \"september\", \"october\", \"november\", \"december\"])}\n_MONTHS.update({name[:3]: num for name, num in list(_MONTHS.items())})\n_MONTHS[\"sept\"] = 9\n\n\ndef _date_kind(context):\n    low = context.lower()\n    if \"有効\" in context or \"valid\" in low:\n        return \"validity\"\n    if (\"支払\" in context or \"pay\" in low or \"due\" in low\n            or \"期限\" in context or \"fäll\" in low or \"vencimiento\" in low\n            or \"scadenza\" in low or \"납기\" in context or \"到期\" in context):\n        return \"deadline\"\n    return \"generic\"\n\n\ndef _safe_date(y, m, d):\n    try:\n        return datetime.date(int(y), int(m), int(d))\n    except ValueError:\n        return None\n\n\ndef extract_dates(text):\n    text = to_half(text or \"\")\n    hits, spans = [], []\n\n    def add(day, start, end, raw):\n        if day is None:\n            return\n        for s, e in spans:\n            if start < e and end > s:\n                return\n        spans.append((start, end))\n        ctx = text[max(0, start - 24):start]\n        hits.append(DateHit(day=day, kind=_date_kind(ctx), raw=raw))\n\n    for m in re.finditer(r\"(20\\d{2})[/\\-.](\\d{1,2})[/\\-.](\\d{1,2})\", text):\n        add(_safe_date(*m.groups()), m.start(), m.end(), m.group(0))\n    for m in re.finditer(r\"(20\\d{2})年(\\d{1,2})月(\\d{1,2})日\", text):\n        add(_safe_date(*m.groups()), m.start(), m.end(), m.group(0))\n    wareki = {\"令和\": 2018, \"平成\": 1988, \"昭和\": 1925}\n    for m in re.finditer(r\"(令和|平成|昭和)(元|\\d{1,2})年(\\d{1,2})月(\\d{1,2})日\",\n                         text):\n        era, y, mo, d = m.groups()\n        year = wareki[era] + (1 if y == \"元\" else int(y))\n        add(_safe_date(year, mo, d), m.start(), m.end(), m.group(0))\n    mon = (r\"(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|\"\n           r\"Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|\"\n           r\"Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\")\n    for m in re.finditer(rf\"(\\d{{1,2}})\\s+{mon}\\s*,?\\s+(20\\d{{2}})\",\n                         text, re.IGNORECASE):\n        d, mname, y = m.groups()\n        add(_safe_date(y, _MONTHS[mname.lower()], d),\n            m.start(), m.end(), m.group(0))\n    for m in re.finditer(\n            rf\"{mon}\\s+(\\d{{1,2}})(?:st|nd|rd|th)?\\s*,?\\s+(20\\d{{2}})\",\n            text, re.IGNORECASE):\n        mname, d, y = m.groups()\n        add(_safe_date(y, _MONTHS[mname.lower()], d),\n            m.start(), m.end(), m.group(0))\n    hits.sort(key=lambda h: h.day)\n    return hits\n\n\n# ---------------------------------------------------------------------------\n# company names\n# ---------------------------------------------------------------------------\n\n_LEGAL_JA = (\"株式会社\", \"有限会社\", \"合同会社\", \"合資会社\", \"合名会社\")\n_LEGAL_LATIN = (\"inc\", \"ltd\", \"corp\", \"corporation\", \"gmbh\", \"llc\", \"llp\",\n                \"company\", \"limited\", \"co\", \"sa\", \"sarl\", \"bv\", \"nv\", \"ag\",\n                \"srl\", \"spa\", \"pty\")\n_NAME_STOP_CHARS = \" \\t\\r\\n、。,.，：:；;（）()［］[]「」【】<>/\\\\|　\"\n\n\ndef _clean_company_core(core):\n    core = to_half(core or \"\").strip(_NAME_STOP_CHARS)\n    for suffix in (\"御中\", \"様\", \"殿\"):\n        if core.endswith(suffix):\n            core = core[:-len(suffix)]\n    return core.strip(_NAME_STOP_CHARS)\n\n\ndef normalize_company(name):\n    \"\"\"Deterministic normalization: strip legal forms, width/case/punct.\"\"\"\n    s = to_half(name or \"\")\n    for legal in _LEGAL_JA:\n        s = s.replace(legal, \"\")\n    s = s.replace(\"(株)\", \"\").replace(\"(有)\", \"\")\n    s = unicodedata.normalize(\"NFKC\", s).lower()\n    tokens = [t for t in re.split(r\"[\\s\\.,&\\-_/]+\", s)\n              if t and t not in _LEGAL_LATIN]\n    return \"\".join(tokens)\n\n\ndef extract_companies(text):\n    \"\"\"Return {normalized_name: raw_form}. Legal forms are stripped.\"\"\"\n    text = to_half(text or \"\")\n    out = {}\n\n    def add(core):\n        core = _clean_company_core(core)\n        if len(core) < 2:\n            return\n        if not re.search(r\"[A-Za-z぀-ヿ㐀-鿿Ѐ-ӿ]\", core):\n            return  # pure numbers / punctuation are not company names\n        norm = normalize_company(core)\n        if len(norm) >= 2:\n            out.setdefault(norm, core)\n\n    for legal in _LEGAL_JA:\n        for m in re.finditer(re.escape(legal)\n                             + r\"\\s*([^\\s、。,.，：:（）()]{2,20})\", text):\n            add(m.group(1))\n        for m in re.finditer(r\"([^\\s、。,.，：:（）()]{2,20}?)\\s*\"\n                             + re.escape(legal), text):\n            add(m.group(1))\n    for m in re.finditer(r\"\\(株\\)\\s*([^\\s、。,.，：:（）()]{2,20})\", text):\n        add(m.group(1))\n    for m in re.finditer(r\"([^\\s、。,.，：:（）()]{2,20})\\s*\\(株\\)\", text):\n        add(m.group(1))\n    latin = (r\"([A-Z][A-Za-z0-9&\\-\\.]*(?:\\s+[A-Z][A-Za-z0-9&\\-\\.]*){0,3}?)\\s+\"\n             r\"(?:Inc\\.?|Ltd\\.?|Corp\\.?|Corporation|GmbH|S\\.A\\.|LLC|\"\n             r\"Limited|Company)\")\n    for m in re.finditer(latin, text):\n        add(m.group(1))\n    for m in re.finditer(\n            r\"([A-Z][A-Za-z0-9&\\-\\.]*(?:\\s+[A-Z][A-Za-z0-9&\\-\\.]*){0,3}?)\"\n            r\"\\s+Co\\.,?\\s*Ltd\\.?\", text):\n        add(m.group(1))\n    return out\n\n\ndef company_tokens(norm_name):\n    \"\"\"Latin word tokens of a normalized company name (domain checks).\"\"\"\n    if not norm_name or not re.search(r\"[a-z]\", norm_name):\n        return set()\n    if re.search(r\"[぀-ヿ㐀-鿿]\", norm_name):\n        return set()\n    return {t for t in re.split(r\"[^a-z0-9]+\", norm_name) if len(t) >= 3}\n\n\n# ---------------------------------------------------------------------------\n# document numbers\n# ---------------------------------------------------------------------------\n\n_DOC_LABEL = (r\"(?:請求書番号|請求番号|見積書番号|見積番号|注文番号|発注番号|\"\n              r\"文書番号|伝票番号|invoice\\s*(?:no\\.?|number|#)|\"\n              r\"estimate\\s*(?:no\\.?|number|#)|quotation\\s*(?:no\\.?|number|#)|\"\n              r\"order\\s*(?:no\\.?|number|#)|po\\s*(?:no\\.?|number|#)|\"\n              r\"doc(?:ument)?\\s*(?:no\\.?|number)|no\\.|番号|номер|№|\"\n              r\"청구번호|견적번호|发票号|编号)\")\n\n\ndef normalize_docnum(token):\n    return re.sub(r\"[\\s\\-_]\", \"\", to_half(token or \"\")).upper()\n\n\ndef extract_doc_numbers(text):\n    text = to_half(text or \"\")\n    out = {}\n    for m in re.finditer(_DOC_LABEL\n                         + r\"\\s*[:：]?\\s*([A-Za-z0-9][A-Za-z0-9\\-_]{2,})\",\n                         text, flags=re.IGNORECASE):\n        token = m.group(1)\n        if token.isdigit() and len(token) < 4:\n            continue\n        out.setdefault(normalize_docnum(token), token)\n    for m in re.finditer(r\"\\b(INV|EST|QT|QUO|PO|ORD|BILL)-?(\\d{3,})\\b\",\n                         text, flags=re.IGNORECASE):\n        out.setdefault(normalize_docnum(m.group(0)), m.group(0))\n    return out\n\n\n# ---------------------------------------------------------------------------\n# OCR (Tesseract, bundled - same approach as TranscribeGuard)\n#\n# Resolution order for the tesseract executable:\n#   1. environment override TASHIKAMAIL_TESSERACT_CMD (or ..._TESSERACT)\n#   2. bundled copy: <base>/tesseract/tesseract.exe, where <base> is the\n#      executable's folder when frozen, else this file's folder\n#   3. system PATH (\"tesseract\")\n# On macOS (darwin) the bundled copy is a Windows binary and can never\n# run, so step 2 is replaced by the Homebrew prefixes\n# (/opt/homebrew/bin, /usr/local/bin) - checked explicitly because\n# Finder-launched apps do not inherit the shell PATH - and step 3 is the\n# PATH fallback. The bundled tessdata (.traineddata files are portable\n# data) is still used on macOS when present next to the app.\n# Tessdata mirrors it: TASHIKAMAIL_TESSDATA_DIR override, then\n# <base>/tesseract/tessdata, then <base>/tessdata, else tesseract's default.\n# The bundled copy is Tesseract v5.5.3 + tessdata_fast for the 13 UI\n# languages, copied from the proven TranscribeGuard bundle. OCR can\n# misread - results read through OCR are flagged (Attachment.via_ocr)\n# and the UI shows a caution row asking the user to compare numbers\n# against the original document.\n# ---------------------------------------------------------------------------\n\n_TESS_ENV_VARS = (\"TASHIKAMAIL_TESSERACT_CMD\", \"TASHIKAMAIL_TESSERACT\")\n\nUI_TO_TESS = {\n    \"ja\": \"jpn\", \"en\": \"eng\", \"es\": \"spa\", \"zh_CN\": \"chi_sim\", \"fr\": \"fra\",\n    \"de\": \"deu\", \"pt\": \"por\", \"ru\": \"rus\", \"it\": \"ita\", \"tr\": \"tur\",\n    \"ar\": \"ara\", \"id\": \"ind\", \"ko\": \"kor\",\n}\n\nIMAGE_EXTS = {\".png\", \".jpg\", \".jpeg\", \".tif\", \".tiff\", \".bmp\", \".gif\",\n              \".webp\"}\n\n\ndef _is_frozen(frozen):\n    if frozen is not None:\n        return frozen\n    return bool(getattr(sys, \"frozen\", False))\n\n\ndef _base_dirs(frozen=None, exe_dir=None, app_dir=None):\n    dirs = []\n    if _is_frozen(frozen):\n        dirs.append(exe_dir or os.path.dirname(os.path.abspath(sys.executable)))\n    dirs.append(app_dir or os.path.dirname(os.path.abspath(__file__)))\n    out = []\n    for d in dirs:\n        if d and d not in out:\n            out.append(d)\n    return out\n\n\n# Homebrew prefixes on macOS (Apple Silicon, then Intel).\n_HOMEBREW_TESSERACT = (\"/opt/homebrew/bin/tesseract\",\n                       \"/usr/local/bin/tesseract\")\n\n\ndef tesseract_candidates(env=None, frozen=None, exe_dir=None, app_dir=None):\n    env = os.environ if env is None else env\n    cands = []\n    for var in _TESS_ENV_VARS:\n        if env.get(var):\n            cands.append(env[var])\n            break\n    if sys.platform == \"darwin\":\n        # macOS: the bundled copy is a Windows binary (tesseract.exe)\n        # and cannot run here, so it is not a candidate. Use the\n        # Homebrew locations instead; find_tesseract() then falls back\n        # to the PATH. Windows/Linux resolution below is unchanged.\n        cands.extend(_HOMEBREW_TESSERACT)\n        return cands\n    for base in _base_dirs(frozen, exe_dir, app_dir):\n        cands.append(os.path.join(base, \"tesseract\", \"tesseract.exe\"))\n        cands.append(os.path.join(base, \"tesseract\", \"tesseract\"))\n    return cands\n\n\ndef find_tesseract(env=None, frozen=None, exe_dir=None, app_dir=None,\n                   which=None):\n    \"\"\"Path of the tesseract executable to use, or None if not found.\"\"\"\n    which = shutil.which if which is None else which\n    for cand in tesseract_candidates(env, frozen, exe_dir, app_dir):\n        if cand and os.path.isfile(cand):\n            return cand\n    return which(\"tesseract\") or which(\"tesseract.exe\")\n\n\ndef tessdata_candidates(env=None, frozen=None, exe_dir=None, app_dir=None):\n    env = os.environ if env is None else env\n    cands = []\n    if env.get(\"TASHIKAMAIL_TESSDATA_DIR\"):\n        cands.append(env[\"TASHIKAMAIL_TESSDATA_DIR\"])\n    for base in _base_dirs(frozen, exe_dir, app_dir):\n        cands.append(os.path.join(base, \"tesseract\", \"tessdata\"))\n        cands.append(os.path.join(base, \"tessdata\"))\n    return cands\n\n\ndef find_tessdata_dir(env=None, frozen=None, exe_dir=None, app_dir=None):\n    \"\"\"Folder holding .traineddata files for the bundled copy, or None.\"\"\"\n    for cand in tessdata_candidates(env, frozen, exe_dir, app_dir):\n        try:\n            if os.path.isdir(cand) and any(\n                    f.endswith(\".traineddata\") for f in os.listdir(cand)):\n                return cand\n        except OSError:\n            continue\n    return None\n\n\ndef available_tess_langs(tessdata_dir):\n    \"\"\"Set of language codes with data in tessdata_dir, or None if unknown.\"\"\"\n    if not tessdata_dir:\n        return None\n    try:\n        return {f[: -len(\".traineddata\")] for f in os.listdir(tessdata_dir)\n                if f.endswith(\".traineddata\")}\n    except OSError:\n        return None\n\n\ndef ocr_lang_string(ui_lang=\"ja\", tessdata_dir=None):\n    \"\"\"'jpn+eng' plus the tesseract code for the UI language when different.\n    Codes without data in a known tessdata folder are dropped.\"\"\"\n    codes = [\"jpn\", \"eng\"]\n    extra = UI_TO_TESS.get(ui_lang or \"ja\")\n    if extra and extra not in codes:\n        codes.append(extra)\n    avail = available_tess_langs(tessdata_dir)\n    if avail is not None:\n        codes = [c for c in codes if c in avail]\n    return \"+\".join(codes) if codes else \"eng\"\n\n\ndef ocr_available():\n    return find_tesseract() is not None\n\n\ndef _run_tesseract(exe, image_path, langs, tessdata_dir):\n    cmd = [exe, image_path, \"stdout\", \"-l\", langs, \"--psm\", \"6\"]\n    if tessdata_dir:\n        cmd += [\"--tessdata-dir\", tessdata_dir]\n    kwargs = {\"capture_output\": True, \"timeout\": 300}\n    if os.name == \"nt\":\n        kwargs[\"creationflags\"] = getattr(subprocess, \"CREATE_NO_WINDOW\", 0)\n    proc = subprocess.run(cmd, **kwargs)\n    if proc.returncode != 0:\n        raise RuntimeError(proc.stderr.decode(\"utf-8\", \"replace\")[:300])\n    return proc.stdout.decode(\"utf-8\", \"replace\")\n\n\ndef ocr_image_file(path, ui_lang=\"ja\"):\n    \"\"\"OCR one image file and return the recognized text ('' if none).\n\n    Returns '' (never raises) when tesseract is unavailable, the image\n    cannot be opened, or nothing could be read - the caller reports the\n    attachment honestly as unreadable in that case.\n    \"\"\"\n    exe = find_tesseract()\n    if exe is None:\n        return \"\"\n    try:\n        from PIL import Image\n        img = Image.open(path)\n        img_format = (img.format or \"\").upper()\n        img.load()\n    except Exception:\n        return \"\"\n    tessdata_dir = find_tessdata_dir()\n    tmp = None\n    try:\n        image_path = path\n        needs_convert = img_format not in (\"PNG\", \"JPEG\", \"TIFF\", \"BMP\")\n        small = max(img.size) < 1200\n        if needs_convert or small:\n            work = img.convert(\"RGB\")\n            if small:\n                work = work.resize((work.width * 2, work.height * 2),\n                                   Image.LANCZOS)\n            fd, tmp = tempfile.mkstemp(suffix=\".png\")\n            os.close(fd)\n            work.save(tmp)\n            image_path = tmp\n        lang_options = []\n        for langs in (ocr_lang_string(ui_lang, tessdata_dir),\n                      \"jpn+eng\", \"eng\"):\n            if langs and langs not in lang_options:\n                lang_options.append(langs)\n        for langs in lang_options:\n            try:\n                text = _run_tesseract(exe, image_path, langs, tessdata_dir)\n            except Exception:\n                text = \"\"\n            if text.strip():\n                return text\n        return \"\"\n    finally:\n        if tmp:\n            try:\n                os.remove(tmp)\n            except OSError:\n                pass\n\n\n# ---------------------------------------------------------------------------\n# file readers\n# ---------------------------------------------------------------------------\n\n@dataclass\nclass Attachment:\n    path: str\n    name: str\n    text: str = \"\"\n    readable: bool = False\n    error: str = \"\"\n    mtime: float = 0.0\n    via_ocr: bool = False      # text was obtained through OCR\n    ocr_pages: int = 0         # PDF pages that went through OCR\n\n    @property\n    def amounts(self):\n        return extract_amounts(self.text)\n\n    @property\n    def dates(self):\n        return extract_dates(self.text)\n\n    @property\n    def companies(self):\n        return extract_companies(self.text)\n\n    @property\n    def doc_numbers(self):\n        return extract_doc_numbers(self.text)\n\n\ndef _decode_bytes(data):\n    for enc in (\"utf-8-sig\", \"shift_jis\", \"cp1252\"):\n        try:\n            return data.decode(enc)\n        except (UnicodeDecodeError, LookupError):\n            continue\n    return data.decode(\"utf-8\", errors=\"replace\")\n\n\ndef _read_pdf(path, ui_lang=\"ja\", progress=None):\n    \"\"\"Return (text, ocr_pages) for a PDF.\n\n    Pages with a text layer are read as text. Pages without one (scanned\n    pages) are rendered to images with PyMuPDF and read through OCR, so\n    mixed PDFs work page by page. ocr_pages counts the pages that went\n    through OCR. When neither a reader nor OCR is available the text is\n    simply empty and the attachment is reported as unreadable.\n    \"\"\"\n    page_texts = []\n    try:\n        from pypdf import PdfReader\n        reader = PdfReader(path)\n        for page in reader.pages:\n            try:\n                page_texts.append(page.extract_text() or \"\")\n            except Exception:\n                page_texts.append(\"\")\n    except Exception:\n        page_texts = []\n    if not page_texts:\n        try:\n            import fitz\n            doc = fitz.open(path)\n            page_texts = [(page.get_text() or \"\") for page in doc]\n            doc.close()\n        except Exception:\n            page_texts = []\n    ocr_pages = 0\n    empty_pages = [i for i, t in enumerate(page_texts) if not t.strip()]\n    if empty_pages and ocr_available():\n        try:\n            import fitz\n            doc = fitz.open(path)\n        except Exception:\n            doc = None\n        if doc is not None:\n            try:\n                for i in empty_pages:\n                    if progress:\n                        progress(i + 1, len(page_texts))\n                    tmp = None\n                    try:\n                        pix = doc[i].get_pixmap(dpi=300)\n                        fd, tmp = tempfile.mkstemp(suffix=\".png\")\n                        os.close(fd)\n                        pix.save(tmp)\n                        text = ocr_image_file(tmp, ui_lang)\n                    except Exception:\n                        text = \"\"\n                    finally:\n                        if tmp:\n                            try:\n                                os.remove(tmp)\n                            except OSError:\n                                pass\n                    if text.strip():\n                        page_texts[i] = text\n                        ocr_pages += 1\n            finally:\n                doc.close()\n    parts = []\n    for i, t in enumerate(page_texts, 1):\n        if t.strip():\n            parts.append(f\"[p.{i}] {t}\")\n    return \"\\n\".join(parts), ocr_pages\n\n\ndef _read_xlsx(path):\n    try:\n        import openpyxl\n        wb = openpyxl.load_workbook(path, data_only=True, read_only=True)\n        parts = []\n        for ws in wb.worksheets:\n            cells = []\n            for row in ws.iter_rows(values_only=True):\n                for v in row:\n                    if v is None:\n                        continue\n                    if isinstance(v, (datetime.datetime, datetime.date)):\n                        cells.append(v.strftime(\"%Y/%m/%d\"))\n                    else:\n                        cells.append(str(v))\n            if cells:\n                parts.append(f\"[sheet:{ws.title}] \" + \" \".join(cells))\n        wb.close()\n        return \"\\n\".join(parts)\n    except ImportError:\n        return _read_xlsx_stdlib(path)\n\n\ndef _read_xlsx_stdlib(path):\n    import xml.etree.ElementTree as ET\n    ns = {\"m\": \"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"}\n    mtag = \"{http://schemas.openxmlformats.org/spreadsheetml/2006/main}\"\n    parts = []\n    with zipfile.ZipFile(path) as zf:\n        shared = []\n        if \"xl/sharedStrings.xml\" in zf.namelist():\n            root = ET.fromstring(zf.read(\"xl/sharedStrings.xml\"))\n            for si in root.findall(\"m:si\", ns):\n                shared.append(\"\".join(t.text or \"\"\n                                      for t in si.iter(mtag + \"t\")))\n        for name in sorted(zf.namelist()):\n            if re.match(r\"xl/worksheets/sheet\\d+\\.xml\", name):\n                root = ET.fromstring(zf.read(name))\n                cells = []\n                for c in root.iter(mtag + \"c\"):\n                    v = c.find(\"m:v\", ns)\n                    if v is None or v.text is None:\n                        continue\n                    if c.get(\"t\") == \"s\":\n                        try:\n                            cells.append(shared[int(v.text)])\n                            continue\n                        except (ValueError, IndexError):\n                            pass\n                    cells.append(v.text)\n                if cells:\n                    parts.append(\" \".join(cells))\n    return \"\\n\".join(parts)\n\n\ndef _read_docx(path):\n    import xml.etree.ElementTree as ET\n    w = \"{http://schemas.openxmlformats.org/wordprocessingml/2006/main}\"\n    with zipfile.ZipFile(path) as zf:\n        root = ET.fromstring(zf.read(\"word/document.xml\"))\n    paras = []\n    for p in root.iter(w + \"p\"):\n        text = \"\".join(t.text or \"\" for t in p.iter(w + \"t\"))\n        if text.strip():\n            paras.append(text)\n    return \"\\n\".join(paras)\n\n\ndef read_attachment(path, name=None, ui_lang=\"ja\", progress=None):\n    name = name or os.path.basename(path)\n    att = Attachment(path=path, name=name)\n    try:\n        att.mtime = os.path.getmtime(path)\n    except OSError:\n        att.mtime = 0.0\n    ext = os.path.splitext(name)[1].lower()\n    try:\n        if ext == \".pdf\":\n            att.text, att.ocr_pages = _read_pdf(path, ui_lang, progress)\n            att.via_ocr = att.ocr_pages > 0\n        elif ext in IMAGE_EXTS:\n            if progress:\n                progress(1, 1)\n            att.text = ocr_image_file(path, ui_lang)\n            att.via_ocr = bool(att.text.strip())\n        elif ext == \".xlsx\":\n            att.text = _read_xlsx(path)\n        elif ext == \".docx\":\n            att.text = _read_docx(path)\n        elif ext in (\".txt\", \".csv\", \".tsv\", \".md\"):\n            with open(path, \"rb\") as fh:\n                att.text = _decode_bytes(fh.read())\n        elif ext == \".eml\":\n            data = parse_eml(path, keep_attachments=False)\n            att.text = (data.get(\"subject\", \"\") + \"\\n\"\n                        + data.get(\"body\", \"\"))\n        else:\n            att.text = \"\"\n            att.error = \"unsupported\"\n    except Exception as exc:\n        att.text = \"\"\n        att.error = str(exc)\n    att.readable = bool(att.text and att.text.strip())\n    if not att.readable and not att.error:\n        att.error = \"no_text\"\n    return att\n\n\n# ---------------------------------------------------------------------------\n# .eml decomposition\n# ---------------------------------------------------------------------------\n\ndef parse_eml(path, keep_attachments=True, out_dir=None):\n    \"\"\"Split an .eml into To / Cc / Subject / body / attachments (files).\"\"\"\n    with open(path, \"rb\") as fh:\n        msg = email.message_from_binary_file(fh, policy=email.policy.default)\n    to = str(msg.get(\"To\", \"\") or \"\")\n    cc = str(msg.get(\"Cc\", \"\") or \"\")\n    subject = str(msg.get(\"Subject\", \"\") or \"\")\n    body_text = \"\"\n    attachments = []\n    if msg.is_multipart():\n        for part in msg.walk():\n            ctype = part.get_content_type()\n            disp = str(part.get(\"Content-Disposition\", \"\") or \"\")\n            filename = part.get_filename()\n            if filename:\n                if keep_attachments:\n                    payload = part.get_payload(decode=True) or b\"\"\n                    target_dir = out_dir or os.path.join(\n                        os.path.dirname(os.path.abspath(path)), \"_eml_parts\")\n                    os.makedirs(target_dir, exist_ok=True)\n                    safe = os.path.basename(str(filename))\n                    dest = os.path.join(target_dir, safe)\n                    base, ext = os.path.splitext(dest)\n                    n = 2\n                    while os.path.exists(dest):\n                        dest = f\"{base}_{n}{ext}\"\n                        n += 1\n                    with open(dest, \"wb\") as out:\n                        out.write(payload)\n                    attachments.append({\"name\": safe, \"path\": dest})\n                continue\n            if ctype == \"text/plain\" and \"attachment\" not in disp:\n                try:\n                    body_text += part.get_content()\n                except Exception:\n                    payload = part.get_payload(decode=True) or b\"\"\n                    body_text += _decode_bytes(payload)\n            elif ctype == \"text/html\" and not body_text.strip():\n                try:\n                    html = part.get_content()\n                except Exception:\n                    html = _decode_bytes(part.get_payload(decode=True) or b\"\")\n                body_text += re.sub(r\"<[^>]+>\", \" \", html)\n    else:\n        try:\n            body_text = msg.get_content()\n        except Exception:\n            body_text = _decode_bytes(msg.get_payload(decode=True) or b\"\")\n    recipients = []\n    for field_value in (to, cc):\n        recipients += [a.strip() for a in re.split(r\"[,;]\", field_value)\n                       if a.strip()]\n    return {\"to\": to, \"cc\": cc, \"recipients\": recipients,\n            \"subject\": subject, \"body\": body_text.strip(),\n            \"attachments\": attachments}\n"}, {"path": "core_checks.py", "sizestr": "26.7 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Check engine for the pre-send checker. Split from core.py (extraction)\nto keep files manageable. All comparisons are exact after deterministic\nnormalization - no fuzzy matching anywhere.\"\"\"\nimport datetime\nimport os\nimport re\nimport shutil\nimport unicodedata\nfrom dataclasses import dataclass, field\nfrom decimal import Decimal\n\nfrom core import (GREEN, YELLOW, RED, LEVEL_ORDER, worst, to_half,\n                  extract_amounts, extract_dates, extract_companies,\n                  extract_doc_numbers, normalize_company, normalize_docnum,\n                  company_tokens, fmt_money, parse_number, Attachment)\n\nCHECK_ORDER = [\"attach\", \"amount\", \"date\", \"company\", \"docnum\",\n               \"domain\", \"version\", \"filename\", \"readable\", \"ocr\"]\n\nFREEMAIL_DOMAINS = {\n    \"gmail.com\", \"googlemail.com\", \"yahoo.co.jp\", \"yahoo.com\", \"ymail.com\",\n    \"outlook.com\", \"outlook.jp\", \"hotmail.com\", \"hotmail.co.jp\", \"live.com\",\n    \"icloud.com\", \"me.com\", \"mac.com\", \"proton.me\", \"protonmail.com\",\n    \"aol.com\", \"gmx.com\", \"gmx.net\", \"mail.com\", \"yandex.com\", \"yandex.ru\",\n    \"qq.com\", \"163.com\", \"naver.com\", \"daum.net\", \"hanmail.net\",\n    \"docomo.ne.jp\", \"ezweb.ne.jp\", \"au.com\", \"softbank.ne.jp\",\n    \"i.softbank.jp\", \"nifty.com\", \"biglobe.ne.jp\", \"ocn.ne.jp\",\n}\n\n# country code -> (legacy charset used for the encodability test, name is UI-side)\nCOUNTRY_CHARSETS = {\n    \"JP\": \"shift_jis\", \"US\": \"cp1252\", \"GB\": \"cp1252\", \"DE\": \"cp1252\",\n    \"FR\": \"cp1252\", \"ES\": \"cp1252\", \"IT\": \"cp1252\", \"PT\": \"cp1252\",\n    \"ID\": \"cp1252\", \"CN\": \"gbk\", \"KR\": \"cp949\", \"RU\": \"cp1251\",\n    \"TR\": \"cp1254\", \"OTHER\": \"utf-8\",\n}\n\nATTACH_WORDS = (\"添付\", \"別添\", \"別紙\", \"attached\", \"attachment\", \"attach\",\n                \"enclosed\", \"enclosing\", \"anhang\", \"angehängt\", \"beigefügt\",\n                \"joint\", \"ci-joint\", \"adjunto\", \"anexo\", \"allegato\", \"allegati\",\n                \"ekte\", \"ekinde\", \"첨부\", \"附件\", \"bijgevoegd\", \"załącznik\",\n                \"приложен\", \"вложен\")\nDOC_WORDS = (\"見積\", \"請求\", \"納品書\", \"注文書\", \"invoice\", \"estimate\",\n             \"quotation\", \"quote\", \"proforma\", \"rechnung\", \"angebot\",\n             \"facture\", \"devis\", \"factura\", \"presupuesto\", \"fattura\",\n             \"preventivo\", \"fatura\", \"orçamento\", \"teklif\", \"견적\", \"송장\",\n             \"청구\", \"发票\", \"报价\", \"报价单\", \"счёт\", \"счет\", \"коммерческое\")\n\n\n@dataclass\nclass Finding:\n    check: str\n    level: str\n    reason_key: str\n    params: dict = field(default_factory=dict)\n    evidence: str = \"\"\n\n\n@dataclass\nclass CheckInput:\n    recipients_text: str = \"\"\n    subject: str = \"\"\n    body: str = \"\"\n    attachments: list = field(default_factory=list)   # list[Attachment]\n    expected_company: str = \"\"\n    expected_domain: str = \"\"\n    expected_amount: str = \"\"\n    expected_date: str = \"\"\n    expected_docnum: str = \"\"\n    country: str = \"JP\"\n    labels: dict = field(default_factory=lambda: {\"body\": \"Body\", \"att\": \"File\"})\n\n\n@dataclass\nclass Report:\n    overall: str\n    findings: list\n    rename_suggestions: dict = field(default_factory=dict)  # path -> new name\n\n    def by_check(self, check):\n        return [f for f in self.findings if f.check == check]\n\n\ndef parse_emails(text):\n    return re.findall(r\"[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}\",\n                      to_half(text or \"\"))\n\n\ndef _domain_of(email_addr):\n    return email_addr.rsplit(\"@\", 1)[-1].lower().strip()\n\n\ndef _domain_tokens(domain):\n    tokens = set()\n    for label in domain.split(\".\"):\n        if label in (\"co\", \"com\", \"net\", \"org\", \"jp\", \"uk\", \"de\", \"fr\", \"io\",\n                     \"ne\", \"or\", \"ac\", \"go\", \"info\", \"biz\"):\n            continue\n        for tok in re.split(r\"[^a-z0-9]+\", label):\n            if len(tok) >= 3:\n                tokens.add(tok)\n    return tokens\n\n\ndef _amounts_summary(amounts, limit=6):\n    parts = []\n    for a in amounts[:limit]:\n        cur = a.currency or \"\"\n        parts.append(f\"{cur} {fmt_money(a.value)}\".strip())\n    return \", \".join(parts)\n\n\ndef _totals_by_currency(amounts):\n    totals = {}\n    for a in amounts:\n        if a.kind == \"total\":\n            totals.setdefault(a.currency, set()).add(a.value)\n    return totals\n\n\n# ---------------------------------------------------------------------------\n# individual checks\n# ---------------------------------------------------------------------------\n\ndef _check_attach(inp, findings):\n    body_low = to_half(inp.body).lower()\n    mentions_attach = any(w in body_low for w in ATTACH_WORDS)\n    mentions_doc = any(w in body_low for w in DOC_WORDS) or \\\n        any(w in to_half(inp.subject).lower() for w in DOC_WORDS)\n    n = len(inp.attachments)\n    if n == 0 and (mentions_attach or mentions_doc):\n        findings.append(Finding(\"attach\", RED, \"r_attach_missing\"))\n    elif n > 0 and not mentions_attach and not mentions_doc:\n        findings.append(Finding(\"attach\", YELLOW, \"r_attach_no_mention\",\n                                {\"count\": n}))\n    elif n == 0:\n        findings.append(Finding(\"attach\", YELLOW, \"r_attach_none_no_mention\"))\n    else:\n        findings.append(Finding(\"attach\", GREEN, \"r_attach_ok\", {\"count\": n}))\n\n\ndef _check_amounts(inp, body_amounts, findings):\n    expected = extract_amounts(inp.expected_amount)\n    exp_plain = None\n    if not expected and inp.expected_amount.strip():\n        exp_plain = parse_number(to_half(inp.expected_amount))\n    atts = inp.attachments\n    if expected or exp_plain is not None:\n        exp = expected[0] if expected else None\n        exp_val = exp.value if exp else exp_plain\n        exp_cur = exp.currency if exp else \"\"\n        targets = [(inp.labels[\"body\"], body_amounts)]\n        targets += [(a.name, a.amounts) for a in atts]\n        bad = []\n        for label, amounts in targets:\n            pool = [a for a in amounts\n                    if not exp_cur or not a.currency or a.currency == exp_cur]\n            if not pool:\n                bad.append(f\"{label}: -\")\n            elif not any(a.value == exp_val for a in pool):\n                bad.append(f\"{label}: {_amounts_summary(pool)}\")\n        if bad:\n            findings.append(Finding(\n                \"amount\", RED, \"r_amount_expected_mismatch\",\n                {\"expected\": f\"{exp_cur} {fmt_money(exp_val)}\".strip()},\n                \" / \".join(bad)))\n        else:\n            findings.append(Finding(\n                \"amount\", GREEN, \"r_amount_expected_ok\",\n                {\"expected\": f\"{exp_cur} {fmt_money(exp_val)}\".strip()}))\n        return\n    if not body_amounts and all(not a.amounts for a in atts):\n        findings.append(Finding(\"amount\", YELLOW, \"r_amount_none\"))\n        return\n    if body_amounts and atts and all(not a.amounts for a in atts if a.readable):\n        findings.append(Finding(\"amount\", YELLOW, \"r_amount_att_none\",\n                                {}, _amounts_summary(body_amounts)))\n        return\n    if not body_amounts and atts and any(a.amounts for a in atts):\n        findings.append(Finding(\"amount\", YELLOW, \"r_amount_body_none\",\n                                {}, \" / \".join(\n                                    f\"{a.name}: {_amounts_summary(a.amounts)}\"\n                                    for a in atts if a.amounts)))\n        return\n    body_totals = _totals_by_currency(body_amounts)\n    worst_level = GREEN\n    evid = []\n    for a in atts:\n        if not a.readable:\n            continue\n        att_totals = _totals_by_currency(a.amounts)\n        if body_totals and att_totals:\n            shared = set(body_totals) & set(att_totals)\n            if not shared:\n                evid.append(f\"{a.name}: {_amounts_summary(a.amounts)}\")\n                worst_level = RED\n                continue\n            for cur in shared:\n                if body_totals[cur] != att_totals[cur]:\n                    evid.append(\n                        f\"{inp.labels['body']}: {cur} \"\n                        f\"{', '.join(fmt_money(v) for v in sorted(body_totals[cur]))}\"\n                        f\" / {a.name}: {cur} \"\n                        f\"{', '.join(fmt_money(v) for v in sorted(att_totals[cur]))}\")\n                    worst_level = RED\n        elif body_totals or att_totals:\n            pool_body = {a2.value for a2 in body_amounts}\n            pool_att = {a2.value for a2 in a.amounts}\n            if pool_body & pool_att:\n                evid.append(f\"{a.name}: {_amounts_summary(a.amounts)}\")\n            else:\n                evid.append(f\"{a.name}: {_amounts_summary(a.amounts)}\")\n                if worst_level != RED:\n                    worst_level = YELLOW\n        else:\n            pool_body = {a2.value for a2 in body_amounts}\n            pool_att = {a2.value for a2 in a.amounts}\n            if pool_body & pool_att:\n                evid.append(f\"{a.name}: {_amounts_summary(a.amounts)}\")\n            else:\n                evid.append(f\"{a.name}: {_amounts_summary(a.amounts)}\")\n                if worst_level != RED:\n                    worst_level = YELLOW\n    if worst_level == RED:\n        findings.append(Finding(\"amount\", RED, \"r_amount_mismatch\", {},\n                                \" / \".join(evid)))\n    elif worst_level == YELLOW:\n        findings.append(Finding(\"amount\", YELLOW, \"r_amount_unmatched\", {},\n                                \" / \".join(evid)))\n    else:\n        findings.append(Finding(\n            \"amount\", GREEN, \"r_amount_ok\",\n            {\"body\": _amounts_summary(body_amounts)},\n            \" / \".join(evid)))\n\n\ndef _check_dates(inp, body_dates, findings):\n    exp_dates = extract_dates(inp.expected_date)\n    if exp_dates:\n        exp = exp_dates[0].day\n        targets = [(inp.labels[\"body\"], body_dates)]\n        targets += [(a.name, a.dates) for a in inp.attachments]\n        bad = []\n        for label, dates in targets:\n            if dates and all(d.day != exp for d in dates):\n                bad.append(f\"{label}: {', '.join(str(d.day) for d in dates)}\")\n        if bad:\n            findings.append(Finding(\"date\", YELLOW, \"r_date_expected_mismatch\",\n                                    {\"expected\": str(exp)}, \" / \".join(bad)))\n        else:\n            findings.append(Finding(\"date\", GREEN, \"r_date_expected_ok\",\n                                    {\"expected\": str(exp)}))\n        return\n    if not body_dates and all(not a.dates for a in inp.attachments):\n        findings.append(Finding(\"date\", GREEN, \"r_date_none\"))\n        return\n    level = GREEN\n    evid = []\n    for a in inp.attachments:\n        if not a.readable:\n            continue\n        for kind in (\"deadline\", \"validity\", \"generic\"):\n            bset = {d.day for d in body_dates if d.kind == kind}\n            aset = {d.day for d in a.dates if d.kind == kind}\n            if bset and aset and not (bset & aset):\n                evid.append(\n                    f\"{kind}: {inp.labels['body']} \"\n                    f\"{', '.join(str(d) for d in sorted(bset))} / {a.name} \"\n                    f\"{', '.join(str(d) for d in sorted(aset))}\")\n                level = worst(level, RED if kind in (\"deadline\", \"validity\")\n                              else YELLOW)\n    if level == RED:\n        findings.append(Finding(\"date\", RED, \"r_date_deadline_mismatch\", {},\n                                \" / \".join(evid)))\n    elif level == YELLOW:\n        findings.append(Finding(\"date\", YELLOW, \"r_date_mismatch\", {},\n                                \" / \".join(evid)))\n    else:\n        findings.append(Finding(\"date\", GREEN, \"r_date_ok\"))\n\n\ndef _check_companies(inp, body_companies, findings):\n    exp_norm = normalize_company(inp.expected_company) \\\n        if inp.expected_company.strip() else \"\"\n    att_companies = {}\n    for a in inp.attachments:\n        if a.readable:\n            att_companies[a.name] = a.companies\n    if exp_norm:\n        in_body = exp_norm in body_companies\n        in_att = any(exp_norm in c for c in att_companies.values())\n        if in_body or in_att:\n            findings.append(Finding(\"company\", GREEN, \"r_company_expected_ok\",\n                                    {\"company\": inp.expected_company}))\n        else:\n            seen = list(body_companies.values()) + \\\n                [v for c in att_companies.values() for v in c.values()]\n            findings.append(Finding(\n                \"company\", YELLOW, \"r_company_expected_notfound\",\n                {\"company\": inp.expected_company}, \", \".join(seen[:4])))\n        return\n    if not body_companies and not any(att_companies.values()):\n        findings.append(Finding(\"company\", GREEN, \"r_company_none\"))\n        return\n    level = GREEN\n    evid = []\n    for name, companies in att_companies.items():\n        if not companies:\n            findings.append(Finding(\"company\", YELLOW,\n                                    \"r_company_att_none\", {\"file\": name}))\n            level = worst(level, YELLOW)\n            continue\n        if not body_companies:\n            continue\n        if set(body_companies) & set(companies):\n            evid.append(f\"{name}: {', '.join(companies.values())}\")\n            continue\n        same_script = any(\n            _script_of(b) == _script_of(a)\n            for b in body_companies for a in companies)\n        evid.append(\n            f\"{inp.labels['body']}: {', '.join(body_companies.values())} / \"\n            f\"{name}: {', '.join(companies.values())}\")\n        level = worst(level, RED if same_script else YELLOW)\n    if any(f.check == \"company\" for f in findings):\n        return\n    if level == RED:\n        findings.append(Finding(\"company\", RED, \"r_company_mismatch\", {},\n                                \" / \".join(evid)))\n    elif level == YELLOW:\n        findings.append(Finding(\"company\", YELLOW, \"r_company_script\", {},\n                                \" / \".join(evid)))\n    else:\n        findings.append(Finding(\"company\", GREEN, \"r_company_ok\", {},\n                                \" / \".join(evid)))\n\n\ndef _script_of(norm):\n    if re.search(r\"[぀-ヿ㐀-鿿]\", norm):\n        return \"ja\"\n    if re.search(r\"[a-z]\", norm):\n        return \"latin\"\n    if re.search(r\"[가-힯]\", norm):\n        return \"ko\"\n    if re.search(r\"[а-я]\", norm):\n        return \"cyrillic\"\n    return \"other\"\n\n\ndef _check_docnums(inp, body_docnums, findings):\n    exp_norm = normalize_docnum(inp.expected_docnum) \\\n        if inp.expected_docnum.strip() else \"\"\n    if exp_norm:\n        in_body = exp_norm in body_docnums\n        in_att = any(exp_norm in a.doc_numbers for a in inp.attachments)\n        if in_body or in_att:\n            findings.append(Finding(\"docnum\", GREEN, \"r_docnum_expected_ok\",\n                                    {\"docnum\": inp.expected_docnum}))\n        else:\n            findings.append(Finding(\"docnum\", RED, \"r_docnum_expected_mismatch\",\n                                    {\"docnum\": inp.expected_docnum}))\n        return\n    if not body_docnums:\n        findings.append(Finding(\"docnum\", GREEN, \"r_docnum_none\"))\n        return\n    level = GREEN\n    evid = []\n    for a in inp.attachments:\n        if not a.readable or not a.doc_numbers:\n            continue\n        if set(body_docnums) & set(a.doc_numbers):\n            evid.append(f\"{a.name}: {', '.join(a.doc_numbers.values())}\")\n        else:\n            evid.append(\n                f\"{inp.labels['body']}: {', '.join(body_docnums.values())} / \"\n                f\"{a.name}: {', '.join(a.doc_numbers.values())}\")\n            level = RED\n    if level == RED:\n        findings.append(Finding(\"docnum\", RED, \"r_docnum_mismatch\", {},\n                                \" / \".join(evid)))\n    else:\n        findings.append(Finding(\"docnum\", GREEN, \"r_docnum_ok\", {},\n                                \" / \".join(evid)))\n\n\ndef _check_domain(inp, body_companies, findings):\n    emails = parse_emails(inp.recipients_text)\n    if not emails:\n        findings.append(Finding(\"domain\", RED, \"r_no_recipient\"))\n        return\n    domains = sorted({_domain_of(e) for e in emails})\n    exp_domain = to_half(inp.expected_domain).strip().lower().lstrip(\"@\")\n    if exp_domain:\n        bad = [d for d in domains if d != exp_domain]\n        if bad:\n            findings.append(Finding(\n                \"domain\", RED, \"r_domain_expected_mismatch\",\n                {\"expected\": exp_domain}, \", \".join(domains)))\n        else:\n            findings.append(Finding(\"domain\", GREEN, \"r_domain_expected_ok\",\n                                    {\"expected\": exp_domain}))\n        return\n    comp_tokens = set()\n    sources = list(body_companies.keys())\n    if inp.expected_company.strip():\n        sources.append(normalize_company(inp.expected_company))\n    for a in inp.attachments:\n        sources += list(a.companies.keys())\n    for s in sources:\n        comp_tokens |= company_tokens(s)\n    # A domain label that is exactly the full normalized company name\n    # (e.g. company \"Alphacorp\" vs domain alphacorp.co.jp) also counts as\n    # an exact match - still exact-after-normalization, never similarity.\n    comp_norms = {s for s in sources if s}\n    level = GREEN\n    evid = []\n    for d in domains:\n        if d in FREEMAIL_DOMAINS:\n            findings.append(Finding(\"domain\", YELLOW, \"r_domain_freemail\",\n                                    {\"domain\": d}))\n            level = worst(level, YELLOW)\n            continue\n        dtoks = _domain_tokens(d)\n        if comp_tokens and ((comp_tokens & dtoks) or (comp_norms & dtoks)):\n            evid.append(d)\n        elif comp_tokens:\n            findings.append(Finding(\"domain\", YELLOW, \"r_domain_mismatch\",\n                                    {\"domain\": d}))\n            level = worst(level, YELLOW)\n        else:\n            findings.append(Finding(\"domain\", YELLOW,\n                                    \"r_domain_unverifiable\", {\"domain\": d}))\n            level = worst(level, YELLOW)\n    if level == GREEN:\n        findings.append(Finding(\"domain\", GREEN, \"r_domain_ok\", {},\n                                \", \".join(evid)))\n\n\n# ---------------------------------------------------------------------------\n# filename / version checks\n# ---------------------------------------------------------------------------\n\n_FILENAME_DATE_PATTERNS = [\n    re.compile(r\"(20\\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])\"),\n    re.compile(r\"(20\\d{2})[-_.](\\d{1,2})[-_.](\\d{1,2})\"),\n]\n_DRAFT_TOKENS = (\"draft\", \"下書き\", \"旧\", \"old\", \"修正前\", \"仮版\", \"temp\",\n                 \"bak\", \"entwurf\", \"brouillon\", \"borrador\", \"bozza\",\n                 \"rascunho\", \"черновик\", \"초안\", \"草稿\")\n_VERSION_RE = re.compile(r\"(?:^|[_\\-\\s])v(?:er)?[\\s_\\-]?(\\d+)\", re.IGNORECASE)\n\n\ndef extract_filename_dates(name):\n    out = []\n    for pat in _FILENAME_DATE_PATTERNS:\n        for m in pat.finditer(to_half(name)):\n            try:\n                out.append(datetime.date(int(m.group(1)), int(m.group(2)),\n                                         int(m.group(3))))\n            except ValueError:\n                pass\n    return out\n\n\ndef _filename_base_key(name):\n    stem = os.path.splitext(to_half(name))[0].lower()\n    stem = _FILENAME_DATE_PATTERNS[0].sub(\"\", stem)\n    stem = _FILENAME_DATE_PATTERNS[1].sub(\"\", stem)\n    stem = _VERSION_RE.sub(\"\", stem)\n    for tok in _DRAFT_TOKENS:\n        stem = stem.replace(tok, \"\")\n    return re.sub(r\"[^a-z0-9぀-ヿ㐀-鿿]+\", \"\", stem)\n\n\ndef suggest_rename(att):\n    stem, ext = os.path.splitext(att.name)\n    ascii_stem = re.sub(r\"[^A-Za-z0-9]+\", \"_\", to_half(stem)).strip(\"_\")\n    ascii_stem = re.sub(r\"_+\", \"_\", ascii_stem)\n    if len(ascii_stem) < 3:\n        docnums = list(att.doc_numbers.values())\n        if docnums:\n            ascii_stem = re.sub(r\"[^A-Za-z0-9]+\", \"-\", docnums[0])\n        else:\n            ascii_stem = \"document\"\n    fdates = extract_filename_dates(att.name)\n    if fdates and str(fdates[0].year) not in ascii_stem:\n        ascii_stem += \"_\" + fdates[0].strftime(\"%Y%m%d\")\n    return ascii_stem + ext.lower()\n\n\ndef _check_version_and_filename(inp, body_dates, findings, renames):\n    all_dates = list(body_dates)\n    for a in inp.attachments:\n        all_dates += a.dates\n    generic_dates = [d.day for d in all_dates if d.kind == \"generic\"]\n    all_days = [d.day for d in all_dates]\n    charset = COUNTRY_CHARSETS.get(inp.country, \"utf-8\")\n    version_level = GREEN\n    # duplicate / multiple versions of the same document\n    base_map = {}\n    for a in inp.attachments:\n        base_map.setdefault(_filename_base_key(a.name), []).append(a)\n    for base, group in base_map.items():\n        if len(group) > 1 and base:\n            names = \", \".join(g.name for g in group)\n            findings.append(Finding(\"version\", RED, \"r_version_duplicate\",\n                                    {}, names))\n            version_level = RED\n    docnum_map = {}\n    for a in inp.attachments:\n        for dn in a.doc_numbers:\n            docnum_map.setdefault(dn, []).append(a)\n    for dn, group in docnum_map.items():\n        if len(group) > 1:\n            names = \", \".join(g.name for g in group)\n            if not any(f.reason_key == \"r_version_duplicate\"\n                       and f.evidence == names for f in findings):\n                findings.append(Finding(\"version\", RED, \"r_version_duplicate\",\n                                        {}, names))\n                version_level = RED\n    for a in inp.attachments:\n        stem_low = to_half(a.name).lower()\n        fdates = extract_filename_dates(a.name)\n        for fd in fdates:\n            if all_days and fd < max(all_days):\n                gap = (max(all_days) - fd).days\n                lvl = RED if gap >= 30 else YELLOW\n                findings.append(Finding(\n                    \"version\", lvl, \"r_version_filename_old\",\n                    {\"file\": a.name, \"filedate\": str(fd),\n                     \"newest\": str(max(all_days))}))\n                version_level = worst(version_level, lvl)\n        draft_hit = [t for t in _DRAFT_TOKENS if t in stem_low]\n        if draft_hit:\n            findings.append(Finding(\"version\", YELLOW, \"r_version_draft\",\n                                    {\"file\": a.name, \"token\": draft_hit[0]}))\n            version_level = worst(version_level, YELLOW)\n        elif _VERSION_RE.search(stem_low):\n            findings.append(Finding(\"version\", YELLOW, \"r_version_token\",\n                                    {\"file\": a.name}))\n            version_level = worst(version_level, YELLOW)\n        if a.mtime and generic_dates:\n            mday = datetime.date.fromtimestamp(a.mtime)\n            if (max(generic_dates) - mday).days >= 90:\n                findings.append(Finding(\"version\", YELLOW, \"r_version_mtime\",\n                                        {\"file\": a.name, \"mtime\": str(mday)}))\n                version_level = worst(version_level, YELLOW)\n        # ---- filename mojibake / safety ----\n        name = a.name\n        issues = []\n        has_japanese = bool(re.search(r\"[぀-ヿ㐀-鿿]\", name))\n        if has_japanese and inp.country != \"JP\":\n            issues.append((\"r_filename_japanese\", YELLOW))\n        if charset != \"utf-8\":\n            try:\n                name.encode(charset)\n            except (UnicodeEncodeError, LookupError):\n                if not has_japanese:\n                    issues.append((\"r_filename_unencodable\", YELLOW))\n        if re.search(r\"[\\U0001F000-\\U0001FAFF☀-➿]\", name) or \\\n                re.search(r\"[ｦ-ﾝ]\", to_half(name)) or \"〜\" in name or \"～\" in name:\n            issues.append((\"r_filename_emoji\", YELLOW))\n        if \"　\" in name or re.search(r'[<>:\"/\\\\|?*]', name) or \\\n                name.rstrip() != name or \\\n                os.path.splitext(name)[0].endswith(\".\"):\n            issues.append((\"r_filename_forbidden\", YELLOW))\n        if len(name) > 100:\n            issues.append((\"r_filename_long\", YELLOW))\n        for key, lvl in issues:\n            findings.append(Finding(\"filename\", lvl, key, {\"file\": name}))\n        if issues:\n            renames[a.path] = suggest_rename(a)\n    if version_level == GREEN:\n        findings.append(Finding(\"version\", GREEN, \"r_version_ok\"))\n    if not any(f.check == \"filename\" for f in findings):\n        findings.append(Finding(\"filename\", GREEN, \"r_filename_ok\"))\n\n\ndef _check_readable(inp, findings):\n    for a in inp.attachments:\n        if not a.readable:\n            findings.append(Finding(\"readable\", YELLOW, \"r_unreadable\",\n                                    {\"file\": a.name}))\n        elif a.via_ocr:\n            # Provenance: this attachment's text came from OCR.\n            findings.append(Finding(\"readable\", GREEN, \"r_read_via_ocr\",\n                                    {\"file\": a.name}, \"OCR\"))\n    if not any(f.check == \"readable\" for f in findings) and inp.attachments:\n        findings.append(Finding(\"readable\", GREEN, \"r_readable_ok\"))\n\n\ndef _check_ocr_caution(inp, findings):\n    \"\"\"Advisory row shown once when any attachment was read through OCR.\n\n    It is deliberately excluded from the overall traffic light (see\n    run_checks): matching content stays green, but the user is always\n    reminded that OCR can misread and numbers must be compared against\n    the original document.\n    \"\"\"\n    ocr_files = [a.name for a in inp.attachments if a.via_ocr]\n    if ocr_files:\n        joined = \", \".join(ocr_files)\n        findings.append(Finding(\"ocr\", YELLOW, \"r_ocr_caution\",\n                                {\"files\": joined}, joined))\n\n\n# ---------------------------------------------------------------------------\n# main entry\n# ---------------------------------------------------------------------------\n\ndef run_checks(inp):\n    findings = []\n    renames = {}\n    body_amounts = extract_amounts(inp.body + \"\\n\" + inp.subject)\n    body_dates = extract_dates(inp.body + \"\\n\" + inp.subject)\n    body_companies = extract_companies(inp.body + \"\\n\" + inp.subject)\n    body_docnums = extract_doc_numbers(inp.body + \"\\n\" + inp.subject)\n\n    _check_attach(inp, findings)\n    _check_amounts(inp, body_amounts, findings)\n    _check_dates(inp, body_dates, findings)\n    _check_companies(inp, body_companies, findings)\n    _check_docnums(inp, body_docnums, findings)\n    _check_domain(inp, body_companies, findings)\n    _check_version_and_filename(inp, body_dates, findings, renames)\n    _check_readable(inp, findings)\n    _check_ocr_caution(inp, findings)\n\n    findings.sort(key=lambda f: (CHECK_ORDER.index(f.check)\n                                 if f.check in CHECK_ORDER else 99,\n                                 -LEVEL_ORDER[f.level]))\n    # The OCR caution row is advisory only and never changes the light.\n    judged = [f.level for f in findings if f.check != \"ocr\"]\n    overall = worst(*judged) if judged else GREEN\n    return Report(overall=overall, findings=findings, rename_suggestions=renames)\n\n\ndef export_renamed_copies(renames, attachments, out_dir):\n    \"\"\"Copy attachments to out_dir under their suggested safe names.\n    Only called when the user explicitly presses the button.\"\"\"\n    os.makedirs(out_dir, exist_ok=True)\n    by_path = {a.path: a for a in attachments}\n    written = []\n    for path, new_name in renames.items():\n        if path not in by_path:\n            continue\n        dest = os.path.join(out_dir, new_name)\n        base, ext = os.path.splitext(dest)\n        n = 2\n        while os.path.exists(dest):\n            dest = f\"{base}_{n}{ext}\"\n            n += 1\n        shutil.copyfile(path, dest)\n        written.append(dest)\n    return written\n"}, {"path": "i18n.py", "sizestr": "121.9 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"i18n for TashikaMail - 13 languages, same structure/order as the\nuser's other apps. The app title itself comes from appinfo.py\n(Japanese UI: the Japanese name; other languages: TashikaMail).\"\"\"\n\nLANG_ORDER = [\"ja\", \"en\", \"es\", \"zh_CN\", \"fr\", \"de\", \"pt\", \"ru\", \"it\",\n              \"tr\", \"ar\", \"id\", \"ko\"]\nLANG_NAMES = {\n    \"ja\": \"日本語\", \"en\": \"English\", \"es\": \"Español\", \"zh_CN\": \"简体中文\",\n    \"fr\": \"Français\", \"de\": \"Deutsch\", \"pt\": \"Português\", \"ru\": \"Русский\",\n    \"it\": \"Italiano\", \"tr\": \"Türkçe\", \"ar\": \"العربية\",\n    \"id\": \"Bahasa Indonesia\", \"ko\": \"한국어\",\n}\nRTL_LANGS = {\"ar\"}\n\nJA = {\n    \"app_subtitle\": \"見積書・請求書メールを、送る前にチェックするアプリ\",\n    \"lang_label\": \"表示言語:\",\n    \"hdr_input\": \"✉️ メールの内容\",\n    \"hdr_attach\": \"📎 添付ファイル\",\n    \"hdr_expected\": \"✅ 確認用の正解（任意）\",\n    \"hdr_results\": \"🚦 検査結果\",\n    \"lbl_to\": \"宛先メールアドレス\",\n    \"lbl_subject\": \"件名\",\n    \"lbl_body\": \"本文\",\n    \"lbl_country\": \"相手の国（ファイル名の文字化け検査用）\",\n    \"lbl_exp_company\": \"相手先の会社名\",\n    \"lbl_exp_domain\": \"期待するドメイン\",\n    \"lbl_exp_amount\": \"金額\",\n    \"lbl_exp_date\": \"日付\",\n    \"lbl_exp_docnum\": \"文書番号\",\n    \"expected_hint\": \"分かる範囲で入力すると、その値を最優先で照合します。空欄の項目は本文と添付の相互照合のみを行います。\",\n    \"ph_to\": \"例: taro@example.co.jp, hanako@example.com\",\n    \"btn_open_body\": \"📂 本文/EMLファイルを開く\",\n    \"btn_add_files\": \"＋ 添付を追加\",\n    \"btn_remove_file\": \"選択を削除\",\n    \"btn_check\": \"🔍 検査する\",\n    \"btn_export_rename\": \"💾 安全な名前でコピーを書き出す\",\n    \"btn_clear\": \"全部クリア\",\n    \"drop_hint\": \"ここにファイルをドロップできます（.eml は宛先・件名・本文・添付に自動で分解します）\",\n    \"overall_none\": \"まだ検査していません\",\n    \"overall_green\": \"🟢 問題なし\",\n    \"overall_yellow\": \"🟡 注意が必要です\",\n    \"overall_red\": \"🔴 止めた方がいいです\",\n    \"overall_hint_green\": \"確認した範囲では問題は見つかりませんでした。最後は人が目で確認してから送ってください。\",\n    \"overall_hint_yellow\": \"注意点があります。下の理由を確認してから、送るかどうか決めてください。\",\n    \"overall_hint_red\": \"重大な食い違いがあります。送る前に必ず直してください。\",\n    \"col_level\": \"判定\",\n    \"col_check\": \"検査項目\",\n    \"col_reason\": \"理由\",\n    \"col_evidence\": \"根拠\",\n    \"level_green\": \"🟢 問題なし\",\n    \"level_yellow\": \"🟡 注意\",\n    \"level_red\": \"🔴 危険\",\n    \"chk_attach\": \"添付ファイル\",\n    \"chk_amount\": \"金額\",\n    \"chk_date\": \"日付\",\n    \"chk_company\": \"会社名\",\n    \"chk_docnum\": \"文書番号\",\n    \"chk_domain\": \"宛先ドメイン\",\n    \"chk_version\": \"古い版の可能性\",\n    \"chk_filename\": \"ファイル名の安全性\",\n    \"chk_readable\": \"添付の読み取り\",\n    \"footer_note\": \"このアプリはメールを送信しません。検査だけを行い、送るかどうかは人が自分のメールソフトで決めます。画像やスキャンPDFは内蔵OCR（Tesseract）で読み取りますが、OCRは誤
