file}'에 전각 공백이나 사용할 수 없는 문자·형식이 포함되어 있습니다\",\n    \"r_filename_long\": \"파일 '{file}'의 이름이 너무 깁니다\",\n    \"r_filename_ok\": \"파일명에 깨짐 등의 문제가 없습니다\",\n    \"r_unreadable\": \"첨부 '{file}'의 문자를 읽지 못했습니다 (이미지·스캔 등). 내용은 사람이 확인하세요\",\n    \"r_readable_ok\": \"모든 첨부에서 문자를 읽었습니다\",\n    \"chk_ocr\": \"OCR 안내\",\n    \"r_read_via_ocr\": \"첨부 파일 '{file}'을(를) OCR로 읽었습니다\",\n    \"r_ocr_caution\": \"OCR로 읽은 숫자는 원본과 대조해 주세요 (파일: {files})\",\n    \"ocr_badge\": \" (OCR로 읽음)\",\n    \"progress_checking\": \"검사 중… (OCR 처리에 시간이 걸릴 수 있습니다)\",\n    \"progress_reading\": \"읽는 중: {file}\",\n}\n\nSTRINGS = {\n    \"ja\": JA, \"en\": EN, \"es\": ES, \"zh_CN\": ZH_CN, \"fr\": FR, \"de\": DE,\n    \"pt\": PT, \"ru\": RU, \"it\": IT, \"tr\": TR, \"ar\": AR, \"id\": ID, \"ko\": KO,\n}\n\n\ndef tr(lang, key, **params):\n    table = STRINGS.get(lang, EN)\n    text = table.get(key) or EN.get(key) or JA.get(key) or key\n    if params:\n        try:\n            return text.format(**params)\n        except (KeyError, IndexError, ValueError):\n            return text\n    return text\n"}, {"path": "MakeApp-Mac.command", "sizestr": "2.7 KB", "content": "#!/bin/bash\n# Build TashikaMail.app for macOS with PyInstaller.\n#\n# The build first tries a universal2 app (runs on both Intel and\n# Apple Silicon Macs). If that is not possible in this environment\n# (for example when Python itself is a single-architecture build),\n# it automatically falls back to a native build for this Mac.\n# The finished app appears as dist/TashikaMail.app.\n#\n# The app is NOT code-signed. On first launch, right-click\n# TashikaMail.app and choose \"Open\" to pass the Gatekeeper prompt.\n\ncd \"$(dirname \"$0\")\" || exit 1\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found. Please extract the whole ZIP first.\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"\"\n  echo \"Install Python 3 in one of these ways, then run this file again:\"\n  echo \"  1) Download the macOS installer from\"\n  echo \"     https://www.python.org/downloads/macos/\"\n  echo \"  2) Or, if you use Homebrew:  brew install python\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nVENV=\".venv-mac\"\nif [ ! -x \"$VENV/bin/python\" ]; then\n  echo \"Creating a Python environment (first run only)...\"\n  if ! python3 -m venv \"$VENV\"; then\n    echo \"\"\n    echo \"Failed to create the Python environment.\"\n    read -r -p \"Press Enter to close this window.\"\n    exit 1\n  fi\nfi\nPY=\"$VENV/bin/python\"\n\necho \"Installing required libraries and PyInstaller...\"\nif ! \"$PY\" -m pip install -r requirements.txt pyinstaller; then\n  echo \"\"\n  echo \"Installation failed. Check your network connection\"\n  echo \"and run this file again.\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nARCH_LABEL=\"\"\necho \"\"\necho \"Trying a universal2 build (Intel + Apple Silicon)...\"\nif \"$PY\" -m PyInstaller --noconfirm --windowed \\\n      --name TashikaMail --icon assets/icon.icns --target-arch universal2 app.py; then\n  ARCH_LABEL=\"universal2 (Intel + Apple Silicon)\"\nelse\n  echo \"\"\n  echo \"The universal2 build did not work in this environment.\"\n  echo \"Falling back to a native build for this Mac ($(uname -m))...\"\n  rm -rf build dist TashikaMail.spec\n  if \"$PY\" -m PyInstaller --noconfirm --windowed \\\n        --name TashikaMail --icon assets/icon.icns app.py; then\n    ARCH_LABEL=\"native ($(uname -m)) - runs on this kind of Mac only\"\n  fi\nfi\n\necho \"\"\nif [ -d \"dist/TashikaMail.app\" ] && [ -n \"$ARCH_LABEL\" ]; then\n  echo \"Done: dist/TashikaMail.app\"\n  echo \"Architecture: $ARCH_LABEL\"\n  echo \"\"\n  echo \"The app is not code-signed. On first launch, right-click\"\n  echo \"TashikaMail.app and choose \\\"Open\\\" (Gatekeeper).\"\nelse\n  echo \"The build failed. See the messages above.\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\nread -r -p \"Press Enter to close this window.\"\n"}, {"path": "README-SOURCE.txt", "sizestr": "1.1 KB", "content": "TashikaMail - Source Code (version 1.1.0)\n============================================================\nThis ZIP contains the full source code of TashikaMail, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-TashikaMail.bat (or: python app.py)\n- Mac: Start-TashikaMail.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\nNotes:\nOCR機能にはTesseract（別途インストール）が必要です。配布中のアプリ版には同梱済みです。\nThe OCR features require Tesseract (installed separately). The distributed app builds include it.\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"path": "README.txt", "sizestr": "9.2 KB", "content": "たしかめーる (TashikaMail) - 見積書・請求書メール送信前チェックアプリ\n====================================================================\n\n■ このアプリは何をするもの？\n見積書や請求書をメールで送る直前の不安（添付忘れ、別の会社への誤送信、\n本文と添付の金額の食い違い、古い版のファイルの添付、相手の国で文字化け\nするファイル名）を、送信前にチェックするデスクトップアプリです\n（Windows / Mac 両対応）。\n\n送ろうとしているメールの「宛先・件名・本文」と「添付ファイル」をこの\nアプリに放り込むと、本文と添付の中身から金額・日付・会社名・文書番号を\n抜き出して突き合わせ、結果を信号色で表示します。\n　緑＝問題なし／黄＝注意／赤＝止めた方がいい\n各検査には理由と根拠（本文の値 vs 添付の値など）が並びます。\n\n■ 大事なこと\n・このアプリはメールを送信しません。送信機能そのものがありません。\n　結果を見て、実際に送るかどうかは人が自分のメールソフトで決めます。\n・インターネット接続なしで動きます。外部にデータを送信しません。\n・照合は「正規化した後に完全一致」だけです。似ている名前を候補にする\n　曖昧な（ファジー）照合は一切しません。\n\n■ 使い方\n1. 宛先メールアドレス、件名、本文を入力します。\n   - .emlファイルをドロップ（または「本文/EMLファイルを開く」）すると、\n     宛先・件名・本文・添付ファイルを自動で分解して全部セットします。\n   - 本文は .txt ファイルからも読み込めます。\n2. 添付ファイルをドロップ（または「添付を追加」）します。\n   対応形式：PDF、.xlsx、.csv、.txt、.docx、画像（png/jpg/jpeg/tif/\n   tiff/bmp/gif/webp）、および .eml の中の添付。\n   画像とスキャンPDF（テキスト層のないページ）は内蔵OCRで読み取り\n   ます（後述）。\n3. 分かる場合は「確認用の正解」に相手先の会社名・期待ドメイン・金額・\n   日付・文書番号を入力します。入力した値が最優先の照合基準になります。\n4. 相手の国を選び、「検査する」を押します。\n5. 結果（信号色・理由・根拠）を見て、送るかどうかを人が決めます。\n   ファイル名に問題がある場合は、安全な英数字の名前の提案が表示され、\n   ボタンを押したときだけ、その名前でコピーを書き出します。\n\n■ 検査項目\nA. 添付忘れ（本文が言及しているのに添付0件＝赤 など）\nB. 金額の突き合わせ（合計同士を優先比較。不一致＝赤）\nC. 日付の突き合わせ（支払期限・有効期限の食い違い＝赤、その他＝黄）\nD. 会社名の突き合わせ（法人格を外して正規化し完全一致のみ）\nE. 文書番号（見積番号・請求番号など。不一致＝赤）\nF. 宛先ドメインと会社名の食い違い（フリーメールは確認不能＝黄、\n   期待ドメインと違う＝赤）\nG. 古い版の可能性（ファイル名の日付・版数・下書き語・同じ文書の複数\n   添付などを検査）\nH. ファイル名の文字化けリスク（相手の国基準。安全なリネーム案を提示）\nI. 総合判定（最も悪い項目に合わせて 緑／黄／赤）\n\n■ OCR（文字読み取り）について\n・画像添付と、スキャンPDFのテキスト層のないページは、内蔵の\n　Tesseract OCR（v5.5.3＋tessdata_fast 13言語）で読み取り、通常の\n　添付と同じ抽出・検査にかけます。テキスト層のあるページは従来通り\n　テキスト抽出するので、混在したPDFにも対応します。.eml の中の画像\n　添付・スキャンPDF添付も同じ扱いです。\n・OCRで読んだ添付は、添付リストに「（OCRで読み取り）」と表示され、\n　結果にも「OCRで読み取りました」という行と、「OCRで読み取った数字\n　は、原本と見比べてください」という注意行が出ます（注意行は助言の\n　ため、総合信号色は変えません）。\n・解決順：環境変数 TASHIKAMAIL_TESSERACT_CMD の指定 ＞ アプリの隣の\n　tesseract フォルダ（同梱版）＞ システムのPATH。OCR言語は日本語＋\n　英語＋現在の表示言語です。\n・【Macの場合】同梱のTesseractはWindows版プログラムのため、Macでは\n　使えません。MacではHomebrewで入れたTesseract\n　（/opt/homebrew/bin/tesseract、/usr/local/bin/tesseract）を自動で\n　探します。見つからない場合、OCRだけが使えず（画像・スキャンPDFは\n　「読み取れなかった」扱いになります）、画面下部に導入方法\n　（ターミナルで「brew install tesseract tesseract-lang」）が表示\n　されます。それ以外の機能は通常どおり使えます。言語データは同梱の\n　tessdataがあればそれを使い、なければTesseract本体のものを\n　使います。\n・OCR処理は時間がかかるため、「検査する」を押すと裏側で処理し、\n　読み取り中のファイル名を表示します。画面は固まりません。\n\n■ 制限（正直な明記）\n・OCRは誤読することがあります。特に小さな文字、手書き、傾いた\n　スキャン、複雑な表では読み間違いが増えます。本アプリはOCRで読ん\n　だ数字をそのまま照合に使うため、結果画面の注意行の通り、数字は\n　必ず原本と見比べてください。\n・OCRでも読み取れなかった添付は「読み取れなかった＝注意（黄）」と\n　して表示し、緑にはしません。中身は人が確認してください。\n・金額や日付は、本文・添付に書かれた表記からの抽出です。書式が大きく\n　崩れた文書では抜き出せない場合があり、その場合は「確認できません\n　でした」という注意表示になります。\n・ドメインと会社名の照合は、英字化できる会社名の範囲で行います。\n　日本語のみの会社名ではドメイン確認ができないため注意表示になります。\n・グループ会社など、ドメインと会社名が一致しない正当な場合もあります。\n　そのためFの不一致は（期待ドメインを入力した場合を除き）断定せず\n　「食い違いの可能性」として黄で表示します。\n\n■ 起動方法（Windows・ソース版）\n・同梱の Start-TashikaMail.bat をダブルクリックしてください。\n　（初回だけ必要なライブラリを自動で入れます）\n・手動の場合：python app.py\n　必要なライブラリは requirements.txt の通りです。\n\n■ 起動方法（Mac・ソース版）\n・同梱の Start-TashikaMail.command をダブルクリックしてください。\n　初回だけ、このフォルダの中に専用のPython環境（.venv-mac）を\n　自動で作り、必要なライブラリを入れます。\n・Macに Python 3 が入っていない場合は、その旨と入手方法\n　（python.org のインストーラ、または Homebrew の\n　「brew install python」）が表示されて終了します。\n・手動の場合：python3 app.py\n　必要なライブラリは requirements.txt の通りです。\n\n■ Mac用アプリ（.app）の作り方\n1. このZIPをダウンロードして展開します。\n2. 展開したフォルダの中の MakeApp-Mac.command をダブルクリック\n　します（初回はライブラリとPyInstallerの導入で少し時間が\n　かかります）。\n3. 成功すると dist フォルダの中に TashikaMail.app ができます。\n　以降はこの .app をダブルクリックするだけで起動できます。\n・チップ（CPU）について：まず Intel / Appleシリコン両対応の\n　universal2 で作成を試み、環境によって作れない場合は、そのMacの\n　チップ専用（ネイティブ）で自動的に作り直します。どちらで作れた\n　かは、最後に画面に表示されます。ネイティブ版は、作ったMacと\n　同じチップのMacでのみ動きます。\n・対応OS：macOS 11（Big Sur）以降です。\n・このアプリは未署名のため、初回起動時にGatekeeperの確認が出ます。\n　TashikaMail.app を右クリックして「開く」を選んでください。\n・Mac版は開発環境にMac実機がないため、実機での動作確認は未実施\n　です。Windows版と同じソースコードで動作します。\n\n■ 表示言語\n日本語・English・Español・简体中文・Français・Deutsch・Português・\nРусский・Italiano・Türkçe・العربية・Bahasa Indonesia・한국어 の13言語。\n画面右上の切替で即時に切り替わり、選択は保存されます。\nタイトルは日本語UIでは「たしかめーる」、他の言語では「TashikaMail」\nと表示されます。\n\nバージョン: 1.1.0（OCR組み込み版／Mac対応）\n"}, {"path": "requirements.txt", "sizestr": "38 B", "content": "PySide6\nPillow\nPyMuPDF\nopenpyxl\npypdf\n"}, {"path": "Start-TashikaMail.bat", "sizestr": "449 B", "content": "@echo off\r\nchcp 65001 > nul\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo app.py not found. Please extract the whole ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\npython -c \"import PySide6, pypdf, openpyxl, fitz, PIL\" 2> nul\r\nif errorlevel 1 (\r\n  echo Installing required libraries (first run only)...\r\n  python -m pip install -r requirements.txt\r\n)\r\npython app.py\r\nif errorlevel 1 (\r\n  echo.\r\n  echo TashikaMail stopped with an error. See above.\r\n  pause\r\n)\r\n"}, {"path": "Start-TashikaMail.command", "sizestr": "1.8 KB", "content": "#!/bin/bash\n# TashikaMail launcher for macOS (source version).\n# Double-click this file in Finder to start TashikaMail.\n# The first run creates a private Python environment (.venv-mac)\n# and installs the required libraries; later runs start immediately.\n\ncd \"$(dirname \"$0\")\" || exit 1\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found. Please extract the whole ZIP first.\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"\"\n  echo \"Install Python 3 in one of these ways, then run this file again:\"\n  echo \"  1) Download the macOS installer from\"\n  echo \"     https://www.python.org/downloads/macos/\"\n  echo \"  2) Or, if you use Homebrew:  brew install python\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nVENV=\".venv-mac\"\nif [ ! -x \"$VENV/bin/python\" ]; then\n  echo \"Creating a Python environment (first run only)...\"\n  if ! python3 -m venv \"$VENV\"; then\n    echo \"\"\n    echo \"Failed to create the Python environment.\"\n    echo \"If a dialog asked you to install the Command Line Tools,\"\n    echo \"install them and run this file again.\"\n    read -r -p \"Press Enter to close this window.\"\n    exit 1\n  fi\nfi\nPY=\"$VENV/bin/python\"\n\nif ! \"$PY\" -c \"import PySide6, pypdf, openpyxl, fitz, PIL\" >/dev/null 2>&1; then\n  echo \"Installing required libraries (first run only)...\"\n  if ! \"$PY\" -m pip install -r requirements.txt; then\n    echo \"\"\n    echo \"Library installation failed. Check your network connection\"\n    echo \"and run this file again.\"\n    read -r -p \"Press Enter to close this window.\"\n    exit 1\n  fi\nfi\n\n\"$PY\" app.py\nSTATUS=$?\nif [ $STATUS -ne 0 ]; then\n  echo \"\"\n  echo \"TashikaMail stopped with an error (code $STATUS). See above.\"\n  read -r -p \"Press Enter to close this window.\"\nfi\nexit $STATUS\n"}, {"path": "tests/smoke_gui.py", "sizestr": "4.3 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"GUI smoke test + screenshots (offscreen). Workspace-scoped only.\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nos.chdir(os.path.join(os.path.dirname(__file__), \"..\"))\n\nfrom PySide6.QtWidgets import QApplication\n\nimport app as app_module\nimport core\n\nDEMO_DIR = os.path.join(\"shots\", \"demo\")\nos.makedirs(DEMO_DIR, exist_ok=True)\n\nBODY_OK = \"\"\"Dear Alphacorp team,\n\nPlease find the invoice attached.\nInvoice No. INV-1001\nDate: 2026/11/14\nPayment due: 2026/11/30\nTotal amount: $1,100.00\n\nBest regards,\nAlphacorp Inc.\"\"\"\n\nATT_OK = \"\"\"Invoice\nInvoice No. INV-1001\nDate: 2026/11/14\nPayment due: 2026/11/30\nSubtotal $1,000.00\nTax $100.00\nTotal $1,100.00\nAlphacorp Inc.\"\"\"\n\n\ndef shot(win, name):\n    win.repaint()\n    pix = win.grab()\n    pix.save(os.path.join(\"shots\", name))\n    print(\"saved\", name, pix.width(), pix.height())\n\n\ndef run_and_wait(win, qapp):\n    import time\n    win.report = None\n    win.run_check()\n    deadline = time.time() + 120\n    while time.time() < deadline:\n        qapp.processEvents()\n        if win.report is not None and win._check_thread is None:\n            return\n        time.sleep(0.02)\n    raise AssertionError(\"check did not finish in time\")\n\n\ndef main():\n    qapp = QApplication(sys.argv)\n    win = app_module.MainWindow()\n    win.show()\n    qapp.processEvents()\n    shot(win, \"main.png\")\n\n    att_path = os.path.join(DEMO_DIR, \"invoice.txt\")\n    with open(att_path, \"w\", encoding=\"utf-8\") as fh:\n        fh.write(ATT_OK)\n    win.to_edit.setText(\"taro@alphacorp.co.jp\")\n    win.subject_edit.setText(\"Invoice INV-1001\")\n    win.body_edit.setPlainText(BODY_OK)\n    win.attachments = [core.read_attachment(att_path)]\n    win._refresh_att_list()\n    run_and_wait(win, qapp)\n    assert win.report.overall == \"green\", win.report.overall\n    shot(win, \"result_green.png\")\n\n    bad_path = os.path.join(DEMO_DIR, \"invoice_bad.txt\")\n    with open(bad_path, \"w\", encoding=\"utf-8\") as fh:\n        fh.write(ATT_OK.replace(\"$1,100.00\", \"$1,200.00\")\n                 .replace(\"INV-1001\", \"INV-1002\"))\n    win.attachments = [core.read_attachment(bad_path)]\n    win._refresh_att_list()\n    run_and_wait(win, qapp)\n    assert win.report.overall == \"red\", win.report.overall\n    shot(win, \"result_red.png\")\n\n    # ---- OCR result screen (provenance badge + caution row) ----\n    venv_py = os.path.join(os.path.dirname(__file__), \"..\", \".venv\",\n                           \"bin\", \"python\")\n    dejavu = \"/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf\"\n    if os.path.exists(venv_py) and os.path.exists(dejavu):\n        shim = os.path.join(DEMO_DIR, \"tesseract\")\n        with open(shim, \"w\", encoding=\"utf-8\") as fh:\n            fh.write(\"#!%s\\n\" % os.path.abspath(venv_py))\n            fh.write(\n                \"import sys\\n\"\n                \"args = sys.argv[1:]\\n\"\n                \"langs = args[args.index('-l') + 1]\\n\"\n                \"td = args[args.index('--tessdata-dir') + 1]\\n\"\n                \"import tesserocr\\n\"\n                \"with tesserocr.PyTessBaseAPI(path=td, lang=langs) as api:\\n\"\n                \"    api.SetImageFile(args[0])\\n\"\n                \"    sys.stdout.write(api.GetUTF8Text())\\n\")\n        os.chmod(shim, 0o755)\n        os.environ[\"TASHIKAMAIL_TESSERACT_CMD\"] = shim\n        from PIL import Image, ImageDraw, ImageFont\n        img = Image.new(\"RGB\", (1654, 1000), \"white\")\n        d = ImageDraw.Draw(img)\n        font = ImageFont.truetype(dejavu, 54)\n        y = 60\n        for line in (\"Alphacorp Inc.\", \"Invoice\", \"Invoice No. INV-1001\",\n                     \"Date: 2026/11/14\", \"Payment due: 2026/11/30\",\n                     \"Subtotal $1,000.00\", \"Tax $100.00\", \"Total $1,100.00\"):\n            d.text((80, y), line, fill=\"black\", font=font)\n            y += 105\n        img_path = os.path.join(DEMO_DIR, \"invoice_scan.png\")\n        img.save(img_path)\n        win.attachments = []\n        win.add_attachment_paths([img_path])\n        run_and_wait(win, qapp)\n        assert win.attachments[0].via_ocr, \"attachment was not OCR-read\"\n        assert win.report.overall == \"green\", win.report.overall\n        shot(win, \"result_ocr.png\")\n        print(\"OCR SCREENSHOT OK\")\n\n    # language switching smoke (incl. RTL)\n    for lang in (\"en\", \"ar\", \"ko\", \"ja\"):\n        win.apply_language(lang)\n        qapp.processEvents()\n    print(\"GUI SMOKE OK\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"path": "tests/test_ocr.py", "sizestr": "14.0 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"OCR integration tests for TashikaMail (たしかめーる).\n\nTwo layers:\n- resolution tests (fake executables, no real OCR) verify the\n  env override > bundled > PATH order, same as TranscribeGuard;\n- functional tests run REAL OCR through the app's own code path\n  (core.read_attachment -> subprocess tesseract CLI -> bundled\n  tessdata_fast) on generated invoice images / scanned PDFs.\n\nOn this Linux dev VM the bundled tesseract.exe is a Windows binary, so\nthe functional tests point TASHIKAMAIL_TESSERACT_CMD at a small shim\nthat exposes the exact tesseract CLI surface on top of tesserocr\n(Tesseract 5.5.4, same engine family) while still using the bundled\ntessdata_fast data. On Windows the bundled tesseract.exe 5.5.3 is used\ndirectly. Functional tests skip cleanly when no engine is available.\n\"\"\"\nimport email\nimport email.policy\nimport os\nimport sys\nimport tempfile\nimport unittest\nfrom decimal import Decimal\nfrom unittest import mock\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nimport core  # noqa: E402\nimport core_checks  # noqa: E402\n\n_TMP = tempfile.mkdtemp(prefix=\"tashikamail_ocr_test_\")\n_ENGINE_READY = False\n\nEN_LINES = [\n    \"Alphacorp Inc.\",\n    \"Invoice\",\n    \"Invoice No. INV-1001\",\n    \"Date: 2026/11/14\",\n    \"Payment due: 2026/11/30\",\n    \"Subtotal $1,000.00\",\n    \"Tax $100.00\",\n    \"Total $1,100.00\",\n]\nJA_LINES = [\n    \"請求書\",\n    \"株式会社サクラ\",\n    \"請求番号: INV-2001\",\n    \"日付: 2026/11/14\",\n    \"合計 ¥55,000\",\n]\n\nBODY_OK = \"\"\"Dear Alphacorp team,\n\nPlease find the invoice attached.\nInvoice No. INV-1001\nDate: 2026/11/14\nPayment due: 2026/11/30\nTotal amount: $1,100.00\n\nBest regards,\nAlphacorp Inc.\"\"\"\n\nBODY_JA = \"\"\"株式会社サクラ 御中\n\n請求書を送付いたします。\n請求番号: INV-2001\n日付: 2026/11/14\n合計 ¥55,000\n\nよろしくお願いいたします。\"\"\"\n\nDEJAVU = \"/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf\"\nNOTO = \"/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc\"\n\n\ndef _write_shim():\n    shim = os.path.join(_TMP, \"tesseract\")\n    with open(shim, \"w\", encoding=\"utf-8\") as fh:\n        fh.write(\"#!%s\\n\" % sys.executable)\n        fh.write(\n            \"import sys\\n\"\n            \"args = sys.argv[1:]\\n\"\n            \"langs = args[args.index('-l') + 1] if '-l' in args else 'eng'\\n\"\n            \"td = (args[args.index('--tessdata-dir') + 1]\\n\"\n            \"      if '--tessdata-dir' in args else None)\\n\"\n            \"import tesserocr\\n\"\n            \"with tesserocr.PyTessBaseAPI(path=td, lang=langs) as api:\\n\"\n            \"    api.SetImageFile(args[0])\\n\"\n            \"    sys.stdout.write(api.GetUTF8Text())\\n\")\n    os.chmod(shim, 0o755)\n    return shim\n\n\ndef _make_image(lines, font_path, path, font_index=0):\n    from PIL import Image, ImageDraw, ImageFont\n    img = Image.new(\"RGB\", (1654, 1000), \"white\")\n    d = ImageDraw.Draw(img)\n    font = ImageFont.truetype(font_path, 54, index=font_index)\n    y = 60\n    for line in lines:\n        d.text((80, y), line, fill=\"black\", font=font)\n        y += 105\n    img.save(path)\n    return path\n\n\ndef setUpModule():\n    global _ENGINE_READY\n    if sys.platform != \"win32\":\n        try:\n            import tesserocr  # noqa: F401\n            os.environ[\"TASHIKAMAIL_TESSERACT_CMD\"] = _write_shim()\n            _ENGINE_READY = True\n        except Exception:\n            _ENGINE_READY = False\n    else:\n        _ENGINE_READY = core.ocr_available()\n\n\ndef _need_engine(testcase):\n    if not _ENGINE_READY:\n        testcase.skipTest(\"no runnable tesseract engine in this environment\")\n\n\nclass TestTesseractResolution(unittest.TestCase):\n    def test_env_override_wins(self):\n        with tempfile.TemporaryDirectory() as d:\n            fake = os.path.join(d, \"custom-tesseract\")\n            open(fake, \"w\").close()\n            bundled = os.path.join(d, \"tesseract\", \"tesseract.exe\")\n            os.makedirs(os.path.dirname(bundled))\n            open(bundled, \"w\").close()\n            found = core.find_tesseract(\n                env={\"TASHIKAMAIL_TESSERACT_CMD\": fake}, frozen=False,\n                app_dir=d, which=lambda name: \"/usr/bin/tesseract\")\n            self.assertEqual(found, fake)\n\n    def test_bundled_beats_path(self):\n        with tempfile.TemporaryDirectory() as d:\n            bundled = os.path.join(d, \"tesseract\", \"tesseract.exe\")\n            os.makedirs(os.path.dirname(bundled))\n            open(bundled, \"w\").close()\n            found = core.find_tesseract(\n                env={}, frozen=False, app_dir=d,\n                which=lambda name: \"/usr/bin/tesseract\")\n            self.assertEqual(found, bundled)\n\n    def test_path_fallback(self):\n        with tempfile.TemporaryDirectory() as d:\n            found = core.find_tesseract(\n                env={}, frozen=False, app_dir=d,\n                which=lambda name: \"/usr/bin/tesseract\")\n            self.assertEqual(found, \"/usr/bin/tesseract\")\n\n    def test_darwin_candidates_use_homebrew_not_bundled(self):\n        # On macOS the bundled copy is a Windows binary: it must not be\n        # a candidate. The Homebrew prefixes take its place (Finder-\n        # launched apps do not inherit the shell PATH).\n        with mock.patch.object(sys, \"platform\", \"darwin\"):\n            cands = core.tesseract_candidates(env={}, frozen=False,\n                                              app_dir=\"/nonexistent\")\n        self.assertIn(\"/opt/homebrew/bin/tesseract\", cands)\n        self.assertIn(\"/usr/local/bin/tesseract\", cands)\n        self.assertFalse(any(c.endswith(\"tesseract.exe\") for c in cands))\n\n    def test_darwin_find_prefers_homebrew(self):\n        with mock.patch.object(sys, \"platform\", \"darwin\"), \\\n                mock.patch.object(\n                    core.os.path, \"isfile\",\n                    lambda p: p == \"/opt/homebrew/bin/tesseract\"):\n            found = core.find_tesseract(env={}, frozen=False,\n                                        app_dir=\"/nonexistent\",\n                                        which=lambda name: None)\n        self.assertEqual(found, \"/opt/homebrew/bin/tesseract\")\n\n    def test_darwin_env_override_still_wins(self):\n        with tempfile.TemporaryDirectory() as d:\n            fake = os.path.join(d, \"custom-tesseract\")\n            open(fake, \"w\").close()\n            bundled = os.path.join(d, \"tesseract\", \"tesseract.exe\")\n            os.makedirs(os.path.dirname(bundled))\n            open(bundled, \"w\").close()\n            with mock.patch.object(sys, \"platform\", \"darwin\"):\n                found = core.find_tesseract(\n                    env={\"TASHIKAMAIL_TESSERACT_CMD\": fake}, frozen=False,\n                    app_dir=d, which=lambda name: None)\n            self.assertEqual(found, fake)\n\n    def test_tessdata_discovery_and_lang_string(self):\n        with tempfile.TemporaryDirectory() as d:\n            td = os.path.join(d, \"tesseract\", \"tessdata\")\n            os.makedirs(td)\n            for code in (\"jpn\", \"eng\", \"kor\"):\n                open(os.path.join(td, code + \".traineddata\"), \"w\").close()\n            found = core.find_tessdata_dir(env={}, frozen=False, app_dir=d)\n            self.assertEqual(found, td)\n            self.assertEqual(core.ocr_lang_string(\"ko\", td), \"jpn+eng+kor\")\n            # spa has no data file here, so it is dropped honestly\n            self.assertEqual(core.ocr_lang_string(\"es\", td), \"jpn+eng\")\n\n\nclass TestOcrFunctional(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.en_img = os.path.join(_TMP, \"invoice_en.png\")\n        cls.ja_img = os.path.join(_TMP, \"invoice_ja.png\")\n        if os.path.exists(DEJAVU):\n            _make_image(EN_LINES, DEJAVU, cls.en_img)\n        if os.path.exists(NOTO):\n            _make_image(JA_LINES, NOTO, cls.ja_img)\n\n    def test_image_invoice_extraction_en(self):\n        _need_engine(self)\n        if not os.path.exists(self.en_img):\n            self.skipTest(\"DejaVu font unavailable\")\n        att = core.read_attachment(self.en_img)\n        self.assertTrue(att.via_ocr)\n        self.assertTrue(att.readable)\n        totals = [a for a in att.amounts if a.kind == \"total\"]\n        self.assertTrue(any(a.value == Decimal(\"1100.00\")\n                            and a.currency == \"USD\" for a in totals),\n                        att.amounts)\n        self.assertIn(\"INV1001\", att.doc_numbers)\n        self.assertIn(\"2026-11-14\", [str(d.day) for d in att.dates])\n\n    def test_image_pipeline_green_then_red(self):\n        _need_engine(self)\n        if not os.path.exists(self.en_img):\n            self.skipTest(\"DejaVu font unavailable\")\n        inp = core_checks.CheckInput(\n            recipients_text=\"taro@alphacorp.co.jp\",\n            subject=\"Invoice INV-1001\", body=BODY_OK,\n            attachments=[core.read_attachment(self.en_img)],\n            country=\"JP\")\n        report = core_checks.run_checks(inp)\n        self.assertEqual(report.overall, \"green\",\n                         [(f.check, f.level, f.reason_key)\n                          for f in report.findings])\n        readable = [f for f in report.by_check(\"readable\")\n                    if f.reason_key == \"r_read_via_ocr\"]\n        self.assertTrue(readable)  # OCR provenance is shown\n        caution = report.by_check(\"ocr\")\n        self.assertEqual(len(caution), 1)\n        self.assertEqual(caution[0].reason_key, \"r_ocr_caution\")\n\n        inp2 = core_checks.CheckInput(\n            recipients_text=\"taro@alphacorp.co.jp\",\n            subject=\"Invoice INV-1001\",\n            body=BODY_OK.replace(\"$1,100.00\", \"$1,200.00\"),\n            attachments=[core.read_attachment(self.en_img)],\n            country=\"JP\")\n        report2 = core_checks.run_checks(inp2)\n        self.assertEqual(report2.by_check(\"amount\")[0].level, \"red\")\n        self.assertEqual(report2.overall, \"red\")\n\n    def test_image_invoice_japanese(self):\n        _need_engine(self)\n        if not os.path.exists(self.ja_img):\n            self.skipTest(\"Noto CJK font unavailable\")\n        att = core.read_attachment(self.ja_img)\n        self.assertTrue(att.via_ocr)\n        totals = [a for a in att.amounts if a.kind == \"total\"]\n        self.assertTrue(any(a.value == Decimal(\"55000\")\n                            and a.currency == \"JPY\" for a in totals),\n                        att.amounts)\n        self.assertIn(\"INV2001\", att.doc_numbers)\n        self.assertIn(\"サクラ\", att.companies)\n        inp = core_checks.CheckInput(\n            recipients_text=\"\", subject=\"請求書 INV-2001\", body=BODY_JA,\n            attachments=[att], country=\"JP\")\n        report = core_checks.run_checks(inp)\n        self.assertEqual(report.by_check(\"amount\")[0].level, \"green\")\n        self.assertEqual(report.by_check(\"docnum\")[0].level, \"green\")\n\n    def test_scanned_pdf_image_only(self):\n        _need_engine(self)\n        try:\n            import fitz\n        except ImportError:\n            self.skipTest(\"PyMuPDF unavailable\")\n        if not os.path.exists(self.en_img):\n            self.skipTest(\"DejaVu font unavailable\")\n        pdf_path = os.path.join(_TMP, \"scan.pdf\")\n        doc = fitz.open()\n        page = doc.new_page(width=595, height=420)\n        page.insert_image(page.rect, filename=self.en_img)\n        doc.save(pdf_path)\n        doc.close()\n        att = core.read_attachment(pdf_path)\n        self.assertTrue(att.via_ocr)\n        self.assertEqual(att.ocr_pages, 1)\n        totals = [a for a in att.amounts if a.kind == \"total\"]\n        self.assertTrue(any(a.value == Decimal(\"1100.00\") for a in totals),\n                        att.amounts)\n        self.assertIn(\"INV1001\", att.doc_numbers)\n\n    def test_mixed_pdf_text_and_scan_pages(self):\n        _need_engine(self)\n        try:\n            import fitz\n        except ImportError:\n            self.skipTest(\"PyMuPDF unavailable\")\n        if not os.path.exists(self.en_img):\n            self.skipTest(\"DejaVu font unavailable\")\n        pdf_path = os.path.join(_TMP, \"mixed.pdf\")\n        doc = fitz.open()\n        p1 = doc.new_page(width=595, height=200)\n        p1.insert_text((72, 100), \"Cover memo: see scanned invoice next page.\")\n        p2 = doc.new_page(width=595, height=420)\n        p2.insert_image(p2.rect, filename=self.en_img)\n        doc.save(pdf_path)\n        doc.close()\n        att = core.read_attachment(pdf_path)\n        self.assertIn(\"Cover memo\", att.text)       # text layer kept\n        self.assertEqual(att.ocr_pages, 1)          # only page 2 via OCR\n        self.assertIn(\"INV1001\", att.doc_numbers)\n\n    def test_blank_image_stays_unreadable(self):\n        _need_engine(self)\n        from PIL import Image\n        blank = os.path.join(_TMP, \"blank.png\")\n        Image.new(\"RGB\", (800, 600), \"white\").save(blank)\n        att = core.read_attachment(blank)\n        self.assertFalse(att.readable)\n        self.assertFalse(att.via_ocr)\n        inp = core_checks.CheckInput(\n            recipients_text=\"\", subject=\"\", body=\"hello\",\n            attachments=[att], country=\"JP\")\n        report = core_checks.run_checks(inp)\n        readable = report.by_check(\"readable\")\n        self.assertEqual(readable[0].level, \"yellow\")\n        self.assertEqual(readable[0].reason_key, \"r_unreadable\")\n        self.assertEqual(report.by_check(\"ocr\"), [])  # no caution w/o OCR\n\n    def test_eml_image_attachment_ocr(self):\n        _need_engine(self)\n        if not os.path.exists(self.en_img):\n            self.skipTest(\"DejaVu font unavailable\")\n        msg = email.message.EmailMessage()\n        msg[\"From\"] = \"a@example.com\"\n        msg[\"To\"] = \"taro@alphacorp.co.jp\"\n        msg[\"Subject\"] = \"Invoice INV-1001\"\n        msg.set_content(BODY_OK)\n        with open(self.en_img, \"rb\") as fh:\n            msg.add_attachment(fh.read(), maintype=\"image\", subtype=\"png\",\n                               filename=\"invoice_en.png\")\n        eml_path = os.path.join(_TMP, \"mail.eml\")\n        with open(eml_path, \"wb\") as fh:\n            fh.write(bytes(msg))\n        out_dir = os.path.join(_TMP, \"eml_parts\")\n        data = core.parse_eml(eml_path, keep_attachments=True,\n                              out_dir=out_dir)\n        self.assertEqual(len(data[\"attachments\"]), 1)\n        att = core.read_attachment(data[\"attachments\"][0][\"path\"],\n                                   data[\"attachments\"][0][\"name\"])\n        self.assertTrue(att.via_ocr)\n        self.assertIn(\"INV1001\", att.doc_numbers)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n"}, {"path": "tests/test_sendguard.py", "sizestr": "12.6 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Tests for TashikaMail core logic. Runnable with pytest or unittest.\"\"\"\nimport datetime\nimport email\nimport email.policy\nimport os\nimport sys\nimport tempfile\nimport unittest\nfrom email.message import EmailMessage\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nimport core\nimport core_checks as cc\n\n\ndef make_pdf(path, lines):\n    \"\"\"Minimal single-page PDF with a text layer (uncompressed stream).\"\"\"\n    def esc(s):\n        return s.replace(\"\\\\\", \"\\\\\\\\\").replace(\"(\", \"\\\\(\").replace(\")\", \"\\\\)\")\n    ops = [\"BT\", \"/F1 12 Tf\", \"50 780 Td\"]\n    for i, line in enumerate(lines):\n        if i:\n            ops.append(\"0 -16 Td\")\n        ops.append(f\"({esc(line)}) Tj\")\n    ops.append(\"ET\")\n    stream = \"\\n\".join(ops).encode(\"latin-1\", errors=\"replace\")\n    objects = [\n        b\"<< /Type /Catalog /Pages 2 0 R >>\",\n        b\"<< /Type /Pages /Kids [3 0 R] /Count 1 >>\",\n        b\"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] \"\n        b\"/Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>\",\n        b\"<< /Length \" + str(len(stream)).encode() + b\" >>\\nstream\\n\"\n        + stream + b\"\\nendstream\",\n        b\"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\",\n    ]\n    out = bytearray(b\"%PDF-1.4\\n\")\n    offsets = []\n    for i, obj in enumerate(objects, 1):\n        offsets.append(len(out))\n        out += f\"{i} 0 obj\\n\".encode() + obj + b\"\\nendobj\\n\"\n    xref_pos = len(out)\n    out += f\"xref\\n0 {len(objects) + 1}\\n\".encode()\n    out += b\"0000000000 65535 f \\n\"\n    for off in offsets:\n        out += f\"{off:010d} 00000 n \\n\".encode()\n    out += (f\"trailer\\n<< /Size {len(objects) + 1} /Root 1 0 R >>\\n\"\n            f\"startxref\\n{xref_pos}\\n%%EOF\").encode()\n    with open(path, \"wb\") as fh:\n        fh.write(bytes(out))\n\n\nBODY_OK = \"\"\"Dear Alphacorp team,\n\nPlease find the invoice attached.\nInvoice No. INV-1001\nDate: 2026/11/14\nPayment due: 2026/11/30\nTotal amount: $1,100.00\n\nBest regards,\nAlphacorp Inc.\"\"\"\n\nATT_OK = \"\"\"Invoice\nInvoice No. INV-1001\nDate: 2026/11/14\nPayment due: 2026/11/30\nSubtotal $1,000.00\nTax $100.00\nTotal $1,100.00\nAlphacorp Inc.\"\"\"\n\n\nclass Base(unittest.TestCase):\n    def setUp(self):\n        self.tmp = tempfile.mkdtemp(prefix=\"tashikamail_test_\")\n\n    def write_att(self, name, text):\n        path = os.path.join(self.tmp, name)\n        with open(path, \"w\", encoding=\"utf-8\") as fh:\n            fh.write(text)\n        return core.read_attachment(path)\n\n    def check(self, **kw):\n        defaults = dict(\n            recipients_text=\"taro@alphacorp.co.jp\", subject=\"Invoice INV-1001\",\n            body=BODY_OK, attachments=[self.write_att(\"invoice.txt\", ATT_OK)],\n            country=\"JP\")\n        defaults.update(kw)\n        return cc.run_checks(cc.CheckInput(**defaults))\n\n    def finding(self, report, check):\n        items = report.by_check(check)\n        self.assertTrue(items, f\"no finding for {check}\")\n        return items[0]\n\n\nclass TestGreen(Base):\n    def test_green_all_ok(self):\n        report = self.check()\n        self.assertEqual(report.overall, \"green\",\n                         [(f.check, f.level, f.reason_key)\n                          for f in report.findings])\n\n\nclass TestRedCases(Base):\n    def test_amount_mismatch_red(self):\n        att = self.write_att(\"invoice.txt\",\n                             ATT_OK.replace(\"$1,100.00\", \"$1,200.00\"))\n        report = self.check(attachments=[att])\n        self.assertEqual(self.finding(report, \"amount\").level, \"red\")\n        self.assertEqual(report.overall, \"red\")\n\n    def test_missing_attachment_red(self):\n        report = self.check(attachments=[])\n        self.assertEqual(self.finding(report, \"attach\").level, \"red\")\n        self.assertEqual(report.overall, \"red\")\n\n    def test_docnum_mismatch_red(self):\n        att = self.write_att(\"invoice.txt\",\n                             ATT_OK.replace(\"INV-1001\", \"INV-1002\"))\n        report = self.check(attachments=[att])\n        self.assertEqual(self.finding(report, \"docnum\").level, \"red\")\n\n    def test_deadline_mismatch_red(self):\n        att = self.write_att(\"invoice.txt\",\n                             ATT_OK.replace(\"2026/11/30\", \"2026/12/01\"))\n        report = self.check(attachments=[att])\n        f = self.finding(report, \"date\")\n        self.assertEqual(f.level, \"red\")\n        self.assertEqual(f.reason_key, \"r_date_deadline_mismatch\")\n\n    def test_expected_domain_mismatch_red(self):\n        report = self.check(expected_domain=\"alphacorp.co.jp\",\n                            recipients_text=\"taro@othercorp.com\")\n        self.assertEqual(self.finding(report, \"domain\").level, \"red\")\n\n    def test_duplicate_versions_red(self):\n        a1 = self.write_att(\"invoice_v1.txt\", ATT_OK)\n        a2 = self.write_att(\"invoice_v2.txt\", ATT_OK)\n        report = self.check(attachments=[a1, a2])\n        dups = [f for f in report.by_check(\"version\")\n                if f.reason_key == \"r_version_duplicate\"]\n        self.assertTrue(dups)\n        self.assertEqual(dups[0].level, \"red\")\n\n\nclass TestYellowCases(Base):\n    def test_domain_mismatch_yellow(self):\n        report = self.check(recipients_text=\"taro@othercorp.com\")\n        self.assertEqual(self.finding(report, \"domain\").level, \"yellow\")\n\n    def test_freemail_yellow(self):\n        report = self.check(recipients_text=\"taro@gmail.com\")\n        f = self.finding(report, \"domain\")\n        self.assertEqual(f.level, \"yellow\")\n        self.assertEqual(f.reason_key, \"r_domain_freemail\")\n\n    def test_old_filename_date(self):\n        att = self.write_att(\"invoice_20260101.txt\", ATT_OK)\n        report = self.check(attachments=[att])\n        vf = [f for f in report.by_check(\"version\")\n              if f.reason_key == \"r_version_filename_old\"]\n        self.assertTrue(vf)\n        self.assertIn(vf[0].level, (\"yellow\", \"red\"))\n        self.assertNotEqual(report.overall, \"green\")\n\n    def test_japanese_filename_us_yellow_and_rename(self):\n        text = (\"請求書\\n請求番号 INV-1001\\n日付 2026/11/14\\n\"\n                \"合計 ¥110,000\\n株式会社アルファ\")\n        body = (\"株式会社アルファ 御中\\n請求書を添付いたします。\\n\"\n                \"請求番号: INV-1001\\n発行日: 2026/11/14\\n合計金額: ¥110,000\")\n        att = self.write_att(\"請求書_20261114.txt\", text)\n        report = self.check(body=body, attachments=[att], country=\"US\",\n                            recipients_text=\"taro@alpha.co.jp\",\n                            subject=\"請求書\")\n        jf = [f for f in report.by_check(\"filename\")\n              if f.reason_key == \"r_filename_japanese\"]\n        self.assertTrue(jf)\n        self.assertEqual(jf[0].level, \"yellow\")\n        self.assertIn(att.path, report.rename_suggestions)\n        suggestion = report.rename_suggestions[att.path]\n        suggestion.encode(\"ascii\")  # must be ASCII-safe\n        self.assertTrue(suggestion.endswith(\".txt\"))\n\n    def test_unreadable_attachment_yellow(self):\n        path = os.path.join(self.tmp, \"scan.png\")\n        with open(path, \"wb\") as fh:\n            fh.write(b\"\\x89PNG\\r\\n\\x1a\\n\" + bytes(range(256)))\n        att = core.read_attachment(path)\n        report = self.check(attachments=[att])\n        f = self.finding(report, \"readable\")\n        self.assertEqual(f.level, \"yellow\")\n        self.assertNotEqual(report.overall, \"green\")\n\n    def test_no_recipient_red(self):\n        report = self.check(recipients_text=\"\")\n        self.assertEqual(self.finding(report, \"domain\").level, \"red\")\n\n\nclass TestNormalization(Base):\n    def test_company_legal_form_variants(self):\n        body = \"株式会社サクラ 御中\\n請求書を添付いたします。\"\n        att = self.write_att(\"inv.txt\", \"請求書\\n（株）サクラ\\n合計 ¥10,000\")\n        report = self.check(body=body, attachments=[att],\n                            recipients_text=\"a@sakura.co.jp\")\n        self.assertEqual(self.finding(report, \"company\").level, \"green\")\n\n    def test_company_mismatch_red(self):\n        body = \"株式会社サクラ 御中\\n請求書を添付いたします。\"\n        att = self.write_att(\"inv.txt\", \"請求書\\n株式会社ウメ\\n合計 ¥10,000\")\n        report = self.check(body=body, attachments=[att],\n                            recipients_text=\"a@sakura.co.jp\")\n        self.assertEqual(self.finding(report, \"company\").level, \"red\")\n\n    def test_wareki_and_english_dates(self):\n        hits = core.extract_dates(\"令和8年11月14日\")\n        self.assertEqual([h.day for h in hits],\n                         [datetime.date(2026, 11, 14)])\n        hits = core.extract_dates(\"Nov 14, 2026 / 14 Nov 2026\")\n        self.assertEqual({h.day for h in hits},\n                         {datetime.date(2026, 11, 14)})\n\n    def test_fullwidth_amount(self):\n        amounts = core.extract_amounts(\"合計金額：￥１１０，０００（税込）\")\n        self.assertEqual(len(amounts), 1)\n        self.assertEqual(amounts[0].value, 110000)\n        self.assertEqual(amounts[0].kind, \"total\")\n\n\nclass TestReaders(Base):\n    def test_pdf_reader(self):\n        path = os.path.join(self.tmp, \"invoice.pdf\")\n        make_pdf(path, [\"Invoice No. INV-2001\", \"Total $500.00\",\n                        \"Alphacorp Inc.\"])\n        att = core.read_attachment(path)\n        self.assertTrue(att.readable, att.error)\n        self.assertIn(\"INV-2001\", att.text)\n        totals = [a for a in att.amounts if a.kind == \"total\"]\n        self.assertTrue(totals and totals[0].value == 500)\n\n    def test_xlsx_reader(self):\n        import openpyxl\n        path = os.path.join(self.tmp, \"invoice.xlsx\")\n        wb = openpyxl.Workbook()\n        ws = wb.active\n        ws[\"A1\"] = \"Invoice No. INV-3001\"\n        ws[\"A2\"] = \"Total\"\n        ws[\"B2\"] = \"$700.00\"\n        wb.save(path)\n        att = core.read_attachment(path)\n        self.assertTrue(att.readable, att.error)\n        self.assertIn(\"INV-3001\", att.text)\n\n    def test_docx_reader(self):\n        import docx\n        path = os.path.join(self.tmp, \"invoice.docx\")\n        doc = docx.Document()\n        doc.add_paragraph(\"Invoice No. INV-4001 Total $900.00\")\n        doc.save(path)\n        att = core.read_attachment(path)\n        self.assertTrue(att.readable, att.error)\n        self.assertIn(\"INV-4001\", att.text)\n\n\nclass TestEml(Base):\n    def test_eml_decomposition(self):\n        msg = EmailMessage()\n        msg[\"From\"] = \"me@mycompany.example\"\n        msg[\"To\"] = \"taro@alphacorp.co.jp\"\n        msg[\"Subject\"] = \"Invoice INV-1001\"\n        msg.set_content(BODY_OK)\n        msg.add_attachment(ATT_OK.encode(\"utf-8\"),\n                           maintype=\"text\", subtype=\"plain\",\n                           filename=\"invoice.txt\")\n        path = os.path.join(self.tmp, \"mail.eml\")\n        with open(path, \"wb\") as fh:\n            fh.write(bytes(msg))\n        data = core.parse_eml(path, out_dir=os.path.join(self.tmp, \"parts\"))\n        self.assertIn(\"taro@alphacorp.co.jp\", data[\"recipients\"][0])\n        self.assertEqual(data[\"subject\"], \"Invoice INV-1001\")\n        self.assertIn(\"INV-1001\", data[\"body\"])\n        self.assertEqual(len(data[\"attachments\"]), 1)\n        att = core.read_attachment(data[\"attachments\"][0][\"path\"],\n                                   data[\"attachments\"][0][\"name\"])\n        self.assertTrue(att.readable)\n        self.assertIn(\"INV-1001\", att.text)\n\n\nclass TestExpected(Base):\n    def test_expected_amount_ok(self):\n        report = self.check(expected_amount=\"$1,100.00\")\n        self.assertEqual(self.finding(report, \"amount\").level, \"green\")\n\n    def test_expected_amount_mismatch_red(self):\n        report = self.check(expected_amount=\"$9,999.00\")\n        f = self.finding(report, \"amount\")\n        self.assertEqual(f.level, \"red\")\n        self.assertEqual(f.reason_key, \"r_amount_expected_mismatch\")\n\n\nclass TestI18nAndSafety(unittest.TestCase):\n    def test_i18n_key_parity(self):\n        import i18n\n        base = set(i18n.JA)\n        self.assertEqual(len(i18n.STRINGS), 13)\n        for code, table in i18n.STRINGS.items():\n            self.assertEqual(set(table), base, f\"key mismatch in {code}\")\n\n    def test_no_send_capability_in_source(self):\n        here = os.path.join(os.path.dirname(__file__), \"..\")\n        for name in (\"app.py\", \"core.py\", \"core_checks.py\"):\n            with open(os.path.join(here, name), encoding=\"utf-8\") as fh:\n                src = fh.read().lower()\n            self.assertNotIn(\"smtplib\", src, name)\n            self.assertNotIn(\"sendmail\", src, name)\n\n    def test_no_fuzzy_library(self):\n        here = os.path.join(os.path.dirname(__file__), \"..\")\n        for name in (\"core.py\", \"core_checks.py\"):\n            with open(os.path.join(here, name), encoding=\"utf-8\") as fh:\n                src = fh.read().lower()\n            self.assertNotIn(\"difflib\", src, name)\n            self.assertNotIn(\"fuzzy\", src.replace(\"no fuzzy\", \"\"), name)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n"}], "default": 0}</script>

<script>
const DATA = JSON.parse(document.getElementById('filedata').textContent);
const gutter = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const fnameEl = document.getElementById('fname');
const linesEl = document.getElementById('lines');
const btns = Array.from(document.querySelectorAll('.file-btn'));
function show(i){
  const f = DATA.files[i];
  const lines = f.content.split('\n');
  if (lines.length && lines[lines.length-1] === '') lines.pop();
  gutter.textContent = lines.map((_,k)=>k+1).join('\n');
  codeEl.textContent = lines.join('\n');
  fnameEl.textContent = f.path;
  linesEl.textContent = lines.length + ' 行 / ' + f.sizestr;
  btns.forEach(b=>b.classList.toggle('active', +b.dataset.idx === i));
  document.getElementById('codewrap').scrollTop = 0;
  document.getElementById('codewrap').scrollLeft = 0;
}
btns.forEach(b=>b.addEventListener('click', ()=>show(+b.dataset.idx)));
show(DATA.default);
</script>
