ny\": \"키에 회사명 열이 포함되어 있지 않아 사전에 등록할 수 없습니다\",\n    \"dict_need_both\": \"표A와 표B에서 한 행씩 선택하세요\",\n    \"rep_houjin\": \"법인번호로 일치한 쌍\",\n    \"ok_btn\": \"확인\", \"cancel_btn\": \"취소\",\n},\n}\nfor _lang, _d in _NEW_KEYS.items():\n    S[_lang].update(_d)\n"}, {"p": "MakeApp-Mac.command", "s": 5591, "l": "bash", "c": "#!/bin/bash\n# MatchDetective - build a standalone macOS app (MatchDetective.app).\n#\n# Run this on a Mac: it creates a private Python environment (.venv),\n# installs PySide6 / openpyxl / PyInstaller, and builds\n#   dist/MatchDetective.app\n# It first tries a \"universal2\" build that runs on both Apple Silicon\n# and Intel Macs. If that is not possible with the Python installed on\n# this Mac, it automatically retries with a build for this Mac's own\n# chip and tells you which kind was made.\n#\n# The app is unsigned, so the first time you open the built app,\n# macOS Gatekeeper will block a plain double-click: right-click the\n# app and choose \"Open\" once (see README.txt).\ncd \"$(dirname \"$0\")\" || exit 1\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found. Extract the ZIP first, then run this file\"\n  echo \"from inside the extracted MatchDetective folder.\"\n  read -r -p \"Press Enter to close.\"\n  exit 1\nfi\n\nif ! python3 -c \"import sys\" >/dev/null 2>&1; then\n  echo \"Python 3 was not found (or is not installed yet).\"\n  echo \"\"\n  echo \"Please install Python 3 first - either way works:\"\n  echo \"  1) Download the macOS installer from https://www.python.org/downloads/\"\n  echo \"     and run it (recommended: that Python can build universal2), or\"\n  echo \"  2) If a dialog just asked to install the Command Line\"\n  echo \"     Developer Tools, accept it and run this file again.\"\n  echo \"\"\n  echo \"After installing Python, double-click this file again.\"\n  read -r -p \"Press Enter to close.\"\n  exit 1\nfi\n\nif [ ! -d .venv ]; then\n  echo \"Preparing the build environment (first time only)...\"\n  python3 -m venv .venv || {\n    echo \"Could not create the Python environment (.venv).\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  }\nfi\n# shellcheck disable=SC1091\n. .venv/bin/activate\n\necho \"Installing / checking libraries...\"\npython -m pip install --upgrade pip >/dev/null 2>&1\npython -m pip install PySide6 openpyxl pyinstaller || {\n  echo \"Library installation failed. Check your network connection\"\n  echo \"and run this file again.\"\n  read -r -p \"Press Enter to close.\"\n  exit 1\n}\n\nEXCLUDES=(\n  --exclude-module PySide6.QtWebEngine\n  --exclude-module PySide6.QtWebEngineCore\n  --exclude-module PySide6.QtWebEngineWidgets\n  --exclude-module PySide6.QtQml\n  --exclude-module PySide6.QtQuick\n  --exclude-module PySide6.QtQuickWidgets\n  --exclude-module PySide6.Qt3DCore\n  --exclude-module PySide6.Qt3DRender\n  --exclude-module PySide6.Qt3DInput\n  --exclude-module PySide6.Qt3DLogic\n  --exclude-module PySide6.Qt3DAnimation\n  --exclude-module PySide6.Qt3DExtras\n  --exclude-module PySide6.QtCharts\n  --exclude-module PySide6.QtDataVisualization\n  --exclude-module PySide6.QtMultimedia\n  --exclude-module PySide6.QtMultimediaWidgets\n  --exclude-module PySide6.QtNetwork\n  --exclude-module PySide6.QtSvg\n  --exclude-module PySide6.QtSvgWidgets\n  --exclude-module PySide6.QtPrintSupport\n  --exclude-module PySide6.QtSql\n  --exclude-module PySide6.QtTest\n  --exclude-module PySide6.QtXml\n  --exclude-module PySide6.QtConcurrent\n  --exclude-module PySide6.QtDBus\n  --exclude-module PySide6.QtHelp\n  --exclude-module PySide6.QtUiTools\n  --exclude-module PySide6.QtDesigner\n  --exclude-module PySide6.QtPositioning\n  --exclude-module PySide6.QtLocation\n  --exclude-module PySide6.QtSensors\n  --exclude-module PySide6.QtSerialPort\n  --exclude-module PySide6.QtBluetooth\n  --exclude-module PySide6.QtNfc\n  --exclude-module PySide6.QtWebSockets\n  --exclude-module PySide6.QtWebChannel\n  --exclude-module PySide6.QtRemoteObjects\n  --exclude-module PySide6.QtTextToSpeech\n  --exclude-module PySide6.QtPdf\n  --exclude-module PySide6.QtPdfWidgets\n  --exclude-module PySide6.QtOpenGL\n  --exclude-module PySide6.QtOpenGLWidgets\n  --exclude-module PySide6.QtAsyncio\n  --exclude-module tkinter\n  --exclude-module _tkinter\n  --exclude-module unittest\n  --exclude-module pytest\n  --exclude-module numpy\n  --exclude-module lxml\n  --exclude-module pandas\n  --exclude-module matplotlib\n  --exclude-module IPython\n)\n\nbuild_app() {\n  # $1 (optional): value for --target-arch, or empty for native build\n  if [ -n \"$1\" ]; then\n    python -m PyInstaller --noconfirm --windowed --name MatchDetective --icon assets/icon.icns \\\n      --target-arch \"$1\" \"${EXCLUDES[@]}\" app.py\n  else\n    python -m PyInstaller --noconfirm --windowed --name MatchDetective --icon assets/icon.icns \\\n      \"${EXCLUDES[@]}\" app.py\n  fi\n}\n\nKIND=\"\"\necho \"\"\necho \"Trying a universal2 build (runs on Apple Silicon and Intel)...\"\nif build_app universal2 && [ -d dist/MatchDetective.app ]; then\n  KIND=\"universal2 (Apple Silicon + Intel)\"\nelse\n  echo \"\"\n  echo \"universal2 is not available with this Python; rebuilding for\"\n  echo \"this Mac's own chip instead...\"\n  rm -rf build dist MatchDetective.spec\n  if build_app \"\" && [ -d dist/MatchDetective.app ]; then\n    KIND=\"native ($(uname -m)) - runs on Macs with the same chip family\"\n  fi\nfi\n\necho \"\"\nif [ -n \"$KIND\" ] && [ -d dist/MatchDetective.app ]; then\n  echo \"Done: dist/MatchDetective.app\"\n  echo \"Build kind: $KIND\"\n  if command -v file >/dev/null 2>&1; then\n    echo \"Binary check:\"\n    file dist/MatchDetective.app/Contents/MacOS/MatchDetective | sed 's/^/  /'\n  fi\n  echo \"\"\n  echo \"To use it: move MatchDetective.app anywhere you like and open it.\"\n  echo \"First open: the app is unsigned, so right-click it and choose\"\n  echo \"\\\"Open\\\" once; after that a normal double-click works.\"\nelse\n  echo \"The build did not finish. Please scroll up for the error\"\n  echo \"message, fix the cause (usually a missing library), and run\"\n  echo \"this file again.\"\nfi\nread -r -p \"Press Enter to close.\"\n"}, {"p": "README-SOURCE.txt", "s": 1273, "l": "plaintext", "c": "MatchDetective - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of MatchDetective, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-MatchDetective.bat (or: python app.py)\n- Mac: Start-MatchDetective.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\nNotes:\n法人番号検索を使う場合は、国税庁の無料API IDをご自身で取得し、設定画面で入力してください（ID自体はソースに含まれていません）。\nTo use the corporate-number lookup, obtain a free API ID from the National Tax Agency (Japan) and enter it in the settings (no ID is included in the source).\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 7537, "l": "plaintext", "c": "マッチング探偵 / MatchDetective\n================================\n\n2つの表（発注リストと納品リスト、請求一覧と入金一覧、在庫表と棚卸し表など）を\n照合（reconciliation）して、違いだけを3つの区分で見せるアプリです。\n\n  1. 片方にだけある\n  2. 金額・数が違う\n  3. 表記違いだが同じ相手らしい（理由付きの候補）\n\n会社名の法人格（株式会社 / (株) / Ltd. / GmbH / ООО / PT など、13言語分）や\n表記のゆれ、全角・桁区切りなどの違いを吸収して比べます。\n区分3の候補は、正規化したら完全に一致するものと、合計が完全に一致する\nものだけです。「よく似ている」という理由だけで候補に出すことはありません\n（似ているだけの名前は区分1に出ます。同じ相手なら手動で組にできます）。\n1件の請求を分けて払ったような「数件の合計が一致」する候補も提示します。\nアプリは提案までを行い、採用・却下の最終判断は人が行います。\n元のファイルを変更することはありません。\n\n使い方\n------\n1. 表Aと表Bに、比べたい CSV / Excel ファイルをドラッグ＆ドロップ\n   （またはボタンから開く）\n2. キー列と比較列はアプリが提案します。必要ならプルダウンで変更できます。\n   列名を直接タイプして指定することもできます（全角・空白・記号の違いや\n   「オーダーNo」のような別名でも、該当する列として認識します。\n   見つからない名前を入力した場合は、赤枠とメッセージでお知らせします）\n3. 「照合する」を押すと、違いが3区分で表示されます\n4. 区分3の候補は「採用する」「却下する」で判断してください\n5. 結果は Excel / CSV / レポート(txt) に書き出せます\n\n会社名の辞書（学習機能）\n------------------------\n漢字とカタカナのように表記が大きく違う会社名は、自動では同一と判断\nしません（違う会社を候補に出さないためです）。代わりに、人が一度\n「同じ会社」と確定した組み合わせを辞書に覚え、次回から自動で組に\nします。\n- 区分1で両側の行を選んで「同じ会社として登録」\n- 手動で組にする際も、確認ダイアログで辞書登録を選べます\n  （チェックは最初から入っています）\n- 「辞書を管理」から一覧・削除・手入力での追加ができます\n辞書は Windows では %APPDATA%\\MatchDetective\\aliases.json、Mac では\n~/Library/Application Support/MatchDetective/aliases.json に保存されます。\n削除は次回の照合から効きます（表示中の結果は変わりません）。\n\n法人番号での確認（日本の会社のみ）\n----------------------------------\n設定欄に国税庁の無料のアプリケーションIDを入れると、区分1の会社名を\n国税庁の法人番号登録で確認できます。\n- 「法人番号で確認」：選んだ会社名の登録情報（商号・フリガナ・\n  法人番号・住所）を判断材料として表示します\n- 「法人番号で自動照合」：登録が1社だけで、カタカナ表記の読みが\n  登録フリガナと完全に一致する場合に限り、自動で組にします。\n  同名の法人が複数ある場合は自動では組にせず、一覧から人が選びます\n- 「WEBで確認」：会社名の検索をブラウザで開きます（公式サイトの\n  確認は人が行います。アプリが会社サイトを自動で調べることは\n  ありません）\n- 選んだ法人で「登録して組にする」と、法人番号つきで辞書に登録\n  されます\n取得した登録情報は Windows では %APPDATA%\\MatchDetective\\houjin_cache.json、\nMac では ~/Library/Application Support/MatchDetective/houjin_cache.json に\nキャッシュされ、画面にデータ基準日と取得日を表示します。\nIDの発行申請は国税庁のページから行えます（無料、2週間〜1か月程度）。\nこのサービスは、国税庁法人番号システムのWeb-API機能を利用して取得\nした情報をもとに作成しているが、サービスの内容は国税庁によって\n保証されたものではない\n\n起動（ソース版）\n----------------\n- EXE版：MatchDetective.exe をダブルクリック\n- ソース版：Start-MatchDetective.bat をダブルクリック\n  （初回だけ Python ライブラリを自動で入れます。2回目からは速く起動します。\n   黒い画面はアプリを閉じるまで開いたままにしてください）\n\nMac版について\n--------------\n対応は macOS 11（Big Sur）以降です。Mac版のアプリ本体（.app）は、\nMacの上で組み立てる決まりのため、ダウンロードしたZIPには\n「組み立てスクリプト」を同梱しています（Windows版と同じプログラムです）。\n\n  1. ZIPをダウンロードして展開する\n  2. MakeApp-Mac.command をダブルクリックする\n     （「開発元を確認できないため開けません」と出た場合は、\n       MakeApp-Mac.command を右クリック（または Control+クリック）して\n       「開く」を選んでください。初回だけ必要な操作です）\n     Python 3 が無い場合は、スクリプトが入手方法（python.org の\n     インストーラ等）を案内して終了します\n  3. dist フォルダに MatchDetective.app ができます。好きな場所へ\n     移動して使ってください。初回起動時も同じ理由で、アプリを\n     右クリックして「開く」を選ぶ必要があります（未署名のため）\n\n- チップ（CPU）について：スクリプトはまず、Apple Silicon と Intel の\n  両方で動く「universal2」版の生成を試みます。お使いの Python の\n  都合で作れない場合は、そのMacのチップ専用版を自動で作り直し、\n  どちらができたかを最後に画面で知らせます\n- Python をすでにお持ちの方は、Start-MatchDetective.command を\n  ダブルクリックすれば .app を作らずにそのまま起動もできます\n- 正直な注意：開発環境に Mac 実機がないため、Mac での起動は\n  未検証です。Windows版は従来どおり検証済みです\n\n対応形式：CSV（区切り文字・文字コードは自動判定）、.xlsx / .xlsm\n対応言語：日本語・English・Español・简体中文・Français・Deutsch・Português・\nРусский・Italiano・Türkçe・العربية・Bahasa Indonesia・한국어\n\n注意\n----\n- 「似ている名前」を自動で組にすることはありません。違う会社を候補に\n  出して間違いの元にならないよう、候補は完全一致（正規化後）と合計一致\n  だけに限っています。最終確認は必ず人が行ってください。\n- 法人番号での自動照合は日本の会社だけが対象で、アプリケーションIDが\n  必要です。漢字とカタカナが混ざった表記（例：田中デンキ）は法人番号\n  でも自動判定せず、辞書に登録して対応してください。\n- 金額の換算は行いません。外部へ送信するのは、法人番号の確認を行う\n  ときの会社名の照会だけです。\n"}, {"p": "requirements.txt", "s": 17, "l": "plaintext", "c": "PySide6\nopenpyxl\n"}, {"p": "Start-MatchDetective.bat", "s": 316, "l": "dos", "c": "@echo off\r\nsetlocal\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo app.py not found. Extract the ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\npython -c \"import PySide6, openpyxl\" 2>nul\r\nif errorlevel 1 (\r\n  echo Installing libraries (first launch only)...\r\n  python -m pip install PySide6 openpyxl\r\n)\r\nstart \"\" pythonw app.py\r\n"}, {"p": "Start-MatchDetective.command", "s": 1936, "l": "bash", "c": "#!/bin/bash\n# MatchDetective - macOS launcher (source version).\n# Double-click this file to run MatchDetective.\n# First launch creates a private Python environment (.venv) in this\n# folder and installs the libraries it needs; later launches are fast.\ncd \"$(dirname \"$0\")\" || exit 1\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found. Extract the ZIP first, then run this file\"\n  echo \"from inside the extracted MatchDetective folder.\"\n  read -r -p \"Press Enter to close.\"\n  exit 1\nfi\n\n# A working python3 is required. /usr/bin/python3 on a fresh Mac is a\n# stub that asks to install the Command Line Tools; treat a failed\n# run the same as \"not installed\" and explain how to get Python.\nif ! python3 -c \"import sys\" >/dev/null 2>&1; then\n  echo \"Python 3 was not found (or is not installed yet).\"\n  echo \"\"\n  echo \"Please install Python 3 first - either way works:\"\n  echo \"  1) Download the macOS installer from https://www.python.org/downloads/\"\n  echo \"     and run it (this is the simplest way), or\"\n  echo \"  2) If a dialog just asked to install the Command Line\"\n  echo \"     Developer Tools, accept it and run this file again.\"\n  echo \"\"\n  echo \"After installing Python, double-click this file again.\"\n  read -r -p \"Press Enter to close.\"\n  exit 1\nfi\n\nif [ ! -d .venv ]; then\n  echo \"Preparing the app environment (first launch only)...\"\n  python3 -m venv .venv || {\n    echo \"Could not create the Python environment (.venv).\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  }\nfi\n# shellcheck disable=SC1091\n. .venv/bin/activate\n\nif ! python -c \"import PySide6, openpyxl\" >/dev/null 2>&1; then\n  echo \"Installing libraries (first launch only)...\"\n  python -m pip install --upgrade pip >/dev/null 2>&1\n  python -m pip install PySide6 openpyxl || {\n    echo \"Library installation failed. Check your network connection\"\n    echo \"and run this file again.\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  }\nfi\n\npython app.py\n"}, {"p": "tests/smoke_gui.py", "s": 2855, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen smoke test: builds a realistic reconciliation demo inside the\ntest (NOT shipped with the app), drives the real GUI, and screenshots the\n3-category results and the category-3 candidate view.\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nimport core\nfrom core import Table\n\nHA = [\"注文番号\", \"会社名\", \"金額\", \"数量\"]\nA_ROWS = [\n    [\"PO-1001\", \"株式会社サンプル商事\", \"120,000\", \"30\"],\n    [\"PO-1002\", \"グローバル貿易\", \"85,500\", \"12\"],\n    [\"PO-1003\", \"タナカ電機（株）\", \"46,200\", \"7\"],\n    [\"PO-1004\", \"北海フーズ合同会社\", \"33,000\", \"50\"],\n    [\"PO-1005\", \"ミドリ印刷\", \"18,900\", \"100\"],\n    [\"PO-1006\", \"アオイ物流\", \"250,000\", \"3\"],\n    [\"PO-1007\", \"山川製作所\", \"64,000\", \"8\"],\n]\nHB = [\"納品番号\", \"取引先\", \"金額\", \"数量\"]\nB_ROWS = [\n    [\"DN-501\", \"サンプル商事 (株)\", \"120,000\", \"30\"],\n    [\"DN-502\", \"グローバル貿易商事\", \"85,500\", \"12\"],\n    [\"DN-503\", \"タナカ電機株式会社\", \"46,200\", \"7\"],\n    [\"DN-504\", \"北海フーズ (同)\", \"30,000\", \"50\"],\n    [\"DN-505\", \"ミドリ印刷\", \"9,450\", \"50\"],\n    [\"DN-506\", \"ミドリ印刷\", \"9,450\", \"50\"],\n    [\"DN-507\", \"西日本パーツ\", \"77,000\", \"20\"],\n]\n\n\ndef main():\n    from PySide6.QtWidgets import QApplication\n    app = QApplication(sys.argv)\n    import app as appmod\n    win = appmod.MainWindow()\n    win.table_a = Table(HA, A_ROWS)\n    win.table_b = Table(HB, B_ROWS)\n    win._fill_preview(win.prev_a, win.table_a)\n    win._fill_preview(win.prev_b, win.table_b)\n    win.card_a[\"info\"].setText(\"orders.csv (7 rows)\")\n    win.card_b[\"info\"].setText(\"deliveries.csv (7 rows)\")\n    win._apply_proposal()\n    # key: company; compare: amount + qty (exercises every phase)\n    win.result = core.reconcile(\n        win.table_a, win.table_b, [(1, 1)], [(2, 2), (3, 3)])\n    win.result_cfg = {\"key_pairs\": [(1, 1)],\n                      \"compare_pairs\": [(2, 2), (3, 3)],\n                      \"tolerance\": core.Decimal(\"0\")}\n    win._refresh_results()\n    win._refresh_summary()\n    win.show()\n    app.processEvents()\n    out = os.path.join(os.path.dirname(__file__), \"..\", \"shots\")\n    os.makedirs(out, exist_ok=True)\n    win.tabs.setCurrentIndex(0)\n    app.processEvents()\n    win.grab().save(os.path.join(out, \"01_cat1.png\"))\n    win.tabs.setCurrentIndex(2)\n    app.processEvents()\n    win.grab().save(os.path.join(out, \"02_cat3_candidates.png\"))\n    win.tabs.setCurrentIndex(1)\n    app.processEvents()\n    win.grab().save(os.path.join(out, \"03_cat2.png\"))\n    c = win.result.counts()\n    print(\"counts:\", c)\n    for cand in win.result.candidates:\n        print(\"cand:\", cand.kind, cand.reason_key, cand.confidence, cand.status)\n    print(\"SMOKE OK\", os.path.abspath(out))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"p": "tests/smoke_phase3.py", "s": 6392, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen smoke for phase 3: alias dictionary (B) + corporate-number\nregistry evidence / auto-pair (A). The registry client is a fixture —\nno network. APPDATA is redirected to a temp folder so the real\nsettings/dictionary/cache locations are exercised.\"\"\"\nimport json\nimport os\nimport sys\nimport tempfile\nimport urllib.parse\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nos.environ[\"APPDATA\"] = tempfile.mkdtemp(prefix=\"md-appdata-\")\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\n\nimport core\nimport houjin\nfrom core import Table\n\n\ndef _xml(number, name, furigana, pref=\"愛知県\", city=\"名古屋市中村区\"):\n    return (\"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\"?>\"\n            \"<corporations><lastUpdateDate>2026-11-10<\/lastUpdateDate>\"\n            \"<count>1<\/count><divideNumber>1<\/divideNumber>\"\n            \"<divideSize>1<\/divideSize>\"\n            \"<corporation><sequenceNumber>1<\/sequenceNumber>\"\n            \"<corporateNumber>%s<\/corporateNumber><process>01<\/process>\"\n            \"<correct>0<\/correct><updateDate>2026-11-01<\/updateDate>\"\n            \"<changeDate>2020-04-01<\/changeDate><name>%s<\/name>\"\n            \"<nameImageId/><kind>301<\/kind>\"\n            \"<prefectureName>%s<\/prefectureName><cityName>%s<\/cityName>\"\n            \"<streetNumber>名駅一丁目1番1号<\/streetNumber>\"\n            \"<addressImageId/><prefectureCode>23<\/prefectureCode>\"\n            \"<cityCode>101<\/cityCode><postCode>4500002<\/postCode>\"\n            \"<addressOutside/><addressOutsideImageId/><closeDate/>\"\n            \"<closeCause/><successorCorporateNumber/><changeCause/>\"\n            \"<assignmentDate>2015-10-05<\/assignmentDate><latest>1<\/latest>\"\n            \"<enName/><enPrefectureName/><enCityName/><enAddressOutside/>\"\n            \"<furigana>%s<\/furigana><hihyoji>0<\/hihyoji><\/corporation>\"\n            \"<\/corporations>\"\n            % (number, name, pref, city, furigana)).encode(\"utf-8\")\n\n\nFIXTURES = {\n    \"田中電機株式会社\": _xml(\"1234567890123\", \"田中電機株式会社\", \"タナカデンキ\"),\n    \"山田工業株式会社\": _xml(\"5555555555555\", \"山田工業株式会社\", \"ヤマダコウギョウ\"),\n}\n\n\ndef fixture_client(app_id, cache_path=None):\n    def fetch(url, timeout):\n        qs = urllib.parse.parse_qs(urllib.parse.urlparse(url).query)\n        name = qs[\"name\"][0]\n        assert name in FIXTURES, name\n        return FIXTURES[name]\n    return houjin.HoujinClient(\"FIXTUREID1234\", cache_path=cache_path,\n                               fetcher=fetch)\n\n\nHA = [\"番号\", \"会社名\", \"金額\"]\nA_ROWS = [[\"1\", \"田中電機株式会社\", \"10,000\"],\n          [\"2\", \"株式会社サンプル商事\", \"5,000\"],\n          [\"3\", \"山田工業株式会社\", \"7,500\"]]\nHB = [\"番号\", \"取引先\", \"金額\"]\nB_ROWS = [[\"9\", \"タナカデンキ\", \"10,000\"],\n          [\"8\", \"サンプル商事 (株)\", \"5,000\"],\n          [\"7\", \"ヤマダコウギョウ\", \"7,500\"]]\n\n\ndef _select(lst, row_idx):\n    from PySide6.QtCore import Qt\n    for i in range(lst.count()):\n        item = lst.item(i)\n        if item.data(Qt.UserRole) == row_idx:\n            lst.setCurrentItem(item)\n            return\n    raise AssertionError(\"row %s not in list\" % row_idx)\n\n\ndef main():\n    from PySide6.QtWidgets import QApplication\n    app = QApplication(sys.argv)\n    import app as appmod\n    win = appmod.MainWindow()\n    win.resize(1180, 980)\n    win.table_a = Table(HA, A_ROWS)\n    win.table_b = Table(HB, B_ROWS)\n    win._fill_preview(win.prev_a, win.table_a)\n    win._fill_preview(win.prev_b, win.table_b)\n    win._apply_proposal()\n    win.houjin_id_edit.setText(\"FIXTUREID1234\")\n    win._houjin_client = lambda: fixture_client(\n        \"FIXTUREID1234\",\n        cache_path=os.path.join(appmod.data_dir(), \"houjin_cache.json\"))\n\n    def run():\n        win.result = core.reconcile(\n            win.table_a, win.table_b, [(1, 1)], [(2, 2)],\n            equiv=core.CompanyEquivalence(win.dictionary))\n        win.result_cfg = {\"key_pairs\": [(1, 1)], \"compare_pairs\": [(2, 2)],\n                          \"tolerance\": core.Decimal(\"0\")}\n        win._refresh_results()\n        win._refresh_summary()\n\n    run()\n    c = win.result.counts()\n    print(\"initial counts:\", c)\n    assert c[\"ok\"] == 1                      # サンプル商事 only\n    assert c[\"cat1_a\"] == 2 and c[\"cat1_b\"] == 2\n\n    # ---- (B) register 田中 pair from the cat-1 selection\n    _select(win.cat1_a_list, 0)\n    _select(win.cat1_b_list, 0)\n    win._register_same()\n    assert win.dictionary.has(\"田中電機株式会社\", \"タナカデンキ\")\n    assert win.result.counts()[\"ok\"] == 2\n    saved = json.load(open(os.path.join(\n        os.environ[\"APPDATA\"], \"MatchDetective\", \"aliases.json\"),\n        encoding=\"utf-8\"))\n    assert saved[\"entries\"][0][\"source\"] == \"manual\"\n    print(\"dictionary after register_same:\", saved[\"entries\"])\n\n    # ---- (A) evidence for the 山田 row, then auto-pair\n    _select(win.cat1_a_list, 2)\n    win._houjin_check()\n    assert win.evidence_list.count() == 1\n    assert \"5555555555555\" in win.evidence_list.item(0).text()\n    print(\"evidence meta:\", win.evidence_meta.text())\n    win.tabs.setCurrentIndex(0)\n    win.show()\n    app.processEvents()\n    out = os.path.join(os.path.dirname(__file__), \"..\", \"shots\")\n    os.makedirs(out, exist_ok=True)\n    win.grab().save(os.path.join(out, \"06_houjin_evidence.png\"))\n\n    win._houjin_auto()\n    print(\"after auto counts:\", win.result.counts(),\n          \"houjin_pairs:\", win.result.houjin_pairs)\n    assert win.result.houjin_pairs == [(2, 2, \"5555555555555\")]\n    assert win.result.counts()[\"ok\"] == 3\n    assert \"自動\" in win.status_label.text() or win.status_label.text()\n\n    # ---- dictionary dialog: typed add (stored as typed) + delete\n    dlg = appmod.DictDialog(win)\n    dlg.name_a.setText(\"手書き会社A\")\n    dlg.name_b.setText(\"手書き会社B\")\n    dlg._add()\n    assert win.dictionary.has(\"手書き会社A\", \"手書き会社B\")\n    dlg.show()\n    app.processEvents()\n    dlg.grab().save(os.path.join(out, \"05_dict.png\"))\n    for i in range(dlg.list.count()):\n        if \"手書き会社A\" in dlg.list.item(i).text():\n            dlg.list.setCurrentRow(i)\n    dlg._delete()\n    assert not win.dictionary.has(\"手書き会社A\", \"手書き会社B\")\n    dlg.close()\n    print(\"SMOKE PHASE3 OK\", os.path.abspath(out))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"p": "tests/smoke_typed.py", "s": 4319, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen smoke test for typed key/compare column names.\n\nDrives the real GUI three ways over the same demo tables:\n  1. selection-based run (proposal picks, as before),\n  2. free-TYPED variants in the key/compare combos (fullwidth space,\n     synonym, cross-language, parenthesised unit) -> identical results,\n  3. gibberish in key1 -> run stops, localized warning + red border.\nAlso exercises the cross-side auto-fill of key1 and takes a screenshot\nof the setup area with typed text sitting in the key combo.\nNo QMessageBox is involved anywhere in this flow: the warning surface\nis the status label + combo border, which is what we assert on.\n\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nfrom smoke_gui import A_ROWS, B_ROWS, HA, HB  # demo data (test-only)\n\nimport core\nfrom core import Table\n\n\ndef main():\n    os.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\n    from PySide6.QtCore import QPoint, QRect\n    from PySide6.QtWidgets import QApplication\n    app = QApplication(sys.argv)\n    import app as appmod\n    win = appmod.MainWindow()\n    win.table_a = Table(HA, A_ROWS)\n    win.table_b = Table(HB, B_ROWS)\n    win._fill_preview(win.prev_a, win.table_a)\n    win._fill_preview(win.prev_b, win.table_b)\n    win._apply_proposal()\n    ka, kb = win.combos[(\"key1\", \"a\")], win.combos[(\"key1\", \"b\")]\n    assert ka.currentText() == \"会社名\" and kb.currentText() == \"取引先\", (\n        ka.currentText(), kb.currentText())\n\n    # ---- cross-fill: B cleared (untouched), A edited -> B auto-fills\n    kb.setEditText(\"\")\n    ka.setEditText(\"会社　名\")                    # fullwidth space variant\n    win._on_combo_edited(\"key1\", \"a\")\n    assert kb.currentText() == \"取引先\", kb.currentText()   # B's own header\n    assert win._combo_dirty[(\"key1\", \"b\")] is False\n    # ... but never when B was hand-edited by the user\n    win._on_text_typed(\"key1\", \"b\")\n    kb.setEditText(\"zzz\")\n    win._on_combo_edited(\"key1\", \"a\")\n    assert kb.currentText() == \"zzz\"\n    win._combo_dirty[(\"key1\", \"b\")] = False       # reset for the runs below\n\n    # ---- 1. selection-based run\n    ka.setEditText(\"会社名\")\n    kb.setEditText(\"取引先\")\n    win._run()\n    assert win.result is not None\n    counts_sel = win.result.counts()\n    print(\"selection counts:\", counts_sel)\n\n    # ---- 2. typed-variant run -> identical categories\n    ka.setEditText(\"会社　名\")                    # fullwidth space\n    kb.setEditText(\"取引先名\")                    # synonym\n    win.combos[(\"cmp1\", \"a\")].setEditText(\"数量（個）\")\n    win.combos[(\"cmp1\", \"b\")].setEditText(\"Qty\")  # cross-language\n    win.combos[(\"cmp2\", \"a\")].setEditText(\"金額（円）\")\n    win.combos[(\"cmp2\", \"b\")].setEditText(\"amount（円）\")\n    win.result = None\n    win._run()\n    assert win.result is not None\n    counts_typed = win.result.counts()\n    print(\"typed counts:    \", counts_typed)\n    assert counts_typed == counts_sel, (counts_sel, counts_typed)\n    assert win.result_cfg[\"key_pairs\"] == [(1, 1)]\n    assert sorted(win.result_cfg[\"compare_pairs\"]) == [(2, 2), (3, 3)]\n\n    # ---- 3. gibberish -> blocked run, localized warning, red border\n    win.result = None\n    ka.setEditText(\"zzzqqq\")\n    win._run()\n    assert win.result is None\n    expect = win.t(\"col_unresolved\", text=\"zzzqqq\")\n    assert win.status_label.text() == expect, win.status_label.text()\n    assert \"#dc2626\" in ka.styleSheet()\n    print(\"warning shown: \", win.status_label.text())\n    # fixing the text and re-validating clears the mark\n    ka.setEditText(\"会社　名\")\n    kb.setEditText(\"取引先\")\n    win._on_combo_edited(\"key1\", \"a\")\n    assert ka.styleSheet() == \"\"\n    win._run()\n    assert win.result is not None and win.result.counts() == counts_sel\n\n    # ---- screenshot: setup area with the typed variant in key1\n    win.show()\n    app.processEvents()\n    pt = ka.mapTo(win, QPoint(0, 0))\n    rect = QRect(max(0, pt.x() - 200), max(0, pt.y() - 48),\n                 min(980, win.width()), 260)\n    out = os.path.join(os.path.dirname(__file__), \"..\", \"shots\")\n    os.makedirs(out, exist_ok=True)\n    shot = os.path.join(out, \"04_typed_setup.png\")\n    win.grab(rect).save(shot)\n    print(\"SMOKE TYPED OK\", os.path.abspath(shot))\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"p": "tests/test_core.py", "s": 12441, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"MatchDetective core tests (no network).\"\"\"\nimport os\nimport sys\nfrom decimal import Decimal\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nimport core\nfrom core import Table, normalize_company, parse_number, reconcile\n\nNC = normalize_company\n\n\n# ---------------------------------------------------------------- legal forms\ndef test_legal_jp():\n    assert NC(\"株式会社ABC\") == NC(\"ABC Co., Ltd.\") == \"abc\"\n    assert NC(\"ABC株式会社\") == \"abc\"\n    assert NC(\"（株）タナカ\") == NC(\"田中株式会社\".replace(\"田中\", \"タナカ\")) == \"タナカ\"\n    assert NC(\"有限会社サンプル\") == \"サンプル\"\n\n\ndef test_legal_en_de_fr():\n    assert NC(\"Sample Inc.\") == NC(\"Sample Corp.\") == \"sample\"\n    assert NC(\"Müller GmbH\") == NC(\"MÜLLER AG\") == \"müller\"\n    assert NC(\"Dupont S.A.\") == NC(\"DUPONT SAS\") == \"dupont\"\n    assert NC(\"Garcia S.A. de C.V.\") == \"garcia\"\n\n\ndef test_legal_kr_cn():\n    assert NC(\"벡터 주식회사\") == NC(\"(주)벡터\") == \"벡터\"\n    assert NC(\"벡터 유한회사\") == NC(\"벡터 합자회사\") == \"벡터\"\n    assert NC(\"向量科技有限公司\") == NC(\"向量科技股份有限公司\") == \"向量科技\"\n    assert NC(\"向量科技集团\") == \"向量科技\"      # trailing group suffix\n\n\ndef test_legal_pt():\n    assert NC(\"Vetor Consultoria Ltda.\") == NC(\"VETOR CONSULTORIA\") == \"vetorconsultoria\"\n    assert NC(\"Costa Tech EIRELI\") == \"costatech\"\n    assert NC(\"Silva & Santos Lda.\") == NC(\"SILVA SANTOS\") == \"silvasantos\"\n\n\ndef test_legal_ru():\n    assert NC(\"ООО «ВЕКТОР»\") == NC(\"ВЕКТОР\") == \"вектор\"\n    assert NC(\"ПАО «Сбербанк»\") == \"сбербанк\"\n    assert NC(\"Vektor OOO\") == NC(\"VEKTOR\") == \"vektor\"     # romanized\n\n\ndef test_legal_tr():\n    assert NC(\"Vektör Teknoloji Ltd. Şti.\") == NC(\"VEKTÖR TEKNOLOJİ\") == \"vektörteknoloji\"\n    assert NC(\"Yılmaz Gıda A.Ş.\") == NC(\"YILMAZ GIDA\") == \"yilmazgida\"\n    assert NC(\"Anadolu Limited Şirketi\") == \"anadolu\"\n\n\ndef test_legal_ar():\n    assert NC(\"فيكتور ذ.م.م\") == NC(\"فيكتور\") == \"فيكتور\"\n    assert NC(\"الخليج ش.م.م\") == NC(\"الخليج\") == \"الخليج\"\n    assert NC(\"شركة النور\") == \"النور\"\n    assert NC(\"Gulf Trading LLC\") == NC(\"GULF TRADING\") == \"gulftrading\"\n\n\ndef test_legal_id():\n    assert NC(\"PT Sinar Abadi\") == NC(\"Sinar Abadi\") == \"sinarabadi\"\n    assert NC(\"CV Maju Bersama\") == \"majubersama\"\n    assert NC(\"UD Sumber Rejeki\") == \"sumberrejeki\"\n    assert NC(\"PT Maju Perseroan Terbatas\") == \"maju\"\n\n\n# ---------------------------------------------------------------- numbers\ndef test_number_normalization():\n    assert parse_number(\"1,000\") == parse_number(\"1000\") == parse_number(\"１，０００\") == Decimal(\"1000\")\n    assert parse_number(\"1.234,56\") == parse_number(\"1,234.56\") == Decimal(\"1234.56\")\n    assert parse_number(\"¥12,500\") == Decimal(\"12500\")\n    assert parse_number(\"abc\") is None\n\n\n# ---------------------------------------------------------------- pipeline\ndef _tables(a_rows, b_rows, headers_a=None, headers_b=None):\n    h = headers_a or [\"会社名\", \"金額\"]\n    return (Table(h, a_rows), Table(headers_b or h, b_rows))\n\n\ndef test_exact_and_ok():\n    ta, tb = _tables([[\"株式会社ABC\", \"1000\"]], [[\"ABC Co., Ltd.\", \"1,000\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.counts()[\"ok\"] == 1\n    assert res.cat1_a() == [] and res.cat1_b() == []\n\n\ndef test_amount_diff_cat2():\n    ta, tb = _tables([[\"ABC\", \"1000\"]], [[\"ABC\", \"900\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert len(res.diff_pairs) == 1\n    d = res.diff_pairs[0].diffs[0]\n    assert d[\"da\"] == Decimal(\"1000\") and d[\"db\"] == Decimal(\"900\")\n    assert res.cat1_a() == [] and res.cat1_b() == []\n\n\ndef test_one_side_only_cat1():\n    ta, tb = _tables([[\"ABC\", \"1000\"], [\"XYZ商事\", \"500\"]], [[\"ABC\", \"1000\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.cat1_a() == [1]\n    assert res.cat1_b() == []\n\n\ndef test_notation_variant_cat3():\n    # order numbers differ (no exact match); company names become EXACTLY\n    # equal after legal-form normalization -> deterministic candidate,\n    # reason states the rule, and there is no probability score.\n    h = [\"注文番号\", \"会社名\", \"金額\"]\n    ta = Table(h, [[\"A-001\", \"株式会社サンプル\", \"1000\"]])\n    tb = Table(h, [[\"A-002\", \"サンプル (株)\", \"1000\"]])\n    res = reconcile(ta, tb, [(0, 0), (1, 1)], [(2, 2)])\n    pend = [c for c in res.candidates if c.status == \"pending\"]\n    assert len(pend) == 1 and pend[0].kind == \"name\"\n    assert pend[0].reason_key == \"reason_legal\"\n    assert pend[0].confidence is None\n    assert res.cat1_a() == [] and res.cat1_b() == []   # held as candidate\n    res.reject(pend[0].id)\n    assert res.cat1_a() == [0] and res.cat1_b() == [0]  # back to cat 1\n\n\ndef test_deterministic_name_equal_cat3_en_and_accept():\n    h = [\"Order No\", \"Company\", \"Amount\"]\n    ta = Table(h, [[\"A-001\", \"ABC Trading Co., Ltd.\", \"1000\"]])\n    tb = Table(h, [[\"B-777\", \"ABC Trading\", \"1000\"]])\n    res = reconcile(ta, tb, [(0, 0), (1, 1)], [(2, 2)])\n    pend = [c for c in res.candidates if c.status == \"pending\"]\n    assert len(pend) == 1 and pend[0].kind == \"name\"\n    assert pend[0].confidence is None\n    assert res.accept(pend[0].id)\n    assert res.counts()[\"ok\"] == 1\n\n\ndef test_similar_names_never_paired():\n    # REGRESSION (user order 2026-11-13): similarity-based pairing is\n    # banned. Similar-but-unequal names must NOT become candidates —\n    # they land in category 1, where a human may pair them by hand.\n    ta, tb = _tables([[\"グローバル貿易\", \"1000\"]], [[\"グローバル貿易商事\", \"1000\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.candidates == []\n    assert res.cat1_a() == [0] and res.cat1_b() == [0]\n    assert res.manual_pair(0, 0)                # human decision still works\n    assert res.counts()[\"ok\"] == 1\n    # English: an extra real word after legal stripping = a different core\n    ta2, tb2 = _tables([[\"ABC Trading\", \"500\"]],\n                       [[\"ABC Trading International\", \"500\"]],\n                       headers_a=[\"Company\", \"Amount\"],\n                       headers_b=[\"Company\", \"Amount\"])\n    res2 = reconcile(ta2, tb2, [(0, 0)], [(1, 1)])\n    assert res2.candidates == []\n    assert res2.cat1_a() == [0] and res2.cat1_b() == [0]\n\n\ndef test_group_sum_candidate_not_autoconfirmed():\n    ta, tb = _tables(\n        [[\"ABC\", \"100\"]],\n        [[\"ABC\", \"60\"], [\"ABC\", \"40\"], [\"ABC\", \"999\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    grp = [c for c in res.candidates if c.kind == \"group\"]\n    assert len(grp) == 1\n    assert grp[0].b_rows == [0, 1] or sorted(grp[0].b_rows) == [0, 1]\n    assert grp[0].confidence is None           # arithmetic-exact, no %\n    assert grp[0].status == \"pending\"          # NOT auto-confirmed\n    assert res.counts()[\"ok\"] == 0\n    assert res.accept(grp[0].id)\n    assert res.cat1_a() == [] and res.cat1_b() == [2]\n\n\ndef test_composite_key():\n    h = [\"注文番号\", \"会社名\", \"金額\"]\n    ta = Table(h, [[\"A-001\", \"ABC\", \"100\"], [\"A-002\", \"ABC\", \"200\"]])\n    tb = Table(h, [[\"A-002\", \"ABC\", \"200\"], [\"A-001\", \"ABC\", \"150\"]])\n    res = reconcile(ta, tb, [(0, 0), (1, 1)], [(2, 2)])\n    assert res.counts()[\"ok\"] == 1\n    assert len(res.diff_pairs) == 1            # A-001 amount differs\n\n\ndef test_tolerance():\n    ta, tb = _tables([[\"ABC\", \"1000\"]], [[\"ABC\", \"1005\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)], tolerance=Decimal(\"10\"))\n    assert res.counts()[\"ok\"] == 1\n    res2 = reconcile(ta, tb, [(0, 0)], [(1, 1)], tolerance=Decimal(\"0\"))\n    assert len(res2.diff_pairs) == 1\n\n\ndef test_manual_pair():\n    ta, tb = _tables([[\"ABC\", \"100\"]], [[\"全然違う名前\", \"100\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.cat1_a() == [0] and res.cat1_b() == [0]\n    assert res.manual_pair(0, 0)\n    assert res.counts()[\"ok\"] == 1\n\n\ndef test_proposal():\n    ha = [\"注文番号\", \"会社名\", \"金額\"]\n    hb = [\"Order No\", \"Company\", \"Amount\"]\n    ta = Table(ha, [[\"1\", \"ABC\", \"100\"], [\"2\", \"XYZ\", \"200\"]])\n    tb = Table(hb, [[\"1\", \"ABC\", \"100\"], [\"3\", \"ZZZ\", \"300\"]])\n    keys, compares = core.propose_mapping(ta, tb)\n    assert (0, 0) in keys\n    assert (2, 2) in compares\n\n\ndef test_loading_semicolon_shiftjis(tmp_path):\n    p = tmp_path / \"eu_sjis.csv\"\n    text = \"会社名;金額\\n株式会社ABC;1,000\\n\"\n    p.write_bytes(text.encode(\"shift_jis\"))\n    t = core.load_table(str(p))\n    assert t.headers == [\"会社名\", \"金額\"]\n    assert t.rows[0][0] == \"株式会社ABC\"\n    assert t.meta[\"delimiter\"] == \";\"\n    p2 = tmp_path / \"semi.csv\"\n    p2.write_bytes(\"name;amount\\nABC;100\\n\".encode(\"utf-8\"))\n    t2 = core.load_table(str(p2))\n    assert t2.headers == [\"name\", \"amount\"] and t2.rows[0][1] == \"100\"\n\n\n# ------------------------------------------------------- typed resolution\n# Key/compare combos accept typed text; resolve_column must find the column\n# a person meant despite width, spacing, punctuation and synonym variants.\n_JP_H = [\"注文番号\", \"会社名\", \"金額\", \"数量\"]\n_EN_H = [\"Order No\", \"Company\", \"Amount\", \"Quantity\"]\n\n\ndef _hdr_table(headers):\n    return Table(headers, [[\"x\"] * len(headers)])\n\n\ndef test_resolve_exact_and_spacing():\n    t = _hdr_table(_JP_H)\n    assert core.resolve_column(t, \"注文番号\") == 0\n    assert core.resolve_column(t, \"注文 番号\") == 0     # halfwidth space\n    assert core.resolve_column(t, \"注文　番号\") == 0     # fullwidth space\n    assert core.resolve_column(t, \" 金額 \") == 2         # stray spaces\n\n\ndef test_resolve_fullwidth_latin():\n    t = _hdr_table(_JP_H)\n    assert core.resolve_column(t, \"ＯＲＤＥＲ番号\") == 0\n    e = _hdr_table(_EN_H)\n    assert core.resolve_column(e, \"ＯＲＤＥＲ　Ｎｏ\") == 0\n    assert core.resolve_column(e, \"Ａｍｏｕｎｔ\") == 2\n\n\ndef test_resolve_punctuation_variants():\n    e = _hdr_table(_EN_H)\n    assert core.resolve_column(e, \"Order-No.\") == 0\n    assert core.resolve_column(e, \"order_no\") == 0\n    assert core.resolve_column(e, \"Order−No\") == 0      # U+2212 minus\n    t = _hdr_table(_JP_H)\n    assert core.resolve_column(t, \"金額（円）\") == 2     # parenthesised unit\n    assert core.resolve_column(e, \"amount（円）\") == 2\n    assert core.resolve_column(e, \"Amount (JPY)\") == 2\n\n\ndef test_resolve_synonyms():\n    t = _hdr_table(_JP_H)\n    assert core.resolve_column(t, \"オーダーNo\") == 0\n    assert core.resolve_column(t, \"オーダー番号\") == 0\n    assert core.resolve_column(t, \"請求金額\") == 2       # amount synonym\n    e = _hdr_table(_EN_H)\n    assert core.resolve_column(e, \"注文番号\") == 0       # cross-language\n    b = _hdr_table([\"納品番号\", \"取引先\", \"金額\", \"数量\"])\n    assert core.resolve_column(b, \"取引先名\") == 1       # company synonym\n\n\ndef test_resolve_unresolvable_and_empty():\n    t = _hdr_table(_JP_H)\n    assert core.resolve_column(t, \"zzzqqq\") is None\n    assert core.resolve_column(t, \"存在しない列\") is None\n    assert core.resolve_column(t, \"（なし）\") is None    # the none label\n    assert core.resolve_column(t, \"\") is None           # optional rows: unset\n    assert core.resolve_column(t, \"   \") is None\n    assert core.resolve_column(t, None) is None\n\n\ndef test_resolve_no_cross_concept():\n    # 納品番号 is invoice_no, NOT order_no: typing 注文番号 on that side\n    # must not silently land on it.\n    b = _hdr_table([\"納品番号\", \"取引先\", \"金額\", \"数量\"])\n    assert core.resolve_column(b, \"注文番号\") is None\n\n\ndef test_resolve_proposal_regression():\n    ha = [\"注文番号\", \"会社名\", \"金額\"]\n    hb = [\"Order No\", \"Company\", \"Amount\"]\n    ta = Table(ha, [[\"1\", \"ABC\", \"100\"], [\"2\", \"XYZ\", \"200\"]])\n    tb = Table(hb, [[\"1\", \"ABC\", \"100\"], [\"3\", \"ZZZ\", \"300\"]])\n    for tbl in (ta, tb):\n        for i, h in enumerate(tbl.headers):\n            assert core.resolve_column(tbl, h) == i\n    keys, compares = core.propose_mapping(ta, tb)\n    for ai, bi in keys + compares:\n        assert core.resolve_column(ta, ta.headers[ai]) == ai\n        assert core.resolve_column(tb, tb.headers[bi]) == bi\n\n\ndef test_code_key_case_width():\n    h = [\"コード\", \"金額\"]\n    ta = Table(h, [[\"ＡＢ－００１\", \"100\"]])\n    tb = Table(h, [[\"ab001\", \"100\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.counts()[\"ok\"] == 1\n"}, {"p": "tests/test_phase3.py", "s": 10743, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Phase-3 tests: alias dictionary (B) + corporate-number registry (A).\nFixtures only — no network access anywhere in this file.\"\"\"\nimport os\nimport sys\nimport urllib.error\nfrom decimal import Decimal\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nimport core\nimport houjin\nfrom core import (AliasDictionary, CompanyEquivalence, Table, reconcile)\n\nKANJI = \"田中電機株式会社\"\nKANA = \"タナカデンキ\"\n\n\n# ------------------------------------------------------------------ kana\ndef test_kana_helpers():\n    assert core.is_kana_only(\"タナカデンキ\")\n    assert core.is_kana_only(\"タナカデンキ（株）\")\n    assert core.is_kana_only(\"たなかでんき\")\n    assert not core.is_kana_only(\"田中電機\")\n    assert not core.is_kana_only(\"田中デンキ\")          # mixed stays human work\n    assert not core.is_kana_only(\"\")\n    assert core.kana_core(\"タナカデンキ（株）\") == \"タナカデンキ\"\n    assert core.kana_core(\"たなかでんき\") == \"タナカデンキ\"\n    assert core.kana_core(\"カブシキガイシャタナカデンキ\") == \"タナカデンキ\"\n\n\n# ------------------------------------------------------------- dictionary\ndef test_dictionary_crud(tmp_path):\n    path = str(tmp_path / \"aliases.json\")\n    d = AliasDictionary(path)\n    assert not d.has(KANJI, KANA)\n    assert d.add(KANJI, KANA, source=\"manual\")\n    assert d.has(KANJI, KANA) and d.has(KANA, KANJI)       # unordered\n    assert not d.add(KANJI, KANA)                          # duplicate\n    assert d.add(KANA, KANJI, source=\"houjin\", number=\"1234567890123\") is False\n    assert d.entry(KANJI, KANA)[\"number\"] == \"1234567890123\"   # annotated\n    d.save()\n    d2 = AliasDictionary(path)                             # reload\n    assert d2.has(KANJI, KANA)\n    assert d2.partners(KANJI) == [KANA]\n    assert d2.remove(KANA, KANJI)\n    assert not d2.has(KANJI, KANA)\n\n\ndef test_dictionary_equality_in_pipeline():\n    h = [\"会社名\", \"金額\"]\n    ta, tb = Table(h, [[KANJI, \"1000\"]]), Table(h, [[KANA, \"1,000\"]])\n    # without a dictionary: kanji vs kana are NOT equal (never guessed)\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.counts()[\"ok\"] == 0\n    assert res.cat1_a() == [0] and res.cat1_b() == [0]\n    # with the pair registered: exactly equal, like a normalized match\n    d = AliasDictionary()\n    d.add(KANJI, KANA, source=\"manual\")\n    res2 = reconcile(ta, tb, [(0, 0)], [(1, 1)],\n                     equiv=CompanyEquivalence(d))\n    assert res2.counts()[\"ok\"] == 1\n    # deleting the entry stops future matching\n    d.remove(KANJI, KANA)\n    res3 = reconcile(ta, tb, [(0, 0)], [(1, 1)],\n                     equiv=CompanyEquivalence(d))\n    assert res3.counts()[\"ok\"] == 0\n\n\ndef test_dictionary_reason_on_candidate():\n    # order numbers differ -> no exact match; names dict-paired ->\n    # category-3 candidate whose reason cites the dictionary (+ number)\n    h = [\"注文番号\", \"会社名\", \"金額\"]\n    ta = Table(h, [[\"A-1\", KANJI, \"100\"]])\n    tb = Table(h, [[\"B-9\", KANA, \"100\"]])\n    d = AliasDictionary()\n    d.add(KANJI, KANA, source=\"houjin\", number=\"1234567890123\")\n    res = reconcile(ta, tb, [(0, 0), (1, 1)], [(2, 2)],\n                    equiv=CompanyEquivalence(d))\n    pend = [c for c in res.candidates if c.status == \"pending\"]\n    assert len(pend) == 1 and pend[0].kind == \"name\"\n    assert pend[0].reason_key == \"reason_dict_num\"\n    assert pend[0].reason_params == {\"number\": \"1234567890123\"}\n    assert res.accept(pend[0].id)\n    assert res.counts()[\"ok\"] == 1\n\n\ndef test_learn_on_manual_pair_flow():\n    # core-level model of the app flow: human pairs by hand, the pair is\n    # registered, and the NEXT run matches automatically.\n    h = [\"会社名\", \"金額\"]\n    ta, tb = Table(h, [[KANJI, \"100\"]]), Table(h, [[KANA, \"100\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.manual_pair(0, 0)\n    d = AliasDictionary()\n    assert d.add(KANJI, KANA, source=\"manual\")\n    res2 = reconcile(ta, tb, [(0, 0)], [(1, 1)],\n                     equiv=CompanyEquivalence(d))\n    assert res2.counts()[\"ok\"] == 1\n\n\n# ------------------------------------------------------- registry fixtures\ndef _xml(records, count=None, last_update=\"2026-11-10\"):\n    body = []\n    for i, r in enumerate(records, 1):\n        body.append(\n            \"<corporation><sequenceNumber>%d<\/sequenceNumber>\"\n            \"<corporateNumber>%s<\/corporateNumber><process>01<\/process>\"\n            \"<correct>0<\/correct><updateDate>2026-11-01<\/updateDate>\"\n            \"<changeDate>2020-04-01<\/changeDate><name>%s<\/name>\"\n            \"<nameImageId/><kind>301<\/kind>\"\n            \"<prefectureName>%s<\/prefectureName><cityName>%s<\/cityName>\"\n            \"<streetNumber>%s<\/streetNumber><addressImageId/>\"\n            \"<prefectureCode>23<\/prefectureCode><cityCode>101<\/cityCode>\"\n            \"<postCode>4500002<\/postCode><addressOutside/>\"\n            \"<addressOutsideImageId/><closeDate/><closeCause/>\"\n            \"<successorCorporateNumber/><changeCause/>\"\n            \"<assignmentDate>2015-10-05<\/assignmentDate><latest>1<\/latest>\"\n            \"<enName/><enPrefectureName/><enCityName/><enAddressOutside/>\"\n            \"<furigana>%s<\/furigana><hihyoji>0<\/hihyoji><\/corporation>\"\n            % (i, r[\"number\"], r[\"name\"], r.get(\"pref\", \"愛知県\"),\n               r.get(\"city\", \"名古屋市中村区\"), r.get(\"street\", \"名駅一丁目1番1号\"),\n               r.get(\"furigana\", \"\")))\n    n = len(records) if count is None else count\n    return (\"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\"?>\"\n            \"<corporations><lastUpdateDate>%s<\/lastUpdateDate>\"\n            \"<count>%d<\/count><divideNumber>1<\/divideNumber>\"\n            \"<divideSize>1<\/divideSize>%s<\/corporations>\"\n            % (last_update, n, \"\".join(body))).encode(\"utf-8\")\n\n\nSINGLE = _xml([{\"number\": \"1234567890123\", \"name\": KANJI, \"furigana\": KANA}])\nMULTI = _xml([\n    {\"number\": \"1234567890123\", \"name\": KANJI, \"furigana\": KANA},\n    {\"number\": \"9876543210987\", \"name\": KANJI, \"furigana\": KANA,\n     \"pref\": \"東京都\", \"city\": \"千代田区\", \"street\": \"丸の内一丁目1番1号\"},\n])\nZERO = _xml([])\n\n\ndef _client(payload, cache_path=None):\n    calls = []\n\n    def fetch(url, timeout):\n        calls.append(url)\n        return payload\n    return houjin.HoujinClient(\"TESTID1234567\", cache_path=cache_path,\n                               fetcher=fetch), calls\n\n\ndef test_parse_single_multi_zero():\n    for payload, n in ((SINGLE, 1), (MULTI, 2), (ZERO, 0)):\n        last, records, dno, dsz = houjin.HoujinClient.parse_response(payload)\n        assert last == \"2026-11-10\" and len(records) == n\n        assert (dno, dsz) == (1, 1)\n    last, records, _d, _s = houjin.HoujinClient.parse_response(SINGLE)\n    r = records[0]\n    assert r.number == \"1234567890123\" and r.name == KANJI\n    assert r.furigana == KANA and r.address.startswith(\"愛知県名古屋市中村区\")\n\n\ndef test_evaluate_auto_pair():\n    _c, _calls = _client(SINGLE)\n    res = _c.search_by_name(KANJI)\n    status, payload = houjin.evaluate(res[\"records\"], KANJI, KANA + \"（株）\")\n    assert status == \"auto\" and payload.number == \"1234567890123\"\n    # halfwidth kana variant of the same reading also proves identity\n    status2, _p = houjin.evaluate(res[\"records\"], KANJI, \"ﾀﾅｶﾃﾞﾝｷ\")\n    assert status2 == \"auto\"\n    # a DIFFERENT kana name is not this corporation\n    status3, _p = houjin.evaluate(res[\"records\"], KANJI, \"ヤマダデンキ\")\n    assert status3 == \"none\"\n\n\ndef test_evaluate_multi_and_zero():\n    c, _calls = _client(MULTI)\n    res = c.search_by_name(KANJI)\n    status, matches = houjin.evaluate(res[\"records\"], KANJI, KANA)\n    assert status == \"multi\" and len(matches) == 2      # human must pick\n    c0, _ = _client(ZERO)\n    res0 = c0.search_by_name(\"存在しない会社\")\n    assert res0[\"records\"] == []\n    status0, m0 = houjin.evaluate(res0[\"records\"], \"存在しない会社\", KANA)\n    assert status0 == \"none\" and m0 == []\n\n\ndef test_evaluate_mixed_kana_kanji_needs_human():\n    c, _ = _client(SINGLE)\n    res = c.search_by_name(KANJI)\n    # 田中デンキ is kana+kanji mixed: NOT auto-paired (dictionary route)\n    status, _p = houjin.evaluate(res[\"records\"], KANJI, \"田中デンキ\")\n    assert status == \"none\"\n\n\ndef test_client_cache(tmp_path):\n    cache = str(tmp_path / \"houjin_cache.json\")\n    c, calls = _client(SINGLE, cache_path=cache)\n    r1 = c.search_by_name(KANJI)\n    r2 = c.search_by_name(KANJI)\n    assert len(calls) == 1                              # 2nd hit the cache\n    assert r1[\"from_cache\"] is False and r2[\"from_cache\"] is True\n    assert r2[\"fetched\"] and r2[\"last_update\"] == \"2026-11-10\"\n    assert os.path.exists(cache)\n    c2, calls2 = _client(SINGLE, cache_path=cache)      # fresh client, disk cache\n    r3 = c2.search_by_name(KANJI)\n    assert r3[\"from_cache\"] is True and calls2 == []\n\n\ndef test_client_errors_graceful():\n    def boom(url, timeout):\n        raise urllib.error.URLError(\"offline\")\n    c = houjin.HoujinClient(\"TESTID1234567\", fetcher=boom)\n    try:\n        c.search_by_name(KANJI)\n        assert False, \"expected HoujinError\"\n    except houjin.HoujinError as e:\n        assert e.kind == \"network\"\n\n    def http_err(url, timeout):\n        raise urllib.error.HTTPError(url, 400, \"Bad Request\", {}, None)\n    c2 = houjin.HoujinClient(\"TESTID1234567\", fetcher=http_err)\n    try:\n        c2.search_by_name(KANJI)\n        assert False\n    except houjin.HoujinError as e:\n        assert e.kind == \"http\" and e.detail == 400\n\n    c3, _ = _client(b\"<html>not the registry<\/html>\")\n    try:\n        c3.search_by_name(KANJI)\n        assert False\n    except houjin.HoujinError as e:\n        assert e.kind == \"parse\"\n\n    c4 = houjin.HoujinClient(\"\", fetcher=lambda u, t: SINGLE)\n    try:\n        c4.search_by_name(KANJI)\n        assert False\n    except houjin.HoujinError as e:\n        assert e.kind == \"no_id\"\n\n\ndef test_client_url_follows_spec():\n    c, calls = _client(SINGLE)\n    c.search_by_name(KANJI)\n    assert calls[0].startswith(\"https://api.houjin-bangou.nta.go.jp/4/name?\")\n    assert \"type=12\" in calls[0] and \"id=TESTID1234567\" in calls[0]\n\n\ndef test_houjin_pair_records_proof():\n    h = [\"会社名\", \"金額\"]\n    ta, tb = Table(h, [[KANJI, \"100\"]]), Table(h, [[KANA, \"100\"]])\n    res = reconcile(ta, tb, [(0, 0)], [(1, 1)])\n    assert res.houjin_pair(0, 0, \"1234567890123\")\n    assert res.counts()[\"ok\"] == 1\n    assert res.houjin_pairs == [(0, 0, \"1234567890123\")]\n    assert not res.houjin_pair(0, 0, \"1234567890123\")   # already matched\n\n\ndef test_i18n_key_consistency():\n    import i18n\n    base = set(i18n.S[\"ja\"])\n    for lang in i18n.LANG_ORDER:\n        assert set(i18n.S[lang]) == base, lang\n"}]</script>

<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
