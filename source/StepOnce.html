<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('gq-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;}}catch(e){}})();</script>
<title>StepOnce のソースコード | get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#0D1526; --surface:#111C33; --surface2:#182747;
  --codebg:#0D1117; --ink:#E8EEF8; --muted:#93A5C4; --faint:#5B6E92; --line:#22314F;
  --line-soft:rgba(34,49,79,.55); --gutter-line:#21262D; --gutter-ink:#484F58;
  --accent:#3B82F6; --accent-strong:#60A5FA; --accent-soft:rgba(59,130,246,.16);
  --active-ink:#FFFFFF;
  --font-body:"Inter","Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F8FD; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#E7EFFD;
  --codebg:#FFFFFF; --ink:#0F1B33; --muted:#3B4A66; --faint:#64748B; --line:#DFE7F3;
  --line-soft:#E7EDF6; --gutter-line:#D8DEE4; --gutter-ink:#6E7781;
  --accent:#2563EB; --accent-strong:#1D4ED8; --accent-soft:rgba(37,99,235,.12);
  --active-ink:#1D4ED8;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:var(--accent-strong)}
/* ===== top bar ===== */
.topbar{flex:none;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;
  padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .appname{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .appname .ja{color:var(--muted);font-size:.82em;font-weight:700;margin-left:10px}
.topbar .meta{color:var(--faint);font-size:.85rem;white-space:nowrap}
.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:18px}
.topbar nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
.topbar nav a:hover{color:var(--ink)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 18px;border-radius:999px;
  box-shadow:0 8px 20px -6px rgba(37,99,235,.5);white-space:nowrap}
.dlbtn:hover{filter:brightness(1.12)}
.dlbtn svg{flex:none}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  cursor:pointer;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ic-moon{display:none}
:root[data-theme="light"] .themebtn .ic-moon{display:block}
:root[data-theme="light"] .themebtn .ic-sun{display:none}
.langpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.85rem;font-weight:700;
  line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;cursor:pointer;max-width:190px}
.langpick select:hover{border-color:var(--accent)}
/* ===== main split ===== */
.main{flex:1;display:flex;min-height:0}
.filelist{width:284px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--panel);
  border-right:1px solid var(--line)}
[dir="rtl"] .filelist{border-right:0;border-left:1px solid var(--line)}
.filelist .fl-head{padding:11px 16px;font-weight:800;font-size:.86rem;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.file-btn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);color:var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:.8rem;line-height:1.45;
  text-align:left;cursor:pointer;word-break:break-all}
.file-btn:hover{background:var(--surface2)}
.file-btn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);color:var(--active-ink)}
[dir="rtl"] .file-btn.active{box-shadow:inset -3px 0 0 var(--accent)}
.file-btn .sz{color:var(--faint);font-size:.7rem;flex:none}
.file-bin{padding:9px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);
  font-size:.8rem;line-height:1.45;color:var(--faint);word-break:break-all}
.file-bin .sz{font-size:.7rem;margin-left:8px}
.bin-note{display:block;font-family:var(--font-body);font-size:.72rem;color:#64748B;margin-top:1px}
/* ===== code pane ===== */
.codepane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--codebg)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .fname{font-family:var(--font-mono);font-size:.95rem;font-weight:700;word-break:break-all}
.toolbar .finfo{color:var(--muted);font-size:.85rem;white-space:nowrap}
.copybtn{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:7px 18px;border-radius:999px}
[dir="rtl"] .copybtn{margin-left:0;margin-right:auto}
.copybtn:hover{filter:brightness(1.12)}
.copybtn.done{background:#0E9F6E}
.code-scroll{flex:1;overflow:auto;min-height:0;direction:ltr}
.code-flex{display:flex;min-width:max-content;min-height:100%}
.gutter{flex:none;position:sticky;left:0;z-index:1;background:var(--codebg);
  border-right:1px solid var(--gutter-line);text-align:right;user-select:none;white-space:pre;
  font-family:var(--font-mono);font-size:16px;line-height:1.75;
  padding:16px 12px 24px 18px;color:var(--gutter-ink)}
.code-flex pre.code{flex:1;margin:0;padding:16px 28px 24px 20px;
  font-family:var(--font-mono);font-size:16px;line-height:1.75}
.code-flex pre.code code{font-family:inherit;font-size:inherit;line-height:inherit;
  background:transparent;padding:0;white-space:pre}
/* ===== highlight.js GitHub Dark (default) ===== */
.hljs{color:#E6EDF3;background:#0D1117}
.hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-variable,
.hljs-template-tag,.hljs-type,.hljs-variable.language_{color:#FF7B72}
.hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,
.hljs-title.function_{color:#D2A8FF}
.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,
.hljs-variable,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:#79C0FF}
.hljs-regexp,.hljs-string,.hljs-meta .hljs-string{color:#A5D6FF}
.hljs-built_in,.hljs-symbol{color:#FFA657}
.hljs-comment,.hljs-code,.hljs-formula{color:#8B949E}
.hljs-name,.hljs-quote,.hljs-selector-tag,.hljs-selector-pseudo{color:#7EE787}
.hljs-subst{color:#E6EDF3}
.hljs-section{color:#1F6FEB;font-weight:bold}
.hljs-bullet{color:#F2CC60}
.hljs-emphasis{color:#E6EDF3;font-style:italic}
.hljs-strong{color:#E6EDF3;font-weight:bold}
.hljs-addition{color:#AFF5B4;background-color:#033A16}
.hljs-deletion{color:#FFDCD7;background-color:#67060C}
.hljs-char.escape_,.hljs-link,.hljs-params,.hljs-property,.hljs-punctuation,.hljs-tag{/* purposely ignored */}
/* ===== highlight.js GitHub Light ===== */
:root[data-theme="light"] .hljs{color:#24292E;background:#FFFFFF}
:root[data-theme="light"] .hljs-doctag,:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-meta .hljs-keyword,:root[data-theme="light"] .hljs-template-variable,
:root[data-theme="light"] .hljs-template-tag,:root[data-theme="light"] .hljs-type,
:root[data-theme="light"] .hljs-variable.language_{color:#D73A49}
:root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.class_,
:root[data-theme="light"] .hljs-title.class_.inherited__,
:root[data-theme="light"] .hljs-title.function_{color:#6F42C1}
:root[data-theme="light"] .hljs-attr,:root[data-theme="light"] .hljs-attribute,
:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-meta,
:root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-operator,
:root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-selector-attr,
:root[data-theme="light"] .hljs-selector-class,:root[data-theme="light"] .hljs-selector-id{color:#005CC5}
:root[data-theme="light"] .hljs-regexp,:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-meta .hljs-string{color:#032F62}
:root[data-theme="light"] .hljs-built_in,:root[data-theme="light"] .hljs-symbol{color:#E36209}
:root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-code,
:root[data-theme="light"] .hljs-formula{color:#6A737D}
:root[data-theme="light"] .hljs-name,:root[data-theme="light"] .hljs-quote,
:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-selector-pseudo{color:#22863A}
:root[data-theme="light"] .hljs-subst{color:#24292E}
:root[data-theme="light"] .hljs-section{color:#005CC5;font-weight:bold}
:root[data-theme="light"] .hljs-bullet{color:#735C0F}
:root[data-theme="light"] .hljs-emphasis{color:#24292E;font-style:italic}
:root[data-theme="light"] .hljs-strong{color:#24292E;font-weight:bold}
:root[data-theme="light"] .hljs-addition{color:#22863A;background-color:#F0FFF4}
:root[data-theme="light"] .hljs-deletion{color:#B31D28;background-color:#FFEEF0}
@media (max-width:760px){
  .main{flex-direction:column}
  .filelist{width:auto;flex:none;max-height:158px;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line)}
  .filelist .fl-head{position:static}
  .filelist .fl-items{display:flex;flex-direction:row;overflow-x:auto}
  .file-btn,.file-bin{flex:none;border-bottom:0;border-right:1px solid var(--line-soft);
    white-space:nowrap;word-break:normal;align-items:center}
  .code-flex pre.code,.gutter{font-size:14.5px}
  .topbar .meta{display:none}
  .langpick select{max-width:140px}
}
</style>

<script type="application/json" id="filedata">[{"p": "app.py", "s": 47672, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"StepOnce - main GUI.\n\nRecord a task once, as usual, and get a draft manual in 13 languages.\n\nLanguage switching follows the same pattern as the user's other apps: a\nlanguage label + combo box at the right end of the top header, instant\nretranslation of the whole window without a restart, the choice is saved\nand restored on the next launch, and Arabic switches the whole layout to\nright-to-left. The recording panel follows the current language too.\n\"\"\"\n\nimport json\nimport os\nimport sys\n\nfrom PIL import Image, ImageDraw\n\nimport core\nimport exporter\nimport icons\nimport recorder as recorder_mod\nimport theme\nfrom appinfo import APP_ID, display_name\nfrom i18n import LANG_NAMES, LANG_ORDER, RTL_LANGS, tr\n\nfrom PySide6.QtCore import Qt, QObject, QRect, QSize, QTimer, Signal\nfrom PySide6.QtGui import QImage, QPixmap, QShortcut, QKeySequence\nfrom PySide6.QtWidgets import (\n    QApplication, QCheckBox, QComboBox, QDialog, QFileDialog, QFrame,\n    QHBoxLayout, QLabel, QLineEdit, QListWidget, QListWidgetItem,\n    QMainWindow, QMessageBox, QPlainTextEdit, QPushButton, QRubberBand,\n    QSplitter, QVBoxLayout, QWidget,\n)\n\n\ndef _repolish(widget):\n    widget.style().unpolish(widget)\n    widget.style().polish(widget)\n\n\n# ----------------------------------------------------------------------\n# Settings (language + optional DeepL key), stored per-OS like the\n# user's other apps.\n# ----------------------------------------------------------------------\n\ndef data_dir():\n    if sys.platform == \"win32\":\n        base = os.environ.get(\"APPDATA\") or os.path.expanduser(\"~\")\n    elif sys.platform == \"darwin\":\n        base = os.path.join(os.path.expanduser(\"~\"),\n                            \"Library\", \"Application Support\")\n    else:\n        base = os.environ.get(\"XDG_DATA_HOME\") or os.path.join(\n            os.path.expanduser(\"~\"), \".local\", \"share\")\n    path = os.path.join(base, APP_ID)\n    os.makedirs(path, exist_ok=True)\n    return path\n\n\ndef load_settings():\n    try:\n        with open(os.path.join(data_dir(), \"settings.json\"),\n                  encoding=\"utf-8\") as fh:\n            data = json.load(fh)\n        return data if isinstance(data, dict) else {}\n    except Exception:\n        return {}\n\n\ndef save_settings(settings):\n    try:\n        with open(os.path.join(data_dir(), \"settings.json\"), \"w\",\n                  encoding=\"utf-8\") as fh:\n            json.dump(settings, fh, ensure_ascii=False, indent=1)\n    except Exception:\n        pass\n\n\ndef pil_to_pixmap(img):\n    if img.mode != \"RGB\":\n        img = img.convert(\"RGB\")\n    data = img.tobytes(\"raw\", \"RGB\")\n    qimg = QImage(data, img.width, img.height, img.width * 3,\n                  QImage.Format.Format_RGB888)\n    return QPixmap.fromImage(qimg.copy())\n\n\n# ----------------------------------------------------------------------\n# Image view with mosaic-drag support\n# ----------------------------------------------------------------------\n\nclass ImageView(QLabel):\n    \"\"\"Shows the step image scaled to fit; in mosaic mode, dragging\n    emits rect_dragged with image-relative coordinates.\"\"\"\n\n    rect_dragged = Signal(float, float, float, float)\n\n    def __init__(self):\n        super().__init__()\n        self.setObjectName(\"preview\")\n        self.setAlignment(Qt.AlignmentFlag.AlignCenter)\n        self.setMinimumSize(320, 170)\n        self._pixmap = None\n        self._drag_start = None\n        self._drag_origin = None\n        self._rubber = None\n        self._mosaic_mode = False\n\n    @property\n    def mosaic_mode(self):\n        return self._mosaic_mode\n\n    @mosaic_mode.setter\n    def mosaic_mode(self, on):\n        self._mosaic_mode = bool(on)\n        self.setCursor(Qt.CursorShape.CrossCursor if on\n                       else Qt.CursorShape.ArrowCursor)\n\n    def set_image(self, pixmap):\n        self._pixmap = pixmap\n        self._update_shown()\n\n    def _shown_rect(self):\n        if not self._pixmap:\n            return None\n        lw, lh = self.width(), self.height()\n        pw, ph = self._pixmap.width(), self._pixmap.height()\n        scale = min(lw / pw, lh / ph)\n        w, h = int(pw * scale), int(ph * scale)\n        return ((lw - w) // 2, (lh - h) // 2, w, h)\n\n    def _update_shown(self):\n        if not self._pixmap:\n            super().setPixmap(QPixmap())\n            return\n        rect = self._shown_rect()\n        if rect:\n            scaled = self._pixmap.scaled(\n                rect[2], rect[3], Qt.AspectRatioMode.KeepAspectRatio,\n                Qt.TransformationMode.SmoothTransformation)\n            super().setPixmap(scaled)\n\n    def resizeEvent(self, event):\n        super().resizeEvent(event)\n        self._update_shown()\n\n    def _to_relative(self, pos):\n        rect = self._shown_rect()\n        if not rect or not self._pixmap:\n            return None\n        x = (pos.x() - rect[0]) / rect[2]\n        y = (pos.y() - rect[1]) / rect[3]\n        if 0.0 <= x <= 1.0 and 0.0 <= y <= 1.0:\n            return (x, y)\n        return (min(1.0, max(0.0, x)), min(1.0, max(0.0, y)))\n\n    def mousePressEvent(self, event):\n        if self.mosaic_mode and event.button() == Qt.MouseButton.LeftButton:\n            self._drag_start = self._to_relative(event.pos())\n            self._drag_origin = event.pos()\n            if self._rubber is None:\n                self._rubber = QRubberBand(\n                    QRubberBand.Shape.Rectangle, self)\n            self._rubber.setGeometry(QRect(self._drag_origin, QSize()))\n            self._rubber.show()\n        super().mousePressEvent(event)\n\n    def mouseMoveEvent(self, event):\n        if self.mosaic_mode and self._drag_origin is not None \\\n                and self._rubber is not None:\n            self._rubber.setGeometry(\n                QRect(self._drag_origin, event.pos()).normalized())\n        super().mouseMoveEvent(event)\n\n    def mouseReleaseEvent(self, event):\n        if self._rubber is not None:\n            self._rubber.hide()\n        if self.mosaic_mode and self._drag_start is not None:\n            end = self._to_relative(event.pos())\n            if end is not None:\n                x = min(self._drag_start[0], end[0])\n                y = min(self._drag_start[1], end[1])\n                w = abs(end[0] - self._drag_start[0])\n                h = abs(end[1] - self._drag_start[1])\n                if w > 0.005 and h > 0.005:\n                    self.rect_dragged.emit(x, y, w, h)\n            self._drag_start = None\n            self._drag_origin = None\n        super().mouseReleaseEvent(event)\n\n\n# ----------------------------------------------------------------------\n# Recording panel (always on top, small)\n# ----------------------------------------------------------------------\n\nclass RecordPanel(QWidget):\n    pause_toggled = Signal(bool)\n    finish_clicked = Signal()\n    capture_clicked = Signal()\n\n    def __init__(self, lang, manual_mode):\n        super().__init__(None, Qt.WindowType.WindowStaysOnTopHint\n                         | Qt.WindowType.Tool)\n        self.lang = lang\n        self.manual_mode = manual_mode\n        self.paused = False\n        self._dot_on = True\n        self.setStyleSheet(theme.stylesheet())\n        self.setAttribute(Qt.WidgetAttribute.WA_TranslucentBackground)\n        self.lbl_dot = QLabel()\n        self.lbl_dot.setObjectName(\"recDot\")\n        self.lbl_dot.setFixedSize(10, 10)\n        self.lbl_status = QLabel()\n        self.lbl_status.setObjectName(\"recStatus\")\n        self.lbl_count = QLabel()\n        self.lbl_count.setObjectName(\"recCount\")\n        self.btn_pause = QPushButton()\n        self.btn_capture = QPushButton()\n        self.btn_finish = QPushButton()\n        self.btn_finish.setProperty(\"role\", \"primary\")\n        card = QFrame()\n        card.setObjectName(\"panelCard\")\n        card.setFrameShape(QFrame.Shape.NoFrame)\n        outer = QVBoxLayout(self)\n        outer.setContentsMargins(10, 10, 10, 10)\n        outer.addWidget(card)\n        layout = QVBoxLayout(card)\n        layout.setContentsMargins(14, 12, 14, 12)\n        layout.setSpacing(8)\n        srow = QHBoxLayout()\n        srow.setSpacing(8)\n        srow.addWidget(self.lbl_dot)\n        srow.addWidget(self.lbl_status)\n        srow.addStretch(1)\n        layout.addLayout(srow)\n        layout.addWidget(self.lbl_count)\n        row = QHBoxLayout()\n        row.setSpacing(8)\n        row.addWidget(self.btn_pause)\n        row.addWidget(self.btn_capture)\n        row.addWidget(self.btn_finish)\n        layout.addLayout(row)\n        self.btn_pause.clicked.connect(self._toggle_pause)\n        self.btn_finish.clicked.connect(self.finish_clicked.emit)\n        self.btn_capture.clicked.connect(self.capture_clicked.emit)\n        self._dot_timer = QTimer(self)\n        self._dot_timer.setInterval(560)\n        self._dot_timer.timeout.connect(self._blink_dot)\n        self.retranslate(lang)\n        self.resize(380, 150)\n\n    def _toggle_pause(self):\n        self.paused = not self.paused\n        self.pause_toggled.emit(self.paused)\n        self._refresh_status()\n\n    def set_count(self, count):\n        self.lbl_count.setText(tr(self.lang, \"rec_count\", count=count))\n\n    def _blink_dot(self):\n        self._dot_on = not self._dot_on\n        self.lbl_dot.setProperty(\n            \"state\", \"\" if self._dot_on else \"off\")\n        _repolish(self.lbl_dot)\n\n    def closeEvent(self, event):\n        self._dot_timer.stop()\n        super().closeEvent(event)\n\n    def _refresh_status(self):\n        if self.paused:\n            self.lbl_status.setText(tr(self.lang, \"rec_paused\"))\n            self._dot_timer.stop()\n            self.lbl_dot.setProperty(\"state\", \"paused\")\n        else:\n            self.lbl_status.setText(tr(self.lang, \"rec_recording\"))\n            self._dot_on = True\n            self.lbl_dot.setProperty(\"state\", \"\")\n            self._dot_timer.start()\n        _repolish(self.lbl_dot)\n        self.btn_pause.setText(\n            tr(self.lang, \"btn_resume\" if self.paused else \"btn_pause\"))\n\n    def retranslate(self, lang):\n        self.lang = lang\n        self.setWindowTitle(tr(lang, \"rec_title\"))\n        self.btn_capture.setIcon(icons.icon(\"camera\", theme.INK))\n        self.btn_capture.setIconSize(QSize(16, 16))\n        self.btn_capture.setText(tr(lang, \"btn_capture_now\"))\n        self.btn_finish.setText(tr(lang, \"btn_finish\"))\n        self._refresh_status()\n\n\n# ----------------------------------------------------------------------\n# Dialogs\n# ----------------------------------------------------------------------\n\nclass SettingsDialog(QDialog):\n    def __init__(self, parent, lang, deepl_key):\n        super().__init__(parent)\n        self.lang = lang\n        self.setWindowTitle(tr(lang, \"set_title\"))\n        layout = QVBoxLayout(self)\n        layout.addWidget(QLabel(tr(lang, \"set_deepl_key\")))\n        self.edit_key = QLineEdit(deepl_key)\n        self.edit_key.setEchoMode(QLineEdit.EchoMode.Password)\n        layout.addWidget(self.edit_key)\n        note = QLabel(tr(lang, \"set_deepl_note\"))\n        note.setWordWrap(True)\n        layout.addWidget(note)\n        row = QHBoxLayout()\n        btn_ok = QPushButton(tr(lang, \"btn_ok\"))\n        btn_ok.setProperty(\"role\", \"primary\")\n        btn_cancel = QPushButton(tr(lang, \"btn_cancel\"))\n        btn_ok.clicked.connect(self.accept)\n        btn_cancel.clicked.connect(self.reject)\n        row.addWidget(btn_ok)\n        row.addWidget(btn_cancel)\n        layout.addLayout(row)\n        self.resize(440, 200)\n\n\nclass ExportDialog(QDialog):\n    def __init__(self, parent, lang, has_deepl_key):\n        super().__init__(parent)\n        self.lang = lang\n        self.setWindowTitle(tr(lang, \"exp_title\"))\n        layout = QVBoxLayout(self)\n        layout.addWidget(QLabel(tr(lang, \"exp_out_dir\")))\n        row = QHBoxLayout()\n        self.edit_dir = QLineEdit()\n        btn_browse = QPushButton(tr(lang, \"btn_browse\"))\n        btn_browse.clicked.connect(self._browse)\n        row.addWidget(self.edit_dir)\n        row.addWidget(btn_browse)\n        layout.addLayout(row)\n        layout.addWidget(QLabel(tr(lang, \"exp_languages\")))\n        self.lang_checks = {}\n        grid = QWidget()\n        grid_layout = QVBoxLayout(grid)\n        for code in LANG_ORDER:\n            chk = QCheckBox(LANG_NAMES[code])\n            chk.setChecked(True)\n            self.lang_checks[code] = chk\n            grid_layout.addWidget(chk)\n        layout.addWidget(grid)\n        layout.addWidget(QLabel(tr(lang, \"exp_formats\")))\n        self.chk_pdf = QCheckBox(tr(lang, \"exp_pdf\"))\n        self.chk_pdf.setChecked(True)\n        self.chk_docx = QCheckBox(tr(lang, \"exp_word\"))\n        self.chk_docx.setChecked(True)\n        layout.addWidget(self.chk_pdf)\n        layout.addWidget(self.chk_docx)\n        self.chk_marker = QCheckBox(tr(lang, \"exp_marker\"))\n        self.chk_marker.setChecked(True)\n        layout.addWidget(self.chk_marker)\n        self.chk_deepl = QCheckBox(tr(lang, \"exp_deepl\"))\n        self.chk_deepl.setEnabled(has_deepl_key)\n        layout.addWidget(self.chk_deepl)\n        if not has_deepl_key:\n            layout.addWidget(QLabel(tr(lang, \"exp_deepl_no_key\")))\n        row2 = QHBoxLayout()\n        self.btn_export = QPushButton(tr(lang, \"btn_do_export\"))\n        self.btn_export.setProperty(\"role\", \"primary\")\n        btn_close = QPushButton(tr(lang, \"btn_close\"))\n        self.btn_export.clicked.connect(self.accept)\n        btn_close.clicked.connect(self.reject)\n        row2.addWidget(self.btn_export)\n        row2.addWidget(btn_close)\n        layout.addLayout(row2)\n        self.resize(420, 560)\n\n    def _browse(self):\n        path = QFileDialog.getExistingDirectory(\n            self, tr(self.lang, \"dlg_out_dir\"))\n        if path:\n            self.edit_dir.setText(path)\n\n    def options(self):\n        langs = [c for c, chk in self.lang_checks.items() if chk.isChecked()]\n        formats = []\n        if self.chk_pdf.isChecked():\n            formats.append(\"pdf\")\n        if self.chk_docx.isChecked():\n            formats.append(\"docx\")\n        return {\n            \"out_dir\": self.edit_dir.text().strip(),\n            \"langs\": langs,\n            \"formats\": formats,\n            \"show_marker\": self.chk_marker.isChecked(),\n            \"use_deepl\": self.chk_deepl.isChecked(),\n        }\n\n\n# ----------------------------------------------------------------------\n# Step card (one \"page\" in the booklet-style step list)\n# ----------------------------------------------------------------------\n\nclass StepCard(QFrame):\n    \"\"\"A step shown as a page of a booklet: a large page number, the\n    thumbnail and the first lines of its text.\"\"\"\n\n    def __init__(self):\n        super().__init__()\n        self.setObjectName(\"stepCard\")\n        self.setFrameShape(QFrame.Shape.NoFrame)\n        self.setCursor(Qt.CursorShape.PointingHandCursor)\n        self.lbl_num = QLabel()\n        self.lbl_num.setObjectName(\"stepNum\")\n        self.lbl_num.setAlignment(\n            Qt.AlignmentFlag.AlignHCenter | Qt.AlignmentFlag.AlignTop)\n        self.lbl_num.setFixedWidth(44)\n        self.lbl_thumb = QLabel()\n        self.lbl_thumb.setObjectName(\"thumb\")\n        self.lbl_thumb.setFixedSize(122, 76)\n        self.lbl_thumb.setAlignment(Qt.AlignmentFlag.AlignCenter)\n        self.lbl_text = QLabel()\n        self.lbl_text.setObjectName(\"stepText\")\n        self.lbl_text.setWordWrap(True)\n        self.lbl_text.setAlignment(\n            Qt.AlignmentFlag.AlignLeft | Qt.AlignmentFlag.AlignTop)\n        self.lbl_meta = QLabel()\n        self.lbl_meta.setObjectName(\"stepMeta\")\n        layout = QHBoxLayout(self)\n        layout.setContentsMargins(10, 9, 12, 9)\n        layout.setSpacing(10)\n        layout.addWidget(self.lbl_num)\n        layout.addWidget(self.lbl_thumb)\n        texts = QVBoxLayout()\n        texts.setSpacing(3)\n        texts.addWidget(self.lbl_text)\n        texts.addWidget(self.lbl_meta)\n        texts.addStretch(1)\n        layout.addLayout(texts, 1)\n\n    def set_content(self, number, pixmap, text, meta):\n        self.lbl_num.setText(str(number))\n        if pixmap is not None:\n            self.lbl_thumb.setPixmap(pixmap)\n        else:\n            self.lbl_thumb.setPixmap(QPixmap())\n        self.lbl_text.setText(text)\n        self.lbl_meta.setText(meta)\n        self.lbl_meta.setVisible(bool(meta))\n\n    def set_text(self, text):\n        self.lbl_text.setText(text)\n\n    def set_selected(self, selected):\n        self.setProperty(\"selected\", \"true\" if selected else \"false\")\n        _repolish(self)\n\n\n# ----------------------------------------------------------------------\n# Main window\n# ----------------------------------------------------------------------\n\nclass RecorderBridge(QObject):\n    step_captured = Signal(object, object)\n\n\nclass MainWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.setStyleSheet(theme.stylesheet())\n        self.settings = load_settings()\n        self.lang = self.settings.get(\"lang\", \"ja\")\n        if self.lang not in LANG_ORDER:\n            self.lang = \"ja\"\n        self.project = core.Project()\n        self.current_step = None\n        self._loaded_text = None\n\n        self.bridge = RecorderBridge()\n        self.bridge.step_captured.connect(self._on_step_captured)\n        self.recorder = recorder_mod.create_recorder(\n            lambda step, img: self.bridge.step_captured.emit(step, img))\n        self.capturer = recorder_mod.ManualCapturer(\n            lambda step, img: self.bridge.step_captured.emit(step, img))\n        self.panel = None\n\n        self._build_ui()\n        self._apply_button_icons()\n        self.retranslate()\n        self._refresh_steps()\n        self.resize(1220, 800)\n\n    # -- button icons: drawn with QPainter (icons.py), never font glyphs,\n    # so rendering cannot fall back to a colour emoji font.\n    def _apply_button_icons(self):\n        ink = theme.INK\n        for btn, kind, color, size in (\n                (self.btn_capture, \"camera\", ink, 18),\n                (self.btn_export, \"book\", \"#FFFFFF\", 18),\n                (self.btn_mosaic_mode, \"brush\", ink, 18),\n                (self.btn_up, \"up\", ink, 14),\n                (self.btn_down, \"down\", ink, 14)):\n            btn.setIcon(icons.icon(kind, color))\n            btn.setIconSize(QSize(size, size))\n        self._sync_record_icon()\n\n    def _sync_record_icon(self):\n        running = bool(getattr(self.recorder, \"running\", False))\n        self.btn_record.setIcon(\n            icons.icon(\"stop\" if running else \"record\", \"#FFFFFF\"))\n        self.btn_record.setIconSize(QSize(15, 15))\n\n    # -- UI construction --------------------------------------------------\n    def _build_ui(self):\n        central = QWidget()\n        central.setObjectName(\"central\")\n        self.setCentralWidget(central)\n        root = QVBoxLayout(central)\n        root.setContentsMargins(0, 0, 0, 0)\n        root.setSpacing(0)\n\n        # Header: thin white band with one orange rule under it; the\n        # language label + combo stay at the right end, as before.\n        header = QFrame()\n        header.setObjectName(\"appHeader\")\n        header.setFrameShape(QFrame.Shape.NoFrame)\n        hlayout = QHBoxLayout(header)\n        hlayout.setContentsMargins(18, 12, 18, 12)\n        hlayout.setSpacing(12)\n        self.lbl_logo = QLabel(\"1\")\n        self.lbl_logo.setObjectName(\"logoMark\")\n        self.lbl_logo.setFixedSize(34, 34)\n        self.lbl_logo.setAlignment(Qt.AlignmentFlag.AlignCenter)\n        hlayout.addWidget(self.lbl_logo)\n        title_box = QVBoxLayout()\n        title_box.setSpacing(1)\n        self.lbl_title = QLabel()\n        self.lbl_title.setObjectName(\"appTitle\")\n        self.lbl_subtitle = QLabel()\n        self.lbl_subtitle.setObjectName(\"appSubtitle\")\n        title_box.addWidget(self.lbl_title)\n        title_box.addWidget(self.lbl_subtitle)\n        hlayout.addLayout(title_box)\n        hlayout.addStretch(1)\n        self.lbl_lang = QLabel()\n        self.lbl_lang.setObjectName(\"langLabel\")\n        hlayout.addWidget(self.lbl_lang)\n        self.combo_lang = QComboBox()\n        for code in LANG_ORDER:\n            self.combo_lang.addItem(LANG_NAMES[code], code)\n        self.combo_lang.setCurrentIndex(LANG_ORDER.index(self.lang))\n        self.combo_lang.currentIndexChanged.connect(self._on_lang_changed)\n        hlayout.addWidget(self.combo_lang)\n        root.addWidget(header)\n\n        body = QWidget()\n        root.addWidget(body, 1)\n        root = QVBoxLayout(body)\n        root.setContentsMargins(16, 12, 16, 12)\n        root.setSpacing(10)\n\n        # Project title row\n        trow = QHBoxLayout()\n        self.lbl_proj_title = QLabel()\n        self.lbl_proj_title.setObjectName(\"sectionTitle\")\n        trow.addWidget(self.lbl_proj_title)\n        self.edit_proj_title = QLineEdit()\n        self.edit_proj_title.textChanged.connect(\n            lambda t: setattr(self.project, \"title\", t))\n        trow.addWidget(self.edit_proj_title)\n        root.addLayout(trow)\n\n        # Toolbar (record / export are the primary orange actions)\n        bar = QHBoxLayout()\n        bar.setSpacing(8)\n        self.btn_new = QPushButton()\n        self.btn_open = QPushButton()\n        self.btn_save = QPushButton()\n        self.btn_zip_export = QPushButton()\n        self.btn_zip_import = QPushButton()\n        self.btn_record = QPushButton()\n        self.btn_record.setProperty(\"role\", \"primary\")\n        self.btn_record.setProperty(\"recording\", \"false\")\n        self.btn_capture = QPushButton()\n        self.btn_export = QPushButton()\n        self.btn_export.setProperty(\"role\", \"primary\")\n        self.btn_settings = QPushButton()\n        for btn in (self.btn_new, self.btn_open, self.btn_save,\n                    self.btn_zip_export, self.btn_zip_import,\n                    self.btn_record, self.btn_capture, self.btn_export,\n                    self.btn_settings):\n            bar.addWidget(btn)\n        bar.addStretch(1)\n        root.addLayout(bar)\n        self.btn_new.clicked.connect(self.new_project)\n        self.btn_open.clicked.connect(self.open_project)\n        self.btn_save.clicked.connect(self.save_project)\n        self.btn_zip_export.clicked.connect(self.export_zip)\n        self.btn_zip_import.clicked.connect(self.import_zip)\n        self.btn_record.clicked.connect(self.toggle_recording)\n        self.btn_capture.clicked.connect(lambda: self.manual_capture(\"main\"))\n        self.btn_export.clicked.connect(self.export_manuals)\n        self.btn_settings.clicked.connect(self.open_settings)\n\n        self.lbl_mode_note = QLabel()\n        self.lbl_mode_note.setObjectName(\"modeNote\")\n        self.lbl_mode_note.setWordWrap(True)\n        root.addWidget(self.lbl_mode_note)\n\n        # Main split: booklet page cards (left) | preview + editor (right)\n        split = QSplitter()\n        split.setChildrenCollapsible(False)\n        left = QWidget()\n        llayout = QVBoxLayout(left)\n        llayout.setContentsMargins(0, 0, 0, 0)\n        llayout.setSpacing(8)\n        self.lbl_steps_hdr = QLabel()\n        self.lbl_steps_hdr.setObjectName(\"sectionTitle\")\n        llayout.addWidget(self.lbl_steps_hdr)\n        self.list_steps = QListWidget()\n        self.list_steps.setMinimumWidth(340)\n        self.list_steps.setVerticalScrollMode(\n            QListWidget.ScrollMode.ScrollPerPixel)\n        self.list_steps.setHorizontalScrollBarPolicy(\n            Qt.ScrollBarPolicy.ScrollBarAlwaysOff)\n        self.list_steps.currentRowChanged.connect(self._on_row_changed)\n        llayout.addWidget(self.list_steps, 10)\n        self.lbl_no_steps = QLabel()\n        self.lbl_no_steps.setObjectName(\"emptyState\")\n        self.lbl_no_steps.setWordWrap(True)\n        llayout.addWidget(self.lbl_no_steps)\n        llayout.addStretch(1)\n        srow = QHBoxLayout()\n        srow.setSpacing(6)\n        self.btn_up = QPushButton()\n        self.btn_down = QPushButton()\n        self.btn_delete = QPushButton()\n        self.btn_duplicate = QPushButton()\n        self.btn_add_image = QPushButton()\n        for btn in (self.btn_up, self.btn_down, self.btn_delete,\n                    self.btn_duplicate, self.btn_add_image):\n            srow.addWidget(btn)\n        llayout.addLayout(srow)\n        self.btn_up.clicked.connect(lambda: self.move_step(-1))\n        self.btn_down.clicked.connect(lambda: self.move_step(1))\n        self.btn_delete.clicked.connect(self.delete_step)\n        self.btn_duplicate.clicked.connect(self.duplicate_step)\n        self.btn_add_image.clicked.connect(self.add_step_from_image)\n        split.addWidget(left)\n\n        right = QWidget()\n        rlayout = QVBoxLayout(right)\n        rlayout.setContentsMargins(0, 0, 0, 0)\n        rlayout.setSpacing(8)\n        self.image_view = ImageView()\n        self.image_view.rect_dragged.connect(self._on_mosaic_dragged)\n        rlayout.addWidget(self.image_view, 1)\n        self.lbl_pick = QLabel()\n        self.lbl_pick.setObjectName(\"mutedNote\")\n        self.lbl_pick.setAlignment(Qt.AlignmentFlag.AlignCenter)\n        rlayout.addWidget(self.lbl_pick)\n\n        self.candidate_bar = QFrame()\n        self.candidate_bar.setObjectName(\"candidateBar\")\n        self.candidate_bar.setFrameShape(QFrame.Shape.NoFrame)\n        crow = QHBoxLayout(self.candidate_bar)\n        crow.setContentsMargins(12, 8, 12, 8)\n        crow.setSpacing(8)\n        self.lbl_candidate = QLabel()\n        self.lbl_candidate.setObjectName(\"candidateText\")\n        self.btn_candidate_apply = QPushButton()\n        self.btn_candidate_dismiss = QPushButton()\n        crow.addWidget(self.lbl_candidate)\n        crow.addWidget(self.btn_candidate_apply)\n        crow.addWidget(self.btn_candidate_dismiss)\n        crow.addStretch(1)\n        self.candidate_bar.setVisible(False)\n        rlayout.addWidget(self.candidate_bar)\n        self.btn_candidate_apply.clicked.connect(self.apply_candidates)\n        self.btn_candidate_dismiss.clicked.connect(self.dismiss_candidates)\n\n        mrow = QHBoxLayout()\n        mrow.setSpacing(8)\n        self.btn_mosaic_mode = QPushButton()\n        self.btn_mosaic_mode.setCheckable(True)\n        self.btn_mosaic_clear = QPushButton()\n        mrow.addWidget(self.btn_mosaic_mode)\n        mrow.addWidget(self.btn_mosaic_clear)\n        mrow.addStretch(1)\n        rlayout.addLayout(mrow)\n        self.btn_mosaic_mode.toggled.connect(\n            lambda on: setattr(self.image_view, \"mosaic_mode\", on))\n        self.btn_mosaic_clear.clicked.connect(self.clear_mosaics)\n\n        self.lbl_text = QLabel()\n        self.lbl_text.setObjectName(\"sectionTitle\")\n        rlayout.addWidget(self.lbl_text)\n        self.edit_text = QPlainTextEdit()\n        self.edit_text.setMaximumHeight(76)\n        rlayout.addWidget(self.edit_text)\n        self.lbl_draft_note = QLabel()\n        self.lbl_draft_note.setWordWrap(True)\n        self.lbl_draft_note.setObjectName(\"draftNote\")\n        rlayout.addWidget(self.lbl_draft_note)\n        self.lbl_memo = QLabel()\n        self.lbl_memo.setObjectName(\"sectionTitle\")\n        rlayout.addWidget(self.lbl_memo)\n        self.edit_memo = QPlainTextEdit()\n        self.edit_memo.setMaximumHeight(40)\n        self.edit_memo.textChanged.connect(self._on_memo_changed)\n        rlayout.addWidget(self.edit_memo)\n        self.lbl_target = QLabel()\n        self.lbl_target.setObjectName(\"mutedNote\")\n        self.lbl_window = QLabel()\n        self.lbl_window.setObjectName(\"mutedNote\")\n        rlayout.addWidget(self.lbl_target)\n        rlayout.addWidget(self.lbl_window)\n        split.addWidget(right)\n        split.setSizes([410, 740])\n        root.addWidget(split, 1)\n\n        self.lbl_keyboard_note = QLabel()\n        self.lbl_keyboard_note.setWordWrap(True)\n        self.lbl_keyboard_note.setObjectName(\"draftNote\")\n        root.addWidget(self.lbl_keyboard_note)\n\n        self.shortcut_capture = QShortcut(QKeySequence(\"F8\"), self)\n        self.shortcut_capture.setContext(\n            Qt.ShortcutContext.ApplicationShortcut)\n        self.shortcut_capture.activated.connect(\n            lambda: self.manual_capture(\"hotkey\"))\n\n    # -- language ---------------------------------------------------------\n    def _on_lang_changed(self, index):\n        code = self.combo_lang.itemData(index)\n        if not code or code == self.lang:\n            return\n        self.lang = code\n        self.settings[\"lang\"] = code\n        save_settings(self.settings)\n        self.retranslate()\n        self._refresh_steps()\n        if self.current_step is not None:\n            self._load_detail(self.current_step)\n\n    def retranslate(self):\n        lang = self.lang\n        direction = (Qt.LayoutDirection.RightToLeft if lang in RTL_LANGS\n                     else Qt.LayoutDirection.LeftToRight)\n        QApplication.instance().setLayoutDirection(direction)\n        self.setLayoutDirection(direction)\n        name = display_name(lang)\n        self.setWindowTitle(name)\n        self.lbl_title.setText(name)\n        self.lbl_subtitle.setText(tr(lang, \"app_subtitle\"))\n        self.lbl_lang.setText(tr(lang, \"lang_label\"))\n        self.lbl_proj_title.setText(tr(lang, \"lbl_project_title\"))\n        self.btn_new.setText(tr(lang, \"btn_new\"))\n        self.btn_open.setText(tr(lang, \"btn_open\"))\n        self.btn_save.setText(tr(lang, \"btn_save\"))\n        self.btn_zip_export.setText(tr(lang, \"btn_zip_export\"))\n        self.btn_zip_import.setText(tr(lang, \"btn_zip_import\"))\n        self.btn_record.setText(tr(lang, \"btn_record_stop\")\n                                if self.recorder.running\n                                else tr(lang, \"btn_record_start\"))\n        self._sync_record_icon()\n        self.btn_capture.setText(tr(lang, \"btn_capture\"))\n        self.btn_export.setText(tr(lang, \"btn_export\"))\n        self.btn_settings.setText(tr(lang, \"btn_settings\"))\n        self.lbl_mode_note.setText(\n            tr(lang, \"lbl_mac_mode\") if self.recorder.mode == \"manual\"\n            else \"\")\n        self.lbl_steps_hdr.setText(tr(lang, \"hdr_steps\"))\n        self.lbl_no_steps.setText(tr(lang, \"lbl_no_steps\"))\n        self.btn_up.setText(tr(lang, \"btn_up\"))\n        self.btn_down.setText(tr(lang, \"btn_down\"))\n        self.btn_delete.setText(tr(lang, \"btn_delete\"))\n        self.btn_duplicate.setText(tr(lang, \"btn_duplicate\"))\n        self.btn_add_image.setText(tr(lang, \"btn_add_image\"))\n        self.lbl_pick.setText(tr(lang, \"lbl_pick_step\"))\n        self.lbl_candidate.setText(tr(lang, \"lbl_mosaic_candidate\"))\n        self.btn_candidate_apply.setText(tr(lang, \"btn_candidate_apply\"))\n        self.btn_candidate_dismiss.setText(\n            tr(lang, \"btn_candidate_dismiss\"))\n        self.btn_mosaic_mode.setText(tr(lang, \"btn_mosaic_mode\"))\n        self.btn_mosaic_clear.setText(tr(lang, \"btn_mosaic_clear\"))\n        self.lbl_text.setText(tr(lang, \"lbl_text\"))\n        self.lbl_draft_note.setText(tr(lang, \"txt_draft_note\"))\n        self.lbl_memo.setText(tr(lang, \"lbl_memo\"))\n        self.lbl_keyboard_note.setText(tr(lang, \"lbl_keyboard_note\"))\n        if self.panel is not None:\n            self.panel.setLayoutDirection(direction)\n            self.panel.retranslate(lang)\n\n    # -- step list ----------------------------------------------------------\n    def _step_label(self, idx, step):\n        text = step.effective_text(self.lang).replace(\"\\n\", \" \")\n        return \"%d. %s\" % (idx + 1, text[:36])\n\n    def _refresh_steps(self):\n        self.list_steps.blockSignals(True)\n        self.list_steps.clear()\n        for idx, step in enumerate(self.project.steps):\n            item = QListWidgetItem(self._step_label(idx, step))\n            item.setSizeHint(QSize(0, 100))\n            card = StepCard()\n            text = step.effective_text(self.lang).replace(\"\\n\", \" \")\n            meta = step.window_title or step.target_name\n            card.set_content(idx + 1, self._thumbnail(step), text, meta)\n            self.list_steps.addItem(item)\n            self.list_steps.setItemWidget(item, card)\n        self.list_steps.blockSignals(False)\n        self.lbl_no_steps.setVisible(not self.project.steps)\n        self.list_steps.setVisible(bool(self.project.steps))\n        self._sync_card_selection()\n\n    def _sync_card_selection(self):\n        current = self.list_steps.currentRow()\n        for row in range(self.list_steps.count()):\n            card = self.list_steps.itemWidget(self.list_steps.item(row))\n            if card is not None:\n                card.set_selected(row == current)\n\n    def _thumbnail(self, step):\n        img = self.project.open_image(step)\n        if img is None:\n            return None\n        img = img.resize((118, max(1, int(img.height * 118 / img.width))))\n        return pil_to_pixmap(img)\n\n    def _on_row_changed(self, row):\n        self._commit_editor()\n        if 0 <= row < len(self.project.steps):\n            self.current_step = self.project.steps[row]\n            self._load_detail(self.current_step)\n        else:\n            self.current_step = None\n            self.lbl_pick.setVisible(True)\n        self._sync_card_selection()\n\n    def _load_detail(self, step):\n        self.current_step = step\n        self.lbl_pick.setVisible(False)\n        text = step.effective_text(self.lang)\n        self._loaded_text = text\n        self.edit_text.blockSignals(True)\n        self.edit_text.setPlainText(text)\n        self.edit_text.blockSignals(False)\n        self.edit_memo.blockSignals(True)\n        self.edit_memo.setPlainText(step.memo)\n        self.edit_memo.blockSignals(False)\n        self.lbl_target.setText(\"%s %s\" % (tr(self.lang, \"lbl_target\"),\n                                           step.target_name))\n        self.lbl_window.setText(\"%s %s\" % (tr(self.lang, \"lbl_window\"),\n                                           step.window_title))\n        self.candidate_bar.setVisible(bool(step.mosaic_candidates))\n        self._refresh_preview()\n\n    def _refresh_preview(self):\n        step = self.current_step\n        if step is None:\n            self.image_view.set_image(None)\n            return\n        img = self.project.open_image(step)\n        if img is None:\n            return\n        if step.mosaics:\n            img = core.apply_mosaics(img, step.mosaics)\n        if step.mosaic_candidates:\n            draw = ImageDraw.Draw(img)\n            w, h = img.size\n            for rect in step.mosaic_candidates:\n                x0, y0, x1, y1 = rect.to_pixels(w, h)\n                for off in range(3):\n                    draw.rectangle([x0 - off, y0 - off, x1 + off, y1 + off],\n                                   outline=(255, 200, 0))\n        img = core.draw_marker(img, step.click)\n        self.image_view.set_image(pil_to_pixmap(img))\n\n    def _commit_editor(self):\n        step = self.current_step\n        if step is None or self._loaded_text is None:\n            return\n        text = self.edit_text.toPlainText()\n        if text != self._loaded_text:\n            step.text_override = text\n            self._loaded_text = text\n            row = self.project.steps.index(step)\n            item = self.list_steps.item(row)\n            if item:\n                item.setText(self._step_label(row, step))\n                card = self.list_steps.itemWidget(item)\n                if card is not None:\n                    card.set_text(text.replace(\"\\n\", \" \"))\n\n    def _on_memo_changed(self):\n        if self.current_step is not None:\n            self.current_step.memo = self.edit_memo.toPlainText()\n\n    # -- step operations ----------------------------------------------------\n    def _selected_row(self):\n        return self.list_steps.currentRow()\n\n    def move_step(self, delta):\n        self._commit_editor()\n        row = self._selected_row()\n        other = row + delta\n        if row < 0 or other < 0 or other >= len(self.project.steps):\n            return\n        steps = self.project.steps\n        steps[row], steps[other] = steps[other], steps[row]\n        self._refresh_steps()\n        self.list_steps.setCurrentRow(other)\n\n    def delete_step(self):\n        row = self._selected_row()\n        if row < 0:\n            return\n        self.current_step = None\n        self._loaded_text = None\n        del self.project.steps[row]\n        self._refresh_steps()\n        if self.project.steps:\n            self.list_steps.setCurrentRow(\n                min(row, len(self.project.steps) - 1))\n\n    def duplicate_step(self):\n        row = self._selected_row()\n        if row < 0:\n            return\n        import copy as _copy\n        src = self.project.steps[row]\n        dup = _copy.deepcopy(src)\n        dup.image_file = self.project._new_image_name()\n        pil = self.project.open_image(src)\n        self.project.steps.insert(row + 1, dup)\n        if pil is not None:\n            dup._pil = pil\n        self._refresh_steps()\n        self.list_steps.setCurrentRow(row + 1)\n\n    def add_step_from_image(self):\n        path, _ = QFileDialog.getOpenFileName(\n            self, tr(self.lang, \"dlg_add_image\"), \"\",\n            tr(self.lang, \"filter_images\"))\n        if not path:\n            return\n        try:\n            with Image.open(path) as im:\n                img = im.convert(\"RGB\")\n        except Exception as exc:\n            self._error(exc)\n            return\n        step = core.Step(kind=core.KIND_MANUAL)\n        self.project.add_step(step, img)\n        self._after_step_added()\n\n    # -- mosaic ---------------------------------------------------------------\n    def _on_mosaic_dragged(self, x, y, w, h):\n        if self.current_step is None:\n            return\n        self.current_step.mosaics.append(core.Rect(x, y, w, h))\n        self._refresh_preview()\n\n    def apply_candidates(self):\n        step = self.current_step\n        if step is None:\n            return\n        step.mosaics.extend(step.mosaic_candidates)\n        step.mosaic_candidates = []\n        self.candidate_bar.setVisible(False)\n        self._refresh_preview()\n\n    def dismiss_candidates(self):\n        step = self.current_step\n        if step is None:\n            return\n        step.mosaic_candidates = []\n        self.candidate_bar.setVisible(False)\n        self._refresh_preview()\n\n    def clear_mosaics(self):\n        if self.current_step is None:\n            return\n        self.current_step.mosaics = []\n        self._refresh_preview()\n\n    # -- recording ------------------------------------------------------------\n    def toggle_recording(self):\n        if self.recorder.running:\n            self.stop_recording()\n        else:\n            self.start_recording()\n\n    def start_recording(self):\n        try:\n            self.recorder.start()\n        except Exception as exc:\n            self._error(exc)\n            return\n        self.btn_record.setText(tr(self.lang, \"btn_record_stop\"))\n        self._sync_record_icon()\n        self.btn_record.setProperty(\"recording\", \"true\")\n        _repolish(self.btn_record)\n        self.panel = RecordPanel(self.lang,\n                                 manual_mode=self.recorder.mode == \"manual\")\n        self.panel.setLayoutDirection(self.layoutDirection())\n        self.panel.pause_toggled.connect(self.recorder.set_paused)\n        self.panel.finish_clicked.connect(self.stop_recording)\n        self.panel.capture_clicked.connect(\n            lambda: self.manual_capture(\"panel\"))\n        self.panel.set_count(len(self.project.steps))\n        self.panel.move(self.x() + self.width() - 420, self.y() + 40)\n        self.panel.show()\n\n    def stop_recording(self):\n        self.recorder.stop()\n        self.btn_record.setText(tr(self.lang, \"btn_record_start\"))\n        self._sync_record_icon()\n        self.btn_record.setProperty(\"recording\", \"false\")\n        _repolish(self.btn_record)\n        if self.panel is not None:\n            self.panel.close()\n            self.panel = None\n\n    def manual_capture(self, source):\n        hidden = []\n        if self.panel is not None and source in (\"panel\", \"hotkey\"):\n            self.panel.hide()\n            hidden.append(self.panel)\n        if source == \"main\":\n            self.hide()\n            hidden.append(self)\n\n        def do_capture():\n            title = \"\"\n            if sys.platform == \"win32\":\n                try:\n                    title = recorder_mod.UiaElementProvider() \\\n                        ._top_window_title(None)\n                except Exception:\n                    title = \"\"\n            self.capturer.capture_now(window_title=title)\n            for widget in hidden:\n                widget.show()\n\n        QTimer.singleShot(450, do_capture)\n\n    def _on_step_captured(self, step, image):\n        self.project.add_step(step, image)\n        self._after_step_added()\n        if self.panel is not None:\n            self.panel.set_count(len(self.project.steps))\n\n    def _after_step_added(self):\n        self._refresh_steps()\n        self.list_steps.setCurrentRow(len(self.project.steps) - 1)\n\n    # -- project file operations ---------------------------------------------\n    def new_project(self):\n        self._commit_editor()\n        self.stop_recording()\n        self.project = core.Project()\n        self.current_step = None\n        self._loaded_text = None\n        self.edit_proj_title.setText(\"\")\n        self._refresh_steps()\n        self.image_view.set_image(None)\n\n    def open_project(self):\n        folder = QFileDialog.getExistingDirectory(\n            self, tr(self.lang, \"dlg_open_project\"))\n        if not folder:\n            return\n        try:\n            proj = core.Project.load(folder)\n        except Exception as exc:\n            self._error(exc)\n            return\n        self._set_project(proj)\n        QMessageBox.information(self, display_name(self.lang),\n                                tr(self.lang, \"msg_loaded\"))\n\n    def _set_project(self, proj):\n        self.stop_recording()\n        self.project = proj\n        self.current_step = None\n        self._loaded_text = None\n        self.edit_proj_title.setText(proj.title)\n        self._refresh_steps()\n        if proj.steps:\n            self.list_steps.setCurrentRow(0)\n\n    def save_project(self):\n        self._commit_editor()\n        folder = self.project.folder\n        if not folder:\n            folder = QFileDialog.getExistingDirectory(\n                self, tr(self.lang, \"dlg_save_project\"))\n            if not folder:\n                return\n        try:\n            self.project.title = self.edit_proj_title.text()\n            self.project.save(folder)\n        except Exception as exc:\n            self._error(exc)\n            return\n        QMessageBox.information(self, display_name(self.lang),\n                                tr(self.lang, \"msg_saved\"))\n\n    def export_zip(self):\n        self._commit_editor()\n        path, _ = QFileDialog.getSaveFileName(\n            self, tr(self.lang, \"dlg_zip_export\"), \"project.zip\",\n            tr(self.lang, \"filter_zip\"))\n        if not path:\n            return\n        try:\n            self.project.title = self.edit_proj_title.text()\n            self.project.export_zip(path)\n        except Exception as exc:\n            self._error(exc)\n            return\n        QMessageBox.information(self, display_name(self.lang),\n                                tr(self.lang, \"msg_saved\"))\n\n    def import_zip(self):\n        path, _ = QFileDialog.getOpenFileName(\n            self, tr(self.lang, \"dlg_zip_import\"), \"\",\n            tr(self.lang, \"filter_zip\"))\n        if not path:\n            return\n        dest = QFileDialog.getExistingDirectory(\n            self, tr(self.lang, \"dlg_open_project\"))\n        if not dest:\n            return\n        target = os.path.join(dest, \"imported_project\")\n        try:\n            proj = core.Project.import_zip(path, target)\n        except Exception as exc:\n            self._error(exc)\n            return\n        self._set_project(proj)\n        QMessageBox.information(self, display_name(self.lang),\n                                tr(self.lang, \"msg_loaded\"))\n\n    # -- settings / export ------------------------------------------------------\n    def open_settings(self):\n        dlg = SettingsDialog(self, self.lang,\n                             self.settings.get(\"deepl_key\", \"\"))\n        dlg.setLayoutDirection(self.layoutDirection())\n        if dlg.exec():\n            self.settings[\"deepl_key\"] = dlg.edit_key.text().strip()\n            save_settings(self.settings)\n\n    def export_manuals(self):\n        self._commit_editor()\n        if not self.project.steps:\n            QMessageBox.warning(self, display_name(self.lang),\n                                tr(self.lang, \"msg_no_steps\"))\n            return\n        key = self.settings.get(\"deepl_key\", \"\")\n        dlg = ExportDialog(self, self.lang, has_deepl_key=bool(key))\n        dlg.setLayoutDirection(self.layoutDirection())\n        if not dlg.exec():\n            return\n        opts = dlg.options()\n        if not opts[\"out_dir\"] or not opts[\"langs\"] or not opts[\"formats\"]:\n            return\n        translator = core.DeepLTranslator(key) if key else None\n        QApplication.setOverrideCursor(Qt.CursorShape.WaitCursor)\n        try:\n            result = exporter.export_manuals(\n                self.project, opts[\"out_dir\"], opts[\"langs\"],\n                opts[\"formats\"], show_marker=opts[\"show_marker\"],\n                translator=translator, use_deepl=opts[\"use_deepl\"])\n        except Exception as exc:\n            QApplication.restoreOverrideCursor()\n            self._error(exc)\n            return\n        QApplication.restoreOverrideCursor()\n        msg = tr(self.lang, \"msg_export_done\", count=len(result.files))\n        if result.translate_failed:\n            msg += \"\\n\" + tr(self.lang, \"msg_export_translate_failed\")\n        QMessageBox.information(self, display_name(self.lang), msg)\n\n    def _error(self, exc):\n        QMessageBox.critical(\n            self, display_name(self.lang),\n            tr(self.lang, \"msg_error\", detail=str(exc)))\n\n    def closeEvent(self, event):\n        self._commit_editor()\n        try:\n            self.recorder.stop()\n        except Exception:\n            pass\n        super().closeEvent(event)\n\n\n# ----------------------------------------------------------------------\n# Entry point (with the Wine-only font workaround used by the family)\n# ----------------------------------------------------------------------\n\ndef _under_wine():\n    \"\"\"True only under Wine (ntdll exports wine_get_version only there).\n    Used solely for Wine-only stability workarounds; real Windows is\n    untouched. Non-Windows platforms return False at once.\"\"\"\n    if sys.platform != \"win32\":\n        return False\n    try:\n        import ctypes\n        return hasattr(ctypes.WinDLL(\"ntdll\"), \"wine_get_version\")\n    except Exception:\n        return False\n\n\ndef main():\n    args = list(sys.argv)\n    if _under_wine():\n        # Wine-only: Qt's native (DirectWrite) font engine can fault in\n        # Wine 9.0 during font fallback. The FreeType engine avoids it.\n        args += [\"-platform\", \"windows:fontengine=freetype\"]\n    app = QApplication(args)\n    try:\n        import os as _os, sys as _sys\n        from PySide6.QtGui import QIcon as _QIcon\n        _ib = getattr(_sys, \"_MEIPASS\", None) or _os.path.dirname(_os.path.abspath(__file__))\n        _ip = _os.path.join(_ib, \"assets\", \"icon.png\")\n        if _os.path.exists(_ip):\n            app.setWindowIcon(_QIcon(_ip))\n    except Exception:\n        pass\n    app.setApplicationName(APP_ID)\n    app.setStyleSheet(theme.stylesheet())\n    if _under_wine():\n        try:\n            from PySide6.QtGui import QFont, QFontDatabase\n            families = set(QFontDatabase.families())\n            if families and \"Yu Gothic UI\" not in families \\\n                    and \"Segoe UI\" not in families:\n                fallback = \"Tahoma\" if \"Tahoma\" in families \\\n                    else sorted(families)[0]\n                app.setFont(QFont(fallback))\n        except Exception:\n            pass\n    win = MainWindow()\n    win.show()\n    return app.exec()\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"p": "appinfo.py", "s": 922, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Application name - THE single place that defines the product name.\n\nFormal name decided by the user on 2026-11-15: StepOnce.\n(The former working title was replaced everywhere user-visible;\n\"ManualMaker\" is already used by an existing iOS manual-creation app,\nso it must not be used as the product name.)\n\n- Japanese UI title: 一回やれば手順書\n- All other languages' UI title: StepOnce\n- EXE name: StepOnce.exe / ZIP names: StepOnce-Windows.zip,\n  StepOnce-Source.zip (all derived from APP_FILE_STEM / FILE_BASE).\n\"\"\"\n\nAPP_ID = \"StepOnce\"\nAPP_FILE_STEM = \"StepOnce\"\nFILE_BASE = \"StepOnce\"\nAPP_NAME_EN = \"StepOnce\"\nAPP_NAME_JA = \"一回やれば手順書\"\n\nAPP_DISPLAY = {\n    \"ja\": APP_NAME_JA,\n}\n\nAPP_VERSION = \"1.0.0\"\n\n\ndef display_name(lang):\n    \"\"\"Japanese UI shows the Japanese name; every other language\n    shows the English name.\"\"\"\n    return APP_DISPLAY.get(lang, APP_NAME_EN)\n"}, {"p": "assets/icon.icns", "s": 95545, "b": 1}, {"p": "assets/icon.ico", "s": 19173, "b": 1}, {"p": "assets/icon.png", "s": 36498, "b": 1}, {"p": "core.py", "s": 14125, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Core logic for StepOnce: project model, project\nsave/load (folder + ZIP), mosaic/marker image rendering, draft-sentence\ngeneration, and the optional DeepL translation client.\n\nNo Qt imports here (except none at all) so everything is unit-testable.\nCoordinates for clicks and mosaic rectangles are stored as relative\nfractions (0..1) of the image size, so they survive resolution changes.\n\"\"\"\n\nimport json\nimport os\nimport shutil\nimport urllib.request\nimport urllib.parse\nimport zipfile\nfrom dataclasses import dataclass, field, asdict\n\nfrom PIL import Image, ImageDraw\n\nfrom i18n import tr, DEEPL_TARGET\n\nPROJECT_FILE = \"project.json\"\nIMAGES_DIR = \"images\"\n\n# Draft kinds (how the step's default sentence is produced)\nKIND_BUTTON = \"button\"      # clicked a button-like control\nKIND_INPUT = \"input\"        # clicked a text input field\nKIND_OPEN = \"open\"          # clicked a menu/tab-like item\nKIND_NAMED = \"named\"        # clicked a named control (generic click)\nKIND_GENERIC = \"generic\"    # clicked somewhere with no name\nKIND_MANUAL = \"manual\"      # manual screen capture (Mac / manual button)\n\n_KIND_TEMPLATE = {\n    KIND_BUTTON: \"tpl_click_button\",\n    KIND_INPUT: \"tpl_input\",\n    KIND_OPEN: \"tpl_open\",\n    KIND_NAMED: \"tpl_click_named\",\n    KIND_GENERIC: \"tpl_click_generic\",\n    KIND_MANUAL: \"tpl_manual\",\n}\n\n\n@dataclass\nclass Rect:\n    \"\"\"A rectangle in relative coordinates (0..1 of image width/height).\"\"\"\n    x: float\n    y: float\n    w: float\n    h: float\n\n    def to_pixels(self, img_w, img_h):\n        x0 = max(0, int(round(self.x * img_w)))\n        y0 = max(0, int(round(self.y * img_h)))\n        x1 = min(img_w, int(round((self.x + self.w) * img_w)))\n        y1 = min(img_h, int(round((self.y + self.h) * img_h)))\n        return x0, y0, max(x0 + 1, x1), max(y0 + 1, y1)\n\n    @staticmethod\n    def from_pixels(x0, y0, x1, y1, img_w, img_h):\n        if img_w <= 0 or img_h <= 0:\n            return Rect(0.0, 0.0, 0.0, 0.0)\n        x = min(x0, x1) / img_w\n        y = min(y0, y1) / img_h\n        w = abs(x1 - x0) / img_w\n        h = abs(y1 - y0) / img_h\n        return Rect(x, y, w, h)\n\n\n@dataclass\nclass Step:\n    image_file: str = \"\"                 # file name inside images/\n    kind: str = KIND_MANUAL              # draft kind\n    target_name: str = \"\"                # clicked control name (original)\n    window_title: str = \"\"               # foreground window title\n    click: tuple = None                  # (rel_x, rel_y) or None\n    text_override: str = None            # user-written text (None = draft)\n    memo: str = \"\"\n    mosaics: list = field(default_factory=list)            # list[Rect]\n    mosaic_candidates: list = field(default_factory=list)  # list[Rect]\n\n    def draft_text(self, lang):\n        key = _KIND_TEMPLATE.get(self.kind, \"tpl_click_generic\")\n        if self.kind in (KIND_BUTTON, KIND_INPUT, KIND_OPEN, KIND_NAMED):\n            return tr(lang, key, name=self.target_name)\n        return tr(lang, key)\n\n    def effective_text(self, lang):\n        \"\"\"The sentence shown for this step in language `lang`, before any\n        optional machine translation of free text.\"\"\"\n        if self.text_override is not None:\n            return self.text_override\n        return self.draft_text(lang)\n\n    def to_dict(self):\n        d = asdict(self)\n        d[\"click\"] = list(self.click) if self.click else None\n        return d\n\n    @staticmethod\n    def from_dict(d):\n        step = Step(\n            image_file=d.get(\"image_file\", \"\"),\n            kind=d.get(\"kind\", KIND_MANUAL),\n            target_name=d.get(\"target_name\", \"\"),\n            window_title=d.get(\"window_title\", \"\"),\n            text_override=d.get(\"text_override\"),\n            memo=d.get(\"memo\", \"\"),\n            mosaics=[Rect(**r) for r in d.get(\"mosaics\", [])],\n            mosaic_candidates=[Rect(**r)\n                               for r in d.get(\"mosaic_candidates\", [])],\n        )\n        click = d.get(\"click\")\n        if click:\n            step.click = (float(click[0]), float(click[1]))\n        return step\n\n\nclass Project:\n    def __init__(self, title=\"\"):\n        self.title = title\n        self.steps = []\n        self.folder = None        # where the project is stored (or None)\n        self._img_counter = 0\n\n    # -- image handling -------------------------------------------------\n    def _new_image_name(self):\n        while True:\n            self._img_counter += 1\n            name = \"step_%04d.png\" % self._img_counter\n            if all(s.image_file != name for s in self.steps):\n                return name\n\n    def add_step(self, step, pil_image=None):\n        \"\"\"Attach an image (PIL) to the step and append it. Images are\n        kept in memory as files only after save(); until then the PIL\n        image is stashed on the step object (not serialized).\"\"\"\n        if not step.image_file:\n            step.image_file = self._new_image_name()\n        if pil_image is not None:\n            step._pil = pil_image\n        self.steps.append(step)\n        return step\n\n    # -- serialization --------------------------------------------------\n    def to_dict(self):\n        return {\n            \"version\": 1,\n            \"title\": self.title,\n            \"steps\": [s.to_dict() for s in self.steps],\n        }\n\n    def save(self, folder):\n        os.makedirs(folder, exist_ok=True)\n        img_dir = os.path.join(folder, IMAGES_DIR)\n        os.makedirs(img_dir, exist_ok=True)\n        for step in self.steps:\n            dest = os.path.join(img_dir, step.image_file)\n            pil = getattr(step, \"_pil\", None)\n            if pil is not None:\n                pil.save(dest)\n                step._pil = None\n            elif not os.path.exists(dest) and self.folder:\n                src = os.path.join(self.folder, IMAGES_DIR, step.image_file)\n                if os.path.exists(src):\n                    shutil.copyfile(src, dest)\n        with open(os.path.join(folder, PROJECT_FILE), \"w\",\n                  encoding=\"utf-8\") as fh:\n            json.dump(self.to_dict(), fh, ensure_ascii=False, indent=1)\n        self.folder = folder\n\n    @staticmethod\n    def load(folder):\n        with open(os.path.join(folder, PROJECT_FILE), \"r\",\n                  encoding=\"utf-8\") as fh:\n            data = json.load(fh)\n        proj = Project(title=data.get(\"title\", \"\"))\n        proj.steps = [Step.from_dict(d) for d in data.get(\"steps\", [])]\n        proj.folder = folder\n        nums = []\n        for s in proj.steps:\n            base = os.path.splitext(s.image_file)[0]\n            if base.startswith(\"step_\"):\n                try:\n                    nums.append(int(base[5:]))\n                except ValueError:\n                    pass\n        proj._img_counter = max(nums) if nums else len(proj.steps)\n        return proj\n\n    def image_path(self, step):\n        if self.folder:\n            path = os.path.join(self.folder, IMAGES_DIR, step.image_file)\n            if os.path.exists(path):\n                return path\n        return None\n\n    def open_image(self, step):\n        \"\"\"Return a PIL Image for the step (from the in-memory stash or\n        from the project folder).\"\"\"\n        pil = getattr(step, \"_pil\", None)\n        if pil is not None:\n            return pil.copy()\n        path = self.image_path(step)\n        if path:\n            with Image.open(path) as im:\n                return im.convert(\"RGB\")\n        return None\n\n    # -- ZIP ------------------------------------------------------------\n    def export_zip(self, zip_path):\n        tmp = None\n        if self.folder is None:\n            import tempfile\n            tmp = tempfile.mkdtemp(prefix=\"tejun_\")\n            self.save(tmp)\n            folder = tmp\n        else:\n            # make sure pending in-memory images are flushed\n            self.save(self.folder)\n            folder = self.folder\n        try:\n            with zipfile.ZipFile(zip_path, \"w\", zipfile.ZIP_DEFLATED) as zf:\n                for root, _dirs, files in os.walk(folder):\n                    for name in files:\n                        full = os.path.join(root, name)\n                        arc = os.path.relpath(full, folder)\n                        zf.write(full, arc)\n        finally:\n            if tmp:\n                shutil.rmtree(tmp, ignore_errors=True)\n                self.folder = None\n\n    @staticmethod\n    def import_zip(zip_path, dest_folder):\n        os.makedirs(dest_folder, exist_ok=True)\n        with zipfile.ZipFile(zip_path, \"r\") as zf:\n            for info in zf.infolist():\n                name = info.filename.replace(\"\\\\\", \"/\")\n                # guard against path traversal\n                parts = [p for p in name.split(\"/\") if p not in (\"\", \".\", \"..\")]\n                if not parts:\n                    continue\n                target = os.path.join(dest_folder, *parts)\n                os.makedirs(os.path.dirname(target), exist_ok=True)\n                with zf.open(info) as src, open(target, \"wb\") as dst:\n                    shutil.copyfileobj(src, dst)\n        return Project.load(dest_folder)\n\n\n# ----------------------------------------------------------------------\n# Image rendering: marker + mosaics\n# ----------------------------------------------------------------------\n\ndef apply_mosaics(image, rects, block=12):\n    \"\"\"Return a copy of the PIL image with the given relative rects\n    pixelated. The original image is not modified.\"\"\"\n    out = image.copy()\n    w, h = out.size\n    for rect in rects:\n        x0, y0, x1, y1 = rect.to_pixels(w, h)\n        if x1 - x0 < 2 or y1 - y0 < 2:\n            continue\n        region = out.crop((x0, y0, x1, y1))\n        small_w = max(1, (x1 - x0) // block)\n        small_h = max(1, (y1 - y0) // block)\n        region = region.resize((small_w, small_h), Image.BILINEAR)\n        region = region.resize((x1 - x0, y1 - y0), Image.NEAREST)\n        out.paste(region, (x0, y0))\n    return out\n\n\ndef draw_marker(image, click, radius=None):\n    \"\"\"Return a copy with a red circle + dot at the relative click point.\"\"\"\n    if not click:\n        return image\n    out = image.copy()\n    w, h = out.size\n    cx, cy = int(click[0] * w), int(click[1] * h)\n    r = radius or max(14, min(w, h) // 28)\n    draw = ImageDraw.Draw(out)\n    for off in range(3):\n        draw.ellipse([cx - r - off, cy - r - off, cx + r + off, cy + r + off],\n                     outline=(255, 40, 40))\n    draw.ellipse([cx - 4, cy - 4, cx + 4, cy + 4], fill=(255, 40, 40))\n    return out\n\n\ndef render_step_image(project, step, show_marker=True):\n    \"\"\"The image as it will appear in an exported manual: mosaics applied,\n    then (optionally) the click marker drawn on top.\"\"\"\n    img = project.open_image(step)\n    if img is None:\n        return None\n    if step.mosaics:\n        img = apply_mosaics(img, step.mosaics)\n    if show_marker:\n        img = draw_marker(img, step.click)\n    return img\n\n\n# ----------------------------------------------------------------------\n# Password-field heuristic for mosaic candidates\n# ----------------------------------------------------------------------\n\nPASSWORD_WORDS = (\"パスワード\", \"password\", \"passwd\", \"暗証\", \"pinコード\")\n\n\ndef looks_like_password(name, is_password):\n    if is_password:\n        return True\n    if not name:\n        return False\n    low = name.lower()\n    return any(w in low for w in PASSWORD_WORDS)\n\n\n# ----------------------------------------------------------------------\n# Optional DeepL translation of free text\n# ----------------------------------------------------------------------\n\nclass DeepLTranslator:\n    \"\"\"Translates free text with the user's own DeepL API key. Only used\n    when a key is configured; any failure raises DeepLError and the caller\n    falls back to the original text.\"\"\"\n\n    class DeepLError(Exception):\n        pass\n\n    def __init__(self, api_key, timeout=20):\n        self.api_key = (api_key or \"\").strip()\n        self.timeout = timeout\n\n    @property\n    def configured(self):\n        return bool(self.api_key)\n\n    def _endpoint(self):\n        host = \"api-free.deepl.com\" if self.api_key.endswith(\":fx\") \\\n            else \"api.deepl.com\"\n        return \"https://%s/v2/translate\" % host\n\n    def translate(self, text, target_lang):\n        \"\"\"target_lang is our language code. Languages DeepL does not\n        support (Arabic) raise DeepLError so the caller keeps the\n        original text.\"\"\"\n        code = DEEPL_TARGET.get(target_lang)\n        if not code or not text or not text.strip():\n            raise self.DeepLError(\"unsupported or empty\")\n        data = urllib.parse.urlencode(\n            {\"text\": text, \"target_lang\": code}).encode(\"utf-8\")\n        req = urllib.request.Request(\n            self._endpoint(), data=data,\n            headers={\"Authorization\": \"DeepL-Auth-Key \" + self.api_key,\n                     \"Content-Type\": \"application/x-www-form-urlencoded\"})\n        try:\n            with urllib.request.urlopen(req, timeout=self.timeout) as resp:\n                payload = json.loads(resp.read().decode(\"utf-8\"))\n            return payload[\"translations\"][0][\"text\"]\n        except Exception as exc:  # network, HTTP, malformed reply\n            raise self.DeepLError(str(exc))\n\n\ndef resolve_step_texts(project, lang, translator=None, use_deepl=False):\n    \"\"\"Return (texts, any_free_text, translate_failed) for export in\n    `lang`. Draft sentences are rendered from the translated templates.\n    Free text stays in the original language unless a DeepL translator is\n    configured and enabled; failures keep the original and set the flag.\n    Arabic has no DeepL target and always keeps the original.\"\"\"\n    texts = []\n    any_free = False\n    failed = False\n    for step in project.steps:\n        if step.text_override is None:\n            texts.append(step.draft_text(lang))\n            continue\n        any_free = True\n        text = step.text_override\n        if use_deepl and translator is not None and translator.configured:\n            try:\n                text = translator.translate(text, lang)\n            except DeepLTranslator.DeepLError:\n                failed = True\n        texts.append(text)\n    return texts, any_free, failed\n"}, {"p": "exporter.py", "s": 14256, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Manual export for StepOnce.\n\nFor each selected language a complete manual is produced:\n- PDF via Qt's QPdfWriter + QTextDocument (no extra dependency).\n- Word .docx written directly as OOXML with the standard library only\n  (a .docx is a ZIP of XML), so the app needs no python-docx at runtime.\n\nFixed phrases (cover, TOC heading, step headings, notes) come from the\ntranslated strings in i18n.py; control names are inserted in their\noriginal language; user-written free text stays in its original language\nunless the optional DeepL translation is enabled and succeeds.\n\"\"\"\n\nimport datetime\nimport html\nimport os\nimport re\nimport tempfile\nimport zipfile\nfrom xml.sax.saxutils import escape as xml_escape\n\nimport core\nfrom appinfo import display_name\nfrom i18n import tr\n\n\ndef _file_stem(title):\n    stem = re.sub(r'[<>:\"/\\\\|?*\\x00-\\x1f]', \"_\", (title or \"\").strip())\n    stem = stem.strip(\". \")\n    return stem or \"manual\"\n\n\ndef build_manual_model(project, lang, translator=None, use_deepl=False):\n    \"\"\"All text content of one language's manual, ready for rendering.\"\"\"\n    texts, any_free, failed = core.resolve_step_texts(\n        project, lang, translator=translator, use_deepl=use_deepl)\n    title = project.title.strip() or tr(lang, \"m_untitled\")\n    steps = []\n    for idx, step in enumerate(project.steps):\n        steps.append({\n            \"n\": idx + 1,\n            \"heading\": tr(lang, \"m_step\", n=idx + 1),\n            \"text\": texts[idx],\n            \"memo\": step.memo,\n            \"window_title\": step.window_title,\n            \"has_click\": step.click is not None,\n            \"step\": step,\n        })\n    return {\n        \"lang\": lang,\n        \"title\": title,\n        \"manual_label\": tr(lang, \"m_manual\"),\n        \"created_with\": tr(lang, \"m_created_with\",\n                           app=display_name(lang)),\n        \"date_line\": tr(lang, \"m_date\",\n                        date=datetime.date.today().isoformat()),\n        \"toc_title\": tr(lang, \"m_toc\"),\n        \"memo_label\": tr(lang, \"m_memo\"),\n        \"window_label\": tr(lang, \"m_window\"),\n        \"note_freetext\": tr(lang, \"m_note_freetext\") if any_free else \"\",\n        \"note_marker\": tr(lang, \"m_note_marker\"),\n        \"steps\": steps,\n        \"translate_failed\": failed,\n    }\n\n\n# ----------------------------------------------------------------------\n# PDF (Q
