t)\n# ----------------------------------------------------------------------\n\ndef _manual_html(model, image_names, image_widths=None):\n    image_widths = image_widths or {}\n    lang = model[\"lang\"]\n    rtl = lang == \"ar\"\n    direction = \"rtl\" if rtl else \"ltr\"\n    align = \"right\" if rtl else \"left\"\n    parts = [\"<html><head><meta charset='utf-8'><\/head>\"\n             \"<body dir='%s' style='font-family: sans-serif;'>\" % direction]\n    parts.append(\"<h1 align='center'>%s<\/h1>\"\n                 % html.escape(model[\"title\"]))\n    parts.append(\"<h2 align='center'>%s<\/h2>\"\n                 % html.escape(model[\"manual_label\"]))\n    parts.append(\"<p align='center'>%s<br/>%s<\/p>\"\n                 % (html.escape(model[\"created_with\"]),\n                    html.escape(model[\"date_line\"])))\n    if model[\"note_freetext\"]:\n        parts.append(\"<p align='%s'><i>%s<\/i><\/p>\"\n                     % (align, html.escape(model[\"note_freetext\"])))\n    if any(s[\"has_click\"] for s in model[\"steps\"]):\n        parts.append(\"<p align='%s'><i>%s<\/i><\/p>\"\n                     % (align, html.escape(model[\"note_marker\"])))\n    parts.append(\"<h3 align='%s'>%s<\/h3>\"\n                 % (align, html.escape(model[\"toc_title\"])))\n    for s in model[\"steps\"]:\n        toc_line = \"%s: %s\" % (s[\"heading\"], s[\"text\"])\n        parts.append(\"<p align='%s'>%s<\/p>\"\n                     % (align, html.escape(toc_line[:90])))\n    parts.append(\"<br/>\")\n    for s in model[\"steps\"]:\n        parts.append(\"<h3 align='%s'>%s<\/h3>\"\n                     % (align, html.escape(s[\"heading\"])))\n        img_name = image_names.get(s[\"n\"])\n        if img_name:\n            width = image_widths.get(s[\"n\"])\n            if width:\n                parts.append(\"<p align='center'><img src='%s' width='%d'/>\"\n                             \"<\/p>\" % (img_name, width))\n            else:\n                parts.append(\"<p align='center'><img src='%s'/><\/p>\"\n                             % img_name)\n        parts.append(\"<p align='%s'>%s<\/p>\" % (align, html.escape(s[\"text\"])))\n        if s[\"window_title\"]:\n            parts.append(\"<p align='%s'><i>%s: %s<\/i><\/p>\"\n                         % (align, html.escape(model[\"window_label\"]),\n                            html.escape(s[\"window_title\"])))\n        if s[\"memo\"]:\n            parts.append(\"<p align='%s'><i>%s: %s<\/i><\/p>\"\n                         % (align, html.escape(model[\"memo_label\"]),\n                            html.escape(s[\"memo\"])))\n    parts.append(\"<\/body><\/html>\")\n    return \"\".join(parts)\n\n\ndef write_pdf(project, model, out_path, show_marker=True, tmp_dir=None):\n    from PySide6.QtCore import QSizeF, QUrl\n    from PySide6.QtGui import (QGuiApplication, QPageLayout, QPageSize,\n                               QPdfWriter, QTextDocument)\n    from PySide6.QtCore import QMarginsF\n\n    tmp_dir = tmp_dir or tempfile.mkdtemp(prefix=\"tejun_pdf_\")\n    writer = QPdfWriter(out_path)\n    writer.setPageSize(QPageSize(QPageSize.PageSizeId.A4))\n    writer.setResolution(120)\n    writer.setPageMargins(QMarginsF(15, 15, 15, 15),\n                          QPageLayout.Unit.Millimeter)\n    page_rect = writer.pageLayout().paintRectPixels(120)\n    content_w = page_rect.width()\n\n    image_names = {}\n    image_widths = {}\n    doc = QTextDocument()\n    for s in model[\"steps\"]:\n        img = core.render_step_image(project, s[\"step\"],\n                                     show_marker=show_marker)\n        if img is None:\n            continue\n        name = \"step_%d.png\" % s[\"n\"]\n        path = os.path.join(tmp_dir, name)\n        if img.width > content_w:\n            disp_w = content_w\n            img = img.resize(\n                (disp_w, int(img.height * disp_w / img.width)))\n        else:\n            disp_w = img.width\n        img.save(path)\n        image_names[s[\"n\"]] = name\n        image_widths[s[\"n\"]] = disp_w\n    html_text = _manual_html(model, image_names, image_widths)\n    doc.setHtml(html_text)\n    for name in image_names.values():\n        from PySide6.QtGui import QImage\n        doc.addResource(QTextDocument.ImageResource, QUrl(name),\n                        QImage(os.path.join(tmp_dir, name)))\n    doc.setPageSize(QSizeF(page_rect.width(), page_rect.height()))\n    doc.print_(writer)\n    return out_path\n\n\n# ----------------------------------------------------------------------\n# Word .docx (raw OOXML, standard library only)\n# ----------------------------------------------------------------------\n\n_W_NS = \"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"\n_R_NS = \"http://schemas.openxmlformats.org/officeDocument/2006/relationships\"\n_WP_NS = \"http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing\"\n_A_NS = \"http://schemas.openxmlformats.org/drawingml/2006/main\"\n_PIC_NS = \"http://schemas.openxmlformats.org/drawingml/2006/picture\"\n\n_MAX_IMG_W_EMU = 5_750_000  # ~14.6 cm, fits A4 with 2 cm margins\n\n\ndef _p(text, size=22, bold=False, italic=False, align=None,\n       space_after=120):\n    jc = \"<w:jc w:val=\\\"%s\\\"/>\" % align if align else \"\"\n    rpr = \"<w:rPr>%s%s<w:sz w:val=\\\"%d\\\"/><w:szCs w:val=\\\"%d\\\"/><\/w:rPr>\" % (\n        \"<w:b/>\" if bold else \"\", \"<w:i/>\" if italic else \"\", size, size)\n    return (\"<w:p><w:pPr>%s<w:spacing w:after=\\\"%d\\\"/><\/w:pPr>\"\n            \"<w:r>%s<w:t xml:space=\\\"preserve\\\">%s<\/w:t><\/w:r><\/w:p>\"\n            % (jc, space_after, rpr, xml_escape(text)))\n\n\ndef _p_image(rel_id, cx, cy):\n    return (\n        \"<w:p><w:pPr><w:jc w:val=\\\"center\\\"/><\/w:pPr><w:r><w:drawing>\"\n        \"<wp:inline distT=\\\"0\\\" distB=\\\"0\\\" distL=\\\"0\\\" distR=\\\"0\\\">\"\n        \"<wp:extent cx=\\\"%d\\\" cy=\\\"%d\\\"/>\"\n        \"<wp:docPr id=\\\"%s\\\" name=\\\"image\\\"/>\"\n        \"<a:graphic><a:graphicData uri=\\\"%s\\\">\"\n        \"<pic:pic><pic:nvPicPr><pic:cNvPr id=\\\"%s\\\" name=\\\"image\\\"/>\"\n        \"<pic:cNvPicPr/><\/pic:nvPicPr>\"\n        \"<pic:blipFill><a:blip r:embed=\\\"%s\\\"/><a:stretch><a:fillRect/>\"\n        \"<\/a:stretch><\/pic:blipFill>\"\n        \"<pic:spPr><a:xfrm><a:off x=\\\"0\\\" y=\\\"0\\\"/>\"\n        \"<a:ext cx=\\\"%d\\\" cy=\\\"%d\\\"/><\/a:xfrm>\"\n        \"<a:prstGeom prst=\\\"rect\\\"><a:avLst/><\/a:prstGeom><\/pic:spPr>\"\n        \"<\/pic:pic><\/a:graphicData><\/a:graphic><\/wp:inline>\"\n        \"<\/w:drawing><\/w:r><\/w:p>\"\n        % (cx, cy, rel_id[3:], _PIC_NS, rel_id[3:], rel_id, cx, cy))\n\n\ndef write_docx(project, model, out_path, show_marker=True, tmp_dir=None):\n    from PIL import Image\n    tmp_dir = tmp_dir or tempfile.mkdtemp(prefix=\"tejun_docx_\")\n    rtl = model[\"lang\"] == \"ar\"\n    align = \"right\" if rtl else \"left\"\n    body = []\n    body.append(_p(model[\"title\"], size=44, bold=True, align=\"center\"))\n    body.append(_p(model[\"manual_label\"], size=30, bold=True,\n                   align=\"center\"))\n    body.append(_p(model[\"created_with\"], size=20, align=\"center\"))\n    body.append(_p(model[\"date_line\"], size=20, align=\"center\"))\n    if model[\"note_freetext\"]:\n        body.append(_p(model[\"note_freetext\"], size=18, italic=True,\n                       align=align))\n    if any(s[\"has_click\"] for s in model[\"steps\"]):\n        body.append(_p(model[\"note_marker\"], size=18, italic=True,\n                       align=align))\n    body.append(_p(model[\"toc_title\"], size=28, bold=True, align=align))\n    for s in model[\"steps\"]:\n        body.append(_p(\"%s: %s\" % (s[\"heading\"], s[\"text\"][:90]),\n                       size=20, align=align))\n\n    rels = []\n    images = []  # (arcname, path)\n    for s in model[\"steps\"]:\n        body.append(_p(s[\"heading\"], size=28, bold=True, align=align,\n                       space_after=80))\n        img = core.render_step_image(project, s[\"step\"],\n                                     show_marker=show_marker)\n        if img is not None:\n            name = \"image%d.png\" % s[\"n\"]\n            path = os.path.join(tmp_dir, name)\n            img.save(path)\n            rel_id = \"rId%d\" % (len(rels) + 1)\n            rels.append((rel_id, \"word/media/\" + name))\n            images.append((\"word/media/\" + name, path))\n            w, h = img.size\n            cx = _MAX_IMG_W_EMU\n            cy = int(cx * h / w) if w else cx\n            body.append(_p_image(rel_id, cx, cy))\n        body.append(_p(s[\"text\"], size=22, align=align))\n        if s[\"window_title\"]:\n            body.append(_p(\"%s: %s\" % (model[\"window_label\"],\n                                       s[\"window_title\"]),\n                           size=18, italic=True, align=align))\n        if s[\"memo\"]:\n            body.append(_p(\"%s: %s\" % (model[\"memo_label\"], s[\"memo\"]),\n                           size=18, italic=True, align=align))\n\n    sect = (\"<w:sectPr><w:pgSz w:w=\\\"11906\\\" w:h=\\\"16838\\\"/>\"\n            \"<w:pgMar w:top=\\\"1134\\\" w:right=\\\"1134\\\" w:bottom=\\\"1134\\\" \"\n            \"w:left=\\\"1134\\\"/><\/w:sectPr>\")\n    document_xml = (\n        \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\" standalone=\\\"yes\\\"?>\"\n        \"<w:document xmlns:w=\\\"%s\\\" xmlns:r=\\\"%s\\\" xmlns:wp=\\\"%s\\\" \"\n        \"xmlns:a=\\\"%s\\\" xmlns:pic=\\\"%s\\\"><w:body>%s%s<\/w:body><\/w:document>\"\n        % (_W_NS, _R_NS, _WP_NS, _A_NS, _PIC_NS, \"\".join(body), sect))\n    rels_xml = (\n        \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\" standalone=\\\"yes\\\"?>\"\n        \"<Relationships xmlns=\\\"http://schemas.openxmlformats.org/package/\"\n        \"2006/relationships\\\">%s<\/Relationships>\"\n        % \"\".join(\n            \"<Relationship Id=\\\"%s\\\" Type=\\\"%s/image\\\" Target=\\\"%s\\\"/>\"\n            % (rid, _R_NS, target.replace(\"word/\", \"\"))\n            for rid, target in rels))\n    content_types = (\n        \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\" standalone=\\\"yes\\\"?>\"\n        \"<Types xmlns=\\\"http://schemas.openxmlformats.org/package/2006/\"\n        \"content-types\\\">\"\n        \"<Default Extension=\\\"rels\\\" ContentType=\\\"application/vnd.openxml\"\n        \"formats-package.relationships+xml\\\"/>\"\n        \"<Default Extension=\\\"xml\\\" ContentType=\\\"application/xml\\\"/>\"\n        \"<Default Extension=\\\"png\\\" ContentType=\\\"image/png\\\"/>\"\n        \"<Override PartName=\\\"/word/document.xml\\\" ContentType=\\\"\"\n        \"application/vnd.openxmlformats-officedocument.wordprocessingml.\"\n        \"document.main+xml\\\"/><\/Types>\")\n    root_rels = (\n        \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\" standalone=\\\"yes\\\"?>\"\n        \"<Relationships xmlns=\\\"http://schemas.openxmlformats.org/package/\"\n        \"2006/relationships\\\">\"\n        \"<Relationship Id=\\\"rId1\\\" Type=\\\"%s/officeDocument\\\" \"\n        \"Target=\\\"word/document.xml\\\"/><\/Relationships>\" % _R_NS)\n\n    with zipfile.ZipFile(out_path, \"w\", zipfile.ZIP_DEFLATED) as zf:\n        zf.writestr(\"[Content_Types].xml\", content_types)\n        zf.writestr(\"_rels/.rels\", root_rels)\n        zf.writestr(\"word/document.xml\", document_xml)\n        zf.writestr(\"word/_rels/document.xml.rels\", rels_xml)\n        for arcname, path in images:\n            zf.write(path, arcname)\n    return out_path\n\n\n# ----------------------------------------------------------------------\n# Batch export\n# ----------------------------------------------------------------------\n\nclass ExportResult:\n    def __init__(self):\n        self.files = []\n        self.translate_failed = False\n\n\ndef export_manuals(project, out_dir, langs, formats, show_marker=True,\n                   translator=None, use_deepl=False):\n    os.makedirs(out_dir, exist_ok=True)\n    result = ExportResult()\n    stem = _file_stem(project.title)\n    for lang in langs:\n        model = build_manual_model(project, lang, translator=translator,\n                                   use_deepl=use_deepl)\n        if model[\"translate_failed\"]:\n            result.translate_failed = True\n        if \"pdf\" in formats:\n            path = os.path.join(out_dir, \"%s_%s.pdf\" % (stem, lang))\n            write_pdf(project, model, path, show_marker=show_marker)\n            result.files.append(path)\n        if \"docx\" in formats:\n            path = os.path.join(out_dir, \"%s_%s.docx\" % (stem, lang))\n            write_docx(project, model, path, show_marker=show_marker)\n            result.files.append(path)\n    return result\n"}, {"p": "i18n.py", "s": 63629, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"i18n for StepOnce - 13 languages.\n\nTwo groups of strings live here:\n- UI strings for the app itself.\n- Manual strings (keys starting with \"m_\" and \"tpl_\"): the fixed phrases\n  and draft-sentence templates used to generate manuals in 13 languages.\n  Draft templates receive the clicked control's name as {name}; the name\n  itself is always inserted in its original language, as recorded.\nThe app title itself comes from appinfo.py.\n\"\"\"\n\nLANG_ORDER = [\"ja\", \"en\", \"es\", \"zh_CN\", \"fr\", \"de\", \"pt\", \"ru\", \"it\",\n              \"tr\", \"ar\", \"id\", \"ko\"]\nLANG_NAMES = {\n    \"ja\": \"日本語\", \"en\": \"English\", \"es\": \"Español\", \"zh_CN\": \"简体中文\",\n    \"fr\": \"Français\", \"de\": \"Deutsch\", \"pt\": \"Português\", \"ru\": \"Русский\",\n    \"it\": \"Italiano\", \"tr\": \"Türkçe\", \"ar\": \"العربية\",\n    \"id\": \"Bahasa Indonesia\", \"ko\": \"한국어\",\n}\nRTL_LANGS = {\"ar\"}\n\nJA = {\n    \"app_subtitle\": \"一度ふだん通りに操作すれば、13言語の手順書の下書きができるアプリ\",\n    \"lang_label\": \"表示言語:\",\n    \"lbl_project_title\": \"手順書のタイトル:\",\n    \"btn_new\": \"新規\",\n    \"btn_open\": \"プロジ bmp)\",\n    \"msg_saved\": \"프로젝트를 저장했습니다\",\n    \"msg_loaded\": \"프로젝트를 불러왔습니다\",\n    \"msg_export_done\": \"{count}개 파일을 내보냈습니다\",\n    \"msg_export_translate_failed\": \"일부 문장은 번역할 수 없어 원문 그대로 내보냈습니다\",\n    \"msg_no_steps\": \"단계가 없습니다. 먼저 기록하거나 화면을 추가하세요.\",\n    \"msg_error\": \"오류가 발생했습니다: {detail}\",\n    \"m_manual\": \"절차서\",\n    \"m_created_with\": \"이 절차서는 {app}(으)로 만들었습니다\",\n    \"m_date\": \"작성일: {date}\",\n    \"m_toc\": \"목차\",\n    \"m_step\": \"{n}단계\",\n    \"m_memo\": \"메모\",\n    \"m_window\": \"창\",\n    \"m_note_freetext\": \"참고: 사용자가 직접 쓴 문장은 원문 그대로 실려 있습니다(자동 번역되지 않았습니다).\",\n    \"m_note_marker\": \"빨간 원은 클릭한 위치를 나타냅니다.\",\n    \"m_untitled\": \"제목 없는 절차서\",\n    \"tpl_click_button\": \"“{name}” 버튼을 클릭합니다\",\n    \"tpl_input\": \"“{name}”에 문자를 입력합니다\",\n    \"tpl_open\": \"“{name}”을(를) 엽니다\",\n    \"tpl_click_named\": \"“{name}”을(를) 클릭합니다\",\n    \"tpl_click_generic\": \"화면을 클릭합니다\",\n    \"tpl_manual\": \"이 화면에서 필요한 작업을 수행합니다\",\n}\n\nSTRINGS = {\n    \"ja\": JA, \"en\": EN, \"es\": ES, \"zh_CN\": ZH_CN, \"fr\": FR, \"de\": DE,\n    \"pt\": PT, \"ru\": RU, \"it\": IT, \"tr\": TR, \"ar\": AR, \"id\": ID, \"ko\": KO,\n}\n\n# DeepL target language codes (our lang code -> DeepL code).\nDEEPL_TARGET = {\n    \"ja\": \"JA\", \"en\": \"EN-US\", \"es\": \"ES\", \"zh_CN\": \"ZH\", \"fr\": \"FR\",\n    \"de\": \"DE\", \"pt\": \"PT-BR\", \"ru\": \"RU\", \"it\": \"IT\", \"tr\": \"TR\",\n    \"id\": \"ID\", \"ko\": \"KO\",\n}\n# Arabic has no DeepL target; free text stays in the original language.\n\n\ndef tr(lang, key, **params):\n    table = STRINGS.get(lang) or JA\n    text = table.get(key)\n    if text is None:\n        text = JA.get(key, key)\n    if params:\n        try:\n            return text.format(**params)\n        except (KeyError, IndexError):\n            return text\n    return text\n"}, {"p": "icons.py", "s": 3558, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Hand-drawn button icons (QPainter), no emoji glyphs anywhere.\n\nThe previous design prefixed button labels with emoji characters\n(camera / book / brush / record dot ...).  Under Wine - and on any\nsystem whose font fallback lands on a colour emoji font - those\nglyphs could render as huge colour emoji and break the layout.\nEvery icon the UI needs is therefore drawn here with QPainter into a\nQPixmap, so rendering never depends on font glyph availability.\n\"\"\"\n\nfrom PySide6.QtCore import QPointF, QRectF, Qt\nfrom PySide6.QtGui import QColor, QIcon, QPainter, QPainterPath, QPen, QPixmap\n\n_SIZE = 48  # pixmap is drawn at 48x48 and shown at ~18-20 logical px\n\n_cache = {}\n\n\ndef _pen(color, width):\n    pen = QPen(QColor(color))\n    pen.setWidthF(width)\n    pen.setCapStyle(Qt.PenCapStyle.RoundCap)\n    pen.setJoinStyle(Qt.PenJoinStyle.RoundJoin)\n    return pen\n\n\ndef _draw_camera(p, color):\n    p.setPen(_pen(color, 3.0))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    p.drawRoundedRect(QRectF(6, 15, 36, 22), 4, 4)\n    p.drawLine(QPointF(19, 15), QPointF(21, 9))\n    p.drawLine(QPointF(29, 15), QPointF(27, 9))\n    p.drawLine(QPointF(21, 9), QPointF(27, 9))\n    p.drawEllipse(QPointF(24, 26), 6.5, 6.5)\n    p.setBrush(QColor(color))\n    p.drawEllipse(QPointF(24, 26), 2.4, 2.4)\n    p.drawEllipse(QPointF(37.5, 20), 1.8, 1.8)\n\n\ndef _draw_book(p, color):\n    p.setPen(_pen(color, 3.0))\n    p.setBrush(Qt.BrushStyle.NoBrush)\n    left = QPainterPath()\n    left.moveTo(24, 12)\n    left.cubicTo(18, 8, 12, 8, 7, 10)\n    left.lineTo(7, 36)\n    left.cubicTo(12, 34, 18, 34, 24, 38)\n    left.closeSubpath()\n    right = QPainterPath()\n    right.moveTo(24, 12)\n    right.cubicTo(30, 8, 36, 8, 41, 10)\n    right.lineTo(41, 36)\n    right.cubicTo(36, 34, 30, 34, 24, 38)\n    right.closeSubpath()\n    p.drawPath(left)\n    p.drawPath(right)\n    p.drawLine(QPointF(24, 12), QPointF(24, 38))\n\n\ndef _draw_brush(p, color):\n    p.setPen(_pen(color, 4.0))\n    p.drawLine(QPointF(33, 7), QPointF(20, 26))\n    p.setPen(_pen(color, 6.5))\n    p.drawLine(QPointF(18, 28), QPointF(14, 34))\n    p.setPen(Qt.PenStyle.NoPen)\n    p.setBrush(QColor(color))\n    tip = QPainterPath()\n    tip.moveTo(17, 32)\n    tip.cubicTo(9, 35, 7, 41, 9, 45)\n    tip.cubicTo(15, 45, 19, 39, 17, 32)\n    tip.closeSubpath()\n    p.drawPath(tip)\n\n\ndef _draw_record(p, color):\n    p.setPen(Qt.PenStyle.NoPen)\n    p.setBrush(QColor(color))\n    p.drawEllipse(QPointF(24, 24), 9.5, 9.5)\n\n\ndef _draw_stop(p, color):\n    p.setPen(Qt.PenStyle.NoPen)\n    p.setBrush(QColor(color))\n    p.drawRoundedRect(QRectF(14, 14, 20, 20), 3, 3)\n\n\ndef _draw_up(p, color):\n    p.setPen(Qt.PenStyle.NoPen)\n    p.setBrush(QColor(color))\n    p.drawPolygon([QPointF(24, 13), QPointF(37, 35), QPointF(11, 35)])\n\n\ndef _draw_down(p, color):\n    p.setPen(Qt.PenStyle.NoPen)\n    p.setBrush(QColor(color))\n    p.drawPolygon([QPointF(24, 35), QPointF(37, 13), QPointF(11, 13)])\n\n\n_DRAWERS = {\n    \"camera\": _draw_camera,\n    \"book\": _draw_book,\n    \"brush\": _draw_brush,\n    \"record\": _draw_record,\n    \"stop\": _draw_stop,\n    \"up\": _draw_up,\n    \"down\": _draw_down,\n}\n\n\ndef icon(kind, color):\n    \"\"\"Return a cached QIcon drawn with QPainter (never a font glyph).\"\"\"\n    key = (kind, color)\n    if key not in _cache:\n        pixmap = QPixmap(_SIZE, _SIZE)\n        pixmap.fill(Qt.GlobalColor.transparent)\n        painter = QPainter(pixmap)\n        painter.setRenderHint(QPainter.RenderHint.Antialiasing)\n        _DRAWERS[kind](painter, color)\n        painter.end()\n        _cache[key] = QIcon(pixmap)\n    return _cache[key]\n"}, {"p": "MakeApp-Mac.command", "s": 3587, "l": "bash", "c": "#!/bin/bash\n# StepOnce - build a standalone macOS app (StepOnce.app)\n#\n# How to use (this is the standard way to get the Mac app):\n#   1. Download the StepOnce-Source.zip and extract it.\n#   2. Double-click this file:  MakeApp-Mac.command\n#      (First time only: macOS may block it because it is unsigned.\n#       Right-click the file -> \"Open\" -> \"Open\" to run it once.)\n#   3. When the build finishes, the app appears in the \"dist\" folder:\n#         dist/StepOnce.app\n#   4. From then on, just double-click StepOnce.app to use it.\n#      (The .app is also unsigned, so the first launch of the app\n#       itself needs the same right-click -> \"Open\" once.)\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== StepOnce - build the macOS app ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Building the app needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + build tools -----------------------------------\nif [ ! -x \".venv-build/bin/python\" ]; then\n  echo \"Preparing the build environment (first run only)...\"\n  $PY -m venv .venv-build || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv-build/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv-build/bin/python -m pip install PySide6 Pillow pyinstaller || { echo \"Failed to install the build tools. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nHOST_ARCH=\"$(uname -m)\"\necho \"This Mac's chip: $HOST_ARCH\"\necho \"Building StepOnce.app (this can take a few minutes)...\"\n\n# Try a universal2 build first (one app that runs on both Apple\n# Silicon and Intel Macs). The python.org Python and PySide6 are\n# universal2, so this normally succeeds. If this Mac's Python is\n# single-architecture, the universal build fails and we fall back to\n# a native build for this Mac's chip automatically.\nBUILT_ARCH=\"\"\nif .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name StepOnce --icon assets/icon.icns --target-arch universal2 app.py; then\n  BUILT_ARCH=\"universal2 (Apple Silicon + Intel)\"\nelse\n  echo \"\"\n  echo \"The universal2 build did not work on this Mac, so the app\"\n  echo \"is being built for this Mac's chip only ($HOST_ARCH).\"\n  echo \"\"\n  rm -rf dist build StepOnce.spec\n  if .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name StepOnce --icon assets/icon.icns app.py; then\n    BUILT_ARCH=\"native ($HOST_ARCH only)\"\n  else\n    echo \"The build failed. See the messages above.\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"Done! Your app is here:\"\necho \"  $(pwd)/dist/StepOnce.app\"\necho \"Architecture of the built app: $BUILT_ARCH\"\necho \"Supported systems: macOS 11 (Big Sur) or later.\"\necho \"\"\necho \"Double-click StepOnce.app to use it.\"\necho \"First launch only: if macOS blocks it, right-click the app\"\necho \"and choose \\\"Open\\\" once (the app is unsigned).\"\necho \"\"\nread -r -p \"Press Enter to close this window.\"\n"}, {"p": "README-SOURCE.txt", "s": 1352, "l": "plaintext", "c": "StepOnce - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of StepOnce, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-StepOnce.bat (or: python app.py)\n- Mac: Start-StepOnce.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\nNotes:\nDeepL翻訳を使う場合は、ご自身のDeepL APIキーを設定画面で入力してください（キー自体はソースに含まれていません）。Windows版はクリックを自動記録し、Mac版は手動キャプチャ方式です。\nTo use DeepL translation, enter your own DeepL API key in the settings (no key is included in the source). The Windows version records clicks automatically; the Mac version uses manual capture.\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 7299, "l": "plaintext", "c": "一回やれば手順書 / StepOnce  v1.0.0\n============================================================\n\n※名前について：正式名は「StepOnce」（日本語名：一回やれば手順書）\nです（2026-11-15決定）。なお「ManualMaker」という名は既存のiOS\nアプリ（同種のマニュアル作成アプリ）が使っているため使いません。\n\nこれは何をするアプリ？\n------------------------------------------------------------\n引き継ぎや新人教育のたびに、画面写真を撮って、切り取って、\n説明文を書く手順書づくりには何時間もかかります。このアプリは、\n「記録開始」を押してふだん通りに操作するだけで、クリックごとに\n画面写真を撮り、押したボタンの名前から説明文の下書きを自動で\n付けます。人がステップ一覧で文章を直して確定すると、その内容で\n13言語版の手順書（PDF・Word）を出力します。\n\n半自動の原則：アプリがやるのは下書きと候補の提示までです。\n内容の確定と出力は、必ず人が行います。\n\n大事なプライバシー仕様\n------------------------------------------------------------\n・キーボードで打った文字は記録しません。記録するのは「入力欄を\n　クリックした」という事実と、その欄の名前だけです。\n・パスワード欄らしい部分は、モザイクの「候補」として示します。\n　自動でモザイクはかかりません。候補を見て、人が「適用」か\n　「却下」を選んでください。\n・記録はこのアプリの中だけに保存されます。どこかへ送信される\n　ことはありません（下記の任意の翻訳機能を使った場合を除く）。\n\n使い方\n------------------------------------------------------------\n1) Windowsの場合：StepOnce.exe を起動します（ソース版は\n　Start-StepOnce.bat）。\n   Macの場合：先に「Macでの使い方」を見てください。\n2) 手順書のタイトルを入力します。\n3) 「● 記録開始」を押します。小さな記録パネルが出ます。\n   - Windows：そのまま対象のアプリをふだん通りに操作してください。\n     クリックのたびに自動でステップが追加されます。\n   - Mac：手動キャプチャ方式です。操作の節目ごとに、記録パネルの\n     「今の画面を追加」ボタン（または F8 キー）で画面を追加します。\n4) 記録パネルの「終了」か、本体の「■ 記録を止める」で記録を終えます。\n5) ステップ一覧で内容を整えます：\n   - 説明文の下書きを直す（直した文章は自由文になります）\n   - メモを付ける、並べ替える、削除・複製する\n   - モザイク候補を適用/却下する、画像をドラッグしてモザイクを\n     追加する（「モザイク追加モード」をオンにして画像上をドラッグ）\n   - 画像ファイルからステップを追加することもできます\n6) 「プロジェクトを保存」で保存します（フォルダ形式）。\n   ZIPで書き出す/読み込むこともできます。\n7) 「手順書を書き出す」で、言語（13言語から選択）と形式\n   （PDF / Word）を選んで書き出します。言語ごとに1ファイルずつ\n   出力されます。\n\n13言語化の仕組み（正直な説明）\n------------------------------------------------------------\n・下書きの定型文（『○○ボタンをクリックします』など）と手順書の\n　体裁文（表紙・目次・「ステップN」・注記）は、13言語すべてに\n　翻訳済みの文面をアプリ内に持っています。\n・ボタン名などの対象名は、記録した原文のまま差し込まれます。\n・人が自分で書いた文章（説明文の書き直しとメモ）は翻訳されません。\n　各言語版にも原文のまま入り、手順書にはその旨の注記が付きます。\n・任意機能：設定で自分の DeepL API キーを入れると、書き出しの\n　ときに自由文の機械翻訳を使うか選べます。キーが無い場合は\n　完全にオフラインで動きます。翻訳に失敗した文章は原文のまま\n　出力され、結果画面にその旨が表示されます。アラビア語は\n　DeepL の対象外のため、常に原文のまま出力されます。\n\nMacでの使い方\n------------------------------------------------------------\nMac版はソース版からアプリを組み立てる方式です：\n1) StepOnce-Source.zip を展開します。\n2) MakeApp-Mac.command をダブルクリックします\n　（初回は右クリック→「開く」が必要な場合があります）。\n3) dist フォルダに StepOnce.app ができます。以後はそれを\n　ダブルクリックして使います（初回起動も右クリック→「開く」）。\n・対応：macOS 11 以降。チップは universal2（Apple Silicon＋Intel\n　両対応）をまず試し、作れない場合はそのMac専用のアプリになります。\n・Macでは自動クリック記録は行いません。自動記録には macOS の\n　アクセシビリティ許可と専用の実装が必要で、実機検証ができない\n　ため、手動キャプチャ方式を正式な方式としています。\n・画面の撮影には「画面収録」の許可が必要な場合があります。\n\n制限と正直な注意点\n------------------------------------------------------------\n・実Windowsでの自動記録の動作、および実Macでの動作は未検証です\n　（開発環境でのテストと Wine 上の起動確認までを実施しています）。\n・管理者権限で動いているウィンドウでは、要素の名前が取れない\n　場合があります。その場合は汎用の下書き文になります。\n・ゲーム画面、動画、リモートデスクトップの中の画面など、UI情報が\n　無い画面では名前が取れません（画面写真と汎用文だけになります）。\n・このアプリ自身の画面のクリックは記録されません（記録パネルの\n　ボタンをステップにしないため）。\n・記録されるのはマウスの左クリックだけです。右クリックや\n　キーボード操作、ドラッグはステップになりません。\n\n言語の切り替え\n------------------------------------------------------------\n画面上部のヘッダー右端にある言語コンボボックスで、13言語を\n再起動なしで即時に切り替えられます。選んだ言語は保存され、\n次回起動時も維持されます。アラビア語を選ぶと画面全体が\n右から左のレイアウトになります。記録パネルも同じ言語になります。\n\n動作環境\n------------------------------------------------------------\n・Windows 10 / 11（64ビット）：EXE版（Python不要）\n・macOS 11 以降：ソース版から .app を生成\n・ソース版の実行には Python 3 が必要です（PySide6 と Pillow を\n　初回起動時に自動でインストールします）\n"}, {"p": "recorder.py", "s": 16248, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Screen recording for StepOnce.\n\nDesign rules:\n- Typed keyboard content is NEVER recorded. Only the fact that a control\n  was clicked, plus the control's name/type, reaches a step.\n- The OS-specific parts are isolated in this module. The step-building\n  pipeline (screenshot -> element info -> Step) is shared, and tests can\n  inject a FakeRecorder / fake element provider, so the whole draft\n  generation path is testable on any OS.\n- Windows: automatic recording. A low-level mouse hook (ctypes) reports\n  clicks; UI Automation (ctypes COM) identifies the clicked element.\n  Clicks inside this app's own processes are ignored (so the recording\n  panel's own buttons do not become steps).\n- macOS: manual capture only. Automatic click tracking would need\n  Accessibility permission and a dedicated implementation that cannot be\n  verified without a Mac, so the app adds steps when the user presses\n  the capture button / hotkey instead.\n\"\"\"\n\nimport os\nimport queue\nimport sys\nimport threading\nimport time\nfrom dataclasses import dataclass\n\nfrom PIL import ImageGrab\n\nimport core\nfrom core import Step, Rect\n\n# UIA control type ids -> draft kinds\n_CT_BUTTON = 50000\n_CT_CHECKBOX = 50002\n_CT_COMBOBOX = 50003\n_CT_EDIT = 50004\n_CT_MENUITEM = 50011\n_CT_RADIOBUTTON = 50013\n_CT_TABITEM = 50019\n_CT_TREEITEM = 50024\n_CT_DOCUMENT = 50030\n_CT_SPLITBUTTON = 50031\n_CT_APPBAR = 50032\n\n\ndef kind_for_control_type(control_type):\n    if control_type in (_CT_BUTTON, _CT_SPLITBUTTON, _CT_APPBAR):\n        return core.KIND_BUTTON\n    if control_type in (_CT_EDIT, _CT_DOCUMENT):\n        return core.KIND_INPUT\n    if control_type in (_CT_COMBOBOX, _CT_MENUITEM, _CT_TABITEM,\n                        _CT_TREEITEM):\n        return core.KIND_OPEN\n    return core.KIND_NAMED\n\n\n@dataclass\nclass ElementInfo:\n    name: str = \"\"\n    control_type: int = 0\n    is_password: bool = False\n    rect: tuple = None          # (left, top, width, height) in screen px\n    window_title: str = \"\"\n    process_id: int = 0\n\n\ndef build_step(image, element, click_xy, origin=(0, 0)):\n    \"\"\"Build a Step from a captured screenshot and (optional) element\n    info. `click_xy` and `origin` are absolute screen pixels; the stored\n    click/mosaic coordinates are relative fractions.\"\"\"\n    step = Step()\n    w, h = image.size\n    if click_xy is not None:\n        rel_x = (click_xy[0] - origin[0]) / w if w else 0.0\n        rel_y = (click_xy[1] - origin[1]) / h if h else 0.0\n        step.click = (min(1.0, max(0.0, rel_x)), min(1.0, max(0.0, rel_y)))\n    if element is None:\n        step.kind = core.KIND_MANUAL if click_xy is None \\\n            else core.KIND_GENERIC\n        return step\n    step.target_name = element.name or \"\"\n    step.window_title = element.window_title or \"\"\n    if step.target_name:\n        step.kind = kind_for_control_type(element.control_type)\n    else:\n        step.kind = core.KIND_GENERIC\n    if element.rect and core.looks_like_password(element.name,\n                                                 element.is_password):\n        left, top, ew, eh = element.rect\n        step.mosaic_candidates.append(Rect.from_pixels(\n            left - origin[0], top - origin[1],\n            left - origin[0] + ew, top - origin[1] + eh, w, h))\n    return step\n\n\ndef grab_screen():\n    \"\"\"Return (PIL image of the whole virtual screen, (origin_x,\n    origin_y)).\"\"\"\n    origin = (0, 0)\n    if sys.platform == \"win32\":\n        try:\n            import ctypes\n            user32 = ctypes.windll.user32\n            origin = (user32.GetSystemMetrics(76),   # SM_XVIRTUALSCREEN\n                      user32.GetSystemMetrics(77))   # SM_YVIRTUALSCREEN\n        except Exception:\n            origin = (0, 0)\n    try:\n        img = ImageGrab.grab(all_screens=True)\n    except TypeError:\n        img = ImageGrab.grab()\n    return img.convert(\"RGB\"), origin\n\n\n# ----------------------------------------------------------------------\n# Recorders\n# ----------------------------------------------------------------------\n\nclass BaseRecorder:\n    mode = \"manual\"  # or \"auto\"\n\n    def __init__(self, on_step):\n        self.on_step = on_step    # callable(step, pil_image)\n        self.running = False\n        self.paused = False\n\n    def start(self):\n        self.running = True\n        self.paused = False\n\n    def stop(self):\n        self.running = False\n        self.paused = False\n\n    def set_paused(self, paused):\n        self.paused = bool(paused)\n\n\nclass FakeRecorder(BaseRecorder):\n    \"\"\"Test double: feeds synthetic captures through the same pipeline\n    as the real recorders.\"\"\"\n\n    mode = \"auto\"\n\n    def feed(self, image, element=None, click_xy=None, origin=(0, 0)):\n        if not self.running or self.paused:\n            return None\n        step = build_step(image, element, click_xy, origin)\n        self.on_step(step, image)\n        return step\n\n\nclass ManualCapturer:\n    \"\"\"One-shot screen capture used by the capture button / hotkey on\n    every platform (the only capture method on macOS).\"\"\"\n\n    def __init__(self, on_step):\n        self.on_step = on_step\n\n    def capture_now(self, window_title=\"\"):\n        img, origin = grab_screen()\n        element = ElementInfo(name=\"\", window_title=window_title)\n        step = build_step(img, element, None, origin)\n        step.kind = core.KIND_MANUAL\n        self.on_step(step, img)\n        return step\n\n\n# ----------------------------------------------------------------------\n# Windows UI Automation via ctypes COM\n# ----------------------------------------------------------------------\n\n_UIA_NAME = 30005\n_UIA_CONTROL_TYPE = 30003\n_UIA_IS_PASSWORD = 30019\n_UIA_BOUNDING_RECT = 30001\n_UIA_PROCESS_ID = 30002\n\n\ndef _guid(text):\n    import ctypes\n\n    class GUID(ctypes.Structure):\n        _fields_ = [(\"Data1\", ctypes.c_ulong), (\"Data2\", ctypes.c_ushort),\n                    (\"Data3\", ctypes.c_ushort), (\"Data4\", ctypes.c_ubyte * 8)]\n    import uuid\n    u = uuid.UUID(text)\n    g = GUID()\n    g.Data1 = u.time_low\n    g.Data2 = u.time_mid\n    g.Data3 = u.time_hi_version\n    for i, b in enumerate(u.bytes[8:]):\n        g.Data4[i] = b\n    return g\n\n\ndef _make_variant():\n    import ctypes\n\n    class VARIANT(ctypes.Structure):\n        class _U(ctypes.Union):\n            _fields_ = [(\"lVal\", ctypes.c_long),\n                        (\"dblVal\", ctypes.c_double),\n                        (\"boolVal\", ctypes.c_short),\n                        (\"bstrVal\", ctypes.c_void_p),\n                        (\"parray\", ctypes.c_void_p)]\n        _anonymous_ = (\"u\",)\n        _fields_ = [(\"vt\", ctypes.c_ushort),\n                    (\"wReserved1\", ctypes.c_ushort),\n                    (\"wReserved2\", ctypes.c_ushort),\n                    (\"wReserved3\", ctypes.c_ushort),\n                    (\"u\", _U)]\n    return VARIANT\n\n\ndef _com_call(ptr, index, restype, *argtypes_and_args):\n    \"\"\"Call an interface method by vtable index.\"\"\"\n    import ctypes\n    vtbl = ctypes.cast(ptr, ctypes.POINTER(ctypes.c_void_p))[0]\n    func_ptr = ctypes.cast(vtbl, ctypes.POINTER(ctypes.c_void_p))[index]\n    argtypes = [ctypes.c_void_p] + [a[0] for a in argtypes_and_args]\n    args = [ptr] + [a[1] for a in argtypes_and_args]\n    func = ctypes.WINFUNCTYPE(restype, *argtypes)(func_ptr)\n    return func(*args)\n\n\nclass UiaElementProvider:\n    \"\"\"ElementFromPoint using IUIAutomation through ctypes. COM is\n    initialized per calling thread.\"\"\"\n\n    def __init__(self):\n        self._automation = None\n\n    def _ensure(self):\n        import ctypes\n        if self._automation is not None:\n            return True\n        ole32 = ctypes.windll.ole32\n        ole32.CoInitializeEx(None, 0x2)  # COINIT_APARTMENTTHREADED\n        clsid = _guid(\"FF48DBA4-60EF-4201-AA87-54103EEF594E\")\n        iid = _guid(\"30CBE57D-D9D0-452A-AB13-7AC5AC4825EE\")\n        ptr = ctypes.c_void_p()\n        hr = ole32.CoCreateInstance(ctypes.byref(clsid), None, 0x17,\n                                    ctypes.byref(iid), ctypes.byref(ptr))\n        if hr != 0 or not ptr:\n            return False\n        self._automation = ptr\n        return True\n\n    def element_from_point(self, x, y):\n        import ctypes\n        if not self._ensure():\n            return None\n        # IUIAutomation::ElementFromPoint is vtable index 5.\n        pt = ctypes.c_long(x), ctypes.c_long(y)\n        class POINT(ctypes.Structure):\n            _fields_ = [(\"x\", ctypes.c_long), (\"y\", ctypes.c_long)]\n        elem = ctypes.c_void_p()\n        hr = _com_call(self._automation, 5, ctypes.c_long,\n                       (POINT, POINT(x, y)), (ctypes.c_void_p,\n                                              ctypes.byref(elem)))\n        if hr != 0 or not elem:\n            return None\n        try:\n            return self._read_element(elem)\n        finally:\n            _com_call(elem, 2, ctypes.c_ulong)  # Release\n\n    def _prop(self, elem, prop_id):\n        import ctypes\n        VARIANT = _make_variant()\n        var = VARIANT()\n        # IUIAutomationElement::GetCurrentPropertyValue is index 10.\n        hr = _com_call(elem, 10, ctypes.c_long,\n                       (ctypes.c_int, prop_id),\n                       (ctypes.POINTER(VARIANT), ctypes.byref(var)))\n        if hr != 0:\n            return None\n        return var\n\n    def _read_element(self, elem):\n        import ctypes\n        info = ElementInfo()\n        var = self._prop(elem, _UIA_NAME)\n        if var is not None and var.vt == 8 and var.bstrVal:  # VT_BSTR\n            info.name = ctypes.wstring_at(var.bstrVal)\n        var = self._prop(elem, _UIA_CONTROL_TYPE)\n        if var is not None and var.vt == 3:  # VT_I4\n            info.control_type = int(var.lVal)\n        var = self._prop(elem, _UIA_PROCESS_ID)\n        if var is not None and var.vt == 3:\n            info.process_id = int(var.lVal)\n        var = self._prop(elem, _UIA_IS_PASSWORD)\n        if var is not None and var.vt == 11:  # VT_BOOL\n            info.is_password = bool(var.boolVal)\n        var = self._prop(elem, _UIA_BOUNDING_RECT)\n        if var is not None and var.vt == 0x2005 and var.parray:  # VT_ARRAY|R8\n            info.rect = self._read_rect_array(var.parray)\n        info.window_title = self._top_window_title(elem)\n        return info\n\n    @staticmethod\n    def _read_rect_array(parray):\n        import ctypes\n\n        class SAFEARRAY(ctypes.Structure):\n            _fields_ = [(\"cDims\", ctypes.c_ushort),\n                        (\"fFeatures\", ctypes.c_ushort),\n                        (\"cbElements\", ctypes.c_ulong),\n                        (\"cLocks\", ctypes.c_ulong),\n                        (\"pvData\", ctypes.c_void_p),\n                        (\"rgsabound\", ctypes.c_ulong * 4)]\n        sa = ctypes.cast(parray, ctypes.POINTER(SAFEARRAY)).contents\n        if not sa.pvData:\n            return None\n        vals = (ctypes.c_double * 4).from_address(sa.pvData)\n        return (int(vals[0]), int(vals[1]), int(vals[2]), int(vals[3]))\n\n    def _top_window_title(self, elem):\n        \"\"\"Best effort: foreground window title at capture time.\"\"\"\n        try:\n            import ctypes\n            user32 = ctypes.windll.user32\n            hwnd = user32.GetForegroundWindow()\n            if not hwnd:\n                return \"\"\n            buf = ctypes.create_unicode_buffer(512)\n            user32.GetWindowTextW(hwnd, buf, 512)\n            return buf.value\n        except Exception:\n            return \"\"\n\n\nclass WindowsAutoRecorder(BaseRecorder):\n    \"\"\"Automatic recording on Windows: low-level mouse hook thread feeds\n    a queue; a capture thread takes the screenshot and queries UIA.\"\"\"\n\n    mode = \"auto\"\n\n    def __init__(self, on_step, element_provider=None, grabber=None):\n        super().__init__(on_step)\n        self._queue = queue.Queue()\n        self._hook_thread = None\n        self._capture_thread = None\n        self._stop_event = threading.Event()\n        self._provider = element_provider or (\n            UiaElementProvider() if sys.platform == \"win32\" else None)\n        self._grabber = grabber or grab_screen\n        self._own_pid = os.getpid()\n        self._last_click = (None, 0.0)\n\n    # -- lifecycle ------------------------------------------------------\n    def start(self):\n        if sys.platform != \"win32\":\n            raise RuntimeError(\"WindowsAutoRecorder requires Windows\")\n        super().start()\n        self._stop_event.clear()\n        self._capture_thread = threading.Thread(\n            target=self._capture_loop, daemon=True)\n        self._capture_thread.start()\n        self._hook_thread = threading.Thread(\n            target=self._hook_loop, daemon=True)\n        self._hook_thread.start()\n\n    def stop(self):\n        super().stop()\n        self._stop_event.set()\n        if self._hook_thread:\n            try:\n                import ctypes\n                tid = self._hook_thread.native_id\n                if tid:\n                    ctypes.windll.user32.PostThreadMessageW(\n                        tid, 0x0012, 0, 0)  # WM_QUIT\n            except Exception:\n                pass\n\n    # -- hook thread ----------------------------------------------------\n    def _hook_loop(self):\n        import ctypes\n        from ctypes import wintypes\n\n        user32 = ctypes.windll.user32\n        kernel32 = ctypes.windll.kernel32\n        WH_MOUSE_LL = 14\n        WM_LBUTTONDOWN = 0x0201\n\n        class POINT(ctypes.Structure):\n            _fields_ = [(\"x\", ctypes.c_long), (\"y\", ctypes.c_long)]\n\n        class MSLLHOOKSTRUCT(ctypes.Structure):\n            _fields_ = [(\"pt\", POINT), (\"mouseData\", wintypes.DWORD),\n                        (\"flags\", wintypes.DWORD), (\"time\", wintypes.DWORD),\n                        (\"dwExtraInfo\", ctypes.c_void_p)]\n\n        HOOKPROC = ctypes.WINFUNCTYPE(\n            ctypes.c_long, ctypes.c_int, wintypes.WPARAM, wintypes.LPARAM)\n\n        queue_ref = self._queue\n\n        def proc(ncode, wparam, lparam):\n            if ncode >= 0 and wparam == WM_LBUTTONDOWN:\n                ms = ctypes.cast(lparam, ctypes.POINTER(MSLLHOOKSTRUCT))\n                queue_ref.put((ms.contents.pt.x, ms.contents.pt.y))\n            return user32.CallNextHookEx(None, ncode, wparam, lparam)\n\n        callback = HOOKPROC(proc)\n        hook = user32.SetWindowsHookExW(\n            WH_MOUSE_LL, callback, kernel32.GetModuleHandleW(None), 0)\n        if not hook:\n            return\n        msg = wintypes.MSG()\n        try:\n            while not self._stop_event.is_set():\n                ret = user32.GetMessageW(ctypes.byref(msg), None, 0, 0)\n                if ret <= 0:\n                    break\n                user32.TranslateMessage(ctypes.byref(msg))\n                user32.DispatchMessageW(ctypes.byref(msg))\n        finally:\n            user32.UnhookWindowsHookEx(hook)\n\n    # -- capture thread ---------------------------------------------------\n    def _capture_loop(self):\n        while not self._stop_event.is_set():\n            try:\n                x, y = self._queue.get(timeout=0.2)\n            except queue.Empty:\n                continue\n            if self.paused or not self.running:\n                continue\n            # collapse double events for the same point in quick succession\n            now = time.time()\n            if self._last_click[0] == (x, y) and now - self._last_click[1] < 0.35:\n                continue\n            self._last_click = ((x, y), now)\n            self.process_click(x, y)\n\n    def process_click(self, x, y):\n        \"\"\"Screenshot + element lookup + step build for one click.\n        Factored out so tests can drive it with injected fakes.\"\"\"\n        element = None\n        if self._provider is not None:\n            try:\n                element = self._provider.element_from_point(x, y)\n            except Exception:\n                element = None\n        if element is not None and element.process_id == self._own_pid:\n            return None     # our own UI (recording panel etc.)\n        image, origin = self._grabber()\n        step = build_step(image, element, (x, y), origin)\n        self.on_step(step, image)\n        return step\n\n\ndef create_recorder(on_step):\n    \"\"\"Platform factory: automatic recording on Windows, manual capture\n    elsewhere (macOS).\"\"\"\n    if sys.platform == \"win32\":\n        return WindowsAutoRecorder(on_step)\n    recorder = BaseRecorder(on_step)\n    recorder.mode = \"manual\"\n    return recorder\n"}, {"p": "requirements.txt", "s": 15, "l": "plaintext", "c": "PySide6\nPillow\n"}, {"p": "Start-StepOnce.bat", "s": 441, "l": "dos", "c": "@echo off\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo app.py が見つかりません。ZIPをすべて展開してから実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\npython -c \"import PySide6, PIL\" 2> nul\r\nif errorlevel 1 (\r\n  echo 必要なライブラリをインストールします（初回のみ）...\r\n  python -m pip install -r requirements.txt\r\n)\r\npython app.py\r\nif errorlevel 1 (\r\n  echo.\r\n  echo StepOnce がエラーで終了しました。上記の表示を確認してください。\r\n  pause\r\n)\r\n"}, {"p": "Start-StepOnce.command", "s": 1602, "l": "bash", "c": "#!/bin/bash\n# StepOnce - macOS source launcher\n# Double-click this file to run StepOnce from the source code.\n# First launch only: if macOS blocks it, right-click the file and\n# choose \"Open\" once.\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== StepOnce (macOS, from source) ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"StepOnce needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + dependencies (first run only) -----------------\nif [ ! -x \".venv/bin/python\" ]; then\n  echo \"Preparing the app environment (first run only)...\"\n  $PY -m venv .venv || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv/bin/python -m pip install -r requirements.txt || { echo \"Failed to install the required libraries. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nexec .venv/bin/python app.py\n"}, {"p": "tests/test_tejun.py", "s": 16702, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tests for StepOnce.\n\nRun: python3 -m unittest discover -s tests -v   (from the app folder)\nGUI tests use the offscreen Qt platform.\n\"\"\"\n\nimport os\nimport sys\nimport tempfile\nimport unittest\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nfrom PIL import Image  # noqa: E402\n\nimport core  # noqa: E402\nimport i18n  # noqa: E402\nimport recorder as recorder_mod  # noqa: E402\nfrom core import Project, Rect, Step  # noqa: E402\n\n\ndef sample_image(w=200, h=100, color=(240, 240, 240)):\n    return Image.new(\"RGB\", (w, h), color)\n\n\nclass TestI18n(unittest.TestCase):\n    def test_all_languages_have_all_keys(self):\n        ref = set(i18n.STRINGS[\"ja\"])\n        for code in i18n.LANG_ORDER:\n            self.assertEqual(set(i18n.STRINGS[code]), ref, code)\n\n    def test_templates_render_in_all_languages(self):\n        for code in i18n.LANG_ORDER:\n            for kind, key in ((\"button\", \"tpl_click_button\"),\n                              (\"input\", \"tpl_input\"),\n                              (\"open\", \"tpl_open\"),\n                              (\"named\", \"tpl_click_named\")):\n                text = i18n.tr(code, key, name=\"OK\")\n                self.assertIn(\"OK\", text, (code, key))\n                self.assertTrue(text.strip(), (code, key))\n            generic = i18n.tr(code, \"tpl_click_generic\")\n            self.assertTrue(generic.strip(), code)\n\n    def test_draft_text_per_kind(self):\n        step = Step(kind=core.KIND_BUTTON, target_name=\"保存\")\n        self.assertEqual(step.draft_text(\"ja\"),\n                         \"『保存』ボタンをクリックします\")\n        self.assertEqual(step.draft_text(\"en\"),\n                         \"Click the “保存” button\")\n        step2 = Step(kind=core.KIND_INPUT, target_name=\"名前\")\n        self.assertIn(\"名前\", step2.draft_text(\"ko\"))\n\n\nclass TestRecorderPipeline(unittest.TestCase):\n    def _recorder(self):\n        captured = []\n        rec = recorder_mod.FakeRecorder(\n            lambda step, img: captured.append((step, img)))\n        rec.start()\n        return rec, captured\n\n    def test_button_click_makes_button_draft(self):\n        rec, captured = self._recorder()\n        el = recorder_mod.ElementInfo(\n            name=\"OK\", control_type=50000, rect=(10, 10, 80, 30),\n            window_title=\"設定\")\n        rec.feed(sample_image(), el, (50, 25))\n        step, _img = captured[0]\n        self.assertEqual(step.kind, core.KIND_BUTTON)\n        self.assertEqual(step.target_name, \"OK\")\n        self.assertEqual(step.window_title, \"設定\")\n        self.assertAlmostEqual(step.click[0], 0.25)\n        self.assertAlmostEqual(step.click[1], 0.25)\n\n    def test_edit_click_makes_input_draft(self):\n        rec, captured = self._recorder()\n        el = recorder_mod.ElementInfo(name=\"検索\", control_type=50004)\n        rec.feed(sample_image(), el, (20, 20))\n        self.assertEqual(captured[0][0].kind, core.KIND_INPUT)\n\n    def test_menu_click_makes_open_draft(self):\n        rec, captured = self._recorder()\n        el = recorder_mod.ElementInfo(name=\"ファイル\", control_type=50011)\n        rec.feed(sample_image(), el, (20, 20))\n        self.assertEqual(captured[0][0].kind, core.KIND_OPEN)\n\n    def test_nameless_click_is_generic(self):\n        rec, captured = self._recorder()\n        el = recorder_mod.ElementInfo(name=\"\", control_type=50000)\n        rec.feed(sample_image(), el, (20, 20))\n        step = captured[0][0]\n        self.assertEqual(step.kind, core.KIND_GENERIC)\n        self.assertEqual(step.draft_text(\"ja\"), \"画面をクリックします\")\n\n    def test_password_field_becomes_mosaic_candidate_only(self):\n        rec, captured = self._recorder()\n        el = recorder_mod.ElementInfo(\n            name=\"パスワード\", control_type=50004, is_password=True,\n            rect=(20, 20, 100, 24))\n        rec.feed(sample_image(), el, (50, 30))\n        step = captured[0][0]\n        self.assertEqual(len(step.mosaic_candidates), 1)\n        self.assertEqual(step.mosaics, [])  # never auto-applied\n\n    def test_password_name_heuristic(self):\n        self.assertTrue(core.looks_like_password(\"Password\", False))\n        self.assertTrue(core.looks_like_password(\"パスワード\", False))\n        self.assertFalse(core.looks_like_password(\"ユーザー名\", False))\n        self.assertTrue(core.looks_like_password(\"\", True))\n\n    def test_paused_recorder_drops_clicks(self):\n        rec, captured = self._recorder()\n        rec.set_paused(True)\n        rec.feed(sample_image(), None, (1, 1))\n        self.assertEqual(captured, [])\n\n    def test_windows_recorder_ignores_own_process(self):\n        class FakeProvider:\n            def element_from_point(self, x, y):\n                return recorder_mod.ElementInfo(\n                    name=\"X\", control_type=50000,\n                    process_id=os.getpid())\n        got = []\n        rec = recorder_mod.WindowsAutoRecorder(\n            lambda s, i: got.append(s), element_provider=FakeProvider(),\n            grabber=lambda: (sample_image(), (0, 0)))\n        self.assertIsNone(rec.process_click(5, 5))\n        self.assertEqual(got, [])\n\n    def test_windows_recorder_processes_other_process(self):\n        class FakeProvider:\n            def element_from_point(self, x, y):\n                return recorder_mod.ElementInfo(\n                    name=\"送信\", control_type=50000, process_id=999999)\n        got = []\n        rec = recorder_mod.WindowsAutoRecorder(\n            lambda s, i: got.append(s), element_provider=FakeProvider(),\n            grabber=lambda: (sample_image(), (0, 0)))\n        step = rec.process_click(5, 5)\n        self.assertIsNotNone(step)\n        self.assertEqual(step.target_name, \"送信\")\n\n\nclass TestMosaicAndMarker(unittest.TestCase):\n    def test_mosaic_changes_only_region(self):\n        img = sample_image(100, 100, (200, 200, 200))\n        # put a sharp pattern inside the region\n        for x in range(10, 40):\n            img.putpixel((x, 10), (0, 0, 0) if x % 2 else (255, 255, 255))\n        out = core.apply_mosaics(img, [Rect(0.1, 0.1, 0.3, 0.3)])\n        self.assertEqual(img.getpixel((11, 10)), (0, 0, 0))  # original kept\n        region_vals = {out.getpixel((x, 10)) for x in range(12, 38, 3)}\n        self.assertLess(len(region_vals), 4)  # pixelated -> few colors\n        self.assertEqual(out.getpixel((90, 90)), (200, 200, 200))\n\n    def test_marker_drawn_at_click(self):\n        img = sample_image(200, 200, (255, 255, 255))\n        out = core.draw_marker(img, (0.5, 0.5))\n        r, g, b = out.getpixel((100, 100))\n        self.assertGreater(r, 200)\n        self.assertLess(g, 80)\n        self.assertEqual(img.getpixel((100, 100)), (255, 255, 255))\n        self.assertIs(core.draw_marker(img, None), img)\n\n\nclass TestProjectIO(unittest.TestCase):\n    def _project(self):\n        proj = Project(title=\"テスト手順\")\n        s1 = Step(kind=core.KIND_BUTTON, target_name=\"OK\",\n                  window_title=\"設定\", click=(0.5, 0.25),\n                  mosaics=[Rect(0.1, 0.1, 0.2, 0.2)],\n                  mosaic_candidates=[Rect(0.3, 0.3, 0.1, 0.1)],\n                  memo=\"メモ1\")\n        proj.add_step(s1, sample_image())\n        s2 = Step(kind=core.KIND_MANUAL, text_override=\"自分で書いた文\")\n        proj.add_step(s2, sample_image(120, 80, (10, 20, 30)))\n        return proj\n\n    def test_folder_round_trip(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            folder = os.path.join(tmp, \"proj\")\n            self._project().save(folder)\n            loaded = Project.load(folder)\n            self.assertEqual(loaded.title, \"テスト手順\")\n            self.assertEqual(len(loaded.steps), 2)\n            s1, s2 = loaded.steps\n            self.assertEqual(s1.target_name, \"OK\")\n            self.assertEqual(s1.click, (0.5, 0.25))\n            self.assertEqual(len(s1.mosaics), 1)\n            self.assertEqual(len(s1.mosaic_candidates), 1)\n            self.assertEqual(s1.memo, \"メモ1\")\n            self.assertEqual(s2.text_override, \"自分で書いた文\")\n            img = loaded.open_image(s1)\n            self.assertEqual(img.size, (200, 100))\n\n    def test_zip_round_trip(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            zip_path = os.path.join(tmp, \"proj.zip\")\n            self._project().export_zip(zip_path)\n            self.assertTrue(zipfile_ok(zip_path))\n            loaded = Project.import_zip(zip_path, os.path.join(tmp, \"out\"))\n            self.assertEqual(loaded.title, \"テスト手順\")\n            self.assertEqual(len(loaded.steps), 2)\n\n    def test_render_applies_mosaic_and_marker(self):\n        proj = self._project()\n        out = core.render_step_image(proj, proj.steps[0])\n        self.assertIsNotNone(out)\n        self.assertEqual(out.size, (200, 100))\n\n\ndef zipfile_ok(path):\n    import zipfile\n    with zipfile.ZipFile(path) as zf:\n        return \"project.json\" in zf.namelist()\n\n\nclass _StubTranslator:\n    def __init__(self, fail=False):\n        self.configured = True\n        self.fail = fail\n\n    def translate(self, text, lang):\n        if self.fail:\n            raise core.DeepLTranslator.DeepLError(\"stub failure\")\n        return \"[%s] %s\" % (lang, text)\n\n\nclass TestFreeTextResolution(unittest.TestCase):\n    def _proj(self):\n        proj = Project(title=\"t\")\n        proj.add_step(Step(kind=core.KIND_BUTTON, target_name=\"OK\"),\n                      sample_image())\n        proj.add_step(Step(kind=core.KIND_MANUAL,\n                           text_override=\"自由な文\"), sample_image())\n        return proj\n\n    def test_free_text_kept_without_deepl(self):\n        texts, any_free, failed = core.resolve_step_texts(\n            self._proj(), \"en\")\n        self.assertEqual(texts[1], \"自由な文\")\n        self.assertTrue(any_free)\n        self.assertFalse(failed)\n\n    def test_free_text_translated_with_stub(self):\n        texts, _any_free, failed = core.resolve_step_texts(\n            self._proj(), \"en\", translator=_StubTranslator(),\n            use_deepl=True)\n        self.assertEqual(texts[1], \"[en] 自由な文\")\n        self.assertFalse(failed)\n\n    def test_translation_failure_falls_back(self):\n        texts, _any_free, failed = core.resolve_step_texts(\n            self._proj(), \"en\", translator=_StubTranslator(fail=True),\n            use_deepl=True)\n        self.assertEqual(texts[1], \"自由な文\")\n        self.assertTrue(failed)\n\n    def test_arabic_never_translated(self):\n        class RealishTranslator(core.DeepLTranslator):\n            def __init__(self):\n                super().__init__(\"dummy:fx\")\n        texts, _f, failed = core.resolve_step_texts(\n            self._proj(), \"ar\", translator=RealishTranslator(),\n            use_deepl=True)\n        self.assertEqual(texts[1], \"自由な文\")\n        self.assertTrue(failed)  # unsupported -> original kept, flagged\n\n\nclass TestExport(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        from PySide6.QtWidgets import QApplication\n        cls.app = QApplication.instance() or QApplication([])\n\n    def _proj(self):\n        proj = Project(title=\"Export Test\")\n        proj.add_step(Step(kind=core.KIND_BUTTON, target_name=\"保存\",\n                           window_title=\"設定\", click=(0.5, 0.5),\n                           mosaics=[Rect(0.1, 0.1, 0.3, 0.2)]),\n                      sample_image(320, 200, (230, 230, 250)))\n        proj.add_step(Step(kind=core.KIND_MANUAL,\n                           text_override=\"確認してから進みます\",\n                           memo=\"注意メモ\"),\n                      sample_image(320, 200, (250, 240, 230)))\n        return proj\n\n    def test_export_all_languages_pdf_and_docx(self):\n        import exporter\n        with tempfile.TemporaryDirectory() as tmp:\n            result = exporter.export_manuals(\n                self._proj(), tmp, i18n.LANG_ORDER, [\"pdf\", \"docx\"])\n            self.assertEqual(len(result.files), 26)\n            for path in result.files:\n                self.assertTrue(os.path.getsize(path) > 1000, path)\n                if path.endswith(\".pdf\"):\n                    with open(path, \"rb\") as fh:\n                        self.assertEqual(fh.read(4), b\"%PDF\")\n\n    def test_docx_content(self):\n        import docx  # python-docx is a test-only verifier\n        import exporter\n        with tempfile.TemporaryDirectory() as tmp:\n            result = exporter.export_manuals(\n                self._proj(), tmp, [\"ja\", \"en\"], [\"docx\"])\n            ja = [p for p in result.files if p.endswith(\"_ja.docx\")][0]\n            doc = docx.Document(ja)\n            full = \"\\n\".join(p.text for p in doc.paragraphs)\n            self.assertIn(\"『保存』ボタンをクリックします\", full)\n            self.assertIn(\"確認してから進みます\", full)\n            en = [p for p in result.files if p.endswith(\"_en.docx\")][0]\n            doc_en = docx.Document(en)\n            full_en = \"\\n\".join(p.text for p in doc_en.paragraphs)\n            self.assertIn(\"Click the “保存” button\", full_en)\n            self.assertIn(\"確認してから進みます\", full_en)  # free text kept\n            import zipfile\n            with zipfile.ZipFile(ja) as zf:\n                media = [n for n in zf.namelist()\n                         if n.startswith(\"word/media/\")]\n            self.assertEqual(len(media), 2)\n\n\nclass TestGuiSmoke(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        from PySide6.QtWidgets import QApplication\n        cls.app = QApplication.instance() or QApplication([])\n\n    def _window(self):\n        import app as app_mod\n        win = app_mod.MainWindow()\n        self.addCleanup(win.close)\n        return win\n\n    def _add_steps(self, win):\n        for i in range(3):\n            step = Step(kind=core.KIND_BUTTON,\n                        target_name=\"B%d\" % i)\n            win.project.add_step(step, sample_image(160, 100))\n        win._refresh_steps()\n\n    def test_window_builds_and_lists_steps(self):\n        win = self._window()\n        self._add_steps(win)\n        self.assertEqual(win.list_steps.count(), 3)\n        win.list_steps.setCurrentRow(1)\n        self.assertIsNotNone(win.current_step)\n        self.assertEqual(win.current_step.target_name, \"B1\")\n\n    def test_step_operations(self):\n        win = self._window()\n        self._add_steps(win)\n        win.list_steps.setCurrentRow(0)\n        win.move_step(1)\n        self.assertEqual(win.project.steps[0].target_name, \"B1\")\n        self.assertEqual(win.project.steps[1].target_name, \"B0\")\n        win.list_steps.setCurrentRow(1)\n        win.duplicate_step()\n        self.assertEqual(len(win.project.steps), 4)\n        win.list_steps.setCurrentRow(0)\n        win.delete_step()\n        self.assertEqual(len(win.project.steps), 3)\n\n    def test_editor_edit_becomes_override(self):\n        win = self._window()\n        self._add_steps(win)\n        win.list_steps.setCurrentRow(0)\n        win.edit_text.setPlainText(\"書き直した文\")\n        win._commit_editor()\n        self.assertEqual(win.project.steps[0].text_override,\n                         \"書き直した文\")\n\n    def test_language_switch_instant_and_rtl(self):\n        from PySide6.QtCore import Qt\n        win = self._window()\n        ja_text = win.btn_record.text()\n        win.combo_lang.setCurrentIndex(i18n.LANG_ORDER.index(\"en\"))\n        self.assertEqual(win.lang, \"en\")\n        self.assertNotEqual(win.btn_record.text(), ja_text)\n        self.assertIn(\"Start recording\", win.btn_record.text())\n        win.combo_lang.setCurrentIndex(i18n.LANG_ORDER.index(\"ar\"))\n        self.assertEqual(win.layoutDirection(),\n                         Qt.LayoutDirection.RightToLeft)\n        win.combo_lang.setCurrentIndex(i18n.LANG_ORDER.index(\"ja\"))\n        self.assertEqual(win.layoutDirection(),\n                         Qt.LayoutDirection.LeftToRight)\n\n    def test_panel_retranslates(self):\n        import app as app_mod\n        panel = app_mod.RecordPanel(\"ja\", manual_mode=True)\n        self.addCleanup(panel.close)\n        panel.set_count(3)\n        ja = panel.btn_finish.text()\n        panel.retranslate(\"en\")\n        self.assertNotEqual(panel.btn_finish.text(), ja)\n        self.assertIn(\"3\", panel.lbl_count.text())\n\n    def test_dialogs_build(self):\n        import app as app_mod\n        win = self._window()\n        dlg = app_mod.ExportDialog(win, \"ja\", has_deepl_key=False)\n        self.addCleanup(dlg.close)\n        opts = dlg.options()\n        self.assertEqual(len(opts[\"langs\"]), 13)\n        self.assertIn(\"pdf\", opts[\"formats\"])\n        sd = app_mod.SettingsDialog(win, \"ja\", \"\")\n        self.addCleanup(sd.close)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n"}, {"p": "theme.py", "s": 8026, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Visual theme for StepOnce.\n\n\"Document studio\" look: a warm off-white paper background, a single\norange accent (the colour of idea sheet No. 06), charcoal text, thin\nrules and generous whitespace - like editing the pages of a booklet.\nThis deliberately differs from the blue gradient headers / 3D cards /\nround badges used by the user's other apps.\n\nOnly appearance lives here; behaviour is untouched.\n\"\"\"\n\n# -- palette -------------------------------------------------------------\nBG = \"#FAF7F2\"          # warm off-white (paper)\nSURFACE = \"#FFFFFF\"     # cards / header / inputs\nSURFACE_SOFT = \"#FFFDF9\"\nINK = \"#2E2A26\"         # charcoal text\nINK_SOFT = \"#5C554B\"\nMUTED = \"#9A8F7D\"       # warm grey for notes\nLINE = \"#E7DFD2\"        # thin warm rule\nLINE_STRONG = \"#D9D0C1\"\nACCENT = \"#E8590C\"      # orange accent (idea sheet No. 06)\nACCENT_HOVER = \"#F26D1D\"\nACCENT_PRESSED = \"#CE4C05\"\nACCENT_TINT = \"#FFF3E8\"  # selected card fill\nNUM_IDLE = \"#DCC7AC\"    # step number, unselected\nAMBER_BG = \"#FFF7DF\"    # mosaic-candidate notice\nAMBER_LINE = \"#EBCB7A\"\nAMBER_INK = \"#7A5B12\"\nREC_RED = \"#D93A2B\"     # recording dot / stop button\nREC_RED_DARK = \"#B92A1E\"\nPAUSE_AMBER = \"#E8A33D\"\n\nFONT_STACK = ('\"Yu Gothic UI\", \"Hiragino Kaku Gothic ProN\", '\n              '\"Hiragino Sans\", \"Noto Sans CJK JP\", \"Meiryo UI\", '\n              '\"Segoe UI\", \"Tahoma\", sans-serif')\n\n\ndef stylesheet():\n    return \"\"\"\nQWidget {\n    font-family: %(font)s;\n    font-size: 13px;\n    color: %(ink)s;\n}\nQMainWindow { background: %(bg)s; }\nQDialog { background: %(bg)s; }\nQWidget#central { background: %(bg)s; }\nQToolTip {\n    background: %(ink)s; color: #FFF7EA; border: none;\n    padding: 4px 8px; border-radius: 6px;\n}\n\n/* ---- header: thin white band, one orange rule under it ---- */\nQFrame#appHeader {\n    background: %(surface)s;\n    border: none;\n    border-bottom: 2px solid %(accent)s;\n}\nQLabel#logoMark {\n    background: %(accent)s; color: #FFFFFF;\n    font-size: 17px; font-weight: bold; border-radius: 9px;\n}\nQLabel#appTitle { font-size: 19px; font-weight: bold; color: %(ink)s; }\nQLabel#appSubtitle { font-size: 12px; color: %(muted)s; }\nQLabel#langLabel { font-size: 12px; font-weight: bold; color: %(ink_soft)s; }\n\n/* ---- text roles ---- */\nQLabel#sectionTitle { font-size: 12px; font-weight: bold; color: #8A7D68; }\nQLabel#mutedNote { color: %(muted)s; font-size: 12px; }\nQLabel#draftNote { color: %(muted)s; font-size: 11px; }\nQLabel#modeNote { color: #9A5B1E; font-size: 12px; }\nQLabel#emptyState {\n    border: 1.5px dashed %(line_strong)s; border-radius: 10px;\n    background: %(surface_soft)s; color: %(muted)s; padding: 16px 12px;\n}\n\n/* ---- buttons: flat, rounded; primary is orange ---- */\nQPushButton {\n    background: %(surface)s;\n    border: 1px solid %(line_strong)s;\n    border-radius: 8px;\n    padding: 7px 14px;\n    color: %(ink)s;\n}\nQPushButton:hover {\n    border-color: %(accent)s; color: %(accent)s; background: #FFF8F2;\n}\nQPushButton:pressed { background: #FDEBDD; }\nQPushButton:disabled {\n    color: #BFB5A4; border-color: %(line)s; background: #FBF9F5;\n}\nQPushButton:checked {\n    background: #FDEBDD; border-color: %(accent)s; color: %(accent_pressed)s;\n}\nQPushButton[role=\"primary\"] {\n    background: %(accent)s; border: 1px solid %(accent)s;\n    color: #FFFFFF; font-weight: bold;\n}\nQPushButton[role=\"primary\"]:hover {\n    background: %(accent_hover)s; border-color: %(accent_hover)s;\n    color: #FFFFFF;\n}\nQPushButton[role=\"primary\"]:pressed {\n    background: %(accent_pressed)s; border-color: %(accent_pressed)s;\n    color: #FFFFFF;\n}\nQPushButton[role=\"primary\"]:disabled {\n    background: #EFCDB2; border-color: #EFCDB2; color: #FFFFFF;\n}\nQPushButton[recording=\"true\"] {\n    background: %(rec_dark)s; border: 1px solid %(rec_dark)s;\n    color: #FFFFFF; font-weight: bold;\n}\nQPushButton[recording=\"true\"]:hover {\n    background: %(rec)s; border-color: %(rec)s; color: #FFFFFF;\n}\n\n/* ---- inputs ---- */\nQLineEdit, QPlainTextEdit {\n    background: %(surface)s;\n    border: 1px solid %(line_strong)s;\n    border-radius: 8px;\n    padding: 6px 10px;\n    selection-background-color: #FBD9B8; selection-color: %(ink)s;\n}\nQLineEdit:hover, QPlainTextEdit:hover { border-color: #C9BBA3; }\nQLineEdit:focus, QPlainTextEdit:focus { border: 1.5px solid %(accent)s; }\nQComboBox {\n    background: %(surface)s;\n    border: 1px solid %(line_strong)s;\n    border-radius: 8px;\n    padding: 5px 10px;\n    min-width: 108px;\n}\nQComboBox:hover { border-color: %(accent)s; }\nQComboBox::drop-down { border: none; width: 22px; }\nQComboBox QAbstractItemView {\n    background: %(surface)s; border: 1px solid %(line_strong)s;\n    selection-background-color: #FDEBDD; selection-color: %(ink)s;\n    outline: none; padding: 3px;\n}\nQCheckBox { spacing: 7px; }\nQCheckBox::indicator { width: 16px; height: 16px; }\n\n/* ---- step list: pages of a booklet ---- */\nQListWidget {\n    background: transparent; border: none; outline: none;\n}\nQListWidget::item {\n    background: transparent; border: none; margin: 3px 2px; padding: 0;\n}\nQListWidget::item:selected { background: transparent; }\nQListWidget::item:hover { background: rgba(232, 89, 12, 0.05); }\nQListWidget::item:focus { outline: none; }\nQFrame#stepCard {\n    background: %(surface)s;\n    border: 1px solid %(line)s;\n    border-radius: 10px;\n}\nQFrame#stepCard:hover { border-color: #EEA26F; }\nQFrame#stepCard[selected=\"true\"] {\n    background: %(accent_tint)s;\n    border: 1.5px solid %(accent)s;\n}\nQLabel#stepNum { font-size: 25px; font-weight: bold; color: %(num_idle)s; }\nQFrame#stepCard[selected=\"true\"] QLabel#stepNum { color: %(accent)s; }\nQLabel#stepText { font-size: 13px; color: %(ink)s; }\nQLabel#stepMeta { font-size: 11px; color: #A3988A; }\nQLabel#thumb {\n    background: %(surface)s; border: 1px solid %(line)s; border-radius: 6px;\n}\n\n/* ---- preview sheet ---- */\nQLabel#preview {\n    background: %(surface)s;\n    border: 1px solid %(line)s;\n    border-radius: 12px;\n}\nQRubberBand {\n    border: 1.5px solid %(accent)s;\n    background: rgba(232, 89, 12, 0.15);\n}\n\n/* ---- mosaic candidate notice ---- */\nQFrame#candidateBar {\n    background: %(amber_bg)s;\n    border: 1px solid %(amber_line)s;\n    border-radius: 10px;\n}\nQLabel#candidateText { color: %(amber_ink)s; font-size: 12.5px; }\n\n/* ---- recording panel ---- */\nQFrame#panelCard {\n    background: %(surface)s;\n    border: 1.5px solid %(accent)s;\n    border-radius: 14px;\n}\nQLabel#recStatus { font-size: 13px; font-weight: bold; color: %(ink)s; }\nQLabel#recCount { font-size: 12px; color: %(muted)s; }\nQLabel#recDot { background: %(rec)s; border-radius: 5px; }\nQLabel#recDot[state=\"paused\"] { background: %(pause)s; }\nQLabel#recDot[state=\"off\"] { background: transparent; }\n\n/* ---- splitter & scrollbars ---- */\nQSplitter::handle { background: transparent; }\nQSplitter::handle:horizontal { width: 8px; }\nQSplitter::handle:vertical { height: 8px; }\nQScrollBar:vertical {\n    background: transparent; width: 10px; margin: 2px 1px;\n}\nQScrollBar::handle:vertical {\n    background: #D8CDBB; border-radius: 5px; min-height: 30px;\n}\nQScrollBar::handle:vertical:hover { background: %(accent)s; }\nQScrollBar:horizontal {\n    background: transparent; height: 10px; margin: 1px 2px;\n}\nQScrollBar::handle:horizontal {\n    background: #D8CDBB; border-radius: 5px; min-width: 30px;\n}\nQScrollBar::handle:horizontal:hover { background: %(accent)s; }\nQScrollBar::add-line, QScrollBar::sub-line { width: 0; height: 0; }\nQScrollBar::add-page, QScrollBar::sub-page { background: transparent; }\n\"\"\" % {\n        \"font\": FONT_STACK, \"bg\": BG, \"surface\": SURFACE,\n        \"surface_soft\": SURFACE_SOFT, \"ink\": INK, \"ink_soft\": INK_SOFT,\n        \"muted\": MUTED, \"line\": LINE, \"line_strong\": LINE_STRONG,\n        \"accent\": ACCENT, \"accent_hover\": ACCENT_HOVER,\n        \"accent_pressed\": ACCENT_PRESSED, \"accent_tint\": ACCENT_TINT,\n        \"num_idle\": NUM_IDLE, \"amber_bg\": AMBER_BG,\n        \"amber_line\": AMBER_LINE, \"amber_ink\": AMBER_INK,\n        \"rec\": REC_RED, \"rec_dark\": REC_RED_DARK, \"pause\": PAUSE_AMBER,\n    }\n"}]</script>

<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
</body>
