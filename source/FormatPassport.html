<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FormatPassport のソースコード | get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#0D1526; --surface:#111C33; --surface2:#182747;
  --codebg:#0D1117; --ink:#E8EEF8; --muted:#93A5C4; --faint:#5B6E92; --line:#22314F;
  --line-soft:rgba(34,49,79,.55); --gutter-line:#21262D; --gutter-ink:#484F58;
  --accent:#3B82F6; --accent-strong:#60A5FA; --accent-soft:rgba(59,130,246,.16);
  --active-ink:#FFFFFF;
  --font-body:"Inter","Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F8FD; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#E7EFFD;
  --codebg:#FFFFFF; --ink:#0F1B33; --muted:#3B4A66; --faint:#64748B; --line:#DFE7F3;
  --line-soft:#E7EDF6; --gutter-line:#D8DEE4; --gutter-ink:#6E7781;
  --accent:#2563EB; --accent-strong:#1D4ED8; --accent-soft:rgba(37,99,235,.12);
  --active-ink:#1D4ED8;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:var(--accent-strong)}
/* ===== top bar ===== */
.topbar{flex:none;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;
  padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .appname{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .appname .ja{color:var(--muted);font-size:.82em;font-weight:700;margin-left:10px}
.topbar .meta{color:var(--faint);font-size:.85rem;white-space:nowrap}
.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:18px}
.topbar nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
.topbar nav a:hover{color:var(--ink)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 18px;border-radius:999px;
  box-shadow:0 8px 20px -6px rgba(37,99,235,.5);white-space:nowrap}
.dlbtn:hover{filter:brightness(1.12)}
.dlbtn svg{flex:none}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  cursor:pointer;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ic-moon{display:none}
:root[data-theme="light"] .themebtn .ic-moon{display:block}
:root[data-theme="light"] .themebtn .ic-sun{display:none}
.langpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.85rem;font-weight:700;
  line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;cursor:pointer;max-width:190px}
.langpick select:hover{border-color:var(--accent)}
/* ===== main split ===== */
.main{flex:1;display:flex;min-height:0}
.filelist{width:284px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--panel);
  border-right:1px solid var(--line)}
[dir="rtl"] .filelist{border-right:0;border-left:1px solid var(--line)}
.filelist .fl-head{padding:11px 16px;font-weight:800;font-size:.86rem;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.file-btn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);color:var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:.8rem;line-height:1.45;
  text-align:left;cursor:pointer;word-break:break-all}
.file-btn:hover{background:var(--surface2)}
.file-btn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);color:var(--active-ink)}
[dir="rtl"] .file-btn.active{box-shadow:inset -3px 0 0 var(--accent)}
.file-btn .sz{color:var(--faint);font-size:.7rem;flex:none}
.file-bin{padding:9px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);
  font-size:.8rem;line-height:1.45;color:var(--faint);word-break:break-all}
.file-bin .sz{font-size:.7rem;margin-left:8px}
.bin-note{display:block;font-family:var(--font-body);font-size:.72rem;color:#64748B;margin-top:1px}
/* ===== code pane ===== */
.codepane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--codebg)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .fname{font-family:var(--font-mono);font-size:.95rem;font-weight:700;word-break:break-all}
.toolbar .finfo{color:var(--muted);font-size:.85rem;white-space:nowrap}
.copybtn{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:7px 18px;border-radius:999px}
[dir="rtl"] .copybtn{margin-left:0;margin-right:auto}
.copybtn:hover{filter:brightness(1.12)}
.copybtn.done{background:#0E9F6E}
.code-scroll{flex:1;overflow:auto;min-height:0;direction:ltr}
.code-flex{display:flex;min-width:max-content;min-height:100%}
.gutter{flex:none;position:sticky;left:0;z-index:1;background:var(--codebg);
  border-right:1px solid var(--gutter-line);text-align:right;user-select:none;white-space:pre;
  font-family:var(--font-mono);font-size:16px;line-height:1.75;
  padding:16px 12px 24px 18px;color:var(--gutter-ink)}
.code-flex pre.code{flex:1;margin:0;padding:16px 28px 24px 20px;
  font-family:var(--font-mono);font-size:16px;line-height:1.75}
.code-flex pre.code code{font-family:inherit;font-size:inherit;line-height:inherit;
  background:transparent;padding:0;white-space:pre}
/* ===== highlight.js GitHub Dark (default) ===== */
.hljs{color:#E6EDF3;background:#0D1117}
.hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-variable,
.hljs-template-tag,.hljs-type,.hljs-variable.language_{color:#FF7B72}
.hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,
.hljs-title.function_{color:#D2A8FF}
.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,
.hljs-variable,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:#79C0FF}
.hljs-regexp,.hljs-string,.hljs-meta .hljs-string{color:#A5D6FF}
.hljs-built_in,.hljs-symbol{color:#FFA657}
.hljs-comment,.hljs-code,.hljs-formula{color:#8B949E}
.hljs-name,.hljs-quote,.hljs-selector-tag,.hljs-selector-pseudo{color:#7EE787}
.hljs-subst{color:#E6EDF3}
.hljs-section{color:#1F6FEB;font-weight:bold}
.hljs-bullet{color:#F2CC60}
.hljs-emphasis{color:#E6EDF3;font-style:italic}
.hljs-strong{color:#E6EDF3;font-weight:bold}
.hljs-addition{color:#AFF5B4;background-color:#033A16}
.hljs-deletion{color:#FFDCD7;background-color:#67060C}
.hljs-char.escape_,.hljs-link,.hljs-params,.hljs-property,.hljs-punctuation,.hljs-tag{/* purposely ignored */}
/* ===== highlight.js GitHub Light ===== */
:root[data-theme="light"] .hljs{color:#24292E;background:#FFFFFF}
:root[data-theme="light"] .hljs-doctag,:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-meta .hljs-keyword,:root[data-theme="light"] .hljs-template-variable,
:root[data-theme="light"] .hljs-template-tag,:root[data-theme="light"] .hljs-type,
:root[data-theme="light"] .hljs-variable.language_{color:#D73A49}
:root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.class_,
:root[data-theme="light"] .hljs-title.class_.inherited__,
:root[data-theme="light"] .hljs-title.function_{color:#6F42C1}
:root[data-theme="light"] .hljs-attr,:root[data-theme="light"] .hljs-attribute,
:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-meta,
:root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-operator,
:root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-selector-attr,
:root[data-theme="light"] .hljs-selector-class,:root[data-theme="light"] .hljs-selector-id{color:#005CC5}
:root[data-theme="light"] .hljs-regexp,:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-meta .hljs-string{color:#032F62}
:root[data-theme="light"] .hljs-built_in,:root[data-theme="light"] .hljs-symbol{color:#E36209}
:root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-code,
:root[data-theme="light"] .hljs-formula{color:#6A737D}
:root[data-theme="light"] .hljs-name,:root[data-theme="light"] .hljs-quote,
:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-selector-pseudo{color:#22863A}
:root[data-theme="light"] .hljs-subst{color:#24292E}
:root[data-theme="light"] .hljs-section{color:#005CC5;font-weight:bold}
:root[data-theme="light"] .hljs-bullet{color:#735C0F}
:root[data-theme="light"] .hljs-emphasis{color:#24292E;font-style:italic}
:root[data-theme="light"] .hljs-strong{color:#24292E;font-weight:bold}
:root[data-theme="light"] .hljs-addition{color:#22863A;background-color:#F0FFF4}
:root[data-theme="light"] .hljs-deletion{color:#B31D28;background-color:#FFEEF0}
@media (max-width:760px){
  .main{flex-direction:column}
  .filelist{width:auto;flex:none;max-height:158px;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line)}
  .filelist .fl-head{position:static}
  .filelist .fl-items{display:flex;flex-direction:row;overflow-x:auto}
  .file-btn,.file-bin{flex:none;border-bottom:0;border-right:1px solid var(--line-soft);
    white-space:nowrap;word-break:normal;align-items:center}
  .code-flex pre.code,.gutter{font-size:14.5px}
  .topbar .meta{display:none}
  .langpick select{max-width:140px}
}

<script type="application/json" id="filedata">[{"p": "app.py", "s": 24464, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"FormatPassport （フォーマットパスポート) - main window.\n\nSemi-auto by design: the app prepares conversions and flags anything\nreadable two ways; the human decides. Originals are never modified.\n\"\"\"\nimport json\nimport os\nimport sys\nimport threading\n\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\n\nfrom PySide6.QtCore import Qt, Signal, QObject\nfrom PySide6.QtGui import QColor, QDragEnterEvent, QDropEvent\nfrom PySide6.QtWidgets import (\n    QApplication, QButtonGroup, QCheckBox, QComboBox, QFileDialog, QFrame,\n    QHBoxLayout, QLabel, QLineEdit, QListWidget, QListWidgetItem, QMainWindow,\n    QMessageBox, QPushButton, QRadioButton, QScrollArea, QSplitter,\n    QTableWidget, QTableWidgetItem, QTextEdit, QVBoxLayout, QWidget,\n)\n\nimport core\nfrom countries import COUNTRIES, BY_CODE\nfrom i18n import LANG_NAMES, LANG_ORDER, RTL_LANGS, tr\n\nMAX_PREVIEW_ROWS = 300\nSTYLE = \"\"\"\nQMainWindow { background: #eef4fb; }\nQFrame#header { background: qlineargradient(x1:0,y1:0,x2:1,y2:1,\n  stop:0 #065f46, stop:.55 #059669, stop:1 #0ea5e9); border-radius: 14px; }\nQFrame#card { background: white; border: 1px solid #dbe7f3; border-radius: 12px; }\nQPushButton { background: qlineargradient(x1:0,y1:0,x2:0,y2:1, stop:0 #ffffff, stop:1 #dbeafe);\n  border: 1px solid #93c5fd; border-radius: 8px; padding: 6px 12px; font-weight: 600; }\nQPushButton:hover { background: #bfdbfe; }\nQPushButton#primary { background: qlineargradient(x1:0,y1:0,x2:0,y2:1, stop:0 #34d399, stop:1 #059669);\n  color: white; border: 1px solid #047857; }\nQComboBox, QLineEdit { background: white; border: 1px solid #b6c9de; border-radius: 6px; padding: 4px 6px; }\nQTableWidget { background: white; border: 1px solid #dbe7f3; }\nQLabel#drop { border: 2px dashed #38bdf8; border-radius: 12px; color: #0369a1;\n  background: #f0f9ff; padding: 14px; font-size: 14px; }\n\"\"\"\n\n\nclass Signals(QObject):\n    fx_ready = Signal(object, object)\n\n\nclass MainWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.lang = \"ja\"\n        self.sender_code = \"DE\"\n        self.receiver_code = \"JP\"\n        self.table = None\n        self.result = None\n        self.resolutions = {}\n        self.fx_cache = core.load_fx_cache()\n        self.signals = Signals()\n        self.signals.fx_ready.connect(self._on_fx_ready)\n        self._load_settings()\n        self._build_ui()\n        self.apply_language(self.lang, rebuild=False)\n        self._update_fx_status()\n        self._start_fx_fetch()\n\n    # ------------------------------------------------------------ settings\n    def _settings_path(self):\n        return os.path.join(core.app_data_dir(), \"settings.json\")\n\n    def _load_settings(self):\n        try:\n            with open(self._settings_path(), encoding=\"utf-8\") as fh:\n                d = json.load(fh)\n            if d.get(\"lang\") in LANG_ORDER:\n                self.lang = d[\"lang\"]\n            if d.get(\"sender\") in BY_CODE:\n                self.sender_code = d[\"sender\"]\n            if d.get(\"receiver\") in BY_CODE:\n                self.receiver_code = d[\"receiver\"]\n        except Exception:\n            pass\n\n    def _save_settings(self):\n        try:\n            with open(self._settings_path(), \"w\", encoding=\"utf-8\") as fh:\n                json.dump({\"lang\": self.lang, \"sender\": self.sender_code,\n                           \"receiver\": self.receiver_code}, fh, ensure_ascii=False)\n        except Exception:\n            pass\n\n    def t(self, key, **kw):\n        return tr(self.lang, key, **kw)\n\n    # ------------------------------------------------------------ UI build\n    def _build_ui(self):\n        self.setStyleSheet(STYLE)\n        self.resize(1240, 860)\n        self.setAcceptDrops(True)\n        central = QWidget()\n        self.setCentralWidget(central)\n        root = QVBoxLayout(central)\n        root.setContentsMargins(10, 10, 10, 10)\n        root.setSpacing(8)\n\n        header = QFrame()\n        header.setObjectName(\"header\")\n        hv = QVBoxLayout(header)\n        top = QHBoxLayout()\n        title_box = QVBoxLayout()\n        self.title_label = QLabel()\n        self.title_label.setStyleSheet(\"color: white; font-size: 22px; font-weight: 800;\")\n        self.subtitle_label = QLabel()\n        self.subtitle_label.setStyleSheet(\"color: #d1fae5; font-size: 12px;\")\n        self.subtitle_label.setWordWrap(True)\n        title_box.addWidget(self.title_label)\n        title_box.addWidget(self.subtitle_label)\n        top.addLayout(title_box)\n        top.addStretch(1)\n        self.lang_label = QLabel()\n        self.lang_label.setStyleSheet(\"color: white; font-weight: 700;\")\n        top.addWidget(self.lang_label)\n        self.lang_combo = QComboBox()\n        for code in LANG_ORDER:\n            self.lang_combo.addItem(LANG_NAMES[code], code)\n        self.lang_combo.setCurrentIndex(LANG_ORDER.index(self.lang))\n        self.lang_combo.currentIndexChanged.connect(\n            lambda i: self.apply_language(self.lang_combo.itemData(i)))\n        top.addWidget(self.lang_combo)\n        hv.addLayout(top)\n        root.addWidget(header)\n\n        # --- countries card\n        card = QFrame(); card.setObjectName(\"card\")\n        cv = QVBoxLayout(card)\n        row = QHBoxLayout()\n        self.sender_label = QLabel()\n        self.sender_combo = QComboBox()\n        self.sender_combo.currentIndexChanged.connect(self._country_changed)\n        row.addWidget(self.sender_label); row.addWidget(self.sender_combo, 1)\n        self.sender_ccy = QLabel(); row.addWidget(self.sender_ccy)\n        self.swap_btn = QPushButton()\n        self.swap_btn.clicked.connect(self._swap)\n        row.addWidget(self.swap_btn)\n        self.receiver_label = QLabel()\n        self.receiver_combo = QComboBox()\n        self.receiver_combo.currentIndexChanged.connect(self._country_changed)\n        row.addWidget(self.receiver_label); row.addWidget(self.receiver_combo, 1)\n        self.receiver_ccy = QLabel(); row.addWidget(self.receiver_ccy)\n        cv.addLayout(row)\n        row2 = QHBoxLayout()\n        self.open_btn = QPushButton()\n        self.open_btn.clicked.connect(self._open_file)\n        row2.addWidget(self.open_btn)\n        self.drop_label = QLabel()\n        self.drop_label.setObjectName(\"drop\")\n        self.drop_label.setAlignment(Qt.AlignCenter)\n        row2.addWidget(self.drop_label, 1)\n        self.preview_btn = QPushButton()\n        self.preview_btn.setObjectName(\"primary\")\n        self.preview_btn.clicked.connect(self._rebuild_preview)\n        row2.addWidget(self.preview_btn)\n        cv.addLayout(row2)\n        row3 = QHBoxLayout()\n        self.enc_label = QLabel()\n        row3.addWidget(self.enc_label)\n        self.enc_combo = QComboBox()\n        self.enc_combo.addItem(\"UTF-8 (BOM)\", \"utf-8-sig\")\n        self.enc_combo.addItem(\"UTF-8\", \"utf-8\")\n        self.enc_combo.addItem(\"Shift_JIS\", \"shift_jis\")\n        row3.addWidget(self.enc_combo)\n        self.fw_check = QCheckBox()\n        row3.addWidget(self.fw_check)\n        row3.addStretch(1)\n        cv.addLayout(row3)\n        root.addWidget(card)\n\n        # --- FX card\n        fxcard = QFrame(); fxcard.setObjectName(\"card\")\n        fv = QVBoxLayout(fxcard)\n        frow = QHBoxLayout()\n        self.fx_title = QLabel()\n        self.fx_title.setStyleSheet(\"font-weight: 700;\")\n        frow.addWidget(self.fx_title)\n        self.fx_enable = QCheckBox()\n        self.fx_enable.stateChanged.connect(lambda *_: self._rebuild_preview())\n        frow.addWidget(self.fx_enable)\n        self.fx_mode_group = QButtonGroup(self)\n        self.fx_ref = QRadioButton(); self.fx_ref.setChecked(True)\n        self.fx_bank = QRadioButton(); self.fx_manual = QRadioButton()\n        for rb in (self.fx_ref, self.fx_bank, self.fx_manual):\n            self.fx_mode_group.addButton(rb)\n            frow.addWidget(rb)\n            rb.toggled.connect(lambda *_: self._rebuild_preview())\n        self.fx_update_btn = QPushButton()\n        self.fx_update_btn.clicked.connect(self._start_fx_fetch)\n        frow.addWidget(self.fx_update_btn)\n        frow.addStretch(1)\n        fv.addLayout(frow)\n        self.fx_status = QLabel()\n        self.fx_status.setWordWrap(True)\n        fv.addWidget(self.fx_status)\n        mrow = QHBoxLayout()\n        self.manual_bank_label = QLabel(); mrow.addWidget(self.manual_bank_label)\n        self.manual_bank = QLineEdit(); mrow.addWidget(self.manual_bank)\n        self.manual_tts_label = QLabel(); mrow.addWidget(self.manual_tts_label)\n        self.manual_tts = QLineEdit(); self.manual_tts.setMaximumWidth(90); mrow.addWidget(self.manual_tts)\n        self.manual_ttb_label = QLabel(); mrow.addWidget(self.manual_ttb_label)\n        self.manual_ttb = QLineEdit(); self.manual_ttb.setMaximumWidth(90); mrow.addWidget(self.manual_ttb)\n        self.manual_rate_label = QLabel(); mrow.addWidget(self.manual_rate_label)\n        self.manual_rate = QLineEdit(); self.manual_rate.setMaximumWidth(90); mrow.addWidget(self.manual_rate)\n        self.manual_date_label = QLabel(); mrow.addWidget(self.manual_date_label)\n        self.manual_date = QLineEdit(); mrow.addWidget(self.manual_date)\n        fv.addLayout(mrow)\n        root.addWidget(fxcard)\n\n        # --- previews + review/report\n        split = QSplitter(Qt.Vertical)\n        tables = QSplitter(Qt.Horizontal)\n        self.before_table = QTableWidget()\n        self.after_table = QTableWidget()\n        for tw in (self.before_table, self.after_table):\n            tw.setEditTriggers(QTableWidget.NoEditTriggers)\n        tables.addWidget(self.before_table)\n        tables.addWidget(self.after_table)\n        split.addWidget(tables)\n        bottom = QWidget()\n        bv = QVBoxLayout(bottom)\n        self.review_label = QLabel()\n        self.review_label.setStyleSheet(\"font-weight: 700;\")\n        bv.addWidget(self.review_label)\n        self.review_list = QListWidget()\n        self.review_list.itemDoubleClicked.connect(self._review_clicked)\n        bv.addWidget(self.review_list)\n        self.report_label = QLabel()\n        self.report_label.setStyleSheet(\"font-weight: 700;\")\n        bv.addWidget(self.report_label)\n        self.report_text = QTextEdit()\n        self.report_text.setReadOnly(True)\n        self.report_text.setMaximumHeight(130)\n        bv.addWidget(self.report_text)\n        split.addWidget(bottom)\n        split.setSizes([520, 300])\n        root.addWidget(split, 1)\n\n        bar = QHBoxLayout()\n        self.status_label = QLabel()\n        bar.addWidget(self.status_label, 1)\n        self.export_csv_btn = QPushButton()\n        self.export_csv_btn.clicked.connect(lambda: self._export(\"csv\"))\n        bar.addWidget(self.export_csv_btn)\n        self.export_xlsx_btn = QPushButton()\n        self.export_xlsx_btn.clicked.connect(lambda: self._export(\"xlsx\"))\n        bar.addWidget(self.export_xlsx_btn)\n        self.report_btn = QPushButton()\n        self.report_btn.clicked.connect(self._save_report)\n        bar.addWidget(self.report_btn)\n        root.addLayout(bar)\n        self._fill_country_combos()\n\n    # ------------------------------------------------------------ language\n    def apply_language(self, lang, rebuild=True):\n        if lang not in LANG_ORDER:\n            lang = \"ja\"\n        self.lang = lang\n        self._save_settings()\n        idx = LANG_ORDER.index(lang)\n        if self.lang_combo.currentIndex() != idx:\n            self.lang_combo.blockSignals(True)\n            self.lang_combo.setCurrentIndex(idx)\n            self.lang_combo.blockSignals(False)\n        direction = Qt.LayoutDirection.RightToLeft if lang in RTL_LANGS else Qt.LayoutDirection.LeftToRight\n        QApplication.instance().setLayoutDirection(direction)\n        self.setWindowTitle(self.t(\"app_title\"))\n        self.title_label.setText(self.t(\"app_title\"))\n        self.subtitle_label.setText(self.t(\"app_subtitle\"))\n        self.lang_label.setText(self.t(\"lang_label\"))\n        self.sender_label.setText(self.t(\"sender\"))\n        self.receiver_label.setText(self.t(\"receiver\"))\n        self.swap_btn.setText(self.t(\"swap\"))\n        self.open_btn.setText(self.t(\"open_file\"))\n        self.drop_label.setText(self.t(\"drop_hint\"))\n        self.preview_btn.setText(self.t(\"preview_btn\"))\n        self.enc_label.setText(self.t(\"encoding\"))\n        self.fw_check.setText(self.t(\"fix_fw\"))\n        self.fx_title.setText(self.t(\"fx_title\"))\n        self.fx_enable.setText(self.t(\"fx_enable\"))\n        self.fx_ref.setText(self.t(\"fx_mode_ref\"))\n        self.fx_bank.setText(self.t(\"fx_mode_bank\"))\n        self.fx_manual.setText(self.t(\"fx_mode_manual\"))\n        self.fx_update_btn.setText(self.t(\"fx_update\"))\n        self.manual_bank_label.setText(self.t(\"manual_bank\"))\n        self.manual_tts_label.setText(self.t(\"manual_tts\"))\n        self.manual_ttb_label.setText(self.t(\"manual_ttb\"))\n        self.manual_rate_label.setText(self.t(\"manual_rate\"))\n        self.manual_date_label.setText(self.t(\"manual_date\"))\n        self.review_label.setText(self.t(\"review_title\"))\n        self.report_label.setText(self.t(\"report_title\"))\n        self.export_csv_btn.setText(self.t(\"export_csv\"))\n        self.export_xlsx_btn.setText(self.t(\"export_xlsx\"))\n        self.report_btn.setText(self.t(\"save_report\"))\n        self._fill_country_combos()\n        self._update_currency_labels()\n        self._update_fx_status()\n        if self.table is not None and rebuild:\n            self._rebuild_preview()\n\n    def _country_name(self, c):\n        return c[\"name_ja\"] if self.lang == \"ja\" else c[\"name_en\"]\n\n    def _fill_country_combos(self):\n        for combo, current in ((self.sender_combo, self.sender_code),\n                               (self.receiver_combo, self.receiver_code)):\n            combo.blockSignals(True)\n            combo.clear()\n            for c in COUNTRIES:\n                combo.addItem(\"%s (%s)\" % (self._country_name(c), c[\"code\"]), c[\"code\"])\n            combo.setCurrentIndex([c[\"code\"] for c in COUNTRIES].index(current))\n            combo.blockSignals(False)\n\n    def _update_currency_labels(self):\n        for code, label in ((self.sender_code, self.sender_ccy),\n                            (self.receiver_code, self.receiver_ccy)):\n            c = BY_CODE[code]\n            cname = c[\"currency_ja\"] if self.lang == \"ja\" else c[\"currency_en\"]\n            label.setText(\"%s (%s)\" % (cname, c[\"currency\"]))\n\n    def _country_changed(self, *_):\n        self.sender_code = self.sender_combo.currentData() or self.sender_code\n        self.receiver_code = self.receiver_combo.currentData() or self.receiver_code\n        self._save_settings()\n        self._update_currency_labels()\n        if self.table is not None:\n            self._rebuild_preview()\n\n    def _swap(self):\n        self.sender_code, self.receiver_code = self.receiver_code, self.sender_code\n        self._fill_country_combos()\n        self._country_changed()\n\n    # ------------------------------------------------------------ FX\n    def _start_fx_fetch(self):\n        self.fx_status.setText(self.t(\"fx_fetching\"))\n\n        def work():\n            merged, _errors = core.fetch_all_rates(timeout=8)\n            mufg = None\n            try:\n                mufg = core.fetch_mufg(timeout=10)\n            except Exception:\n                mufg = None\n            self.signals.fx_ready.emit(merged, mufg)\n\n        threading.Thread(target=work, daemon=True).start()\n\n    def _on_fx_ready(self, merged, mufg):\n        if merged and merged.get(\"rates\"):\n            self.fx_cache[\"merged\"] = merged\n        if mufg:\n            self.fx_cache[\"mufg\"] = mufg\n        try:\n            core.save_fx_cache(self.fx_cache)\n        except Exception:\n            pass\n        self._update_fx_status()\n        if self.table is not None and self.fx_enable.isChecked():\n            self._rebuild_preview()\n\n    def _update_fx_status(self):\n        merged = self.fx_cache.get(\"merged\")\n        mufg = self.fx_cache.get(\"mufg\")\n        parts = []\n        if merged and merged.get(\"rates\"):\n            cov = core.tier_coverage(merged)\n            parts.append(\"公式 %d通貨／ECB基準 %d通貨／参考(集計) %d通貨\" % (\n                cov.get(1, 0), cov.get(2, 0), cov.get(3, 0)))\n            parts.append(\"取得: %s\" % merged.get(\"fetched_at\", \"\"))\n        else:\n            parts.append(self.t(\"fx_no_data\"))\n        if mufg:\n            parts.append(\"MUFG TTS/TTB: %s\" % mufg.get(\"date\", \"\"))\n        self.fx_status.setText(\" ｜ \".join(parts))\n\n    def _fx_context(self):\n        if not self.fx_enable.isChecked():\n            return None\n        if self.fx_bank.isChecked():\n            return {\"mode\": \"bank\", \"ctx\": {\"mufg\": self.fx_cache.get(\"mufg\")}}\n        if self.fx_manual.isChecked():\n            ctx = {\"bank_name\": self.manual_bank.text().strip(),\n                   \"date_memo\": self.manual_date.text().strip()}\n            for key, edit in ((\"tts\", self.manual_tts), (\"ttb\", self.manual_ttb),\n                              (\"rate\", self.manual_rate)):\n                v = edit.text().strip()\n                if v:\n                    ctx[key] = v\n            return {\"mode\": \"manual\", \"ctx\": ctx}\n        return {\"mode\": \"ref\", \"ctx\": {\"bundle\": self.fx_cache.get(\"merged\") or {}}}\n\n    # ------------------------------------------------------------ file flow\n    def dragEnterEvent(self, event: QDragEnterEvent):\n        if event.mimeData().hasUrls():\n            event.acceptProposedAction()\n\n    def dropEvent(self, event: QDropEvent):\n        urls = event.mimeData().urls()\n        if urls:\n            self._load_path(urls[0].toLocalFile())\n\n    def _open_file(self):\n        path, _ = QFileDialog.getOpenFileName(\n            self, self.t(\"open_file\"), \"\",\n            \"Excel/CSV (*.xlsx *.xlsm *.csv *.tsv *.txt);;All files (*)\")\n        if path:\n            self._load_path(path)\n\n    def _load_path(self, path):\n        try:\n            self.table = core.load_table(path)\n        except Exception as exc:\n            QMessageBox.warning(self, self.t(\"error_title\"),\n                                self.t(\"error_load\", msg=str(exc)))\n            return\n        self.source_path = path\n        self.resolutions = {}\n        self.status_label.setText(self.t(\n            \"status_loaded\", name=os.path.basename(path), rows=len(self.table.rows)))\n        self._rebuild_preview()\n\n    def _rebuild_preview(self):\n        if self.table is None:\n            return\n        fx = self._fx_context()\n        self.result = core.convert_table(\n            self.table, self.sender_code, self.receiver_code,\n            opts={\"fix_fullwidth_text\": self.fw_check.isChecked()},\n            resolutions=self.resolutions, fx=fx)\n        self._fill_tables()\n        self._fill_reviews()\n        self.report_text.setPlainText(core.build_report_text(self.result))\n        self.status_label.setText(self.t(\n            \"status_done\", changes=self.result.report[\"changes\"],\n            reviews=self.result.report[\"unresolved\"]))\n\n    def _fill_tables(self):\n        headers = self.table.headers\n        types = self.result.report.get(\"col_types\", [])\n        type_names = {\"date\": self.t(\"col_type_date\"), \"amount\": self.t(\"col_type_amount\"),\n                      \"code\": self.t(\"col_type_code\"), \"text\": self.t(\"col_type_text\")}\n        disp_headers = [\"%s [%s]\" % (h, type_names.get(types[i], \"\"))\n                        if i < len(types) else h for i, h in enumerate(headers)]\n        changes = {(c[\"row\"], c[\"col\"]): c for c in self.result.changes}\n        n = min(len(self.table.rows), MAX_PREVIEW_ROWS)\n        for tw, rows in ((self.before_table, self.table.rows),\n                         (self.after_table, self.result.rows)):\n            tw.clear()\n            tw.setColumnCount(len(headers))\n            tw.setRowCount(n)\n            tw.setHorizontalHeaderLabels(disp_headers)\n            for r in range(n):\n                for c in range(len(headers)):\n                    item = QTableWidgetItem(str(rows[r][c]))\n                    if tw is self.after_table and (r, c) in changes:\n                        item.setBackground(QColor(\"#fef9c3\"))\n                        item.setToolTip(\"%s → %s (%s)\" % (\n                            changes[(r, c)][\"before\"], changes[(r, c)][\"after\"],\n                            changes[(r, c)][\"reason\"]))\n                    tw.setItem(r, c, item)\n            tw.resizeColumnsToContents()\n\n    def _fill_reviews(self):\n        self.review_list.clear()\n        reviews = self.result.reviews if self.result else []\n        if not reviews:\n            self.review_list.addItem(self.t(\"review_empty\"))\n            return\n        self.review_list.addItem(self.t(\"review_count\", n=len(reviews)))\n        for item in reviews:\n            li = QListWidgetItem(\"#%d %s / %s : %s\" % (\n                item.row + 2, item.header, self.t(\"choose\"), item.original))\n            li.setData(Qt.UserRole, item)\n            self.review_list.addItem(li)\n\n    def _review_clicked(self, li):\n        item = li.data(Qt.UserRole)\n        if item is None:\n            return\n        self._resolve_review(item)\n\n    def _resolve_review(self, item):\n        from PySide6.QtWidgets import QDialog, QDialogButtonBox\n        dlg = QDialog(self)\n        dlg.setWindowTitle(self.t(\"review_title\"))\n        v = QVBoxLayout(dlg)\n        v.addWidget(QLabel(\"%s : %s\" % (item.header, item.original)))\n        why = QLabel(item.reason)\n        why.setWordWrap(True)\n        v.addWidget(why)\n        v.addWidget(QLabel(self.t(\"choose\")))\n        group = QButtonGroup(dlg)\n        radios = []\n        for i, cand in enumerate(item.candidates):\n            rb = QRadioButton(cand[\"label\"])\n            if i == 0:\n                rb.setChecked(True)\n            group.addButton(rb)\n            radios.append((rb, cand))\n            v.addWidget(rb)\n        row = QHBoxLayout()\n        cell_btn = QPushButton(self.t(\"apply_cell\"))\n        all_btn = QPushButton(self.t(\"apply_all\"))\n        row.addWidget(cell_btn)\n        row.addWidget(all_btn)\n        v.addLayout(row)\n        outcome = {}\n\n        def apply(scope):\n            for rb, cand in radios:\n                if rb.isChecked():\n                    outcome[\"cand\"] = cand\n                    break\n            outcome[\"scope\"] = scope\n            dlg.accept()\n\n        cell_btn.clicked.connect(lambda: apply(\"cell\"))\n        all_btn.clicked.connect(lambda: apply(\"all\"))\n        if dlg.exec() and \"cand\" in outcome:\n            if outcome[\"scope\"] == \"all\":\n                self.resolutions[item.pattern_key] = outcome[\"cand\"][\"output\"]\n            else:\n                self.resolutions[\"r%dc%d\" % (item.row, item.col)] = outcome[\"cand\"][\"output\"]\n            self._rebuild_preview()\n\n    # ------------------------------------------------------------ export\n    def _export(self, kind):\n        if self.result is None or self.table is None:\n            return\n        out_table = core.Table(self.table.headers, self.result.rows)\n        if kind == \"csv\":\n            path, _ = QFileDialog.getSaveFileName(\n                self, self.t(\"save_as\"), \"converted.csv\", \"CSV (*.csv)\")\n            if not path:\n                return\n            delim = BY_CODE[self.receiver_code][\"delimiter\"]\n            core.save_table_csv(out_table, path, delimiter=delim,\n                                encoding=self.enc_combo.currentData())\n        else:\n            path, _ = QFileDialog.getSaveFileName(\n                self, self.t(\"save_as\"), \"converted.xlsx\", \"Excel (*.xlsx)\")\n            if not path:\n                return\n            core.save_table_xlsx(out_table, path)\n        self.status_label.setText(self.t(\"exported\", path=path))\n\n    def _save_report(self):\n        if self.result is None:\n            return\n        path, _ = QFileDialog.getSaveFileName(\n            self, self.t(\"save_as\"), \"report.txt\", \"Text (*.txt)\")\n        if not path:\n            return\n        with open(path, \"w\", encoding=\"utf-8\") as fh:\n            fh.write(core.build_report_text(self.result))\n        self.status_label.setText(self.t(\"report_saved\", path=path))\n\n\ndef main():\n    app = QApplication(sys.argv)\n    try:\n        import os as _os, sys as _sys\n        from PySide6.QtGui import QIcon as _QIcon\n        _ib = getattr(_sys, \"_MEIPASS\", None) or _os.path.dirname(_os.path.abspath(__file__))\n        _ip = _os.path.join(_ib, \"assets\", \"icon.png\")\n        if _os.path.exists(_ip):\n            app.setWindowIcon(_QIcon(_ip))\n    except Exception:\n        pass\n    win = MainWindow()\n    win.show()\n    sys.exit(app.exec())\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"p": "assets/icon.icns", "s": 187851, "b": 1}, {"p": "assets/icon.ico", "s": 32824, "b": 1}, {"p": "assets/icon.png", "s": 72079, "b": 1}, {"p": "core.py", "s": 54654, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"FormatPassport core: table IO, format analysis/conversion, FX.\n\nSemi-auto rule: the engine prepares conversion proposals and flags anything\nreadable two ways into a review list. It never guesses an ambiguous value.\n\"\"\"\nimport csv\nimport io\nimport json\nimport os\nimport re\nimport sys\nimport urllib.request\nfrom datetime import date, datetime\nfrom decimal import Decimal, ROUND_HALF_UP, InvalidOperation\n\nfrom countries import BY_CODE, MINOR_UNITS\n\n# --------------------------------------------------------------------------\n# small helpers\n# --------------------------------------------------------------------------\n_FW_TABLE = {ord(\"０\") + i: ord(\"0\") + i for i in range(10)}\n_FW_TABLE.update({\n    ord(\"．\"): \".\", ord(\"。\"): \".\", ord(\"，\"): \",\", ord(\"、\"): \",\",\n    ord(\"－\"): \"-\", ord(\"ー\"): \"-\", ord(\"／\"): \"/\", ord(\"：\"): \":\",\n    ord(\"　\"): \" \",\n})\nfor i in range(26):\n    _FW_TABLE[ord(\"Ａ\") + i] = ord(\"A\") + i\n    _FW_TABLE[ord(\"ａ\") + i] = ord(\"a\") + i\n\n\ndef normalize_fullwidth(s):\n    \"\"\"Fullwidth digits/punct -> halfwidth (used in numeric/date contexts).\"\"\"\n    return s.translate(_FW_TABLE)\n\n\ndef minor_unit(code):\n    return MINOR_UNITS.get(code, 2)\n\n\n# --------------------------------------------------------------------------\n# Table IO\n# --------------------------------------------------------------------------\nclass Table:\n    def __init__(self, headers, rows, meta=None):\n        self.headers = headers          # list[str]\n        self.rows = rows                # list[list[str]]\n        self.meta = meta or {}\n\n\ndef detect_encoding(raw):\n    if raw.startswith(b\"\\xef\\xbb\\xbf\"):\n        return \"utf-8-sig\"\n    if raw.startswith(b\"\\xff\\xfe\") or raw.startswith(b\"\\xfe\\xff\"):\n        return \"utf-16\"\n    for enc in (\"utf-8\", \"shift_jis\"):\n        try:\n            raw.decode(enc)\n            return enc\n        except (UnicodeDecodeError, LookupError):\n            continue\n    return \"latin-1\"\n\n\ndef detect_delimiter(text):\n    sample = text[:8192]\n    try:\n        dialect = csv.Sniffer().sniff(sample, delimiters=\",;\\t|\")\n        return dialect.delimiter\n    except csv.Error:\n        pass\n    lines = [ln for ln in sample.splitlines() if ln.strip()][:10]\n    best, best_score = \",\", -1\n    for cand in (\",\", \";\", \"\\t\", \"|\"):\n        counts = [ln.count(cand) for ln in lines]\n        if counts and min(counts) > 0:\n            score = min(counts) * 100 - (max(counts) - min(counts))\n            if score > best_score:\n                best, best_score = cand, score\n    return best\n\n\ndef parse_csv_text(text, delimiter=None):\n    if delimiter is None:\n        delimiter = detect_delimiter(text)\n    reader = csv.reader(io.StringIO(text), delimiter=delimiter)\n    rows = [r for r in reader]\n    if not rows:\n        return Table([], []), delimiter\n    headers = [h.strip() for h in rows[0]]\n    body = []\n    for r in rows[1:]:\n        if len(r) < len(headers):\n            r = r + [\"\"] * (len(headers) - len(r))\n        body.append(r[:len(headers)])\n    return Table(headers, body), delimiter\n\n\ndef load_table(path):\n    ext = os.path.splitext(path)[1].lower()\n    if ext in (\".xlsx\", \".xlsm\"):\n        from openpyxl import load_workbook  # lazy: heavy import\n        wb = load_workbook(path, read_only=True, data_only=True)\n        ws = wb.active\n        rows = []\n        for row in ws.iter_rows(values_only=True):\n            rows.append([\"\" if c is None else\n                         (c.isoformat() if isinstance(c, (date, datetime)) else str(c))\n                         for c in row])\n        wb.close()\n        if not rows:\n            return Table([], [], {\"source_format\": \"xlsx\"})\n        headers = [h.strip() for h in rows[0]]\n        body = []\n        for r in rows[1:]:\n            if len(r) < len(headers):\n                r = r + [\"\"] * (len(headers) - len(r))\n            body.append(r[:len(headers)])\n        return Table(headers, body, {\"source_format\": \"xlsx\"})\n    with open(path, \"rb\") as fh:\n        raw = fh.read()\n    enc = detect_encoding(raw)\n    text = raw.decode(enc)\n    table, delim = parse_csv_text(text)\n    table.meta = {\"source_format\": \"csv\", \"encoding\": enc, \"delimiter\": delim}\n    return table\n\n\ndef table_to_csv_text(table, delimiter=\",\", encoding=\"utf-8-sig\"):\n    buf = io.StringIO()\n    writer = csv.writer(buf, delimiter=delimiter, lineterminator=\"\\r\\n\")\n    writer.writerow(table.headers)\n    writer.writerows(table.rows)\n    text = buf.getvalue()\n    if encoding == \"shift_jis\":\n        return text.encode(\"shift_jis\", errors=\"replace\")\n    if encoding == \"utf-8\":\n        return text.encode(\"utf-8\")\n    return (\"\\ufeff\" + text).encode(\"utf-8\")  # utf-8-sig\n\n\ndef save_table_xlsx(table, path):\n    from openpyxl import Workbook  # lazy\n    wb = Workbook()\n    ws = wb.active\n    ws.append(table.headers)\n    for r in table.rows:\n        ws.append(r)\n    wb.save(path)\n\n\ndef save_table_csv(table, path, delimiter=\",\", encoding=\"utf-8-sig\"):\n    data = table_to_csv_text(table, delimiter, encoding)\n    with open(path, \"wb\") as fh:\n        fh.write(data)\n\n\n# --------------------------------------------------------------------------\n# Wareki (Japanese era) conversion\n# --------------------------------------------------------------------------\nERAS = [  # (kanji, letter, first Gregorian year of era year 1)\n    (\"令和\", \"R\", 2019), (\"平成\", \"H\", 1989), (\"昭和\", \"S\", 1926),\n    (\"大正\", \"T\", 1912), (\"明治\", \"M\", 1868),\n]\n_ERA_BY_KANJI = {k: (ltr, start) for k, ltr, start in ERAS}\n_ERA_BY_LETTER = {ltr: (k, start) for k, ltr, start in ERAS}\n_WAREKI_FULL = re.compile(\n    r\"^(令和|平成|昭和|大正|明治)(元|\\d{1,2})年(\\d{1,2})月(\\d{1,2})日$\")\n_WAREKI_SHORT = re.compile(r\"^([RHSTM])(\\d{1,2})[./](\\d{1,2})[./](\\d{1,2})$\", re.I)\n\n\ndef wareki_to_date(s):\n    \"\"\"Parse a wareki string to a date; None when not wareki/unparseable.\"\"\"\n    s = normalize_fullwidth(str(s).strip())\n    m = _WAREKI_FULL.match(s)\n    if m:\n        era, y, mo, d = m.groups()\n        _, start = _ERA_BY_KANJI[era]\n        year = start + (1 if y == \"元\" else int(y)) - 1\n        try:\n            return date(year, int(mo), int(d))\n        except ValueError:\n            return None\n    m = _WAREKI_SHORT.match(s.replace(\"-\", \".\").replace(\"/\", \".\"))\n    if m:\n        ltr, y, mo, d = m.groups()\n        _, start = _ERA_BY_LETTER[ltr.upper()]\n        try:\n            return date(start + int(y) - 1, int(mo), int(d))\n        except ValueError:\n            return None\n    return None\n\n\ndef is_wareki(s):\n    s = normalize_fullwidth(str(s).strip())\n    return bool(_WAREKI_FULL.match(s) or\n                _WAREKI_SHORT.match(s.replace(\"-\", \".\").replace(\"/\", \".\")))\n\n\ndef date_to_wareki(d, style=\"full\"):\n    for kanji, ltr, start in ERAS:\n        if d.year >= start:\n            ey = d.year - start + 1\n            if style == \"short\":\n                return \"%s%d.%d.%d\" % (ltr, ey, d.month, d.day)\n            ys = \"元\" if ey == 1 else str(ey)\n            return \"%s%s年%d月%d日\" % (kanji, ys, d.month, d.day)\n    return None\n\n\n# --------------------------------------------------------------------------\n# Date parsing with ambiguity control\n# --------------------------------------------------------------------------\n_MONTHS = {m: i + 1 for i, m in enumerate(\n    [\"jan\", \"feb\", \"mar\", \"apr\", \"may\", \"jun\",\n     \"jul\", \"aug\", \"sep\", \"oct\", \"nov\", \"dec\"])}\n_DATE_SPLIT = re.compile(r\"^(\\d{1,4})\\D(\\d{1,2})(?:\\D(\\d{1,4}))?$\")\n_DATE_MONTHNAME = re.compile(\n    r\"^(\\d{1,2})[ ./-]([A-Za-z]{3,9})[ ./-](\\d{2,4})$\")\n_DATE_MONTHNAME2 = re.compile(\n    r\"^([A-Za-z]{3,9})[ ./-](\\d{1,2})[ .,\\/-]+(\\d{2,4})$\")\n\n\ndef _pivot_year(y):\n    if y < 100:\n        return 2000 + y if y <= 68 else 1900 + y\n    return y\n\n\ndef _try_date(y, m, d):\n    try:\n        return date(y, m, d)\n    except ValueError:\n        return None\n\n\ndef classify_numeric_date(s):\n    \"\"\"Return info dict for a numeric date string (2 or 3 parts), or None.\n\n    Keys: parts (a, b, c_or_None), year_pos ('first'/'last'/'none').\n    \"\"\"\n    m = _DATE_SPLIT.match(s)\n    if not m:\n        return None\n    a, b = int(m.group(1)), int(m.group(2))\n    if m.group(3) is None:\n        return {\"parts\": (a, b, None), \"year_pos\": \"none\"}\n    c = int(m.group(3))\n    if len(m.group(1)) == 4 or a > 31:\n        year_pos = \"first\"\n    else:\n        year_pos = \"last\"\n    return {\"parts\": (a, b, c), \"year_pos\": year_pos}\n\n\ndef parse_date_with_order(s, order):\n    \"\"\"Parse s assuming component order ('DMY','MDY','YMD'); date or None.\"\"\"\n    info = classify_numeric_date(s)\n    if info:\n        a, b, c = info[\"parts\"]\n        if info[\"year_pos\"] == \"first\":\n            y, m, d = a, b, c\n        elif info[\"year_pos\"] == \"none\":\n            y = date.today().year\n            if order == \"DMY\":\n                d, m = a, b\n            else:  # MDY, and YMD receivers read month/day too\n                m, d = a, b\n        elif order == \"DMY\":\n            d, m, y = a, b, _pivot_year(c)\n        elif order == \"MDY\":\n            m, d, y = a, b, _pivot_year(c)\n        else:  # YMD with year last is not a thing; treat as DMY fallback\n            d, m, y = a, b, _pivot_year(c)\n        return _try_date(y, m, d)\n    m = _DATE_MONTHNAME.match(s)\n    if m:\n        d, mon, y = m.groups()\n        mm = _MONTHS.get(mon[:3].lower())\n        if mm:\n            return _try_date(_pivot_year(int(y)), mm, int(d))\n    m = _DATE_MONTHNAME2.match(s)\n    if m:\n        mon, d, y = m.groups()\n        mm = _MONTHS.get(mon[:3].lower())\n        if mm:\n            return _try_date(_pivot_year(int(y)), mm, int(d))\n    return None\n\n\ndef format_date_short(d, profile):\n    \"\"\"Two-component (month/day) rendering for yearless input dates.\"\"\"\n    sep = profile[\"date_sep\"]\n    if profile[\"date_order\"] == \"DMY\":\n        return \"%02d%s%02d\" % (d.day, sep, d.month)\n    return \"%02d%s%02d\" % (d.month, sep, d.day)\n\n\ndef format_date(d, profile):\n    order = profile[\"date_order\"]\n    sep = profile[\"date_sep\"]\n    if order == \"DMY\":\n        return \"%02d%s%02d%s%04d\" % (d.day, sep, d.month, sep, d.year)\n    if order == \"MDY\":\n        return \"%02d%s%02d%s%04d\" % (d.month, sep, d.day, sep, d.year)\n    return \"%04d%s%02d%s%02d\" % (d.year, sep, d.month, sep, d.day)\n\n\ndef analyze_date_column(values, sender_order):\n    \"\"\"Decide the proven order for a column of date strings.\n\n    Returns (order_or_None, proven_reason). order None => undecidable per cell.\n    \"\"\"\n    proofs = set()\n    saw_numeric = False\n    for v in values:\n        info = classify_numeric_date(v)\n        if not info:\n            continue\n        saw_numeric = True\n        a, b, _c = info[\"parts\"]\n        if info[\"year_pos\"] == \"first\":\n            proofs.add(\"YMD\")\n        else:\n            if a > 12 and b <= 12:\n                proofs.add(\"DMY\")\n            elif b > 12 and a <= 12:\n                proofs.add(\"MDY\")\n    if not saw_numeric:\n        return sender_order, \"no numeric dates\"\n    real = {p for p in proofs if p in (\"DMY\", \"MDY\")}\n    if \"YMD\" in proofs and not real:\n        return \"YMD\", \"year-first values\"\n    if len(real) == 1:\n        return real.pop(), \"column evidence\"\n    if len(real) > 1:\n        return None, \"conflicting evidence\"\n    # No in-column evidence: the sender country's nominal order is NOT\n    # trusted on its own (files routinely deviate from it — that is the\n    # whole problem this app exists for). Dual-readable cells get flagged.\n    return None, \"no column evidence\"\n\n\n# --------------------------------------------------------------------------\n# Number parsing with ambiguity control\n# --------------------------------------------------------------------------\n_CCY_TOKENS = [\n    (\"JPY\", (\"¥\", \"円\", \"JPY\")), (\"USD\", (\"$\", \"USD\", \"ドル\")),\n    (\"EUR\", (\"€\", \"EUR\")), (\"GBP\", (\"£\", \"GBP\")),\n    (\"CNY\", (\"元\", \"CNY\")), (\"KRW\", (\"₩\", \"KRW\")),\n]\n_SPACE_CHARS = \" \\u00a0\\u202f\\u2009\"\n\n\ndef _strip_currency(s):\n    t = s\n    found = None\n    for code, toks in _CCY_TOKENS:\n        for tok in toks:\n            if tok and (t.startswith(tok) or t.endswith(tok)):\n                t = t.replace(tok, \"\").strip()\n                found = code\n    return t, found\n\n\ndef parse_number(s, decimal_sep, thousands_sep, proof=None):\n    \"\"\"Parse a number string under one separator hypothesis.\n\n    Returns (Decimal, info) or (None, info). info['ambiguous'] is True for\n    the classic single-separator + exactly-3-trailing-digits shape, unless\n    `proof` (dict: separator char -> 'decimal'|'thousands', derived from\n    unambiguous values elsewhere in the column) settles that separator.\n    \"\"\"\n    proof = proof or {}\n    info = {\"ambiguous\": False, \"currency\": None}\n    if s is None:\n        return None, info\n    t = normalize_fullwidth(str(s).strip())\n    t, ccy = _strip_currency(t)\n    info[\"currency\"] = ccy\n    neg = False\n    if t.startswith(\"(\") and t.endswith(\")\"):\n        neg, t = True, t[1:-1]\n    if t.startswith(\"-\"):\n        neg, t = True, t[1:]\n    if t.endswith(\"%\"):\n        t = t[:-1]\n    for ch in _SPACE_CHARS:\n        t = t.replace(ch, \"\")\n    t = t.replace(\"'\", \"\")\n    if not t or not re.fullmatch(r\"[0-9.,]+\", t):\n        return None, info\n    has_dot, has_comma = \".\" in t, \",\" in t\n    try:\n        if has_dot and has_comma:\n            dec = \".\" if t.rfind(\".\") > t.rfind(\",\") else \",\"\n            thou = \",\" if dec == \".\" else \".\"\n            v = Decimal(t.replace(thou, \"\").replace(dec, \".\"))\n        elif has_dot or has_comma:\n            sep = \".\" if has_dot else \",\"\n            parts = t.split(sep)\n            if len(parts) > 2:\n                if any(len(p) != 3 for p in parts[1:]):\n                    return None, info\n                v = Decimal(\"\".join(parts))\n            elif len(parts[1]) == 3 and len(parts[0]) <= 3 and parts[0] != \"0\":\n                if proof.get(sep) == \"thousands\":\n                    v = Decimal(parts[0] + parts[1])\n                elif proof.get(sep) == \"decimal\":\n                    v = Decimal(parts[0] + \".\" + parts[1])\n                else:\n                    info[\"ambiguous\"] = True\n                if info[\"ambiguous\"]:\n                    if sep == decimal_sep:\n                        v = Decimal(parts[0] + \".\" + parts[1])\n                        info[\"alt\"] = Decimal(parts[0] + parts[1])\n                    else:\n                        v = Decimal(parts[0] + parts[1])\n                        info[\"alt\"] = Decimal(parts[0] + \".\" + parts[1])\n            else:\n                if sep == decimal_sep:\n                    v = Decimal(parts[0] + \".\" + parts[1])\n                elif sep == thousands_sep:\n                    if len(parts[1]) != 3:\n                        return None, info\n                    v = Decimal(parts[0] + parts[1])\n                else:\n                    v = Decimal(parts[0] + \".\" + parts[1])\n        else:\n            v = Decimal(t)\n    except InvalidOperation:\n        return None, info\n    return (-v if neg else v), info\n\n\ndef format_number(v, profile, minor=None, money=False):\n    dec = profile[\"decimal\"]\n    thou = profile[\"thousands\"]\n    if minor is None:\n        # plain number: keep natural scale, trim to at most 4 dp for display\n        q = Decimal(\"0.0001\")\n        v = v.quantize(q, rounding=ROUND_HALF_UP).normalize()\n        s = format(v, \"f\")\n    else:\n        q = Decimal(1).scaleb(-minor)\n        v = v.quantize(q, rounding=ROUND_HALF_UP)\n        s = format(v, \"f\")\n    neg = s.startswith(\"-\")\n    if neg:\n        s = s[1:]\n    if \".\" in s:\n        ip, fp = s.split(\".\")\n    else:\n        ip, fp = s, \"\"\n    groups = []\n    while len(ip) > 3:\n        groups.append(ip[-3:])\n        ip = ip[:-3]\n    groups.append(ip)\n    out = thou.join(reversed(groups))\n    if fp:\n        out += dec + fp\n    elif money and minor and minor > 0:\n        out += dec + \"0\" * minor\n    return (\"-\" if neg else \"\") + out\n\n\n# --------------------------------------------------------------------------\n# Column typing\n# --------------------------------------------------------------------------\n_CODE_HINTS = (\"code\", \"id\", \"sku\", \"jan\", \"asin\", \"コード\", \"番号\", \"品番\", \"型番\")\n_DATE_HINTS = (\"date\", \"日付\", \"日\", \"年月日\")\n_AMOUNT_HINTS = (\"amount\", \"price\", \"total\", \"sum\", \"金額\", \"価格\", \"合計\", \"単価\", \"料金\")\n\n\ndef _header_hint(header, hints):\n    h = (header or \"\").lower()\n    return any(x in h for x in hints)\n\n\ndef classify_column(header, values, sender):\n    \"\"\"Return 'date' | 'amount' | 'code' | 'text'.\"\"\"\n    vals = [v for v in values if str(v).strip()]\n    if not vals:\n        return \"text\"\n    sample = vals[:60]\n    wareki_hits = sum(1 for v in sample if is_wareki(normalize_fullwidth(str(v))))\n    date_hits = 0\n    num_hits = 0\n    lead_zero = False\n    for v in sample:\n        sv = normalize_fullwidth(str(v).strip())\n        if re.fullmatch(r\"0\\d+\", sv.replace(\",\", \"\").replace(\" \", \"\")):\n            lead_zero = True\n        if parse_date_with_order(sv, sender[\"date_order\"]) or is_wareki(sv):\n            date_hits += 1\n        n, _ = parse_number(sv, sender[\"decimal\"], sender[\"thousands\"])\n        if n is not None:\n            num_hits += 1\n    n = len(sample)\n    if wareki_hits >= max(1, n // 3):\n        return \"date\"\n    if _header_hint(header, _CODE_HINTS) and num_hits >= n * 0.5:\n        return \"code\"\n    if lead_zero and num_hits >= n * 0.6 and not _header_hint(header, _AMOUNT_HINTS):\n        return \"code\"\n    if date_hits >= n * 0.6:\n        return \"date\"\n    if num_hits >= n * 0.6:\n        return \"amount\" if (wareki_hits == 0) else \"text\"\n    return \"text\"\n\n\n# --------------------------------------------------------------------------\n# FX: rate sources, cache, math\n# --------------------------------------------------------------------------\nFRANKFURTER_URL = \"https://api.frankfurter.dev/v1/latest?base=USD\"\nERAPI_URL = \"https://open.er-api.com/v6/latest/USD\"\nMUFG_URL = \"https://www.bk.mufg.jp/gdocs/rate/kinri_data_utf8.js\"\n\nLBL_FRANK = \"ECB基準レートによる試算（レート日付：{date}）\"\nLBL_ERAPI = \"参考レート（集計値）による試算 — 公式基準レートではありません\"\nLBL_ERAPI_ATTR = \"出典：ExchangeRate-API (open.er-api.com)\"\nLBL_MUFG = \"三菱UFJ銀行の適用レート（TTS/TTB・{dt}）で計算 — 送金手数料・受取側手数料は含みません\"\nLBL_MANUAL = \"「{bank}」の適用レート（手入力{date}）で計算 — 送金手数料・受取側手数料は含みません\"\n\n# MUFG widget G-codes -> ISO currency (cross-checked against market rates\n# published the same day; unknown codes are ignored by the parser).\nMUFG_G2CCY = {\n    \"G001\": \"USD\", \"G020\": \"EUR\", \"G002\": \"GBP\", \"G005\": \"CHF\",\n    \"G061\": \"AUD\", \"G074\": \"NZD\", \"G080\": \"ZAR\", \"G095\": \"TRY\",\n    \"G069\": \"CNY\",\n}\n\n\ndef _http_get(url, timeout=10):\n    req = urllib.request.Request(url, headers={\"User-Agent\": \"FormatPassport/1.0\"})\n    with urllib.request.urlopen(req, timeout=timeout) as resp:\n        return resp.read()\n\n\ndef fetch_frankfurter(timeout=10):\n    data = json.loads(_http_get(FRANKFURTER_URL, timeout).decode(\"utf-8\"))\n    rates = {k: Decimal(str(v)) for k, v in data[\"rates\"].items()}\n    rates[\"USD\"] = Decimal(1)\n    return {\"source\": \"frankfurter\", \"base\": \"USD\", \"date\": data.get(\"date\", \"\"),\n            \"rates\": rates, \"fetched_at\": datetime.now().isoformat(timespec=\"seconds\")}\n\n\ndef fetch_erapi(timeout=10):\n    data = json.loads(_http_get(ERAPI_URL, timeout).decode(\"utf-8\"))\n    if data.get(\"result\") != \"success\":\n        raise ValueError(\"er-api result != success\")\n    rates = {k: Decimal(str(v)) for k, v in data[\"rates\"].items()}\n    return {\"source\": \"erapi\", \"base\": \"USD\",\n            \"date\": str(data.get(\"time_last_update_utc\", \"\"))[:16],\n            \"rates\": rates, \"fetched_at\": datetime.now().isoformat(timespec=\"seconds\")}\n\n\n_MUFG_PAIR = re.compile(r'\"(G\\d{3})(TTS|TTB)Z\"\\s*:\\s*\"([\\d.]+)\"')\n_MUFG_DATE = re.compile(r'\"G001DATE\"\\s*:\\s*\"([^\"]+)\"')\n\n\ndef parse_mufg_js(text):\n    \"\"\"Tolerant parser for MUFG's published kinri_data JS. Returns dict or None.\"\"\"\n    if isinstance(text, bytes):\n        text = text.decode(\"utf-8-sig\", errors=\"replace\")\n    pairs = {}\n    for code, kind, val in _MUFG_PAIR.findall(text):\n        ccy = MUFG_G2CCY.get(code)\n        if not ccy:\n            continue\n        try:\n            pairs.setdefault(ccy, {})[kind] = Decimal(val)\n        except InvalidOperation:\n            continue\n    out = {}\n    for ccy, d in pairs.items():\n        if \"TTS\" in d and \"TTB\" in d:\n            out[ccy] = (d[\"TTS\"], d[\"TTB\"])\n    if not out:\n        return None\n    m = _MUFG_DATE.search(text)\n    return {\"source\": \"mufg\", \"date\": m.group(1) if m else \"\",\n            \"pairs\": out, \"fetched_at\": datetime.now().isoformat(timespec=\"seconds\")}\n\n\ndef fetch_mufg(timeout=10):\n    parsed = parse_mufg_js(_http_get(MUFG_URL, timeout))\n    if parsed is None:\n        raise ValueError(\"MUFG rate file could not be parsed\")\n    return parsed\n\n\n# --------------------------------------------------------------------------\n# Official central-bank rate layer (Tier 1) + tiered merge\n#\n# Every rate carries provenance: which source published it and that\n# source's tier. Tier 1 = a central bank / official publisher itself,\n# Tier 2 = Frankfurter (ECB reference data redistributed), Tier 3 =\n# open.er-api.com (aggregated, last resort only). A lower tier NEVER\n# overrides a higher tier for the same currency.\n# --------------------------------------------------------------------------\nSOURCE_INFO = {\n    \"fred\": (\"FRED（米連邦準備制度 H.10）\", 1),\n    \"rba\": (\"オーストラリア準備銀行（RBA）\", 1),\n    \"nbp\": (\"ポーランド国立銀行（NBP）\", 1),\n    \"cnb\": (\"チェコ国立銀行（CNB）\", 1),\n    \"nbu\": (\"ウクライナ国立銀行（NBU）\", 1),\n    \"bcb\": (\"ブラジル中央銀行（BCB / PTAX）\", 1),\n    \"hkma\": (\"香港金融管理局（HKMA）\", 1),\n    \"norges\": (\"ノルウェー中央銀行（Norges Bank）\", 1),\n    \"frankfurter\": (\"ECB（Frankfurter経由）\", 2),\n    \"erapi\": (\"ExchangeRate-API（集計値）\", 3),\n}\nLBL_OFFICIAL = \"公式レート（中央銀行）による試算（出典：{names}／レート日付：{dates}）\"\n\n\ndef _bundle(source, rates, date, dates=None):\n    name, tier = SOURCE_INFO[source]\n    return {\"source\": source, \"base\": \"USD\", \"date\": date,\n            \"rates\": dict(rates),\n            \"prov\": {c: (source, tier) for c in rates},\n            \"dates\": dates or {c: date for c in rates},\n            \"fetched_at\": datetime.now().isoformat(timespec=\"seconds\")}\n\n\n# --- FRED (Federal Reserve H.10, fredgraph CSV, no key) ---\nFRED_SERIES = {  # series -> (currency, 'usd_per' = USD per 1 ccy | 'per_usd')\n    \"DEXUSEU\": (\"EUR\", \"usd_per\"), \"DEXUSUK\": (\"GBP\", \"usd_per\"),\n    \"DEXUSAL\": (\"AUD\", \"usd_per\"), \"DEXUSNZ\": (\"NZD\", \"usd_per\"),\n    \"DEXJPUS\": (\"JPY\", \"per_usd\"), \"DEXCAUS\": (\"CAD\", \"per_usd\"),\n    \"DEXCHUS\": (\"CNY\", \"per_usd\"), \"DEXSZUS\": (\"CHF\", \"per_usd\"),\n    \"DEXKOUS\": (\"KRW\", \"per_usd\"), \"DEXHKUS\": (\"HKD\", \"per_usd\"),\n    \"DEXINUS\": (\"INR\", \"per_usd\"), \"DEXMXUS\": (\"MXN\", \"per_usd\"),\n    \"DEXBZUS\": (\"BRL\", \"per_usd\"), \"DEXTAUS\": (\"TWD\", \"per_usd\"),\n    \"DEXSIUS\": (\"SGD\", \"per_usd\"), \"DEXMAUS\": (\"MYR\", \"per_usd\"),\n    \"DEXTHUS\": (\"THB\", \"per_usd\"), \"DEXSFUS\": (\"ZAR\", \"per_usd\"),\n    \"DEXNOUS\": (\"NOK\", \"per_usd\"), \"DEXSDUS\": (\"SEK\", \"per_usd\"),\n    \"DEXDNUS\": (\"DKK\", \"per_usd\"),\n}\nFRED_URL = \"https://fred.stlouisfed.org/graph/fredgraph.csv?id=\" + \",\".join(FRED_SERIES)\n\n\ndef parse_fred_csv(text):\n    lines = [ln for ln in text.strip().splitlines() if ln.strip()]\n    if len(lines) < 2:\n        return None\n    header = lines[0].split(\",\")\n    last = None\n    for ln in lines[1:]:\n        cells = ln.split(\",\")\n        if any(c not in (\"\", \".\") for c in cells[1:]):\n            last = cells\n    if last is None:\n        return None\n    rates = {\"USD\": Decimal(1)}\n    for i, sid in enumerate(header[1:], start=1):\n        if sid not in FRED_SERIES or i >= len(last):\n            continue\n        raw = last[i]\n        if raw in (\"\", \".\"):\n            continue\n        ccy, mode = FRED_SERIES[sid]\n        v = Decimal(raw)\n        rates[ccy] = (Decimal(1) / v) if mode == \"usd_per\" else v\n    if len(rates) < 3:\n        return None\n    return _bundle(\"fred\", rates, last[0])\n\n\ndef fetch_fred(timeout=10):\n    timeout = max(timeout, 20)\n    ids = list(FRED_SERIES)\n    merged = None\n    for i in range(0, len(ids), 11):\n        url = (\"https://fred.stlouisfed.org/graph/fredgraph.csv?id=\"\n               + \",\".join(ids[i:i + 11]))\n        try:\n            b = parse_fred_csv(_http_get(url, timeout).decode(\"utf-8\", \"replace\"))\n        except Exception:\n            b = None  # no retries: respect the source's rate limits\n        if b is None:\n            continue\n        if merged is None:\n            merged = b\n        else:\n            for ccy, v in b[\"rates\"].items():\n                merged[\"rates\"].setdefault(ccy, v)\n                merged[\"prov\"].setdefault(ccy, b[\"prov\"][ccy])\n                merged[\"dates\"].setdefault(ccy, b[\"dates\"].get(ccy, b[\"date\"]))\n            merged[\"date\"] = max(merged[\"date\"], b[\"date\"])\n    if merged is None or len(merged[\"rates\"]) < 3:\n        raise ValueError(\"FRED parse failed\")\n    return merged\n\n\n# --- RBA (Reserve Bank of Australia RSS; values = foreign units per 1 AUD) ---\n_RBA_ITEM = re.compile(r'<item rdf:about=\"[^\"]*#([A-Z]{3})\">(.*?)<\/item>', re.S)\n_RBA_VAL = re.compile(r\"<cb:value>([\\d.]+)<\/cb:value>\")\n_RBA_DATE = re.compile(r\"<dc:date>([^<]+)<\/dc:date>\")\n\n\ndef parse_rba_xml(text):\n    per_aud = {}\n    dates = []\n    for ccy, body in _RBA_ITEM.findall(text):\n        m = _RBA_VAL.search(body)\n        if m:\n            per_aud[ccy] = Decimal(m.group(1))\n        d = _RBA_DATE.search(body)\n        if d:\n            dates.append(d.group(1)[:10])\n    if \"USD\" not in per_aud or len(per_aud) < 5:\n        return None\n    usd_per_aud = per_aud[\"USD\"]\n    rates = {c: (v / usd_per_aud) for c, v in per_aud.items()}\n    rates[\"AUD\"] = Decimal(1) / usd_per_aud\n    rates[\"USD\"] = Decimal(1)\n    return _bundle(\"rba\", rates, dates[0] if dates else \"\")\n\n\ndef fetch_rba(timeout=10):\n    b = parse_rba_xml(_http_get(\n        \"https://www.rba.gov.au/rss/rss-cb-exchange-rates.xml\", timeout).decode(\"utf-8\", \"replace\"))\n    if b is None:\n        raise ValueError(\"RBA parse failed\")\n    return b\n\n\n# --- NBP (National Bank of Poland, table A JSON; mid = PLN per 1 unit) ---\ndef parse_nbp_json(text):\n    data = json.loads(text)[0]\n    per_pln = {}\n    for r in data[\"rates\"]:\n        per_pln[r[\"code\"]] = Decimal(str(r[\"mid\"]))\n    if \"USD\" not in per_pln:\n        return None\n    # per_pln[ccy] is PLN per 1 ccy; USD-based rate = (PLN per USD)/(PLN per ccy)\n    pln_per_usd = per_pln[\"USD\"]\n    rates = {c: (pln_per_usd / v) for c, v in per_pln.items()}\n    rates[\"PLN\"] = pln_per_usd\n    rates[\"USD\"] = Decimal(1)\n    return _bundle(\"nbp\", rates, data.get(\"effectiveDate\", \"\"))\n\n\ndef fetch_nbp(timeout=10):\n    b = parse_nbp_json(_http_get(\n        \"https://api.nbp.pl/api/exchangerates/tables/A/?format=json\", timeout).decode(\"utf-8\"))\n    if b is None:\n        raise ValueError(\"NBP parse failed\")\n    return b\n\n\n# --- CNB (Czech National Bank daily txt; Rate = CZK per Amount units) ---\ndef parse_cnb_txt(text):\n    per_czk = {}\n    day = \"\"\n    for ln in text.splitlines():\n        if \" #\" in ln and \"|\" not in ln:\n            day = ln.split(\" #\")[0].strip()\n        parts = ln.split(\"|\")\n        if len(parts) == 5 and re.fullmatch(r\"[A-Z]{3}\", parts[3].strip()):\n            amount = Decimal(parts[2].strip())\n            rate = Decimal(parts[4].strip())\n            per_czk[parts[3].strip()] = rate / amount\n    if \"USD\" not in per_czk:\n        return None\n    czk_per_usd = per_czk[\"USD\"]\n    rates = {c: (czk_per_usd / v) for c, v in per_czk.items()}\n    rates[\"CZK\"] = czk_per_usd\n    rates[\"USD\"] = Decimal(1)\n    return _bundle(\"cnb\", rates, day)\n\n\ndef fetch_cnb(timeout=10):\n    b = parse_cnb_txt(_http_get(\n        \"https://www.cnb.cz/en/financial-markets/foreign-exchange-market/\"\n        \"central-bank-exchange-rate-fixing/central-bank-exchange-rate-fixing/daily.txt\",\n        timeout).decode(\"utf-8\", \"replace\"))\n    if b is None:\n        raise ValueError(\"CNB parse failed\")\n    return b\n\n\n# --- NBU (National Bank of Ukraine JSON; rate = UAH per 1 unit) ---\ndef parse_nbu_json(text):\n    data = json.loads(text)\n    per_uah = {}\n    day = \"\"\n    for r in data:\n        try:\n            per_uah[r[\"cc\"]] = Decimal(str(r[\"rate\"]))\n            day = r.get(\"exchangedate\", day)\n        except Exception:\n            continue\n    if \"USD\" not in per_uah:\n        return None\n    uah_per_usd = per_uah[\"USD\"]\n    rates = {c: (uah_per_usd / v) for c, v in per_uah.items()}\n    rates[\"UAH\"] = uah_per_usd\n    rates[\"USD\"] = Decimal(1)\n    return _bundle(\"nbu\", rates, day)\n\n\ndef fetch_nbu(timeout=10):\n    b = parse_nbu_json(_http_get(\n        \"https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json\",\n        timeout).decode(\"utf-8\"))\n    if b is None:\n        raise ValueError(\"NBU parse failed\")\n    return b\n\n\n# --- BCB PTAX (Banco Central do Brasil OData; cotacaoVenda = BRL per unit) ---\nBCB_BASE = \"https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata\"\n\n\ndef _bcb_quote(ccy, day, timeout):\n    url = (BCB_BASE + \"/CotacaoMoedaDia(moeda=@moeda,dataCotacao=@dataCotacao)\"\n           \"?@moeda='%s'&@dataCotacao='%s'&$format=json\" % (ccy, day))\n    data = json.loads(_http_get(url, timeout).decode(\"utf-8\"))\n    vals = data.get(\"value\") or []\n    if not vals:\n        return None\n    # cotacaoVenda is BRL per 1 unit of the currency; prefer the closing\n    # bulletin (Fechamento PTAX) when the day has one.\n    closing = [v for v in vals if str(v.get(\"tipoBoletim\", \"\")).startswith(\"Fechamento\")]\n    chosen = closing[-1] if closing else vals[-1]\n    return Decimal(str(chosen[\"cotacaoVenda\"]))\n\n\ndef fetch_bcb(timeout=8):\n    from datetime import timedelta\n    moedas = json.loads(_http_get(BCB_BASE + \"/Moedas?$format=json\", timeout).decode(\"utf-8\"))\n    ccys = [m[\"simbolo\"] for m in moedas.get(\"value\", [])\n            if m[\"simbolo\"] in MINOR_UNITS]\n    today = date.today()\n    base_day = None\n    per_brl = {}\n    for back in range(0, 8):\n        d = (today - timedelta(days=back)).strftime(\"%m-%d-%Y\")\n        v = _bcb_quote(\"USD\", d, timeout)\n        if v is not None:\n            base_day, per_brl[\"USD\"] = d, v\n            break\n    if base_day is None:\n        raise ValueError(\"BCB: no bulletin in last 7 days\")\n    from concurrent.futures import ThreadPoolExecutor\n    others = [c for c in ccys if c != \"USD\"]\n    with ThreadPoolExecutor(max_workers=5) as pool:\n        futs = {pool.submit(_bcb_quote, c, base_day, timeout): c for c in others}\n        for fut, ccy in futs.items():\n            try:\n                v = fut.result()\n            except Exception:\n                v = None\n            if v is not None:\n                per_brl[ccy] = v\n    brl_per_usd = per_brl[\"USD\"]\n    rates = {c: (brl_per_usd / v) for c, v in per_brl.items()}\n    rates[\"BRL\"] = brl_per_usd\n    rates[\"USD\"] = Decimal(1)\n    m, d, y = base_day.split(\"-\")\n    return _bundle(\"bcb\", rates, \"%s-%s-%s\" % (y, m, d))\n\n\n# --- HKMA (Hong Kong Monetary Authority; record fields = HKD per 1 unit) ---\ndef parse_hkma_json(text):\n    data = json.loads(text)\n    recs = data[\"result\"][\"records\"]\n    if not recs:\n        return None\n    rec = max(recs, key=lambda r: r.get(\"end_of_day\", \"\"))\n    per_hkd = {}\n    for k, v in rec.items():\n        code = k.upper()\n        if len(code) == 3 and code in MINOR_UNITS and isinstance(v, (int, float)) and v:\n            per_hkd[code] = Decimal(str(v))\n    if \"USD\" not in per_hkd:\n        return None\n    hkd_per_usd = per_hkd[\"USD\"]\n    rates = {c: (hkd_per_usd / v) for c, v in per_hkd.items()}\n    rates[\"HKD\"] = hkd_per_usd\n    rates[\"USD\"] = Decimal(1)\n    return _bundle(\"hkma\", rates, rec.get(\"end_of_day\", \"\"))\n\n\ndef fetch_hkma(timeout=10):\n    from datetime import timedelta\n    frm = (date.today() - timedelta(days=30)).isoformat()\n    to = date.today().isoformat()\n    url = (\"https://api.hkma.gov.hk/public/market-data-and-statistics/\"\n           \"monthly-statistical-bulletin/er-ir/er-eeri-daily?from=%s&to=%s\" % (frm, to))\n    b = parse_hkma_json(_http_get(url, timeout).decode(\"utf-8\"))\n    if b is None:\n        raise ValueError(\"HKMA parse failed\")\n    return b\n\n\n# --- Norges Bank (SDMX JSON; values = NOK per 1 unit of base currency) ---\ndef parse_norges_json(text):\n    data = json.loads(text)\n    struct = data[\"data\"][\"structure\"][\"dimensions\"][\"series\"]\n    dim_ids = [d[\"id\"] for d in struct]\n    base_idx = dim_ids.index(\"BASE_CUR\")\n    currencies = [v[\"id\"] for v in struct[base_idx][\"values\"]]\n    series = data[\"data\"][\"dataSets\"][0][\"series\"]\n    obs_dims = data[\"data\"][\"structure\"][\"dimensions\"][\"observation\"]\n    periods = [v[\"id\"] for dim in obs_dims if dim[\"id\"] == \"TIME_PERIOD\"\n               for v in dim[\"values\"]]\n    # UNIT_MULT series attribute: '2' means the value is quoted per 100 units\n    attr_defs = data[\"data\"][\"structure\"].get(\"attributes\", {}).get(\"series\", [])\n    mult_pos, mult_vals = None, []\n    for i, a in enumerate(attr_defs):\n        if a.get(\"id\") == \"UNIT_MULT\":\n            mult_pos, mult_vals = i, [v[\"id\"] for v in a[\"values\"]]\n    per_nok = {}\n    usd_period = \"\"\n    for key, s in series.items():\n        idx = int(key.split(\":\")[base_idx])\n        ccy = currencies[idx]\n        obs = s.get(\"observations\", {})\n        if not obs:\n            continue\n        last_key = sorted(obs, key=lambda x: int(x))[-1]\n        value = Decimal(str(obs[last_key][0]))\n        if mult_pos is not None:\n            attrs = s.get(\"attributes\") or []\n            if mult_pos < len(attrs) and attrs[mult_pos] is not None:\n                mult = int(mult_vals[attrs[mult_pos]])\n                if mult:\n                    value = value / (Decimal(10) ** mult)\n        per_nok[ccy] = value\n        if ccy == \"USD\" and periods:\n            usd_period = periods[int(last_key)] if int(last_key) < len(periods) else \"\"\n    if \"USD\" not in per_nok:\n        return None\n    nok_per_usd = per_nok[\"USD\"]\n    rates = {c: (nok_per_usd / v) for c, v in per_nok.items()\n             if c in MINOR_UNITS or c == \"NOK\"}\n    rates[\"NOK\"] = nok_per_usd\n    rates[\"USD\"] = Decimal(1)\n    return _bundle(\"norges\", rates, usd_period)\n\n\ndef fetch_norges(timeout=12):\n    url = (\"https://data.norges-bank.no/api/data/EXR/B..NOK.SP\"\n           \"?format=sdmx-json&lastNObservations=1\")\n    b = parse_norges_json(_http_get(url, timeout).decode(\"utf-8\"))\n    if b is None:\n        raise ValueError(\"Norges parse failed\")\n    return b\n\n\nOFFICIAL_FETCHERS = [\n    (\"fred\", fetch_fred), (\"rba\", fetch_rba), (\"nbp\", fetch_nbp),\n    (\"cnb\", fetch_cnb), (\"nbu\", fetch_nbu), (\"norges\", fetch_norges),\n    (\"hkma\", fetch_hkma), (\"bcb\", fetch_bcb),\n]\n\n\ndef fetch_official_layer(timeout=8):\n    \"\"\"Try every official source (concurrently); returns (bundles, errors)\n    with bundles kept in OFFICIAL_FETCHERS priority order.\"\"\"\n    from concurrent.futures import ThreadPoolExecutor\n    results, errors = {}, {}\n    with ThreadPoolExecutor(max_workers=len(OFFICIAL_FETCHERS)) as pool:\n        futs = {pool.submit(fn, timeout): name for name, fn in OFFICIAL_FETCHERS}\n        for fut, name in futs.items():\n            try:\n                results[name] = fut.result()\n            except Exception as exc:  # a dead source must never break the app\n                errors[name] = str(exc)[:120]\n    bundles = [results[name] for name, _ in OFFICIAL_FETCHERS if name in results]\n    return bundles, errors\n\n\ndef merge_rate_bundles(bundles):\n    \"\"\"Merge bundles in priority order: first writer wins per currency.\"\"\"\n    rates, prov, dates = {}, {}, {}\n    for b in bundles:\n        for ccy, v in b.get(\"rates\", {}).items():\n            if ccy not in rates:\n                rates[ccy] = v\n                prov[ccy] = tuple(b.get(\"prov\", {}).get(ccy, (b.get(\"source\", \"?\"), 3)))\n                dates[ccy] = b.get(\"dates\", {}).get(ccy, b.get(\"date\", \"\"))\n    return {\"source\": \"merged\", \"base\": \"USD\", \"date\": \"\",\n            \"rates\": rates, \"prov\": prov, \"dates\": dates,\n            \"fetched_at\": datetime.now().isoformat(timespec=\"seconds\")}\n\n\ndef tier_coverage(bundle):\n    cov = {1: 0, 2: 0, 3: 0}\n    for ccy, (_src, tier) in bundle.get(\"prov\", {}).items():\n        if tier in cov:\n            cov[tier] += 1\n    return cov\n\n\ndef fetch_all_rates(timeout=8):\n    \"\"\"Official layer first, then Frankfurter (ECB), then er-api fill.\"\"\"\n    bundles, errors = fetch_official_layer(timeout=timeout)\n    try:\n        fb = fetch_frankfurter(timeout=timeout)\n        fb[\"prov\"] = {c: (\"frankfurter\", 2) for c in fb[\"rates\"]}\n        fb[\"dates\"] = {c: fb.get(\"date\", \"\") for c in fb[\"rates\"]}\n        bundles.append(fb)\n    except Exception as exc:\n        errors[\"frankfurter\"] = str(exc)[:120]\n    try:\n        eb = fetch_erapi(timeout=timeout)\n        eb[\"prov\"] = {c: (\"erapi\", 3) for c in eb[\"rates\"]}\n        eb[\"dates\"] = {c: eb.get(\"date\", \"\") for c in eb[\"rates\"]}\n        bundles.append(eb)\n    except Exception as exc:\n        errors[\"erapi\"] = str(exc)[:120]\n    return merge_rate_bundles(bundles), errors\n\n\ndef app_data_dir():\n    if sys.platform == \"darwin\":\n        # macOS standard per-user application data location.\n        d = os.path.join(os.path.expanduser(\"~\"),\n                         \"Library\", \"Application Support\", \"FormatPassport\")\n    else:\n        base = os.environ.get(\"APPDATA\")\n        if base:\n            d = os.path.join(base, \"FormatPassport\")\n        else:\n            d = os.path.join(os.path.expanduser(\"~\"), \".formatpassport\")\n    os.makedirs(d, exist_ok=True)\n    return d\n\n\ndef _json_default(o):\n    if isinstance(o, Decimal):\n        return str(o)\n    raise TypeError\n\n\ndef save_fx_cache(cache, directory=None):\n    directory = directory or app_data_dir()\n    path = os.path.join(directory, \"fx_cache.json\")\n    with open(path, \"w\", encoding=\"utf-8\") as fh:\n        json.dump(cache, fh, ensure_ascii=False, default=_json_default)\n    return path\n\n\ndef load_fx_cache(directory=None):\n    directory = directory or app_data_dir()\n    path = os.path.join(directory, \"fx_cache.json\")\n    if not os.path.exists(path):\n        return {}\n    try:\n        with open(path, encoding=\"utf-8\") as fh:\n            cache = json.load(fh)\n        for key, bundle in list(cache.items()):\n            if isinstance(bundle, dict) and \"rates\" in bundle:\n                bundle[\"rates\"] = {k: Decimal(v) for k, v in bundle[\"rates\"].items()}\n                if \"prov\" in bundle:\n                    bundle[\"prov\"] = {k: (v[0], int(v[1])) for k, v in bundle[\"prov\"].items()}\n        if \"mufg\" in cache:\n            cache[\"mufg\"][\"pairs\"] = {\n                k: (Decimal(v[0]), Decimal(v[1])) for k, v in cache[\"mufg\"][\"pairs\"].items()}\n        return cache\n    except Exception:\n        return {}\n\n\ndef cross_rate(rates, from_ccy, to_ccy):\n    \"\"\"Units of to_ccy per 1 unit of from_ccy, from a USD-based table.\"\"\"\n    if from_ccy == to_ccy:\n        return Decimal(1)\n    rf = rates.get(from_ccy)\n    rt = rates.get(to_ccy)\n    if rf is None or rt is None or rf == 0:\n        return None\n    return rt / rf\n\n\ndef fx_convert(amount, from_ccy, to_ccy, mode, ctx):\n    \"\"\"Convert Decimal amount. Returns (converted, rate_used_str, label) or\n    (None, reason, label) when impossible in the chosen mode.\n\n    ctx keys by mode:\n      ref:    {'bundle': rate bundle dict}\n      bank:   {'mufg': parsed mufg dict}\n      manual: {'bank_name','date_memo','tts','ttb','rate'} (Decimals/str)\n    \"\"\"\n    to_minor = minor_unit(to_ccy)\n    q = Decimal(1).scaleb(-to_minor)\n    if from_ccy == to_ccy:\n        return amount.quantize(q, rounding=ROUND_HALF_UP), \"1\", \"\"\n    if mode == \"ref\":\n        bundle = ctx.get(\"bundle\") or {}\n        rate = cross_rate(bundle.get(\"rates\", {}), from_ccy, to_ccy)\n        if rate is None:\n            return None, \"no rate for %s->%s\" % (from_ccy, to_ccy), \"\"\n        out = (amount * rate).quantize(q, rounding=ROUND_HALF_UP)\n        prov = bundle.get(\"prov\") or {}\n        if prov:\n            tiers, names, dates = [], [], []\n            for ccy in (from_ccy, to_ccy):\n                if ccy == \"USD\":\n                    continue\n                src, tier = prov.get(ccy, (\"erapi\", 3))\n                tiers.append(tier)\n                nm = SOURCE_INFO.get(src, (src, tier))[0]\n                if nm
