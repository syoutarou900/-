 not in names:\n                    names.append(nm)\n                dt = bundle.get(\"dates\", {}).get(ccy, \"\")\n                if dt and dt not in dates:\n                    dates.append(dt)\n            worst = max(tiers) if tiers else 3\n            if worst <= 2:\n                label = LBL_OFFICIAL.format(names=\"・\".join(names),\n                                            dates=\"／\".join(dates))\n            else:\n                label = LBL_ERAPI + \"／\" + LBL_ERAPI_ATTR\n        elif bundle.get(\"source\") == \"frankfurter\":\n            label = LBL_FRANK.format(date=bundle.get(\"date\", \"\"))\n        else:\n            label = LBL_ERAPI + \"／\" + LBL_ERAPI_ATTR\n        return out, str(rate.normalize()), label\n    if mode in (\"bank\", \"manual\"):\n        if mode == \"bank\":\n            mufg = ctx.get(\"mufg\") or {}\n            pairs = mufg.get(\"pairs\", {})\n            label = LBL_MUFG.format(dt=mufg.get(\"date\", \"\"))\n            src_name = \"MUFG\"\n        else:\n            pairs = {}\n            tts, ttb = ctx.get(\"tts\"), ctx.get(\"ttb\")\n            if tts and ttb:\n                other = to_ccy if from_ccy == \"JPY\" else from_ccy\n                pairs = {other: (Decimal(str(tts)), Decimal(str(ttb)))}\n            label = LBL_MANUAL.format(bank=ctx.get(\"bank_name\", \"\"),\n                                       date=(\"・\" + ctx[\"date_memo\"]) if ctx.get(\"date_memo\") else \"\")\n            src_name = ctx.get(\"bank_name\", \"\")\n        single = ctx.get(\"rate\") if mode == \"manual\" else None\n        if single:\n            rate = Decimal(str(single))\n            out = (amount * rate).quantize(q, rounding=ROUND_HALF_UP)\n            return out, str(rate.normalize()), label\n        if from_ccy == \"JPY\" and to_ccy in pairs:\n            tts, _ = pairs[to_ccy]\n            out = (amount / tts).quantize(q, rounding=ROUND_HALF_UP)\n            return out, \"1 %s = %s JPY (TTS)\" % (to_ccy, tts), label\n        if to_ccy == \"JPY\" and from_ccy in pairs:\n            _, ttb = pairs[from_ccy]\n            out = (amount * ttb).quantize(q, rounding=ROUND_HALF_UP)\n            return out, \"1 %s = %s JPY (TTB)\" % (from_ccy, ttb), label\n        return None, \"bank rate not available for %s->%s (%s)\" % (from_ccy, to_ccy, src_name), label\n    return None, \"unknown mode\", \"\"\n\n\n# --------------------------------------------------------------------------\n# Conversion engine\n# --------------------------------------------------------------------------\nclass ReviewItem:\n    def __init__(self, row, col, header, original, kind, candidates, pattern_key, reason=\"\"):\n        self.row, self.col, self.header = row, col, header\n        self.original, self.kind = original, kind\n        self.candidates = candidates      # [{key,label,output}]\n        self.pattern_key = pattern_key\n        self.reason = reason\n\n    def to_dict(self):\n        return {\"row\": self.row, \"col\": self.col, \"header\": self.header,\n                \"original\": self.original, \"kind\": self.kind,\n                \"candidates\": self.candidates, \"pattern_key\": self.pattern_key,\n                \"reason\": self.reason}\n\n\nclass ConvertResult:\n    def __init__(self):\n        self.rows = []\n        self.changes = []   # dicts: row,col,before,after,kind,reason\n        self.reviews = []   # ReviewItem\n        self.report = {}\n\n\ndef _shape(s):\n    return re.sub(r\"\\d\", \"9\", s)\n\n\ndef convert_table(table, sender_code, receiver_code, opts=None, resolutions=None, fx=None):\n    \"\"\"opts: {'fix_fullwidth_text': bool}\n    resolutions: {pattern_key or 'r{row}c{col}': output_text}\n    fx: None or {'mode':..., 'ctx': {...}} (enabled only when not None)\n    \"\"\"\n    opts = opts or {}\n    resolutions = resolutions or {}\n    sender = BY_CODE[sender_code]\n    receiver = BY_CODE[receiver_code]\n    result = ConvertResult()\n    out_rows = [list(r) for r in table.rows]\n    counts = {\"date\": 0, \"wareki\": 0, \"number\": 0, \"fx\": 0, \"fullwidth\": 0,\n              \"preserved_code\": 0, \"unresolved\": 0}\n    fx_label_used = \"\"\n    fx_rate_used = \"\"\n\n    # Pass 1: date order proof per column\n    col_types = []\n    date_orders = {}\n    for ci, header in enumerate(table.headers):\n        values = [r[ci] for r in table.rows]\n        ctype = classify_column(header, values, sender)\n        col_types.append(ctype)\n        if ctype == \"date\":\n            order, _why = analyze_date_column(\n                [normalize_fullwidth(str(v).strip()) for v in values], sender[\"date_order\"])\n            date_orders[ci] = order\n\n    # Pass 1b: separator-role proof per amount column, from values whose\n    # shape is unambiguous (multi-group thousands, or a decimal tail that\n    # is not exactly 3 digits).\n    def _setproof(proof, sep, role):\n        if sep in proof and proof[sep] != role:\n            proof[sep] = \"conflict\"\n        else:\n            proof[sep] = role\n\n    num_proofs = {}\n    for ci, header in enumerate(table.headers):\n        if col_types[ci] != \"amount\":\n            continue\n        proof = {}\n        for row in table.rows:\n            v = normalize_fullwidth(str(row[ci]).strip())\n            v, _c = _strip_currency(v)\n            for ch in _SPACE_CHARS + \"'\":\n                v = v.replace(ch, \"\")\n            m = re.fullmatch(r\"\\d{1,3}([.,])\\d{3}(?:[.,]\\d{3})+(?:[.,]\\d{1,4})?\", v)\n            if m:\n                _setproof(proof, m.group(1), \"thousands\")\n            if \".\" in v and \",\" in v:\n                last = \".\" if v.rfind(\".\") > v.rfind(\",\") else \",\"\n                other = \",\" if last == \".\" else \".\"\n                _setproof(proof, last, \"decimal\")\n                _setproof(proof, other, \"thousands\")\n            m = re.fullmatch(r\"\\d+([.,])(\\d{1,2}|\\d{4,})\", v)\n            if m:\n                _setproof(proof, m.group(1), \"decimal\")\n        num_proofs[ci] = proof\n\n    for ci, header in enumerate(table.headers):\n        ctype = col_types[ci]\n        for ri, row in enumerate(table.rows):\n            raw = row[ci]\n            s = str(raw)\n            st = s.strip()\n            if not st:\n                continue\n            cell_key = \"r%dc%d\" % (ri, ci)\n            nrm = normalize_fullwidth(st)\n\n            if ctype == \"code\":\n                _v, _i = parse_number(st, sender[\"decimal\"], sender[\"thousands\"])\n                if _v is not None:\n                    counts[\"preserved_code\"] += 1  # kept verbatim on purpose\n                continue\n\n            if ctype == \"date\":\n                # wareki handling\n                if is_wareki(nrm):\n                    d = wareki_to_date(nrm)\n                    if d is None:\n                        continue\n                    if receiver_code == \"JP\":\n                        out = date_to_wareki(d, \"full\")\n                    else:\n                        out = format_date(d, receiver)\n                    if out != st:\n                        out_rows[ri][ci] = out\n                        result.changes.append({\n                            \"row\": ri, \"col\": ci, \"before\": st, \"after\": out,\n                            \"kind\": \"wareki\", \"reason\": \"wareki->date\"})\n                        counts[\"wareki\"] += 1\n                    continue\n                # Gregorian -> wareki when receiver is JP and sender is not\n                d_norm = parse_date_with_order(nrm, sender[\"date_order\"])\n                _info = classify_numeric_date(nrm)\n                had_year = not (_info and _info[\"year_pos\"] == \"none\")\n                order = date_orders.get(ci)\n                if order is None:\n                    # undecidable column: check cell-level ambiguity\n                    d_dmy = parse_date_with_order(nrm, \"DMY\")\n                    d_mdy = parse_date_with_order(nrm, \"MDY\")\n                    if d_dmy and d_mdy and d_dmy != d_mdy:\n                        pk = \"date:c%d\" % ci\n                        cands = []\n                        for lbl, dd in ((\"DMY\", d_dmy), (\"MDY\", d_mdy)):\n                            cands.append({\"key\": lbl, \"label\": \"%s → %s\" % (lbl, dd.isoformat()),\n                                          \"output\": _date_output(dd, receiver, receiver_code, had_year)})\n                        chosen = resolutions.get(pk) or resolutions.get(cell_key)\n                        if chosen:\n                            out_rows[ri][ci] = chosen\n                            counts[\"date\"] += 1\n                        else:\n                            result.reviews.append(ReviewItem(\n                                ri, ci, header, st, \"date\", cands, pk,\n                                \"ambiguous date (both readings valid)\"))\n                            counts[\"unresolved\"] += 1\n                        continue\n                    d_norm = d_dmy or d_mdy\n                else:\n                    d_norm = parse_date_with_order(nrm, order)\n                if d_norm is None:\n                    continue\n                out = _date_output(d_norm, receiver, receiver_code, had_year)\n                if out != st:\n                    out_rows[ri][ci] = out\n                    reason = \"date order\"\n                    result.changes.append({\n                        \"row\": ri, \"col\": ci, \"before\": st, \"after\": out,\n                        \"kind\": \"date\", \"reason\": reason})\n                    counts[\"date\"] += 1\n                continue\n\n            if ctype == \"amount\":\n                # leading-zero values are codes, never numbers\n                squashed = nrm.replace(\",\", \"\").replace(\" \", \"\").replace(\".\", \"\")\n                if re.fullmatch(r\"0\\d+\", squashed) and \".\" not in nrm and \",\" not in nrm.replace(sender[\"thousands\"], \"\"):\n                    counts[\"preserved_code\"] += 1\n                    continue\n                v, info = parse_number(st, sender[\"decimal\"], sender[\"thousands\"],\n                                       proof=num_proofs.get(ci))\n                if v is None:\n                    continue\n                pk = \"num:c%d:%s\" % (ci, _shape(st))\n                if info.get(\"ambiguous\"):\n                    alt = info.get(\"alt\")\n                    cands = [\n                        {\"key\": \"main\", \"label\": \"%s (%s)\" % (\n                            format_number(v, receiver), _num_meaning(v, sender)),\n                         \"output\": None},\n                        {\"key\": \"alt\", \"label\": \"%s (%s)\" % (\n                            format_number(alt, receiver), _num_meaning(alt, sender)),\n                         \"output\": None},\n                    ]\n                    chosen = resolutions.get(pk) or resolutions.get(cell_key)\n                    chosen_key = resolutions.get(pk + \":key\") or resolutions.get(cell_key + \":key\")\n                    if chosen is not None:\n                        out_rows[ri][ci] = chosen\n                        counts[\"number\"] += 1\n                    else:\n                        for c, vv in zip(cands, (v, alt)):\n                            c[\"output\"] = _amount_output(vv, sender, receiver, fx, header)[0]\n                        result.reviews.append(ReviewItem(\n                            ri, ci, header, st, \"number\", cands, pk,\n                            \"ambiguous number (decimal or thousands separator)\"))\n                        counts[\"unresolved\"] += 1\n                    continue\n                out, fxinfo = _amount_output(v, sender, receiver, fx, header)\n                if fxinfo:\n                    fx_rate_used, fx_label_used = fxinfo\n                if out != st:\n                    out_rows[ri][ci] = out\n                    kind = \"fx\" if fx else \"number\"\n                    result.changes.append({\n                        \"row\": ri, \"col\": ci, \"before\": st, \"after\": out,\n                        \"kind\": kind, \"reason\": \"number format\" if not fx else \"fx convert\"})\n                    counts[\"fx\" if fx else \"number\"] += 1\n                elif nrm != st:\n                    counts[\"fullwidth\"] += 1\n                continue\n\n            # text columns: only optional fullwidth fix\n            if opts.get(\"fix_fullwidth_text\") and nrm != st:\n                out_rows[ri][ci] = nrm\n                result.changes.append({\n                    \"row\": ri, \"col\": ci, \"before\": st, \"after\": nrm,\n                    \"kind\": \"fullwidth\", \"reason\": \"fullwidth->halfwidth\"})\n                counts[\"fullwidth\"] += 1\n\n    result.rows = out_rows\n    result.report = {\n        \"counts\": counts,\n        \"changes\": len(result.changes),\n        \"unresolved\": counts[\"unresolved\"],\n        \"sender\": sender_code, \"receiver\": receiver_code,\n        \"sender_currency\": sender[\"currency\"], \"receiver_currency\": receiver[\"currency\"],\n        \"fx_label\": fx_label_used, \"fx_rate\": fx_rate_used,\n        \"col_types\": col_types,\n    }\n    return result\n\n\ndef _date_output(d, receiver, receiver_code, had_year=True):\n    if not had_year:\n        return format_date_short(d, receiver)\n    return format_date(d, receiver)\n\n\ndef _num_meaning(v, sender):\n    return \"value %s\" % format(v.normalize(), \"f\")\n\n\ndef _amount_output(v, sender, receiver, fx, header):\n    \"\"\"Returns (text, fxinfo_or_None). fxinfo = (rate_str, label).\"\"\"\n    if fx:\n        conv, rate_str, label = fx_convert(\n            v, sender[\"currency\"], receiver[\"currency\"], fx[\"mode\"], fx[\"ctx\"])\n        if conv is not None:\n            minor = minor_unit(receiver[\"currency\"])\n            return format_number(conv, receiver, minor=minor, money=True), (rate_str, label) \n \"report_saved\": \"Laporan tersimpan: {path}\",\n \"error_title\": \"Kesalahan\",\n \"error_load\": \"Tidak dapat membuka berkas: {msg}\",\n \"error_fx_pair\": \"Pasangan ini tidak dapat memakai mode bank (hanya JPY melawan 9 mata uang MUFG). Gunakan perkiraan atau masukan manual.\",\n \"choose\": \"Yang mana?\",\n \"save_as\": \"Simpan sebagai\",\n \"rate_info\": \"Kurs yang digunakan\",\n \"col_type_date\": \"Tanggal\",\n \"col_type_amount\": \"Jumlah\",\n \"col_type_code\": \"Kode\",\n \"col_type_text\": \"Teks\"\n}\n\nS['ko'] = {\n \"app_title\": \"FormatPassport\",\n \"app_subtitle\": \"국경이 달라도 깨지지 않는 형식 — 날짜·숫자·통화·구분 기호를 보내는 나라에서 받는 나라로\",\n \"lang_label\": \"언어\",\n \"drop_hint\": \"Excel / CSV 파일을 여기에 놓으세요\",\n \"open_file\": \"파일 열기\",\n \"sender\": \"보내는 나라\",\n \"receiver\": \"받는 나라\",\n \"swap\": \"⇄ 바꾸기\",\n \"preview_btn\": \"변환 미리보기 만들기\",\n \"before\": \"변환 전\",\n \"after\": \"변환 후\",\n \"review_title\": \"확인 필요 목록 (앱이 자동 판단할 수 없는 항목)\",\n \"review_empty\": \"확인할 항목이 없습니다\",\n \"review_count\": \"미확인이 {n}건 남았습니다 (원본 그대로 출력됩니다)\",\n \"apply_cell\": \"이 셀에 적용\",\n \"apply_all\": \"같은 패턴 전체에 적용\",\n \"export_csv\": \"CSV로 저장\",\n \"export_xlsx\": \"Excel로 저장\",\n \"save_report\": \"보고서 저장\",\n \"report_title\": \"변환 보고서\",\n \"fx_title\": \"환율 변환 (금액 열)\",\n \"fx_enable\": \"환율 변환하기\",\n \"fx_mode_ref\": \"공식·기준 환율로 시산\",\n \"fx_mode_bank\": \"은행 적용 환율 (엔화 쌍, MUFG 자동 취득)\",\n \"fx_mode_manual\": \"은행 환율 직접 입력\",\n \"fx_update\": \"환율 업데이트\",\n \"fx_fetching\": \"환율 가져오는 중…\",\n \"fx_no_data\": \"환율 미취득 («환율 업데이트»를 누르세요)\",\n \"fx_cached\": \"이전에 취득한 환율 사용 중 ({date})\",\n \"manual_bank\": \"은행명\",\n \"manual_tts\": \"TTS (엔→외화)\",\n \"manual_ttb\": \"TTB (외화→엔)\",\n \"manual_rate\": \"단일 환율 (1단위당)\",\n \"manual_date\": \"날짜 메모\",\n \"encoding\": \"출력 인코딩\",\n \"fix_fw\": \"문자열의 전각 영숫자도 반각으로\",\n \"status_ready\": \"파일을 열어 주세요\",\n \"status_loaded\": \"{name} 불러옴 ({rows}행)\",\n \"status_done\": \"미리보기 완료. 변경 {changes}건 / 확인 필요 {reviews}건\",\n \"exported\": \"저장됨: {path}\",\n \"report_saved\": \"보고서 저장됨: {path}\",\n \"error_title\": \"오류\",\n \"error_load\": \"파일을 열 수 없습니다: {msg}\",\n \"error_fx_pair\": \"이 통화 쌍은 은행 환율 모드를 사용할 수 없습니다 (엔화와 MUFG 대상 9개 통화만). 시산 모드나 직접 입력을 사용하세요.\",\n \"choose\": \"어느 쪽입니까?\",\n \"save_as\": \"다른 이름으로 저장\",\n \"rate_info\": \"사용 환율\",\n \"col_type_date\": \"날짜\",\n \"col_type_amount\": \"금액\",\n \"col_type_code\": \"코드\",\n \"col_type_text\": \"텍스트\"\n}\n\n\ndef tr(lang, key, **kw):\n    text = S.get(lang, S[\"en\"]).get(key) or S[\"en\"].get(key) or key\n    if kw:\n        try:\n            return text.format(**kw)\n        except (KeyError, IndexError):\n            return text\n    return text\n"}, {"p": "MakeApp-Mac.command", "s": 3183, "l": "bash", "c": "#!/bin/bash\n# FormatPassport - build a macOS .app with PyInstaller\n# Double-click this file in Finder on a Mac. The app is built into\n#   dist/FormatPassport.app\n# It first tries a universal2 build (runs on both Apple silicon and\n# Intel Macs). If that fails, it retries for this Mac's own CPU only\n# and tells you which kind was produced.\n#\n# Note: the built app is unsigned. To open it the first time,\n# right-click (Control-click) the app and choose \"Open\".\nset -u\ncd \"$(dirname \"$0\")\"\n\necho \"===============================================\"\necho \" FormatPassport - build macOS app\"\necho \"===============================================\"\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Please install Python 3 first, then run this file again:\"\n  echo \"  https://www.python.org/downloads/macos/\"\n  echo \"  (Download the universal2 macOS installer.)\"\n  echo \"\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found next to this file.\"\n  echo \"Please extract the whole ZIP first, then try again.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -x .venv-build/bin/python ]; then\n  echo \"Creating the build environment (.venv-build)...\"\n  python3 -m venv .venv-build || {\n    echo \"Failed to create the Python environment.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\nPY=.venv-build/bin/python\n\necho \"Installing / updating build libraries...\"\n\"$PY\" -m pip install --upgrade pip >/dev/null 2>&1\n\"$PY\" -m pip install PySide6 openpyxl pyinstaller || {\n  echo \"Failed to install libraries. Check your network connection.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\n}\n\nARCH=\"$(uname -m)\"\necho \"This Mac's CPU: $ARCH\"\n\nbuild_app() {\n  # $1 = extra target-arch args (may be empty)\n  \"$PY\" -m PyInstaller --noconfirm --windowed --name FormatPassport --icon assets/icon.icns \\\n    --exclude-module tkinter $1 app.py\n}\n\necho \"\"\necho \"Trying a universal2 build (Apple silicon + Intel)...\"\nif build_app \"--target-arch universal2\" && [ -d dist/FormatPassport.app ]; then\n  echo \"\"\n  echo \"===============================================\"\n  echo \" Done: dist/FormatPassport.app\"\n  echo \" Build type: universal2 (Apple silicon + Intel)\"\n  echo \"===============================================\"\nelse\n  echo \"\"\n  echo \"universal2 build failed. Retrying for this Mac only ($ARCH)...\"\n  rm -rf build dist\n  if build_app \"\" && [ -d dist/FormatPassport.app ]; then\n    echo \"\"\n    echo \"===============================================\"\n    echo \" Done: dist/FormatPassport.app\"\n    echo \" Build type: $ARCH only (this Mac's CPU)\"\n    echo \"===============================================\"\n  else\n    echo \"\"\n    echo \"Build failed. See the messages above for details.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"First launch of the built app: it is unsigned, so macOS may\"\necho \"block a plain double-click. Right-click (Control-click)\"\necho \"FormatPassport.app and choose \\\"Open\\\" once.\"\necho \"\"\necho \"Press Enter to close this window.\"\nread -r _\n"}, {"p": "README-SOURCE.txt", "s": 921, "l": "plaintext", "c": "FormatPassport - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of FormatPassport, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-FormatPassport.bat (or: python app.py)\n- Mac: Start-FormatPassport.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 5309, "l": "plaintext", "c": "フォーマットパスポート（FormatPassport）\n========================================\n\n海外から届いた Excel / CSV が、日本で開くと壊れる——\n日付がずれる、金額の桁が変わる、列がずれる。\n逆に、日本のファイル（全角数字・和暦）が海外のシステムに入らない。\nこのアプリは、送り手の国と受け手の国を選ぶだけで、\n形式の違いを変換候補として用意し、変換前／変換後を並べて見せます。\n\n\n2通りに読める値（例：03/04 は3月4日か4月3日か）は、\nアプリが勝手に決めません。「要確認リスト」に入り、\n人間が選ぶまで元のまま出力され、レポートに件数が残ります。\n\n\n- CSV / Excel(.xlsx) をドラッグ＆ドロップ（元ファイルは変更しません）\n- 190か国の国別形式データ（通貨・日付順・小数点・区切り文字）を内蔵\n- 日付：国別順序で解釈し受け手の形式へ。列内の明白な値（25/03など）が\n列の形式を証明できれば、それに従います\n- 金額・数値：小数点カンマ⇔ピリオド、桁区切り（./,/空白/'）、全角→半角\n- 和暦⇄西暦（令和・平成・昭和・大正・明治、元年対応、R8.11.13 形式も可）\n- コード列（007 など）は文字列として保護し、数値変換しません\n- CSV：区切り文字の検出（カンマ/セミコロン/タブ/パイプ）、\n文字コード検出（UTF-8 BOM有無 / Shift_JIS / Latin-1）、\n出力は受け手の区切り文字＋文字コード選択（UTF-8 BOM 既定）\n- 為替換算（金額列のみ、既定オフ）：\n・試算モード：中央銀行などの公式レートを優先する階層方式\nTier1＝各国中央銀行の公式発表（米FRB/H.10(FRED)、豪RBA、\nポーランドNBP、チェコCNB、ウクライナNBU、ノルウェー中銀、\n香港HKMA、ブラジルBCB/PTAX）\nTier2＝ECB基準レート（Frankfurter経由）\nTier3＝ExchangeRate-API 集計値（公式が無い通貨のみの最終手段）\n使用した出典と「最も低いティア」がラベルに必ず表示されます。\n試算は実際の送金・決済額ではありません。\n・銀行レートモード（円ペア）：三菱UFJ銀行の公示TTS/TTBを自動取得\n（対象9通貨）。外貨→円はTTB、円→外貨はTTS。手数料は含みません。\n・手入力モード：任意の銀行のTTS/TTBまたは単一レートを入力可能\n- レートは起動時＋「レート更新」で取得し、%APPDATA%\\FormatPassport\n（Macでは ~/Library/Application Support/FormatPassport）に\n日付・出典つきでキャッシュ。オフライン時はキャッシュ＋古さ表示。\n- UIは13言語（日本語・English・Español・简体中文・Français・Deutsch・\nPortuguês・Русский・Italiano・Türkçe・العربية(RTL)・Bahasa Indonesia・한국어）\n\n\n【Windows】\n1. Start-FormatPassport.bat をダブルクリック（ソース版）\nまたは FormatPassport.exe（EXE版フォルダ内）\n2. 送り手の国・受け手の国を選ぶ\n3. ファイルをドロップ → 変換プレビューを確認\n4. 要確認リストがあればダブルクリックして候補を選ぶ\n5. 「CSVで保存」または「Excelで保存」で新しいファイルに出力\n\n【Mac（macOS 11 以降）】\nソース版ZIPには Mac 用スクリプトが同梱されています。\n・すぐ試す場合：Start-FormatPassport.command をダブルクリック。\n  初回は自動で Python 環境（.venv）を作り、必要なライブラリを\n  入れてから起動します。Python 3 が無い Mac では、入手方法を\n  表示して終了します（https://www.python.org/downloads/macos/）。\n・アプリとして使う場合：MakeApp-Mac.command をダブルクリック\n  すると、dist フォルダに FormatPassport.app が生成されます。\n  まず両対応の universal2（Apple Silicon ＋ Intel）で生成を\n  試み、失敗した場合はその Mac のチップ専用で再試行します。\n  どちらで作れたかは最後に画面表示されます。\n・生成された .app は未署名のため、初回はダブルクリックでは\n  開けないことがあります。右クリック（Control＋クリック）→\n  「開く」で起動してください。\n・設定と為替キャッシュは ~/Library/Application Support/\n  FormatPassport に保存されます。\n・Mac 実機での動作は未検証です（Mac が無い開発環境のため、\n  コードの OS 分岐とスクリプトの動作条件のみ確認しています）。\n\n\n- 実際のWindows環境での動作は未検証です（開発環境でのテスト＋\nWine互換レイヤーでの起動確認のみ）。不具合報告は出典・レート日付が\n表示されるレポートと一緒にいただけると助かります。\n- 為替の試算モードは基準レートによる概算です。実際の送金額・決済額は\n銀行の適用レート（TTS/TTB）と手数料で決まります。\n-.xls（旧形式）・マクロ付きブックのマクロは扱いません。\n\nPython / PySide6。テストは tests/ にあります（ネット不使用）。\n"}, {"p": "requirements.txt", "s": 17, "l": "plaintext", "c": "PySide6\nopenpyxl\n"}, {"p": "Start-FormatPassport.bat", "s": 316, "l": "dos", "c": "@echo off\r\nsetlocal\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo app.py not found. Extract the ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\npython -c \"import PySide6, openpyxl\" 2>nul\r\nif errorlevel 1 (\r\n  echo Installing libraries (first launch only)...\r\n  python -m pip install PySide6 openpyxl\r\n)\r\nstart \"\" pythonw app.py\r\n"}, {"p": "Start-FormatPassport.command", "s": 1846, "l": "bash", "c": "#!/bin/bash\n# FormatPassport - macOS launcher (source version)\n# Double-click this file in Finder to run FormatPassport.\n# First launch creates a private Python environment (.venv) next to this\n# file and installs the required libraries; later launches are fast.\nset -u\ncd \"$(dirname \"$0\")\"\n\necho \"===============================================\"\necho \" FormatPassport (macOS launcher)\"\necho \"===============================================\"\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Please install Python 3 first, then double-click this file again:\"\n  echo \"  1. Open https://www.python.org/downloads/macos/\"\n  echo \"  2. Download and run the macOS installer (universal2).\"\n  echo \"     (Or, if a dialog offers to install the Command Line\"\n  echo \"      Developer Tools, you may install those instead.)\"\n  echo \"\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found next to this file.\"\n  echo \"Please extract the whole ZIP first, then try again.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -x .venv/bin/python ]; then\n  echo \"First launch: creating the Python environment (.venv)...\"\n  python3 -m venv .venv || {\n    echo \"Failed to create the Python environment.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\nPY=.venv/bin/python\n\nif ! \"$PY\" -c \"import PySide6, openpyxl\" >/dev/null 2>&1; then\n  echo \"Installing libraries (first launch only)...\"\n  \"$PY\" -m pip install --upgrade pip >/dev/null 2>&1\n  \"$PY\" -m pip install PySide6 openpyxl || {\n    echo \"Failed to install libraries. Check your network connection.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\necho \"Starting FormatPassport...\"\nexec \"$PY\" app.py\n"}, {"p": "tests/fixture_frankfurter.json", "s": 434, "l": "json", "c": "{\"amount\":1.0,\"base\":\"USD\",\"date\":\"2026-11-12\",\"rates\":{\"AUD\":1.4661,\"BRL\":5.6169,\"CAD\":1.4249,\"CHF\":0.83314,\"CNY\":6.6683,\"CZK\":22.001,\"DKK\":6.7461,\"EUR\":0.90245,\"GBP\":0.7544,\"HKD\":7.8448,\"HUF\":329.37,\"IDR\":18253,\"ILS\":3.2032,\"INR\":94.04,\"ISK\":123.27,\"JPY\":159.7,\"KRW\":1334.1,\"MXN\":18.6906,\"MYR\":4.0785,\"NOK\":9.5325,\"NZD\":1.7997,\"PHP\":63.727,\"PLN\":3.9787,\"RON\":4.8256,\"SEK\":9.9836,\"SGD\":1.2859,\"THB\":33.815,\"TRY\":50.258,\"ZAR\":16.715}}"}, {"p": "tests/fixture_mufg.js", "s": 470, "l": "javascript", "c": "var kinri_deta = {\r\n \"G001DATE\":\"2026年11月13日 21時40分\",\r\n \"G001TTSZ\":\"160.26\",\r\n \"G001TTBZ\":\"159.76\",\r\n \"G020TTSZ\":\"177.11\",\r\n \"G020TTBZ\":\"176.61\",\r\n \"G002TTSZ\":\"212.19\",\r\n \"G002TTBZ\":\"211.19\",\r\n \"G005TTSZ\":\"191.34\",\r\n \"G005TTBZ\":\"190.34\",\r\n \"G061TTSZ\":\"109.14\",\r\n \"G061TTBZ\":\"108.14\",\r\n \"G074TTSZ\":\"89.04\",\r\n \"G074TTBZ\":\"88.04\",\r\n \"G080TTSZ\":\"9.70\",\r\n \"G080TTBZ\":\"9.20\",\r\n \"G095TTSZ\":\"3.68\",\r\n \"G095TTBZ\":\"2.68\",\r\n \"G069TTSZ\":\"24.22\",\r\n \"G069TTBZ\":\"23.72\"\r\n}"}, {"p": "tests/smoke_gui.py", "s": 1963, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen GUI smoke test + screenshots.\"\"\"\nimport os, sys\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nfrom PySide6.QtWidgets import QApplication\nimport core\nfrom app import MainWindow\n\napp = QApplication(sys.argv)\nwin = MainWindow()\nwin.show()\napp.processEvents()\n\n# Scenario 1: German CSV (semicolon, DMY with proof, decimal comma) -> JP\ncsv_path = \"/tmp/smoke_de.csv\"\nwith open(csv_path, \"w\", encoding=\"utf-8\") as f:\n    f.write(\"Datum;Betrag;Code;Notiz\\n\")\n    f.write(\"25/03/2026;1.234,56;007;Rechnung März\\n\")\n    f.write(\"03/04/2026;2.500,00;008;Rechnung April\\n\")\n    f.write(\"13/11/2026;750,25;009;Teilzahlung\\n\")\nwin.sender_combo.setCurrentIndex([c[\"code\"] for c in __import__(\"countries\").COUNTRIES].index(\"DE\"))\nwin.receiver_combo.setCurrentIndex([c[\"code\"] for c in __import__(\"countries\").COUNTRIES].index(\"JP\"))\nwin._load_path(csv_path)\napp.processEvents()\nassert win.result is not None\nassert win.result.rows[0][1] in (\"1234.56\", \"1,234.56\", \"１２３４．５６\") or \"1234\" in win.result.rows[0][1], win.result.rows\nassert win.result.rows[0][2] == \"007\", win.result.rows\nwin.grab().save(\"shots/01_main_de_jp.png\")\nprint(\"scenario1 rows:\", win.result.rows, \"reviews:\", len(win.result.reviews))\n\n# Scenario 2: UK file with undecidable dates + a short wareki-less mix -> JP\ncsv2 = \"/tmp/smoke_gb.csv\"\nwith open(csv2, \"w\", encoding=\"utf-8\") as f:\n    f.write(\"Date,Amount,Note\\n\")\n    f.write(\"03/04/2026,\\\"1,234.56\\\",first\\n\")\n    f.write(\"05/06/2026,\\\"2,000.00\\\",second\\n\")\nwin.sender_combo.setCurrentIndex([c[\"code\"] for c in __import__(\"countries\").COUNTRIES].index(\"GB\"))\nwin._load_path(csv2)\napp.processEvents()\nassert len(win.result.reviews) >= 1, win.result.reviews\nwin.grab().save(\"shots/02_review_gb_jp.png\")\nprint(\"scenario2 reviews:\", [(r.original, [c['label'] for c in r.candidates]) for r in win.result.reviews])\nprint(\"SMOKE OK\")\n"}, {"p": "tests/test_core.py", "s": 8501, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport os\nimport sys\nfrom datetime import date\nfrom decimal import Decimal\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nimport core\nfrom core import Table\n\nFIX = os.path.join(os.path.dirname(__file__), \"fixture_mufg.js\")\n\n\ndef tbl(headers, rows):\n    return Table(headers, rows)\n\n\n# --------------------------------------------------------------- dates\ndef test_date_ambiguous_flagged():\n    t = tbl([\"日付\", \"品名\"], [[\"03/04\", \"A\"], [\"05/06\", \"B\"]])\n    r = core.convert_table(t, \"GB\", \"JP\")\n    assert r.report[\"unresolved\"] == 2\n    assert {x.kind for x in r.reviews} == {\"date\"}\n    # unresolved cells keep original text\n    assert r.rows[0][0] == \"03/04\"\n\n\ndef test_date_column_evidence_proves_dmy():\n    t = tbl([\"日付\"], [[\"25/03\"], [\"03/04\"]])\n    r = core.convert_table(t, \"GB\", \"JP\")\n    assert r.report[\"unresolved\"] == 0\n    # yearless input -> yearless output in receiver (JP: month/day) order\n    assert r.rows[0][0] == \"03/25\"  # 25/03 DMY = 25 Mar\n    assert r.rows[1][0] == \"04/03\"  # 03/04 DMY = 3 Apr\n\n\ndef test_date_us_to_jp_with_evidence():\n    t = tbl([\"Date\"], [[\"12/25/2026\"], [\"03/04/2026\"]])\n    r = core.convert_table(t, \"US\", \"JP\")\n    assert r.report[\"unresolved\"] == 0\n    assert r.rows[0][0] == \"2026/12/25\"\n    assert r.rows[1][0] == \"2026/03/04\"\n\n\ndef test_date_resolution_applies():\n    t = tbl([\"日付\"], [[\"03/04\"]])\n    r0 = core.convert_table(t, \"GB\", \"JP\")\n    assert r0.report[\"unresolved\"] == 1\n    pk = r0.reviews[0].pattern_key\n    cand = r0.reviews[0].candidates[0]  # DMY -> 2026-04-03\n    r = core.convert_table(t, \"GB\", \"JP\", resolutions={pk: cand[\"output\"]})\n    assert r.report[\"unresolved\"] == 0\n    assert r.rows[0][0] == cand[\"output\"]\n\n\n# --------------------------------------------------------------- numbers\ndef test_eu_number_to_plain_and_us():\n    v, info = core.parse_number(\"1.234,56\", \",\", \".\")\n    assert v == Decimal(\"1234.56\") and not info[\"ambiguous\"]\n    t = tbl([\"金額\"], [[\"1.234,56\"]])\n    r = core.convert_table(t, \"DE\", \"JP\")\n    assert r.rows[0][0] == \"1,234.56\"\n    r2 = core.convert_table(t, \"DE\", \"US\")\n    assert r2.rows[0][0] == \"1,234.56\"\n\n\ndef test_number_ambiguous_flagged():\n    t = tbl([\"金額\"], [[\"1.234\"]])\n    r = core.convert_table(t, \"DE\", \"US\")\n    assert r.report[\"unresolved\"] == 1\n    item = r.reviews[0]\n    assert item.kind == \"number\"\n    outs = {c[\"output\"] for c in item.candidates}\n    assert outs == {\"1,234\", \"1.234\"}\n\n\ndef test_number_column_evidence_resolves():\n    t = tbl([\"金額\"], [[\"1.234.567,89\"], [\"1.234\"]])\n    r = core.convert_table(t, \"DE\", \"US\")\n    assert r.report[\"unresolved\"] == 0\n    assert r.rows[1][0] == \"1,234\"\n\n\ndef test_fullwidth_digits():\n    assert core.normalize_fullwidth(\"１２３\") == \"123\"\n    t = tbl([\"金額\"], [[\"１２３４５\"]])\n    r = core.convert_table(t, \"JP\", \"US\")\n    assert r.rows[0][0] == \"12,345\"\n    # dotted fullwidth amount with a decimal tail converts too\n    t2 = tbl([\"金額\"], [[\"１，２３４．５６\"]])\n    r2 = core.convert_table(t2, \"JP\", \"US\")\n    assert r2.rows[0][0] == \"1,234.56\"\n\n\ndef test_leading_zero_code_preserved():\n    t = tbl([\"商品コード\", \"品名\"], [[\"007\", \"A\"], [\"012\", \"B\"]])\n    r = core.convert_table(t, \"JP\", \"US\")\n    assert r.rows[0][0] == \"007\"\n    assert r.rows[1][0] == \"012\"\n    assert r.report[\"counts\"][\"preserved_code\"] >= 2\n\n\n# --------------------------------------------------------------- wareki\ndef test_wareki_to_gregorian():\n    assert core.wareki_to_date(\"令和8年11月13日\") == date(2026, 11, 13)\n    assert core.wareki_to_date(\"令和元年5月1日\") == date(2019, 5, 1)\n    assert core.wareki_to_date(\"R8.11.13\") == date(2026, 11, 13)\n    assert core.wareki_to_date(\"平成31年4月30日\") == date(2019, 4, 30)\n\n\ndef test_gregorian_to_wareki():\n    assert core.date_to_wareki(date(2026, 11, 13)) == \"令和8年11月13日\"\n    assert core.date_to_wareki(date(2019, 5, 1)) == \"令和元年5月1日\"\n    assert core.date_to_wareki(date(1989, 1, 8)) == \"平成元年1月8日\"\n\n\ndef test_wareki_column_converts():\n    t = tbl([\"日付\"], [[\"令和8年11月13日\"]])\n    r = core.convert_table(t, \"JP\", \"US\")\n    assert r.rows[0][0] == \"11/13/2026\"\n    assert r.report[\"counts\"][\"wareki\"] == 1\n\n\n# --------------------------------------------------------------- csv io\ndef test_semicolon_csv_loads_columns(tmp_path):\n    p = tmp_path / \"eu.csv\"\n    p.write_bytes(\"Datum;Betrag\\n25.03.2026;1.234,56\\n\".encode(\"utf-8\"))\n    t = core.load_table(str(p))\n    assert t.headers == [\"Datum\", \"Betrag\"]\n    assert t.rows[0][1] == \"1.234,56\"\n    assert t.meta[\"delimiter\"] == \";\"\n\n\ndef test_shift_jis_csv_decodes(tmp_path):\n    p = tmp_path / \"jp.csv\"\n    p.write_bytes(\"品名,金額\\nりんご,100\\n\".encode(\"shift_jis\"))\n    t = core.load_table(str(p))\n    assert t.headers[0] == \"品名\"\n    assert t.rows[0][0] == \"りんご\"\n    assert t.meta[\"encoding\"] == \"shift_jis\"\n\n\ndef test_csv_roundtrip_delimiter():\n    t = tbl([\"a\", \"b\"], [[\"1\", \"2\"]])\n    data = core.table_to_csv_text(t, delimiter=\";\")\n    t2, d = core.parse_csv_text(data.decode(\"utf-8-sig\"), \";\")\n    assert t2.rows == [[\"1\", \"2\"]]\n\n\n# --------------------------------------------------------------- fx math\nFR = {\"source\": \"frankfurter\", \"base\": \"USD\", \"date\": \"2026-11-12\",\n      \"rates\": {\"USD\": Decimal(1), \"JPY\": Decimal(\"160\"), \"EUR\": Decimal(\"0.9\")}}\n\n\ndef test_fx_ref_cross_rate_and_rounding():\n    out, rate, label = core.fx_convert(Decimal(\"100\"), \"EUR\", \"JPY\", \"ref\", {\"bundle\": FR})\n    # 100 EUR -> USD 111.11 -> JPY 17777.78 -> minor 0 -> 17778\n    assert out == Decimal(\"17778\")\n    assert \"ECB基準レート\" in label and \"2026-11-12\" in label\n\n\ndef test_fx_ref_minor_units_3():\n    bundle = {\"source\": \"erapi\", \"base\": \"USD\", \"date\": \"x\",\n              \"rates\": {\"USD\": Decimal(1), \"BHD\": Decimal(\"0.376\")}}\n    out, rate, label = core.fx_convert(Decimal(\"100\"), \"USD\", \"BHD\", \"ref\", {\"bundle\": bundle})\n    assert out == Decimal(\"37.600\")\n    assert \"公式基準レートではありません\" in label\n\n\ndef test_fx_bank_direction_tts_ttb():\n    mufg = {\"source\": \"mufg\", \"date\": \"2026年11月13日 21時40分\",\n            \"pairs\": {\"USD\": (Decimal(\"160.26\"), Decimal(\"159.76\"))}}\n    # foreign -> JPY uses TTB\n    out, rate, label = core.fx_convert(Decimal(\"100\"), \"USD\", \"JPY\", \"bank\", {\"mufg\": mufg})\n    assert out == Decimal(\"15976\")\n    assert \"TTB\" in rate and \"三菱UFJ\" in label\n    # JPY -> foreign uses TTS\n    out2, rate2, _ = core.fx_convert(Decimal(\"16026\"), \"JPY\", \"USD\", \"bank\", {\"mufg\": mufg})\n    assert out2 == Decimal(\"100.00\")\n    assert \"TTS\" in rate2\n\n\ndef test_fx_bank_unavailable_pair():\n    mufg = {\"source\": \"mufg\", \"date\": \"x\", \"pairs\": {\"USD\": (Decimal(\"1\"), Decimal(\"1\"))}}\n    out, reason, _ = core.fx_convert(Decimal(\"10\"), \"EUR\", \"JPY\", \"bank\", {\"mufg\": mufg})\n    assert out is None and \"not available\" in reason\n\n\ndef test_fx_manual_single_rate():\n    out, rate, label = core.fx_convert(\n        Decimal(\"50\"), \"USD\", \"EUR\", \"manual\",\n        {\"bank_name\": \"テスト銀行\", \"rate\": \"0.9\"})\n    assert out == Decimal(\"45.00\") and \"テスト銀行\" in label\n\n\ndef test_mufg_parser_against_real_fixture():\n    with open(FIX, \"rb\") as fh:\n        parsed = core.parse_mufg_js(fh.read())\n    assert parsed is not None\n    assert parsed[\"date\"].startswith(\"2026年11月13日\")\n    assert set(parsed[\"pairs\"]) == {\"USD\", \"EUR\", \"GBP\", \"CHF\", \"AUD\",\n                                    \"NZD\", \"ZAR\", \"TRY\", \"CNY\"}\n    tts, ttb = parsed[\"pairs\"][\"USD\"]\n    assert tts > ttb > 0\n\n\ndef test_mufg_parser_garbage_returns_none():\n    assert core.parse_mufg_js(\"var x = {\\\"foo\\\": 1}\") is None\n\n\ndef test_fx_cache_roundtrip(tmp_path):\n    core.save_fx_cache({\"frankfurter\": FR}, directory=str(tmp_path))\n    loaded = core.load_fx_cache(directory=str(tmp_path))\n    assert loaded[\"frankfurter\"][\"rates\"][\"JPY\"] == Decimal(\"160\")\n\n\ndef test_convert_with_fx_ref():\n    t = tbl([\"金額\"], [[\"100,00\"]])\n    r = core.convert_table(t, \"DE\", \"JP\", fx={\"mode\": \"ref\", \"ctx\": {\"bundle\": FR}})\n    # 100 EUR -> JPY 17778 (rate table above), formatted JP, minor 0\n    assert r.rows[0][0] == \"17,778\"\n    assert r.report[\"fx_label\"].startswith(\"ECB基準レート\")\n    assert r.report[\"counts\"][\"fx\"] == 1\n\n\ndef test_same_currency_no_fx_change():\n    t = tbl([\"金額\"], [[\"1.234,56\"]])\n    r = core.convert_table(t, \"DE\", \"FR\", fx={\"mode\": \"ref\", \"ctx\": {\"bundle\": FR}})\n    assert r.rows[0][0] == \"1 234,56\" or r.rows[0][0] == \"1234,56\"\n"}, {"p": "tests/test_official.py", "s": 4027, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tier-selection tests for the official central-bank layer (fixtures only).\"\"\"\nimport os\nimport sys\nfrom decimal import Decimal\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nimport core\n\nD = Decimal\n\n\ndef _b(source, rates, date=\"2026-11-12\"):\n    name, tier = core.SOURCE_INFO[source]\n    return {\"source\": source, \"rates\": dict(rates),\n            \"prov\": {c: (source, tier) for c in rates},\n            \"dates\": {c: date for c in rates}, \"date\": date}\n\n\ndef test_merge_official_beats_frankfurter_beats_erapi():\n    off = _b(\"nbp\", {\"USD\": D(1), \"EUR\": D(\"0.91\"), \"PLN\": D(\"3.98\")})\n    frank = _b(\"frankfurter\", {\"USD\": D(1), \"EUR\": D(\"0.90\"), \"JPY\": D(\"160\")})\n    era = _b(\"erapi\", {\"USD\": D(1), \"EUR\": D(\"0.99\"), \"JPY\": D(\"161\"), \"VND\": D(\"25000\")})\n    m = core.merge_rate_bundles([off, frank, era])\n    assert m[\"rates\"][\"EUR\"] == D(\"0.91\")          # Tier1 wins\n    assert m[\"prov\"][\"EUR\"] == (\"nbp\", 1)\n    assert m[\"rates\"][\"JPY\"] == D(\"160\")           # Tier2 fills\n    assert m[\"prov\"][\"JPY\"] == (\"frankfurter\", 2)\n    assert m[\"rates\"][\"VND\"] == D(\"25000\")          # Tier3 last resort\n    assert m[\"prov\"][\"VND\"] == (\"erapi\", 3)\n    cov = core.tier_coverage(m)\n    assert cov == {1: 3, 2: 1, 3: 1}\n\n\ndef test_pair_label_uses_lowest_tier():\n    off = _b(\"nbp\", {\"USD\": D(1), \"EUR\": D(\"0.91\"), \"PLN\": D(\"3.98\")})\n    era = _b(\"erapi\", {\"USD\": D(1), \"VND\": D(\"25000\")})\n    m = core.merge_rate_bundles([off, era])\n    out, rate, label = core.fx_convert(D(\"100\"), \"EUR\", \"PLN\", \"ref\", {\"bundle\": m})\n    assert \"公式レート（中央銀行）による試算\" in label\n    assert \"ポーランド国立銀行\" in label\n    out2, rate2, label2 = core.fx_convert(D(\"100\"), \"EUR\", \"VND\", \"ref\", {\"bundle\": m})\n    assert \"公式基準レートではありません\" in label2  # one Tier-3 leg poisons the pair label\n\n\ndef test_fred_parser_fixture():\n    text = (\"observation_date,DEXUSEU,DEXJPUS,DEXUSUK\\n\"\n            \"2026-11-05,1.1200,158.00,1.3400\\n\"\n            \"2026-11-06,1.1154,158.23,1.3371\\n\")\n    b = core.parse_fred_csv(text)\n    assert b[\"date\"] == \"2026-11-06\"\n    assert b[\"rates\"][\"JPY\"] == D(\"158.23\")\n    # usd_per series are inverted to per-USD\n    assert abs(b[\"rates\"][\"EUR\"] - (D(1) / D(\"1.1154\"))) < D(\"0.000001\")\n    assert b[\"prov\"][\"EUR\"] == (\"fred\", 1)\n\n\ndef test_nbp_parser_fixture():\n    text = ('[{\"table\":\"A\",\"effectiveDate\":\"2026-11-13\",\"rates\":['\n            '{\"currency\":\"x\",\"code\":\"USD\",\"mid\":4.0},'\n            '{\"currency\":\"y\",\"code\":\"EUR\",\"mid\":4.4}]}]')\n    b = core.parse_nbp_json(text)\n    assert b[\"rates\"][\"PLN\"] == D(\"4.0\")\n    assert abs(b[\"rates\"][\"EUR\"] - D(\"0.9090909090909090909090909091\")) < D(\"1e-20\")\n\n\ndef test_norges_parser_fixture():\n    import json as _json\n    doc = {\"data\": {\n        \"dataSets\": [{\"series\": {\n            \"0:0:0:0\": {\"observations\": {\"0\": [\"9.5\"]}},\n            \"0:1:0:0\": {\"observations\": {\"0\": [\"0.0070\"]}}}}],\n        \"structure\": {\"dimensions\": {\n            \"series\": [\n                {\"id\": \"FREQ\", \"values\": [{\"id\": \"B\"}]},\n                {\"id\": \"BASE_CUR\", \"values\": [{\"id\": \"USD\"}, {\"id\": \"KRW\"}]},\n                {\"id\": \"QUOTE_CUR\", \"values\": [{\"id\": \"NOK\"}]},\n                {\"id\": \"TENOR\", \"values\": [{\"id\": \"SP\"}]}],\n            \"observation\": [\n                {\"id\": \"TIME_PERIOD\", \"values\": [{\"id\": \"2026-11-12\"}]}]}}}}\n    b = core.parse_norges_json(_json.dumps(doc))\n    assert b[\"rates\"][\"NOK\"] == D(\"9.5\")\n    # NOK per KRW = 0.0070 -> KRW per USD = 9.5 / 0.0070 = 1357.14\n    assert abs(b[\"rates\"][\"KRW\"] - D(\"1357.142857\")) < D(\"0.01\")\n    assert b[\"date\"] == \"2026-11-12\"\n\n\ndef test_hkma_parser_fixture():\n    text = ('{\"result\":{\"records\":['\n            '{\"end_of_day\":\"2026-11-10\",\"usd\":7.80,\"jpy\":0.0490},'\n            '{\"end_of_day\":\"2026-11-12\",\"usd\":7.85,\"jpy\":0.0495}]}}')\n    b = core.parse_hkma_json(text)\n    assert b[\"date\"] == \"2026-11-12\"\n    assert b[\"rates\"][\"HKD\"] == D(\"7.85\")\n    assert abs(b[\"rates\"][\"JPY\"] - (D(\"7.85\") / D(\"0.0495\"))) < D(\"0.01\")\n"}]</script>

لتطبيقات", "to_top": "الصفحة الرئيسية", "dl_zip": "تنزيل الشيفرة المصدرية (ZIP)", "file_list": "الملفات", "copy": "نسخ", "copied": "تم النسخ", "copy_fail": "فشل النسخ", "bin_note": "ملف ثنائي (لا يُعرض)", "lines_unit": "سطر", "version": "الإصدار", "files_unit": "ملفات", "license": "رخصة MIT", "title_fmt": "الشيفرة المصدرية لـ {app} | get-quicknote"}, "id": {"back_list": "← Kembali ke daftar aplikasi", "to_top": "Beranda", "dl_zip": "Unduh kode sumber (ZIP)", "file_list": "File", "copy": "Salin", "copied": "Disalin", "copy_fail": "Gagal menyalin", "bin_note": "File biner (tidak ditampilkan)", "lines_unit": "baris", "version": "Versi", "files_unit": "file", "license": "Lisensi MIT", "title_fmt": "Kode sumber {app} | get-quicknote"}, "ko": {"back_list": "← 앱 목록으로 돌아가기", "to_top": "홈으로", "dl_zip": "소스 코드 다운로드 (ZIP)", "file_list": "파일 목록", "copy": "복사", "copied": "복사했습니다", "copy_fail": "복사에 실패했습니다", "bin_note": "바이너리 파일 (표시되지 않음)", "lines_unit": "행", "version": "버전", "files_unit": "파일", "license": "MIT 라이선스", "title_fmt": "{app} 소스 코드 | get-quicknote"}}</script>
<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
