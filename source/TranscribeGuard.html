<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('gq-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;}}catch(e){}})();</script>
<title>TranscribeGuard のソースコード | get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#0D1526; --surface:#111C33; --surface2:#182747;
  --codebg:#0D1117; --ink:#E8EEF8; --muted:#93A5C4; --faint:#5B6E92; --line:#22314F;
  --line-soft:rgba(34,49,79,.55); --gutter-line:#21262D; --gutter-ink:#484F58;
  --accent:#3B82F6; --accent-strong:#60A5FA; --accent-soft:rgba(59,130,246,.16);
  --active-ink:#FFFFFF;
  --font-body:"Inter","Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F8FD; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#E7EFFD;
  --codebg:#FFFFFF; --ink:#0F1B33; --muted:#3B4A66; --faint:#64748B; --line:#DFE7F3;
  --line-soft:#E7EDF6; --gutter-line:#D8DEE4; --gutter-ink:#6E7781;
  --accent:#2563EB; --accent-strong:#1D4ED8; --accent-soft:rgba(37,99,235,.12);
  --active-ink:#1D4ED8;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:var(--accent-strong)}
/* ===== top bar ===== */
.topbar{flex:none;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;
  padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .appname{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .appname .ja{color:var(--muted);font-size:.82em;font-weight:700;margin-left:10px}
.topbar .meta{color:var(--faint);font-size:.85rem;white-space:nowrap}
.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:18px}
.topbar nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
.topbar nav a:hover{color:var(--ink)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 18px;border-radius:999px;
  box-shadow:0 8px 20px -6px rgba(37,99,235,.5);white-space:nowrap}
.dlbtn:hover{filter:brightness(1.12)}
.dlbtn svg{flex:none}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  cursor:pointer;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ic-moon{display:none}
:root[data-theme="light"] .themebtn .ic-moon{display:block}
:root[data-theme="light"] .themebtn .ic-sun{display:none}
.langpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.85rem;font-weight:700;
  line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;cursor:pointer;max-width:190px}
.langpick select:hover{border-color:var(--accent)}
/* ===== main split ===== */
.main{flex:1;display:flex;min-height:0}
.filelist{width:284px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--panel);
  border-right:1px solid var(--line)}
[dir="rtl"] .filelist{border-right:0;border-left:1px solid var(--line)}
.filelist .fl-head{padding:11px 16px;font-weight:800;font-size:.86rem;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.file-btn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);color:var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:.8rem;line-height:1.45;
  text-align:left;cursor:pointer;word-break:break-all}
.file-btn:hover{background:var(--surface2)}
.file-btn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);color:var(--active-ink)}
[dir="rtl"] .file-btn.active{box-shadow:inset -3px 0 0 var(--accent)}
.file-btn .sz{color:var(--faint);font-size:.7rem;flex:none}
.file-bin{padding:9px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);
  font-size:.8rem;line-height:1.45;color:var(--faint);word-break:break-all}
.file-bin .sz{font-size:.7rem;margin-left:8px}
.bin-note{display:block;font-family:var(--font-body);font-size:.72rem;color:#64748B;margin-top:1px}
/* ===== code pane ===== */
.codepane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--codebg)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .fname{font-family:var(--font-mono);font-size:.95rem;font-weight:700;word-break:break-all}
.toolbar .finfo{color:var(--muted);font-size:.85rem;white-space:nowrap}
.copybtn{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:7px 18px;border-radius:999px}
[dir="rtl"] .copybtn{margin-left:0;margin-right:auto}
.copybtn:hover{filter:brightness(1.12)}
.copybtn.done{background:#0E9F6E}
.code-scroll{flex:1;overflow:auto;min-height:0;direction:ltr}
.code-flex{display:flex;min-width:max-content;min-height:100%}
.gutter{flex:none;position:sticky;left:0;z-index:1;background:var(--codebg);
  border-right:1px solid var(--gutter-line);text-align:right;user-select:none;white-space:pre;
  font-family:var(--font-mono);font-size:16px;line-height:1.75;
  padding:16px 12px 24px 18px;color:var(--gutter-ink)}
.code-flex pre.code{flex:1;margin:0;padding:16px 28px 24px 20px;
  font-family:var(--font-mono);font-size:16px;line-height:1.75}
.code-flex pre.code code{font-family:inherit;font-size:inherit;line-height:inherit;
  background:transparent;padding:0;white-space:pre}
/* ===== highlight.js GitHub Dark (default) ===== */
.hljs{color:#E6EDF3;background:#0D1117}
.hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-variable,
.hljs-template-tag,.hljs-type,.hljs-variable.language_{color:#FF7B72}
.hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,
.hljs-title.function_{color:#D2A8FF}
.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,
.hljs-variable,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:#79C0FF}
.hljs-regexp,.hljs-string,.hljs-meta .hljs-string{color:#A5D6FF}
.hljs-built_in,.hljs-symbol{color:#FFA657}
.hljs-comment,.hljs-code,.hljs-formula{color:#8B949E}
.hljs-name,.hljs-quote,.hljs-selector-tag,.hljs-selector-pseudo{color:#7EE787}
.hljs-subst{color:#E6EDF3}
.hljs-section{color:#1F6FEB;font-weight:bold}
.hljs-bullet{color:#F2CC60}
.hljs-emphasis{color:#E6EDF3;font-style:italic}
.hljs-strong{color:#E6EDF3;font-weight:bold}
.hljs-addition{color:#AFF5B4;background-color:#033A16}
.hljs-deletion{color:#FFDCD7;background-color:#67060C}
.hljs-char.escape_,.hljs-link,.hljs-params,.hljs-property,.hljs-punctuation,.hljs-tag{/* purposely ignored */}
/* ===== highlight.js GitHub Light ===== */
:root[data-theme="light"] .hljs{color:#24292E;background:#FFFFFF}
:root[data-theme="light"] .hljs-doctag,:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-meta .hljs-keyword,:root[data-theme="light"] .hljs-template-variable,
:root[data-theme="light"] .hljs-template-tag,:root[data-theme="light"] .hljs-type,
:root[data-theme="light"] .hljs-variable.language_{color:#D73A49}
:root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.class_,
:root[data-theme="light"] .hljs-title.class_.inherited__,
:root[data-theme="light"] .hljs-title.function_{color:#6F42C1}
:root[data-theme="light"] .hljs-attr,:root[data-theme="light"] .hljs-attribute,
:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-meta,
:root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-operator,
:root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-selector-attr,
:root[data-theme="light"] .hljs-selector-class,:root[data-theme="light"] .hljs-selector-id{color:#005CC5}
:root[data-theme="light"] .hljs-regexp,:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-meta .hljs-string{color:#032F62}
:root[data-theme="light"] .hljs-built_in,:root[data-theme="light"] .hljs-symbol{color:#E36209}
:root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-code,
:root[data-theme="light"] .hljs-formula{color:#6A737D}
:root[data-theme="light"] .hljs-name,:root[data-theme="light"] .hljs-quote,
:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-selector-pseudo{color:#22863A}
:root[data-theme="light"] .hljs-subst{color:#24292E}
:root[data-theme="light"] .hljs-section{color:#005CC5;font-weight:bold}
:root[data-theme="light"] .hljs-bullet{color:#735C0F}
:root[data-theme="light"] .hljs-emphasis{color:#24292E;font-style:italic}
:root[data-theme="light"] .hljs-strong{color:#24292E;font-weight:bold}
:root[data-theme="light"] .hljs-addition{color:#22863A;background-color:#F0FFF4}
:root[data-theme="light"] .hljs-deletion{color:#B31D28;background-color:#FFEEF0}
@media (max-width:760px){
  .main{flex-direction:column}
  .filelist{width:auto;flex:none;max-height:158px;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line)}
  .filelist .fl-head{position:static}
  .filelist .fl-items{display:flex;flex-direction:row;overflow-x:auto}
  .file-btn,.file-bin{flex:none;border-bottom:0;border-right:1px solid var(--line-soft);
    white-space:nowrap;word-break:normal;align-items:center}
  .code-flex pre.code,.gutter{font-size:14.5px}
  .topbar .meta{display:none}
  .langpick select{max-width:140px}
}
</style>

</header>

<script type="application/json" id="filedata">[{"p": "app.py", "s": 33613, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"TranscribeGuard (転記見守り君) - main window.\n\nSemi-automatic by design: the app decomposes the source, watches the\nperson's typing with live checks, and prepares the result. It never sends\nor registers anything; the final transfer is done by the person.\n\"\"\"\nimport csv\nimport json\nimport os\nimport sys\n\nfrom PySide6.QtCore import Qt, QTimer, QStandardPaths, Signal\nfrom PySide6.QtGui import QColor\nfrom PySide6.QtWidgets import (\n    QApplication, QComboBox, QDialog, QFileDialog, QFrame, QHBoxLayout,\n    QInputDialog, QLabel, QLineEdit, QMainWindow, QMessageBox, QPlainTextEdit,\n    QProgressBar, QPushButton, QScrollArea, QSplitter, QTableWidget,\n    QTableWidgetItem, QVBoxLayout, QWidget, QGraphicsDropShadowEffect,\n    QDialogButtonBox, QFormLayout,\n)\n\nimport core\nfrom i18n import LANG_NAMES, LANG_ORDER, RTL_LANGS, tr\n\nAPP_NAME = \"TranscribeGuard\"\n\n\ndef app_data_dir():\n    base = QStandardPaths.writableLocation(QStandardPaths.StandardLocation.AppDataLocation)\n    if not base:\n        base = os.path.join(os.path.expanduser(\"~\"), \".transcribe-guard\")\n    os.makedirs(base, exist_ok=True)\n    return base\n\n\nSTYLE = \"\"\"\nQMainWindow { background: #eef4fb; }\nQLabel { color: #1e293b; }\nQPushButton {\n    background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 9px;\n    padding: 7px 13px; font-weight: 600; color: #1e3a5f;\n}\nQPushButton:hover { background: #e0f2fe; border-color: #38bdf8; }\nQPushButton:pressed { background: #bae6fd; }\nQLineEdit {\n    background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 7px; padding: 5px 8px;\n}\nQLineEdit:focus { border-color: #2563eb; }\nQScrollBar:vertical { background: #e2e8f0; width: 12px; border-radius: 6px; }\nQScrollBar::handle:vertical { background: #94a3b8; border-radius: 6px; min-height: 30px; }\nQScrollBar::handle:vertical:hover { background: #64748b; }\nQScrollBar:horizontal { background: #e2e8f0; height: 12px; border-radius: 6px; }\nQScrollBar::handle:horizontal { background: #94a3b8; border-radius: 6px; min-width: 30px; }\nQScrollBar::add-line, QScrollBar::sub-line { height: 0; width: 0; }\nQComboBox {\n    background: #ffffff; border: 1.5px solid rgba(255,255,255,.7); border-radius: 8px;\n    padding: 4px 8px; font-weight: 600;\n}\nQProgressBar {\n    background: rgba(255,255,255,.35); border: none; border-radius: 7px; height: 14px;\n    text-align: center; color: #ffffff; font-size: 10px; font-weight: 700;\n}\nQProgressBar::chunk { background: #4ade80; border-radius: 7px; }\nQTableWidget { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; gridline-color: #eef2f7; }\nQHeaderView::section { background: #e0eaff; padding: 5px; border: none; font-weight: 700; }\n\"\"\"\n\n\nclass ClickLabel(QLabel):\n    doubleClicked = Signal()\n\n    def mouseDoubleClickEvent(self, event):\n        self.doubleClicked.emit()\n        super().mouseDoubleClickEvent(event)\n\n\ndef shadow(widget, blur=14, y=3, alpha=55):\n    eff = QGraphicsDropShadowEffect(widget)\n    eff.setBlurRadius(blur)\n    eff.setOffset(0, y)\n    eff.setColor(QColor(30, 41, 59, alpha))\n    widget.setGraphicsEffect(eff)\n    return widget\n\n\nclass MainWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.lang = \"ja\"\n        self.items = []\n        self.inputs = []\n        self.source_name = \"\"\n        self.rows = []          # per-item widget refs, in item order\n        self._syncing = False\n        self._autosave_timer = QTimer(self)\n        self._autosave_timer.setSingleShot(True)\n        self._autosave_timer.setInterval(700)\n        self._autosave_timer.timeout.connect(self.autosave)\n\n        self._load_settings()\n        self.setStyleSheet(STYLE)\n        self._build_ui()\n        self.apply_language(self.lang, rebuild=False)\n        self._restore_autosave()\n        self.update_all()\n\n    # ------------------------------------------------------------ settings\n    def _settings_path(self):\n        return os.path.join(app_data_dir(), \"settings.json\")\n\n    def _load_settings(self):\n        try:\n            with open(self._settings_path(), encoding=\"utf-8\") as fh:\n                data = json.load(fh)\n            if data.get(\"lang\") in LANG_ORDER:\n                self.lang = data[\"lang\"]\n        except Exception:\n            pass\n\n    def _save_settings(self):\n        try:\n            with open(self._settings_path(), \"w\", encoding=\"utf-8\") as fh:\n                json.dump({\"lang\": self.lang}, fh, ensure_ascii=False)\n        except Exception:\n            pass\n\n    def autosave(self):\n        try:\n            path = os.path.join(app_data_dir(), \"autosave.json\")\n            with open(path, \"w\", encoding=\"utf-8\") as fh:\n                json.dump(core.session_dict(self.items, self.current_inputs(), self.lang, self.source_name),\n                          fh, ensure_ascii=False, indent=1)\n        except Exception:\n            pass\n\n    def _restore_autosave(self):\n        path = os.path.join(app_data_dir(), \"autosave.json\")\n        if not os.path.exists(path):\n            return\n        try:\n            with open(path, encoding=\"utf-8\") as fh:\n                data = json.load(fh)\n            items, inputs, _lang, name = core.session_from_dict(data)\n            if items:\n                self.items, self.inputs, self.source_name = items, inputs, name\n                self.rebuild_panels()\n        except Exception:\n            pass\n\n    def current_inputs(self):\n        if self.rows and len(self.rows) == len(self.items):\n            return [r[\"edit\"].text() for r in self.rows]\n        return list(self.inputs) + [\"\"] * (len(self.items) - len(self.inputs))\n\n    def t(self, key, **kw):\n        return tr(self.lang, key, **kw)\n\n    # ------------------------------------------------------------ UI build\n    def _build_ui(self):\n        self.setMinimumSize(1020, 680)\n        self.resize(1200, 780)\n        self.setAcceptDrops(True)\n        central = QWidget()\n        self.setCentralWidget(central)\n        root = QVBoxLayout(central)\n        root.setContentsMargins(10, 10, 10, 8)\n        root.setSpacing(8)\n\n        # header\n        header = QFrame()\n        header.setStyleSheet(\n            \"QFrame { background: qlineargradient(x1:0,y1:0,x2:1,y2:1,\"\n            \" stop:0 #1d4ed8, stop:.55 #2563eb, stop:1 #06b6d4); border-radius: 14px; }\")\n        shadow(header, blur=18, y=4, alpha=70)\n        hv = QVBoxLayout(header)\n        hv.setContentsMargins(16, 12, 16, 12)\n        hv.setSpacing(7)\n        top = QHBoxLayout()\n        title_box = QVBoxLayout()\n        self.title_label = QLabel()\n        self.title_label.setStyleSheet(\"color: white; font-size: 22px; font-weight: 800;\")\n        self.subtitle_label = QLabel()\n        self.subtitle_label.setStyleSheet(\"color: #dbeafe; font-size: 12px;\")\n        title_box.addWidget(self.title_label)\n        title_box.addWidget(self.subtitle_label)\n        top.addLayout(title_box)\n        top.addStretch(1)\n        self.lang_label = QLabel()\n        self.lang_label.setStyleSheet(\"color: white; font-weight: 700;\")\n        top.addWidget(self.lang_label)\n        self.lang_combo = QComboBox()\n        for code in LANG_ORDER:\n            self.lang_combo.addItem(LANG_NAMES[code], code)\n        self.lang_combo.setCurrentIndex(LANG_ORDER.index(self.lang))\n        self.lang_combo.currentIndexChanged.connect(\n            lambda i: self.apply_language(self.lang_combo.itemData(i)))\n        top.addWidget(self.lang_combo)\n        hv.addLayout(top)\n\n        stats = QHBoxLayout()\n        stats.setSpacing(8)\n        self.stat_labels = {}\n        for key in (\"stat_total\", \"stat_done\", \"stat_remaining\", \"stat_mismatch\"):\n            lab = QLabel()\n            lab.setStyleSheet(\n                \"background: rgba(255,255,255,.92); border-radius: 9px; padding: 5px 12px;\"\n                \" font-weight: 800; color: #1e3a5f; font-size: 13px;\")\n            if key == \"stat_remaining\":\n                lab.setStyleSheet(\n                    \"background: #fef08a; border-radius: 9px; padding: 5px 12px;\"\n                    \" font-weight: 800; color: #713f12; font-size: 13px;\")\n            self.stat_labels[key] = lab\n            stats.addWidget(lab)\n        stats.addStretch(1)\n        hv.addLayout(stats)\n        self.progress = QProgressBar()\n        self.progress.setRange(0, 100)\n        self.progress.setValue(0)\n        hv.addWidget(self.progress)\n        root.addWidget(header)\n\n        self.banner = QLabel()\n        self.banner.setStyleSheet(\n            \"background: #dcfce7; color: #166534; border: 1.5px solid #4ade80;\"\n            \" border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 14px;\")\n        self.banner.hide()\n        root.addWidget(self.banner)\n\n        self.ocr_bar = QLabel()\n        self.ocr_bar.setWordWrap(True)\n        self.ocr_bar.setStyleSheet(\n            \"background: #fef9c3; color: #854d0e; border: 1.5px solid #facc15;\"\n            \" border-radius: 10px; padding: 8px 12px; font-weight: 600;\")\n        self.ocr_bar.hide()\n        root.addWidget(self.ocr_bar)\n\n        # toolbar\n        bar = QHBoxLayout()\n        bar.setSpacing(7)\n        self.btn_open = QPushButton()\n        self.btn_open.clicked.connect(self.open_file)\n        self.btn_sample = QPushButton()\n        self.btn_sample.clicked.connect(lambda: self.load_items(core.sample_items(), \"sample\"))\n        self.btn_paste = QPushButton()\n        self.btn_paste.clicked.connect(self.paste_text)\n        self.btn_add = QPushButton()\n        self.btn_add.clicked.connect(self.add_item_dialog)\n        self.btn_clear = QPushButton()\n        self.btn_clear.clicked.connect(self.clear_inputs)\n        for b in (self.btn_open, self.btn_sample, self.btn_paste, self.btn_add, self.btn_clear):\n            bar.addWidget(b)\n        bar.addStretch(1)\n        self.btn_copy = QPushButton()\n        self.btn_copy.clicked.connect(self.copy_tsv)\n        self.btn_xlsx = QPushButton()\n        self.btn_xlsx.clicked.connect(self.save_xlsx)\n        self.btn_csv = QPushButton()\n        self.btn_csv.clicked.connect(self.save_csv)\n        self.btn_sess_save = QPushButton()\n        self.btn_sess_save.clicked.connect(self.save_session)\n        self.btn_sess_load = QPushButton()\n        self.btn_sess_load.clicked.connect(self.load_session)\n        for b in (self.btn_copy, self.btn_xlsx, self.btn_csv, self.btn_sess_save, self.btn_sess_load):\n            bar.addWidget(b)\n        root.addLayout(bar)\n\n        self.drop_hint = QLabel()\n        self.drop_hint.setStyleSheet(\"color: #64748b; font-size: 11px;\")\n        root.addWidget(self.drop_hint)\n\n        titles = QHBoxLayout()\n        self.left_title = QLabel()\n        self.left_title.setStyleSheet(\"font-weight: 800; font-size: 13px; color: #1d4ed8;\")\n        self.right_title = QLabel()\n        self.right_title.setStyleSheet(\"font-weight: 800; font-size: 13px; color: #1d4ed8;\")\n        titles.addWidget(self.left_title, 1)\n        titles.addWidget(self.right_title, 1)\n        root.addLayout(titles)\n\n        splitter = QSplitter(Qt.Orientation.Horizontal)\n        self.left_scroll = QScrollArea()\n        self.left_scroll.setWidgetResizable(True)\n        self.right_scroll = QScrollArea()\n        self.right_scroll.setWidgetResizable(True)\n        for sc in (self.left_scroll, self.right_scroll):\n            sc.setStyleSheet(\"QScrollArea { background: transparent; border: none; }\")\n        self.left_content = QWidget()\n        self.left_layout = QVBoxLayout(self.left_content)\n        self.left_layout.setContentsMargins(2, 2, 6, 2)\n        self.left_layout.setSpacing(8)\n        self.left_scroll.setWidget(self.left_content)\n        self.right_content = QWidget()\n        self.right_layout = QVBoxLayout(self.right_content)\n        self.right_layout.setContentsMargins(6, 2, 2, 2)\n        self.right_layout.setSpacing(8)\n        self.right_scroll.setWidget(self.right_content)\n        splitter.addWidget(self.left_scroll)\n        splitter.addWidget(self.right_scroll)\n        splitter.setSizes([560, 560])\n        root.addWidget(splitter, 1)\n        self.left_scroll.verticalScrollBar().valueChanged.connect(\n            lambda v: self._sync_scroll(self.right_scroll, v))\n        self.right_scroll.verticalScrollBar().valueChanged.connect(\n            lambda v: self._sync_scroll(self.left_scroll, v))\n\n        # totals\n        self.totals_title = QLabel()\n        self.totals_title.setStyleSheet(\"font-weight: 800; font-size: 13px; color: #1d4ed8;\")\n        root.addWidget(self.totals_title)\n        self.totals_table = QTableWidget(0, 3)\n        self.totals_table.setMaximumHeight(128)\n        self.totals_table.verticalHeader().setVisible(False)\n        self.totals_table.horizontalHeader().setStretchLastSection(True)\n        root.addWidget(self.totals_table)\n\n        self.footer = QLabel()\n        self.footer.setWordWrap(True)\n        self.footer.setStyleSheet(\"color: #475569; font-size: 11.5px; font-weight: 600;\")\n        root.addWidget(self.footer)\n\n    def _sync_scroll(self, other, value):\n        if self._syncing:\n            return\n        self._syncing = True\n        other.verticalScrollBar().setValue(value)\n        self._syncing = False\n\n    # ------------------------------------------------------------ language\n    def apply_language(self, lang, rebuild=True):\n        if lang not in LANG_ORDER:\n            lang = \"ja\"\n        self.lang = lang\n        self._save_settings()\n        idx = LANG_ORDER.index(lang)\n        if self.lang_combo.currentIndex() != idx:\n            self.lang_combo.blockSignals(True)\n            self.lang_combo.setCurrentIndex(idx)\n            self.lang_combo.blockSignals(False)\n        direction = Qt.LayoutDirection.RightToLeft if lang in RTL_LANGS else Qt.LayoutDirection.LeftToRight\n        QApplication.instance().setLayoutDirection(direction)\n        self.setWindowTitle(self.t(\"app_title\") + \" — TranscribeGuard\")\n        self.title_label.setText(self.t(\"app_title\"))\n        self.subtitle_label.setText(self.t(\"app_subtitle\"))\n        self.lang_label.setText(self.t(\"lang_label\"))\n        self.btn_open.setText(self.t(\"btn_open\"))\n        self.btn_sample.setText(self.t(\"btn_sample\"))\n        self.btn_paste.setText(self.t(\"btn_paste\"))\n        self.btn_add.setText(self.t(\"btn_add\"))\n        self.btn_clear.setText(self.t(\"btn_clear_inputs\"))\n        self.btn_copy.setText(self.t(\"btn_copy_tsv\"))\n        self.btn_xlsx.setText(self.t(\"btn_save_xlsx\"))\n        self.btn_csv.setText(self.t(\"btn_save_csv\"))\n        self.btn_sess_save.setText(self.t(\"btn_save_session\"))\n        self.btn_sess_load.setText(self.t(\"btn_load_session\"))\n        self.drop_hint.setText(self.t(\"drop_hint\"))\n        self.left_title.setText(self.t(\"left_title\"))\n        self.right_title.setText(self.t(\"right_title\"))\n        self.totals_title.setText(self.t(\"totals_title\"))\n        self.footer.setText(self.t(\"footer_note\"))\n        self.banner.setText(self.t(\"completion\"))\n        if rebuild:\n            self.rebuild_panels()\n        self.update_all()\n\n    # ------------------------------------------------------------ panels\n    def _clear_layout(self, layout):\n        while layout.count():\n            child = layout.takeAt(0)\n            w = child.widget()\n            if w is not None:\n                w.setParent(None)\n                w.deleteLater()\n            elif child.layout() is not None:\n                self._clear_layout(child.layout())\n\n    def rebuild_panels(self):\n        # keep current typed values before rebuilding widgets\n        if self.rows and len(self.rows) == len(self.items):\n            self.inputs = self.current_inputs()\n        self._clear_layout(self.left_layout)\n        self._clear_layout(self.right_layout)\n        self.rows = []\n        if not self.items:\n            lab = QLabel(self.t(\"empty_left\"))\n            lab.setWordWrap(True)\n            lab.setStyleSheet(\"color: #64748b; font-size: 13px; padding: 14px;\")\n            self.left_layout.addWidget(lab)\n            self.left_layout.addStretch(1)\n            self.right_layout.addStretch(1)\n            return\n        groups = []\n        for idx, it in enumerate(self.items):\n            if not groups or groups[-1][0] != it[\"group\"]:\n                groups.append((it[\"group\"], []))\n            groups[-1][1].append(idx)\n        for gname, members in groups:\n            left_card = self._group_card(self.left_layout, gname)\n            right_card = self._group_card(self.right_layout, gname)\n            for idx in members:\n                it = self.items[idx]\n                self._build_left_row(left_card, idx, it)\n                self._build_right_row(right_card, idx, it)\n        self.left_layout.addStretch(1)\n        self.right_layout.addStretch(1)\n        for idx, row in enumerate(self.rows):\n            row[\"edit\"].setText(self.inputs[idx] if idx < len(self.inputs) else \"\")\n        self.update_all()\n\n    def _group_card(self, parent_layout, gname):\n        card = QFrame()\n        card.setStyleSheet(\n            \"QFrame { background: #ffffff; border: 1px solid #dbe7f5; border-radius: 12px; }\")\n        shadow(card, blur=10, y=2, alpha=35)\n        v = QVBoxLayout(card)\n        v.setContentsMargins(10, 7, 10, 9)\n        v.setSpacing(4)\n        head = QLabel(gname if gname else \"―\")\n        head.setFixedHeight(24)\n        head.setStyleSheet(\"font-weight: 800; font-size: 13.5px; color: #1d4ed8;\")\n        v.addWidget(head)\n        parent_layout.addWidget(card)\n        return v\n\n    def _build_left_row(self, layout, idx, it):\n        row = QWidget()\n        row.setFixedHeight(54)\n        h = QHBoxLayout(row)\n        h.setContentsMargins(2, 2, 2, 2)\n        h.setSpacing(6)\n        field = QLabel(it[\"field\"])\n        field.setFixedWidth(92)\n        field.setStyleSheet(\"color: #475569; font-weight: 700; font-size: 12px;\")\n        value = ClickLabel(it[\"value\"])\n        value.setStyleSheet(\"font-weight: 700; font-size: 13.5px; color: #0f172a;\")\n        value.setWordWrap(True)\n        value.doubleClicked.connect(lambda i=idx: self.edit_source_value(i))\n        check = QLabel(\"\")\n        check.setFixedWidth(22)\n        check.setStyleSheet(\"font-size: 15px; font-weight: 800;\")\n        delete = QPushButton(\"✕\")\n        delete.setFixedSize(24, 24)\n        delete.setToolTip(self.t(\"btn_delete\"))\n        delete.setStyleSheet(\"QPushButton { border: none; color: #94a3b8; padding: 0; }\"\n                             \"QPushButton:hover { color: #dc2626; background: #fee2e2; }\")\n        delete.clicked.connect(lambda _=False, i=idx: self.delete_item(i))\n        h.addWidget(field)\n        h.addWidget(value, 1)\n        h.addWidget(check)\n        h.addWidget(delete)\n        layout.addWidget(row)\n        self.rows.append({\"row_widget\": row, \"value_label\": value, \"check_label\": check})\n\n    def _build_right_row(self, layout, idx, it):\n        row = QWidget()\n        row.setFixedHeight(54)\n        v = QVBoxLayout(row)\n        v.setContentsMargins(2, 1, 2, 1)\n        v.setSpacing(0)\n        h = QHBoxLayout()\n        h.setSpacing(6)\n        field = QLabel(it[\"field\"])\n        field.setFixedWidth(92)\n        field.setStyleSheet(\"color: #475569; font-weight: 700; font-size: 12px;\")\n        edit = QLineEdit()\n        edit.setPlaceholderText(it[\"value\"])\n        edit.textChanged.connect(lambda _t, i=idx: self.on_input_changed(i))\n        edit.installEventFilter(self)\n        mark = QLabel(\"\")\n        mark.setFixedWidth(22)\n        mark.setStyleSheet(\"font-size: 15px; font-weight: 800;\")\n        h.addWidget(field)\n        h.addWidget(edit, 1)\n        h.addWidget(mark)\n        v.addLayout(h)\n        reason = QLabel(\"\")\n        reason.setFixedHeight(15)\n        reason.setStyleSheet(\"color: #dc2626; font-size: 10.5px; padding-left: 98px;\")\n        v.addWidget(reason)\n        layout.addWidget(row)\n        self.rows[idx].update({\"edit\": edit, \"reason_label\": reason, \"mark_label\": mark})\n\n    # ------------------------------------------------------------ checking\n    def on_input_changed(self, idx):\n        self.check_row(idx)\n        self.update_stats_totals()\n        self._autosave_timer.start()\n\n    def check_row(self, idx):\n        if idx >= len(self.rows) or \"edit\" not in self.rows[idx]:\n            return\n        row = self.rows[idx]\n        it = self.items[idx]\n        typed = row[\"edit\"].text()\n        res = core.compare(it[\"value\"], typed)\n        st = res[\"status\"]\n        if st == \"match\":\n            row[\"edit\"].setStyleSheet(\n                \"QLineEdit { background: #dcfce7; border: 1.5px solid #22c55e; border-radius: 7px; padding: 5px 8px; }\")\n            row[\"mark_label\"].setText(\"✓\")\n            row[\"mark_label\"].setStyleSheet(\"color: #16a34a; font-size: 15px; font-weight: 800;\")\n            row[\"value_label\"].setStyleSheet(\n                \"font-weight: 700; font-size: 13.5px; color: #b6bdc9; text-decoration: line-through;\")\n            row[\"check_label\"].setText(\"✓\")\n            row[\"check_label\"].setStyleSheet(\"color: #16a34a; font-size: 15px; font-weight: 800;\")\n            row[\"reason_label\"].setText(\"\")\n            row[\"row_widget\"].setStyleSheet(\"\")\n        elif st == \"mismatch\":\n            row[\"edit\"].setStyleSheet(\n                \"QLineEdit { background: #fee2e2; border: 1.5px solid #ef4444; border-radius: 7px; padding: 5px 8px; }\")\n            row[\"mark_label\"].setText(\"✕\")\n            row[\"mark_label\"].setStyleSheet(\"color: #dc2626; font-size: 15px; font-weight: 800;\")\n            row[\"value_label\"].setStyleSheet(\n                \"font-weight: 800; font-size: 13.5px; color: #b91c1c;\")\n            row[\"check_label\"].setText(\"✕\")\n            row[\"check_label\"].setStyleSheet(\"color: #dc2626; font-size: 15px; font-weight: 800;\")\n            row[\"row_widget\"].setStyleSheet(\"background: #fef2f2; border-radius: 8px;\")\n            if res[\"reason\"] == \"digits\":\n                row[\"reason_label\"].setText(self.t(\"reason_digits\", src=res[\"src_digits\"], inp=res[\"in_digits\"]))\n            elif res[\"reason\"] == \"number\":\n                row[\"reason_label\"].setText(self.t(\"reason_number\", src=res[\"src_len\"], inp=res[\"in_len\"]))\n            else:\n                row[\"reason_label\"].setText(self.t(\"reason_text\", src=res[\"src_len\"], inp=res[\"in_len\"], pos=res[\"diff_pos\"]))\n        else:\n            row[\"edit\"].setStyleSheet(\"\")\n            row[\"mark_label\"].setText(\"\")\n            row[\"value_label\"].setStyleSheet(\"font-weight: 700; font-size: 13.5px; color: #0f172a;\")\n            row[\"check_label\"].setText(\"\")\n            row[\"reason_label\"].setText(\"\")\n            row[\"row_widget\"].setStyleSheet(\"\")\n\n    def update_stats_totals(self):\n        inputs = self.current_inputs()\n        stats = core.compute_stats(self.items, inputs)\n        self.stat_labels[\"stat_total\"].setText(self.t(\"stat_total\", count=stats[\"total\"]))\n        self.stat_labels[\"stat_done\"].setText(self.t(\"stat_done\", count=stats[\"done\"]))\n        self.stat_labels[\"stat_remaining\"].setText(self.t(\"stat_remaining\", count=stats[\"remaining\"]))\n        self.stat_labels[\"stat_mismatch\"].setText(self.t(\"stat_mismatch\", count=stats[\"mismatch\"]))\n        pct = int(stats[\"done\"] * 100 /   lower-case latin. Used only for comparison, never shown to the user.\"\"\"\n    if text is None:\n        return \"\"\n    s = str(text).translate(_FW_TABLE)\n    s = s.replace(\"　\", \" \")\n    s = re.sub(r\"\\s+\", \" \", s).strip()\n    return s.lower()\n\n\n_NUMBER_STRIP = [\"¥\", \"$\", \"€\", \"£\", \"￥\", \"円\", \" \"]\n\n\ndef parse_number(text):\n    \"\"\"Return Decimal if the (normalized) text is a number, else None.\n    Thousands separators ( , ) and a trailing 円 / currency symbol are ignored.\"\"\"\n    s = normalize(text)\n    if not s:\n        return None\n    s = s.replace(\",\", \"\").replace(\"，\", \"\")\n    for ch in _NUMBER_STRIP:\n        s = s.replace(ch, \"\")\n    if s.endswith(\"円\"):\n        s = s[:-1]\n    if not s:\n        return None\n    if not re.fullmatch(r\"[+-]?(\\d+\\.?\\d*|\\.\\d+)\", s):\n        return None\n    try:\n        return Decimal(s)\n    except InvalidOperation:\n        return None\n\n\ndef digit_count(text):\n    \"\"\"Number of digits in the numeric text (sign/point/separators ignored).\"\"\"\n    n = parse_number(text)\n    if n is None:\n        return None\n    s = normalize(text).replace(\",\", \"\").replace(\" \", \"\")\n    return len(re.sub(r\"[^0-9]\", \"\", s))\n\n\ndef is_numeric(text):\n    return parse_number(text) is not None\n\n\n# ---------------------------------------------------------------- compare\n\ndef compare(source, typed):\n    \"\"\"Return dict(status, reason, src_digits, in_digits, src_len, in_len, diff_pos).\n    status: 'match' | 'mismatch' | 'empty'\"\"\"\n    out = {\"status\": \"empty\", \"reason\": \"\", \"src_digits\": None, \"in_digits\": None,\n           \"src_len\": 0, \"in_len\": 0, \"diff_pos\": None}\n    ns, nt = normalize(source), normalize(typed)\n    if nt == \"\":\n        return out\n    out[\"src_len\"], out[\"in_len\"] = len(ns), len(nt)\n    sn, tn = parse_number(source), parse_number(typed)\n    if sn is not None and tn is not None:\n        if sn == tn:\n            out[\"status\"] = \"match\"\n            return out\n        out[\"status\"] = \"mismatch\"\n        out[\"src_digits\"] = digit_count(source)\n        out[\"in_digits\"] = digit_count(typed)\n        out[\"reason\"] = \"digits\" if out[\"src_digits\"] != out[\"in_digits\"] else \"number\"\n        return out\n    if ns == nt:\n        out[\"status\"] = \"match\"\n        return out\n    out[\"status\"] = \"mismatch\"\n    out[\"reason\"] = \"text\"\n    for i, (a, b) in enumerate(zip(ns, nt)):\n        if a != b:\n            out[\"diff_pos\"] = i + 1\n            break\n    if out[\"diff_pos\"] is None:\n        out[\"diff_pos\"] = min(len(ns), len(nt)) + 1\n    return out\n\n\ndef compute_stats(items, inputs):\n    \"\"\"total / done(match) / remaining(empty) / mismatch counts.\"\"\"\n    total = len(items)\n    done = mismatch = remaining = 0\n    for it, typed in zip(items, inputs):\n        st = compare(it[\"value\"], typed)[\"status\"]\n        if st == \"match\":\n            done += 1\n        elif st == \"mismatch\":\n            mismatch += 1\n        else:\n            remaining += 1\n    # items beyond inputs list count as remaining\n    remaining += max(0, total - len(inputs))\n    return {\"total\": total, \"done\": done, \"remaining\": remaining, \"mismatch\": mismatch}\n\n\ndef field_totals(items, inputs):\n    \"\"\"Per field-label totals for numeric source values.\n    Returns list of {field, source_sum, typed_sum, match} (Decimal sums).\"\"\"\n    order, agg = [], {}\n    for idx, it in enumerate(items):\n        sn = parse_number(it[\"value\"])\n        if sn is None:\n            continue\n        f = it[\"field\"]\n        if f not in agg:\n            agg[f] = {\"field\": f, \"source_sum\": Decimal(0), \"typed_sum\": Decimal(0)}\n            order.append(f)\n        agg[f][\"source_sum\"] += sn\n        typed = inputs[idx] if idx < len(inputs) else \"\"\n        tn = parse_number(typed)\n        if tn is not None:\n            agg[f][\"typed_sum\"] += tn\n    out = []\n    for f in order:\n        a = agg[f]\n        a[\"match\"] = a[\"source_sum\"] == a[\"typed_sum\"]\n        out.append(a)\n    return out\n\n\ndef fmt_num(d):\n    \"\"\"Decimal -> plain string without trailing zeros.\"\"\"\n    if d == d.to_integral_value():\n        return str(int(d))\n    return format(d.normalize(), \"f\")\n\n\ndef build_tsv(items, inputs):\n    lines = [\"group\\tfield\\tvalue\"]\n    for idx, it in enumerate(items):\n        typed = inputs[idx] if idx < len(inputs) else \"\"\n        lines.append(\"\\t\".join([it[\"group\"], it[\"field\"], typed]))\n    return \"\\r\\n\".join(lines) + \"\\r\\n\"\n\n\n# ---------------------------------------------------------------- extract\n\ndef _looks_numeric(s):\n    return parse_number(s) is not None\n\n\ndef table_to_items(rows):\n    \"\"\"rows: list of list[str]. First row = header when it has a non-numeric\n    cell. First column also becomes an item (nothing is dropped); the row's\n    group label is its first cell.\"\"\"\n    rows = [[(\"\" if c is None else str(c)).strip() for c in r] for r in rows]\n    rows = [r for r in rows if any(c for c in r)]\n    if not rows:\n        return []\n    items = []\n    first = rows[0]\n    has_header = any(c and not _looks_numeric(c) for c in first) and len(rows) > 1\n    if has_header:\n        header, data = first, rows[1:]\n    else:\n        header = [f\"列{i+1}\" for i in range(len(first))]\n        data = rows\n    width = max(len(header), max((len(r) for r in data), default=0))\n    header += [f\"列{i+1}\" for i in range(len(header), width)]\n    for r in data:\n        r = r + [\"\"] * (width - len(r))\n        group = r[0]\n        for col in range(width):\n            if r[col] == \"\":\n                continue\n            items.append({\"group\": group, \"field\": header[col], \"value\": r[col]})\n    return items\n\n\n_KV_RE = re.compile(r\"^(.{1,40}?)\\s*[:：]\\s*(.+)$\")\n\n\ndef lines_to_items(lines):\n    items, table_rows = [], []\n\n    def flush_table():\n        nonlocal table_rows\n        if table_rows:\n            items.extend(table_to_items(table_rows))\n            table_rows = []\n\n    for n, raw in enumerate(lines, 1):\n        line = (raw or \"\").strip()\n        if not line:\n            continue\n        cells = None\n        if \"\\t\" in line:\n            cells = line.split(\"\\t\")\n        elif \",\" in line:\n            cells = next(csv.reader([line]))\n        elif re.search(r\"\\S\\s{2,}\\S\", line):\n            cells = re.split(r\"\\s{2,}\", line)\n        if cells and len([c for c in cells if c.strip()]) >= 2:\n            table_rows.append([c.strip() for c in cells])\n            continue\n        flush_table()\n        m = _KV_RE.match(line)\n        if m:\n            items.append({\"group\": \"\", \"field\": m.group(1).strip(), \"value\": m.group(2).strip()})\n        else:\n            items.append({\"group\": \"\", \"field\": f\"行{n}\", \"value\": line})\n    flush_table()\n    return items\n\n\ndef _decode(data):\n    for enc in (\"utf-8-sig\", \"cp932\", \"utf-8\"):\n        try:\n            return data.decode(enc)\n        except (UnicodeDecodeError, LookupError):\n            continue\n    return data.decode(\"utf-8\", errors=\"replace\")\n\n\ndef _sniff_delimiter(text):\n    first = text.splitlines()[0] if text.splitlines() else \"\"\n    best, bestn = \",\", 0\n    for d in (\",\", \"\\t\", \";\"):\n        n = first.count(d)\n        if n > bestn:\n            best, bestn = d, n\n    return best\n\n\ndef extract_text(text):\n    \"\"\"TXT / pasted text / OCR text.\"\"\"\n    if not text or not text.strip():\n        return []\n    lines = text.splitlines()\n    # If most non-empty lines contain a delimiter, treat as a table.\n    nonempty = [ln for ln in lines if ln.strip()]\n    delim_lines = sum(1 for ln in nonempty if (\"\\t\" in ln or \",\" in ln or \";\" in ln))\n    if nonempty and delim_lines >= max(1, len(nonempty) // 2) and delim_lines >= 2:\n        delim = _sniff_delimiter(text)\n        rows = list(csv.reader(io.StringIO(text), delimiter=delim))\n        items = table_to_items(rows)\n        if items:\n            return items\n    return lines_to_items(lines)\n\n\ndef extract_csv(data_bytes):\n    return extract_text(_decode(data_bytes))\n\n\ndef extract_xlsx(path):\n    from openpyxl import load_workbook\n    wb = load_workbook(path, read_only=True, data_only=True)\n    ws = wb.active\n    rows = []\n    for row in ws.iter_rows(values_only=True):\n        rows.append([(\"\" if c is None else _fmt_cell(c)) for c in row])\n    wb.close()\n    return table_to_items(rows)\n\n\ndef _fmt_cell(c):\n    if isinstance(c, float) and c == int(c):\n        return str(int(c))\n    return str(c)\n\n\ndef extract_pdf(path):\n    import fitz  # PyMuPDF\n    doc = fitz.open(path)\n    lines = []\n    for page in doc:\n        lines.extend(page.get_text().splitlines())\n    doc.close()\n    return lines_to_items(lines)\n\n\n# ---------------------------------------------------------------- OCR\n# Tesseract resolution order:\n#   1. environment override TRANSCRIBEGUARD_TESSERACT_CMD (or ..._TESSERACT)\n#   2. bundled copy below <base>/tesseract, where <base> is the\n#      executable's folder when frozen, else this file's folder.  Windows\n#      uses tesseract.exe; macOS deliberately ignores that Windows binary\n#      and only accepts an extensionless Unix executable.\n#   3. on macOS, the standard Homebrew locations.  These absolute paths\n#      matter because Finder-launched apps do not inherit a login shell PATH.\n#   4. system PATH (\"tesseract\")\n# Tessdata mirrors it: TRANSCRIBEGUARD_TESSDATA_DIR override, then\n# <base>/tesseract/tessdata, then <base>/tessdata, else tesseract's default.\n\n_TESS_ENV_VARS = (\"TRANSCRIBEGUARD_TESSERACT_CMD\", \"TRANSCRIBEGUARD_TESSERACT\")\n_MAC_TESSERACT_PATHS = (\n    \"/opt/homebrew/bin/tesseract\",  # Homebrew on Apple Silicon\n    \"/usr/local/bin/tesseract\",     # Homebrew on Intel Macs\n)\n\nUI_TO_TESS = {\n    \"ja\": \"jpn\", \"en\": \"eng\", \"es\": \"spa\", \"zh_CN\": \"chi_sim\", \"fr\": \"fra\",\n    \"de\": \"deu\", \"pt\": \"por\", \"ru\": \"rus\", \"it\": \"ita\", \"tr\": \"tur\",\n    \"ar\": \"ara\", \"id\": \"ind\", \"ko\": \"kor\",\n}\n\n\ndef _is_frozen(frozen):\n    if frozen is not None:\n        return frozen\n    return bool(getattr(sys, \"frozen\", False))\n\n\ndef _base_dirs(frozen=None, exe_dir=None, app_dir=None):\n    dirs = []\n    if _is_frozen(frozen):\n        dirs.append(exe_dir or os.path.dirname(os.path.abspath(sys.executable)))\n    dirs.append(app_dir or os.path.dirname(os.path.abspath(__file__)))\n    out = []\n    for d in dirs:\n        if d and d not in out:\n            out.append(d)\n    return out\n\n\ndef _platform_name(platform):\n    return sys.platform if platform is None else platform\n\n\ndef tesseract_candidates(env=None, frozen=None, exe_dir=None, app_dir=None,\n                         platform=None):\n    env = os.environ if env is None else env\n    platform = _platform_name(platform)\n    cands = []\n    for var in _TESS_ENV_VARS:\n        if env.get(var):\n            cands.append(env[var])\n            break\n    for base in _base_dirs(frozen, exe_dir, app_dir):\n        # A bundled Windows tesseract.exe cannot run on macOS, so do not\n        # offer it as a candidate there.  Windows keeps its original order.\n        if platform != \"darwin\":\n            cands.append(os.path.join(base, \"tesseract\", \"tesseract.exe\"))\n        cands.append(os.path.join(base, \"tesseract\", \"tesseract\"))\n    if platform == \"darwin\":\n        cands.extend(_MAC_TESSERACT_PATHS)\n    return cands\n\n\ndef find_tesseract(env=None, frozen=None, exe_dir=None, app_dir=None,\n                   which=None, platform=None):\n    \"\"\"Path of the tesseract executable to use, or None if not found.\"\"\"\n    which = shutil.which if which is None else which\n    for cand in tesseract_candidates(env, frozen, exe_dir, app_dir,\n                                     platform=platform):\n        if cand and os.path.isfile(cand):\n            return cand\n    return which(\"tesseract\") or which(\"tesseract.exe\")\n\n\ndef tessdata_candidates(env=None, frozen=None, exe_dir=None, app_dir=None):\n    env = os.environ if env is None else env\n    cands = []\n    if env.get(\"TRANSCRIBEGUARD_TESSDATA_DIR\"):\n        cands.append(env[\"TRANSCRIBEGUARD_TESSDATA_DIR\"])\n    for base in _base_dirs(frozen, exe_dir, app_dir):\n        cands.append(os.path.join(base, \"tesseract\", \"tessdata\"))\n        cands.append(os.path.join(base, \"tessdata\"))\n    return cands\n\n\ndef find_tessdata_dir(env=None, frozen=None, exe_dir=None, app_dir=None):\n    \"\"\"Folder holding .traineddata files for the bundled copy, or None.\"\"\"\n    for cand in tessdata_candidates(env, frozen, exe_dir, app_dir):\n        try:\n            if os.path.isdir(cand) and any(\n                    f.endswith(\".traineddata\") for f in os.listdir(cand)):\n                return cand\n        except OSError:\n            continue\n    return None\n\n\ndef available_tess_langs(tessdata_dir):\n    \"\"\"Set of language codes with data in tessdata_dir, or None if unknown.\"\"\"\n    if not tessdata_dir:\n        return None\n    try:\n        return {f[: -len(\".traineddata\")] for f in os.listdir(tessdata_dir)\n                if f.endswith(\".traineddata\")}\n    except OSError:\n        return None\n\n\ndef ocr_lang_string(ui_lang=\"ja\", tessdata_dir=None):\n    \"\"\"'jpn+eng' plus the tesseract code for the UI language when different.\n    Codes without data in a known tessdata folder are dropped.\"\"\"\n    codes = [\"jpn\", \"eng\"]\n    extra = UI_TO_TESS.get(ui_lang or \"ja\")\n    if extra and extra not in codes:\n        codes.append(extra)\n    avail = available_tess_langs(tessdata_dir)\n    if avail is not None:\n        codes = [c for c in codes if c in avail]\n    return \"+\".join(codes) if codes else \"eng\"\n\n\ndef ocr_available():\n    return find_tesseract() is not None\n\n\ndef _run_tesseract(exe, image_path, langs, tessdata_dir):\n    cmd = [exe, image_path, \"stdout\", \"-l\", langs, \"--psm\", \"6\"]\n    if tessdata_dir:\n        cmd += [\"--tessdata-dir\", tessdata_dir]\n    kwargs = {\"capture_output\": True, \"timeout\": 180}\n    if os.name == \"nt\":\n        kwargs[\"creationflags\"] = getattr(subprocess, \"CREATE_NO_WINDOW\", 0)\n    proc = subprocess.run(cmd, **kwargs)\n    if proc.returncode != 0:\n        raise RuntimeError(proc.stderr.decode(\"utf-8\", \"replace\")[:300])\n    return proc.stdout.decode(\"utf-8\", \"replace\")\n\n\ndef extract_image(path, ui_lang=\"ja\"):\n    \"\"\"Returns (items, notice) where notice is 'ocr_unavailable' or ''.\"\"\"\n    exe = find_tesseract()\n    if exe is None:\n        return [], \"ocr_unavailable\"\n    from PIL import Image\n    tessdata_dir = find_tessdata_dir()\n    try:\n        img = Image.open(path)\n        img_format = (img.format or \"\").upper()\n        img.load()\n    except Exception:\n        return [], \"\"\n    tmp = None\n    try:\n        if img_format not in (\"PNG\", \"JPEG\", \"TIFF\", \"BMP\"):\n            fd, tmp = tempfile.mkstemp(suffix=\".png\")\n            os.close(fd)\n            img.convert(\"RGB\").save(tmp)\n            image_path = tmp\n        else:\n            image_path = path\n        lang_options = []\n        for langs in (ocr_lang_string(ui_lang, tessdata_dir), \"jpn+eng\", \"eng\"):\n            if langs and langs not in lang_options:\n                lang_options.append(langs)\n        for langs in lang_options:\n            try:\n                text = _run_tesseract(exe, image_path, langs, tessdata_dir)\n            except Exception:\n                text = \"\"\n            if text.strip():\n                return extract_text(text), \"\"\n        return [], \"\"\n    finally:\n        if tmp:\n            try:\n                os.remove(tmp)\n            except OSError:\n                pass\n\n\ndef extract_file(path, ui_lang=\"ja\"):\n    \"\"\"Dispatch by extension. Returns (items, notice).\n    ui_lang selects the OCR language for images (see UI_TO_TESS).\"\"\"\n    ext = path.lower().rsplit(\".\", 1)[-1] if \".\" in path else \"\"\n    if ext == \"pdf\":\n        return extract_pdf(path), \"\"\n    if ext == \"xlsx\":\n        return extract_xlsx(path), \"\"\n    if ext == \"csv\":\n        with open(path, \"rb\") as fh:\n            return extract_csv(fh.read()), \"\"\n    if ext == \"txt\":\n        with open(path, \"rb\") as fh:\n            return extract_text(_decode(fh.read())), \"\"\n    if ext in (\"png\", \"jpg\", \"jpeg\", \"bmp\", \"gif\", \"webp\"):\n        return extract_image(path, ui_lang)\n    raise ValueError(f\"unsupported extension: {ext}\")\n\n\n# ---------------------------------------------------------------- sample\n\ndef sample_items():\n    rows = [\n        (\"ノート A5\", \"10\", \"150\"),\n        (\"ボールペン\", \"20\", \"120\"),\n        (\"コピー用紙 A4\", \"5\", \"480\"),\n        (\"クリアファイル\", \"12\", \"80\"),\n    ]\n    items = [\n        {\"group\": \"請求書\", \"field\": \"請求番号\", \"value\": \"INV-2026-001\"},\n        {\"group\": \"請求書\", \"field\": \"取引先\", \"value\": \"サンプル商事\"},\n    ]\n    total = 0\n    for name, qty, price in rows:\n        amount = int(qty) * int(price)\n        total += amount\n        items.append({\"group\": name, \"field\": \"数量\", \"value\": qty})\n        items.append({\"group\": name, \"field\": \"単価\", \"value\": price})\n        items.append({\"group\": name, \"field\": \"金額\", \"value\": str(amount)})\n    items.append({\"group\": \"合計\", \"field\": \"合計\", \"value\": str(total)})\n    return items\n\n\n# ---------------------------------------------------------------- session\n\ndef session_dict(items, inputs, lang=\"ja\", source_name=\"\"):\n    return {\"version\": 1, \"lang\": lang, \"source_name\": source_name,\n            \"items\": items, \"inputs\": list(inputs)}\n\n\ndef session_from_dict(d):\n    items = [{\"group\": str(i.get(\"group\", \"\")), \"field\": str(i.get(\"field\", \"\")),\n              \"value\": str(i.get(\"value\", \"\"))} for i in d.get(\"items\", [])]\n    inputs = [str(x) for x in d.get(\"inputs\", [])]\n    inputs += [\"\"] * (len(items) - len(inputs))\n    return items, inputs[:len(items)], d.get(\"lang\", \"ja\"), d.get(\"source_name\", \"\")\n"}, {"p": "i18n.py", "s": 40937, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"i18n for TranscribeGuard - 13 languages, same structure/order as the\nuser's other apps (DropLauncher / ContextStruct). Sample data values are\ncontent, not UI strings, and are not translated here.\"\"\"\n\nLANG_ORDER = [\"ja\", \"en\", \"es\", \"zh_CN\", \"fr\", \"de\", \"pt\", \"ru\", \"it\", \"tr\", \"ar\", \"id\", \"ko\"]\nLANG_NAMES = {\n    \"ja\": \"日本語\", \"en\": \"English\", \"es\": \"Español\", \"zh_CN\": \"简体中文\", \"fr\": \"Français\",\n    \"de\": \"Deutsch\", \"pt\": \"Português\", \"ru\": \"Русский\", \"it\": \"Italiano\", \"tr\": \"Türkçe\",\n    \"ar\": \"العربية\", \"id\": \"Bahasa Indonesia\", \"ko\": \"한국어\",\n}\nRTL_LANGS = {\"ar\"}\n\nJA = {\n    \"app_title\": \"転記見守り君\",\n    \"app_subtitle\": \"元と照合しながら、人の手入力を見守ります\",\n    \"lang_label\": \"表示言語:\",\n    \"stat_total\": \"全{count}項目\",\n    \"stat_done\": \"完了 {count}\",\n    \"stat_remaining\": \"未入力が{count}件\",\n    \"stat_mismatch\": \"不一致 {count}\",\n    \"btn_open\": \"📂 ファイルを開く\",\n    \"btn_sample\": \"🧾 サンプルで試す\",\n    \"btn_paste\": \"📋 テキストを貼る\",\n    \"btn_add\": \"＋ 項目を追加\",\n    \"btn_clear_inputs\": \"入力をクリア\",\n    \"drop_hint\": \"ここに PDF / Excel / CSV / TXT / 画像 をドロップしても読み込めます\",\n    \"left_title\": \"元の項目（ダブルクリックで値を修正）\",\n    \"right_title\": \"入力欄（Enterで次へ）\",\n    \"empty_left\": \"ファイルを開くか、サンプルで試してください。\\n元の項目がここに分解されて表示されます。\",\n    \"totals_title\": \"合計チェック（項目名ごと）\",\n    \"totals_field\": \"項目名\",\n    \"totals_source\": \"元の合計\",\n    \"totals_typed\": \"入力の合計\",\n    \"completion\": \"🎉 すべて入力済みで、不一致は0件です。お疲れさまでした。\",\n    \"btn_copy_tsv\": \"📋 結果をTSVでコピー\",\n    \"btn_save_xlsx\": \"Excelで保存\",\n    \"btn_save_csv\": \"CSVで保存\",\n    \"btn_save_session\": \"作業を保存\",\n    \"btn_load_session\": \"作業を開く\",\n    \"footer_note\": \"このアプリは照合と見守りだけを行います。会社のシステムへの転記（最終作業）は、必ず人自身が行ってください。\",\n    \"reason_digits\": \"桁数が違います（元 {src}桁 ／ 入力 {inp}桁）\",\n    \"reason_number\": \"数値が違います（長さ 元{src}文字 ／ 入力{inp}文字）\",\n    \"reason_text\": \"違います（元 {src}文字 ／ 入力 {inp}文字、最初の違いは{pos}文字目）\",\n    \"ocr_notice\": \"このパソコンでは文字認識（OCR）用の Tesseract が見つからないため、画像からは自動で読み取れませんでした。「項目を追加」から手で入力できます。\",\n    \"copied\": \"結果をクリップボードにコピーしました\",\n    \"saved\": \"保存しました\",\n    \"open_title\": \"元のファイルを選択\",\n    \"open_filter\": \"元データ (*.pdf *.xlsx *.csv *.txt *.png *.jpg *.jpeg)\",\n    \"save_xlsx_title\": \"Excelで保存\",\n    \"save_csv_title\": \"CSVで保存\",\n    \"save_session_title\": \"作業を保存\",\n    \"load_session_title\": \"作業を開く\",\n    \"paste_title\": \"テキストを貼って読み込む\",\n    \"paste_hint\": \"請求書などのテキストを貼り付けてください（タブ・カンマ区切りや「項目: 値」の行に対応）\",\n    \"add_title\": \"項目を追加\",\n    \"add_group\": \"グループ（行の名前）\",\n    \"add_field\": \"項目名\",\n    \"add_value\": \"元の値\",\n    \"btn_ok\": \"OK\",\n    \"btn_cancel\": \"キャンセル\",\n    \"btn_delete\": \"削除\",\n    \"edit_value_title\": \"元の値を修正\",\n    \"edit_value_label\": \"値:\",\n    \"load_error\": \"読み込めませんでした: {error}\",\n    \"no_items_from_file\": \"このファイルから項目を取り出せませんでした。「項目を追加」から手で入力できます。\",\n}\n\nEN = {\n    \"app_title\": \"TranscribeGuard\",\n    \"app_subtitle\": \"Watches your manual transcription against the source\",\n    \"lang_label\": \"Language:\",\n    \"stat_total\": \"{count} items\",\n    \"stat_done\": \"Done {count}\",\n    \"stat_remaining\": \"{count} remaining\",\n    \"stat_mismatch\": \"Mismatch {count}\",\n    \"btn_open\": \"📂 Open file\",\n    \"btn_sample\": \"🧾 Try sample\",\n    \"btn_paste\": \"📋 Paste text\",\n    \"bt
