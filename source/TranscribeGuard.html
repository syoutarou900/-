R용 Tesseract를 찾지 못해 이미지를 자동으로 읽지 못했습니다. 「항목 추가」에서 직접 입력할 수 있습니다.\",\n    \"copied\": \"결과를 클립보드에 복사했습니다\",\n    \"saved\": \"저장했습니다\",\n    \"open_title\": \"원본 파일 선택\",\n    \"open_filter\": \"원본 데이터 (*.pdf *.xlsx *.csv *.txt *.png *.jpg *.jpeg)\",\n    \"save_xlsx_title\": \"Excel로 저장\",\n    \"save_csv_title\": \"CSV로 저장\",\n    \"save_session_title\": \"작업 저장\",\n    \"load_session_title\": \"작업 열기\",\n    \"paste_title\": \"텍스트를 붙여넣어 불러오기\",\n    \"paste_hint\": \"청구서 같은 텍스트를 붙여넣으세요 (탭·쉼표 구분 또는 「항목: 값」 줄 지원)\",\n    \"add_title\": \"항목 추가\",\n    \"add_group\": \"그룹 (행 이름)\",\n    \"add_field\": \"항목명\",\n    \"add_value\": \"원본 값\",\n    \"btn_ok\": \"OK\",\n    \"btn_cancel\": \"취소\",\n    \"btn_delete\": \"삭제\",\n    \"edit_value_title\": \"원본 값 수정\",\n    \"edit_value_label\": \"값:\",\n    \"load_error\": \"불러오지 못했습니다: {error}\",\n    \"no_items_from_file\": \"이 파일에서 항목을 추출하지 못했습니다. 「항목 추가」에서 직접 입력할 수 있습니다.\",\n}\n\nTRANSLATIONS = {\n    \"ja\": JA, \"en\": EN, \"es\": ES, \"zh_CN\": ZH, \"fr\": FR, \"de\": DE, \"pt\": PT,\n    \"ru\": RU, \"it\": IT, \"tr\": TR, \"ar\": AR, \"id\": ID, \"ko\": KO,\n}\n\n\ndef tr(lang, key, **kw):\n    text = TRANSLATIONS.get(lang, JA).get(key) or JA.get(key, key)\n    if kw:\n        try:\n            return text.format(**kw)\n        except (KeyError, IndexError):\n            return text\n    return text\n"}, {"p": "MakeApp-Mac.command", "s": 3142, "l": "bash", "c": "#!/bin/bash\n# Build TranscribeGuard.app for macOS with PyInstaller.\n# A universal2 build is attempted first. If the installed Python or\n# libraries cannot produce universal2, the script retries for this Mac's\n# native CPU architecture.\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\ncd \"$SCRIPT_DIR\" || exit 1\n\npause_and_exit() {\n  echo\n  echo \"$1\"\n  echo \"Press Enter to close this window.\"\n  read -r _ || true\n  exit 1\n}\n\nif ! command -v python3 >/dev/null 2>&1; then\n  cat <<'EOF'\nPython 3 was not found.\n\nInstall Python 3.10 or later in either of these ways:\n  1. Download the macOS installer from https://www.python.org/downloads/macos/\n  2. If Homebrew is already installed, run: brew install python\n\nThen double-click MakeApp-Mac.command again.\nEOF\n  pause_and_exit \"Python 3 is required.\"\nfi\n\nPYTHON_BIN=\"$(command -v python3)\"\nif ! \"$PYTHON_BIN\" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' >/dev/null 2>&1; then\n  pause_and_exit \"Python 3.10 or later is required. Please install a current version from python.org.\"\nfi\n\nVENV_DIR=\"$SCRIPT_DIR/.venv\"\nVENV_PY=\"$VENV_DIR/bin/python\"\n\nif [ ! -x \"$VENV_PY\" ]; then\n  echo \"Creating the TranscribeGuard Python environment...\"\n  \"$PYTHON_BIN\" -m venv \"$VENV_DIR\" || pause_and_exit \"Could not create the Python virtual environment.\"\nfi\n\necho \"Installing application and build dependencies...\"\n\"$VENV_PY\" -m pip install --upgrade pip || pause_and_exit \"Could not update pip. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install -r \"$SCRIPT_DIR/requirements.txt\" || pause_and_exit \"Could not install the required Python packages. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install --upgrade pyinstaller || pause_and_exit \"Could not install PyInstaller. Check the network connection and try again.\"\n\nCOMMON_ARGS=(\n  --noconfirm\n  --clean\n  --windowed\n  --name TranscribeGuard --icon assets/icon.icns\n  --exclude-module tkinter\n  --exclude-module unittest\n  --exclude-module pytest\n)\n\nBUILD_ARCH=\"\"\necho\necho \"Trying a universal2 build for Intel and Apple Silicon Macs...\"\nif \"$VENV_PY\" -m PyInstaller \"${COMMON_ARGS[@]}\" --target-arch universal2 \"$SCRIPT_DIR/app.py\"; then\n  BUILD_ARCH=\"universal2 (Intel and Apple Silicon)\"\nelse\n  echo\n  echo \"The universal2 build did not succeed. Retrying for this Mac's native architecture...\"\n  NATIVE_ARCH=\"$(uname -m)\"\n  if \"$VENV_PY\" -m PyInstaller \"${COMMON_ARGS[@]}\" \"$SCRIPT_DIR/app.py\"; then\n    BUILD_ARCH=\"native ($NATIVE_ARCH)\"\n  else\n    pause_and_exit \"PyInstaller could not build TranscribeGuard.app.\"\n  fi\nfi\n\nAPP_PATH=\"$SCRIPT_DIR/dist/TranscribeGuard.app\"\nif [ ! -d \"$APP_PATH\" ]; then\n  pause_and_exit \"The build finished without creating dist/TranscribeGuard.app.\"\nfi\n\necho\necho \"Build complete.\"\necho \"Created: $APP_PATH\"\necho \"Architecture: $BUILD_ARCH\"\necho\necho \"This app is unsigned. The first time you open it, use Finder:\"\necho \"right-click TranscribeGuard.app, choose Open, and confirm Open.\"\necho \"For OCR, install Tesseract separately with Homebrew:\"\necho \"  brew install tesseract tesseract-lang\"\necho\necho \"Press Enter to close this window.\"\nread -r _ || true\n"}, {"p": "README-SOURCE.txt", "s": 1155, "l": "plaintext", "c": "TranscribeGuard - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of TranscribeGuard, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-TranscribeGuard.bat (or: python app.py)\n- Mac: Start-TranscribeGuard.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\nNotes:\nOCR機能にはTesseract（別途インストール）が必要です。配布中のアプリ版には同梱済みです。\nThe OCR features require Tesseract (installed separately). The distributed app builds include it.\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 10563, "l": "plaintext", "c": "転記見守り君 (TranscribeGuard)\n================================================\n\n※アプリ名は「転記見守り君」です。英語の\nTranscribeGuard はファイル名用の英字名です。\n\nこれは何をするアプリ？\n------------------------------------------------\n請求書や注文書を見ながら、Excelや会社のシステムへ手で打ち直す作業を\n「見守る」Windows / Mac デスクトップアプリです。完全自動化はしません。\nアプリは下準備・照合・チェックまでを行い、最後の転記（会社のシステムへ\n入力する作業）は、必ず人自身が行う設計です。\n\n・元ファイル（PDF / Excel / CSV / TXT / 画像）を読み込むと、左側に\n  項目ごとに分解して表示します\n・右側の入力欄に打ち込むたびに、元の値とその場で照合します\n  - 合えば、左の項目が薄くフェードしてチェックが付きます\n  - 違えば、赤くなって理由が出ます（数字は「元 ○桁 ／ 入力 ○桁」）\n・数字は項目名ごとの合計も照合し、下の表で食い違いを赤く示します\n・画面の上に「未入力が○件」と残数が常に出ます\n・全部合えば、結果をTSVでコピーしてExcelや会社のシステムに貼れます\n  （Excel / CSV での保存、作業の保存・再開もできます）\n\n今回の改良点（高速起動＋OCR内蔵版）\n------------------------------------------------\n・起動方式を「フォルダー方式」に変え、起動が大幅に速くなりました。\n  以前の1ファイル方式は、起動のたびに中身を展開する待ち時間があり\n  ましたが、フォルダー方式ではその展開が不要です\n・画像からの文字読み取り（OCR）のエンジン「Tesseract」を、EXE版には\n  最初から組み込みました。別途インストールは不要です。対応する読み\n  取り言語は、画面の13言語と同じ13言語分を同梱しています\n  （日本語＋英語が基本で、画面の表示言語に合わせた言語も使います）\n\nEXE版の使い方（フォルダー方式）\n------------------------------------------------\n1. TranscribeGuard-EXE.zip をダウンロードします（分割されている場合は\n   結合用バッチで1つのZIPに戻します）\n2. ZIPを「すべて展開」します\n3. 出てきた「TranscribeGuard」フォルダーを開き、中の\n   TranscribeGuard.exe をダブルクリックします\n・このフォルダーは丸ごと1つのアプリです。TranscribeGuard.exe だけを\n  フォルダーの外へ移動すると起動できません。_internal フォルダーと\n  tesseract フォルダーは、必ず exe と同じ場所に置いてください\n・移動したいときは、TranscribeGuard フォルダーごと移動してください\n\n初めての起動手順（Windows・ソース版ZIPの場合）\n------------------------------------------------\n1. TranscribeGuard-Source.zip をダウンロードします\n2. ZIPを「すべて展開」します（展開せずに中のファイルを実行しないで\n   ください）\n3. 展開したフォルダーを開き、Start-TranscribeGuard.bat を\n   ダブルクリックします\n4. 初回だけ、必要なライブラリを自動でダウンロード・インストール\n   します。黒い画面（コマンド画面）はアプリ使用中は開いたままに\n   してください。閉じるとアプリも終了します\n5. 2回目以降は数秒で起動します\n・ソース版で画像のOCRを使いたい場合は、EXE版に同梱されている\n  tesseract フォルダーを、app.py と同じ場所に置くか、Tesseract 本体を\n  パソコンにインストールしてください。どちらも無い場合は、画面に\n  その旨が表示され、項目を手で追加して使う形になります\n\nMacでの使い方（ソース版ZIPから .app を作る方法）\n------------------------------------------------\n対応環境は macOS 11（Big Sur）以降です。Mac版は、配布ZIPをダウン\nロードした後、Mac自身でアプリを組み立てる方式です。\n\n1. TranscribeGuard-Source.zip をダウンロードし、ZIPを展開します\n2. 展開したフォルダーで MakeApp-Mac.command をダブルクリックします\n   （macOSのセキュリティ確認で開けない場合は、ファイルを右クリック\n   して「開く」を選びます）\n3. Python 3.10以降が無い場合は、画面の案内に従い python.org の\n   macOSインストーラー、または Homebrew で Python を入れてから、\n   もう一度 MakeApp-Mac.command を実行します\n4. 初回だけ、必要なPythonライブラリと PyInstaller を自動でダウン\n   ロード・インストールします\n5. 完成すると、同じフォルダーの dist の中に TranscribeGuard.app が\n   できます。以後はその .app を起動してください\n\n・MakeApp-Mac.command は、まず Intel Mac と Apple Silicon Mac の\n  両方で動く universal2 形式を試みます。使っているPythonやライブ\n  ラリが universal2 に対応していない場合は、そのMacのチップ専用\n  形式で自動的に作り直し、最後にどちらの形式で作れたかを表示します\n・この方法で作る .app は Apple の署名がないため、初回起動時に\n  Gatekeeper の確認が出ます。Finderで TranscribeGuard.app を\n  右クリックし、「開く」を選んで確認してください\n・アプリをすぐ試したい場合は、MakeApp-Mac.command の代わりに\n  Start-TranscribeGuard.command を使うと、ソース版を直接起動できます\n\nMacでのOCR（Tesseract）について\n------------------------------------------------\nEXE版に同梱している Tesseract は Windows用バイナリのため、Macでは\n使えません。Mac版では次の順番で Tesseract を探します。\n\n1. 環境変数 TRANSCRIBEGUARD_TESSERACT_CMD（または\n   TRANSCRIBEGUARD_TESSERACT）で指定された実行ファイル\n2. アプリと同じ場所にある macOS用 tesseract\n3. Homebrew の標準場所\n   ・Apple Silicon: /opt/homebrew/bin/tesseract\n   ・Intel Mac: /usr/local/bin/tesseract\n4. システムの PATH にある tesseract\n\n見つからない場合、OCRだけが「未導入」として扱われ、画像以外の読み\n込み、照合、保存などの機能は通常通り使えます。画像を開いたときは\nOCRが見つからない旨が表示されます。MacでOCRを使う場合は、Homebrew\n（https://brew.sh/）を入れた後、ターミナルで次を実行してください。\n\n  brew install tesseract tesseract-lang\n\ntesseract-lang は日本語を含む追加言語データです。インストール後に\nアプリを再起動してください。\n\nまず試すには\n------------------------------------------------\n1. アプリを起動します\n2. 上部の「サンプルで試す」ボタンを押すと、日本語の請求書サンプルが\n   読み込まれます\n3. 右側の入力欄に、左の値と同じものを打ち込んでみてください\n\n動作確認キット（自分のデータが無くても試せます）\n------------------------------------------------\n・Verify-Checklist.txt … 起動から出力までを数分で確認できる\n  6項目のチェックリストです。まずこの順番で試してください\n・samples/ocr_sample.png … OCR（画像の読み取り）練習用の請求書画像\n  です。「ファイルを開く」で開くと、文字が読み取れて項目になります\n・samples/sample_invoice.pdf … PDF読み込み練習用の小さな請求書\n  PDFです。「ファイルを開く」で開くと項目に分解されます\n\n同梱ファイル（ソース版）\n------------------------------------------------\nStart-TranscribeGuard.bat … Windows起動用（ダブルクリック）\nStart-TranscribeGuard.command … Macでソース版を直接起動する用\nMakeApp-Mac.command … Macで TranscribeGuard.app を生成する用\napp.py / core.py / i18n.py … アプリ本体\nrequirements.txt … 必要なライブラリの一覧\nREADME.txt … このファイル\nVerify-Checklist.txt … 動作確認チェックリスト\nsamples/ … 確認用のサンプル（ocr_sample.png / sample_invoice.pdf）\n\n正直な制限\n------------------------------------------------\n・EXE版のOCRは組み込み済みですが、読み取りの正確さは画像の状態に\n  依存します。読み取り結果は必ず目で確認してください。またスキャン\n  画像だけのPDFは「画像」として扱われます（PDFとして直接読み込める\n  のは、文字データを持つPDFです）\n・このアプリは会社のシステムに自動でログインしたり、勝手に入力\n  したりはしません。照合結果を会社のシステムへ移すのは人です\n・本アプリはLinux上のエミュレーション環境（Wine）での起動確認までで、\n  実物のWindowsパソコンでの起動はまだ未検証です。Wine環境での実測\n  では、画面が表示されるまで旧版（1ファイル方式）が約120秒だったのに\n  対し、今回のフォルダー方式は約14秒でした（実機のWindowsでは環境が\n  違うため、この秒数そのものは目安としてお考えください）\n・Mac版も実機のMacでの起動確認はまだ未検証です。Mac用スクリプトは\n  標準的な Python / PySide6 / PyInstaller の手順で動作するよう作って\n  いますが、利用するMacのOSバージョン、Pythonの入手方法、Gatekeeper\n  の設定によっては追加の確認操作が必要になる場合があります\n・Macで生成される .app は universal2、または組み立てたMacのチップ\n  専用形式のどちらかです。専用形式で作られた .app を別のチップの\n  Macで使う場合は、そのMacでもう一度 MakeApp-Mac.command を実行\n  して作り直してください\n\n対応言語\n------------------------------------------------\n画面表示は13言語に切り替えできます（日本語・English・Español・\n简体中文・Français・Deutsch・Português・Русский・Italiano・Türkçe・\nالعربية・Bahasa Indonesia・한국어）。\n選んだ言語は保存され、作業の途中経過も自動保存されます。\n"}, {"p": "requirements.txt", "s": 32, "l": "plaintext", "c": "PySide6\nPillow\nPyMuPDF\nopenpyxl\n"}, {"p": "samples/ocr_sample.png", "s": 81464, "b": 1}, {"p": "samples/sample_invoice.pdf", "s": 4224, "b": 1}, {"p": "Start-TranscribeGuard.bat", "s": 1224, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\necho ========================================\r\necho  転記見守り君の起動\r\necho  本体は EXE版 TranscribeGuard.exe を推奨します\r\necho ========================================\r\nif not exist app.py (\r\n  echo [エラー] app.py が見つかりません。\r\n  echo ZIPファイルを「すべて展開」して、展開したフォルダーの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist requirements.txt (\r\n  echo [エラー] requirements.txt が見つかりません。\r\n  echo ZIPファイルを「すべて展開」して、展開したフォルダーの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [エラー] Python が見つかりません。EXE版を使ってください（Python不要です）。\r\n  pause\r\n  exit /b 1\r\n)\r\necho ライブラリのインストール／確認をしています（初回のみ約200MB）...\r\n%PY% -m pip install --upgrade PySide6 openpyxl PyMuPDF Pillow pytesseract\r\nif errorlevel 1 (\r\n  echo [エラー] ライブラリのインストールに失敗しました。ネット接続を確認してください。\r\n  pause\r\n  exit /b 1\r\n)\r\necho 転記見守り君を起動します。この黒い画面は開いたままにしてください（閉じるとアプリも終了します）。\r\n%PY% app.py\r\npause\r\n"}, {"p": "Start-TranscribeGuard.command", "s": 1975, "l": "bash", "c": "#!/bin/bash\n# TranscribeGuard launcher for macOS.\n# Creates a local virtual environment, installs the Python dependencies,\n# and starts the application.\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\ncd \"$SCRIPT_DIR\" || exit 1\n\npause_and_exit() {\n  echo\n  echo \"$1\"\n  echo \"Press Enter to close this window.\"\n  read -r _ || true\n  exit 1\n}\n\nif ! command -v python3 >/dev/null 2>&1; then\n  cat <<'EOF'\nPython 3 was not found.\n\nInstall Python 3.10 or later in either of these ways:\n  1. Download the macOS installer from https://www.python.org/downloads/macos/\n  2. If Homebrew is already installed, run: brew install python\n\nThen double-click Start-TranscribeGuard.command again.\nEOF\n  pause_and_exit \"Python 3 is required.\"\nfi\n\nPYTHON_BIN=\"$(command -v python3)\"\nif ! \"$PYTHON_BIN\" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' >/dev/null 2>&1; then\n  pause_and_exit \"Python 3.10 or later is required. Please install a current version from python.org.\"\nfi\n\nVENV_DIR=\"$SCRIPT_DIR/.venv\"\nVENV_PY=\"$VENV_DIR/bin/python\"\n\nif [ ! -x \"$VENV_PY\" ]; then\n  echo \"Creating the TranscribeGuard Python environment...\"\n  \"$PYTHON_BIN\" -m venv \"$VENV_DIR\" || pause_and_exit \"Could not create the Python virtual environment.\"\nfi\n\necho \"Checking TranscribeGuard dependencies...\"\n\"$VENV_PY\" -m pip install --upgrade pip || pause_and_exit \"Could not update pip. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install -r \"$SCRIPT_DIR/requirements.txt\" || pause_and_exit \"Could not install the required Python packages. Check the network connection and try again.\"\n\nif ! command -v tesseract >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/tesseract ] && [ ! -x /usr/local/bin/tesseract ]; then\n  echo\n  echo \"Note: Tesseract OCR was not found. All non-OCR features will work.\"\n  echo \"For OCR on macOS, install Homebrew from https://brew.sh/ and then run:\"\n  echo \"  brew install tesseract tesseract-lang\"\n  echo\nfi\n\nexec \"$VENV_PY\" \"$SCRIPT_DIR/app.py\"\n"}, {"p": "tests/smoke_gui.py", "s": 2259, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen GUI smoke test: launch, load sample, type a correct value and a\ndigit-mismatch, capture screenshots. Run with QT_QPA_PLATFORM=offscreen.\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom PySide6.QtWidgets import QApplication\n\nimport core\nfrom app import MainWindow\n\nSHOTS = os.path.join(os.path.dirname(os.path.dirname(os.path.abspath(__file__))), \"shots\")\nos.makedirs(SHOTS, exist_ok=True)\n\n\ndef find_row(win, group, field):\n    for i, it in enumerate(win.items):\n        if it[\"group\"] == group and it[\"field\"] == field:\n            return i\n    raise AssertionError(f\"row not found: {group}/{field}\")\n\n\ndef main():\n    app = QApplication([])\n    win = MainWindow()\n    win.resize(1200, 780)\n    win.show()\n    app.processEvents()\n\n    win.load_items(core.sample_items(), \"sample\")\n    import time\n    for _ in range(10):\n        app.processEvents()\n        time.sleep(0.05)\n    assert win.stat_labels[\"stat_remaining\"].text() == \"未入力が15件\", win.stat_labels[\"stat_remaining\"].text()\n    p1 = os.path.join(SHOTS, \"01_sample_initial.png\")\n    win.grab().save(p1)\n\n    # one correct value (text), one correct number, one digit-mismatch number\n    i1 = find_row(win, \"請求書\", \"請求番号\")\n    win.rows[i1][\"edit\"].setText(\"INV-2026-001\")\n    i2 = find_row(win, \"ノート A5\", \"単価\")\n    win.rows[i2][\"edit\"].setText(\"150\")\n    i3 = find_row(win, \"ノート A5\", \"数量\")\n    win.rows[i3][\"edit\"].setText(\"1\")  # source 10 -> digit mismatch\n    app.processEvents()\n\n    assert core.compare(\"INV-2026-001\", win.rows[i1][\"edit\"].text())[\"status\"] == \"match\"\n    assert win.rows[i1][\"check_label\"].text() == \"✓\"\n    assert win.rows[i3][\"reason_label\"].text() != \"\"\n    stats_text = win.stat_labels[\"stat_remaining\"].text()\n    assert stats_text == \"未入力が12件\", stats_text\n    assert win.stat_labels[\"stat_mismatch\"].text() == \"不一致 1\"\n    assert not win.banner.isVisible()\n\n    p2 = os.path.join(SHOTS, \"02_mid_work.png\")\n    win.grab().save(p2)\n    print(\"SMOKE OK\", p1, p2)\n    print(\"remaining:\", stats_text, \"| mismatch:\", win.stat_labels[\"stat_mismatch\"].text())\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"p": "tests/test_core.py", "s": 6795, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport core\n\n\n# ------------------------------------------------------------ normalization\ndef test_normalize_fullwidth_digits_and_space():\n    assert core.normalize(\"１２，３４５\") == \"12,345\" or core.normalize(\"１２３４５\") == \"12345\"\n    assert core.normalize(\"　ＡＢＣ　\") == \"abc\"\n    assert core.normalize(\"  Hello   World \") == \"hello world\"\n\n\ndef test_parse_number_separators_and_yen():\n    assert core.parse_number(\"12,000\") == core.parse_number(\"12000\")\n    assert core.parse_number(\"１２，０００円\") == 12000\n    assert core.parse_number(\"abc\") is None\n    assert core.parse_number(\"\") is None\n\n\ndef test_compare_match_fullwidth_and_separator():\n    assert core.compare(\"12,000\", \"１２０００\")[\"status\"] == \"match\"\n    assert core.compare(\"サンプル商事\", \"サンプル商事\")[\"status\"] == \"match\"\n    assert core.compare(\"ABC-001\", \"abc-001\")[\"status\"] == \"match\"\n\n\ndef test_compare_empty_and_mismatch_text():\n    assert core.compare(\"10\", \"\")[\"status\"] == \"empty\"\n    assert core.compare(\"10\", \"   \")[\"status\"] == \"empty\"\n    r = core.compare(\"サンプル商事\", \"サンプル商会\")\n    assert r[\"status\"] == \"mismatch\" and r[\"reason\"] == \"text\" and r[\"diff_pos\"] == 6\n\n\ndef test_compare_digit_reason():\n    r = core.compare(\"12000\", \"1200\")\n    assert r[\"status\"] == \"mismatch\" and r[\"reason\"] == \"digits\"\n    assert r[\"src_digits\"] == 5 and r[\"in_digits\"] == 4\n    r2 = core.compare(\"12000\", \"12001\")\n    assert r2[\"status\"] == \"mismatch\" and r2[\"reason\"] == \"number\"\n\n\ndef test_digit_count():\n    assert core.digit_count(\"1,234\") == 4\n    assert core.digit_count(\"１２３\") == 3\n    assert core.digit_count(\"abc\") is None\n\n\n# ------------------------------------------------------------ stats/totals\ndef test_compute_stats():\n    items = core.sample_items()\n    inputs = [\"\"] * len(items)\n    s = core.compute_stats(items, inputs)\n    assert s == {\"total\": len(items), \"done\": 0, \"remaining\": len(items), \"mismatch\": 0}\n    inputs = [it[\"value\"] for it in items]\n    s = core.compute_stats(items, inputs)\n    assert s[\"done\"] == len(items) and s[\"remaining\"] == 0 and s[\"mismatch\"] == 0\n    inputs[2] = \"999\"  # 数量 of first line (10) -> mismatch\n    s = core.compute_stats(items, inputs)\n    assert s[\"mismatch\"] == 1 and s[\"remaining\"] == 0\n\n\ndef test_field_totals():\n    items = [\n        {\"group\": \"a\", \"field\": \"金額\", \"value\": \"100\"},\n        {\"group\": \"b\", \"field\": \"金額\", \"value\": \"250\"},\n        {\"group\": \"a\", \"field\": \"数量\", \"value\": \"2\"},\n    ]\n    totals = {t[\"field\"]: t for t in core.field_totals(items, [\"100\", \"200\", \"2\"])}\n    assert totals[\"金額\"][\"source_sum\"] == 350\n    assert totals[\"金額\"][\"typed_sum\"] == 300\n    assert totals[\"金額\"][\"match\"] is False\n    assert totals[\"数量\"][\"match\"] is True\n    totals2 = {t[\"field\"]: t for t in core.field_totals(items, [\"100\", \"250\", \"2\"])}\n    assert totals2[\"金額\"][\"match\"] is True\n\n\n# ------------------------------------------------------------ extractors\ndef test_extract_csv_text():\n    text = \"品名,数量,単価\\nりんご,10,150\\nバナナ,5,80\\n\"\n    items = core.extract_text(text)\n    fields = {(i[\"group\"], i[\"field\"], i[\"value\"]) for i in items}\n    assert (\"りんご\", \"数量\", \"10\") in fields\n    assert (\"バナナ\", \"単価\", \"80\") in fields\n    assert (\"りんご\", \"品名\", \"りんご\") in fields  # nothing dropped\n\n\ndef test_extract_txt_keyvalue_and_lines():\n    items = core.extract_text(\"請求番号: INV-001\\n取引先：テスト商事\\nただの行\\n\")\n    kv = {(i[\"field\"], i[\"value\"]) for i in items}\n    assert (\"請求番号\", \"INV-001\") in kv\n    assert (\"取引先\", \"テスト商事\") in kv\n    assert any(i[\"value\"] == \"ただの行\" for i in items)\n\n\ndef test_extract_tab_table():\n    items = core.extract_text(\"品名\\t数量\\nペン\\t30\\n\")\n    assert any(i[\"field\"] == \"数量\" and i[\"value\"] == \"30\" and i[\"group\"] == \"ペン\" for i in items)\n\n\ndef test_extract_xlsx(tmp_path):\n    from openpyxl import Workbook\n    path = tmp_path / \"src.xlsx\"\n    wb = Workbook()\n    ws = wb.active\n    ws.append([\"品名\", \"数量\", \"金額\"])\n    ws.append([\"ノート\", 3, 450])\n    ws.append([\"ペン\", 10, 1000])\n    wb.save(path)\n    items = core.extract_xlsx(str(path))\n    assert any(i[\"group\"] == \"ノート\" and i[\"field\"] == \"金額\" and i[\"value\"] == \"450\" for i in items)\n    assert any(i[\"group\"] == \"ペン\" and i[\"field\"] == \"数量\" and i[\"value\"] == \"10\" for i in items)\n\n\ndef test_extract_pdf_fixture(tmp_path):\n    import fitz\n    path = tmp_path / \"src.pdf\"\n    doc = fitz.open()\n    page = doc.new_page()\n    page.insert_text((72, 72), \"請求番号: INV-2026-001\", fontsize=11, fontname=\"japan\")\n    page.insert_text((72, 96), \"取引先: サンプル商事\", fontsize=11, fontname=\"japan\")\n    doc.save(path)\n    doc.close()\n    items = core.extract_pdf(str(path))\n    kv = {(i[\"field\"], i[\"value\"]) for i in items}\n    assert (\"請求番号\", \"INV-2026-001\") in kv\n    assert (\"取引先\", \"サンプル商事\") in kv\n\n\ndef test_extract_csv_bytes_sjis():\n    text = \"品名,数量\\n鉛筆,12\\n\"\n    items = core.extract_csv(text.encode(\"cp932\"))\n    assert any(i[\"value\"] == \"12\" and i[\"group\"] == \"鉛筆\" for i in items)\n\n\n# ------------------------------------------------------------ sample/session\ndef test_sample_integrity():\n    items = core.sample_items()\n    by_group = {}\n    for i in items:\n        by_group.setdefault(i[\"group\"], {})[i[\"field\"]] = i[\"value\"]\n    total = 0\n    for name, fields in by_group.items():\n        if \"数量\" in fields and \"単価\" in fields and \"金額\" in fields:\n            assert int(fields[\"数量\"]) * int(fields[\"単価\"]) == int(fields[\"金額\"])\n            total += int(fields[\"金額\"])\n    assert int(by_group[\"合計\"][\"合計\"]) == total\n\n\ndef test_build_tsv_and_session_roundtrip():\n    items = core.sample_items()[:3]\n    inputs = [\"x\", \"y\", \"z\"]\n    tsv = core.build_tsv(items, inputs)\n    lines = tsv.strip().split(\"\\r\\n\")\n    assert lines[0] == \"group\\tfield\\tvalue\" and len(lines) == 4\n    d = core.session_dict(items, inputs, \"en\", \"f.xlsx\")\n    items2, inputs2, lang, name = core.session_from_dict(d)\n    assert items2 == items and inputs2 == inputs and lang == \"en\" and name == \"f.xlsx\"\n\n\ndef test_ocr_notice_when_unavailable(monkeypatch):\n    # On machines without tesseract this returns the notice; with tesseract\n    # the image path is exercised separately. Here we only assert the API.\n    items, notice = core.extract_image(__file__)  # not an image; must not fake results\n    assert isinstance(items, list)\n    if not core.ocr_available():\n        assert notice == \"ocr_unavailable\" and items == []\n"}, {"p": "tests/test_tesseract.py", "s": 4778, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tests for the Tesseract resolution order (env override > bundled >\nsystem PATH) and OCR language selection. Pure Python, no real tesseract\nneeded: fake executables are empty files in tmp folders.\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport core\n\n\ndef _touch(path):\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_bytes(b\"fake\")\n    return str(path)\n\n\ndef test_env_override_wins(tmp_path):\n    env_exe = _touch(tmp_path / \"custom\" / \"tesseract.exe\")\n    _touch(tmp_path / \"app\" / \"tesseract\" / \"tesseract.exe\")\n    found = core.find_tesseract(\n        env={\"TRANSCRIBEGUARD_TESSERACT_CMD\": env_exe},\n        frozen=False, app_dir=str(tmp_path / \"app\"),\n        which=lambda name: None)\n    assert found == env_exe\n\n\ndef test_env_override_alt_name(tmp_path):\n    env_exe = _touch(tmp_path / \"custom\" / \"myocr.exe\")\n    found = core.find_tesseract(\n        env={\"TRANSCRIBEGUARD_TESSERACT\": env_exe},\n        frozen=False, app_dir=str(tmp_path / \"app\"),\n        which=lambda name: None)\n    assert found == env_exe\n\n\ndef test_frozen_bundled_beats_source_dir(tmp_path):\n    exe_dir = tmp_path / \"dist\"\n    bundled = _touch(exe_dir / \"tesseract\" / \"tesseract.exe\")\n    _touch(tmp_path / \"src\" / \"tesseract\" / \"tesseract.exe\")\n    found = core.find_tesseract(\n        env={}, frozen=True, exe_dir=str(exe_dir),\n        app_dir=str(tmp_path / \"src\"), which=lambda name: None)\n    assert found == bundled\n\n\ndef test_source_bundled_next_to_app(tmp_path):\n    bundled = _touch(tmp_path / \"tesseract\" / \"tesseract.exe\")\n    found = core.find_tesseract(\n        env={}, frozen=False, app_dir=str(tmp_path),\n        which=lambda name: None)\n    assert found == bundled\n\n\ndef test_path_fallback(tmp_path):\n    found = core.find_tesseract(\n        env={}, frozen=False, app_dir=str(tmp_path),\n        which=lambda name: \"/usr/bin/tesseract\" if name == \"tesseract\" else None)\n    assert found == \"/usr/bin/tesseract\"\n\n\ndef test_not_found_anywhere(tmp_path):\n    found = core.find_tesseract(\n        env={}, frozen=False, app_dir=str(tmp_path),\n        which=lambda name: None)\n    assert found is None\n\n\ndef test_find_tessdata_dir_bundled(tmp_path):\n    td = tmp_path / \"tesseract\" / \"tessdata\"\n    td.mkdir(parents=True)\n    (td / \"jpn.traineddata\").write_bytes(b\"x\")\n    found = core.find_tessdata_dir(\n        env={}, frozen=False, app_dir=str(tmp_path))\n    assert found == str(td)\n\n\ndef test_find_tessdata_dir_env_override(tmp_path):\n    td = tmp_path / \"mydata\"\n    td.mkdir()\n    (td / \"eng.traineddata\").write_bytes(b\"x\")\n    found = core.find_tessdata_dir(\n        env={\"TRANSCRIBEGUARD_TESSDATA_DIR\": str(td)},\n        frozen=False, app_dir=str(tmp_path / \"app\"))\n    assert found == str(td)\n\n\ndef test_ocr_lang_string_defaults_and_ui():\n    assert core.ocr_lang_string(\"ja\") == \"jpn+eng\"\n    assert core.ocr_lang_string(\"en\") == \"jpn+eng\"\n    assert core.ocr_lang_string(\"ko\") == \"jpn+eng+kor\"\n    assert core.ocr_lang_string(\"zh_CN\") == \"jpn+eng+chi_sim\"\n    assert core.ocr_lang_string(\"ar\") == \"jpn+eng+ara\"\n\n\ndef test_ocr_lang_string_filters_to_available_data(tmp_path):\n    (tmp_path / \"jpn.traineddata\").write_bytes(b\"x\")\n    (tmp_path / \"eng.traineddata\").write_bytes(b\"x\")\n    # kor has no data file here -> dropped from the language string\n    assert core.ocr_lang_string(\"ko\", str(tmp_path)) == \"jpn+eng\"\n    (tmp_path / \"kor.traineddata\").write_bytes(b\"x\")\n    assert core.ocr_lang_string(\"ko\", str(tmp_path)) == \"jpn+eng+kor\"\n\n\ndef test_darwin_candidates_ignore_windows_bundled_exe(tmp_path):\n    _touch(tmp_path / \"tesseract\" / \"tesseract.exe\")\n    cands = core.tesseract_candidates(\n        env={}, frozen=False, app_dir=str(tmp_path), platform=\"darwin\")\n    assert str(tmp_path / \"tesseract\" / \"tesseract.exe\") not in cands\n    assert str(tmp_path / \"tesseract\" / \"tesseract\") in cands\n    assert cands[-2:] == list(core._MAC_TESSERACT_PATHS)\n\n\ndef test_darwin_homebrew_paths_are_checked_before_path(tmp_path, monkeypatch):\n    apple_silicon = _touch(tmp_path / \"opt\" / \"homebrew\" / \"bin\" / \"tesseract\")\n    intel = _touch(tmp_path / \"usr\" / \"local\" / \"bin\" / \"tesseract\")\n    monkeypatch.setattr(core, \"_MAC_TESSERACT_PATHS\", (apple_silicon, intel))\n    found = core.find_tesseract(\n        env={}, frozen=False, app_dir=str(tmp_path / \"app\"),\n        which=lambda name: \"/should/not/win\", platform=\"darwin\")\n    assert found == apple_silicon\n\n\ndef test_non_darwin_candidates_do_not_include_homebrew(tmp_path):\n    cands = core.tesseract_candidates(\n        env={}, frozen=False, app_dir=str(tmp_path), platform=\"win32\")\n    assert not any(c in core._MAC_TESSERACT_PATHS for c in cands)\n    assert str(tmp_path / \"tesseract\" / \"tesseract.exe\") in cands\n"}, {"p": "verify_mac_retrofit.py", "s": 3806, "l": "python", "c": "#!/usr/bin/env python3\n\"\"\"Launch verification for the Mac-retrofit Windows EXE rebuild.\n\nRuns the packaged EXE five times under Wine on a private Xvfb display.\nA run passes when the window is visibly drawn and the process is still\nalive after a settle period. Results are appended to a JSONL file.\n\"\"\"\nimport json\nimport os\nimport subprocess\nimport time\n\nDISPLAY = \":98\"\nROOT = os.path.expanduser(\"~/workspace/transcribe-guard\")\nDELIVERY = os.path.join(ROOT, \"release\", \"TranscribeGuard\")\nOUTDIR = os.path.join(ROOT, \"verify_mac_retrofit\")\nos.makedirs(OUTDIR, exist_ok=True)\nOUT = os.path.join(OUTDIR, \"results.jsonl\")\nENV = dict(os.environ, DISPLAY=DISPLAY,\n           WINEPREFIX=os.path.expanduser(\"~/workspace/wine-prefix\"),\n           WINEDEBUG=\"-all\")\nRUNS = 5\nMAX_WAIT = 120\n\nos.environ[\"DISPLAY\"] = DISPLAY\nfrom PIL import Image, ImageChops, ImageGrab  # noqa: E402\n\n\ndef alive():\n    r = subprocess.run([\"pgrep\", \"-f\", \"TranscribeGuard[.]exe\"],\n                       capture_output=True, text=True)\n    return bool(r.stdout.strip())\n\n\ndef free_mb():\n    with open(\"/proc/meminfo\") as f:\n        for line in f:\n            if line.startswith(\"MemAvailable\"):\n                return int(line.split()[1]) // 1024\n    return 0\n\n\ndef kill_app():\n    subprocess.run([\"pkill\", \"-9\", \"-f\", \"TranscribeGuard[.]exe\"],\n                   capture_output=True)\n    time.sleep(2)\n\n\ndef small_grab():\n    return ImageGrab.grab().resize((640, 450)).convert(\"L\")\n\n\ndef diff_ratio(a, b):\n    diff = ImageChops.difference(a, b)\n    hist = diff.histogram()\n    return sum(hist[16:]) / (a.size[0] * a.size[1])\n\n\n# Start a private Xvfb if :98 is not already serving.\nif not os.path.exists(f\"/tmp/.X11-unix/X{DISPLAY[1:]}\"):\n    subprocess.Popen([\"Xvfb\", DISPLAY, \"-screen\", \"0\", \"1600x1000x24\"],\n                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,\n                     start_new_session=True)\n    time.sleep(2)\n\nwith open(OUT, \"w\") as f:\n    f.write(\"\")\nresults = []\nfor run in range(1, RUNS + 1):\n    kill_app()\n    waited = 0\n    while free_mb() < 1800 and waited < 600:\n        time.sleep(5)\n        waited += 5\n    baseline = small_grab()\n    log = os.path.join(OUTDIR, f\"launch_run{run}.log\")\n    t0 = time.time()\n    with open(log, \"wb\") as lf:\n        subprocess.Popen(\n            [\"script\", \"-qec\", \"wine TranscribeGuard.exe\", log + \".pty\"],\n            cwd=DELIVERY, env=ENV, stdout=lf, stderr=subprocess.STDOUT)\n    drawn_at = None\n    while time.time() - t0 < MAX_WAIT:\n        time.sleep(1.0)\n        try:\n            changed = diff_ratio(small_grab(), baseline)\n        except Exception:\n            changed = 0\n        if changed > 0.02:\n            drawn_at = time.time() - t0\n            break\n        if not alive() and time.time() - t0 > 20:\n            break\n    ok = drawn_at is not None\n    time.sleep(3)\n    final_alive = alive()\n    shot_path = os.path.join(OUTDIR, f\"exe_run{run}.png\")\n    try:\n        ImageGrab.grab().save(shot_path)\n    except Exception:\n        shot_path = \"\"\n    fault = 0\n    try:\n        with open(log + \".pty\", \"rb\") as fh:\n            fault = fh.read().count(b\"page fault\")\n    except OSError:\n        pass\n    res = {\"run\": run, \"drawn\": ok,\n           \"time_to_drawn_s\": round(drawn_at, 1) if drawn_at else None,\n           \"alive_after_settle\": final_alive, \"page_faults\": fault,\n           \"free_mb_before\": free_mb(), \"waited_for_memory_s\": waited,\n           \"screenshot\": shot_path}\n    results.append(res)\n    with open(OUT, \"a\") as fh:\n        fh.write(json.dumps(res) + \"\\n\")\n    print(json.dumps(res), flush=True)\n    kill_app()\n\nsucc = sum(1 for r in results if r[\"drawn\"] and r[\"alive_after_settle\"])\nprint(json.dumps({\"summary\": f\"{succ}/{RUNS} launches OK\",\n                  \"times_s\": [r[\"time_to_drawn_s\"] for r in results]}))\n"}, {"p": "verify_mac_retrofit_batch2.py", "s": 3812, "l": "python", "c": "#!/usr/bin/env python3\n\"\"\"Launch verification for the Mac-retrofit Windows EXE rebuild.\n\nRuns the packaged EXE five times under Wine on a private Xvfb display.\nA run passes when the window is visibly drawn and the process is still\nalive after a settle period. Results are appended to a JSONL file.\n\"\"\"\nimport json\nimport os\nimport subprocess\nimport time\n\nDISPLAY = \":98\"\nROOT = os.path.expanduser(\"~/workspace/transcribe-guard\")\nDELIVERY = os.path.join(ROOT, \"release\", \"TranscribeGuard\")\nOUTDIR = os.path.join(ROOT, \"verify_mac_retrofit_batch2\")\nos.makedirs(OUTDIR, exist_ok=True)\nOUT = os.path.join(OUTDIR, \"results.jsonl\")\nENV = dict(os.environ, DISPLAY=DISPLAY,\n           WINEPREFIX=os.path.expanduser(\"~/workspace/wine-prefix\"),\n           WINEDEBUG=\"-all\")\nRUNS = 5\nMAX_WAIT = 120\n\nos.environ[\"DISPLAY\"] = DISPLAY\nfrom PIL import Image, ImageChops, ImageGrab  # noqa: E402\n\n\ndef alive():\n    r = subprocess.run([\"pgrep\", \"-f\", \"TranscribeGuard[.]exe\"],\n                       capture_output=True, text=True)\n    return bool(r.stdout.strip())\n\n\ndef free_mb():\n    with open(\"/proc/meminfo\") as f:\n        for line in f:\n            if line.startswith(\"MemAvailable\"):\n                return int(line.split()[1]) // 1024\n    return 0\n\n\ndef kill_app():\n    subprocess.run([\"pkill\", \"-9\", \"-f\", \"TranscribeGuard[.]exe\"],\n                   capture_output=True)\n    time.sleep(2)\n\n\ndef small_grab():\n    return ImageGrab.grab().resize((640, 450)).convert(\"L\")\n\n\ndef diff_ratio(a, b):\n    diff = ImageChops.difference(a, b)\n    hist = diff.histogram()\n    return sum(hist[16:]) / (a.size[0] * a.size[1])\n\n\n# Start a private Xvfb if :98 is not already serving.\nif not os.path.exists(f\"/tmp/.X11-unix/X{DISPLAY[1:]}\"):\n    subprocess.Popen([\"Xvfb\", DISPLAY, \"-screen\", \"0\", \"1600x1000x24\"],\n                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,\n                     start_new_session=True)\n    time.sleep(2)\n\nwith open(OUT, \"w\") as f:\n    f.write(\"\")\nresults = []\nfor run in range(1, RUNS + 1):\n    kill_app()\n    waited = 0\n    while free_mb() < 450 and waited < 120:\n        time.sleep(5)\n        waited += 5\n    baseline = small_grab()\n    log = os.path.join(OUTDIR, f\"launch_run{run}.log\")\n    t0 = time.time()\n    with open(log, \"wb\") as lf:\n        subprocess.Popen(\n            [\"script\", \"-qec\", \"wine TranscribeGuard.exe\", log + \".pty\"],\n            cwd=DELIVERY, env=ENV, stdout=lf, stderr=subprocess.STDOUT)\n    drawn_at = None\n    while time.time() - t0 < MAX_WAIT:\n        time.sleep(1.0)\n        try:\n            changed = diff_ratio(small_grab(), baseline)\n        except Exception:\n            changed = 0\n        if changed > 0.02:\n            drawn_at = time.time() - t0\n            break\n        if not alive() and time.time() - t0 > 20:\n            break\n    ok = drawn_at is not None\n    time.sleep(3)\n    final_alive = alive()\n    shot_path = os.path.join(OUTDIR, f\"exe_run{run}.png\")\n    try:\n        ImageGrab.grab().save(shot_path)\n    except Exception:\n        shot_path = \"\"\n    fault = 0\n    try:\n        with open(log + \".pty\", \"rb\") as fh:\n            fault = fh.read().count(b\"page fault\")\n    except OSError:\n        pass\n    res = {\"run\": run, \"drawn\": ok,\n           \"time_to_drawn_s\": round(drawn_at, 1) if drawn_at else None,\n           \"alive_after_settle\": final_alive, \"page_faults\": fault,\n           \"free_mb_before\": free_mb(), \"waited_for_memory_s\": waited,\n           \"screenshot\": shot_path}\n    results.append(res)\n    with open(OUT, \"a\") as fh:\n        fh.write(json.dumps(res) + \"\\n\")\n    print(json.dumps(res), flush=True)\n    kill_app()\n\nsucc = sum(1 for r in results if r[\"drawn\"] and r[\"alive_after_settle\"])\nprint(json.dumps({\"summary\": f\"{succ}/{RUNS} launches OK\",\n                  \"times_s\": [r[\"time_to_drawn_s\"] for r in results]}))\n"}, {"p": "verify_mac_retrofit_remaining.py", "s": 3806, "l": "python", "c": "#!/usr/bin/env python3\n\"\"\"Launch verification for the Mac-retrofit Windows EXE rebuild.\n\nRuns the packaged EXE five times under Wine on a private Xvfb display.\nA run passes when the window is visibly drawn and the process is still\nalive after a settle period. Results are appended to a JSONL file.\n\"\"\"\nimport json\nimport os\nimport subprocess\nimport time\n\nDISPLAY = \":98\"\nROOT = os.path.expanduser(\"~/workspace/transcribe-guard\ <script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
