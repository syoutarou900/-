rkdown", "c": "# 超特化型ドロップランチャー（DropLauncher）\n\nデスクトップに常駐する小さなフローティングパネルに、ファイルをドラッグ＆ドロップするだけで\n定型作業を自動処理する、世界中の一般のWindows PCユーザー向けの汎用アプリです。\n特定の機種・ユーザー名・フォルダ構成には依存しません。\n\n## 動作環境\n- Windows 10 / 11（64bit）、メーカー不問。内蔵GPUのみのPCでも軽く動きます。\n- **EXE版は Python 不要**で、単体で起動できます（これが本線です）。\n- 管理者権限は不要です。設定・ログ・出力はすべてユーザーフォルダ側に保存されます。\n  - 既定の出力先：ドキュメントフォルダ内の `DropLauncher-Out`（Windowsの既知フォルダから取得。言語・ユーザー名に依存しません）\n  - 設定ファイル：アプリと同じフォルダに書けない場合は `%LOCALAPPDATA%\\DropLauncher` に保存されます。\n- 署名について（正直なお知らせ）：このEXEにはデジタル署名がありません。そのため初回起動時に\n  Windows SmartScreen の警告（「WindowsによってPCが保護されました」）が出る場合があります。\n  その場合は「詳細情報」→「実行」を押すと起動できます。\n\n## 使い方（EXE版・本線）\n1. ZIPをダウンロードします。\n2. ZIPを右クリック→「すべて展開」で展開します（展開せずに中身を直接実行しないでください）。\n3. 展開したフォルダ内の `DropLauncher.exe` をダブルクリックします。\n4. パネルが表示されたら、処理したいファイルを各ゾーンへドラッグ＆ドロップします。\n\n## 使い方（ソース版・予備）\nPython 3.10〜3.13 がある場合のみ使える予備の方法です。\n展開したフォルダで `Start-DropLauncher.bat` をダブルクリックしてください。\n初回だけライブラリ（約180MB）を自動ダウンロードします。2回目以降は確認だけで数秒で起動します。\n黒い窓（コマンドプロンプト）はアプリ使用中は開いたままにしてください。閉じるとアプリも終了します。\n※ .bat ファイルは日本語Windows向けに Shift-JIS で書かれています。他言語のWindowsでは\n　文字化けする場合があるため、EXE版の利用を推奨します。\n\n## 自分でEXEを作る場合\n`MakeExe-DropLauncher.bat` を実行すると `dist\\DropLauncher.exe` が作成されます\n（Python とネット接続が必要です。動画変換用 ffmpeg もEXE内に同梱されます）。\n\n## Macで使う場合（ソース版ZIPに同梱）\nプログラム自体はWindows版と共通で、Macでも同じ機能・同じ13言語UIが使えます。\nただし **Mac実機での動作確認はまだ行えていません**（開発環境にMacがないため）。\n対応OSは **macOS 11（Big Sur）以降** です。\n\n### 手順A：そのまま起動する（Pythonが必要）\n1. ソース版ZIPをダウンロードして展開します。\n2. 展開したフォルダ内の `Start-DropLauncher.command` をダブルクリックします。\n   初回だけ、未署名のため macOS に止められる場合があります。その場合はファイルを\n   **右クリック→「開く」** を選ぶと起動できます（Gatekeeperの仕様です）。\n3. 初回は仮想環境の作成とライブラリの自動インストール（要ネット接続）が走ります。\n   Python 3 が無いMacでは、入手方法（python.org / Homebrew / Command Line Tools）が\n   画面に表示されて終了しますので、先にPython 3を入れてから再度実行してください。\n\n### 手順B：.app化する（普段はこちらが便利）\n1. 展開したフォルダ内の `MakeApp-Mac.command` をダブルクリックします\n   （初回は上と同じく右クリック→「開く」が必要な場合があります）。\n2. ビルドが終わると `dist/DropLauncher.app` ができます。以後はその .app を\n   ダブルクリックして使えます（.app の初回起動時も右クリック→「開く」が要る場合があります）。\n3. チップの扱い：まず両チップ対応の **universal2** での生成を試み、作れなかった場合は\n   **そのMacのチップ専用**（Apple Silicon機ではarm64、Intel機ではx86_64）に自動で\n   切り替わります。どちらで作れたかはビルド終了時に画面に表示されます。\n   チップ専用で作った .app は、別のチップのMacでは動かないため、そのMacで作り直してください。\n\n### Macでの保存先・仕様の違い（正直なお知らせ）\n- 設定・ログの保存先：`~/Library/Application Support/DropLauncher`\n  （出力先の既定はWindowsと同じく `~/Documents/DropLauncher-Out` です）\n- 動画変換の ffmpeg：ソース版ではライブラリ（imageio-ffmpeg）に含まれるMac用バイナリを\n  自動で使います。同梱ツール・Homebrew（`/opt/homebrew/bin/ffmpeg` 等）の順でも探します。\n  見つからない場合は起動時のログに「見つかりません」と表示されます\n  （その場合は `brew install ffmpeg` で入れるか、設定は不要で imageio-ffmpeg 入りの\n  ソース版をそのまま使ってください）。\n- Excel→PDF：Macでは LibreOffice（`/Applications/LibreOffice.app` または Homebrew版）が\n  あればそれを使います。**Microsoft Office連携（COM）はWindows専用のためMacでは使えません。**\n  LibreOfficeが無い場合は、従来どおり「書式つきHTML（PDFではありません）」を代替出力し、\n  使われたエンジンはログに明記されます。\n- フォルダーを開くボタンは、Macでは Finder で開きます。\n- 本アプリに自動起動（ログイン時起動）の機能は元々ありません（Windows版・Mac版とも）。\n\n## 機能（10ゾーン）\n1. 転記ヘルパー：PDF/Excel/CSV/TXT/EML → 書式つきExcel・CSV・TXT。Excel入力は書式コピー版も出力。\n2. 仕分け＆リネーム：日付_案件名_連番（例 20261112_作業_001.pdf）に改名し、拡張子/日付フォルダへ移動（設定でコピー可）。「仕分けを元に戻す」ボタンで直前のバッチを取り消せます。\n3. 日報集計：Excel/CSV の件数・数値列合計・「完了」件数を集計し、報告文（.txt＋クリップボード）と集計サマリー.xlsx を作成。\n4. 画像 一括変換：最大幅1200px（設定可）にリサイズ、目標500KB以下（設定可）を目指して画質を自動調整、JPG/WebP/PNG へ変換。EXIFの向きも補正します。※500KBは目標値で、画像によっては画質下限の都合で上回る場合があります。\n5. PDF結合：複数PDFを1つに結合（日付_案件名_結合.pdf）。\n6. PDF分割・抽出：ページごとのPDFに分割＋テキスト抽出。\n7. 動画変換（ffmpeg内蔵）：MP4変換（H.264/AAC）／圧縮720p（CRF28）／音声抽出MP3／GIF変換。パネル上部のプリセットで切替。処理は裏側で動き、画面は固まりません。\n8. Excel変換：xlsx→PDF（エンジン優先順位：LibreOffice → Microsoft Office（COM）→ 書式つきHTML代替）、xlsx→CSV、xlsx→HTML。docx/pptx のPDF変換も LibreOffice / Office があれば対応。\n   ※純PythonのHTML代替は「書式を再現したHTML」であり、Excelと100%同一の見た目を保証するものではありません。使われたエンジンはログに明記されます。\n9. ZIP圧縮：複数ファイル／フォルダを 日付_案件名.zip にまとめます。\n10. ZIP解凍：ZIPを新しいフォルダへ展開（日本語ファイル名・危険なパスの対策つき）。\n\n## 設定\nパネルの「設定」ボタンから、出力先フォルダ・案件名・仕分け方法（移動/コピー）・サブフォルダ方式・\n画像の最大幅/目標KB/形式・LibreOffice（soffice）の場所を変更できます。\n\n## ログ・履歴\n- 処理履歴（仕分けの取り消し用）：出力先フォルダの `history.json`\n- エラーログ：`DropLauncher-error.log`（設定保存先フォルダ内）\n\n## ファイル構成\n- DropLauncher.exe（EXE版のみ） / app.py / core.py / requirements.txt\n- Start-DropLauncher.bat（予備起動） / MakeExe-DropLauncher.bat（EXE作成）\n"}, {"p": "requirements.txt", "s": 68, "l": "plaintext", "c": "PySide6\nPillow\nPyMuPDF\nopenpyxl\npywin32; platform_system=='Windows'\n"}, {"p": "resources.qrc", "s": 457, "l": "xml", "c": "<RCC>\n  <qresource prefix=\"/arrows\">\n    <file alias=\"up_white.png\">assets/arrow_up_white.png<\/file>\n    <file alias=\"down_white.png\">assets/arrow_down_white.png<\/file>\n    <file alias=\"left_white.png\">assets/arrow_left_white.png<\/file>\n    <file alias=\"right_white.png\">assets/arrow_right_white.png<\/file>\n    <file alias=\"down_blue.png\">assets/arrow_down_blue.png<\/file>\n    <file alias=\"up_blue.png\">assets/arrow_up_blue.png<\/file>\n  <\/qresource>\n<\/RCC>\n"}, {"p": "Start-DropLauncher.bat", "s": 1267, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\necho ========================================\r\necho  ドロップランチャー（予備の起動方法です）\r\necho  本来は EXE版 DropLauncher.exe がおすすめです\r\necho ========================================\r\nif not exist app.py (\r\n  echo [エラー] app.py が見つかりません。\r\n  echo ZIPファイルを「すべて展開」してから、展開したフォルダの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist requirements.txt (\r\n  echo [エラー] requirements.txt が見つかりません。\r\n  echo ZIPファイルを「すべて展開」してから、展開したフォルダの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [エラー] Python が見つかりません。EXE版を使ってください（Python不要です）。\r\n  pause\r\n  exit /b 1\r\n)\r\necho ライブラリをインストール／確認しています（初回のみ約180MB）...\r\n%PY% -m pip install --upgrade PySide6-Essentials Pillow openpyxl PyMuPDF pypdf imageio-ffmpeg\r\nif errorlevel 1 (\r\n  echo [エラー] ライブラリのインストールに失敗しました。ネット接続を確認してください。\r\n  pause\r\n  exit /b 1\r\n)\r\necho ドロップランチャーを起動します。この窓は開いたままにしてください（閉じるとアプリも終了します）。\r\n%PY% app.py\r\npause\r\n"}, {"p": "Start-DropLauncher.command", "s": 1618, "l": "bash", "c": "#!/bin/bash\n# DropLauncher - macOS source launcher\n# Double-click this file to run DropLauncher from the source code.\n# First launch only: if macOS blocks it, right-click the file and\n# choose \"Open\" once.\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== DropLauncher (macOS, from source) ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"DropLauncher needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + dependencies (first run only) -----------------\nif [ ! -x \".venv/bin/python\" ]; then\n  echo \"Preparing the app environment (first run only)...\"\n  $PY -m venv .venv || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv/bin/python -m pip install -r requirements.txt || { echo \"Failed to install the required libraries. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nexec .venv/bin/python app.py\n"}, {"p": "tests/test_core.py", "s": 6194, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport sys, subprocess\nfrom pathlib import Path\nsys.path.insert(0, str(Path(__file__).resolve().parent.parent))\nimport core\nimport pytest\n\n@pytest.fixture()\ndef settings(tmp_path):\n    s = dict(core.DEFAULT_SETTINGS)\n    s[\"output_base\"] = str(tmp_path / \"out\")\n    s[\"project\"] = \"作業\"\n    return s\n\ndef test_image(settings, tmp_path):\n    from PIL import Image\n    src = tmp_path / \"big.png\"\n    Image.new(\"RGB\", (2400, 1200), (200, 50, 50)).save(src)\n    dest = core.convert_image(src, settings)\n    assert dest.exists() and dest.suffix == \".jpg\"\n    im = Image.open(dest)\n    assert im.width == 1200\n    # small target attempt\n    settings[\"image_target_kb\"] = 30\n    noisy = tmp_path / \"noise.png\"\n    import random; random.seed(1)\n    im2 = Image.new(\"RGB\", (800, 800))\n    im2.putdata([(random.randint(0,255), random.randint(0,255), random.randint(0,255)) for _ in range(800*800)])\n    im2.save(noisy)\n    d2 = core.convert_image(noisy, settings)\n    assert d2.exists() and d2.stat().st_size > 0\n\ndef _make_pdf(path, texts):\n    import fitz\n    doc = fitz.open()\n    for t in texts:\n        page = doc.new_page()\n        page.insert_text((72, 72), t)\n    doc.save(path); doc.close()\n\ndef test_pdf_merge_split_text(settings, tmp_path):\n    a, b = tmp_path/\"a.pdf\", tmp_path/\"b.pdf\"\n    _make_pdf(a, [\"Hello A1\", \"Hello A2\"]); _make_pdf(b, [\"Hello B1\"])\n    merged = core.pdf_merge([a, b], settings)\n    import fitz; doc = fitz.open(merged); assert doc.page_count == 3; doc.close()\n    pages = core.pdf_split(a, settings)\n    assert len(pages) == 2 and all(p.exists() for p in pages)\n    txt = core.pdf_extract_text(a, settings)\n    assert \"Hello A1\" in txt.read_text(encoding=\"utf-8\")\n\ndef test_sort_rename_undo(settings, tmp_path):\n    f1 = tmp_path/\"x.txt\"; f1.write_text(\"1\")\n    f2 = tmp_path/\"y.txt\"; f2.write_text(\"2\")\n    ops = core.sort_rename_files([f1, f2], settings)\n    assert len(ops) == 2\n    names = sorted(Path(o[\"dst\"]).name for o in ops)\n    assert names[0].endswith(\"_001.txt\") and names[1].endswith(\"_002.txt\")\n    assert not f1.exists()\n    n = core.undo_last(settings)\n    assert n == 2 and f1.exists() and f2.exists()\n\ndef _make_xlsx(path):\n    import openpyxl\n    from openpyxl.styles import Font, PatternFill\n    wb = openpyxl.Workbook(); ws = wb.active; ws.title = \"日報\"\n    ws.append([\"日付\", \"項目\", \"金額\", \"状態\"])\n    ws[\"A1\"].font = Font(bold=True, color=\"FF0000\")\n    ws[\"A1\"].fill = PatternFill(\"solid\", fgColor=\"FFFF00\")\n    ws.append([\"2026-11-12\", \"A\", 100, \"完了\"])\n    ws.append([\"2026-11-12\", \"B\", 250, \"完了\"])\n    ws.append([\"2026-11-12\", \"C\", 50, \"作業中\"])\n    ws.column_dimensions[\"A\"].width = 30\n    wb.save(path)\n\ndef test_transcribe_styled_and_pdf(settings, tmp_path):\n    src = tmp_path/\"in.xlsx\"; _make_xlsx(src)\n    outs = core.transcribe_file(src, settings)\n    names = [o.name for o in outs]\n    assert any(\"書式コピー\" in n for n in names)\n    import openpyxl\n    copied = [o for o in outs if \"書式コピー\" in o.name][0]\n    wb = openpyxl.load_workbook(copied); ws = wb.active\n    assert ws[\"A1\"].fill.fgColor.rgb.endswith(\"FFFF00\")\n    assert ws[\"A1\"].font.bold\n    # PDF -> outputs\n    p = tmp_path/\"t.pdf\"; _make_pdf(p, [\"Transcribe Me\"])\n    outs2 = core.transcribe_file(p, settings)\n    assert any(o.suffix == \".xlsx\" for o in outs2) and any(o.suffix == \".txt\" for o in outs2)\n\ndef test_report(settings, tmp_path):\n    src = tmp_path/\"report.xlsx\"; _make_xlsx(src)\n    r = core.aggregate_report(src, settings)\n    assert r[\"rows\"] == 3 and r[\"done\"] == 2 and r[\"sums\"][\"金額\"] == 400\n    assert \"日報集計\" in r[\"report_text\"] and Path(r[\"txt\"]).exists() and Path(r[\"summary\"]).exists()\n\ndef test_archive(settings, tmp_path):\n    f = tmp_path/\"a.txt\"; f.write_text(\"hello\")\n    z = core.archive_zip([f], settings)\n    assert z.exists() and z.suffix == \".zip\"\n    dest = core.archive_extract(z, settings)\n    assert (Path(dest)/\"a.txt\").exists()\n\ndef test_excel_html_csv(settings, tmp_path):\n    src = tmp_path/\"book.xlsx\"; _make_xlsx(src)\n    h = core.xlsx_to_html(src, settings)\n    content = h.read_text(encoding=\"utf-8\")\n    assert \"background-color\" in content or \"font-weight:bold\" in content\n    csvs = core.xlsx_to_csv(src, settings)\n    assert csvs and \"金額\" in csvs[0].read_text(encoding=\"utf-8-sig\")\n    out, engine = core.convert_to_pdf(src, settings)\n    assert Path(out).exists()\n    # On this Linux VM without LibreOffice, engine must be the HTML fallback\n    print(\"engine:\", engine)\n\ndef test_video(settings, tmp_path):\n    ffmpeg = core.find_ffmpeg(settings)\n    assert ffmpeg, \"ffmpeg not found\"\n    src = tmp_path/\"src.mp4\"\n    subprocess.run([ffmpeg, \"-y\", \"-f\", \"lavfi\", \"-i\", \"testsrc=duration=1:size=320x240:rate=10\",\n                    \"-f\", \"lavfi\", \"-i\", \"sine=frequency=440:duration=1\",\n                    \"-c:v\", \"libx264\", \"-c:a\", \"aac\", \"-shortest\", str(src)],\n                   check=True, capture_output=True)\n    assert src.exists() and src.stat().st_size > 0\n    mp4 = core.convert_video(src, settings, preset=\"mp4\"); assert mp4.exists() and mp4.stat().st_size > 0\n    comp = core.convert_video(src, settings, preset=\"compress\"); assert comp.exists() and comp.stat().st_size > 0\n    mp3 = core.convert_video(src, settings, preset=\"mp3\"); assert mp3.exists() and mp3.stat().st_size > 0 and mp3.suffix == \".mp3\"\n    gif = core.convert_video(src, settings, preset=\"gif\"); assert gif.exists() and gif.stat().st_size > 0\n\ndef test_spaces_and_japanese_folder(settings, tmp_path):\n    work = tmp_path / \"空白 と 日本語フォルダ\"\n    work.mkdir()\n    settings[\"output_base\"] = str(work / \"出力 先\")\n    from PIL import Image\n    img = work / \" MiXeD アクセント é.png\"\n    Image.new(\"RGB\", (1600, 900), (10, 20, 30)).save(img)\n    dest = core.convert_image(img, settings)\n    assert dest.exists()\n    f = work / \"メモ テキスト.txt\"\n    f.write_text(\"abc\")\n    ops = core.sort_rename_files([f], settings)\n    assert ops and Path(ops[0][\"dst\"]).exists()\n    z = core.archive_zip([Path(ops[0][\"dst\"])], settings)\n    assert z.exists()\n    ex = core.archive_extract(z, settings)\n    assert any(Path(ex).rglob(\"*.txt\"))\n"}, {"p": "tests/test_i18n.py", "s": 2916, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport os, re, sys\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nfrom pathlib import Path\nsys.path.insert(0, str(Path(__file__).resolve().parent.parent))\n\nimport i18n_data\nfrom i18n_data import TRANSLATIONS, LANG_ORDER, LANG_NAMES, t\n\ndef _placeholders(s):\n    return set(re.findall(r\"\\{(\\w+)\\}\", s))\n\ndef test_i18n_completeness():\n    assert LANG_ORDER == [\"ja\", \"en\", \"es\", \"zh_CN\", \"fr\", \"de\", \"pt\", \"ru\", \"it\", \"tr\", \"ar\", \"id\", \"ko\"]\n    assert set(LANG_NAMES) == set(LANG_ORDER)\n    base = TRANSLATIONS[\"ja\"]\n    assert len(base) >= 90\n    for lang in LANG_ORDER:\n        d = TRANSLATIONS[lang]\n        assert set(d) == set(base), f\"{lang}: key set differs\"\n        for k, v in d.items():\n            assert isinstance(v, str) and v.strip(), f\"{lang}:{k} empty\"\n            assert _placeholders(v) == _placeholders(base[k]), f\"{lang}:{k} placeholders differ\"\n\ndef test_i18n_formatting():\n    for lang in LANG_ORDER:\n        s = t(lang, \"run_start\", zone=\"image\", count=3)\n        assert \"image\" in s and \"3\" in s\n        s = t(lang, \"log_sort\", name=\"a.txt\", dest=\"/tmp/x\")\n        assert \"a.txt\" in s\n\ndef test_internal_values_unaffected_by_language(tmp_path, monkeypatch):\n    import core\n    monkeypatch.setattr(core, \"APP_DIR\", Path(__file__).resolve().parent.parent)\n    from PySide6.QtWidgets import QApplication\n    from PySide6.QtCore import Qt\n    app = QApplication.instance() or QApplication([])\n    import app as appmod\n    w = appmod.MainWindow()\n    w.settings[\"output_base\"] = str(tmp_path / \"out\")\n    # switch UI to German via the header selector\n    idx = w.lang_combo.findData(\"de\")\n    assert idx >= 0\n    w.lang_combo.setCurrentIndex(idx)\n    assert w.lang == \"de\"\n    # internal enum values stay raw regardless of display language\n    assert w.settings[\"language\"] == \"de\"\n    assert w.video_preset.currentData() == \"mp4\"\n    assert w.settings[\"video_preset\"] in (\"mp4\", \"compress\", \"mp3\", \"gif\")\n    dlg = appmod.SettingsDialog(w.settings, w)\n    assert dlg.sort_mode.currentData() == w.settings[\"sort_mode\"] == \"move\"\n    assert dlg.sort_sub.currentData() == w.settings[\"sort_subfolder\"] == \"ext_date\"\n    res = dlg.result_settings()\n    assert res[\"sort_mode\"] == \"move\" and res[\"sort_subfolder\"] == \"ext_date\"\n    assert res[\"image_format\"] in (\"JPG\", \"WebP\", \"PNG\")\n    dlg.close()\n    # zone titles actually re-rendered in German\n    titles = {k: z.title for k, z in w.zone_widgets}\n    assert titles[\"sort\"] == TRANSLATIONS[\"de\"][\"zone_sort_title\"]\n    # Arabic switches to RTL, Japanese switches back to LTR\n    w.lang_combo.setCurrentIndex(w.lang_combo.findData(\"ar\"))\n    assert app.layoutDirection() == Qt.RightToLeft\n    w.lang_combo.setCurrentIndex(w.lang_combo.findData(\"ja\"))\n    assert app.layoutDirection() == Qt.LeftToRight\n    assert {k: z.title for k, z in w.zone_widgets}[\"sort\"] == TRANSLATIONS[\"ja\"][\"zone_sort_title\"]\n    w.close()\n"}, {"p": "tests/test_mac_compat.py", "s": 3096, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"macOS (darwin) branch tests for the DropLauncher retrofit.\n\nThese tests simulate sys.platform == \"darwin\" on a Linux host and verify\nthat the Mac branches resolve the macOS-standard locations, while the\nWindows branches keep their exact original behaviour.\n\"\"\"\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parent.parent))\nimport core\n\n\ndef test_app_base_dir_darwin(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"darwin\")\n    monkeypatch.setenv(\"HOME\", str(tmp_path))\n    base = core.app_base_dir()\n    assert base == tmp_path / \"Library\" / \"Application Support\" / \"DropLauncher\"\n    assert base.is_dir()\n\n\ndef test_app_base_dir_non_darwin_unchanged(monkeypatch, tmp_path):\n    # On non-darwin the writable APP_DIR (portable) behaviour stays as before.\n    monkeypatch.setattr(sys, \"platform\", \"win32\")\n    monkeypatch.setattr(core, \"APP_DIR\", tmp_path)\n    assert core.app_base_dir() == tmp_path\n\n\ndef test_find_ffmpeg_darwin_prefers_plain_binary(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"darwin\")\n    tools = tmp_path / \"tools\"\n    tools.mkdir()\n    plain = tools / \"ffmpeg\"\n    plain.write_text(\"fake\")\n    # Even if a Windows .exe is sitting next to it, darwin must pick the\n    # plain (extensionless) binary first from APP_DIR/tools.\n    (tools / \"ffmpeg.exe\").write_text(\"fake\")\n    monkeypatch.setattr(core, \"APP_DIR\", tmp_path)\n    monkeypatch.setattr(core, \"BASE_DIR\", tmp_path / \"elsewhere\")\n    assert core.find_ffmpeg({}) == str(plain)\n\n\ndef test_find_ffmpeg_win32_prefers_exe(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"win32\")\n    tools = tmp_path / \"tools\"\n    tools.mkdir()\n    exe = tools / \"ffmpeg.exe\"\n    exe.write_text(\"fake\")\n    (tools / \"ffmpeg\").write_text(\"fake\")\n    monkeypatch.setattr(core, \"APP_DIR\", tmp_path)\n    monkeypatch.setattr(core, \"BASE_DIR\", tmp_path / \"elsewhere\")\n    assert core.find_ffmpeg({}) == str(exe)\n\n\ndef test_find_soffice_darwin_tools_fallback(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"darwin\")\n    tools = tmp_path / \"tools\"\n    tools.mkdir()\n    plain = tools / \"soffice\"\n    plain.write_text(\"fake\")\n    monkeypatch.setattr(core, \"APP_DIR\", tmp_path)\n    monkeypatch.setattr(core, \"BASE_DIR\", tmp_path / \"elsewhere\")\n    monkeypatch.setattr(core.shutil, \"which\", lambda name: None)\n    assert core.find_soffice({}) == str(plain)\n\n\ndef test_find_soffice_darwin_missing_returns_none(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"darwin\")\n    monkeypatch.setattr(core, \"APP_DIR\", tmp_path)\n    monkeypatch.setattr(core, \"BASE_DIR\", tmp_path / \"elsewhere\")\n    monkeypatch.setattr(core.shutil, \"which\", lambda name: None)\n    # /Applications/LibreOffice.app does not exist on this Linux host and\n    # no tools/soffice was created, so the darwin branch must give up\n    # cleanly (the app then uses the HTML fallback and logs the guidance).\n    if not Path(\"/Applications/LibreOffice.app/Contents/MacOS/soffice\").exists():\n        assert core.find_soffice({}) is None\n"}, {"p": "tests/test_ui.py", "s": 1301, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport os, sys\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nfrom pathlib import Path\nsys.path.insert(0, str(Path(__file__).resolve().parent.parent))\n\ndef test_ui_smoke(tmp_path, monkeypatch):\n    import core\n    monkeypatch.setattr(core, \"APP_DIR\", Path(__file__).resolve().parent.parent)\n    from PySide6.QtWidgets import QApplication\n    app = QApplication.instance() or QApplication([])\n    import app as appmod\n    # point settings to tmp\n    w = appmod.MainWindow()\n    w.settings[\"output_base\"] = str(tmp_path / \"out\")\n    w.settings[\"project\"] = \"作業\"\n    # sample files\n    from PIL import Image\n    img = tmp_path/\"p.png\"; Image.new(\"RGB\", (1600, 800), (0, 128, 0)).save(img)\n    outs = w.process_files(\"image\", [img]); assert outs and Path(outs[0]).exists()\n    import fitz\n    doc = fitz.open(); pg = doc.new_page(); pg.insert_text((72, 72), \"UI test\")\n    pdf = tmp_path/\"u.pdf\"; doc.save(pdf); doc.close()\n    outs = w.process_files(\"transcribe\", [pdf]); assert outs\n    merged = w.process_files(\"pdf_merge\", [pdf]); assert Path(merged).exists()\n    f = tmp_path/\"z.txt\"; f.write_text(\"zip me\")\n    z = w.process_files(\"zip\", [f]); assert z and Path(z[0]).exists()\n    ex = w.process_files(\"unzip\", z); assert ex and Path(ex[0]).exists()\n    w.close()\n"}]</script>

<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
