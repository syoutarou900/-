<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('gq-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;}}catch(e){}})();</script>
<title>DropLauncher のソースコード | get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#0D1526; --surface:#111C33; --surface2:#182747;
  --codebg:#0D1117; --ink:#E8EEF8; --muted:#93A5C4; --faint:#5B6E92; --line:#22314F;
  --line-soft:rgba(34,49,79,.55); --gutter-line:#21262D; --gutter-ink:#484F58;
  --accent:#3B82F6; --accent-strong:#60A5FA; --accent-soft:rgba(59,130,246,.16);
  --active-ink:#FFFFFF;
  --font-body:"Inter","Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F8FD; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#E7EFFD;
  --codebg:#FFFFFF; --ink:#0F1B33; --muted:#3B4A66; --faint:#64748B; --line:#DFE7F3;
  --line-soft:#E7EDF6; --gutter-line:#D8DEE4; --gutter-ink:#6E7781;
  --accent:#2563EB; --accent-strong:#1D4ED8; --accent-soft:rgba(37,99,235,.12);
  --active-ink:#1D4ED8;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:var(--accent-strong)}
/* ===== top bar ===== */
.topbar{flex:none;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;
  padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .appname{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .appname .ja{color:var(--muted);font-size:.82em;font-weight:700;margin-left:10px}
.topbar .meta{color:var(--faint);font-size:.85rem;white-space:nowrap}
.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:18px}
.topbar nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
.topbar nav a:hover{color:var(--ink)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 18px;border-radius:999px;
  box-shadow:0 8px 20px -6px rgba(37,99,235,.5);white-space:nowrap}
.dlbtn:hover{filter:brightness(1.12)}
.dlbtn svg{flex:none}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  cursor:pointer;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ic-moon{display:none}
:root[data-theme="light"] .themebtn .ic-moon{display:block}
:root[data-theme="light"] .themebtn .ic-sun{display:none}
.langpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.85rem;font-weight:700;
  line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;cursor:pointer;max-width:190px}
.langpick select:hover{border-color:var(--accent)}
/* ===== main split ===== */
.main{flex:1;display:flex;min-height:0}
.filelist{width:284px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--panel);
  border-right:1px solid var(--line)}
[dir="rtl"] .filelist{border-right:0;border-left:1px solid var(--line)}
.filelist .fl-head{padding:11px 16px;font-weight:800;font-size:.86rem;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.file-btn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);color:var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:.8rem;line-height:1.45;
  text-align:left;cursor:pointer;word-break:break-all}
.file-btn:hover{background:var(--surface2)}
.file-btn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);color:var(--active-ink)}
[dir="rtl"] .file-btn.active{box-shadow:inset -3px 0 0 var(--accent)}
.file-btn .sz{color:var(--faint);font-size:.7rem;flex:none}
.file-bin{padding:9px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);
  font-size:.8rem;line-height:1.45;color:var(--faint);word-break:break-all}
.file-bin .sz{font-size:.7rem;margin-left:8px}
.bin-note{display:block;font-family:var(--font-body);font-size:.72rem;color:#64748B;margin-top:1px}
/* ===== code pane ===== */
.codepane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--codebg)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .fname{font-family:var(--font-mono);font-size:.95rem;font-weight:700;word-break:break-all}
.toolbar .finfo{color:var(--muted);font-size:.85rem;white-space:nowrap}
.copybtn{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:7px 18px;border-radius:999px}
[dir="rtl"] .copybtn{margin-left:0;margin-right:auto}
.copybtn:hover{filter:brightness(1.12)}
.copybtn.done{background:#0E9F6E}
.code-scroll{flex:1;overflow:auto;min-height:0;direction:ltr}
.code-flex{display:flex;min-width:max-content;min-height:100%}
.gutter{flex:none;position:sticky;left:0;z-index:1;background:var(--codebg);
  border-right:1px solid var(--gutter-line);text-align:right;user-select:none;white-space:pre;
  font-family:var(--font-mono);font-size:16px;line-height:1.75;
  padding:16px 12px 24px 18px;color:var(--gutter-ink)}
.code-flex pre.code{flex:1;margin:0;padding:16px 28px 24px 20px;
  font-family:var(--font-mono);font-size:16px;line-height:1.75}
.code-flex pre.code code{font-family:inherit;font-size:inherit;line-height:inherit;
  background:transparent;padding:0;white-space:pre}
/* ===== highlight.js GitHub Dark (default) ===== */
.hljs{color:#E6EDF3;background:#0D1117}
.hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-variable,
.hljs-template-tag,.hljs-type,.hljs-variable.language_{color:#FF7B72}
.hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,
.hljs-title.function_{color:#D2A8FF}
.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,
.hljs-variable,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:#79C0FF}
.hljs-regexp,.hljs-string,.hljs-meta .hljs-string{color:#A5D6FF}
.hljs-built_in,.hljs-symbol{color:#FFA657}
.hljs-comment,.hljs-code,.hljs-formula{color:#8B949E}
.hljs-name,.hljs-quote,.hljs-selector-tag,.hljs-selector-pseudo{color:#7EE787}
.hljs-subst{color:#E6EDF3}
.hljs-section{color:#1F6FEB;font-weight:bold}
.hljs-bullet{color:#F2CC60}
.hljs-emphasis{color:#E6EDF3;font-style:italic}
.hljs-strong{color:#E6EDF3;font-weight:bold}
.hljs-addition{color:#AFF5B4;background-color:#033A16}
.hljs-deletion{color:#FFDCD7;background-color:#67060C}
.hljs-char.escape_,.hljs-link,.hljs-params,.hljs-property,.hljs-punctuation,.hljs-tag{/* purposely ignored */}
/* ===== highlight.js GitHub Light ===== */
:root[data-theme="light"] .hljs{color:#24292E;background:#FFFFFF}
:root[data-theme="light"] .hljs-doctag,:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-meta .hljs-keyword,:root[data-theme="light"] .hljs-template-variable,
:root[data-theme="light"] .hljs-template-tag,:root[data-theme="light"] .hljs-type,
:root[data-theme="light"] .hljs-variable.language_{color:#D73A49}
:root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.class_,
:root[data-theme="light"] .hljs-title.class_.inherited__,
:root[data-theme="light"] .hljs-title.function_{color:#6F42C1}
:root[data-theme="light"] .hljs-attr,:root[data-theme="light"] .hljs-attribute,
:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-meta,
:root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-operator,
:root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-selector-attr,
:root[data-theme="light"] .hljs-selector-class,:root[data-theme="light"] .hljs-selector-id{color:#005CC5}
:root[data-theme="light"] .hljs-regexp,:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-meta .hljs-string{color:#032F62}
:root[data-theme="light"] .hljs-built_in,:root[data-theme="light"] .hljs-symbol{color:#E36209}
:root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-code,
:root[data-theme="light"] .hljs-formula{color:#6A737D}
:root[data-theme="light"] .hljs-name,:root[data-theme="light"] .hljs-quote,
:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-selector-pseudo{color:#22863A}
:root[data-theme="light"] .hljs-subst{color:#24292E}
:root[data-theme="light"] .hljs-section{color:#005CC5;font-weight:bold}
:root[data-theme="light"] .hljs-bullet{color:#735C0F}
:root[data-theme="light"] .hljs-emphasis{color:#24292E;font-style:italic}
:root[data-theme="light"] .hljs-strong{color:#24292E;font-weight:bold}
:root[data-theme="light"] .hljs-addition{color:#22863A;background-color:#F0FFF4}
:root[data-theme="light"] .hljs-deletion{color:#B31D28;background-color:#FFEEF0}
@media (max-width:760px){
  .main{flex-direction:column}
  .filelist{width:auto;flex:none;max-height:158px;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line)}
  .filelist .fl-head{position:static}
  .filelist .fl-items{display:flex;flex-direction:row;overflow-x:auto}
  .file-btn,.file-bin{flex:none;border-bottom:0;border-right:1px solid var(--line-soft);
    white-space:nowrap;word-break:normal;align-items:center}
  .code-flex pre.code,.gutter{font-size:14.5px}
  .topbar .meta{display:none}
  .langpick select{max-width:140px}
}
</style>

str)\n\nclass DropZone(QWidget):\n    \"\"\"立体カード型ドロップ枠。大きなアイコンバッジ＋太い下縁＋影で奥行きを出す。\n    ドロップだけでなく、クリックでファイル選択ダイアログからも処理できる。\"\"\"\n    def __init__(self, icon, title, subtitle, accent, handler, parent=None, hint=\"\", lang=\"ja\"):\n        super().__init__(parent)\n        self.setObjectName(\"zone\")\n        self.accent = accent\n        self.title = title\n        self.handler = handler\n        self.lang = lang\n        self.setAcceptDrops(True)\n        self.setMinimumHeight(144)\n        self.setMaximumHeight(170)\n        self.setCursor(Qt.PointingHandCursor)\n        self._active = False\n        self.setStyleSheet(\"QWidget#zone { background:transparent; }\")\n        self._shadow = QGraphicsDropShadowEffect(self)\n        self._shadow.setBlurRadius(20); self._shadow.setOffset(0, 6)\n        self._shadow.setColor(QColor(31, 78, 140, 58))\n        self.setGraphicsEffect(self._shadow)\n        lay = QVBoxLayout(self)\n        lay.setContentsMargins(10, 10, 10, 8); lay.setSpacing(3)\n        badge = QLabel(icon); badge.setAlignment(Qt.AlignCenter)\n        badge.setFixedSize(52, 52)\n        badge.setStyleSheet(\n            f\"font-size:19px; border-radius:26px;\"\n            f\"background: qlineargradient(x1:0, y1:0, x2:0, y2:1,\"\n            f\" stop:0 {_lighten(accent, 165)}, stop:1 {accent});\"\n            f\" border:2px solid rgba(255,255,255,0.85);\")\n        brow = QHBoxLayout(); brow.addStretch(); brow.addWidget(badge); brow.addStretch()\n        lay.addLayout(brow)\n        lay.addSpacing(5)\n        ti = QLabel(title); ti.setAlignment(Qt.AlignCenter); self._title_lbl = ti\n        ti.setStyleSheet(\"font-size:15.5px; font-weight:bold; color:#12293f; background:transparent;\")\n        lay.addWidget(ti)\n        self._sub_lbls = []\n        for line in subtitle.split(\"\\n\"):\n            su = QLabel(line); su.setAlignment(Qt.AlignCenter)\n            su.setStyleSheet(\"font-size:12px; color:#52687e; background:transparent;\")\n            lay.addWidget(su); self._sub_lbls.append(su)\n        self._hint_lbl = QLabel(hint)\n        self._hint_lbl.setAlignment(Qt.AlignCenter)\n        self._hint_lbl.setStyleSheet(f\"font-size:10.5px; font-weight:bold; color:{accent}; background:transparent;\")\n        lay.addWidget(self._hint_lbl)\n    def set_texts(self, title, subtitle, hint, lang):\n        self.title = title; self.lang = lang\n        self._title_lbl.setText(title)\n        lines = subtitle.split(\"\\n\")\n        for i, lb in enumerate(self._sub_lbls):\n            lb.setText(lines[i] if i < len(lines) else \"\")\n        self._hint_lbl.setText(hint)\n    def _set_active(self, on):\n        self._active = on\n        self._shadow.setBlurRadius(30 if on else 20)\n        self._shadow.setOffset(0, 9 if on else 6)\n        self.update()\n    def paintEvent(self, e):\n        # 立体カードを直接描く：白→淡色グラデーション、太い下縁、上面の光沢ライン\n        from PySide6.QtGui import QPainter, QLinearGradient, QPen, QBrush\n        from PySide6.QtCore import QRectF\n        p = QPainter(self)\n        p.setRenderHint(QPainter.Antialiasing)\n        accent = QColor(self.accent)\n        r = QRectF(self.rect()).adjusted(1.5, 1.5, -1.5, -5.5)\n        grad = QLinearGradient(r.topLeft(), r.bottomLeft())\n        if self._active:\n            grad.setColorAt(0, accent.lighter(185)); grad.setColorAt(1, accent.lighter(160))\n        else:\n            grad.setColorAt(0, QColor(\"#ffffff\")); grad.setColorAt(0.55, accent.lighter(214)); grad.setColorAt(1, accent.lighter(196))\n        p.setBrush(QBrush(grad))\n        p.setPen(QPen(accent, 2.5 if self._active else 1.6))\n        p.drawRoundedRect(r, 16, 16)\n        # 太い下縁（カードの厚み）\n        p.save()\n        from PySide6.QtGui import QPainterPath\n        clip = QPainterPath(); clip.addRoundedRect(r, 16, 16); p.setClipPath(clip)\n        p.setPen(Qt.NoPen); p.setBrush(accent)\n        p.drawRect(QRectF(r.left(), r.bottom() - 3.5, r.width(), 5))\n        # 上面ハイライト\n        p.setBrush(QColor(255, 255, 255, 110))\n        p.drawRect(QRectF(r.left() + 8, r.top() + 1.5, r.width() - 16, 2))\n        p.restore()\n        super().paintEvent(e)\n    def mouseReleaseEvent(self, e):\n        if e.button() == Qt.LeftButton:\n            files, _ = QFileDialog.getOpenFileNames(self, _t(self.lang, \"select_files_title\", title=self.title))\n            if files:\n                self.handler(files)\n    def dragEnterEvent(self, e):\n        if e.mimeData().hasUrls():\n            self._set_active(True); e.acceptProposedAction()\n    def dragLeaveEvent(self, e):\n        self._set_active(False)\n    def dragMoveEvent(self, e):\n        if e.mimeData().hasUrls():\n            e.acceptProposedAction()\n    def dropEvent(self, e):\n        self._set_active(False)\n        files = [u.toLocalFile() for u in e.mimeData().urls() if u.isLocalFile()]\n        if files:\n            self.handler(files)\n        e.acceptProposedAction()\n\nclass SettingsDialog(QDialog):\n    def __init__(self, settings, parent=None):\n        super().__init__(parent)\n        self.lang = settings.get(\"language\", \"ja\")\n        self.setWindowTitle(_t(self.lang, \"settings_win_title\"))\n        self.setStyleSheet(APP_STYLE)\n        self.resize(560, 430)\n        self.settings = dict(settings)\n        outer = QVBoxLayout(self)\n        head = QLabel(_t(self.lang, \"settings_head\")); head.setStyleSheet(\"font-size:16px; font-weight:bold; background:transparent;\")\n        outer.addWidget(head)\n        formw = QWidget(); form = QFormLayout(formw)\n        self.output = QLineEdit(settings[\"output_base\"])\n        row = QHBoxLayout(); row.addWidget(self.output)\n        btn = QPushButton(_t(self.lang, \"browse_btn\")); btn.clicked.connect(self._browse); row.addWidget(btn)\n        form.addRow(_t(self.lang, \"set_output\"), row)\n        self.project = QLineEdit(settings[\"project\"]); form.addRow(_t(self.lang, \"set_project\"), self.project)\n        self.sort_mode = QComboBox()\n        for _val, _key in ((\"move\", \"disp_move\"), (\"copy\", \"disp_copy\")):\n            self.sort_mode.addItem(_t(self.lang, _key), _val)\n        self.sort_mode.setCurrentIndex(max(self.sort_mode.findData(settings[\"sort_mode\"]), 0))\n        form.addRow(_t(self.lang, \"set_sort_mode\"), self.sort_mode)\n        self.sort_sub = QComboBox()\n        for _val, _key in ((\"ext_date\", \"disp_sub_ext_date\"), (\"ext\", \"disp_sub_ext\"), (\"date\", \"disp_sub_date\"), (\"none\", \"disp_sub_none\")):\n            self.sort_sub.addItem(_t(self.lang, _key), _val)\n        self.sort_sub.setCurrentIndex(max(self.sort_sub.findData(settings[\"sort_subfolder\"]), 0))\n        form.addRow(_t(self.lang, \"set_sort_sub\"), self.sort_sub)\n        self.img_w = QSpinBox(); self.img_w.setRange(100, 8000); self.img_w.setValue(int(settings[\"image_max_width\"]))\n        form.addRow(_t(self.lang, \"set_img_width\"), self.img_w)\n        self.img_kb = QSpinBox(); self.img_kb.setRange(10, 20000); self.img_kb.setValue(int(settings[\"image_target_kb\"]))\n        form.addRow(_t(self.lang, \"set_img_kb\"), self.img_kb)\n        self.img_fmt = QComboBox(); self.img_fmt.addItems([\"JPG\", \"WebP\", \"PNG\"])\n        self.img_fmt.setCurrentText(settings[\"image_format\"]); form.addRow(_t(self.lang, \"set_img_fmt\"), self.img_fmt)\n        self.soffice = QLineEdit(settings[\"soffice_path\"]); form.addRow(_t(self.lang, \"set_soffice\"), self.soffice)\n        outer.addWidget(formw)\n        ok = QPushButton(_t(self.lang, \"save_btn\")); ok.setObjectName(\"bigPrimary\"); ok.clicked.connect(self.accept)\n        outer.addWidget(ok)\n    def _browse(self):\n        d = QFileDialog.getExistingDirectory(self, _t(self.lang, \"browse_title\"))\n        if d:\n            self.output.setText(d)\n    def result_settings(self):\n        s = self.settings\n        s.update({\"output_base\": self.output.text().strip() or core.default_output_base(),\n                  \"project\": self.project.text().strip() or \"作業\ ctName(\"appBadge\")\n        rightcol = QVBoxLayout(); rightcol.setSpacing(6)\n        rightcol.addWidget(badge, 0, Qt.AlignRight)\n        langrow = QHBoxLayout(); langrow.setSpacing(6)\n        self.lang_label = QLabel(_t(self.lang, \"lang_label\")); self.lang_label.setObjectName(\"langLabel\")\n        langrow.addWidget(self.lang_label)\n        self.lang_combo = QComboBox(); self.lang_combo.setObjectName(\"langCombo\")\n        for _code in LANG_ORDER:\n            self.lang_combo.addItem(LANG_NAMES[_code], _code)\n        self.lang_combo.setCurrentIndex(LANG_ORDER.index(self.lang))\n        self.lang_combo.currentIndexChanged.connect(self._on_language_changed)\n        langrow.addWidget(self.lang_combo)\n        rightcol.addLayout(langrow)\n        hl.addLayout(rightcol)\n        root.addWidget(header)\n\n        # ---- toolbar ----\n        toolbar = QFrame(); toolbar.setObjectName(\"toolbar\")\n        top = QHBoxLayout(toolbar); top.setContentsMargins(12, 8, 12, 8)\n        self.top_check = QCheckBox(_t(self.lang, \"always_on_top\")); self.top_check.setChecked(bool(self.settings.get(\"always_on_top\", True)))\n        self.top_check.stateChanged.connect(self._apply_top)\n        top.addWidget(self.top_check)\n        top.addStretch()\n        self.preset_lbl = QLabel(_t(self.lang, \"video_preset_label\")); top.addWidget(self.preset_lbl)\n        self.video_preset = QComboBox()\n        for _val, _disp in ((\"mp4\", \"MP4\"), (\"compress\", _t(self.lang, \"disp_preset_compress\")), (\"mp3\", _t(self.lang, \"disp_preset_mp3\")), (\"gif\", \"GIF\")):\n            self.video_preset.addItem(_disp, _val)\n        self.video_preset.setCurrentIndex(max(self.video_preset.findData(self.settings.get(\"video_preset\", \"mp4\")), 0))\n        self.video_preset.currentIndexChanged.connect(self._on_preset_changed)\n        top.addWidget(self.video_preset)\n        self.set_btn = QPushButton(_t(self.lang, \"settings_btn\")); self.set_btn.clicked.connect(self._open_settings wn zone: {key}\")\n\n    def _on_preset_changed(self, *a):\n        v = self.video_preset.currentData()\n        if v:\n            self.settings.update({\"video_preset\": v})\n\n    def _on_language_changed(self, *a):\n        code = self.lang_combo.currentData()\n        if not code or code == self.lang:\n            return\n        self.lang = code\n        self.settings[\"language\"] = code\n        core.save_settings(self.settings)\n        self.apply_language()\n\n    def apply_language(self):\n        lang = self.lang\n        self.setWindowTitle(_t(lang, \"app_title\"))\n        self.title_lbl.setText(_t(lang, \"app_title\"))\n        self.sub_lbl.setText(_t(lang, \"app_subtitle\"))\n        self.lang_label.setText(_t(lang, \"lang_label\"))\n        self.top_check.setText(_t(lang, \"always_on_top\"))\n        self.preset_lbl.setText(_t(lang, \"video_preset_label\"))\n        cur = self.video_preset.currentData()\n        self.video_preset.blockSignals(True)\n        self.video_preset.clear()\n        for _val, _disp in ((\"mp4\", \"MP4\"), (\"compress\", _t(lang, \"disp_preset_compress\")), (\"mp3\", _t(lang, \"disp_preset_mp3\")), (\"gif\", \"GIF\")):\n            self.video_preset.addItem(_disp, _val)\n        self.video_preset.setCurrentIndex(max(self.video_preset.findData(cur), 0))\n        self.video_preset.blockSignals(False)\n        self.set_btn.setText(_t(lang, \"settings_btn\"))\n        self.undo_btn.setText(_t(lang, \"undo_btn\"))\n        self.zones_lbl.setText(_t(lang, \"zones_label\"))\n        for key, z in self.zone_widgets:\n            z.set_texts(_t(lang, f\"zone_{key}_title\"), _t(lang, f\"zone_{key}_sub\"), _t(lang, \"zone_hint\"), lang)\n        self.log_lbl.setText(_t(lang, \"log_label\"))\n        self.out_btn.setText(_t(lang, \"open_output_btn\"))\n        direction = Qt.RightToLeft if lang == \"ar\" else Qt.LeftToRight\n        app = QApplication.instance()\n        if app is not None:\n            app.setLayoutDirection(direction) processing functions.\nGeneric Windows app: no hardcoded user names / machine names / absolute paths.\nKnown folders are resolved via environment / Path.home() only.\n\"\"\"\nimport copy, csv, datetime, email, html, json, os, re, shutil, subprocess, sys, zipfile\nfrom pathlib import Path\n\nAPP_DIR = Path(__file__).resolve().parent\n\ntry:\n    from i18n_data import t as _it, LANG_ORDER as _LANGS\nexcept Exception:  # i18n_data ships with the app; fallback keeps core usable alone\n    _LANGS = [\"ja\"]\n    def _it(lang, key, **kw):\n        return key\n\ndef _lang(settings):\n    if isinstance(settings, dict):\n        lang = settings.get(\"language\") or \"ja\"\n        return lang if lang in _LANGS else \"ja\"\n    return \"ja\"\n\ndef _t(settings, key, **kw):\n    return _it(_lang(settings), key, **kw)\n\ndef app_base_dir():\n    \"\"\"Writable base dir for settings/logs: beside the exe/app when writable (portable),\n    else %LOCALAPPDATA%/DropLauncher, else ~/.DropLauncher. No admin rights needed.\n    macOS (darwin) always uses the standard ~/Library/Application Support/DropLauncher,\n    because a built .app bundle is not a writable location.\"\"\"\n    if sys.platform == \"darwin\":\n        base = Path.home() / \"Library\" / \"Application Support\" / \"DropLauncher\"\n        try:\n            base.mkdir(parents=True, exist_ok=True)\n            return base\n        except Exception:\n            return Path.home()\n    try:\n        test = APP_DIR / \".dl_write_test\"\n        test.write_text(\"x\", encoding=\"utf-8\"); test.unlink()\n        return APP_DIR\n    except Exception:\n        pass\n    local = os.environ.get(\"LOCALAPPDATA\")\n    base = (Path(local) / \"DropLauncher\") if local else (Path.home() / \".DropLauncher\")\n    try:\n        base.mkdir(parents=True, exist_ok=True)\n        return base\n    except Exception:\n        return Path.home()\n\nBASE_DIR = app_base_dir()\n\ndef default_documents_dir():\n    \"\"\"Resolve Documents via env where possible (Windows Known Folder fallbacks), else ~/Documents.\"\"\"\n    # OneDrive / redirected folders may set USERPROFILE; Path.home() is locale-independent.\n    docs = Path.home() / \"Documents\"\n    return docs\n\ndef default_output_base():\n    try:\n        docs = default_documents_dir()\n        docs.mkdir(parents=True, exist_ok=True)\n        test = docs / \".dl_write_test\"\n        test.write_text(\"x\", encoding=\"utf-8\"); test.unlink()\n        return str(docs / \"DropLauncher-Out\")\n    except Exception:\n        return str(BASE_DIR / \"output\")\n\nDEFAULT_SETTINGS = {\n    \"output_base\": \"\",\n    \"project\": \"作業\",\n    \"sort_mode\": \"move\",\n    \"sort_subfolder\": \"ext_date\",\n    \"image_max_width\": 1200,\n    \"image_target_kb\": 500,\n    \"image_format\": \"JPG\",\n    \"video_preset\": \"mp4\",\n    \"soffice_path\": \"\",\n    \"always_on_top\": True,\n    \"language\": \"ja\",\n}\n\ndef settings_path():\n    return BASE_DIR / \"settings.json\"\n\ndef load_settings(path=None):\n    p = Path(path) if path else settings_path()\n    s = dict(DEFAULT_SETTINGS)\n    # also accept a settings.json beside the app for portable use\n    alt = APP_DIR / \"settings.json\"\n    src = p if p.exists() else (alt if alt.exists() else p)\n    if src.exists():\n        try:\n            s.update(json.loads(src.read_text(encoding=\"utf-8\")))\n        except Exception:\n            pass\n    if not s.get(\"output_base\"):\n        s[\"output_base\"] = default_output_base()\n    return s\n\ndef save_settings(s, path=None):\n    p = Path(path) if path else settings_path()\n    p.parent.mkdir(parents=True, exist_ok=True)\n    p.write_text(json.dumps(s, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n    return p\n\ndef out_dir(settings, sub):\n    d = Path(settings[\"output_base\"]) / sub\n    d.mkdir(parents=True, exist_ok=True)\n    return d\n\ndef today_str():\n    return datetime.date.today().strftime(\"%Y%m%d\")\n\ndef log_error(msg):\n    try:\n        with open(BASE_DIR / \"DropLauncher-error.log\", \"a\", encoding=\"utf-8\") as f:\n            f.write(f\"[{datetime.datetime.now().isoformat(timespec='seconds')}] {msg}\\n\")\n    except Exception:\n        pass\n\ndef unique_path(path):\n    path = Path(path)\n    if not path.exists():\n        return path\n    i = 2\n    while True:\n        cand = path.with_name(f\"{path.stem}_{i}{path.suffix}\")\n        if not cand.exists():\n            return cand\n        i += 1\n\n# ---------------- 1. Transcribe ----------------\ndef extract_text_from_file(path, lang=\"ja\"):\n    path = Path(path)\n    ext = path.suffix.lower()\n    text_parts, tables = [], []\n    if ext == \".pdf\":\n        import fitz\n        doc = fitz.open(path)\n        for pi, page in enumerate(doc):\n            t = page.get_text()\n            text_parts.append(f\"--- ページ {pi+1} ---\\n{t}\")\n            try:\n                for tab in page.find_tables().tables:\n                    rows = tab.extract()\n                    if rows:\n                        tables.append([[(\"\" if c is None else str(c)) for c in r] for r in rows])\n            except Exception:\n                pass\n        doc.close()\n    elif ext in (\".xlsx\", \".xlsm\"):\n        import openpyxl\n        wb = openpyxl.load_workbook(path, data_only=True)\n        for ws in wb.worksheets:\n            rows = []\n            for row in ws.iter_rows(values_only=True):\n                r = [(\"\" if c is None else str(c)) for c in row]\n                if any(c.strip() for c in r):\n                    rows.append(r)\n            if rows:\n                tables.append(rows)\n                text_parts.append(f\"--- シート {ws.title} ---\\n\" + \"\\n\".join(\"\\t\".join(r) for r in rows))\n        wb.close()\n    elif ext == \".csv\":\n        rows = []\n        for enc in (\"utf-8-sig\", \"cp932\", \"utf-8\"):\n            try:\n                with open(path, newline=\"\", encoding=enc) as f:\n                    rows = list(csv.reader(f))\n                break\n            except Exception:\n                rows = []\n        tables.append(rows)\n        text_parts.append(\"\\n\".join(\",\".join(r) for r in rows))\n    elif ext == \".eml\":\n        msg = email.message_from_binary_file(open(path, \"rb\"))\n        text_parts.append(f\"件名: {msg.get('Subject','')}\\n差出人: {msg.get('From','')}\\n宛先: {msg.get('To','')}\\n\")\n        body = \"\"\n        if msg.is_multipart():\n            for part in msg.walk():\n                if part.get_content_type() == \"text/plain\":\n                    try:\n                        body += part.get_payload(decode=True).decode(part.get_content_charset() or \"utf-8\", errors=\"replace\")\n                    except Exception:\n                        pass\n        else:\n            try:\n                body = msg.get_payload(decode=True).decode(msg.get_content_charset() or \"utf-8\", errors=\"replace\")\n            except Exception:\n                body = str(msg.get_payload())\n        text_parts.append(body)\n    elif ext in (\".txt\", \".md\", \".log\"):\n        for enc in (\"utf-8-sig\", \"cp932\", \"utf-8\"):\n            try:\n                text_parts.append(path.read_text(encoding=enc)); break\n            except Exception:\n                continue\n    else:\n        raise ValueError(_it(lang, \"err_transcribe_unsupported\", ext=ext))\n    return \"\\n\".join(text_parts), tables\n\ndef styled_header_cell(cell):\n    from openpyxl.styles import Font, PatternFill, Alignment, Border, Side\n    cell.font = Font(bold=True, color=\"FFFFFF\")\n    cell.fill = PatternFill(\"solid\", fgColor=\"4472C4\")\n    cell.alignment = Alignment(horizontal=\"center\", vertical=\"center\", wrap_text=True)\n    thin = Side(style=\"thin\", color=\"B0B0B0\")\n    cell.border = Border(left=thin, right=thin, top=thin, bottom=thin)\n\ndef write_styled_xlsx(tables, text, dest):\n    import openpyxl\n    wb = openpyxl.Workbook()\n    if tables:\n        wb.remove(wb.active)\n        for i, rows in enumerate(tables):\n            ws = wb.create_sheet(title=f\"表{i+1}\"[:31])\n            for r, row in enumerate(rows):\n                for c, val in enumerate(row):\n                    cell = ws.cell(row=r+1, column=c+1, value=val)\n                    if r == 0:\n                        styled_header_cell(cell)\n            for c in range(len(rows[0]) if rows else 0):\n                ws.column_dimensions[openpyxl.utils.get_column_letter(c+1)].width = 22\n        ws = wb.create_sheet(title=\"全文テキスト\")\n        for i, line in enumerate(text.splitlines()):\n            ws.cell(row=i+1, column=1, value=line)\n        ws.column_dimensions[\"A\"].width = 110\n    else:\n        ws = wb.active; ws.title = \"全文テキスト\"\n        for i, line in enumerate(text.splitlines()):\n            ws.cell(row=i+1, column=1, value=line)\n        ws.column_dimensions[\"A\"].width = 110\n    wb.save(dest)\n\ndef copy_xlsx_styled(src, dest):\n    \"\"\"Excel->Excel styled copy preserving value/font/fill/border/alignment/number_format/widths/merges.\"\"\"\n    import openpyxl\n    wb = openpyxl.load_workbook(src)\n    for ws in wb.worksheets:\n        for row in ws.iter_rows():\n            for cell in row:\n                if cell.has_style:\n                    cell.font = copy.copy(cell.font)\n                    cell.fill = copy.copy(cell.fill)\n                    cell.border = copy.copy(cell.border)\n                    cell.alignment = copy.copy(cell.alignment)\n                    cell.protection = copy.copy(cell.protection)\n    wb.save(dest)\n    return dest\n\ndef transcribe_file(path, settings, log=lambda m: None):\n    path = Path(path)\n    out = out_dir(settings, \"transcribe\")\n    stem = f\"{today_str()}_{path.stem}\"\n    outputs = []\n    if path.suffix.lower() in (\".xlsx\", \".xlsm\"):\n        dest = unique_path(out / f\"{stem}_書式コピー.xlsx\")\n        copy_xlsx_styled(path, dest); outputs.append(dest)\n        log(_t(settings, \"log_excel_copy\", name=dest.name))\n    text, tables = extract_text_from_file(path, lang=_lang(settings))\n    xlsx = unique_path(out / f\"{stem}.xlsx\")\n    write_styled_xlsx(tables, text, xlsx); outputs.append(xlsx)\n    txt = unique_path(out / f\"{stem}.txt\")\n    txt.write_text(text, encoding=\"utf-8\"); outputs.append(txt)\n    if tables:\n        csvo = unique_path(out / f\"{stem}.csv\")\n        with open(csvo, \"w\", newline=\"\", encoding=\"utf-8-sig\") as f:\n            w = csv.writer(f)\n            for rows in tables:\n                w.writerows(rows); w.writerow([])\n        outputs.append(csvo)\n    log(_t(settings, \"log_transcribe\", name=path.name, chars=len(text), tables=len(tables)))\n    return outputs\n\n# ---------------- 2. Sort & rename ----------------\nHISTORY_FILE = \"history.json\"\n\ndef _history_path(settings):\n    return Path(settings[\"output_base\"]) / HISTORY_FILE\n\ndef load_history(settings):\n    p = _history_path(settings)\n    if p.exists():\n        try:\n            return json.loads(p.read_text(encoding=\"utf-8\"))\n        except Exception:\n            return []\n    return []\n\ndef save_history(settings, hist):\n    Path(settings[\"output_base\"]).mkdir(parents=True, exist_ok=True)\n    _history_path(settings).write_text(json.dumps(hist, ensure_ascii=False, indent=2), encoding=\"utf-8\")\n\ndef sort_rename_files(files, settings, log=lambda m: None):\n    base = Path(settings[\"output_base\"]) / \"sorted\"\n    base.mkdir(parents=True, exist_ok=True)\n    date = today_str(); project = settings.get(\"project\") or \"作業\"\n    mode = settings.get(\"sort_subfolder\", \"ext_date\")\n    ops = []\n    seq = 1\n    existing = []\n    for root, _dirs, fnames in os.walk(base):\n        existing.extend(fnames)\n    pat = re.compile(rf\"^{date}_{re.escape(project)}_(\\d{{3}})\")\n    for name in existing:\n        m = pat.match(name)\n        if m:\n            seq = max(seq, int(m.group(1)) + 1)\n    for f in files:\n        f = Path(f)\n        if not f.exists():\n            log(_t(settings, \"log_not_found\", path=f)); continue\n        sub = base\n        ext = f.suffix.lower().lstrip(\".\") or \"noext\"\n        if mode in (\"ext\", \"ext_date\"):\n            sub = sub / ext\n        if mode in (\"date\", \"ext_date\"):\n            sub = sub / date\n        sub.mkdir(parents=True, exist_ok=True)\n        while True:\n            dest = sub / f\"{date}_{project}_{seq:03d}{f.suffix.lower()}\"\n            seq += 1\n            if not dest.exists():\n                break\n        if settings.get(\"sort_mode\", \"move\") == \"copy\":\n            shutil.copy2(f, dest); ops.append({\"op\": \"copy\", \"src\": str(f), \"dst\": str(dest)})\n        else:\n            shutil.move(str(f), str(dest)); ops.append({\"op\": \"move\", \"src\": str(f), \"dst\": str(dest)})\n        log(_t(settings, \"log_sort\", name=f.name, dest=dest))\n    if ops:\n        hist = load_history(settings)\n        hist.append({\"time\": datetime.datetime.now().isoformat(timespec=\"seconds\"), \"ops\": ops})\n        save_history(settings, hist)\n    return ops\n\ndef undo_last(settings, log=lambda m: None):\n    hist = load_history(settings)\n    if not hist:\n        log(_t(settings, \"log_undo_none\")); return 0\n    batch = hist.pop()\n    n = 0\n    for op in reversed(batch[\"ops\"]):\n        dst, src = Path(op[\"dst\"]), Path(op[\"src\"])\n        try:\n            if op[\"op\"] == \"move\" and dst.exists():\n                src.parent.mkdir(parents=True, exist_ok=True)\n                shutil.move(str(dst), str(unique_path(src) if src.exists() else src)); n += 1\n            elif op[\"op\"] == \"copy\" and dst.exists():\n                dst.unlink(); n += 1\n        except Exception as e:\n            log(_t(settings, \"log_undo_failed\", path=dst, error=e))\n    save_history(settings, hist)\n    log(_t(settings, \"log_undo_done\", count=n))\n    return n\n\n# ---------------- 3. Report aggregation ----------------\ndef aggregate_report(path, settings, log=lambda m: None):\n    path = Path(path)\n    rows = []\n    if path.suffix.lower() == \".csv\":\n        for enc in (\"utf-8-sig\", \"cp932\", \"utf-8\"):\n            try:\n                with open(path, newline=\"\", encoding=enc) as f:\n                    rows = list(csv.reader(f)); break\n            except Exception:\n                rows = []\n    else:\n        import openpyxl\n        wb = openpyxl.load_workbook(path, data_only=True)\n        ws = wb.active\n        for row in ws.iter_rows(values_only=True):\n            rows.append([(\"\" if c is None else c) for c in row])\n        wb.close()\n    if not rows:\n        raise ValueError(_t(settings, \"err_empty_data\"))\n    header = [str(h) for h in rows[0]]\n    data = rows[1:]\n    sums = {}\n    for ci, h in enumerate(header):\n        total, cnt = 0.0, 0\n        for r in data:\n            if ci < len(r):\n                try:\n                    v = float(str(r[ci]).replace(\",\", \"\"))\n                    total += v; cnt += 1\n                except Exception:\n                    pass\n        if cnt:\n            sums[h or _t(settings, \"col_fallback\", n=ci+1)] = total\n    status_idx = [i for i, h in enumerate(header) if any(k in h.lower() for k in (\"status\", \"状態\", \"進捗\", \"ステータス\"))]\n    done = 0\n    for r in data:\n        cells = [str(r[i]) for i in status_idx if i < len(r)] if status_idx else [str(c) for c in r]\n        if any(\"完了\" in c for c in cells):\n            done += 1\n    out = out_dir(settings, \"report\")\n    date_disp = datetime.date.today().strftime(\"%Y-%m-%d\")\n    lines = [_t(settings, \"report_title\", date=date_disp), _t(settings, \"report_file\", name=path.name),\n             _t(settings, \"report_rows\", count=len(data)), _t(settings, \"report_done\", count=done)]\n    for k, v in sums.items():\n        lines.append(_t(settings, \"report_sum\", name=k, value=(f\"{v:,.2f}\" if v != int(v) else f\"{int(v):,}\")))\n    report_text = \"\\n\".join(lines) + \"\\n\"\n    txt = unique_path(out / f\"{today_str()}_日報集計.txt\")\n    txt.write_text(report_text, encoding=\"utf-8\")\n    import openpyxl\n    summ = out / \"集計サマリー.xlsx\"\n    if summ.exists():\n        wb = openpyxl.load_workbook(summ); ws = wb.active\n        hdr_len = ws.max_column\n        existing_hdr = [str(ws.cell(row=1, column=c+1).value or \"\") for c in range(hdr_len)]\n        keys = [h[:-2] if h.endswith(\"合計\") else h for h in existing_hdr[4:]]\n        for k in sums:\n            if k not in keys:\n                keys.append(k)\n        new_hdr = [\"日時\", \"ファイル\", \"件数\", \"完了件数\"] + [f\"{k}合計\" for k in keys]\n        if existing_hdr != new_hdr:\n            for c, val in enumerate(new_hdr):\n                cell = ws.cell(row=1, column=c+1, value=val)\n        rowvals = [datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M\"), path.name, len(data), done] + [sums.get(k, \"\") for k in keys]\n        ws.append(rowvals)\n    else:\n        wb = openpyxl.Workbook(); ws = wb.active; ws.title = \"集計\"\n        hdr = [\"日時\", \"ファイル\", \"件数\", \"完了件数\"] + [f\"{k}合計\" for k in sums]\n        for c, val in enumerate(hdr):\n            cell = ws.cell(row=1, column=c+1, value=val); styled_header_cell(cell)\n        ws.append([datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M\"), path.name, len(data), done] + [sums[k] for k in sums])\n    wb.save(summ)\n    log(_t(settings, \"log_report\", name=path.name, rows=len(data), done=done))\n    return {\"rows\": len(data), \"done\": done, \"sums\": sums, \"report_text\": report_text, \"txt\": txt, \"summary\": summ}\n\n# ---------------- 4. Image conversion ----------------\ndef convert_image(path, settings, log=lambda m: None):\n    from PIL import Image, ImageOps\n    path = Path(path)\n    out = out_dir(settings, \"images\")\n    fmt = (settings.get(\"image_format\") or \"JPG\").upper()\n    ext_map = {\"JPG\": \".jpg\", \"JPEG\": \".jpg\", \"WEBP\": \".webp\", \"PNG\": \".png\"}\n    ext = ext_map.get(fmt, \".jpg\")\n    im = Image.open(path)\n    im = ImageOps.exif_transpose(im)\n    maxw = int(settings.get(\"image_max_width\") or 1200)\n    if im.width > maxw:\n        h = round(im.height * maxw / im.width)\n        im = im.resize((maxw, h), Image.LANCZOS)\n    dest = unique_path(out / f\"{path.stem}{ext}\")\n    target = int(settings.get(\"image_target_kb\") or 500) * 1024\n    if fmt in (\"JPG\", \"JPEG\"):\n        rgb = im.convert(\"RGB\") if im.mode != \"RGB\" else im\n        q = 90\n        while True:\n            rgb.save(dest, \"JPEG\", quality=q)\n            if dest.stat().st_size <= target or q <= 20:\n                break\n            q -= 10\n    elif fmt == \"WEBP\":\n        q = 90\n        while True:\n            im.save(dest, \"WEBP\", quality=q)\n            if dest.stat().st_size <= target or q <= 20:\n                break\n            q -= 10\n    else:\n        im.save(dest, \"PNG\")\n    log(_t(settings, \"log_image\", name=path.name, dest=dest.name, kb=dest.stat().st_size//1024))\n    return dest\n\n# ---------------- 5. PDF tools ----------------\ndef pdf_merge(files, settings, log=lambda m: None):\n    import fitz\n    out = out_dir(settings, \"pdf\")\n    dest = unique_path(out / f\"{today_str()}_{settings.get('project') or '作業'}_結合.pdf\")\n    doc = fitz.open()\n    for f in files:\n        src = fitz.open(f)\n        doc.insert_pdf(src); src.close()\n    doc.save(dest); doc.close()\n    log(_t(settings, \"log_pdf_merge\", count=len(files), name=dest.name))\n    return dest\n\ndef pdf_split(path, settings, log=lambda m: None):\n    import fitz\n    path = Path(path)\n    out = out_dir(settings, \"pdf\") / f\"{path.stem}_分割\"\n    out.mkdir(parents=True, exist_ok=True)\n    doc = fitz.open(path)\n    outs = []\n    for i in range(doc.page_count):\n        d = fitz.open(); d.insert_pdf(doc, from_page=i, to_page=i)\n        p = out / f\"{path.stem}_{i+1:03d}.pdf\"\n        d.save(p); d.close(); outs.append(p)\n    doc.close()\n    log(_t(settings, \"log_pdf_split\", name=path.name, count=len(outs)))\n    return outs\n\ndef pdf_extract_text(path, settings, log=lambda m: None):\n    import fitz\n    path = Path(path)\n    out = out_dir(settings, \"pdf\")\n    doc = fitz.open(path)\n    text = \"\\n\".join(page.get_text() for page in doc)\n    doc.close()\n    dest = unique_path(out / f\"{path.stem}.txt\")\n    dest.write_text(text, encoding=\"utf-8\")\n    log(_t(settings, \"log_pdf_text\", name=path.name, dest=dest.name))\n    return dest\n\n# ---------------- 6. Video conversion (ffmpeg) ----------------\ndef find_ffmpeg(settings=None):\n    if sys.platform == \"darwin\":\n        # macOS: no .exe candidates. Bundled tools first, then Homebrew\n        # (Finder-launched apps have a minimal PATH, so check the well-known\n        # Homebrew locations explicitly), then PATH, then imageio-ffmpeg.\n        for cand in (APP_DIR / \"tools\" / \"ffmpeg\", BASE_DIR / \"tools\" / \"ffmpeg\",\n                     Path(\"/opt/homebrew/bin/ffmpeg\"), Path(\"/usr/local/bin/ffmpeg\")):\n            if cand.exists():\n                return str(cand)\n        w = shutil.which(\"ffmpeg\")\n        if w:\n            return w\n        try:\n            import imageio_ffmpeg\n            return imageio_ffmpeg.get_ffmpeg_exe()\n        except Exception:\n            return None\n    for cand in (APP_DIR / \"tools\" / \"ffmpeg.exe\", APP_DIR / \"tools\" / \"ffmpeg\",\n                 BASE_DIR / \"tools\" / \"ffmpeg.exe\", BASE_DIR / \"tools\" / \"ffmpeg\"):\n        if cand.exists():\n            return str(cand)\n    w = shutil.which(\"ffmpeg\")\n    if w:\n        return w\n    try:\n        import imageio_ffmpeg\n        return imageio_ffmpeg.get_ffmpeg_exe()\n    except Exception:\n        return None\n\ndef convert_video(path, settings, log=lambda m: None, preset=None):\n    path = Path(path)\n    ffmpeg = find_ffmpeg(settings)\n    if not ffmpeg:\n        raise RuntimeError(_t(settings, \"err_ffmpeg_missing\"))\n    preset = preset or settings.get(\"video_preset\", \"mp4\")\n    out = out_dir(settings, \"video\")\n    if preset == \"mp3\":\n        dest = unique_path(out / f\"{path.stem}.mp3\")\n        cmd = [ffmpeg, \"-y\", \"-i\", str(path), \"-vn\", \"-codec:a\", \"libmp3lame\", \"-q:a\", \"2\", str(dest)]\n    elif preset == \"gif\":\n        dest = unique_path(out / f\"{path.stem}.gif\")\n        cmd = [ffmpeg, \"-y\", \"-i\", str(path), \"-vf\", \"fps=10,scale=480:-1:flags=lanczos\", \"-t\", \"10\", str(dest)]\n    elif preset == \"compress\":\n        dest = unique_path(out / f\"{path.stem}_720p.mp4\")\n        cmd = [ffmpeg, \"-y\", \"-i\", str(path), \"-vf\", \"scale=-2:min(720\\\\,ih)\", \"-c:v\", \"libx264\", \"-crf\", \"28\", \"-preset\", \"medium\", \"-c:a\", \"aac\", \"-b:a\", \"128k\", str(dest)]\n    else:\n        dest = unique_path(out / f\"{path.stem}.mp4\")\n        cmd = [ffmpeg, \"-y\", \"-i\", str(path), \"-c:v\", \"libx264\", \"-crf\", \"20\", \"-preset\", \"medium\", \"-c:a\", \"aac\", \"-b:a\", \"160k\", str(dest)]\n    log(_t(settings, \"log_video_start\", preset=preset, name=path.name))\n    proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,\n                          encoding=\"utf-8\", errors=\"replace\",\n                          creationflags=getattr(subprocess, \"CREATE_NO_WINDOW\", 0))\n    if proc.returncode != 0 or not dest.exists():\n        log_error(proc.stdout[-3000:] if proc.stdout else \"ffmpeg failed\")\n        raise RuntimeError(_t(settings, \"err_ffmpeg_failed\"))\n    log(_t(settings, \"log_video_done\", name=dest.name, kb=dest.stat().st_size//1024))\n    return dest\n\n# ---------------- 7. Excel format-preserving conversion ----------------\ndef _program_files_dirs():\n    dirs = []\n    for var in (\"ProgramFiles\", \"ProgramFiles(x86)\", \"ProgramW6432\"):\n        v = os.environ.get(var)\n        if v:\n            dirs.append(Path(v))\n    return dirs\n\ndef find_soffice(settings=None):\n    if sys.platform == \"darwin\":\n        # macOS: LibreOffice lives in /Applications or via Homebrew;\n        # there are no Program Files folders or .exe binaries.\n        cands = []\n        if settings and settings.get(\"soffice_path\"):\n            cands.append(settings[\"soffice_path\"])\n        w = shutil.which(\"soffice\")\n        if w:\n            cands.append(w)\n        cands.append(\"/Applications/LibreOffice.app/Contents/MacOS/soffice\")\n        cands.append(\"/opt/homebrew/bin/soffice\")\n        cands.append(\"/usr/local/bin/soffice\")\n        cands.append(str(APP_DIR / \"tools\" / \"soffice\"))\n        cands.append(str(BASE_DIR / \"tools\" / \"soffice\"))\n        for c in cands:\n            if c and Path(c).exists():\n                return c\n        return None\n    cands = []\n    if settings and settings.get(\"soffice_path\"):\n        cands.append(settings[\"soffice_path\"])\n    w = shutil.which(\"soffice\") or shutil.which(\"soffice.exe\")\n    if w:\n        cands.append(w)\n    for base in _program_files_dirs():\n        cands.append(str(base / \"LibreOffice\" / \"program\" / \"soffice.exe\"))\n        cands.append(str(base / \"LibreOffice\" / \"program\" / \"soffice\"))\n    cands.append(str(APP_DIR / \"tools\" / \"soffice.exe\"))\n    cands.append(str(BASE_DIR / \"tools\" / \"soffice.exe\"))\n    for c in cands:\n        if c and Path(c).exists():\n            return c\n    return None\n\ndef xlsx_to_csv(path, settings, log=lambda m: None):\n    import openpyxl\n    path = Path(path)\n    out = out_dir(settings, \"excel\")\n    wb = openpyxl.load_workbook(path, data_only=True)\n    outs = []\n    for ws in wb.worksheets:\n        safe_title = re.sub(r'[\\\\/:*?\"<>|]', \"_\", ws.title)\n        dest = unique_path(out / f\"{path.stem}_{safe_title}.csv\")\n        with open(dest, \"w\", newline=\"\", encoding=\"utf-8-sig\") as f:\n            w = csv.writer(f)\n            for row in ws.iter_rows(values_only=True):\n                w.writerow([(\"\" if c is None else c) for c in row])\n        outs.append(dest)\n    wb.close()\n    log(_t(settings, \"log_excel_csv\", name=path.name, count=len(outs)))\n    return outs\n\ndef _css_color(argb):\n    if not argb or not isinstance(argb, str) or len(argb) < 8:\n        return None\n    rgb = argb[2:]\n    return \"#\" + rgb if re.fullmatch(r\"[0-9A-Fa-f]{6}\", rgb) else None\n\ndef xlsx_to_html(path, settings, log=lambda m: None):\n    import openpyxl\n    path = Path(path)\n    out = out_dir(settings, \"excel\")\n    wb = openpyxl.load_workbook(path, data_only=True)\n    parts = [\"<!DOCTYPE html><html><head><meta charset='utf-8'>\",\n             f\"<title>{html.escape(path.stem)}<\/title>\",\n             \"<style>table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 8px}<\/style><\/head><body>\"]\n    for ws in wb.worksheets:\n        parts.append(f\"<h2>{html.escape(ws.title)}<\/h2><table>\")\n        merged = {}\n        try:\n            for rng in ws.merged_cells.ranges:\n                merged[(rng.min_row, rng.min_col)] = (rng.max_row - rng.min_row + 1, rng.max_col - rng.min_col + 1)\n        except Exception:\n            pass\n        skip = set()\n        for rng_cells in []:\n            pass\n        for row in ws.iter_rows():\n            parts.append(\"<tr>\")\n            for cell in row:\n                key = (cell.row, cell.column)\n                if key in skip:\n                    continue\n                val = cell.value\n                disp = \"\"\n                if val is not None:\n                    if isinstance(val, (datetime.datetime, datetime.date)):\n                        disp = val.strftime(\"%Y-%m-%d\")\n                    elif isinstance(val, float) and cell.number_format and \"%\" in cell.number_format:\n                        disp = f\"{val*100:.1f}%\"\n                    elif isinstance(val, float) and cell.number_format and (\",\" in cell.number_format or \"#\" in cell.number_format):\n                        disp = f\"{val:,.2f}\".rstrip(\"0\").rstrip(\".\")\n                    else:\n                        disp = str(val)\n                styles = []\n                try:\n                    if cell.font and cell.font.bold:\n                        styles.append(\"font-weight:bold\")\n                    if cell.font and cell.font.size:\n                        styles.append(f\"font-size:{cell.font.size}pt\")\n                    if cell.font and cell.font.color:\n                        col = _css_color(getattr(cell.font.color, \"rgb\", None))\n                        if col: styles.append(f\"color:{col}\")\n                    if cell.fill and cell.fill.fgColor:\n                        col = _css_color(getattr(cell.fill.fgColor, \"rgb\", None))\n                        if col and col != \"#000000\": styles.append(f\"background-color:{col}\")\n                    if cell.alignment and cell.alignment.horizontal:\n                        styles.append(f\"text-align:{cell.alignment.horizontal}\")\n                except Exception:\n                    pass\n                span = \"\"\n                if key in merged:\n                    rs, cs = merged[key]\n                    if rs > 1: span += f\" rowspan='{rs}'\"\n                    if cs > 1: span += f\" colspan='{cs}'\"\n                    for rr in range(cell.row, cell.row + rs):\n                        for cc in range(cell.column, cell.column + cs):\n                            if (rr, cc) != key:\n                                skip.add((rr, cc))\n                style = f\" style='{';'.join(styles)}'\" if styles else \"\"\n                parts.append(f\"<td{span}{style}>{html.escape(disp)}<\/td>\")\n            parts.append(\"<\/tr>\")\n        parts.append(\"<\/table>\")\n    parts.append(\"<\/body><\/html>\")\n    wb.close()\n    dest = unique_path(out / f\"{path.stem}.html\")\n    dest.write_text(\"\\n\".join(parts), encoding=\"utf-8\")\n    log(_t(settings, \"log_excel_html\", name=dest.name))\n    return dest\n\ndef convert_to_pdf(path, settings, log=lambda m: None):\n    \"\"\"Return (output_path, engine_name). Fallback = styled HTML (NOT pdf).\"\"\"\n    path = Path(path)\n    out = out_dir(settings, \"excel\")\n    soffice = find_soffice(settings)\n    if soffice:\n        proc = subprocess.run([soffice, \"--headless\", \"--convert-to\", \"pdf\", \"--outdir\", str(out), str(path)],\n                              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,\n                              encoding=\"utf-8\", errors=\"replace\", timeout=300,\n                              creationflags=getattr(subprocess, \"CREATE_NO_WINDOW\", 0))\n        pdf = out / f\"{path.stem}.pdf\"\n        if proc.returncode == 0 and pdf.exists():\n            log(_t(settings, \"log_pdf_engine_libre\", path=soffice))\n            return pdf, \"LibreOffice\"\n        log(_t(settings, \"log_libre_failed\", detail=(proc.stdout[-500:] if proc.stdout else \"\")))\n    if sys.platform.startswith(\"win\"):\n        try:\n            import win32com.client\n            app = None; book = None\n            ext = path.suffix.lower()\n            if ext in (\".xlsx\", \".xlsm\", \".xls\"):\n                app = win32com.client.Dispatch(\"Excel.Application\"); app.Visible = False\n                book = app.Workbooks.Open(str(path))\n                pdf = unique_path(out / f\"{path.stem}.pdf\")\n                book.ExportAsFixedFormat(0, str(pdf)); book.Close(False)\n                log(_t(settings, \"log_pdf_engine_excel\"))\n                return pdf, \"Microsoft Excel COM\"\n            elif ext in (\".docx\", \".doc\"):\n                app = win32com.client.Dispatch(\"Word.Application\"); app.Visible = False\n                doc = app.Documents.Open(str(path))\n                pdf = unique_path(out / f\"{path.stem}.pdf\")\n                doc.ExportAsFixedFormat(str(pdf), 17); doc.Close(False)\n                log(_t(settings, \"log_pdf_engine_word\"))\n                return pdf, \"Microsoft Word COM\"\n            elif ext in (\".pptx\", \".ppt\"):\n                app = win32com.client.Dispatch(\"PowerPoint.Application\")\n                pres = app.Presentations.Open(str(path), WithWindow=False)\n                pdf = unique_path(out / f\"{path.stem}.pdf\")\n                pres.ExportAsFixedFormat(str(pdf), 2); pres.Close()\n                log(_t(settings, \"log_pdf_engine_ppt\"))\n                return pdf, \"Microsoft PowerPoint COM\"\n        except Exception as e:\n            log(_t(settings, \"log_com_failed\", error=e))\n        finally:\n            try:\n                if app is not None:\n                    app.Quit()\n            except Exception:\n                pass\n    if path.suffix.lower() in (\".xlsx\", \".xlsm\"):\n        dest = xlsx_to_html(path, settings, log)\n        log(_t(settings, \"log_pdf_fallback\"))\n        return dest, \"HTML fallback (not PDF)\"\n    raise RuntimeError(\"PDFに変換できるエンジン（LibreOffice / Microsoft Office）が見つかりませんでした\")\n\ndef excel_convert(path, settings, log=lambda m: None):\n    path = Path(path)\n    outs = []\n    if path.suffix.lower() in (\".xlsx\", \".xlsm\", \".xls\", \".docx\", \".pptx\", \".doc\", \".ppt\"):\n        pdf_or_html, engine = convert_to_pdf(path, settings, log)\n        outs.append(pdf_or_html)\n        if path.suffix.lower() in (\".xlsx\", \".xlsm\"):\n            outs.extend(xlsx_to_csv(path, settings, log))\n            if engine != \"HTML fallback (not PDF)\":\n                outs.append(xlsx_to_html(path, settings, log))\n    else:\n        raise ValueError(_t(settings, \"err_excel_unsupported\", ext=path.suffix))\n    return outs\n\n# ---------------- 8. Archive ----------------\ndef archive_zip(files, settings, log=lambda m: None):\n    out = out_dir(settings, \"archive\")\n    dest = unique_path(out / f\"{today_str()}_{settings.get('project') or '作業'}.zip\")\n    with zipfile.ZipFile(dest, \"w\", zipfile.ZIP_DEFLATED) as z:\n        for f in files:\n            f = Path(f)\n            if f.is_dir():\n                for root, _d, names in os.walk(f):\n                    for n in names:\n                        p = Path(root) / n\n                        z.write(p, p.relative_to(f.parent))\n            else:\n                z.write(f, f.name)\n    log(_t(settings, \"log_zip_create\", name=dest.name, kb=dest.stat().st_size//1024))\n    return dest\n\ndef archive_extract(path, settings, log=lambda m: None):\n    path = Path(path)\n    base = out_dir(settings, \"archive\") / f\"{path.stem}_展開\"\n    dest = unique_path(base) if (base.exists() and any(base.iterdir())) else base\n    dest.mkdir(parents=True, exist_ok=True)\n    with zipfile.ZipFile(path) as z:\n        for name in z.namelist():\n            try:\n                decoded = name.encode(\"cp437\").decode(\"cp932\")\n            except Exception:\n                decoded = name\n            target = (dest / decoded).resolve()\n            if not str(target).startswith(str(dest.resolve())):\n                log(_t(settings, \"log_zip_skip\", name=name)); continue\n            if name.endswith(\"/\"):\n                target.mkdir(parents=True, exist_ok=True); continue\n            target.parent.mkdir(parents=True, exist_ok=True)\n            with z.open(name) as srcf, open(target, \"wb\") as dstf:\n                shutil.copyfileobj(srcf, dstf)\n    log(_t(settings, \"log_zip_extract\", name=path.name, dest=dest))\n    return dest\n"}, {"p": "i18n_data.py", "s": 71069, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"i18n dictionary for DropLauncher - 13 languages in the user's specified order.\nDisplay-only translation: internal enum/settings values (move/copy, ext_date,\nmp4/compress,...) are never translated; combo boxes keep them in userData.\nOutput-artifact strings (generated file names, sheet titles inside generated\nworkbooks) are i g が必要です）\",\n\"log_video_start\": \"動画変換開始 ({preset}): {name}\",\n\"err_ffmpeg_failed\": \"ffmpeg 変換に失敗しました。詳細は DropLauncher-error.log を確認してください\",\n\"log_video_done\": \"動画変換完了: {name} ({kb}KB)\",\n\"log_pdf_engine_libre\": \"PDF変換エンジン: LibreOffice ({path})\",\n\"log_pdf_engine_excel\": \"PDF変換エンジン: Microsoft Excel (COM)\",\n\"log_pdf_engine_word\": \"PDF変換エンジン: Microsoft Word (COM)\",\n\"log_pdf_engine_ppt\": \"PDF変換エンジン: Microsoft PowerPoint (COM)\",\n\"log_libre_failed\": \"LibreOffice変換に失敗しました: {detail}\",\n\"log_com_failed\": \"Office COM変換は使えませんでした: {error}\",\n\"log_pdf_fallback\": \"PDF変換エンジン: なし → 代替として書式つきHTMLを出力しました（PDFではありません）\",\n\"log_excel_csv\": \"Excel→CSV: {name} → {count}件\",\n\"log_excel_html\": \"Excel→HTML（書式つき）: {name}\",\n\"err_excel_unsupported\": \"Excel変換ゾーンは未対応の形式です: {ext}\",\n\"log_zip_create\": \"ZIP作成: {name} ({kb}KB)\",\n\"log_zip_skip\": \"危険なパスをスキップ: {name}\",\n\"log_zip_extract\": \"ZIP解凍: {name} → {dest}\",\n},\n\"en\": {\n\"app_title\": \"DropLauncher — Super-Specialized Drop Launcher\",\n\"app_subtitle\": \"Just drag & drop files onto a zone (or click a card) and routine tasks run automatically\",\n\"lang_label\": \"Language:\",\n\"always_on_top\": \"Always on top\",\n\"video_preset_label\": \"Video preset:\",\n\"settings_btn\": \"Settings\",\n\"undo_btn\": \"Undo sorting\",\n\"zones_label\": \"▼ Drop the files you want to process onto a card\",\n\"zone_hint\": \"Drop here / click to select\",\n\"log_label\": \"Processing log\",\n\"open_output_btn\": \"📁 Open output folder\",\n\"select_files_title\": \"{title} - Select files\",\n\"startup_output\": \"Started. Output: {path}\",\n\"log_ffmpeg\": \"ffmpeg: {value}\",\n\"value_not_found\": \"Not found\",\n\"log_libre\": \"LibreOffice: {value}\",\n\"libre_not_found\": \"Not detected (Excel→PDF will use the HTML fallback)\",\n\"copied_output_path\": \"Output path copied: {path}\",\n\"settings_saved\": \"Settings saved\",\n\"run_start\": \"--- Started: {zone} ({count} files) ---\",\n\ (First time only: macOS may block it because it is unsigned.\n#       Right-click the file -> \"Open\" -> \"Open\" to run it once.)\n#   3. When the build finishes, the app appears in the \"dist\" folder:\n#         dist/DropLauncher.app\n#   4. From then on, just double-click DropLauncher.app to use it.\n#      (The .app is also unsigned, so the first launch of the app\n#       itself needs the same right-click -> \"Open\" once.)\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== DropLauncher - build the macOS app ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Building the app needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + build tools -----------------------------------\nif [ ! -x \".venv-build/bin/python\" ]; then\n  echo \"Preparing the build environment (first run only)...\"\n  $PY -m venv .venv-build || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv-build/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv-build/bin/python -m pip install -r requirements.txt PyInstaller || { echo \"Failed to install the build tools. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nHOST_ARCH=\"$(uname -m)\"\necho \"This Mac's chip: $HOST_ARCH\"\necho \"Building DropLauncher.app (this can take a few minutes)...\"\n\n# Try a universal2 build first (one app that runs on both Apple\n# Silicon and Intel Macs). The python.org Python and PySide6 are\n# universal2, so this normally succeeds. If this Mac's Python is\n# single-architecture, the universal build fails and we fall back to\n# a native build for this Mac's chip automatically.\nBUILT_ARCH=\"\"\nif .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name DropLauncher --icon assets/icon.icns --collect-all imageio_ffmpeg --target-arch universal2 app.py; then\n  BUILT_ARCH=\"universal2 (Apple Silicon + Intel)\"\nelse\n  echo \"\"\n  echo \"The universal2 build did not work on this Mac, so the app\"\n  echo \"is being built for this Mac's chip only ($HOST_ARCH).\"\n  echo \"\"\n  rm -rf dist build DropLauncher.spec\n  if .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name DropLauncher --icon assets/icon.icns --collect-all imageio_ffmpeg app.py; then\n    BUILT_ARCH=\"native ($HOST_ARCH only)\"\n  else\n    echo \"The build failed. See the messages above.\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"Done! Your app is here:\"\necho \"  $(pwd)/dist/DropLauncher.app\"\necho \"Architecture of the built app: $BUILT_ARCH\"\necho \"Supported systems: macOS 11 (Big Sur) or later.\"\necho \"\"\necho \"Double-click DropLauncher.app to use it.\"\necho \"First launch only: if macOS blocks it, right-click the app\"\necho \"and choose \\\"Open\\\" once (the app is unsigned).\"\necho \"\"\nread -r -p \"Press Enter to close this window.\"\n"}, {"p": "MakeExe-DropLauncher.bat", "s": 1377, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\necho ========================================\r\necho  DropLauncher.exe を作成します\r\necho ========================================\r\nif not exist app.py (\r\n  echo [エラー] app.py が見つかりません。ZIPファイルを「すべて展開」してから実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist requirements.txt (\r\n  echo [エラー] requirements.txt が見つかりません。ZIPファイルを「すべて展開」してから実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [エラー] Python が見つかりません。\r\n  pause\r\n  exit /b 1\r\n)\r\necho ライブラリと PyInstaller をインストールしています...\r\n%PY% -m pip install --upgrade PySide6-Essentials Pillow openpyxl PyMuPDF pypdf imageio-ffmpeg PyInstaller\r\nif errorlevel 1 (\r\n  echo [エラー] インストールに失敗しました。\r\n  pause\r\n  exit /b 1\r\n)\r\n%PY% -m PyInstaller --noconfirm --onefile --windowed --name DropLauncher --icon assets\\icon.ico --add-data \"assets;assets\" --collect-all imageio_ffmpeg app.py\r\nif errorlevel 1 (\r\n  echo [エラー] exe の作成に失敗しました。\r\n  pause\r\n  exit /b 1\r\n)\r\necho ========================================\r\necho  完成しました: dist\\DropLauncher.exe\r\necho  このEXEは単体で起動でき、Pythonは不要です。\r\necho ========================================\r\npause\r\n"}, {"p": "rc_assets.py", "s": 4885, "l": "python", "c": "# Resource object code (Python 3)\n# Created by: object code\n# Created by: The Resource Compiler for Qt version 6.12.0\n# WARNING! All changes made in this file will be lost!\n\nfrom PySide6 import QtCore\n\nqt_resource_data = b\"\\\n\\x00\\x00\\x00\\x98\\\n\\x89\\\nPNG\\x0d\\x0a\\x1a\\x0a\\x00\\x00\\x00\\x0dIHDR\\x00\\\n\\x00\\x00\\x1c\\x00\\x00\\x00\\x1c\\x08\\x06\\x00\\x00\\x00r\\x0d\\xdf\\x94\\\n\\x00\\x00\\x00_IDATx\\x9cc`\\x18\\x05\\xa3`\\\n\\xd8\\x02\\x95\\xb0\\x13\\xff\\xc9\\xd1\\xc7Dm\\x87\\xd0\\xc4B\\x98\\\n\\xef\\xc8\\xf1\\xe5\\xe0\\xf7!\\xba\\xafH\\xf5\\xe5\\xe0\\xf6!.\\\n\\xdf\\x90\\xe2\\xcb\\xc1\\xebCB\\xbe \\xd6\\x97\\x83\\xd3\\x87\\xc4\\\n\\xba\\x9e\\x18u\\x83\\xcf\\x87\\xa4\\xe63B\\xea\\x07\\x97\\x0f\\xc9\\\n\\xad\\x11\\xf0\\xe9\\x1b<>$\\xd7w\\xd4\\xd2?\\x0aF\\x01\\\n\\x1c\\x00\\x00\\xcf\\xda&r\\x0ez\\x02]\\x00\\x00\\x00\\x00I\\\nEND\\xaeB`\\x82\\\n\\x00\\x00\\x00\\x97\\\n\\x89\\\nPNG\\x0d\\x0a\\x1a\\x0a\\x00\\x00\\x00\
