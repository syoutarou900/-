<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('gq-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;}}catch(e){}})();</script>
<title>PurePaste のソースコード | get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#0D1526; --surface:#111C33; --surface2:#182747;
  --codebg:#0D1117; --ink:#E8EEF8; --muted:#93A5C4; --faint:#5B6E92; --line:#22314F;
  --line-soft:rgba(34,49,79,.55); --gutter-line:#21262D; --gutter-ink:#484F58;
  --accent:#3B82F6; --accent-strong:#60A5FA; --accent-soft:rgba(59,130,246,.16);
  --active-ink:#FFFFFF;
  --font-body:"Inter","Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F8FD; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#E7EFFD;
  --codebg:#FFFFFF; --ink:#0F1B33; --muted:#3B4A66; --faint:#64748B; --line:#DFE7F3;
  --line-soft:#E7EDF6; --gutter-line:#D8DEE4; --gutter-ink:#6E7781;
  --accent:#2563EB; --accent-strong:#1D4ED8; --accent-soft:rgba(37,99,235,.12);
  --active-ink:#1D4ED8;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:var(--accent-strong)}
/* ===== top bar ===== */
.topbar{flex:none;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;
  padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .appname{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .appname .ja{color:var(--muted);font-size:.82em;font-weight:700;margin-left:10px}
.topbar .meta{color:var(--faint);font-size:.85rem;white-space:nowrap}
.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:18px}
.topbar nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
.topbar nav a:hover{color:var(--ink)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 18px;border-radius:999px;
  box-shadow:0 8px 20px -6px rgba(37,99,235,.5);white-space:nowrap}
.dlbtn:hover{filter:brightness(1.12)}
.dlbtn svg{flex:none}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  cursor:pointer;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ic-moon{display:none}
:root[data-theme="light"] .themebtn .ic-moon{display:block}
:root[data-theme="light"] .themebtn .ic-sun{display:none}
.langpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.85rem;font-weight:700;
  line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;cursor:pointer;max-width:190px}
.langpick select:hover{border-color:var(--accent)}
/* ===== main split ===== */
.main{flex:1;display:flex;min-height:0}
.filelist{width:284px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--panel);
  border-right:1px solid var(--line)}
[dir="rtl"] .filelist{border-right:0;border-left:1px solid var(--line)}
.filelist .fl-head{padding:11px 16px;font-weight:800;font-size:.86rem;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.file-btn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);color:var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:.8rem;line-height:1.45;
  text-align:left;cursor:pointer;word-break:break-all}
.file-btn:hover{background:var(--surface2)}
.file-btn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);color:var(--active-ink)}
[dir="rtl"] .file-btn.active{box-shadow:inset -3px 0 0 var(--accent)}
.file-btn .sz{color:var(--faint);font-size:.7rem;flex:none}
.file-bin{padding:9px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);
  font-size:.8rem;line-height:1.45;color:var(--faint);word-break:break-all}
.file-bin .sz{font-size:.7rem;margin-left:8px}
.bin-note{display:block;font-family:var(--font-body);font-size:.72rem;color:#64748B;margin-top:1px}
/* ===== code pane ===== */
.codepane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--codebg)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .fname{font-family:var(--font-mono);font-size:.95rem;font-weight:700;word-break:break-all}
.toolbar .finfo{color:var(--muted);font-size:.85rem;white-space:nowrap}
.copybtn{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:7px 18px;border-radius:999px}
[dir="rtl"] .copybtn{margin-left:0;margin-right:auto}
.copybtn:hover{filter:brightness(1.12)}
.copybtn.done{background:#0E9F6E}
.code-scroll{flex:1;overflow:auto;min-height:0;direction:ltr}
.code-flex{display:flex;min-width:max-content;min-height:100%}
.gutter{flex:none;position:sticky;left:0;z-index:1;background:var(--codebg);
  border-right:1px solid var(--gutter-line);text-align:right;user-select:none;white-space:pre;
  font-family:var(--font-mono);font-size:16px;line-height:1.75;
  padding:16px 12px 24px 18px;color:var(--gutter-ink)}
.code-flex pre.code{flex:1;margin:0;padding:16px 28px 24px 20px;
  font-family:var(--font-mono);font-size:16px;line-height:1.75}
.code-flex pre.code code{font-family:inherit;font-size:inherit;line-height:inherit;
  background:transparent;padding:0;white-space:pre}
/* ===== highlight.js GitHub Dark (default) ===== */
.hljs{color:#E6EDF3;background:#0D1117}
.hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-variable,
.hljs-template-tag,.hljs-type,.hljs-variable.language_{color:#FF7B72}
.hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,
.hljs-title.function_{color:#D2A8FF}
.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,
.hljs-variable,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:#79C0FF}
.hljs-regexp,.hljs-string,.hljs-meta .hljs-string{color:#A5D6FF}
.hljs-built_in,.hljs-symbol{color:#FFA657}
.hljs-comment,.hljs-code,.hljs-formula{color:#8B949E}
.hljs-name,.hljs-quote,.hljs-selector-tag,.hljs-selector-pseudo{color:#7EE787}
.hljs-subst{color:#E6EDF3}
.hljs-section{color:#1F6FEB;font-weight:bold}
.hljs-bullet{color:#F2CC60}
.hljs-emphasis{color:#E6EDF3;font-style:italic}
.hljs-strong{color:#E6EDF3;font-weight:bold}
.hljs-addition{color:#AFF5B4;background-color:#033A16}
.hljs-deletion{color:#FFDCD7;background-color:#67060C}
.hljs-char.escape_,.hljs-link,.hljs-params,.hljs-property,.hljs-punctuation,.hljs-tag{/* purposely ignored */}
/* ===== highlight.js GitHub Light ===== */
:root[data-theme="light"] .hljs{color:#24292E;background:#FFFFFF}
:root[data-theme="light"] .hljs-doctag,:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-meta .hljs-keyword,:root[data-theme="light"] .hljs-template-variable,
:root[data-theme="light"] .hljs-template-tag,:root[data-theme="light"] .hljs-type,
:root[data-theme="light"] .hljs-variable.language_{color:#D73A49}
:root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.class_,
:root[data-theme="light"] .hljs-title.class_.inherited__,
:root[data-theme="light"] .hljs-title.function_{color:#6F42C1}
:root[data-theme="light"] .hljs-attr,:root[data-theme="light"] .hljs-attribute,
:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-meta,
:root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-operator,
:root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-selector-attr,
:root[data-theme="light"] .hljs-selector-class,:root[data-theme="light"] .hljs-selector-id{color:#005CC5}
:root[data-theme="light"] .hljs-regexp,:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-meta .hljs-string{color:#032F62}
:root[data-theme="light"] .hljs-built_in,:root[data-theme="light"] .hljs-symbol{color:#E36209}
:root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-code,
:root[data-theme="light"] .hljs-formula{color:#6A737D}
:root[data-theme="light"] .hljs-name,:root[data-theme="light"] .hljs-quote,
:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-selector-pseudo{color:#22863A}
:root[data-theme="light"] .hljs-subst{color:#24292E}
:root[data-theme="light"] .hljs-section{color:#005CC5;font-weight:bold}
:root[data-theme="light"] .hljs-bullet{color:#735C0F}
:root[data-theme="light"] .hljs-emphasis{color:#24292E;font-style:italic}
:root[data-theme="light"] .hljs-strong{color:#24292E;font-weight:bold}
:root[data-theme="light"] .hljs-addition{color:#22863A;background-color:#F0FFF4}
:root[data-theme="light"] .hljs-deletion{color:#B31D28;background-color:#FFEEF0}
@media (max-width:760px){
  .main{flex-direction:column}
  .filelist{width:auto;flex:none;max-height:158px;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line)}
  .filelist .fl-head{position:static}
  .filelist .fl-items{display:flex;flex-direction:row;overflow-x:auto}
  .file-btn,.file-bin{flex:none;border-bottom:0;border-right:1px solid var(--line-soft);
    white-space:nowrap;word-break:normal;align-items:center}
  .code-flex pre.code,.gutter{font-size:14.5px}
  .topbar .meta{display:none}
  .langpick select{max-width:140px}
}
</style>

<script type="application/json" id="filedata">[{"p": "app.py", "s": 19228, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"\nPurePaste\nコピーした瞬間にクリップボードのテキストを自動で綺麗に整形する常駐アプリ。\n- タスクトレイに常駐し、クリップボードの変化を監視\n- 変な改行 / 不必要なスペース / 全角半角の混在 を自動整形\n- ウィンドウを閉じてもトレイに残る（終了はトレイメニューから）\n- 画面表示は13言語に切替可能（i18n_data.py）\n\"\"\"\nimport json\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\n\nfrom PySide6.QtCore import Qt, QTimer\nfrom PySide6.QtGui import QAction, QColor, QFont, QIcon, QPainter, QPixmap\nfrom PySide6.QtWidgets import (\n    QApplication, QCheckBox, QComboBox, QFrame, QHBoxLayout, QLabel, QMainWindow,\n    QMenu, QMessageBox, QPushButton, QSystemTrayIcon, QTextEdit,\n    QVBoxLayout, QWidget,\n)\n\nfrom cleaner import DEFAULT_SETTINGS, clean_text\nfrom i18n_data import LANG_NAMES, LANG_ORDER, t\n\nAPP_NAME = \"PurePaste\"\n\n# 整形ルールの設定キー（表示名・説明は i18n_data.py の各言語辞書から引く）\nOPTION_KEYS = [\n    \"join_lines\",\n    \"collapse_spaces\",\n    \"trim_lines\",\n    \"fullwidth_alnum_half\",\n    \"halfwidth_kana_full\",\n    \"fullwidth_space_half\",\n    \"remove_jp_spaces\",\n    \"collapse_blank_lines\",\n    \"notify\",\n]\n\nSAMPLE_TEXT = (\n    \"本日は晴天\\n\"\n    \"なり。明日も　晴れる\\n\"\n    \"でしょう。\\n\"\n    \"\\n\"\n    \"\\n\"\n    \"Ｔｅｓｔ１２３とｱｲｳｴｵ、こ ん に ち は　世 界。\\n\"\n    \"The quick brown\\n\"\n    \"fox    jumps\\tover the lazy dog.\"\n)\n\n\ndef config_dir():\n    if sys.platform == \"darwin\":\n        # macOS標準の保存先: ~/Library/Application Support/PurePaste\n        path = os.path.join(os.path.expanduser(\"~\"),\n                            \"Library\", \"Application Support\", \"PurePaste\")\n    else:\n        base = os.environ.get(\"APPDATA\")\n        if base:\n            path = os.path.join(base, \"PurePaste\")\n        else:\n            path = os.path.join(os.path.expanduser(\"~\"), \".purepaste\")\n    os.makedirs(path, exist_ok=True)\n    return path\n\n\ndef settings_path():\n    return os.path.join(config_dir(), \"settings.json\")\n\n\ndef load_settings():\n    s = dict(DEFAULT_SETTINGS)\n    data = {}\n    try:\n        with open(settings_path(), \"r\", encoding=\"utf-8\") as f:\n            data = json.load(f)\n    except Exception:\n        data = {}\n    s.update({k: v for k, v in data.items() if k in s})\n    lang = data.get(\"language\", \"ja\")\n    s[\"language\"] = lang if lang in LANG_ORDER else \"ja\"\n    return s\n\n\ndef save_settings(s):\n    try:\n        with open(settings_path(), \"w\", encoding=\"utf-8\") as f:\n            json.dump(s, f, ensure_ascii=False, indent=2)\n    except Exception:\n        pass\n\n\ndef set_autostart(enable):\n    \"\"\"Windows起動時の自動開始（レジストリ HKCU Run）。Windows以外では何もしない。\n    macOSではこの設定は効きません（手動登録の方法は README の Mac 章を参照）。\"\"\"\n    if sys.platform != \"win32\":\n        return\n    try:\n        import winreg\n        key = winreg.OpenKey(winreg.HKEY_CURRENT_USER,\n                             r\"Software\\Microsoft\\Windows\\CurrentVersion\\Run\",\n                             0, winreg.KEY_SET_VALUE)\n        if enable:\n            if getattr(sys, \"frozen\", False):\n                cmd = '\"%s\"' % sys.executable\n            else:\n                cmd = '\"%s\" \"%s\"' % (sys.executable, os.path.abspath(__file__))\n            winreg.SetValueEx(key, \"PurePaste\", 0, winreg.REG_SZ, cmd)\n        else:\n            try:\n                winreg.DeleteValue(key, \"PurePaste\")\n            except FileNotFoundError:\n                pass\n        winreg.CloseKey(key)\n    except Exception:\n        pass\n\n\ndef make_icon(paused=False):\n    pix = QPixmap(64, 64)\n    pix.fill(Qt.transparent)\n    p = QPainter(pix)\n    p.setRenderHint(QPainter.Antialiasing)\n    color = QColor(\"#9aa5b1\") if paused else QColor(\"#2f7fe0\")\n    p.setBrush(color)\n    p.setPen(Qt.NoPen)\n    p.drawRoundedRect(4, 4, 56, 56, 14, 14)\n    p.setPen(QColor(\"white\"))\n    f = QFont()\n    f.setPixelSize(30)\n    f.setBold(True)\n    p.setFont(f)\n    p.drawText(pix.rect(), Qt.AlignCenter, \"P\")\n    p.end()\n    return QIcon(pix)\n\n\nSTYLE = \"\"\"\nQMainWindow { background: #eef3f9; }\nQFrame#card { background: white; border: 1px solid #d5dee9; border-radius: 12px; }\nQLabel#title { font-size: 20px; font-weight: bold; color: #173a5e; }\nQLabel#sub { font-size: 12px; color: #5a6b7f; }\nQLabel#sect { font-size: 14px; font-weight: bold; color: #173a5e; }\nQLabel#lang { font-size: 12px; font-weight: bold; color: #173a5e; }\nQComboBox { background: white; color: #173a5e; border: 1px solid #2568bd; border-bottom: 3px solid #1d549c;\n  border-radius: 9px; padding: 6px 10px; font-size: 13px; font-weight: bold; min-width: 130px; }\nQComboBox:hover { border-color: #3b8ae8; }\nQComboBox::drop-down { background: qlineargradient(x1:0,y1:0,x2:0,y2:1, stop:0 #4a97f0, stop:1 #2f7fe0);\n  border: none; border-top-right-radius: 8px; border-bottom-right-radius: 8px; width: 24px; }\nQComboBox QAbstractItemView { background: white; color: #22303f; selection-background-color: #2f7fe0; selection-color: white; }\nQCheckBox { font-size: 13px; color: #22303f; spacing: 8px; }\nQLabel#desc { font-size: 11px; color: #75859a; }\nQTextEdit { background: #fbfdfe; border: 1px solid #c9d6e4; border-radius: 8px; font-size: 13px; padding: 6px; }\nQPushButton { background: qlineargradient(x1:0,y1:0,x2:0,y2:1, stop:0 #4a97f0, stop:1 #2f7fe0);\n  color: white; border: 1px solid #2568bd; border-bottom: 3px solid #1d549c; border-radius: 9px;\n  padding: 8px 16px; font-size: 13px; font-weight: bold; }\nQPushButton:hover { background: qlineargradient(x1:0,y1:0,x2:0,y2:1, stop:0 #63a8f5, stop:1 #3b8ae8); }\nQPushButton:pressed { background: #2568bd; }\nQPushButton#ghost { background: white; color: #2f5b8f; border: 1px solid #b9c9dc; border-bottom: 3px solid #9fb4cc; }\nQPushButton#onoff[on=\"true\"] { background: qlineargradient(x1:0,y1:0,x2:0,y2:1, stop:0 #3ec97e, stop:1 #22a862);\n  border: 1px solid #1c8a4f; border-bottom: 3px solid #146c3d; font-size: 15px; padding: 12px; }\nQPushButton#onoff[on=\"false\"] { background: qlineargradient(x1:0,y1:0,x2:0,y2:1, stop:0 #b6c0cc, stop:1 #8d9aa9);\n  border: 1px solid #76848f; border-bottom: 3px solid #5d6b78; font-size: 15px; padding: 12px; }\nQLabel#status { font-size: 12px; color: #2c6e49; font-weight: bold; }\n\"\"\"\n\n\nclass MainWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.setWindowTitle(APP_NAME)\n        self.resize(760, 720)\n        self.setStyleSheet(STYLE)\n        self.settings = load_settings()\n        self.lang = self.settings.get(\"language\", \"ja\")\n        self.checks = {}\n        self.descs = {}\n        self.cleaned_count = 0\n        self.last_original = \"\"\n        self._writing_clipboard = False\n        self._last_seen = \"\"\n        self._status = (\"started\",)\n\n        root = QWidget()\n        self.setCentralWidget(root)\n        lay = QVBoxLayout(root)\n        lay.setContentsMargins(16, 14, 16, 14)\n        lay.setSpacing(12)\n\n        head = QHBoxLayout()\n        title = QLabel(APP_NAME)\n        title.setObjectName(\"title\")\n        head.addWidget(title)\n        head.addStretch(1)\n        self.lang_label = QLabel(self._t(\"language_label\"))\n        self.lang_label.setObjectName(\"lang\")\n        head.addWidget(self.lang_label)\n        self.lang_combo = QComboBox()\n        for code in LANG_ORDER:\n            self.lang_combo.addItem(LANG_NAMES[code], code)\n        self.lang_combo.setCurrentIndex(LANG_ORDER.index(self.lang))\n        self.lang_combo.currentIndexChanged.connect(self.on_language_changed)\n        head.addWidget(self.lang_combo)\n        lay.addLayout(head)\n\n        self.sub_label = QLabel(self._t(\"subtitle\"))\n        self.sub_label.setObjectName(\"sub\")\n        self.sub_label.setWordWrap(True)\n        lay.addWidget(self.sub_label)\n\n        self.onoff_btn = QPushButton()\n        self.onoff_btn.setObjectName(\"onoff\")\n        self.onoff_btn.clicked.connect(self.toggle_enabled)\n        lay.addWidget(self.onoff_btn)\n\n        card = QFrame(); card.setObjectName(\"card\")\n        card_lay = QVBoxLayout(card); card_lay.setContentsMargins(14, 12, 14, 12); card_lay.setSpacing(4)\n        self.sect_label = QLabel(self._t(\"options_title\")); self.sect_label.setObjectName(\"sect\")\n        card_lay.addWidget(self.sect_label)\n        for key in OPTION_KEYS:\n            cb = QCheckBox(self._t(key))\n            cb.setChecked(bool(self.settings.get(key, False)))\n            cb.stateChanged.connect(self.on_option_changed)\n            self.checks[key] = cb\n            card_lay.addWidget(cb)\n            d = QLabel(self._t(key + \"_desc\")); d.setObjectName(\"desc\"); d.setWordWrap(True)\n            d.setContentsMargins(26, 0, 0, 4)\n            self.descs[key] = d\n            card_lay.addWidget(d)\n        self.autostart_cb = QCheckBox(self._t(\"autostart_label\"))\n        self.autostart_cb.setChecked(bool(self.settings.get(\"autostart\", False)))\n        self.autostart_cb.stateChanged.connect(self.on_option_changed)\n        card_lay.addWidget(self.autostart_cb)\n        lay.addWidget(card)\n\n        card2 = QFrame(); card2.setObjectName(\"card\")\n        c2 = QVBoxLayout(card2); c2.setContentsMargins(14, 12, 14, 12); c2.setSpacing(8)\n        self.sect2_label = QLabel(self._t(\"test_title\")); self.sect2_label.setObjectName(\"sect\")\n        c2.addWidget(self.sect2_label)\n        row = QHBoxLayout()\n        self.input_edit = QTextEdit(); self.input_edit.setPlaceholderText(self._t(\"input_placeholder\"))\n        self.output_edit = QTextEdit(); self.output_edit.setReadOnly(True); self.output_edit.setPlaceholderText(self._t(\"output_placeholder\"))\n        self.input_edit.textChanged.connect(self.update_preview)\n        row.addWidget(self.input_edit); row.addWidget(self.output_edit)\n        c2.addLayout(row)\n        brow = QHBoxLayout()\n        self.sample_btn = QPushButton(self._t(\"sample_btn\")); self.sample_btn.setObjectName(\"ghost\")\n        self.sample_btn.clicked.connect(lambda: self.input_edit.setPlainText(SAMPLE_TEXT))\n        self.copy_btn = QPushButton(self._t(\"copy_btn\"))\n        self.copy_btn.clicked.connect(self.copy_output)\n        brow.addWidget(self.sample_btn); brow.addWidget(self.copy_btn); brow.addStretch(1)\n        c2.addLayout(brow)\n        lay.addWidget(card2)\n\n        self.status_label = QLabel()\n        self.status_label.setObjectName(\"status\")\n        lay.addWidget(self.status_label)\n        self.note_label = QLabel(self._t(\"note_resident\"))\n        self.note_label.setObjectName(\"desc\"); self.note_label.setWordWrap(True)\n        lay.addWidget(self.note_label)\n\n        self.setLayoutDirection(Qt.RightToLeft if self.lang == \"ar\" else Qt.LeftToRight)\n        self._setup_tray()\n        self._setup_clipboard()\n        self._refresh_onoff()\n        self._render_status()\n        self.update_preview()\n\n    # ---------- 言語 ----------\n    def _t(self, key):\n        return t(self.lang, key)\n\n    def on_language_changed(self, index):\n        code = LANG_ORDER[index]\n        if code == self.lang:\n            return\n        self.apply_language(code)\n        self.settings = self.collect_settings()\n        save_settings(self.settings)\n\n    def apply_language(self, lang):\n        \"\"\"表示言語を即時切替する（設定画面の再描画＋トレイメニューの再構築）。\"\"\"\n        if lang not in LANG_ORDER:\n            lang = \"ja\"\n        self.lang = lang\n        self.setLayoutDirection(Qt.RightToLeft if lang == \"ar\" else Qt.LeftToRight)\n        idx = LANG_ORDER.index(lang)\n        if self.lang_combo.currentIndex() != idx:\n            self.lang_combo.blockSignals(True)\n            self.lang_combo.setCurrentIndex(idx)\n            self.lang_combo.blockSignals(False)\n        self.lang_label.setText(self._t(\"language_label\"))\n        self.sub_label.setText(self._t(\"subtitle\"))\n        self.sect_label.setText(self._t(\"options_title\"))\n        for key, cb in self.checks.items():\n            cb.setText(self._t(key))\n        for key, d in self.descs.items():\n            d.setText(self._t(key + \"_desc\"))\n        self.autostart_cb.setText(self._t(\"autostart_label\"))\n        self.sect2_label.setText(self._t(\"test_title\"))\n        self.input_edit.setPlaceholderText(self._t(\"input_placeholder\"))\n        self.output_edit.setPlaceholderText(self._t(\"output_placeholder\"))\n        self.sample_btn.setText(self._t(\"sample_btn\"))\n        self.copy_btn.setText(self._t(\"copy_btn\"))\n        self.note_label.setText(self._t(\"note_resident\"))\n        # トレイメニューの項目も新しい言語で表示し直す\n        self.act_show.setText(self._t(\"tray_open_settings\"))\n        self.act_pause.setText(self._t(\"tray_pause_resume\"))\n        self.act_restore.setText(self._t(\"tray_restore\"))\n        self.act_quit.setText(self._t(\"tray_quit\"))\n        self._refresh_onoff()\n        self._render_status()\n\n    def _render_status(self):\n        kind = self._status[0]\n        if kind == \"cleaned\":\n            _, count, before, after, diff = self._status\n            self.status_label.setText(self._t(\"status_cleaned\").format(\n                count=count, before=before, after=after, diff=diff))\n        elif kind == \"restored\":\n            self.status_label.setText(self._t(\"status_restored\"))\n        else:\n            self.status_label.setText(self._t(\"status_started\"))\n\n    # ---------- 設定 ----------\n    def collect_settings(self):\n        s = dict(self.settings)\n        s[\"enabled\"] = bool(s.get(\"enabled\", True))\n        for key, cb in self.checks.items():\n            s[key] = cb.isChecked()\n        s[\"autostart\"] = self.autostart_cb.isChecked()\n        s[\"language\"] = self.lang\n        return s\n\n    def on_option_changed(self, *_):\n        self.settings = self.collect_settings()\n        save_settings(self.settings)\n        set_autostart(self.settings.get(\"autostart\", False))\n        self.update_preview()\n\n    def toggle_enabled(self):\n        self.settings[\"enabled\"] = not bool(self.settings.get(\"enabled\", True))\n        save_settings(self.settings)\n        self._refresh_onoff()\n        self._refresh_tray()\n\n    def _refresh_onoff(self):\n        on = bool(self.settings.get(\"enabled\", True))\n        self.onoff_btn.setText(self._t(\"onoff_on\") if on else self._t(\"onoff_off\"))\n        self.onoff_btn.setProperty(\"on\", \"true\" if on else \"false\")\n        self.onoff_btn.style().unpolish(self.onoff_btn); self.onoff_btn.style().polish(self.onoff_btn)\n\n    # ---------- トレイ ----------\n    def _setup_tray(self):\n        self.tray = QSystemTrayIcon(make_icon(not self.settings.get(\"enabled\", True)), self)\n        self.tray.setToolTip(APP_NAME)\n        menu = QMenu()\n        self.act_show = QAction(self._t(\"tray_open_settings\"), self); self.act_show.triggered.connect(self.show_and_raise)\n        self.act_pause = QAction(self._t(\"tray_pause_resume\"), self); self.act_pause.triggered.connect(self.toggle_enabled)\n        self.act_restore = QAction(self._t(\"tray_restore\"), self); self.act_restore.triggered.connect(self.restore_original)\n        self.act_quit = QAction(self._t(\"tray_quit\"), self); self.act_quit.triggered.connect(self.quit_app)\n        menu.addAction(self.act_show); menu.addAction(self.act_pause); menu.addAction(self.act_restore)\n        menu.addSeparator(); menu.addAction(self.act_quit)\n        self.tray.setContextMenu(menu)\n        self.tray.activated.connect(self._tray_activated)\n        self.tray.show()\n\n    def _refresh_tray(self):\n        self.tray.setIcon(make_icon(not self.settings.get(\"enabled\", True)))\n\n    def _tray_activated(self, reason):\n        if reason == QSystemTrayIcon.DoubleClick:\n            self.show_and_raise()\n\n    def show_and_raise(self):\n        self.show(); self.raise_(); self.activateWindow()\n\n    def quit_app(self):\n        save_settings(self.collect_settings())\n        QApplication.quit()\n\n    def closeEvent(self, event):\n        # 閉じる = トレイに隠れる（常駐を続ける）\n        event.ignore()\n        self.hide()\n        self.tray.showMessage(APP_NAME, self._t(\"tray_resident_msg\"),\n                              QSystemTrayIcon.Information, 2500)\n\n    # ---------- クリップボード監視 ----------\n    def _setup_clipboard(self):\n        self.clipboard = QApplication.clipboard()\n        self.clipboard.dataChanged.connect(self.on_clipboard_changed)\n\n    def on_clipboard_changed(self):\n        if self._writing_clipboard:\n            return\n        if not self.settings.get(\"enabled\", True):\n            return\n        try:\n            text = self.clipboard.text()\n        except Exception:\n            return\n        if not text or text == self._last_seen:\n            return\n        self._last_seen = text\n        if len(text) > 1000000:\n            return\n        cleaned = clean_text(text, self.collect_settings())\n        if cleaned == text:\n            return\n        self.last_original = text\n        self._writing_clipboard = True\n        try:\n            self.clipboard.setText(cleaned)\n        finally:\n            QTimer.singleShot(0, self._clear_writing_flag)\n        self._last_seen = cleaned\n        self.cleaned_count += 1\n        diff = len(text) - len(cleaned)\n        self._status = (\"cleaned\", self.cleaned_count, len(text), len(cleaned), diff)\n        self._render_status()\n        if self.settings.get(\"notify\", False):\n            self.tray.showMessage(APP_NAME, self._t(\"notify_cleaned\"), QSystemTrayIcon.Information, 1500)\n\n    def _clear_writing_flag(self):\n        self._writing_clipboard = False\n\n    def restore_original(self):\n        if not self.last_original:\n            self.tray.showMessage(APP_NAME, self._t(\"notify_none\"), QSystemTrayIcon.Information, 2000)\n            return\n        self._writing_clipboard = True\n        try:\n            self.clipboard.setText(self.last_original)\n        finally:\n            QTimer.singleShot(0, self._clear_writing_flag)\n        self._last_seen = self.last_original\n        self._status = (\"restored\",)\n        self._render_status()\n\n    # ---------- プレビュー ----------\n    def update_preview(self):\n        src = self.input_edit.toPlainText()\n        self.output_edit.setPlainText(clean_text(src, self.collect_settings()) if src else \"\")\n\n    def copy_output(self):\n        txt = self.output_edit.toPlainText()\n        if txt:\n            self._last_seen = txt  # 自分で入れたものは再整形しない目印\n            QApplication.clipboard().setText(txt)\n\n\ndef main():\n    app = QApplication(sys.argv)\n    try:\n        import os as _os, sys as _sys\n        from PySide6.QtGui import QIcon as _QIcon\n        _ib = getattr(_sys, \"_MEIPASS\", None) or _os.path.dirname(_os.path.abspath(__file__))\n        _ip = _os.path.join(_ib, \"assets\", \"icon.png\")\n        if _os.path.exists(_ip):\n            app.setWindowIcon(_QIcon(_ip))\n    except Exception:\n        pass\n    app.setApplicationName(APP_NAME)\n    app.setQuitOnLastWindowClosed(False)\n    win = MainWindow()\n    # 起動時はウィンドウ表示（初回に設定を確認してもらう）。トレイ常駐が本体。\n    win.show()\n    sys.exit(app.exec())\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"p": "assets/icon.icns", "s": 110560, "b": 1}, {"p": "assets/icon.ico", "s": 23011, "b": 1}, {"p": "assets/icon.png", "s": 41043, "b": 1}, {"p": "cleaner.py", "s": 6744, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"\nテキスト整形ロジック（Qtに依存しない純Python）\n\nWebサイトやPDFからコピーしたテキストの\n- 変な改行（行の途中で切れた改行）\n- 不必要なスペース（連続スペース、タブ、日本語の間のスペース）\n- 全角・半角の混在（全角英数字、半角カナ、全角スペース）\nを整える。\n\"\"\"\nimport re\nimport unicodedata\n\nDEFAULT_SETTINGS = {\n    \"enabled\": True,               # 自動整形 ON/OFF\n    \"join_lines\": True,            # 変な改行を取って文をつなげる\n    \"collapse_spaces\": True,       # 連続スペース・タブを1つに\n    \"trim_lines\": True,            # 行頭・行末のスペースを取る\n    \"fullwidth_alnum_half\": True,  # 全角英数字 → 半角\n    \"halfwidth_kana_full\": True,   # 半角カナ → 全角カナ\n    \"fullwidth_space_half\": True,  # 全角スペース → 半角スペース\n    \"remove_jp_spaces\": True,      # 日本語の間に入ったスペースを取る\n    \"collapse_blank_lines\": True,  # 3行以上の空行を1行に\n    \"notify\": False,               # 整形したときに通知する\n    \"autostart\": False,            # Windows起動時に自動開始（app側で処理）\n}\n\n# 日本語文字（ひらがな・カタカナ・漢字・和文記号）\n_JP = r\"\\u3040-\\u30ff\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\u3000-\\u303f\\uff01-\\uff0f\\uff1a-\\uff20\\uff3b-\\uff40\\uff5b-\\uff65\"\n_JP_RE_BOTH = re.compile(r\"(?<=[%s])[ \\t]+(?=[%s])\" % (_JP, _JP))\n# 英単語の途中でハイフン＋改行された場合\n_HYPHEN_BREAK = re.compile(r\"([A-Za-z])-\\s*\\n\\s*(?=[a-z])\")\n# URL / メールっぽい行の判定\n_URL_LIKE = re.compile(r\"(https?://|www\\.|[\\w.+-]+@[\\w-]+\\.[\\w.]+)\", re.I)\n# 箇条書きの行頭\n_LIST_HEAD = re.compile(r\"^\\s*(?:[・•·\\-*＊※>]|[0-9０-９]+[\\.．、\\)）]|[①-⑳]|[（\\(][0-9０-９]+[）\\)])\\s*\")\n\n_FULLWIDTH_ALNUM = {}\nfor _i in range(0xFF01, 0xFF5F):\n    pass\n_ALNUM_TABLE = {}\nfor _c in \"ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ０１２３４５６７８９\":\n    _ALNUM_TABLE[ord(_c)] = chr(ord(_c) - 0xFEE0)\n\n_HALFWIDTH_KANA = re.compile(r\"[\\uff61-\\uff9f]+\")\n\n\ndef _halfwidth_kana_to_full(text):\n    def repl(m):\n        return unicodedata.normalize(\"NFKC\", m.group(0))\n    return _HALFWIDTH_KANA.sub(repl, text)\n\n\ndef _is_jp_char(ch):\n    if not ch:\n        return False\n    o = ord(ch)\n    return (\n        0x3040 <= o <= 0x30FF\n        or 0x3400 <= o <= 0x4DBF\n        or 0x4E00 <= o <= 0x9FFF\n        or 0x3000 <= o <= 0x303F\n        or o in (0x30FC,)  # ー\n    )\n\n\ndef _needs_space_between(left, right):\n    \"\"\"行をつなげるとき、間に半角スペースが要るかどうか\"\"\"\n    if not left or not right:\n        return False\n    l, r = left[-1], right[0]\n    # 日本語が絡む場合はスペース不要\n    if _is_jp_char(l) or _is_jp_char(r):\n        return False\n    # 英数字同士はスペースが要る\n    if (l.isalnum() or l in \".,\") and (r.isalnum()):\n        return True\n    return False\n\n\ndef _join_paragraph_lines(lines):\n    \"\"\"段落内の行を、意味のある改行だけ残してつなげる\"\"\"\n    out = []\n    buf = \"\"\n    for raw in lines:\n        line = raw.strip()\n        if not line:\n            continue\n        if not buf:\n            buf = line\n            continue\n        # 次の行が箇条書きなら改行を残す\n        if _LIST_HEAD.match(line):\n            out.append(buf)\n            buf = line\n            continue\n        # 前の行が「：」「:」で終わる（見出し＋本文の形）なら改行を残す\n        if buf.rstrip().endswith((\":\", \"：\")):\n            out.append(buf)\n            buf = line\n            continue\n        # つなげる\n        if buf.endswith(\"-\") and len(buf) >= 2 and buf[-2].isalpha() and line[0].islower():\n            # 英単語のハイフン改行 → ハイフンを取って直結\n            buf = buf[:-1] + line\n        elif _URL_LIKE.search(buf) and \" \" not in buf.strip():\n            # URLが途中で切れている場合は直結\n            buf = buf + line\n        elif _needs_space_between(buf, line):\n            buf = buf + \" \" + line\n        else:\n            buf = buf + line\n    if buf:\n        out.append(buf)\n    return \"\\n\".join(out)\n\n\ndef clean_text(text, settings=None):\n    \"\"\"テキストを整形して返す。settings は DEFAULT_SETTINGS のキーの辞書。\"\"\"\n    if text is None:\n        return \"\"\n    s = dict(DEFAULT_SETTINGS)\n    if settings:\n        s.update({k: v for k, v in settings.items() if k in DEFAULT_SETTINGS})\n\n    t = str(text)\n    # 改行コードを統一し、見えない文字を取り除く\n    t = t.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\")\n    t = t.replace(\"\\u200b\", \"\").replace(\"\\u200c\", \"\").replace(\"\\u200d\", \"\").replace(\"\\ufeff\", \"\")\n    t = t.replace(\"\\xa0\", \" \")  # ノーブレークスペース\n    t = re.sub(r\"[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]\", \"\", t)\n\n    if s[\"halfwidth_kana_full\"]:\n        t = _halfwidth_kana_to_full(t)\n    if s[\"fullwidth_alnum_half\"]:\n        t = t.translate(_ALNUM_TABLE)\n    if s[\"fullwidth_space_half\"]:\n        t = t.replace(\"\\u3000\", \" \")\n\n    # 段落（空行で区切られた塊）ごとに処理する\n    paragraphs = re.split(r\"\\n[ \\t]*\\n\", t)\n    cleaned_paras = []\n    for para in paragraphs:\n        lines = para.split(\"\\n\")\n        proc_lines = []\n        for line in lines:\n            if s[\"collapse_spaces\"]:\n                line = re.sub(r\"[ \\t]+\", \" \", line)\n            if s[\"trim_lines\"]:\n                line = line.strip()\n            proc_lines.append(line)\n        # 段落の前後の空行は落とす\n        while proc_lines and proc_lines[0] == \"\":\n            proc_lines.pop(0)\n        while proc_lines and proc_lines[-1] == \"\":\n            proc_lines.pop()\n        if not proc_lines:\n            continue\n        if s[\"join_lines\"]:\n            joined = _join_paragraph_lines(proc_lines)\n        else:\n            joined = \"\\n\".join(proc_lines)\n        cleaned_paras.append(joined)\n\n    t = \"\\n\\n\".join(cleaned_paras)\n\n    if s[\"remove_jp_spaces\"]:\n        # 日本語と日本語の間に入ったスペースを取る（PDFコピーで多い）\n        t = _JP_RE_BOTH.sub(\"\", t)\n        # 日本語の句読点の前後のスペースを取る\n        t = re.sub(r\"[ ]+(?=[、。．，！？：；])\", \"\", t)\n        t = re.sub(r\"(?<=[、。．，！？：；])[ ]+(?=[%s])\" % _JP, \"\", t)\n\n    if s[\"collapse_spaces\"]:\n        t = re.sub(r\"[ \\t]{2,}\", \" \", t)\n    if s[\"collapse_blank_lines\"]:\n        t = re.sub(r\"\\n{3,}\", \"\\n\\n\", t)\n\n    return t.strip()\n"}, {"p": "i18n_data.py", "s": 46963, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"i18n dictionary for PurePaste - 13 languages in the user's specified order.\"\"\"\nLANG_ORDER = [\"ja\", \"en\", \"es\", \"zh_CN\", \"fr\", \"de\", \"pt\", \"ru\", \"it\", \"tr\", \"ar\", \"id\", \"ko\"]\nLANG_NAMES = {\n    \"ja\": \"日本語\", \"en\": \"English\", \"es\": \"Español\", \"zh_CN\": \"简体中文\", \"fr\": \"Français\",\n    \"de\": \"Deutsch\", \"pt\": \"Português\", \"ru\": \"Русский\", \"it\": \"Italiano\", \"tr\": \"Türkçe\",\n    \"ar\": \"العربية\", \"id\": \"Bahasa Indonesia\", \"ko\": \"한국어\",\n}\n# Keys: every UI string goes through this dict.\n# Rule keys reuse the cleaner.py setting names; each rule also has a \"<key>_desc\" description.\nTRANSLATIONS = {\n    \"ja\": {\n        \"subtitle\": \"コピーした瞬間に、改行・スペース・全角半角を自動で整えます。普段はタスクトレイに常駐します。\",\n        \"onoff_on\": \"● 自動整形：ON（コピーすると即整形します）\",\n        \"onoff_off\": \"○ 自動整形：OFF（一時停止中）\",\n        \"options_title\": \"整形の内容（必要なものだけONにできます）\",\n        \"join_lines\": \"変な改行を取る\",\n        \"join_lines_desc\": \"PDFやWebで文の途中に入った改行をつなげます。段落の区切り（空行）と箇条書きは残します。\",\n        \"collapse_spaces\": \"連続スペース・タブを1つに\",\n        \"collapse_spaces_desc\": \"スペースやタブが何個も続いている所を1つにします。\",\n        \"trim_lines\": \"行頭・行末のスペースを取る\",\n        \"trim_lines_desc\": \"各行のはじめと終わりにある余分な空白を取り除きます。\",\n        \"fullwidth_alnum_half\": \"全角の英数字を半角に\",\n        \"fullwidth_alnum_half_desc\": \"Ｔｅｓｔ１２３ → Test123 のようにそろえます。\",\n        \"halfwidth_kana_full\": \"半角カナを全角カナに\",\n        \"halfwidth_kana_full_desc\": \"ｱｲｳｴｵ → アイウエオ のようにそろえます。\",\n        \"fullwidth_space_half\": \"全角スペースを半角に\",\n        \"fullwidth_space_half_desc\": \"見えにくい全角スペース（　）を半角スペースにします。\",\n        \"remove_jp_spaces\": \"日本語の間のスペースを取る\",\n        \"remove_jp_spaces_desc\": \"「こ ん に ち は」のような、PDFコピーで入りがちな日本語の間の空白を取ります。\",\n        \"collapse_blank_lines\": \"空行が続いたら1行にまとめる\",\n        \"collapse_blank_lines_desc\": \"3行以上の空行を、段落区切りの1行にします。\",\n        \"notify\": \"整形したら通知する\",\n        \"notify_desc\": \"タスクトレイの通知で「整形しました」とお知らせします。\",\n        \"autostart_label\": \"Windowsを起動したら自動でこのアプリも始める\",\n        \"test_title\": \"動作テスト（ここに貼ると、整形後がすぐ見えます）\",\n        \"input_placeholder\": \"ここにテストしたい文章を貼り付け…\",\n        \"output_placeholder\": \"整形後がここに出ます\",\n        \"sample_btn\": \"サンプルを入れる\",\n        \"copy_btn\": \"整形後をコピー\",\n        \"status_started\": \"状態：起動しました\",\n        \"status_cleaned\": \"状態：これまで {count} 回整形しました（直前：{before}文字 → {after}文字、{diff:+d}文字）\",\n        \"status_restored\": \"状態：直前の元のテキストに戻しました\",\n        \"note_resident\": \"ウィンドウを閉じてもアプリは終わりません（タスクトレイに常駐）。完全に終わらせるときは、トレイのアイコンを右クリック →「終了」です。\",\n        \"tray_open_settings\": \"設定を開く\",\n        \"tray_pause_resume\": \"一時停止 / 再開\",\n        \"tray_restore\": \"直前の元のテキストに戻す\",\n        \"tray_quit\": \"終了\",\n        \"tray_resident_msg\": \"タスクトレイに常駐しています。コピーすると自動で整形します。\",\n        \"notify_cleaned\": \"テキストを整形しました\",\n        \"notify_none\": \"戻せるテキストはまだありません\",\n        \"language_label\": \"表示言語\",\n    },\n    \"en\": {\n        \"subtitle\": \"Cleans up line breaks, spaces and fullwidth/halfwidth mixing the moment you copy. It normally lives in the task tray.\",\n        \"onoff_on\": \"● Auto-clean: ON (cleans as soon as you copy)\",\n        \"onoff_off\": \"○ Auto-clean: OFF (paused)\",\n        \"options_title\": \"Cleaning rules (turn on only what you need)\",\n        \"join_lines\": \"Remove stray line breaks\",\n        \"join_lines_desc\": \"Joins lines that were broken mid-sentence in PDFs or web pages. Paragraph breaks (blank lines) and bullet lists are kept.\",\n        \"collapse_spaces\": \"Collapse repeated spaces/tabs to one\",\n        \"collapse_spaces_desc\": \"Reduces runs of spaces or tabs to a single space.\",\n        \"trim_lines\": \"Trim spaces at line start/end\",\n        \"trim_lines_desc\": \"Removes extra spaces at the beginning and end of each line.\",\n        \"fullwidth_alnum_half\": \"Fullwidth alphanumerics to halfwidth\",\n        \"fullwidth_alnum_half_desc\": \"Unifies characters like Ｔｅｓｔ１２３ → Test123.\",\n        \"halfwidth_kana_full\": \"Halfwidth kana to fullwidth kana\",\n        \"halfwidth_kana_full_desc\": \"Unifies characters like ｱｲｳｴｵ → アイウエオ.\",\n        \"fullwidth_space_half\": \"Fullwidth space to halfwidth space\",\n        \"fullwidth_space_half_desc\": \"Converts hard-to-see fullwidth spaces (　) into regular halfwidth spaces.\",\n        \"remove_jp_spaces\": \"Remove spaces between Japanese characters\",\n        \"remove_jp_spaces_desc\": \"Removes spaces that creep in between Japanese characters when copying from PDFs, like “こ ん に ち は”.\",\n        \"collapse_blank_lines\": \"Collapse repeated        \"join_lines\": \"Quitar saltos de línea innecesarios\",\n        \"join_lines_desc\": \"Une las líneas cortadas a mitad de frase en PDF o páginas web. Se conservan los saltos de párrafo (líneas en blanco) y las listas.\",\n        \"collapse_spaces\": \"Reducir espacios/tabulaciones repetidos a uno\",\n        \"collapse_spaces_desc\": \"Convierte varios espacios o tabulaciones seguidos en uno solo.\",\n        \"trim_lines\": \"Quitar espacios al inicio y al final de la línea\",\n        \"trim_lines_desc\": \"Elimina los espacios sobrantes al principio y al final de cada línea.\",\n        \"fullwidth_alnum_half\": \"Alfanuméricos de ancho completo a medio ancho\",\n        \"fullwidth_alnum_half_desc\": \"Unifica caracteres como Ｔｅｓｔ１２３ → Test123.\",\n        \"halfwidth_kana_full\": \"Kana de medio ancho a ancho completo\",\n        \"halfwidth_kana_full_desc\": \"Unifica caracteres como ｱｲｳｴｵ → アイウエオ.\",\n        \"fullwidth_space_half\": \"Espacio de ancho completo a medio ancho\",\n        \"fullwidth_space_half_desc\": \"Convierte el espacio de ancho completo (　), difícil de ver, en un espacio normal.\",\n        \"remove_jp_spaces\": \"Quitar espacios entre caracteres japoneses\",\n        \"remove_jp_spaces_desc\": \"Elimina los espacios que se cuelan entre caracteres japoneses al copiar de un PDF, como «こ ん に ち は».\",\n        \"collapse_blank_lines\": \"Reducir líneas en blanco repetidas a una\",\n        \"collapse_blank_lines_desc\": \"Convierte 3 o más líneas en blanco en un único salto de párrafo.\",\n        \"notify\": \"Avisar cuando se limpie el texto\",\n        \"notify_desc\": \"Muestra una notificación en la bandeja indicando que el texto se limpió.\",\n        \"autostart_label\": \"Iniciar esta app automáticamente al arrancar Windows\",\n        \"test_title\": \"Prueba de funcionamiento (pega aquí y verás el resultado al instante)\",\n        \"input_placeholder\": \"Pega aquí el texto que quieras probar…\",\n        \"output_placeholder\": \"Aquí aparece el texto limpio\",\n        \"sample_btn\": \"Insertar ejemplo\",\n        \"copy_btn\": \"Copiar texto limpio\",\n        \"status_started\": \"Estado: Iniciado\",\n        \"status_cleaned\": \"Estado: {count} limpiezas hasta ahora (última: {before} → {after} caracteres, {diff:+d} caracteres)\",\n        \"status_restored\": \"Estado: Se restauró el texto original anterior\",\n        \"note_resident\": \"Cerrar la ventana no cierra la app (sigue en la bandeja). Para salir del todo, clic derecho en el icono de la bandeja → «Salir».\",\n        \"tray_open_settings\": \"Abrir ajustes\",\n        \"tray_pause_resume\": \"Pausar / Reanudar\",\n        \"tray_restore\": \"Restaurar el texto original anterior\",\n        \"tray_quit\": \"Salir\",\n        \"tray_resident_msg\": \"Se ejecuta en la bandeja del sistema. Copia texto y se limpiará automáticamente.\",\n        \"notify_cleaned\": \"Texto limpio\",\n        \"notify_none\": \"Aún no hay texto para restaurar\",\n        \"language_label\": \"Idioma\",\n    },\n    \"zh_CN\": {\n        \"subtitle\": \"复制的瞬间自动整理换行、空格和全角/半角混杂。平时驻留在任务托盘中。\",\n        \"onoff_on\": \"● 自动整理：ON（复制后立即整理）\",\n        \"onoff_off\": \"○ 自动整理：OFF（已暂停）\",\n        \"options_title\": \"整理内容（只需开启需要的项）\",\n        \"join_lines\": \"去除多余的换行\",\n        \"join_lines_desc\": \"连接 PDF 或网页中在句子中间断开的行。保留段落分隔（空行）和列表。\",\n        \"collapse_spaces\": \"连续空格/制表符合并为一个\",\n        \"collapse_spaces_desc\": \"将多处连续的空格或制表符合并为一个。\",\n        \"trim_lines\": \"去除行首和行尾的空格\",\n        \"trim_lines_desc\": \"删除每行开头和结尾多余的空格。\",\n        \"fullwidth_alnum_half\": \"全角英数字改为半角\",\n        \"fullwidth_alnum_half_desc\": \"统一为 Ｔｅｓｔ１２３ → Test123 这样的形式。\",\n        \"halfwidth_kana_full\": \"半角假名改为全角假名\",\n        \"halfwidth_kana_full_desc\": \"统一为 ｱｲｳｴｵ → アイウエオ 这样的形式。\",\n        \"fullwidth_space_half\": \"全角空格改为半角空格\",\n        \"fullwidth_space_half_desc\": \"将不易察觉的全角空格（　）改为半角空格。\",\n        \"remove_jp_spaces\": \"去除日语字符之间的空格\",\n        \"remove_jp_spaces_desc\": \"去除从 PDF 复制时容易混入的日语字符之间的空格，如「こ ん に ち は」。\",\n        \"collapse_blank_lines\": \"连续空行合并为一行\",\n        \"collapse_blank_lines_desc\": \"将 3 行以上的空行合并为一个段落分隔。\",\n        \"notify\": \"整理后通知\",\n        \"notify_desc\": \"通过托盘通知告知“已整理”。\",\n        \"autostart_label\": \"Windows 启动时自动启动本应用\",\n        \"test_title\": \"运行测试（粘贴到这里即可立即看到整理结果）\",\n        \"input_placeholder\": \"把想测试的文字粘贴到这里…\",\n        \"output_placeholder\": \"整理后的文字显示在这里\",\n        \"sample_btn\": \"插入示例\",\n        \"copy_btn\": \"复制整理后的文字\",\n        \"status_started\": \"状态：已启动\",\n        \"status_cleaned\": \"状态：到目前为止已整理 {count} 次（上次：{before} 字符 → {after} 字符，{diff:+d} 字符）\",\n        \"status_restored\": \"状态：已恢复到上一次的原文\",\n        \"note_resident\": \"关闭窗口不会退出应用（驻留在任务托盘）。要完全退出，请右键点击托盘图标 →“退出”。\",\n        \"tray_open_settings\": \"打开设置\",\n        \"tray_pause_resume\": \"暂停 / 继续\",\n        \"tray_restore\": \"恢复到上一次的原文\",\n        \"tray_quit\": \"退出\",\n        \"tray_resident_msg\": \"已驻留在任务托盘中。复制文字后将自动整理。\",\n        \"notify_cleaned\": \"已整理文字\",\n        \"notify_none\": \"尚无可恢复的文字\",\n        \"language_label\": \"语言\",\n    },\n    \"fr\": {\n        \"subtitle\": \"Nettoie instantanément les retours à la ligne, les espaces et le mélange pleine chasse/demi-chasse dès que vous copiez. Réside habituellement dans la zone de notification.\",\n        \"onoff_on\": \"● Nettoyage auto : ACTIVÉ (nettoie dès la copie)\",\n        \"onoff_off\": \"○ Nettoyage auto : DÉSACTIVÉ (en pause)\",\n        \"options_title\": \"Contenu du nettoyage (activez uniquement le nécessaire)\",\n        \"join_lines\": \"Supprimer les retours à la ligne intempestifs\",\n        \"join_lines_desc\": \"Relie les lignes coupées au milieu d'une phrase dans les PDF ou pages web. Les sauts de paragraphe (lignes vides) et les listes sont conservés.\",\n        \"collapse_spaces\": \"Réduire espaces/tabulations répétés à un seul\",\n        \"collapse_spaces_desc\": \"Ramène les suites d tray_pause_resume\": \"Pause / Fortsetzen\",\n        \"tray_restore\": \"Letzten Originaltext wiederherstellen\",\n        \"tray_quit\": \"Beenden\",\n        \"tray_resident_msg\": \"Die App läuft im Infobereich. Kopieren Sie Text, er wird automatisch bereinigt.\",\n        \"notify_cleaned\": \"Text bereinigt\",\n        \"notify_none\": \"Noch kein Text zum Wiederherstellen\",\n        \"language_label\": \"Sprache\",\n    },\n    \"pt\": {\n        \"subtitle\": \"Limpa quebras de linha, espaços e a mistura de largura total/meia no instante em que você copia. Normalmente fica residente na bandeja do sistema.\",\n        \"onoff_on\": \"● Limpeza automática: LIGADA (limpa assim que você copia)\",\n        \"onoff_off\": \"○ Limpeza automática: DESLIGADA (pausada)\",\n        \"options_title\": \"Conteúdo da limpeza (ative apenas o que precisar)\",\n        \"join_lines\": \"Remover quebras de linha indevidas\",\n        \"join_lines_desc\": \"Junta linhas cortadas no meio da frase em PDFs ou páginas web. Mantém as separações de parágrafo (linhas em branco) e as listas.\",\n        \"collapse_spaces\": \"Reduzir espaços/tabulações repetidos a um\",\n        \"collapse_spaces_desc\": \"Transforma vários espaços ou tabulações seguidos em um só.\",\n        \"trim_lines\": \"Remover espaços no início/fim da linha\",\n        \"trim_lines_desc\": \"Remove os espaços extras no começo e no fim de cada linha.\",\n        \"fullwidth_alnum_half\": \"Alfanuméricos de largura total para meia largura\",\n        \"fullwidth_alnum_half_desc\": \"Uniformiza caracteres como Ｔｅｓｔ１２３ → Test123.\",\n        \"halfwidth_kana_full\": \"Kana de meia largura para largura total\",\n        \"halfwidth_kana_full_desc\": \"Uniformiza caracteres como ｱｲｳｴｵ → アイウエオ.\",\n        \"fullwidth_space_half\": \"Espaço de largura total para meia largura\",\n        \"fullwidth_space_half_desc\": \"Converte o espaço de largura total (　), difícil de ver, em espaço comum.\",\n        \"remove_jp_spaces\": \"Remover espaços entre caracteres japoneses\",\n        \"remove_jp_spaces_desc\": \"Remove os espaços que entram entre caracteres japoneses ao copiar de PDFs, como 「こ ん に ち は」.\",\n        \"collapse_blank_lines\": \"Reduzir linhas em branco repetidas a uma\",\n        \"collapse_blank_lines_desc\": \"Transforma 3 ou mais linhas em branco em uma única separação de parágrafo.\",\n        \"notify\": \"Notificar quando o texto for limpo\",\n        \"notify_desc\": \"Mostra uma notificação na bandeja avisando que o texto foi limpo.\",\n        \"autostart_label\": \"Iniciar este app automaticamente com o Windows\",\n        \"test_title\": \"Teste de funcionamento (cole aqui e veja o resultado na hora)\",\n        \"input_placeholder\": \"Cole aqui o texto que quer testar…\",\n        \"output_placeholder\": \"O texto limpo aparece aqui\",\n        \"sample_btn\": \"Inserir exemplo\",\n        \"copy_btn\": \"Copiar texto limpo\",\n        \"status_started\": \"Estado: Iniciado\",\n        \"status_cleaned\": \"Estado: {count} limpezas até agora (última: {before} → {after} caracteres, {diff:+d} caracteres)\",\n        \"status_restored\": \"Estado: Texto original anterior restaurado\",\n        \"note_resident\": \"Fechar a janela não encerra o app (ele continua na bandeja). Para encerrar de vez, clique com o botão direito no ícone da bandeja → “Sair”.\",\n        \"tray_open_settings\": \"Abrir configurações\",\n        \"tray_pause_resume\": \"Pausar / Retomar\",\n        \"tray_restore\": \"Restaurar o texto original anterior\",\n        \"tray_quit\": \"Sair\",\n        \"tray_resident_msg\": \"Em execução na bandeja do sistema. Copie um texto e ele será limpo automaticamente.\",\n        \"notify_cleaned\": \"Texto limpo\",\n        \"notify_none\": \"Ainda não há texto para restaurar\",\n        \"language_label\": \"Idioma\",\n    },\n    \"ru\": {\n        \"subtitle\": \"Мгновенно при копировании приводит в порядок переносы строк, пробелы и смесь символов полной и половинной ширины. Обычно находится в системном трее.\",\n        \"onoff_on\": \"● Автоочистка: ВКЛ (очищает сразу при копировании)\",\n        \"onoff_off\": \"○ Автоочистка: ВЫКЛ (приостановлено)\",\n        \"options_title\": \"Правила очистки (включайте только нужное)\",\n        \"join_lines\": \"Убирать лишние переносы строк\",\n        \"join_lines_desc\": \"Соединяет строки, разорванные посреди предложения в PDF или на веб-страницах. Разделители абзацев (пустые строки) и списки сохраняются.\",\n        \"collapse_spaces\": \"Схлопывать повторяющиеся пробелы/табуляции в один\",\n        \"collapse_spaces_desc\": \"Заменяет несколько идущих подряд пробелов или табуляций одним пробелом.\",\n        \"trim_lines\": \"Убирать пробелы в начале и конце строк\",\n        \"trim_lines_desc\": \"Удаляет лишние пробелы в начале и в конце каждой строки.\",\n        \"fullwidth_alnum_half\": \"Полноширинные буквы и цифры в половинную ширину\",\n        \"fullwidth_alnum_half_desc\": \"Приводит символы к единому виду, например Ｔｅｓｔ１２３ → Test123.\",\n        \"halfwidth_kana_full\": \"Полуширинная кана в полноширинную\",\n        \"halfwidth_kana_full_desc\": \"Приводит символы к единому виду, например ｱｲｳｴｵ → アイウエオ.\",\n        \"fullwidth_space_half\": \"Полноширинный пробел в обычный\",\n        \"fullwidth_space_half_desc\": \"Преобразует трудноразличимый полноширинный пробел (　) в обычный пробел.\",\n        \"remove_jp_spaces\": \"Убирать пробелы между японскими символами\",\n        \"remove_jp_spaces_desc\": \"Удаляет пробелы, которые при копировании из PDF попадают между японскими символами, например «こ ん に ち は».\",\n        \"collapse_blank_lines\": \"Схлопывать повторяющиеся пустые строки в одну\",\n        \"collapse_blank_lines_desc\": \"Превращает 3 и более пустых строк в один разделитель абзацев.\",\n        \"notify\": \"Уведомлять об очистке\",\n        \"notify_desc\": \"Показывает уведомление в трее о том, что текст очищен.\",\n        \"autostart_label\": \"Запускать это приложение автоматически при старте Windows\",\n        \"test_title\": \"Проверка работы (вставьте сюда — результат виден сразу)\",\n        \"input_placeholder\": \"Вставьте сюда текст для проверки…\",\n        \"output_placeholder\": \"Здесь появится очищенный текст\",\n        \"sample_btn\": \"Вставить пример\",\n        \"copy_btn\": \"Копировать очищенный текст\",\n        \"status_started\": \"Состояние: Запущено\",\n        \"status_cleaned\": \"Состояние: Очисток выполнено: {count} (последняя: {before} → {after} символов, {diff:+d} символов)\",\n        \"status_restored\": \"Состояние: Восстановлен предыдущий исходный текст\",\n        \"note_resident\": \"Закрытие окна не завершает приложение (оно остаётся в трее). Чтобы завершить полностью: правый щелчок по значку в трее → «Выход».\",\n        \"tray_open_settings\": \"Открыть настройки\",\n        \"tray_pause_resume\": \"Пауза / Продолжить\",\n        \"tray_restore\": \"Восстановить предыдущий исходный текст\",\n        \"tray_quit\": \"Выход\",\n        \"tray_resident_msg\": \"Приложение работает в системном трее. Скопируйте текст — он будет очищен автоматически.\",\n        \"notify_cleaned\": \"Текст очищен\",\n        \"notify_none\": \"Пока нет текста для восстановления\",\n        \"language_label\": \"Язык\",\n    },\n    \"it\": {\n        \"subtitle\": \"All'istante in cui copi, sistema interruzioni di riga, spazi e la mescolanza di caratteri a larghezza piena e mezza. Di norma risiede nella barra delle applicazioni.\",\n        \"onoff_on\": \"● Pulizia automatica: ATTIVA (pulisce appena copi)\",\n        \"onoff_off\": \"○ Pulizia automatica: DISATTIVA (in pausa)\",\n        \"options_title\": \"Contenuto della pulizia (attiva solo ciò che serve)\",\n        \"join_lines\": \"Rimuovere le interruzioni di riga indesiderate\",\n        \"join_lines_desc\": \"Unisce le righe spezzate a metà frase nei PDF o nelle pagine web. Mantiene le separazioni di para ر واحد\",\n        \"collapse_blank_lines_desc\": \"يحوّل 3 أسطر فارغة أو أكثر إلى فاصل فقرة واحد.\",\n        \"notify\": \"الإشعار عند التنظيف\",\n        \"notify_desc\": \"يُظهر إشعارًا في العلبة يفيد بأن النص قد نُظّف.\",\n        \"autostart_label\": \"بدء هذا التطبيق تلقائيًا عند بدء Windows\",\n        \"test_title\": \"اختبار التشغيل (الصق هنا لترى النتيجة فورًا)\",\n        \"input_placeholder\": \"الصق هنا النص الذي تريد اختباره…\",\n        \"output_placeholder\": \"يظهر النص المنظّف هنا\",\n        \"sample_btn\": \"إدراج مثال\",\n        \"copy_btn\": \"نسخ النص المنظّف\",\n        \"status_started\": \"الحالة: تم البدء\",\n        \"status_cleaned\": \"الحالة: تم التنظيف {count} مرة حتى الآن (الأخيرة: {before} → {after} حرف، {diff:+d} حرف)\",\n        \"status_restored\": \"الحالة: تمت استعادة النص الأصلي السابق\",\n        \"note_resident\": \"إغلاق النافذة لا يُنهي التطبيق (يبقى في علبة النظام). للإنهاء الكامل: انقر بزر الفأرة الأيمن على أيقونة العلبة ← «إنهاء».\",\n        \"tray_open_settings\": \"فتح الإعدادات\",\n        \"tray_pause_resume\": \"إيقاف مؤقت / استئناف\",\n        \"tray_restore\": \"استعادة النص الأصلي السابق\",\n        \"tray_quit\": \"إنهاء\",\n        \"tray_resident_msg\": \"يعمل في علبة النظام. انسخ نصًا وسيتم تنظيفه تلقائيًا.\",\n        \"notify_cleaned\": \"تم تنظيف النص\",\n        \"notify_none\": \"لا يوجد نص لاستعادته بعد\",\n        \"language_label\": \"اللغة\",\n    },\n    \"id\": {\n        \"subtitle\": \"Membersihkan jeda baris, spasi, dan campuran huruf lebar penuh/setengah secara otomatis pada saat Anda menyalin. Biasanya menetap di baki sistem.\",\n        \"onoff_on\": \"● Pembersihan otomatis: AKTIF (membersihkan segera setelah menyalin)\",\n        \"onoff_off\": \"○ Pembersihan otomatis: NONAKTIF (dijeda)\",\n        \"options_title\": \"Isi pembersihan (aktifkan hanya yang diperlukan)\",\n        \"join_lines\": \"Hapus jeda baris yang mengganggu\",\n        \"join_lines_desc\": \"Menyambung baris yang terputus di tengah kalimat pada PDF atau halaman web. Pemisah paragraf (baris kosong) dan daftar tetap dipertahankan.\",\n        \"collapse_spaces\": \"Ringkas spasi/tab berulang menjadi satu\",\n        \"collapse_spaces_desc\": \"Mengubah beberapa spasi atau tab berturut-turut menjadi satu.\",\n        \"trim_lines\": \"Hapus spasi di awal/akhir baris\",\n        \"trim_lines_desc\": \"Menghapus spasi berlebih di awal dan akhir setiap baris.\",\n        \"fullwidth_alnum_half\": \"Alfanumerik lebar penuh ke setengah lebar\",\n        \"fullwidth_alnum_half_desc\": \"Menyelaraskan karakter seperti Ｔｅｓｔ１２３ → Test123.\",\n        \"halfwidth_kana_full\": \"Kana setengah lebar ke lebar penuh\",\n        \"halfwidth_kana_full_desc\": \"Menyelaraskan karakter seperti ｱｲｳｴｵ → アイウエオ.\",\n        \"fullwidth_space_half\": \"Spasi lebar penuh ke setengah lebar\",\n        \"fullwidth_space_half_desc\": \"Mengubah spasi lebar penuh (　) yang sulit dilihat menjadi spasi biasa.\",\n        \"remove_jp_spaces\": \"Hapus spasi di antara karakter Jepang\",\n        \"remove_jp_spaces_desc\": \"Menghapus spasi yang menyelinap di antara karakter Jepang saat menyalin dari PDF, seperti 「こ ん に ち は」.\",\n        \"collapse_blank_lines\": \"Ringkas baris kosong berulang menjadi satu\",\n        \"collapse_blank_lines_desc\": \"Mengubah 3 baris kosong atau lebih menjadi satu pemisah paragraf.\",\n        \"notify\": \"Beri tahu setelah membersihkan\",\n        \"notify_desc\": \"Menampilkan notifikasi di baki bahwa teks telah dibersihkan.\",\n        \"autostart_label\": \"Mulai aplikasi ini secara otomatis saat Windows mulai\",\n        \"test_title\": \"Uji fungsi (tempel di sini dan lihat hasilnya seketika)\",\n        \"input_placeholder\": \"Tempel teks yang ingin diuji di sini…\",\n        \"output_placeholder\": \"Teks yang dibersihkan tampil di sini\",\n        \"sample_btn\": \"Masukkan contoh\",\n        \"copy_btn\": \"Salin teks bersih\",\n        \"status_started\": \"Status: Dimulai\",\n        \"status_cleaned\": \"Status: Sudah {count} kali membersihkan (terakhir: {before} → {after} karakter, {diff:+d} karakter)\",\n        \"status_restored\": \"Status: Teks asli sebelumnya dipulihkan\",\n        \"note_resident\": \"Menutup jendela tidak mengakhiri aplikasi (tetap di baki sistem). Untuk keluar sepenuhnya, klik kanan ikon baki → “Keluar”.\",\n        \"tray_open_settings\": \"Buka pengaturan\",\n        \"tray_pause_resume\": \"Jeda / Lanjutkan\",\n        \"tray_restore\": \"Pulihkan teks asli sebelumnya\",\n        \"tray_quit\": \"Keluar\",\n        \"tray_resident_msg\": \"Berjalan di baki sistem. Salin teks dan akan dibersihkan otomatis.\",\n        \"notify_cleaned\": \"Teks dibersihkan\",\n        \"notify_none\": \"Belum ada teks untuk dipulihkan\",\n        \"language_label\": \"Bahasa\",\n    },\n    \"ko\": {\n        \"subtitle\": \"복사하는 순간 줄바꿈·공백·전각/반각 혼합을 자동으로 정리합니다. 평소에는 작업 트레이에 상주합니다.\",\n        \"onoff_on\": \"● 자동 정리: ON (복사하면 바로 정리합니다)\",\n        \"onoff_off\": \"○ 자동 정리: OFF (일시 정지 중)\",\n        \"options_title\": \"정리 내용 (필요한 것만 켤 수 있습니다)\",\n        \"join_lines\": \"이상한 줄바꿈 제거\",\n        \"join_lines_desc\": \"PDF나 웹에서 문장 중간에 끊긴 줄을 이어 붙입니다. 단락 구분(빈 줄)과 목록은 유지합니다.\",\n        \"collapse_spaces\": \"연속 공백·탭을 하나로\",\n        \"collapse_spaces_desc\": \"여러 개 이어진 공백이나 탭을 하나로 줄입니다.\",\n        \"trim_lines\": \"줄 시작·끝의 공백 제거\",\n        \"trim_lines_desc\": \"각 줄의 시작과 끝에 있는 불필요한 공백을 제거합니다.\",\n        \"fullwidth_alnum_half\": \"전각 영숫자를 반각으로\",\n        \"fullwidth_alnum_half_desc\": \"Ｔｅｓｔ１２３ → Test123 처럼 통일합니다.\",\n        \"halfwidth_kana_full\": \"반각 가나를 전각 가나로\",\n        \"halfwidth_kana_full_desc\": \"ｱｲｳｴｵ → アイウエオ 처럼 통일합니다.\",\n        \"fullwidth_space_half\": \"전각 공백을 반각으로\",\n        \"fullwidth_space_half_desc\": \"잘 보이지 않는 전각 공백(　)을 반각 공백으로 바꿉니다.\",\n        \"remove_jp_spaces\": \"일본어 사이의 공백 제거\",\n        \"remove_jp_spaces_desc\": \"PDF 복사 시 들어가기 쉬운 일본어 사이의 공백, 예: 「こ ん に ち は」를 제거합니다.\",\n        \"collapse_blank_lines\": \"빈 줄이 이어지면 하나로\",\n        \"collapse_blank_lines_desc\": \"3줄 이상의 빈 줄을 단락 구분 1줄로 만듭니다.\",\n        \"notify\": \"정리하면 알림\",\n        \"notify_desc\": \"트레이 알림으로 정리했음을 알려줍니다.\",\n        \"autostart_label\": \"Windows 시작 시 이 앱도 자동으로 시작\",\n        \"test_title\": \"동작 테스트 (여기에 붙여넣으면 정리 결과를 바로 볼 수 있습니다)\",\n        \"input_placeholder\": \"테스트할 문장을 여기에 붙여넣으세요…\",\n        \"output_placeholder\": \"정리된 결과가 여기에 나옵니다\",\n        \"sample_btn\": \"샘플 넣기\",\n        \"copy_btn\": \"정리 결과 복사\",\n        \"status_started\": \"상태: 시작됨\",\n        \"status_cleaned\": \"상태: 지금까지 {count}회 정리했습니다 (직전: {before}자 → {after}자, {diff:+d}자)\",\n        \"status_restored\": \"상태: 직전 원본 텍스트로 되돌렸습니다\",\n        \"note_resident\": \"창을 닫아도 앱은 종료되지 않습니다 (작업 트레이에 상주). 완전히 종료하려면 트레이 아이콘을 오른쪽 클릭 → “종료”입니다.\",\n        \"tray_open_settings\": \"설정 열기\",\n        \"tray_pause_resume\": \"일시 정지 / 재개\",\n        \"tray_restore\": \"직전 원본 텍스트로 되돌리기\",\n        \"tray_quit\": \"종료\",\n        \"tray_resident_msg\": \"작업 트레이에 상주 중입니다. 복사하면 자동으로 정리합니다.\",\n        \"notify_cleaned\": \"텍스트를 정리했습니다\",\n        \"notify_none\": \"되돌릴 텍스트가 아직 없습니다\",\n        \"language_label\": \"언어\",\n    },\n}\n\n\ndef t(lang, key):\n    d = TRANSLATIONS.get(lang) or TRANSLATIONS[\"en\"]\n    return d.get(key) or TRANSLATIONS[\"en\"].get(key) or key\n"}, {"p": "MakeApp-Mac.command", "s": 3209, "l": "bash", "c": "#!/bin/bash\n# PurePaste - build a macOS .app with PyInstaller\n# Double-click this file in Finder on a Mac. The app is built into\n#   dist/PurePaste.app\n# It first tries a universal2 build (runs on both Apple silicon and\n# Intel Macs). If that fails, it retries for this Mac's own CPU only\n# and tells you which kind was produced.\n#\n# Note: the built app is unsigned. To open it the first time,\n# right-click (Control-click) the app and choose \"Open\".\nset -u\ncd \"$(dirname \"$0\")\"\n\necho \"===============================================\"\necho \" PurePaste - build macOS app\"\necho \"===============================================\"\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Please install Python 3 first, then run this file again:\"\n  echo \"  https://www.python.org/downloads/macos/\"\n  echo \"  (Download the universal2 macOS installer.)\"\n  echo \"\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found next to this file.\"\n  echo \"Please extract the whole ZIP first, then try again.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -x .venv-build/bin/python ]; then\n  echo \"Creating the build environment (.venv-build)...\"\n  python3 -m venv .venv-build || {\n    echo \"Failed to create the Python environment.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\nPY=.venv-build/bin/python\n\necho \"Installing / updating build libraries...\"\n\"$PY\" -m pip install --upgrade pip >/dev/null 2>&1\n\"$PY\" -m pip install -r requirements.txt pyinstaller || {\n  echo \"Failed to install libraries. Check your network connection.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\n}\n\nARCH=\"$(uname -m)\"\necho \"This Mac's CPU: $ARCH\"\n\nbuild_app() {\n  # $1 = extra target-arch args (may be empty)\n  \"$PY\" -m PyInstaller --noconfirm --windowed --name PurePaste --icon assets/icon.icns \\\n    --exclude-module tkinter $1 app.py\n}\n\necho \"\"\necho \"Trying a universal2 build (Apple silicon + Intel)...\"\nif build_app \"--target-arch universal2\" && [ -d dist/PurePaste.app ]; then\n  echo \"\"\n  echo \"===============================================\"\n  echo \" Done: dist/PurePaste.app\"\n  echo \" Build type: universal2 (Apple silicon + Intel)\"\n  echo \"===============================================\"\nelse\n  echo \"\"\n  echo \"universal2 build failed. Retrying for this Mac only ($ARCH)...\"\n  rm -rf build dist PurePaste.spec\n  if build_app \"\" && [ -d dist/PurePaste.app ]; then\n    echo \"\"\n    echo \"===============================================\"\n    echo \" Done: dist/PurePaste.app\"\n    echo \" Build type: $ARCH only (this Mac's CPU)\"\n    echo \"===============================================\"\n  else\n    echo \"\"\n    echo \"Build failed. See the messages above for details.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"First launch of the built app: it is unsigned, so macOS may\"\necho \"block a plain double-click. Right-click (Control-click)\"\necho \"PurePaste.app and choose \\\"Open\\\" once.\"\necho \"PurePaste lives in the menu bar after launch.\"\necho \"\"\necho \"Press Enter to close this window.\"\nread -r _\n"}, {"p": "MakeExe-PurePaste.bat", "s": 776, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo [Error] app.py not found. Please extract the whole ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [Error] Python not found.\r\n  pause\r\n  exit /b 1\r\n)\r\necho Installing libraries and PyInstaller...\r\n%PY% -m pip install --upgrade PySide6-Essentials PyInstaller\r\nif errorlevel 1 (\r\n  echo [Error] Install failed.\r\n  pause\r\n  exit /b 1\r\n)\r\n%PY% -m PyInstaller --noconfirm --onefile --windowed --name PurePaste --icon assets\\icon.ico --add-data \"assets;assets\" app.py\r\nif errorlevel 1 (\r\n  echo [Error] EXE build failed.\r\n  pause\r\n  exit /b 1\r\n)\r\necho Done: dist\\PurePaste.exe\r\npause\r\n"}, {"p": "README-SOURCE.txt", "s": 901, "l": "plaintext", "c": "PurePaste - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of PurePaste, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-PurePaste.bat (or: python app.py)\n- Mac: Start-PurePaste.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 4399, "l": "plaintext", "c": "PurePaste　使い方\n================================\n\nコピーした瞬間に、クリップボードの中のテキストを自動で綺麗に整形する\nWindows用の常駐アプリです。\n\n\n・変な改行を取る … PDFやWebで文の途中で切れた改行をつなげます\n　（段落の区切り＝空行、箇条書きは残します）\n・連続スペース・タブを1つに\n・行頭・行末のスペースを取る\n・全角の英数字を半角に（Ｔｅｓｔ１２３ → Test123）\n・半角カナを全角カナに（ｱｲｳ → アイウ）\n・全角スペースを半角スペースに\n・日本語の間のスペースを取る（こ ん に ち は → こんにちは）\n・空行が続いたら1行にまとめる\n\n\n1. PurePaste.exe をダブルクリック\n2. 設定画面が開きます。そのままコピー作業をすれば自動で整形されます\n3. ウィンドウを閉じてもアプリは終わりません。\n　画面右下のタスクトレイ（時計の近く）に青い「P」アイコンで常駐します\n4. 完全に終わらせる：トレイのアイコンを右クリック →「終了」\n\n\n1. ZIPを右クリック →「すべて展開」\n2. 展開したフォルダの Start-PurePaste.bat をダブルクリック\n3. 初回だけ部品（約120MB）を自動でダウンロードします。\n　黒い画面は閉じずに待ってください（アプリ使用中はずっと開いたまま）\n\n\n・整形を止めたい → 設定画面の大きなボタンでOFF、またはトレイ右クリック「一時停止 / 再開」\n・元の文に戻したい → トレイ右クリック「直前の元のテキストに戻す」\n　そのあと貼り直してください\n・設定は自動で保存されます（%APPDATA%\\PurePaste\\settings.json）\n・Windows起動時に自動で始めたい → 設定の\n　「Windowsを起動したら自動でこのアプリも始める」にチェック\n\n\n・画像やファイルのコピーには何もしません（テキストだけを整形します）\n・パスワードなど、コピーした文字はすべて整形対象です。\n　整えたくないときは一時停止してください\n・実物のWindows PCでの起動確認は未実施です（テスト環境で確認済み）\n\n\nMac版について\n================================\n\n同じプログラムで、Macでも使えます（ソース版／.app化）。\n対応環境は macOS 11（Big Sur）以降です。\n\n【ソースのまま使う】\n1. ZIPを展開する\n2. Start-PurePaste.command をダブルクリック\n　（未署名のためブロックされたら、右クリック →「開く」）\n3. 初回だけ、部品を自動でダウンロードします\n4. Python 3 が無いMacでは、画面の案内（python.org）から\n　先に入れてください\n\n【アプリ（.app）にして使う】\n1. ZIPを展開する\n2. MakeApp-Mac.command をダブルクリック\n3. dist フォルダに PurePaste.app ができます\n　初回起動時は右クリック →「開く」で開いてください\n・チップ（CPU）について：まず Apple シリコン／Intel 両対応の\n　「universal2」版を作ろうとし、作れない場合は、\n　そのMacのチップ専用版を自動で作ります（画面に表示されます）\n\n【Windows版と違う点（正直なお知らせ）】\n・常駐先はタスクトレイではなく、画面上部のメニューバーです。\n　ウィンドウを閉じても常駐は続き、終了はメニューバーの\n　アイコンの右クリック →「終了」です\n・設定の保存先は ~/Library/Application Support/PurePaste の\n　settings.json です\n・設定画面の「Windowsを起動したら自動で始める」チェックは\n　Macでは効きません。Macでログイン時に自動で始めたい場合は、\n　システム設定 → 一般 → ログイン項目 に PurePaste.app を\n　追加してください。（上級者向け：~/Library/LaunchAgents に\n　PurePaste.app を指す LaunchAgent の plist を置いても同じです）\n・クリップボード監視と整形の仕組みは Windows版とまったく同じ\n　プログラムです\n・Macの実機での動作確認は未実施です（開発環境にMacが無いため。\n　初めて使う方の環境で .app を生成する方式です）\n"}, {"p": "requirements.txt", "s": 24, "l": "plaintext", "c": "PySide6-Essentials>=6.5\n"}, {"p": "Start-PurePaste.bat", "s": 725, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo [Error] app.py not found. Please extract the whole ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist requirements.txt (\r\n  echo [Error] requirements.txt not found. Please extract the whole ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [Error] Python not found.\r\n  pause\r\n  exit /b 1\r\n)\r\n%PY% -c \"import PySide6\" 2>nul\r\nif errorlevel 1 (\r\n  echo Installing libraries... (first launch only)\r\n  %PY% -m pip install PySide6-Essentials\r\n)\r\necho Starting PurePaste... Keep this window open while using the app.\r\n%PY% app.py\r\npause\r\n"}, {"p": "Start-PurePaste.command", "s": 1932, "l": "bash", "c": "#!/bin/bash\n# PurePaste - macOS launcher (source version)\n# Double-click this file in Finder to run PurePaste.\n# First launch creates a private Python environment (.venv) next to this\n# file and installs the required libraries; later launches are fast.\n# PurePaste lives in the menu bar (tray). Closing the window keeps it\n# running; quit from the tray icon's menu.\nset -u\ncd \"$(dirname \"$0\")\"\n\necho \"===============================================\"\necho \" PurePaste (macOS launcher)\"\necho \"===============================================\"\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Please install Python 3 first, then double-click this file again:\"\n  echo \"  1. Open https://www.python.org/downloads/macos/\"\n  echo \"  2. Download and run the macOS installer (universal2).\"\n  echo \"     (Or, if a dialog offers to install the Command Line\"\n  echo \"      Developer Tools, you may install those instead.)\"\n  echo \"\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found next to this file.\"\n  echo \"Please extract the whole ZIP first, then try again.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -x .venv/bin/python ]; then\n  echo \"First launch: creating the Python environment (.venv)...\"\n  python3 -m venv .venv || {\n    echo \"Failed to create the Python environment.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\nPY=.venv/bin/python\n\nif ! \"$PY\" -c \"import PySide6\" >/dev/null 2>&1; then\n  echo \"Installing libraries (first launch only)...\"\n  \"$PY\" -m pip install --upgrade pip >/dev/null 2>&1\n  \"$PY\" -m pip install -r requirements.txt || {\n    echo \"Failed to install libraries. Check your network connection.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\necho \"Starting PurePaste...\"\nexec \"$PY\" app.py\n"}, {"p": "tests/test_cleaner.py", "s": 2282, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport os, sys\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nfrom cleaner import clean_text, DEFAULT_SETTINGS\n\ndef test_pdf_japanese_join():\n    src = \"本日は晴天\\nなり。明日も\\n晴れるでしょう。\\n\\n次の段落です。\"\n    assert clean_text(src) == \"本日は晴天なり。明日も晴れるでしょう。\\n\\n次の段落です。\"\n\ndef test_english_wrap_join_with_space():\n    assert clean_text(\"The quick brown\\nfox jumps over.\") == \"The quick brown fox jumps over.\"\n\ndef test_hyphenation():\n    assert clean_text(\"informa-\\ntion is here\") == \"information is here\"\n\ndef test_fullwidth_alnum():\n    assert clean_text(\"Ｔｅｓｔ１２３　ＡＢＣ\") == \"Test123 ABC\"\n\ndef test_japanese_spaces_removed():\n    assert clean_text(\"こ ん に ち は　世 界\") == \"こんにちは世界\"\n\ndef test_halfwidth_kana():\n    # 半角カナ→全角化され、日本語同士の間のスペースは除去される\n    assert clean_text(\"ｱｲｳｴｵ ｶﾞｷﾞ\") == \"アイウエオガギ\"\n\ndef test_collapse_spaces_and_tabs():\n    assert clean_text(\"a    b\\t\\tc\") == \"a b c\"\n\ndef test_blank_lines():\n    assert clean_text(\"a\\n\\n\\n\\nb\") == \"a\\n\\nb\"\n\ndef test_list_lines_preserved():\n    src = \"買い物リスト\\n・りんご\\n・バナナ\"\n    out = clean_text(src)\n    assert \"・りんご\\n・バナナ\" in out\n\ndef test_no_join_when_disabled():\n    s = dict(DEFAULT_SETTINGS); s[\"join_lines\"] = False\n    assert clean_text(\"本日は\\n晴天です\", s) == \"本日は\\n晴天です\"\n\ndef test_fullwidth_kept_when_disabled():\n    s = dict(DEFAULT_SETTINGS); s[\"fullwidth_alnum_half\"] = False\n    assert clean_text(\"Ｔｅｓｔ\", s) == \"Ｔｅｓｔ\"\n\ndef test_url_join():\n    src = \"https://example.com/very/long/\\npath/page.html\"\n    assert clean_text(src) == \"https://example.com/very/long/path/page.html\"\n\ndef test_nbsp_and_zero_width():\n    assert clean_text(\"a\\xa0b\\u200bc\") == \"a bc\"\n\ndef test_idempotent():\n    samples = [\n        \"本日は晴天\\nなり。明日も\\n晴れるでしょう。\",\n        \"Ｔｅｓｔ１２３ ｱｲｳ こ ん に ち は\",\n        \"The quick brown\\nfox\\n\\n\\njumps.\",\n    ]\n    for x in samples:\n        once = clean_text(x)\n        assert clean_text(once) == once\n"}, {"p": "tests/test_i18n.py", "s": 3333, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport os, sys\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nfrom i18n_data import LANG_NAMES, LANG_ORDER, TRANSLATIONS, t\n\n\ndef test_i18n_completeness():\n    # 13言語すべてがそろっていること\n    assert LANG_ORDER == [\"ja\", \"en\", \"es\", \"zh_CN\", \"fr\", \"de\", \"pt\", \"ru\", \"it\", \"tr\", \"ar\", \"id\", \"ko\"]\n    assert set(TRANSLATIONS.keys()) == set(LANG_ORDER)\n    assert set(LANG_NAMES.keys()) == set(LANG_ORDER)\n    base_keys = set(TRANSLATIONS[\"ja\"].keys())\n    assert len(base_keys) > 0\n    for lang in LANG_ORDER:\n        d = TRANSLATIONS[lang]\n        # 日本語版と同じキーが全部あること（過不足なし）\n        assert set(d.keys()) == base_keys, lang\n        for key in base_keys:\n            v = d[key]\n            assert isinstance(v, str) and v.strip(), (lang, key)\n        # ステータス文のプレースホルダが全言語で一致すること\n        cleaned = d[\"status_cleaned\"]\n        for ph in (\"{count}\", \"{before}\", \"{after}\", \"{diff:+d}\"):\n            assert ph in cleaned, (lang, ph)\n\n\ndef test_status_format_works_in_all_languages():\n    for lang in LANG_ORDER:\n        s = t(lang, \"status_cleaned\").format(count=3, before=120, after=100, diff=-20)\n        assert \"3\" in s and \"120\" in s and \"100\" in s and \"-20\" in s, lang\n        s2 = t(lang, \"status_cleaned\").format(count=1, before=10, after=12, diff=2)\n        assert \"+2\" in s2, lang\n\n\ndef test_cleaning_independent_of_ui_language():\n    \"\"\"UI言語を切り替えても、整形結果が一切変わらないこと。\"\"\"\n    from PySide6.QtWidgets import QApplication\n    app = QApplication.instance() or QApplication(sys.argv)\n    import app as appmod\n    from cleaner import clean_text\n    win = appmod.MainWindow()\n    samples = [\n        \"本日は晴天\\nなり。明日も　晴れる\\nでしょう。\",\n        \"Ｔｅｓｔ１２３とｱｲｳｴｵ、こ ん に ち は　世 界。\",\n        \"The quick brown\\nfox    jumps\\tover the lazy dog.\",\n    ]\n    # 基準：cleaner を既定設定で直接呼んだ結果\n    expected = {}\n    for src in samples:\n        expected[src] = clean_text(src, win.collect_settings())\n    for lang in LANG_ORDER:\n        win.apply_language(lang)\n        assert win.lang == lang\n        # トレイメニューも新しい言語になっていること\n        assert win.act_quit.text() == t(lang, \"tray_quit\")\n        assert win.act_show.text() == t(lang, \"tray_open_settings\")\n        for src in samples:\n            win.input_edit.setPlainText(src)\n            app.processEvents()\n            assert win.output_edit.toPlainText() == expected[src], (lang, src)\n    # アラビア語では RTL、それ以外では LTR になること\n    win.apply_language(\"ar\")\n    from PySide6.QtCore import Qt\n    assert win.layoutDirection() == Qt.RightToLeft\n    win.apply_language(\"ja\")\n    assert win.layoutDirection() == Qt.LeftToRight\n    # 後続テストへ干渉しないよう、このウィンドウのクリップボード監視を止める\n    win.settings[\"enabled\"] = False\n    try:\n        win.clipboard.dataChanged.disconnect(win.on_clipboard_changed)\n    except Exception:\n        pass\n    win.tray.hide()\n    win.hide()\n    win.deleteLater()\n    app.processEvents()\n"}, {"p": "tests/test_platform.py", "s": 1553, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"プラットフォーム分岐（設定保存先）のテスト。\n\n- darwin: ~/Library/Application Support/PurePaste（APPDATAがあっても優先）\n- win32 + APPDATA: %APPDATA%\\PurePaste（従来どおり）\n- win32 で APPDATA 無し: ~/.purepaste（従来どおり）\n\"\"\"\nimport os\nimport sys\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\nimport app as appmod\n\n\ndef test_config_dir_darwin(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"darwin\")\n    monkeypatch.setenv(\"HOME\", str(tmp_path))\n    monkeypatch.setenv(\"APPDATA\", str(tmp_path / \"should_not_be_used\"))\n    path = appmod.config_dir()\n    expected = os.path.join(str(tmp_path), \"Library\", \"Application Support\", \"PurePaste\")\n    assert path == expected\n    assert os.path.isdir(path)\n\n\ndef test_config_dir_win32_appdata(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"win32\")\n    monkeypatch.setenv(\"HOME\", str(tmp_path))\n    monkeypatch.setenv(\"APPDATA\", str(tmp_path / \"appdata\"))\n    path = appmod.config_dir()\n    assert path == os.path.join(str(tmp_path / \"appdata\"), \"PurePaste\")\n    assert os.path.isdir(path)\n\n\ndef test_config_dir_win32_no_appdata(monkeypatch, tmp_path):\n    monkeypatch.setattr(sys, \"platform\", \"win32\")\n    monkeypatch.setenv(\"HOME\", str(tmp_path))\n    monkeypatch.delenv(\"APPDATA\", raising=False)\n    path = appmod.config_dir()\n    assert path == os.path.join(str(tmp_path), \".purepaste\")\n    assert os.path.isdir(path)\n"}, {"p": "tests/test_ui.py", "s": 1136, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport os, sys\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\n\ndef test_window_and_clipboard_cleaning():\n    from PySide6.QtWidgets import QApplication\n    app = QApplication.instance() or QApplication(sys.argv)\n    import app as appmod\n    win = appmod.MainWindow()\n    # プレビューが動くこと\n    win.input_edit.setPlainText(\"本日は晴天\\nなり。\")\n    assert win.output_edit.toPlainText() == \"本日は晴天なり。\"\n    # クリップボードに汚いテキストを入れると整形されて戻ること\n    app.clipboard().setText(\"Ｔｅｓｔ１２３\\nです\")\n    app.processEvents()\n    assert app.clipboard().text() == \"Test123です\"\n    # OFFにすると整形しないこと\n    win.settings[\"enabled\"] = False\n    app.clipboard().setText(\"Ｔｅｓｔ\")\n    app.processEvents()\n    assert app.clipboard().text() == \"Ｔｅｓｔ\"\n    win.settings[\"enabled\"] = True\n    # 元に戻す\n    win.restore_original()\n    app.processEvents()\n    assert app.clipboard().text() == \"Ｔｅｓｔ１２３\\nです\"\n"}]</script>
