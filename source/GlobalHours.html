he following time for our meeting:\\n\\n\"\n           \"- Your time: {partner_time} ({partner_city})\\n\"\n           \"- My time: {own_time} ({own_city})\\n\\n\"\n           \"Please let me know if this works for you.\\n\"\n           \"Thank you very much.\"),\n    \"es\": (\"Estimado equipo de {name}:\\n\\n\"\n           \"Me gustaría proponer el siguiente horario para nuestra reunión:\\n\\n\"\n           \"- Su hora: {partner_time} ({partner_city})\\n\"\n           \"- Mi hora: {own_time} ({own_city})\\n\\n\"\n           \"Por favor, avíseme si le conviene.\\n\"\n           \"Muchas gracias.\"),\n    \"zh\": (\"{name} 团队，您好：\\n\\n\"\n           \"我想提议以下会议时间：\\n\\n\"\n           \"- 贵方时间：{partner_time}（{partner_city}）\\n\"\n           \"- 我方时间：{own_time}（{own_city}）\\n\\n\"\n           \"如该时间合适，请告知。\\n\"\n           \"非常感谢。\"),\n    \"fr\": (\"Bonjour à l'équipe de {name},\\n\\n\"\n           \"Je vous propose l'horaire suivant pour notre réunion :\\n\\n\"\n           \"- Votre heure : {partner_time} ({partner_city})\\n\"\n           \"- Mon heure : {own_time} ({own_city})\\n\\n\"\n           \"Merci de me dire si cela vous convient.\\n\"\n           \"Cordialement.\"),\n    \"de\": (\"Sehr geehrtes Team von {name},\\n\\n\"\n           \"ich möchte Ihnen folgenden Termin für unser Gespräch vorschlagen:\\n\\n\"\n           \"- Ihre Zeit: {partner_time} ({partner_city})\\n\"\n           \"- Meine Zeit: {own_time} ({own_city})\\n\\n\"\n           \"Bitte teilen Sie mir mit, ob Ihnen dieser Termin passt.\\n\"\n           \"Vielen Dank.\"),\n    \"pt\": (\"Prezada equipe de {name},\\n\\n\"\n           \"Gostaria de propor o seguinte horário para a nossa reunião:\\n\\n\"\n           \"- O seu horário: {partner_time} ({partner_city})\\n\"\n           \"- O meu horário: {own_time} ({own_city})\\n\\n\"\n           \"Por favor, avise-me se este horário lhe convém.\\n\"\n           \"Muito obrigado.\"),\n    \"ru\": (\"Уважаемая команда {name}!\\n\\n\"\n           \"Предлагаю следующее время для нашей встречи:\\n\\n\"\n           \"- Ваше время: {partner_time} ({partner_city})\\n\"\n           \"- Моё время: {own_time} ({own_city})\\n\\n\"\n           \"Пожалуйста, сообщите, подходит ли вам это время.\\n\"\n           \"Большое спасибо.\"),\n    \"it\": (\"Gentile team di {name},\\n\\n\"\n           \"Vorrei proporre il seguente orario per la nostra riunione:\\n\\n\"\n           \"- Il vostro orario: {partner_time} ({partner_city})\\n\"\n           \"- Il mio orario: {own_time} ({own_city})\\n\\n\"\n           \"Vi prego di farmi sapere se vi sta bene.\\n\"\n           \"Grazie mille.\"),\n    \"tr\": (\"Sayın {name} ekibi,\\n\\n\"\n           \"Toplantımız için aşağıdaki zamanı önermek isterim:\\n\\n\"\n           \"- Sizin saatiniz: {partner_time} ({partner_city})\\n\"\n           \"- Benim saatim: {own_time} ({own_city})\\n\\n\"\n           \"Bu zaman size uygunsa lütfen bildirin.\\n\"\n           \"Çok teşekkür ederim.\"),\n    \"ar\": (\"فريق {name} المحترم،\\n\\n\"\n           \"أود اقتراح الموعد التالي لاجتماعنا:\\n\\n\"\n           \"- وقتكم: {partner_time} ({partner_city})\\n\"\n           \"- وقتي: {own_time} ({own_city})\\n\\n\"\n           \"يرجى إعلامي إذا كان هذا الموعد مناسبًا لكم.\\n\"\n           \"شكرًا جزيلًا.\"),\n    \"id\": (\"Tim {name} yang terhormat,\\n\\n\"\n           \"Saya ingin mengusulkan waktu berikut untuk pertemuan kita:\\n\\n\"\n           \"- Waktu Anda: {partner_time} ({partner_city})\\n\"\n           \"- Waktu saya: {own_time} ({own_city})\\n\\n\"\n           \"Mohon beri tahu saya jika waktu ini cocok untuk Anda.\\n\"\n           \"Terima kasih banyak.\"),\n    \"ko\": (\"{name} 담당자님께\\n\\n\"\n           \"회의 일정으로 다음 시간을 제안드립니다.\\n\\n\"\n           \"- 귀사 시간: {partner_time}({partner_city})\\n\"\n           \"- 당사 시간: {own_time}({own_city})\\n\\n\"\n           \"가능하시면 알려 주시기 바랍니다.\\n\"\n           \"감사합니다.\"),\n}\n\n\ndef proposal(lang: str, **kw) -> str:\n    tpl = PROPOSALS.get(lang) or PROPOSALS[\"en\"]\n    return tpl.format(**kw)\n\n\n# ----------------------------------------------------------------------\n# Extra keys (input-error guidance) — merged into STRINGS above\n# ----------------------------------------------------------------------\n\n_EXTRA = {\n    \"ja\": {\"time_gap\": \"注意：その時刻は夏時間の切り替えで存在しません（時計が飛ぶ時間帯です）。別の時刻を選んでください。\",\n           \"time_ambiguous\": \"注意：その時刻は夏時間の終了で2回あります（重なる時間帯です）。\",\n           \"invalid_zone\": \"タイムゾーン名が正しくありません。\"},\n    \"en\": {\"time_gap\": \"Note: that time does not exist (daylight-saving spring-forward gap). Please pick another time.\",\n           \"time_ambiguous\": \"Note: that time occurs twice (daylight-saving fall-back overlap).\",\n           \"invalid_zone\": \"That timezone name is not valid.\"},\n    \"es\": {\"time_gap\": \"Nota: esa hora no existe (salto por el horario de verano). Elija otra hora.\",\n           \"time_ambiguous\": \"Nota: esa hora ocurre dos veces (solapamiento al terminar el horario de verano).\",\n           \"invalid_zone\": \"Ese nombre de zona horaria no es válido.\"},\n    \"zh\": {\"time_gap\": \"注意：该时间不存在（夏令时向前跳过的时段）。请选择其他时间。\",\n           \"time_ambiguous\": \"注意：该时间会出现两次（夏令时结束时的重叠时段）。\",\n           \"invalid_zone\": \"时区名称无效。\"},\n    \"fr\": {\"time_gap\": \"Remarque : cette heure n'existe pas (saut de l'heure d'été). Choisissez une autre heure.\",\n           \"time_ambiguous\": \"Remarque : cette heure se produit deux fois (chevauchement à la fin de l'heure d'été).\",\n           \"invalid_zone\": \"Ce nom de fuseau horaire n'est pas valide.\"},\n    \"de\": {\"time_gap\": \"Hinweis: Diese Uhrzeit existiert nicht (Sprung bei der Zeitumstellung). Bitte wählen Sie eine andere Zeit.\",\n           \"time_ambiguous\": \"Hinweis: Diese Uhrzeit kommt zweimal vor (Überschneidung bei der Zeitumstellung).\",\n           \"invalid_zone\": \"Dieser Zeitzonenname ist ungültig.\"},\n    \"pt\": {\"time_gap\": \"Nota: essa hora não existe (salto do horário de verão). Escolha outra hora.\",\n           \"time_ambiguous\": \"Nota: essa hora ocorre duas vezes (sobreposição no fim do horário de verão).\",\n           \"invalid_zone\": \"Esse nome de fuso horário não é válido.\"},\n    \"ru\": {\"time_gap\": \"Примечание: такого времени не существует (пропуск при переходе на летнее время). Выберите другое время.\",\n           \"time_ambiguous\": \"Примечание: это время встречается дважды (перекрытие при переходе на зимнее время).\",\n           \"invalid_zone\": \"Недопустимое название часового пояса.\"},\n    \"it\": {\"time_gap\": \"Nota: quell'ora non esiste (salto dell'ora legale). Scegli un'altra ora.\",\n           \"time_ambiguous\": \"Nota: quell'ora si verifica due volte (sovrapposizione alla fine dell'ora legale).\",\n           \"invalid_zone\": \"Nome del fuso orario non valido.\"},\n    \"tr\": {\"time_gap\": \"Not: Bu saat mevcut değil (yaz saati ileri alma boşluğu). Lütfen başka bir saat seçin.\",\n           \"time_ambiguous\": \"Not: Bu saat iki kez gerçekleşiyor (yaz saati geri alma çakışması).\",\n           \"invalid_zone\": \"Bu saat dilimi adı geçerli değil.\"},\n    \"ar\": {\"time_gap\": \"ملاحظة: هذا الوقت غير موجود (فجوة الانتقال إلى التوقيت الصيفي). يرجى اختيار وقت آخر.\",\n           \"time_ambiguous\": \"ملاحظة: هذا الوقت يحدث مرتين (تداخل نهاية التوقيت الصيفي).\",\n           \"invalid_zone\": \"اسم المنطقة الزمنية غير صالح.\"},\n    \"id\": {\"time_gap\": \"Catatan: waktu itu tidak ada (lompatan waktu musim panas). Silakan pilih waktu lain.\",\n           \"time_ambiguous\": \"Catatan: waktu itu terjadi dua kali (tumpang tindih akhir waktu musim panas).\",\n           \"invalid_zone\": \"Nama zona waktu tidak valid.\"},\n    \"ko\": {\"time_gap\": \"참고: 그 시각은 존재하지 않습니다(서머타임 시작 시 건너뛰는 시간대). 다른 시각을 선택하세요.\",\n           \"time_ambiguous\": \"참고: 그 시각은 두 번 있습니다(서머타임 종료 시 겹치는 시간대).\",\n           \"invalid_zone\": \"시간대 이름이 올바르지 않습니다.\"},\n}\nfor _lang, _kv in _EXTRA.items():\n    STRINGS.setdefault(_lang, {}).update(_kv)\n\n\n# ----------------------------------------------------------------------\n# Extra keys (theme toggle button) — merged into STRINGS above\n# ----------------------------------------------------------------------\n\n_EXTRA_THEME = {\n    \"ja\": {\"theme_button\": \"画面テーマを切り替える（ダーク／ライト）\",\n           \"theme_dark\": \"ダーク\", \"theme_light\": \"ライト\"},\n    \"en\": {\"theme_button\": \"Switch the display theme (dark / light)\",\n           \"theme_dark\": \"Dark\", \"theme_light\": \"Light\"},\n    \"es\": {\"theme_button\": \"Cambiar el tema de pantalla (oscuro / claro)\",\n           \"theme_dark\": \"Oscuro\", \"theme_light\": \"Claro\"},\n    \"zh\": {\"theme_button\": \"切换显示主题（深色/浅色）\",\n           \"theme_dark\": \"深色\", \"theme_light\": \"浅色\"},\n    \"fr\": {\"theme_button\": \"Changer le thème d'affichage (sombre / clair)\",\n           \"theme_dark\": \"Sombre\", \"theme_light\": \"Clair\"},\n    \"de\": {\"theme_button\": \"Anzeigethema wechseln (dunkel / hell)\",\n           \"theme_dark\": \"Dunkel\", \"theme_light\": \"Hell\"},\n    \"pt\": {\"theme_button\": \"Alternar o tema de exibição (escuro / claro)\",\n           \"theme_dark\": \"Escuro\", \"theme_light\": \"Claro\"},\n    \"ru\": {\"theme_button\": \"Переключить тему оформления (тёмная / светлая)\",\n           \"theme_dark\": \"Тёмная\", \"theme_light\": \"Светлая\"},\n    \"it\": {\"theme_button\": \"Cambia tema di visualizzazione (scuro / chiaro)\",\n           \"theme_dark\": \"Scuro\", \"theme_light\": \"Chiaro\"},\n    \"tr\": {\"theme_button\": \"Görünüm temasını değiştir (koyu / açık)\",\n           \"theme_dark\": \"Koyu\", \"theme_light\": \"Açık\"},\n    \"ar\": {\"theme_button\": \"تبديل سمة العرض (داكنة / فاتحة)\",\n           \"theme_dark\": \"داكنة\", \"theme_light\": \"فاتحة\"},\n    \"id\": {\"theme_button\": \"Ganti tema tampilan (gelap / terang)\",\n           \"theme_dark\": \"Gelap\", \"theme_light\": \"Terang\"},\n    \"ko\": {\"theme_button\": \"화면 테마 전환(다크/라이트)\",\n           \"theme_dark\": \"다크\", \"theme_light\": \"라이트\"},\n}\nfor _lang, _kv in _EXTRA_THEME.items():\n    STRINGS.setdefault(_lang, {}).update(_kv)\n\n\n# ----------------------------------------------------------------------\n# Locale-correct date/time formatting via Babel\n# ----------------------------------------------------------------------\n\nBABEL_LOCALES = {\n    \"ja\": \"ja_JP\", \"en\": \"en_US\", \"es\": \"es\", \"zh\": \"zh_Hans_CN\",\n    \"fr\": \"fr\", \"de\": \"de\", \"pt\": \"pt\", \"ru\": \"ru\", \"it\": \"it\",\n    \"tr\": \"tr\", \"ar\": \"ar\", \"id\": \"id\", \"ko\": \"ko\",\n}\n\ntry:\n    from babel.dates import format_datetime as _babel_fmt\nexcept Exception:  # pragma: no cover - Babel is a hard dependency\n    _babel_fmt = None\n\n\ndef _fmt(dt, pattern, lang):\n    if _babel_fmt is not None:\n        try:\n            return _babel_fmt(dt, pattern,\n                              locale=BABEL_LOCALES.get(lang, \"en_US\"))\n        except Exception:\n            pass\n    return dt.strftime(\"%Y-%m-%d (%a) %H:%M\")\n\n\ndef fmt_datetime(dt, lang) -> str:\n    \"\"\"'2026-01-19 (Mon) 17:00' with the weekday in the UI language.\"\"\"\n    return _fmt(dt, \"yyyy-MM-dd (EEE) HH:mm\", lang)\n\n\ndef fmt_date(dt, lang) -> str:\n    return _fmt(dt, \"yyyy-MM-dd (EEE)\", lang)\n\n\ndef fmt_chip(dt, lang) -> str:\n    return _fmt(dt, \"MM-dd (EEE) HH:mm\", lang)\n"}, {"p": "MakeApp-Mac.command", "s": 3176, "l": "bash", "c": "#!/bin/bash\n# Build GlobalHours.app for macOS with PyInstaller.\n# A universal2 build is attempted first. If the installed Python or\n# libraries cannot produce universal2, the script retries for this Mac's\n# native CPU architecture and reports which one was built at the end.\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\ncd \"$SCRIPT_DIR\" || exit 1\n\npause_and_exit() {\n  echo\n  echo \"$1\"\n  echo \"Press Enter to close this window.\"\n  read -r _ || true\n  exit 1\n}\n\nif ! command -v python3 >/dev/null 2>&1; then\n  cat <<'EOF'\nPython 3 was not found.\n\nInstall Python 3.10 or later in either of these ways:\n  1. Download the macOS installer from https://www.python.org/downloads/macos/\n  2. If Homebrew is already installed, run: brew install python\n\nThen double-click MakeApp-Mac.command again.\nEOF\n  pause_and_exit \"Python 3 is required.\"\nfi\n\nPYTHON_BIN=\"$(command -v python3)\"\nif ! \"$PYTHON_BIN\" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' >/dev/null 2>&1; then\n  pause_and_exit \"Python 3.10 or later is required. Please install a current version from python.org.\"\nfi\n\nVENV_DIR=\"$SCRIPT_DIR/.venv\"\nVENV_PY=\"$VENV_DIR/bin/python\"\n\nif [ ! -x \"$VENV_PY\" ]; then\n  echo \"Creating the GlobalHours Python environment...\"\n  \"$PYTHON_BIN\" -m venv \"$VENV_DIR\" || pause_and_exit \"Could not create the Python virtual environment.\"\nfi\n\necho \"Installing application and build dependencies...\"\n\"$VENV_PY\" -m pip install --upgrade pip || pause_and_exit \"Could not update pip. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install -r \"$SCRIPT_DIR/requirements.txt\" || pause_and_exit \"Could not install the required Python packages. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install --upgrade pyinstaller || pause_and_exit \"Could not install PyInstaller. Check the network connection and try again.\"\n\nCOMMON_ARGS=(\n  --noconfirm\n  --clean\n  --windowed\n  --name GlobalHours --icon assets/icon.icns\n  --add-data \"fonts:fonts\"\n  --add-data \"assets:assets\"\n  --collect-all holidays\n  --collect-all tzdata\n  --collect-all babel\n  --exclude-module tkinter\n  --exclude-module unittest\n  --exclude-module pytest\n)\n\nBUILD_ARCH=\"\"\necho\necho \"Trying a universal2 build for Intel and Apple Silicon Macs...\"\nif \"$VENV_PY\" -m PyInstaller \"${COMMON_ARGS[@]}\" --target-arch universal2 \"$SCRIPT_DIR/app.py\"; then\n  BUILD_ARCH=\"universal2 (Intel and Apple Silicon)\"\nelse\n  echo\n  echo \"The universal2 build did not succeed. Retrying for this Mac's native architecture...\"\n  NATIVE_ARCH=\"$(uname -m)\"\n  if \"$VENV_PY\" -m PyInstaller \"${COMMON_ARGS[@]}\" \"$SCRIPT_DIR/app.py\"; then\n    BUILD_ARCH=\"native ($NATIVE_ARCH)\"\n  else\n    pause_and_exit \"PyInstaller could not build GlobalHours.app.\"\n  fi\nfi\n\nAPP_PATH=\"$SCRIPT_DIR/dist/GlobalHours.app\"\nif [ ! -d \"$APP_PATH\" ]; then\n  pause_and_exit \"The build finished without creating dist/GlobalHours.app.\"\nfi\n\necho\necho \"Build complete.\"\necho \"Created: $APP_PATH\"\necho \"Architecture: $BUILD_ARCH\"\necho\necho \"This app is unsigned. The first time you open it, use Finder:\"\necho \"right-click GlobalHours.app, choose Open, and confirm Open.\"\necho\necho \"Press Enter to close this window.\"\nread -r _ || true\n"}, {"p": "README-SOURCE.txt", "s": 909, "l": "plaintext", "c": "GlobalHours - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of GlobalHours, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-GlobalHours.bat (or: python app.py)\n- Mac: Start-GlobalHours.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 1741, "l": "plaintext", "c": "タイムゾーン・営業時間チェッカー（GlobalHours）\n\n海外の取引先の現地時間・営業時間・週末・祝日を一目で確認し、\n双方の営業時間に収まる会議候補と、相手の言語の提案文を用意する\nデスクトップアプリです。送信機能はありません（決めるのは人です）。\n\n■ Windows（EXE版）\n  GlobalHours-Windows.zip を展開し、GlobalHours.exe を実行してください。\n  Python は不要です。\n\n■ Windows（ソース版）／ Mac（ソースキット）\n  Python 3.10 以上が必要です。\n  Windows: Start-GlobalHours.bat をダブルクリック\n  Mac:     Start-GlobalHours.command をダブルクリック\n           （.app を作る場合は MakeApp-Mac.command）\n\n■ データの保存先\n  設定と取引先リストは次の場所に保存されます。\n  Windows: %APPDATA%\\GlobalHours\\settings.json\n  Mac:     ~/Library/Application Support/GlobalHours/settings.json\n\n■ 画面テーマ（ダーク／ライト）\n  画面右上のボタン1つで、ダーク（夜空）とライト（明るい画面）を\n  再起動なしで瞬時に切り替えられます。選んだテーマは保存され、\n  次回起動時もそのまま使えます。\n\n■ 完全オフライン\n  時差計算（IANAタイムゾーンデータ）と祝日データは同梱されており、\n  ネット接続なしで使えます。\n\nTimezone & business-hours checker for overseas partners.\nShows each partner's local time, business hours, weekends and\npublic holidays on one \"world time band\" map, proposes meeting\nslots that fit both sides, and drafts a proposal message in the\npartner's language. It never sends anything. Fully offline.\n"}, {"p": "requirements.txt", "s": 68, "l": "plaintext", "c": "PySide6>=6.5\nPillow>=10.0\nholidays>=0.40\ntzdata>=2024.1\nBabel>=2.14\n"}, {"p": "Start-GlobalHours.bat", "s": 1224, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\necho ========================================\r\necho  タイムゾーン・営業時間チェッカー（GlobalHours）の起動\r\necho  本体は EXE版 GlobalHours.exe を推奨します\r\necho ========================================\r\nif not exist app.py (\r\n  echo [エラー] app.py が見つかりません。\r\n  echo ZIPファイルを「すべて展開」して、展開したフォルダーの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist requirements.txt (\r\n  echo [エラー] requirements.txt が見つかりません。\r\n  echo ZIPファイルを「すべて展開」して、展開したフォルダーの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [エラー] Python が見つかりません。EXE版を使ってください（Python不要です）。\r\n  pause\r\n  exit /b 1\r\n)\r\necho ライブラリのインストール／確認をしています（初回のみ時間がかかります）...\r\n%PY% -m pip install -r requirements.txt\r\nif errorlevel 1 (\r\n  echo [エラー] ライブラリのインストールに失敗しました。ネット接続を確認してください。\r\n  pause\r\n  exit /b 1\r\n)\r\necho アプリを起動します。この黒い画面は開いたままにしてください（閉じるとアプリも終了します）。\r\n%PY% app.py\r\npause\r\n"}, {"p": "Start-GlobalHours.command", "s": 1611, "l": "bash", "c": "#!/bin/bash\n# GlobalHours launcher for macOS.\n# Creates a local virtual environment, installs the Python dependencies,\n# and starts the application.\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\ncd \"$SCRIPT_DIR\" || exit 1\n\npause_and_exit() {\n  echo\n  echo \"$1\"\n  echo \"Press Enter to close this window.\"\n  read -r _ || true\n  exit 1\n}\n\nif ! command -v python3 >/dev/null 2>&1; then\n  cat <<'EOF'\nPython 3 was not found.\n\nInstall Python 3.10 or later in either of these ways:\n  1. Download the macOS installer from https://www.python.org/downloads/macos/\n  2. If Homebrew is already installed, run: brew install python\n\nThen double-click Start-GlobalHours.command again.\nEOF\n  pause_and_exit \"Python 3 is required.\"\nfi\n\nPYTHON_BIN=\"$(command -v python3)\"\nif ! \"$PYTHON_BIN\" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' >/dev/null 2>&1; then\n  pause_and_exit \"Python 3.10 or later is required. Please install a current version from python.org.\"\nfi\n\nVENV_DIR=\"$SCRIPT_DIR/.venv\"\nVENV_PY=\"$VENV_DIR/bin/python\"\n\nif [ ! -x \"$VENV_PY\" ]; then\n  echo \"Creating the GlobalHours Python environment...\"\n  \"$PYTHON_BIN\" -m venv \"$VENV_DIR\" || pause_and_exit \"Could not create the Python virtual environment.\"\nfi\n\necho \"Checking GlobalHours dependencies...\"\n\"$VENV_PY\" -m pip install --upgrade pip || pause_and_exit \"Could not update pip. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install -r \"$SCRIPT_DIR/requirements.txt\" || pause_and_exit \"Could not install the required Python packages. Check the network connection and try again.\"\n\nexec \"$VENV_PY\" \"$SCRIPT_DIR/app.py\"\n"}, {"p": "tests/smoke_gui.py", "s": 5058, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen GUI smoke test + screenshot capture (band design).\n\nRun: QT_QPA_PLATFORM=offscreen python3 tests/smoke_gui.py\nBuilds the main window with sample partners, checks the band rows,\ncandidate chips and proposal, switches ja -> de -> ar (RTL) and\nsaves screenshots to build-work/shots/.\n\"\"\"\n\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\nos.environ.setdefault(\"XDG_CONFIG_HOME\", \"/tmp/tzchecker-smoke\")\n\nfrom PySide6.QtCore import QDate, QEvent\nfrom PySide6.QtWidgets import QApplication\n\nimport app as app_module\nimport theme\nfrom tzcore import AppState, OwnSettings, Partner\n\nSHOTS = os.path.join(os.path.dirname(os.path.dirname(\n    os.path.abspath(__file__))), \"build-work\", \"shots\")\nos.makedirs(SHOTS, exist_ok=True)\n\n\ndef grab(qapp, win, name):\n    \"\"\"Save a screenshot after fully settling the window: rebuilt\n    widgets are removed via deleteLater, so flush deferred deletions\n    and repaint first — otherwise the capture can show ghost widgets\n    from the previous language/theme.\"\"\"\n    qapp.processEvents()\n    qapp.sendPostedEvents(None, QEvent.Type.DeferredDelete)\n    qapp.processEvents()\n    win.repaint()\n    qapp.processEvents()\n    win.grab().save(os.path.join(SHOTS, name))\n\n\ndef main():\n    qapp = QApplication(sys.argv)\n    theme.apply_theme(qapp)\n    state = AppState(\n        own=OwnSettings(zone=\"Asia/Tokyo\", country_code=\"JP\"),\n        partners=[\n            Partner(name=\"New York Office\", country_code=\"US\",\n                    city=\"New York\", zone=\"America/New_York\"),\n            Partner(name=\"London Office\", country_code=\"GB\",\n                    city=\"London\", zone=\"Europe/London\"),\n            Partner(name=\"Singapore Office\", country_code=\"SG\",\n                    city=\"Singapore\", zone=\"Asia/Singapore\"),\n        ],\n        lang=\"ja\")\n    win = app_module.MainWindow(state)\n    win.resize(1280, 880)\n    win.show()\n    qapp.processEvents()\n\n    assert len(win._partner_rows) == 3, \"band rows\"\n    # a weekday daytime makes the bands show their full colours\n    from PySide6.QtCore import QDateTime, QTime\n    win.dt_edit.setDateTime(QDateTime(QDate(2026, 1, 19), QTime(17, 0)))\n    # select Singapore (index 2): slots exist on business days\n    win._select_partner(2)\n    win.slot_date.setDate(QDate(2026, 1, 19))   # Monday\n    win.refresh_slots()\n    qapp.processEvents()\n    assert len(win._slots) > 0, \"candidate slots for Singapore\"\n    assert win.chips_layout.count() == len(win._slots)\n    # chip click fills the proposal and copies it\n    win._chip_clicked(win._slots[0])\n    assert \"Singapore\" in win.proposal_edit.toPlainText()\n    grab(qapp, win, \"shot-ja.png\")\n\n    for lang, name in ((\"de\", \"shot-de.png\"), (\"ar\", \"shot-ar.png\")):\n        idx = win.lang_combo.findData(lang)\n        win.lang_combo.setCurrentIndex(idx)\n        qapp.processEvents()\n        assert win.lang == lang\n        # edit buttons must fit their (possibly long) labels\n        from PySide6.QtGui import QFontMetrics as _QFM\n        for row in [win.own_row] + list(win._partner_rows):\n            need = (_QFM(row.edit_btn.font()).horizontalAdvance(\n                row.edit_btn.text()) + 24)\n            assert row.edit_btn.width() >= need, (\n                f\"edit button clipped in {lang}: \"\n                f\"{row.edit_btn.width()} < {need}\")\n        grab(qapp, win, name)\n\n    # chips: every chip must be wide enough for its full text\n    from PySide6.QtGui import QFontMetrics\n    for i in range(win.chips_layout.count()):\n        chip = win.chips_layout.itemAt(i).widget()\n        need = (QFontMetrics(chip.font()).horizontalAdvance(chip.text())\n                + 30)\n        assert chip.width() >= need, (\n            f\"chip text clipped: {chip.text()!r} \"\n            f\"{chip.width()} < {need}\")\n        assert chip.height() == 44\n\n    # theme toggle: dark -> light in place, choice saved, then back\n    import theme as theme_mod\n    assert win.theme_name == \"dark\"\n    win._toggle_theme()\n    qapp.processEvents()\n    assert win.theme_name == \"light\" and state.theme == \"light\"\n    assert theme_mod.current_name() == \"light\"\n    assert \"#EFF4FC\" in qapp.styleSheet()\n    for lang, name in ((\"ja\", \"shot-light-ja.png\"),\n                       (\"de\", \"shot-light-de.png\"),\n                       (\"ar\", \"shot-light-ar.png\")):\n        idx = win.lang_combo.findData(lang)\n        win.lang_combo.setCurrentIndex(idx)\n        qapp.processEvents()\n        assert win.lang == lang\n        grab(qapp, win, name)\n    win._toggle_theme()\n    qapp.processEvents()\n    assert win.theme_name == \"dark\" and state.theme == \"dark\"\n\n    # overlay dialogs construct\n    from app import PartnerDialog, OwnSettingsDialog\n    dlg = PartnerDialog(\"ja\", parent=win)\n    assert dlg.result_partner().zone\n    dlg.close()\n    odlg = OwnSettingsDialog(\"ja\", state.own, parent=win)\n    assert odlg.result_own().zone == \"Asia/Tokyo\"\n    odlg.close()\n\n    print(\"SMOKE OK\", sorted(os.listdir(SHOTS)))\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"p": "tests/test_field.py", "s": 7747, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Field verification: conversions between real city pairs checked\nagainst known-correct answers (IANA rules, incl. southern-hemisphere\nDST, half-hour and 45-minute offsets, and the date line).\"\"\"\n\nimport sys\nfrom datetime import date, datetime\nfrom pathlib import Path\nfrom zoneinfo import ZoneInfo\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nimport tzcore\nfrom tzcore import OwnSettings, Partner\n\nTOKYO = OwnSettings(zone=\"Asia/Tokyo\", country_code=\"JP\")\n\n\ndef conv(from_zone, y, m, d, hh, mm, to_partner):\n    own = OwnSettings(zone=from_zone, country_code=\"JP\")\n    dt = datetime(y, m, d, hh, mm, tzinfo=ZoneInfo(from_zone))\n    return tzcore.check_partner(dt, own, to_partner)\n\n\ndef P(code, city, zone):\n    return Partner(name=city, country_code=code, city=city, zone=zone)\n\n\nLONDON = P(\"GB\", \"London\", \"Europe/London\")\nNY = P(\"US\", \"New York\", \"America/New_York\")\nSYDNEY = P(\"AU\", \"Sydney\", \"Australia/Sydney\")\nDUBAI = P(\"AE\", \"Dubai\", \"Asia/Dubai\")\nDELHI = P(\"IN\", \"Delhi\", \"Asia/Kolkata\")\nKATHMANDU = P(\"NP\", \"Kathmandu\", \"Asia/Kathmandu\")\nADELAIDE = P(\"AU\", \"Adelaide\", \"Australia/Adelaide\")\nAUCKLAND = P(\"NZ\", \"Auckland\", \"Pacific/Auckland\")\nHONOLULU = P(\"US\", \"Honolulu\", \"Pacific/Honolulu\")\nLA = P(\"US\", \"Los Angeles\", \"America/Los_Angeles\")\n\n\ndef hm(res):\n    return (res.local_dt.month, res.local_dt.day, res.local_dt.hour,\n            res.local_dt.minute)\n\n\n# --- 14 known-answer city-pair cases ---------------------------------\n\ndef test_tokyo_london_winter():\n    assert hm(conv(\"Asia/Tokyo\", 2026, 1, 15, 19, 0, LONDON)) == (1, 15, 10, 0)\n\n\ndef test_tokyo_london_summer():\n    assert hm(conv(\"Asia/Tokyo\", 2026, 7, 15, 19, 0, LONDON)) == (7, 15, 11, 0)\n\n\ndef test_tokyo_new_york_winter():\n    assert hm(conv(\"Asia/Tokyo\", 2026, 1, 15, 10, 0, NY)) == (1, 14, 20, 0)\n\n\ndef test_tokyo_sydney_summer_dst():\n    # January: Sydney is on AEDT (UTC+11) -> +2h from Tokyo\n    r = conv(\"Asia/Tokyo\", 2026, 1, 15, 10, 0, SYDNEY)\n    assert hm(r) == (1, 15, 12, 0)\n    assert r.offset_label == \"UTC+11:00\"\n\n\ndef test_tokyo_sydney_winter():\n    # July: Sydney is on AEST (UTC+10) -> +1h from Tokyo\n    r = conv(\"Asia/Tokyo\", 2026, 7, 15, 10, 0, SYDNEY)\n    assert hm(r) == (7, 15, 11, 0)\n    assert r.offset_label == \"UTC+10:00\"\n\n\ndef test_tokyo_dubai_no_dst():\n    r = conv(\"Asia/Tokyo\", 2026, 6, 15, 10, 0, DUBAI)\n    assert hm(r) == (6, 15, 5, 0)\n    assert r.diff_hours == -5.0\n\n\ndef test_tokyo_delhi_half_hour():\n    r = conv(\"Asia/Tokyo\", 2026, 1, 15, 10, 0, DELHI)\n    assert hm(r) == (1, 15, 6, 30)\n    assert r.offset_label == \"UTC+05:30\"\n\n\ndef test_tokyo_kathmandu_45_minutes():\n    r = conv(\"Asia/Tokyo\", 2026, 1, 15, 10, 0, KATHMANDU)\n    assert hm(r) == (1, 15, 6, 45)\n    assert r.offset_label == \"UTC+05:45\"\n    assert r.diff_hours == -3.25\n\n\ndef test_tokyo_adelaide_dst_half_hour():\n    # January: ACDT = UTC+10:30\n    assert hm(conv(\"Asia/Tokyo\", 2026, 1, 15, 10, 0, ADELAIDE)) == (1, 15, 11, 30)\n\n\ndef test_tokyo_adelaide_winter_half_hour():\n    # July: ACST = UTC+09:30\n    assert hm(conv(\"Asia/Tokyo\", 2026, 7, 15, 10, 0, ADELAIDE)) == (7, 15, 10, 30)\n\n\ndef test_tokyo_auckland_summer():\n    # January: NZDT = UTC+13\n    assert hm(conv(\"Asia/Tokyo\", 2026, 1, 15, 10, 0, AUCKLAND)) == (1, 15, 14, 0)\n\n\ndef test_tokyo_auckland_winter():\n    # July: NZST = UTC+12\n    assert hm(conv(\"Asia/Tokyo\", 2026, 7, 15, 10, 0, AUCKLAND)) == (7, 15, 13, 0)\n\n\ndef test_tokyo_honolulu_previous_day():\n    # Date line: Tokyo morning is Honolulu's previous afternoon\n    r = conv(\"Asia/Tokyo\", 2026, 1, 15, 10, 0, HONOLULU)\n    assert hm(r) == (1, 14, 15, 0)\n    assert r.diff_hours == -19.0\n\n\ndef test_sydney_los_angeles_dateline():\n    r = conv(\"Australia/Sydney\", 2026, 1, 15, 12, 0, LA)\n    assert hm(r) == (1, 14, 17, 0)\n\n\n# --- DST transition-day conversions -----------------------------------\n\ndef test_us_spring_forward_day():\n    # 2026-03-08 16:00 JST = 07:00 UTC = 03:00 EDT (02:00-03:00 skipped)\n    r = conv(\"Asia/Tokyo\", 2026, 3, 8, 16, 0, NY)\n    assert hm(r) == (3, 8, 3, 0)\n    assert r.offset_label == \"UTC-04:00\"\n\n\ndef test_us_fall_back_day():\n    # 2026-11-01 15:00 JST = 06:00 UTC = 01:00 EST (second 01:00)\n    r = conv(\"Asia/Tokyo\", 2026, 11, 1, 15, 0, NY)\n    assert hm(r) == (11, 1, 1, 0)\n    assert r.offset_label == \"UTC-05:00\"\n\n\ndef test_uk_spring_forward_day():\n    # 2026-03-29 10:00 JST = 01:00 UTC = 02:00 BST (01:00-02:00 skipped)\n    r = conv(\"Asia/Tokyo\", 2026, 3, 29, 10, 0, LONDON)\n    assert hm(r) == (3, 29, 2, 0)\n    assert r.offset_label == \"UTC+01:00\"\n\n\ndef test_sydney_dst_end_day():\n    # Sydney DST ends Sun 2026-04-05 (03:00 AEDT -> 02:00 AEST).\n    # Tokyo 2026-04-05 10:00 JST = 01:00 UTC = 11:00 AEST.\n    r = conv(\"Asia/Tokyo\", 2026, 4, 5, 10, 0, SYDNEY)\n    assert hm(r) == (4, 5, 11, 0)\n    assert r.offset_label == \"UTC+10:00\"\n\n\n# --- wall-clock classification (gap / ambiguous) ----------------------\n\ndef test_classify_gap_new_york():\n    naive = datetime(2026, 3, 8, 2, 30)\n    assert tzcore.classify_local(\"America/New_York\", naive) == \"gap\"\n\n\ndef test_classify_ambiguous_new_york():\n    naive = datetime(2026, 11, 1, 1, 30)\n    assert tzcore.classify_local(\"America/New_York\", naive) == \"ambiguous\"\n\n\ndef test_classify_normal():\n    assert tzcore.classify_local(\"America/New_York\",\n                                 datetime(2026, 1, 15, 12, 0)) == \"normal\"\n    assert tzcore.classify_local(\"Asia/Tokyo\",\n                                 datetime(2026, 3, 8, 2, 30)) == \"normal\"\n\n\ndef test_classify_gap_london():\n    naive = datetime(2026, 3, 29, 1, 30)\n    assert tzcore.classify_local(\"Europe/London\", naive) == \"gap\"\n\n\n# --- holidays: substitute / observed ---------------------------------\n\ndef test_japan_substitute_holiday_2026():\n    # 2026-05-03 (Constitution Day) is a Sunday; with May 4 and 5 also\n    # holidays, Wednesday 2026-05-06 is the substitute holiday.\n    assert tzcore.holiday_on(\"JP\", date(2026, 5, 6)) is not None\n\n\ndef test_us_observed_christmas_2026():\n    # Christmas 2026 falls on Friday; the federal holiday is the day\n    # itself (no shift needed). Thanksgiving: 4th Thursday of Nov.\n    assert tzcore.holiday_on(\"US\", date(2026, 11, 26)) is not None\n\n\ndef test_nepal_weekend_is_saturday_only():\n    # Nepal's weekly holiday is Saturday only.\n    assert tzcore.is_weekend((5,), date(2026, 1, 17))       # Saturday\n    assert not tzcore.is_weekend((5,), date(2026, 1, 18))   # Sunday\n\n\n# --- candidate slots: more shapes -------------------------------------\n\ndef test_slots_multi_day_count():\n    sg = P(\"SG\", \"Singapore\", \"Asia/Singapore\")\n    slots = tzcore.find_candidate_slots(\n        TOKYO, sg, date(2026, 1, 19), 3, duration_min=60, max_results=200)\n    days = {s.own_start.date() for s in slots}\n    assert days == {date(2026, 1, 19), date(2026, 1, 20), date(2026, 1, 21)}\n    # 10:00-17:00 starts in 30-min steps = 15 per day\n    assert len(slots) == 45\n\n\ndef test_slots_none_when_partner_always_night():\n    # Tokyo 09:00-18:00 vs New York 09:00-18:00 never overlap.\n    slots = tzcore.find_candidate_slots(\n        TOKYO, NY, date(2026, 1, 19), 5, duration_min=30, max_results=200)\n    assert slots == []\n\n\ndef test_slots_partner_shifted_hours():\n    # London partner working 08:00-17:00 in summer (BST): overlap with\n    # Tokyo 09:00-18:00 starts at 16:00 JST (= 08:00 BST).\n    london_early = Partner(name=\"London early\", country_code=\"GB\",\n                           city=\"London\", zone=\"Europe/London\",\n                           work_start=\"08:00\", work_end=\"17:00\")\n    slots = tzcore.find_candidate_slots(\n        TOKYO, london_early, date(2026, 7, 6), 1, duration_min=60)\n    assert slots\n    assert slots[0].own_start.hour == 16\n    assert all(s.partner_start.hour >= 8 for s in slots)\n"}, {"p": "tests/test_theme.py", "s": 5765, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tests for the dark/light theme system: state persistence,\npalette completeness, in-place switching and band rendering.\"\"\"\n\nimport json\nimport os\nimport sys\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport pytest  # noqa: E402\n\nimport theme  # noqa: E402\nimport tzcore  # noqa: E402\nfrom tzcore import AppState, OwnSettings, Partner  # noqa: E402\n\n\n@pytest.fixture(scope=\"module\")\ndef qapp():\n    from PySide6.QtWidgets import QApplication\n    return QApplication.instance() or QApplication(sys.argv)\n\n\n# ----------------------------------------------------------------------\n# State persistence\n# ----------------------------------------------------------------------\n\ndef test_theme_roundtrip(tmp_path, monkeypatch):\n    monkeypatch.setenv(\"XDG_CONFIG_HOME\", str(tmp_path))\n    state = AppState(theme=\"light\")\n    tzcore.save_state(state)\n    loaded = tzcore.load_state()\n    assert loaded.theme == \"light\"\n\n\ndef test_theme_defaults_dark_for_legacy_settings(tmp_path, monkeypatch):\n    monkeypatch.setenv(\"XDG_CONFIG_HOME\", str(tmp_path))\n    path = tzcore.settings_path()\n    with open(path, \"w\", encoding=\"utf-8\") as fh:\n        json.dump({\"own\": {}, \"partners\": [], \"lang\": \"ja\"}, fh)\n    assert tzcore.load_state().theme == \"dark\"\n\n\ndef test_theme_invalid_value_falls_back_to_dark(tmp_path, monkeypatch):\n    monkeypatch.setenv(\"XDG_CONFIG_HOME\", str(tmp_path))\n    path = tzcore.settings_path()\n    with open(path, \"w\", encoding=\"utf-8\") as fh:\n        json.dump({\"own\": {}, \"partners\": [], \"lang\": \"ja\",\n                   \"theme\": \"blue\"}, fh)\n    assert tzcore.load_state().theme == \"dark\"\n    # and saving normalises it back to a valid value\n    tzcore.save_state(tzcore.load_state())\n    with open(path, encoding=\"utf-8\") as fh:\n        assert json.load(fh)[\"theme\"] == \"dark\"\n\n\n# ----------------------------------------------------------------------\n# Palettes\n# ----------------------------------------------------------------------\n\ndef test_palettes_have_identical_keys():\n    assert set(theme.DARK) == set(theme.LIGHT)\n    for pal in (theme.DARK, theme.LIGHT):\n        assert len(pal[\"BAND_STOPS\"]) == 11\n        assert pal[\"BAND_STOPS\"][0][0] == 0.0\n        assert pal[\"BAND_STOPS\"][-1][0] == 24.0\n\n\ndef test_stylesheet_builds_for_both_themes():\n    dark = theme.stylesheet(theme.DARK)\n    light = theme.stylesheet(theme.LIGHT)\n    assert theme.DARK[\"BG\"] in dark\n    assert theme.LIGHT[\"BG\"] in light\n    assert \"check-off.png\" in dark\n    assert \"check-off-lt.png\" in light\n\n\ndef test_light_theme_is_a_real_light_palette():\n    pal = theme.LIGHT\n    # near-white panel, dark text: not a mere inversion of dark\n    assert pal[\"PANEL\"] == \"#FFFFFF\"\n    assert pal[\"INK\"] != theme.DARK[\"INK\"]\n    assert pal[\"HEADER\"] == \"#FFFFFF\"\n\n\n# ----------------------------------------------------------------------\n# Switching\n# ----------------------------------------------------------------------\n\ndef test_apply_theme_switches_app_palette(qapp):\n    from PySide6.QtGui import QColor, QPalette\n    theme.apply_theme(qapp, \"dark\")\n    assert theme.current_name() == \"dark\"\n    assert (qapp.palette().color(QPalette.ColorRole.Window)\n            == QColor(theme.DARK[\"BG\"]))\n    theme.apply_theme(qapp, \"light\")\n    assert theme.current_name() == \"light\"\n    assert (qapp.palette().color(QPalette.ColorRole.Window)\n            == QColor(theme.LIGHT[\"BG\"]))\n    assert theme.BG == theme.LIGHT[\"BG\"]  # dynamic lookup follows\n    theme.apply_theme(qapp, \"bogus\")       # unknown -> dark\n    assert theme.current_name() == \"dark\"\n\n\ndef test_main_window_toggle_saves_and_restores(qapp, tmp_path,\n                                               monkeypatch):\n    monkeypatch.setenv(\"XDG_CONFIG_HOME\", str(tmp_path))\n    theme.apply_theme(qapp, \"dark\")\n    import app as app_module\n    state = AppState(\n        own=OwnSettings(zone=\"Asia/Tokyo\", country_code=\"JP\"),\n        partners=[Partner(name=\"NY\", country_code=\"US\", city=\"New York\",\n                          zone=\"America/New_York\")],\n        lang=\"ja\", theme=\"dark\")\n    win = app_module.MainWindow(state)\n    assert win.theme_name == \"dark\"\n    win._toggle_theme()\n    assert win.theme_name == \"light\"\n    assert tzcore.load_state().theme == \"light\"   # persisted\n    win._toggle_theme()\n    assert win.theme_name == \"dark\"\n    assert tzcore.load_state().theme == \"dark\"\n    win.close()\n\n\ndef test_theme_toggle_icons_are_drawn(qapp):\n    import app as app_module\n    for name in (\"dark\", \"light\"):\n        icon = app_module._theme_icon(name)\n        assert not icon.isNull()\n        assert not icon.pixmap(26, 26).isNull()\n\n\n# ----------------------------------------------------------------------\n# Band rendering in both themes (incl. long-badge elision)\n# ----------------------------------------------------------------------\n\ndef test_band_renders_in_both_themes_with_long_badge(qapp):\n    from datetime import datetime, timezone\n    import bands\n    theme.apply_theme(qapp, \"dark\")\n    w = bands.BandWidget()\n    w.resize(760, 84)\n    w.configure(\"America/New_York\", \"09:00\", \"18:00\",\n                datetime(2026, 1, 19, 17, 0, tzinfo=timezone.utc),\n                dimmed=True,\n                badge=\"Birthday of Martin Luther King, Jr. (observed) — \"\n                      \"a very long holiday name that must not overflow\",\n                selected=False)\n    for name in (\"dark\", \"light\"):\n        theme.apply_theme(qapp, name)\n        w.update()\n        img = w.grab().toImage()\n        assert img.width() == 760 and img.height() == 84\n        # the band is painted (not blank): sample the middle pixel\n        assert img.pixelColor(380, 42).alpha() > 0\n    w.close()\n"}, {"p": "tests/test_tzcore.py", "s": 6842, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Unit tests for tzcore: conversion, DST boundaries, holidays,\nbusiness-hours judgement and candidate-slot computation.\"\"\"\n\nimport sys\nfrom datetime import date, datetime, time\nfrom pathlib import Path\nfrom zoneinfo import ZoneInfo\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nimport tzcore\nfrom tzcore import OwnSettings, Partner\n\nTOKYO = OwnSettings(zone=\"Asia/Tokyo\", country_code=\"JP\",\n                    work_start=\"09:00\", work_end=\"18:00\")\nNY = Partner(name=\"NY Office\", country_code=\"US\", city=\"New York\",\n             zone=\"America/New_York\")\nLONDON = Partner(name=\"London Office\", country_code=\"GB\", city=\"London\",\n                 zone=\"Europe/London\")\nBERLIN = Partner(name=\"Berlin Office\", country_code=\"DE\", city=\"Berlin\",\n                 zone=\"Europe/Berlin\")\nSINGAPORE = Partner(name=\"SG Office\", country_code=\"SG\", city=\"Singapore\",\n                    zone=\"Asia/Singapore\")\n\n\ndef aware(zone, y, m, d, hh, mm=0):\n    return datetime(y, m, d, hh, mm, tzinfo=ZoneInfo(zone))\n\n\n# ---------------- conversion ----------------\n\ndef test_conversion_tokyo_to_new_york_winter():\n    res = tzcore.check_partner(aware(\"Asia/Tokyo\", 2026, 1, 15, 10), TOKYO, NY)\n    assert (res.local_dt.year, res.local_dt.month, res.local_dt.day,\n            res.local_dt.hour) == (2026, 1, 14, 20)\n    assert res.offset_label == \"UTC-05:00\"\n    assert res.diff_hours == -14.0\n\n\ndef test_conversion_tokyo_to_london_summer():\n    res = tzcore.check_partner(aware(\"Asia/Tokyo\", 2026, 7, 1, 17), TOKYO, LONDON)\n    assert res.local_dt.hour == 9           # BST = UTC+1\n    assert res.offset_label == \"UTC+01:00\"\n    assert res.diff_hours == -8.0\n\n\n# ---------------- DST boundaries ----------------\n\ndef test_dst_us_spring_forward_2026():\n    zone = ZoneInfo(\"America/New_York\")\n    before = datetime(2026, 3, 7, 12, tzinfo=zone).utcoffset()\n    after = datetime(2026, 3, 9, 12, tzinfo=zone).utcoffset()\n    assert before.total_seconds() == -5 * 3600\n    assert after.total_seconds() == -4 * 3600\n\n\ndef test_dst_eu_spring_forward_2026():\n    zone = ZoneInfo(\"Europe/Berlin\")\n    before = datetime(2026, 3, 28, 12, tzinfo=zone).utcoffset()\n    after = datetime(2026, 3, 30, 12, tzinfo=zone).utcoffset()\n    assert before.total_seconds() == 1 * 3600\n    assert after.total_seconds() == 2 * 3600\n\n\ndef test_dst_change_near_detects_us_switch():\n    found = tzcore.dst_change_near(\"America/New_York\", date(2026, 3, 5),\n                                   within_days=7)\n    assert found == date(2026, 3, 8)\n\n\ndef test_dst_change_near_none_for_tokyo():\n    assert tzcore.dst_change_near(\"Asia/Tokyo\", date(2026, 3, 5),\n                                  within_days=7) is None\n\n\n# ---------------- holidays ----------------\n\ndef test_holiday_japan_new_year():\n    assert tzcore.holiday_on(\"JP\", date(2026, 1, 1)) is not None\n\n\ndef test_holiday_us_christmas():\n    name = tzcore.holiday_on(\"US\", date(2026, 12, 25))\n    assert name is not None and \"Christmas\" in name\n\n\ndef test_holiday_germany_unity_day():\n    assert tzcore.holiday_on(\"DE\", date(2026, 10, 3)) is not None\n\n\ndef test_no_holiday_on_plain_day():\n    assert tzcore.holiday_on(\"JP\", date(2026, 1, 19)) is None\n\n\n# ---------------- business-hours judgement ----------------\n\ndef test_business_hours_ok_london_summer():\n    # Mon 2026-07-06 17:00 JST = 09:00 BST, a business day in both.\n    res = tzcore.check_partner(aware(\"Asia/Tokyo\", 2026, 7, 6, 17),\n                               TOKYO, LONDON)\n    assert res.in_business_hours\n    assert not res.is_weekend\n    assert res.holiday_name is None\n    assert res.ok\n\n\ndef test_outside_hours_london_winter_morning():\n    # Mon 2026-01-19 10:00 JST = 01:00 GMT -> outside hours.\n    res = tzcore.check_partner(aware(\"Asia/Tokyo\", 2026, 1, 19, 10),\n                               TOKYO, LONDON)\n    assert not res.in_business_hours\n    assert not res.ok\n\n\ndef test_weekend_detection():\n    # Sat 2026-01-17 in Tokyo for a Tokyo partner.\n    tokyo_partner = Partner(name=\"Tokyo\", country_code=\"JP\", city=\"Tokyo\",\n                            zone=\"Asia/Tokyo\")\n    res = tzcore.check_partner(aware(\"Asia/Tokyo\", 2026, 1, 17, 11),\n                               TOKYO, tokyo_partner)\n    assert res.is_weekend\n    assert not res.ok\n\n\ndef test_holiday_blocks_ok():\n    # Fri 2026-12-25 20:00 JST = 11:00 GMT in London, but Christmas.\n    res = tzcore.check_partner(aware(\"Asia/Tokyo\", 2026, 12, 25, 20),\n                               TOKYO, LONDON)\n    assert res.holiday_name is not None\n    assert not res.ok\n\n\ndef test_weekend_fri_sat_country():\n    # Israel weekend is Fri/Sat: Fri 2026-01-16 is a weekend day.\n    assert tzcore.is_weekend((4, 5), date(2026, 1, 16))\n    assert not tzcore.is_weekend((4, 5), date(2026, 1, 18))  # Sunday\n\n\n# ---------------- candidate slots ----------------\n\ndef test_slots_singapore_overlap():\n    slots = tzcore.find_candidate_slots(\n        TOKYO, SINGAPORE, date(2026, 1, 19), 1, duration_min=60)\n    assert slots, \"expected overlapping slots Tokyo/Singapore\"\n    first = slots[0]\n    assert first.own_start.hour == 10       # 10:00 JST = 09:00 SGT\n    assert first.partner_start.hour == 9\n\n\ndef test_slots_london_summer_one_hour():\n    slots = tzcore.find_candidate_slots(\n        TOKYO, LONDON, date(2026, 7, 6), 1, duration_min=60)\n    assert len(slots) == 1\n    assert slots[0].own_start.hour == 17    # 17:00 JST = 09:00 BST\n    assert slots[0].partner_start.hour == 9\n\n\ndef test_slots_london_winter_none_for_60min():\n    slots = tzcore.find_candidate_slots(\n        TOKYO, LONDON, date(2026, 1, 19), 1, duration_min=60)\n    assert slots == []\n\n\ndef test_slots_skip_own_holiday():\n    # 2026-01-01 is a JP holiday -> no slots even with Singapore.\n    slots = tzcore.find_candidate_slots(\n        TOKYO, SINGAPORE, date(2026, 1, 1), 1, duration_min=60)\n    assert slots == []\n\n\ndef test_slots_skip_weekend():\n    # Sat 2026-01-17 -> no slots.\n    slots = tzcore.find_candidate_slots(\n        TOKYO, SINGAPORE, date(2026, 1, 17), 1, duration_min=60)\n    assert slots == []\n\n\n# ---------------- misc ----------------\n\ndef test_fmt_diff_hours():\n    assert tzcore.fmt_diff_hours(-14.0) == \"-14h\"\n    assert tzcore.fmt_diff_hours(5.5) == \"+5.5h\"\n    assert tzcore.fmt_diff_hours(0.0) == \"+0h\"\n\n\ndef test_state_roundtrip(tmp_path, monkeypatch):\n    target = tmp_path / \"settings.json\"\n    monkeypatch.setattr(tzcore, \"settings_path\", lambda: str(target))\n    state = tzcore.AppState(\n        own=OwnSettings(zone=\"Europe/London\", country_code=\"GB\"),\n        partners=[NY], lang=\"de\")\n    tzcore.save_state(state)\n    loaded = tzcore.load_state()\n    assert loaded.own.zone == \"Europe/London\"\n    assert loaded.lang == \"de\"\n    assert len(loaded.partners) == 1\n    assert loaded.partners[0].zone == \"America/New_York\"\n    assert loaded.partners[0].proposal_lang == \"en\"\n"}, {"p": "theme.py", "s": 10835, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Two switchable themes for GlobalHours.\n\nDark (default): a deep-indigo \"night sky\" with amber sunlight —\npartner time bands are drawn on a night ground and business hours\nglow amber like sunlight.\n\nLight: a clean \"daytime sky\" for bright offices and anyone who\nfinds dark screens hard to read — near-white panels, dark slate\ntext, a brighter sky gradient in the bands and a strong orange\nsegment (with an outline) for business hours. It is a designed\npalette, not a colour inversion of the dark one.\n\nThe user switches themes with one header button; the choice is\nsaved in the app state and restored on the next launch. Switching\nre-applies the stylesheet and repaints in place — no restart.\n\nColour values are looked up dynamically: ``theme.BG`` etc. always\nreturn the ACTIVE palette's value (module __getattr__), so widgets\nthat read them at build/refresh time follow the current theme.\nBundled fonts (Inter + Noto Sans JP, see fonts.py), flat buttons\nwith 10 px radii, custom-drawn combo chevrons and checkbox\nindicators (assets/, with \"-lt\" variants for the light theme),\nslim scrollbars.\n\"\"\"\n\nimport os\n\nimport fonts as _fonts\n\nDARK = {\n    \"name\": \"dark\",\n    \"BG\": \"#0C1230\",            # deep indigo night sky\n    \"BG_DEEP\": \"#080D24\",\n    \"PANEL\": \"#171F47\",         # band label / card ground\n    \"PANEL_SOFT\": \"#1E2757\",\n    \"INK\": \"#EDF1FF\",\n    \"SUBINK\": \"#9AA7D6\",\n    \"ACCENT\": \"#F5A623\",        # amber sunlight (primary)\n    \"ACCENT_DEEP\": \"#C77F0A\",\n    \"ACCENT_HOVER\": \"#FFB93E\",\n    \"ACCENT_SOFT\": \"#4A3A14\",\n    \"ACCENT_WASH\": \"#232A55\",\n    \"BTN_HOVER_TEXT\": \"#FFB93E\",\n    \"LINE\": \"#2E3A6E\",\n    \"LINE_STRONG\": \"#46548F\",\n    \"HEADER\": \"#080D24\",\n    \"HEADER_INK\": \"#FFFFFF\",\n    \"HEADER_SUB\": \"#8E9CC9\",\n    \"OK_GREEN\": \"#3ED598\",\n    \"WARN_AMBER\": \"#FFB93E\",\n    \"BAD_RED\": \"#FF9D9D\",\n    \"STATUS_OK\": \"#3ED598\",\n    \"STATUS_OUT\": \"#FFB93E\",\n    \"STATUS_OFF\": \"#FF9D9D\",\n    \"BTN_DIS_TEXT\": \"#5D6890\",\n    \"BTN_DIS_BORDER\": \"#232C58\",\n    \"BTN_DIS_BG\": \"#141B3E\",\n    \"SCROLL\": \"#3A477A\",\n    \"SCROLL_HOVER\": \"#55639C\",\n    \"SLIDER_HANDLE_BORDER\": \"#FFE1A8\",\n    \"PRIMARY_TEXT\": \"#1A1206\",\n    \"ASSET_SUFFIX\": \"\",\n    # --- band painting (see bands.py) ---\n    \"BAND_STOPS\": [\n        (0.0, \"#0F1734\"), (4.5, \"#121B40\"), (6.3, \"#5C3E63\"),\n        (7.6, \"#D9825F\"), (9.0, \"#7FB2E8\"), (13.0, \"#A5CFF5\"),\n        (16.5, \"#7FB2E8\"), (18.2, \"#E08A4C\"), (19.6, \"#463A6E\"),\n        (21.0, \"#131B3D\"), (24.0, \"#0D1330\"),\n    ],\n    \"BAND_AMBER\": \"#F5A623\",\n    \"BAND_AMBER_LIGHT\": \"#FFCF6B\",\n    \"BAND_AMBER_DEEP\": \"#D98E04\",\n    \"BAND_SEG_PEN\": None,\n    \"BAND_TICK\": (255, 255, 255, 90),\n    \"BAND_TICK_TEXT\": (255, 255, 255, 170),\n    \"BAND_DIM\": (5, 8, 22, 150),\n    \"BAND_BADGE_BG\": (5, 8, 22, 228),\n    \"BAND_BADGE_TEXT\": (237, 241, 255, 235),\n    \"BAND_BADGE_TEXT_DIM\": \"#FFFFFF\",\n    \"BAND_FRAME\": \"#2E3A6E\",\n}\n\nLIGHT = {\n    \"name\": \"light\",\n    \"BG\": \"#EFF4FC\",            # pale daytime-sky ground\n    \"BG_DEEP\": \"#E2EAF8\",\n    \"PANEL\": \"#FFFFFF\",         # band label / card ground\n    \"PANEL_SOFT\": \"#FFFFFF\",\n    \"INK\": \"#182242\",           # dark slate-navy text\n    \"SUBINK\": \"#4E5D85\",\n    \"ACCENT\": \"#F5A623\",        # amber (primary buttons)\n    \"ACCENT_DEEP\": \"#C77F0A\",\n    \"ACCENT_HOVER\": \"#FFB93E\",\n    \"ACCENT_SOFT\": \"#FFE3AC\",\n    \"ACCENT_WASH\": \"#FFF3D3\",\n    \"BTN_HOVER_TEXT\": \"#9C6A02\",\n    \"LINE\": \"#C2D1EC\",\n    \"LINE_STRONG\": \"#8FA5CF\",\n    \"HEADER\": \"#FFFFFF\",\n    \"HEADER_INK\": \"#182242\",\n    \"HEADER_SUB\": \"#4E5D85\",\n    \"OK_GREEN\": \"#0B8A5F\",\n    \"WARN_AMBER\": \"#9C6A02\",\n    \"BAD_RED\": \"#C22418\",\n    \"STATUS_OK\": \"#0B8A5F\",\n    \"STATUS_OUT\": \"#9C6A02\",\n    \"STATUS_OFF\": \"#C22418\",\n    \"BTN_DIS_TEXT\": \"#9AA7C4\",\n    \"BTN_DIS_BORDER\": \"#D5DEEF\",\n    \"BTN_DIS_BG\": \"#EDF1F9\",\n    \"SCROLL\": \"#B4C3E0\",\n    \"SCROLL_HOVER\": \"#8FA5CF\",\n    \"SLIDER_HANDLE_BORDER\": \"#C77F0A\",\n    \"PRIMARY_TEXT\": \"#1A1206\",\n    \"ASSET_SUFFIX\": \"-lt\",\n    # --- band painting: a brighter sky, strong orange segment ---\n    \"BAND_STOPS\": [\n        (0.0, \"#39466E\"), (4.5, \"#42538A\"), (6.3, \"#D98A6C\"),\n        (7.6, \"#F7B26B\"), (9.0, \"#8FC7F7\"), (13.0, \"#C4E6FF\"),\n        (16.5, \"#8FC7F7\"), (18.2, \"#F79E57\"), (19.6, \"#8A76B8\"),\n        (21.0, \"#4A5B96\"), (24.0, \"#3C4A78\"),\n    ],\n    \"BAND_AMBER\": \"#FFAE1A\",\n    \"BAND_AMBER_LIGHT\": \"#FFC94D\",\n    \"BAND_AMBER_DEEP\": \"#E8890C\",\n    \"BAND_SEG_PEN\": (146, 64, 14, 170),\n    \"BAND_TICK\": (255, 255, 255, 180),\n    \"BAND_TICK_TEXT\": (255, 255, 255, 240),\n    \"BAND_DIM\": (240, 245, 253, 168),\n    \"BAND_BADGE_BG\": (255, 255, 255, 245),\n    \"BAND_BADGE_TEXT\": (51, 64, 107, 255),\n    \"BAND_BADGE_TEXT_DIM\": \"#C22418\",\n    \"BAND_FRAME\": \"#A9BBDD\",\n}\n\nPALETTES = {\"dark\": DARK, \"light\": LIGHT}\nTHEME_NAMES = (\"dark\", \"light\")\n_state = {\"name\": \"dark\"}\n\nUI_FAMILY_CSS = ('\"Inter\", \"Noto Sans JP\", \"Segoe UI\", '\n                 '\"Hiragino Sans\", sans-serif')\n\n\ndef current_name() -> str:\n    return _state[\"name\"]\n\n\ndef palette() -> dict:\n    return PALETTES[_state[\"name\"]]\n\n\ndef __getattr__(name):\n    \"\"\"Dynamic colour lookup: theme.BG -> active palette value.\"\"\"\n    pal = PALETTES[_state[\"name\"]]\n    if name in pal:\n        return pal[name]\n    raise AttributeError(f\"module 'theme' has no attribute {name!r}\")\n\n\ndef _asset(name):\n    path = os.path.join(_fonts.base_dir(), \"assets\", name)\n    return path.replace(os.sep, \"/\")\n\n\ndef stylesheet(pal=None):\n    if pal is None:\n        pal = palette()\n    sfx = pal[\"ASSET_SUFFIX\"]\n    chev = _asset(f\"chevron-down{sfx}.png\")\n    chev_hot = _asset(f\"chevron-down-hot{sfx}.png\")\n    chk_off = _asset(f\"check-off{sfx}.png\")\n    chk_off_h = _asset(f\"check-off-hover{sfx}.png\")\n    chk_on = _asset(f\"check-on{sfx}.png\")\n    chk_on_h = _asset(f\"check-on-hover{sfx}.png\")\n    chk_off_d = _asset(f\"check-off-dis{sfx}.png\")\n    chk_on_d = _asset(f\"check-on-dis{sfx}.png\")\n    BG = pal[\"BG\"]; PANEL = pal[\"PANEL\"]; PANEL_SOFT = pal[\"PANEL_SOFT\"]\n    INK = pal[\"INK\"]; LINE = pal[\"LINE\"]; LINE_STRONG = pal[\"LINE_STRONG\"]\n    ACCENT = pal[\"ACCENT\"]; ACCENT_DEEP = pal[\"ACCENT_DEEP\"]\n    ACCENT_HOVER = pal[\"ACCENT_HOVER\"]; ACCENT_SOFT = pal[\"ACCENT_SOFT\"]\n    ACCENT_WASH = pal[\"ACCENT_WASH\"]; PRIMARY_TEXT = pal[\"PRIMARY_TEXT\"]\n    return f\"\"\"\nQMainWindow {{ background: {BG}; }}\nQWidget {{ color: {INK}; }}\nQLabel {{ color: {INK}; }}\nQPushButton {{\n    background: {PANEL_SOFT}; border: 1px solid {LINE}; border-radius: 10px;\n    padding: 9px 18px; font-size: 15px; font-weight: 600; color: {INK};\n}}\nQPushButton:hover {{ border-color: {ACCENT}; color: {pal[\"BTN_HOVER_TEXT\"]}; background: {ACCENT_WASH}; }}\nQPushButton:pressed {{ background: {ACCENT_SOFT}; }}\nQPushButton:checked {{ background: {ACCENT}; border-color: {ACCENT}; color: {PRIMARY_TEXT}; }}\nQPushButton:disabled {{ color: {pal[\"BTN_DIS_TEXT\"]}; border-color: {pal[\"BTN_DIS_BORDER\"]}; background: {pal[\"BTN_DIS_BG\"]}; }}\nQPushButton.primary {{\n    background: {ACCENT}; border: 1px solid {ACCENT}; color: {PRIMARY_TEXT}; font-weight: 700;\n}}\nQPushButton.primary:hover {{ background: {ACCENT_HOVER}; border-color: {ACCENT_HOVER}; color: {PRIMARY_TEXT}; }}\nQPushButton.primary:pressed {{ background: {ACCENT_DEEP}; border-color: {ACCENT_DEEP}; }}\nQComboBox {{\n    background: {PANEL_SOFT}; border: 1px solid {LINE}; border-radius: 10px;\n    padding: 8px 12px; font-size: 15px; font-weight: 600; color: {INK};\n}}\nQComboBox:hover {{ border-color: {LINE_STRONG}; }}\nQComboBox:focus {{ border-color: {ACCENT}; }}\nQComboBox::drop-down {{ border: none; width: 24px; }}\nQComboBox::down-arrow {{ image: url({chev}); width: 12px; height: 12px; }}\nQComboBox::down-arrow:hover {{ image: url({chev_hot}); }}\nQComboBox QAbstractItemView {{\n    background: {PANEL}; border: 1px solid {LINE}; border-radius: 8px;\n    selection-background-color: {ACCENT_SOFT}; selection-color: {INK};\n    padding: 4px; outline: none; font-size: 14px;\n}}\nQLineEdit, QDateEdit, QTimeEdit, QDateTimeEdit, QSpinBox {{\n    background: {PANEL_SOFT}; border: 1px solid {LINE}; border-radius: 10px;\n    padding: 8px 12px; font-size: 15px; color: {INK};\n}}\nQLineEdit:focus, QDateEdit:focus, QTimeEdit:focus, QDateTimeEdit:focus, QSpinBox:focus {{ border-color: {ACCENT}; }}\nQTextEdit {{\n    background: {PANEL}; border: 1px solid {LINE}; border-radius: 10px; padding: 10px 12px;\n    font-size: 14px; color: {INK};\n}}\nQTextEdit:focus {{ border-color: {ACCENT}; }}\nQCheckBox {{ font-size: 15px; font-weight: 600; spacing: 7px; }}\nQCheckBox::indicator {{ width: 18px; height: 18px; image: url({chk_off}); }}\nQCheckBox::indicator:hover {{ image: url({chk_off_h}); }}\nQCheckBox::indicator:checked {{ image: url({chk_on}); }}\nQCheckBox::indicator:checked:hover {{ image: url({chk_on_h}); }}\nQCheckBox::indicator:disabled {{ image: url({chk_off_d}); }}\nQCheckBox::indicator:checked:disabled {{ image: url({chk_on_d}); }}\nQSlider::groove:horizontal {{\n    height: 6px; border-radius: 3px; background: {LINE};\n}}\nQSlider::handle:horizontal {{\n    width: 18px; height: 18px; margin: -6px 0; border-radius: 9px;\n    background: {ACCENT}; border: 2px solid {pal[\"SLIDER_HANDLE_BORDER\"]};\n}}\nQSlider::sub-page:horizontal {{ background: {ACCENT_DEEP}; border-radius: 3px; }}\nQScrollBar:vertical {{ background: transparent; width: 10px; margin: 2px; }}\nQScrollBar::handle:vertical {{ background: {pal[\"SCROLL\"]}; border-radius: 5px; min-height: 30px; }}\nQScrollBar::handle:vertical:hover {{ background: {pal[\"SCROLL_HOVER\"]}; }}\nQScrollBar:horizontal {{ background: transparent; height: 10px; margin: 2px; }}\nQScrollBar::handle:horizontal {{ background: {pal[\"SCROLL\"]}; border-radius: 5px; min-width: 30px; }}\nQScrollBar::handle:horizontal:hover {{ background: {pal[\"SCROLL_HOVER\"]}; }}\nQScrollBar::add-line, QScrollBar::sub-line {{ height: 0; width: 0; }}\nQScrollBar::add-page, QScrollBar::sub-page {{ background: transparent; }}\nQDialog {{ background: {BG}; }}\nQToolTip {{ background: {PANEL}; color: {INK}; border: 1px solid {LINE}; font-size: 13px; padding: 5px 9px; }}\n\"\"\"\n\n\ndef apply_theme(app, name: str = \"dark\") -> None:\n    \"\"\"Apply the named palette + stylesheet (before building widgets,\n    and again in place when the user toggles the theme).\"\"\"\n    from PySide6.QtGui import QColor, QPalette\n    if name not in PALETTES:\n        name = \"dark\"\n    _state[\"name\"] = name\n    pal = PALETTES[name]\n    _fonts.register_fonts()\n    qt_pal = app.palette()\n    qt_pal.setColor(QPalette.ColorRole.Window, QColor(pal[\"BG\"]))\n    qt_pal.setColor(QPalette.ColorRole.Base, QColor(pal[\"PANEL\"]))\n    qt_pal.setColor(QPalette.ColorRole.WindowText, QColor(pal[\"INK\"]))\n    qt_pal.setColor(QPalette.ColorRole.Text, QColor(pal[\"INK\"]))\n    qt_pal.setColor(QPalette.ColorRole.Highlight, QColor(pal[\"ACCENT\"]))\n    qt_pal.setColor(QPalette.ColorRole.HighlightedText,\n                    QColor(pal[\"PRIMARY_TEXT\"]))\n    app.setPalette(qt_pal)\n    app.setStyleSheet(stylesheet(pal))\n"}, {"p": "tzcore.py", "s": 11310, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Core timezone / business-hours logic for GlobalHours.\n\nEverything here is pure computation on bundled data:\n  * timezone maths  -> zoneinfo + tzdata (IANA database)\n  * public holidays -> the `holidays` library's bundled country data\nNo network access is needed or used.\n\nThe app never sends anything. It only *checks* and *proposes*;\nthe human decides when to actually contact the partner.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\nimport sys\nfrom dataclasses import dataclass, field, asdict\nfrom datetime import date, datetime, time, timedelta\nfrom functools import lru_cache\nfrom zoneinfo import ZoneInfo\n\nimport holidays as _holidays_lib\n\nimport appinfo\nimport data as master\n\n\n# ----------------------------------------------------------------------\n# Data model\n# ----------------------------------------------------------------------\n\n@dataclass\nclass Partner:\n    name: str\n    country_code: str          # ISO alpha-2, key into master.COUNTRIES\n    city: str\n    zone: str                  # IANA timezone name\n    work_start: str = \"09:00\"  # local wall time \"HH:MM\"\n    work_end: str = \"18:00\"\n    lang: str = \"\"             # proposal language override; \"\" = auto\n\n    @property\n    def country(self):\n        return master.country_by_code(self.country_code)\n\n    @property\n    def weekend(self):\n        c = self.country\n        return c[\"weekend\"] if c else master.WEEKEND_SAT_SUN\n\n    @property\n    def proposal_lang(self):\n        if self.lang:\n            return self.lang\n        c = self.country\n        return c[\"lang\"] if c else \"en\"\n\n\n@dataclass\nclass OwnSettings:\n    zone: str = \"Asia/Tokyo\"\n    country_code: str = \"JP\"\n    work_start: str = \"09:00\"\n    work_end: str = \"18:00\"\n\n    @property\n    def country(self):\n        return master.country_by_code(self.country_code)\n\n    @property\n    def weekend(self):\n        c = self.country\n        return c[\"weekend\"] if c else master.WEEKEND_SAT_SUN\n\n\n@dataclass\nclass AppState:\n    own: OwnSettings = field(default_factory=OwnSettings)\n    partners: list = field(default_factory=list)   # list[Partner]\n    lang: str = \"ja\"                               # UI language\n    theme: str = \"dark\"                            # \"dark\" | \"light\"\n\n\n# ----------------------------------------------------------------------\n# Persistence (per-user app data folder)\n# ----------------------------------------------------------------------\n\ndef app_data_dir() -> str:\n    if sys.platform.startswith(\"win\"):\n        base = os.environ.get(\"APPDATA\") or os.path.expanduser(\"~\")\n    elif sys.platform == \"darwin\":\n        base = os.path.join(os.path.expanduser(\"~\"),\n                            \"Library\", \"Application Support\")\n    else:\n        base = os.environ.get(\"XDG_CONFIG_HOME\") or os.path.join(\n            os.path.expanduser(\"~\"), \".config\")\n    path = os.path.join(base, appinfo.APP_ID)\n    os.makedirs(path, exist_ok=True)\n    return path\n\n\ndef settings_path() -> str:\n    return os.path.join(app_data_dir(), \"settings.json\")\n\n\ndef save_state(state: AppState) -> None:\n    payload = {\n        \"own\": asdict(state.own),\n        \"partners\": [asdict(p) for p in state.partners],\n        \"lang\": state.lang,\n        \"theme\": state.theme if state.theme in (\"dark\", \"light\")\n        else \"dark\",\n    }\n    with open(settings_path(), \"w\", encoding=\"utf-8\") as fh:\n        json.dump(payload, fh, ensure_ascii=False, indent=2)\n\n\ndef load_state() -> AppState:\n    try:\n        with open(settings_path(), \"r\", encoding=\"utf-8\") as fh:\n            payload = json.load(fh)\n        own = OwnSettings(**payload.get(\"own\", {}))\n        partners = [Partner(**p) for p in payload.get(\"partners\", [])]\n        saved_theme = payload.get(\"theme\", \"dark\")\n        return AppState(own=own, partners=partners,\n                        lang=payload.get(\"lang\", \"ja\"),\n                        theme=saved_theme if saved_theme in (\"dark\", \"light\")\n                        else \"dark\")\n    except Exception:\n        return AppState()\n\n\n# ----------------------------------------------------------------------\n# Holiday lookup (bundled data, cached per country+year)\n# ----------------------------------------------------------------------\n\n@lru_cache(maxsize=256)\ndef _holiday_map(country_code: str, year: int) -> dict:\n    \"\"\"{date: name} for one country and year. Empty dict when the\n    country has no bundled holiday data.\"\"\"\n    if not country_code:\n        return {}\n    try:\n        try:\n            cal = _holidays_lib.country_holidays(\n                country_code, years=year, language=\"en_US\")\n        except Exception:\n            cal = _holidays_lib.country_holidays(country_code, years=year)\n        return {d: str(name) for d, name in cal.items()}\n    except Exception:\n        return {}\n\n\ndef holiday_on(country_code: str, day: date):\n    \"\"\"Holiday name on *day* in *country_code*, or None.\"\"\"\n    return _holiday_map(country_code, day.year).get(day)\n\n\ndef is_weekend(country_weekend, day: date) -> bool:\n    return day.weekday() in country_weekend\n\n\n# ----------------------------------------------------------------------\n# Business-hours judgement\n# ----------------------------------------------------------------------\n\ndef _parse_hhmm(text: str) -> time:\n    hh, mm = text.split(\":\")\n    return time(int(hh), int(mm))\n\n\ndef _within(day: date, local_dt: datetime, start_s: str, end_s: str) -> bool:\n    start = datetime.combine(day, _parse_hhmm(start_s))\n    end = datetime.combine(day, _parse_hhmm(end_s))\n    naive = local_dt.replace(tzinfo=None)\n    return start <= naive < end\n\n\n@dataclass\nclass CheckResult:\n    partner: Partner\n    local_dt: datetime          # aware datetime in the partner zone\n    offset_label: str           # e.g. \"UTC+09:00\"\n    diff_hours: float           # partner offset minus own offset\n    is_weekend: bool\n    holiday_name: str | None\n    in_business_hours: bool     # time-of-day inside the work window\n    ok: bool                    # business day AND inside the window\n    dst_change_date: date | None  # nearby DST switch, if any\n\n\ndef utc_offset_label(dt: datetime) -> str:\n    off = dt.utcoffset() or timedelta(0)\n    total = int(off.total_seconds())\n    sign = \"+\" if total >= 0 else \"-\"\n    total = abs(total)\n    return f\"UTC{sign}{total // 3600:02d}:{(total % 3600) // 60:02d}\"\n\n\ndef check_partner(own_dt: datetime, own: OwnSettings,\n                  partner: Partner) -> CheckResult:\n    \"\"\"Judge one partner at the aware datetime *own_dt* (own zone).\"\"\"\n    zone = ZoneInfo(partner.zone)\n    local = own_dt.astimezone(zone)\n    day = local.date()\n    weekend = is_weekend(partner.weekend, day)\n    hol = holiday_on(partner.country_code, day)\n    in_hours = _within(day, local, partner.work_start, partner.work_end)\n    ok = in_hours and not weekend and hol is None\n    own_off = own_dt.utcoffset() or timedelta(0)\n    loc_off = local.utcoffset() or timedelta(0)\n    dst = dst_change_near(partner.zone, day, within_days=7)\n    return CheckResult(\n        partner=partner, local_dt=local,\n        offset_label=utc_offset_label(local),\n        diff_hours=(loc_off - own_off).total_seconds() / 3600.0,\n        is_weekend=weekend, holiday_name=hol,\n        in_business_hours=in_hours, ok=ok, dst_change_date=dst)\n\n\n# ----------------------------------------------------------------------\n# DST transition detection\n# ----------------------------------------------------------------------\n\n@lru_cache(maxsize=128)\ndef _transitions_in_year(zone_name: str, year: int) -> tuple:\n    \"\"\"Dates in *year* on which the zone's UTC offset changes.\"\"\"\n    zone = ZoneInfo(zone_name)\n    found = []\n    prev = None\n    day = date(year, 1, 1)\n    while day.year == year:\n        probe = datetime.combine(day, time(12, 0), tzinfo=zone)\n        off = probe.utcoffset()\n        if prev is not None and off != prev:\n            found.append(day)\n        prev = off\n        day += timedelta(days=1)\n    return tuple(found)\n\n\ndef dst_change_near(zone_name: str, day: date, within_days: int = 7):\n    \"\"\"A DST switch date within +/- *within_days* of *day*, or None.\"\"\"\n    for year in (day.year - 1, day.year, day.year + 1):\n        for t in _transitions_in_year(zone_name, year):\n            if abs((t - day).days) <= within_days:\n                return t\n    return None\n\n\n# ----------------------------------------------------------------------\n# Candidate time slots that fit BOTH sides' business hours\n# ----------------------------------------------------------------------\n\n@dataclass\nclass Slot:\n    own_start: datetime\n    own_end: datetime\n    partner_start: datetime\n    partner_end: datetime\n\n\ndef _business_day(country_code: str, weekend, day: date) -> bool:\n    return (not is_weekend(weekend, day)\n            and holiday_on(country_code, day) is None)\n\n\ndef find_candidate_slots(own: OwnSettings, partner: Partner,\n                         start_day: date, num_days: int,\n                         duration_min: int = 60,\n                         step_min: int = 30,\n                         max_results: int = 60) -> list:\n    \"\"\"Slots (in the own zone) whose full duration fits inside both\n    sides' business hours on business days (no weekend / holiday).\"\"\"\n    own_zone = ZoneInfo(own.zone)\n    p_zone = ZoneInfo(partner.zone)\n    results: list[Slot] = []\n    duration = timedelta(minutes=duration_min)\n    step = timedelta(minutes=step_min)\n    for delta in range(num_days):\n        day = start_day + timedelta(days=delta)\n        if not _business_day(own.country_code, own.weekend, day):\n            continue\n        start = datetime.combine(day, _parse_hhmm(own.work_start),\n                                 tzinfo=own_zone)\n        end_limit = datetime.combine(day, _parse_hhmm(own.work_end),\n                                     tzinfo=own_zone)\n        cur = start\n        while cur + duration <= end_limit:\n            p_start = cur.astimezone(p_zone)\n            p_end = (cur + duration).astimezone(p_zone)\n            p_day = p_start.date()\n            if (_business_day(partner.country_code, partner.weekend, p_day)\n                    and p_end.date() == p_day\n                    and _within(p_day, p_start,\n                                partner.work_start, partner.work_end)\n                    and _within(p_day, p_end - timedelta(seconds=1),\n                                partner.work_start, partner.work_end)):\n                results.append(Slot(cur, cur + duration, p_start, p_end))\n                if len(results) >= max_results:\n                    return results\n            cur += step\n    return results\n\n\ndef classify_local(zone_name: str, naive_dt: datetime) -> str:\n    \"\"\"Classify a wall-clock time in *zone_name*:\n    \"normal\", \"gap\" (does not exist, spring-forward) or\n    \"ambiguous\" (occurs twice, fall-back).\"\"\"\n    zone = ZoneInfo(zone_name)\n    a0 = naive_dt.replace(tzinfo=zone, fold=0)\n    a1 = naive_dt.replace(tzinfo=zone, fold=1)\n    if a0.utcoffset() == a1.utcoffset():\n        return \"normal\"\n    from datetime import timezone as _tz\n    roundtrip = a0.astimezone(_tz.utc).astimezone(zone)\n    if roundtrip.replace(tzinfo=None) != naive_dt:\n        return \"gap\"\n    return \"ambiguous\"\n\n\ndef fmt_diff_hours(diff: float) -> str:\n    if diff == int(diff):\n        return f\"{diff:+.0f}h\"\n    return f\"{diff:+.1f}h\"\n"}]</script>

<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
</body>
