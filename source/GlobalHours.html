<script type="application/json" id="filedata">[{"p": "app.py", "s": 38560, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"GlobalHours — world-time band checker (main window).\n\nDesign: a \"world time band\" map. Each partner gets one 24-hour\nband (night -> dawn -> day -> dusk -> night gradient) with their\nbusiness hours glowing amber; your own band is pinned on top. One\nshared cursor — set by the date/time field or the time slider —\nsweeps every band at once, so each partner's local time, day/night\nand business-hours status is visible at a glance. Weekend and\nholiday bands are dimmed and badged. Overlapping candidate slots\nappear as glowing chips under the bands; clicking a chip copies a\nproposal message in the partner's language. Partner details and\nediting live in an overlay card opened from the band.\n\nSemi-automatic by design: the app only checks and proposes. It\nnever sends anything; the human decides when to make contact.\n\nRTL note: surrounding layout mirrors for Arabic, but the painted\nband timeline always runs 00:00 (left) -> 24:00 (right) so stacked\nbands stay comparable (see bands.py).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nimport os\nimport sys\nfrom datetime import date, datetime, time, timedelta\nfrom zoneinfo import ZoneInfo, available_timezones\n\nfrom PySide6.QtCore import (\n    QDate, QDateTime, QPointF, QRectF, QSize, QTime, Qt, Signal,\n)\nfrom PySide6.QtGui import (\n    QColor, QFont, QFontMetrics, QIcon, QPainter, QPainterPath,\n    QPen, QPixmap,\n)\nfrom PySide6.QtWidgets import (\n    QApplication, QComboBox, QDateEdit, QDateTimeEdit, QDialog,\n    QDialogButtonBox, QFormLayout, QHBoxLayout, QLabel, QLineEdit,\n    QMainWindow, QMessageBox, QPushButton, QScrollArea, QSlider,\n    QSpinBox, QTextEdit, QTimeEdit, QVBoxLayout, QWidget,\n)\n\nimport appinfo\nimport bands as bandmod\nimport data as master\nimport fonts\nimport i18n\nimport theme\nimport tzcore\nfrom tzcore import AppState, Partner, OwnSettings\n\n\ndef fmt_dt(dt: datetime, lang: str = \"en\") -> str:\n    return i18n.fmt_datetime(dt, lang)\n\n\ndef fmt_range(start: datetime, end: datetime, lang: str = \"en\") -> str:\n    return f\"{fmt_dt(start, lang)} – {end.strftime('%H:%M')}\"\n\n\ndef _hhmm(minutes: int) -> str:\n    return f\"{minutes // 60:02d}:{minutes % 60:02d}\"\n\n\ndef _theme_icon(theme_name: str) -> QIcon:\n    \"\"\"QPainter-drawn icon for the theme toggle button (no emoji\n    glyphs). Shows the theme you switch TO: a sun while the dark\n    theme is active, a crescent moon while the light theme is.\"\"\"\n    size = 52\n    pm = QPixmap(size, size)\n    pm.setDevicePixelRatio(2.0)\n    pm.fill(Qt.GlobalColor.transparent)\n    p = QPainter(pm)\n    p.setRenderHint(QPainter.RenderHint.Antialiasing)\n    cx = cy = size / 2.0\n    if theme_name == \"dark\":\n        amber = QColor(\"#F5A623\")\n        p.setPen(QPen(amber, 3.2, Qt.PenStyle.SolidLine,\n                      Qt.PenCapStyle.RoundCap))\n        for deg in range(0, 360, 45):\n            rad = math.radians(deg)\n            p.drawLine(QPointF(cx + 13.5 * math.cos(rad),\n                               cy + 13.5 * math.sin(rad)),\n                       QPointF(cx + 18.5 * math.cos(rad),\n                               cy + 18.5 * math.sin(rad)))\n        p.setPen(Qt.PenStyle.NoPen)\n        p.setBrush(amber)\n        p.drawEllipse(QRectF(cx - 8.5, cy - 8.5, 17, 17))\n    else:\n        path = QPainterPath()\n        path.setFillRule(Qt.FillRule.OddEvenFill)\n        path.addEllipse(QRectF(cx - 12, cy - 12, 24, 24))\n        path.addEllipse(QRectF(cx - 4, cy - 15, 24, 24))\n        p.fillPath(path, QColor(\"#42538A\"))\n        p.setPen(Qt.PenStyle.NoPen)\n        p.setBrush(QColor(\"#F5A623\"))\n        p.drawEllipse(QRectF(cx + 7, cy - 10, 4.5, 4.5))\n    p.end()\n    return QIcon(pm)\n\n\n# ----------------------------------------------------------------------\n# Partner overlay card (details + add / edit form)\n# ----------------------------------------------------------------------\n\nclass PartnerDialog(QDialog):\n    def __init__(self, lang: str, partner: Partner | None = None,\n                 detail_lines: list | None = None, parent=None):\n        super().__init__(parent)\n        self.lang = lang\n        self.delete_requested = False\n        self.setWindowTitle(i18n.t(lang, \"dlg_edit\" if partner else \"dlg_add\"))\n        self.setModal(True)\n        layout = QVBoxLayout(self)\n\n        if detail_lines:\n            card = QLabel(\"\\n\".join(detail_lines))\n            card.setStyleSheet(\n                f\"background: {theme.PANEL}; border: 1px solid {theme.LINE};\"\n                \"border-radius: 10px; padding: 10px 12px;\")\n            layout.addWidget(card)\n\n        form = QFormLayout()\n        layout.addLayout(form)\n        self.name_edit = QLineEdit(partner.name if partner else \"\")\n        form.addRow(i18n.t(lang, \"f_name\"), self.name_edit)\n\n        self.country_combo = QComboBox()\n        for c in master.COUNTRIES:\n            self.country_combo.addItem(f\"{c['name']} ({c['code']})\",\n                                       c[\"code\"])\n        form.addRow(i18n.t(lang, \"f_country\"), self.country_combo)\n\n        self.city_combo = QComboBox()\n        form.addRow(i18n.t(lang, \"f_city\"), self.city_combo)\n\n        self.zone_label = QLabel()\n        form.addRow(i18n.t(lang, \"f_zone\"), self.zone_label)\n\n        self.start_edit = QTimeEdit()\n        self.start_edit.setDisplayFormat(\"HH:mm\")\n        self.start_edit.setMinimumWidth(86)\n        self.end_edit = QTimeEdit()\n        self.end_edit.setDisplayFormat(\"HH:mm\")\n        self.end_edit.setMinimumWidth(86)\n        hours = QWidget()\n        hl = QHBoxLayout(hours)\n        hl.setContentsMargins(0, 0, 0, 0)\n        hl.addWidget(self.start_edit)\n        hl.addWidget(QLabel(\"–\"))\n        hl.addWidget(self.end_edit)\n        hl.addStretch(1)\n        form.addRow(i18n.t(lang, \"work_hours\"), hours)\n\n        self.lang_combo = QComboBox()\n        self.lang_combo.addItem(i18n.t(lang, \"auto\"), \"\")\n        for code, name in i18n.LANGS:\n            self.lang_combo.addItem(name, code)\n        form.addRow(i18n.t(lang, \"f_lang\"), self.lang_combo)\n\n        self.country_combo.currentIndexChanged.connect(self._fill_cities)\n        self.city_combo.currentIndexChanged.connect(self._update_zone)\n\n        if partner:\n            idx = self.country_combo.findData(partner.country_code)\n            self.country_combo.setCurrentIndex(max(idx, 0))\n            self._fill_cities()\n            cidx = self.city_combo.findText(partner.city)\n            self.city_combo.setCurrentIndex(max(cidx, 0))\n            self.start_edit.setTime(QTime.fromString(partner.work_start, \"HH:mm\"))\n            self.end_edit.setTime(QTime.fromString(partner.work_end, \"HH:mm\"))\n            lidx = self.lang_combo.findData(partner.lang)\n            self.lang_combo.setCurrentIndex(max(lidx, 0))\n        else:\n            self._fill_cities()\n            self.start_edit.setTime(QTime(9, 0))\n            self.end_edit.setTime(QTime(18, 0))\n        self._update_zone()\n\n        btn_row = QHBoxLayout()\n        if partner:\n            del_btn = QPushButton(i18n.t(lang, \"delete\"))\n            del_btn.clicked.connect(self._on_delete)\n            btn_row.addWidget(del_btn)\n        btn_row.addStretch(1)\n        buttons = QDialogButtonBox(\n            QDialogButtonBox.StandardButton.Ok\n            | QDialogButtonBox.StandardButton.Cancel)\n        buttons.button(QDialogButtonBox.StandardButton.Ok).setText(\n            i18n.t(lang, \"save\"))\n        buttons.button(QDialogButtonBox.StandardButton.Cancel).setText(\n            i18n.t(lang, \"cancel\"))\n        buttons.accepted.connect(self.accept)\n        buttons.rejected.connect(self.reject)\n        btn_row.addWidget(buttons)\n        layout.addLayout(btn_row)\n\n    def _on_delete(self):\n        ans = QMessageBox.question(\n            self, self.windowTitle(), i18n.t(self.lang, \"delete_confirm\"))\n        if ans == QMessageBox.StandardButton.Yes:\n            self.delete_requested = True\n            self.accept()\n\n    def _fill_cities(self):\n        code = self.country_combo.currentData()\n        country = master.country_by_code(code)\n        self.city_combo.clear()\n        if country:\n            for city, zone in country[\"cities\"]:\n                self.city_combo.addItem(city, zone)\n        self._update_zone()\n\n    def _update_zone(self):\n        self.zone_label.setText(self.city_combo.currentData() or \"\")\n\n    def result_partner(self) -> Partner:\n        return Partner(\n            name=self.name_edit.text().strip() or self.city_combo.currentText(),\n            country_code=self.country_combo.currentData(),\n            city=self.city_combo.currentText(),\n            zone=self.city_combo.currentData(),\n            work_start=self.start_edit.time().toString(\"HH:mm\"),\n            work_end=self.end_edit.time().toString(\"HH:mm\"),\n            lang=self.lang_combo.currentData() or \"\",\n        )\n\n\n# ----------------------------------------------------------------------\n# Own-settings overlay card\n# ----------------------------------------------------------------------\n\nclass OwnSettingsDialog(QDialog):\n    def __init__(self, lang: str, own: OwnSettings, parent=None):\n        super().__init__(parent)\n        self.lang = lang\n        self.setWindowTitle(i18n.t(lang, \"own_group\"))\n        self.setModal(True)\n        form = QFormLayout(self)\n        self.country_combo = QComboBox()\n        for c in master.COUNTRIES:\n            self.country_combo.addItem(f\"{c['name']} ({c['code']})\",\n                                       c[\"code\"])\n        idx = self.country_combo.findData(own.country_code)\n        self.country_combo.setCurrentIndex(max(idx, 0))\n        form.addRow(i18n.t(lang, \"own_country\"), self.country_combo)\n\n        self.zone_combo = QComboBox()\n        self.zone_combo.setEditable(True)\n        for z in sorted(available_timezones()):\n            self.zone_combo.addItem(z)\n        zidx = self.zone_combo.findText(own.zone)\n        if zidx >= 0:\n            self.zone_combo.setCurrentIndex(zidx)\n        else:\n            self.zone_combo.setCurrentText(own.zone)\n        form.addRow(i18n.t(lang, \"own_zone\"), self.zone_combo)\n\n        self.start_edit = QTimeEdit(QTime.fromString(own.work_start, \"HH:mm\"))\n        self.start_edit.setDisplayFormat(\"HH:mm\")\n        self.end_edit = QTimeEdit(QTime.fromString(own.work_end, \"HH:mm\"))\n        self.end_edit.setDisplayFormat(\"HH:mm\")\n        hours = QWidget()\n        hl = QHBoxLayout(hours)\n        hl.setContentsMargins(0, 0, 0, 0)\n        hl.addWidget(self.start_edit)\n        hl.addWidget(QLabel(\"–\"))\n        hl.addWidget(self.end_edit)\n        hl.addStretch(1)\n        form.addRow(i18n.t(lang, \"work_hours\"), hours)\n\n        buttons = QDialogButtonBox(\n            QDialogButtonBox.StandardButton.Ok\n            | QDialogButtonBox.StandardButton.Cancel)\n        buttons.button(QDialogButtonBox.StandardButton.Ok).setText(\n            i18n.t(lang, \"save\"))\n        buttons.button(QDialogButtonBox.StandardButton.Cancel).setText(\n            i18n.t(lang, \"cancel\"))\n        buttons.accepted.connect(self.accept)\n        buttons.rejected.connect(self.reject)\n        form.addRow(buttons)\n\n    def accept(self):\n        zone_name = self.zone_combo.currentText().strip()\n        try:\n            ZoneInfo(zone_name)\n        except Exception:\n            QMessageBox.warning(self, self.windowTitle(),\n                                i18n.t(self.lang, \"invalid_zone\"))\n            return\n        super().accept()\n\n    def result_own(self) -> OwnSettings:\n        return OwnSettings(\n            zone=self.zone_combo.currentText().strip() or \"UTC\",\n            country_code=self.country_combo.currentData() or \"JP\",\n            work_start=self.start_edit.time().toString(\"HH:mm\"),\n            work_end=self.end_edit.time().toString(\"HH:mm\"),\n        )\n\n\n# ----------------------------------------------------------------------\n# One band row: label block + painted band\n# ----------------------------------------------------------------------\n\nclass BandRow(QWidget):\n    edit_clicked = Signal()\n\n    def __init__(self, parent=None):\n        super().__init__(parent)\n        lay = QHBoxLayout(self)\n        lay.setContentsMargins(0, 0, 0, 0)\n        lay.setSpacing(10)\n\n        label_box = QWidget()\n        label_box.setFixedWidth(252)\n        lv = QVBoxLayout(label_box)\n        lv.setContentsMargins(10, 6, 6, 6)\n        lv.setSpacing(1)\n        name_row = QHBoxLayout()\n        self.name_label = QLabel()\n        self.name_label.setStyleSheet(\"font-size: 15px; font-weight: 700;\")\n        name_row.addWidget(self.name_label)\n        name_row.addStretch(1)\n        self.edit_btn = QPushButton()\n        # width follows the label text (e.g. German \"Bearbeiten\"\n        # is much wider than 64px) with 64px as the minimum\n        self.edit_btn.setMinimumWidth(64)\n        self.edit_btn.clicked.connect(self.edit_clicked.emit)\n        name_row.addWidget(self.edit_btn)\n        lv.addLayout(name_row)\n        self.place_label = QLabel()\n        lv.addWidget(self.place_label)\n        time_row = QHBoxLayout()\n        self.time_label = QLabel(\"00:00\")\n        # The clock gets a real font object (not a stylesheet) so it\n        # can carry the tabular-numbers feature: every digit is the\n        # same width and the time never jitters as it changes.\n        self.apply_time_font(\"ja\")\n        time_row.addWidget(self.time_label)\n        self.date_label = QLabel()\n        time_row.addWidget(self.date_label)\n        time_row.addStretch(1)\n        lv.addLayout(time_row)\n        self.status_label = QLabel()\n        # long holiday names wrap instead of being clipped\n        self.status_label.setWordWrap(True)\n        self.status_label.setStyleSheet(\"font-size: 13px; font-weight: 600;\")\n        lv.addWidget(self.status_label)\n        self.dst_label = QLabel()\n        self.dst_label.setWordWrap(True)\n        lv.addWidget(self.dst_label)\n        lv.addStretch(1)\n        lay.addWidget(label_box)\n\n        self.band = bandmod.BandWidget()\n        lay.addWidget(self.band, 1)\n        self.restyle()\n\n    def apply_time_font(self, lang: str):\n        \"\"\"(Re-)set the big clock font for `lang`: Bold (a real face\n        in both bundled families — the old stylesheet asked for\n        weight 800, which neither family ships, so Qt synthesised\n        a smeared fake bold), 30 px, tabular digits, antialiased.\"\"\"\n        self.time_label.setFont(fonts.make_font(\n            lang, pixel_size=30,\n            weight=fonts.ROLE_WEIGHTS[\"heading\"], tabular=True))\n\n    def restyle(self):\n        \"\"\"(Re-)apply the theme-dependent label colours. Called on\n        construction and whenever the theme is toggled.\"\"\"\n        pal = theme.palette()\n        soft = f\"font-size: 12px; color: {pal['SUBINK']};\"\n        self.place_label.setStyleSheet(soft)\n        self.date_label.setStyleSheet(soft)\n        self.dst_label.setStyleSheet(\n            f\"font-size: 12px; color: {pal['WARN_AMBER']};\")\n\n\n# ----------------------------------------------------------------------\n# Main window\n# ----------------------------------------------------------------------\n\nclass MainWindow(QMainWindow):\n    def __init__(self, state: AppState):\n        super().__init__()\n        self.state = state\n        self.lang = state.lang if state.lang in i18n.LANG_CODES else \"ja\"\n        self.theme_name = (state.theme if state.theme in theme.THEME_NAMES\n                           else \"dark\")\n        self._selected = 0 if state.partners else -1\n        self._slots: list[tzcore.Slot] = []\n        self._proposal_dt: tuple[datetime, datetime] | None = None\n        self._partner_rows: list[BandRow] = []\n        self._build_ui()\n        self.retranslate()\n        self.refresh_all()\n\n    # ---------------- construction ----------------\n\n    def _build_ui(self):\n        self.setWindowIcon(QIcon(os.path.join(\n            fonts.assets_dir(), \"icon.png\")))\n        central = QWidget()\n        self.setCentralWidget(central)\n        root = QVBoxLayout(central)\n        root.setContentsMargins(0, 0, 0, 0)\n        root.setSpacing(0)\n\n        # header\n        header = QWidget()\n        header.setObjectName(\"headerBar\")\n        self.header = header\n        hl = QHBoxLayout(header)\n        hl.setContentsMargins(14, 9, 14, 9)\n        icon_label = QLabel()\n        icon_label.setPixmap(QPixmap(os.path.join(\n            fonts.assets_dir(), \"icon.png\")).scaled(\n                30, 30, Qt.AspectRatioMode.KeepAspectRatio,\n                Qt.TransformationMode.SmoothTransformation))\n        hl.addWidget(icon_label)\n        self.title_label = QLabel()\n        hl.addWidget(self.title_label)\n        hl.addStretch(1)\n        self.add_btn = QPushButton()\n        self.add_btn.setProperty(\"class\", \"primary\")\n        self.add_btn.clicked.connect(self._add_partner)\n        hl.addWidget(self.add_btn)\n        self.theme_btn = QPushButton()\n        self.theme_btn.setFixedSize(44, 34)\n        self.theme_btn.setIconSize(QSize(26, 26))\n        self.theme_btn.clicked.connect(self._toggle_theme)\n        hl.addWidget(self.theme_btn)\n        self.lang_combo = QComboBox()\n        for code, name in i18n.LANGS:\n            self.lang_combo.addItem(name, code)\n        self.lang_combo.setCurrentIndex(\n            max(self.lang_combo.findData(self.lang), 0))\n        self.lang_combo.currentIndexChanged.connect(self._on_lang_changed)\n        hl.addWidget(self.lang_combo)\n        root.addWidget(header)\n\n        # cursor controls\n        controls = QWidget()\n        cl = QHBoxLayout(controls)\n        cl.setContentsMargins(14, 10, 14, 2)\n        self.dt_label = QLabel()\n        self.dt_label.setStyleSheet(\"font-size: 15px; font-weight: 700;\")\n        cl.addWidget(self.dt_label)\n        self.dt_edit = QDateTimeEdit(QDateTime.currentDateTime())\n        self.dt_edit.setDisplayFormat(\"yyyy-MM-dd HH:mm\")\n        self.dt_edit.setCalendarPopup(True)\n        self.dt_edit.dateTimeChanged.connect(self._on_dt_changed)\n        cl.addWidget(self.dt_edit)\n        self.now_btn = QPushButton()\n        self.now_btn.clicked.connect(\n            lambda: self.dt_edit.setDateTime(QDateTime.currentDateTime()))\n        cl.addWidget(self.now_btn)\n        cl.addStretch(1)\n        root.addWidget(controls)\n\n        slider_row = QWidget()\n        sl = QHBoxLayout(slider_row)\n        sl.setContentsMargins(14, 0, 14, 6)\n        self.time_slider = QSlider(Qt.Orientation.Horizontal)\n        self.time_slider.setRange(0, 1439)\n        self.time_slider.setValue(\n            QDateTime.currentDateTime().time().hour() * 60\n            + QDateTime.currentDateTime().time().minute())\n        self.time_slider.valueChanged.connect(self._on_slider)\n        sl.addWidget(self.time_slider)\n        root.addWidget(slider_row)\n\n        self.time_warn_label = QLabel()\n        root.addWidget(self.time_warn_label)\n\n        # bands (scrollable)\n        scroll = QScrollArea()\n        scroll.setWidgetResizable(True)\n        scroll.setFrameShape(QScrollArea.Shape.NoFrame)\n        self.bands_host = QWidget()\n        self.bands_layout = QVBoxLayout(self.bands_host)\n        self.bands_layout.setContentsMargins(14, 4, 14, 8)\n        self.bands_layout.setSpacing(10)\n        scroll.setWidget(self.bands_host)\n        root.addWidget(scroll, 1)\n\n        self.own_row = BandRow()\n        self.own_row.edit_btn.clicked.connect(self._edit_own)\n        self.bands_layout.addWidget(self.own_row)\n        self.no_partners_label = QLabel()\n        self.bands_layout.addWidget(self.no_partners_label)\n        self.bands_layout.addStretch(1)\n\n        # candidate chips + proposal\n        bottom = QWidget()\n        bl = QVBoxLayout(bottom)\n        bl.setContentsMargins(14, 2, 14, 12)\n        srow = QHBoxLayout()\n        self.slots_title = QLabel()\n        self.slots_title.setStyleSheet(\"font-size: 15px; font-weight: 700;\")\n        srow.addWidget(self.slots_title)\n        self.slot_date = QDateEdit(QDate.currentDate())\n        self.slot_date.setCalendarPopup(True)\n        self.slot_date.setDisplayFormat(\"yyyy-MM-dd\")\n        srow.addWidget(self.slot_date)\n        self.slot_days = QSpinBox()\n        self.slot_days.setRange(1, 14)\n        self.slot_days.setValue(5)\n        srow.addWidget(self.slot_days)\n        self.slot_duration = QComboBox()\n        for m in (30, 45, 60, 90, 120):\n            self.slot_duration.addItem(f\"{m}\", m)\n        self.slot_duration.setCurrentIndex(2)\n        srow.addWidget(self.slot_duration)\n        self.find_btn = QPushButton()\n        self.find_btn.setProperty(\"class\", \"primary\")\n        self.find_btn.clicked.connect(self.refresh_slots)\n        srow.addWidget(self.find_btn)\n        self.slot_status = QLabel()\n        srow.addWidget(self.slot_status)\n        srow.addStretch(1)\n        bl.addLayout(srow)\n\n        self.chips_host = bandmod.FlowHost()\n        self.chips_layout = self.chips_host.flow()\n        chips_scroll = QScrollArea()\n        chips_scroll.setWidgetResizable(True)\n        chips_scroll.setFrameShape(QScrollArea.Shape.NoFrame)\n        chips_scroll.setFixedHeight(162)\n        chips_scroll.setHorizontalScrollBarPolicy(\n            Qt.ScrollBarPolicy.ScrollBarAlwaysOff)\n        chips_scroll.setWidget(self.chips_host)\n        bl.addWidget(chips_scroll)\n\n        prow = QHBoxLayout()\n        self.proposal_title = QLabel()\n        self.proposal_title.setStyleSheet(\"font-size: 15px; font-weight: 700;\")\n        prow.addWidget(self.proposal_title)\n        self.proposal_lang_combo = QComboBox()\n        self.proposal_lang_combo.addItem(\"Auto\", \"\")\n        for code, name in i18n.LANGS:\n            self.proposal_lang_combo.addItem(name, code)\n        self.proposal_lang_combo.currentIndexChanged.connect(\n            lambda _i: self.refresh_proposal())\n        prow.addWidget(self.proposal_lang_combo)\n        self.copy_btn = QPushButton()\n        self.copy_btn.clicked.connect(self._copy_proposal)\n        prow.addWidget(self.copy_btn)\n        self.copied_label = QLabel()\n        prow.addWidget(self.copied_label)\n        prow.addStretch(1)\n        bl.addLayout(prow)\n        self.proposal_edit = QTextEdit()\n        self.proposal_edit.setMinimumHeight(104)\n        self.proposal_edit.setMaximumHeight(130)\n        bl.addWidget(self.proposal_edit)\n        root.addWidget(bottom)\n        self._apply_theme_styles()\n\n    # ---------------- theme ----------------\n\n    def _apply_theme_styles(self):\n        \"\"\"(Re-)apply every theme-dependent inline style. The app\n        stylesheet itself is swapped by theme.apply_theme(); the\n        labels below carry per-widget stylesheets, so they are\n        refreshed here on construction and on every toggle.\"\"\"\n        pal = theme.palette()\n        self.header.setStyleSheet(\n            f\"#headerBar {{ background: {pal['HEADER']}; }}\")\n        self.title_label.setStyleSheet(\n            f\"color: {pal['HEADER_INK']}; font-size: 20px;\"\n            \" font-weight: 700;\")\n        self.time_warn_label.setStyleSheet(\n            f\"color: {pal['WARN_AMBER']}; font-size: 13px;\"\n            \"padding: 0 14px 4px 14px;\")\n        self.slot_status.setStyleSheet(f\"color: {pal['SUBINK']};\")\n        self.copied_label.setStyleSheet(f\"color: {pal['OK_GREEN']};\")\n        self.no_partners_label.setStyleSheet(\n            f\"color: {pal['SUBINK']};\")\n        self.theme_btn.setIcon(_theme_icon(self.theme_name))\n        self.theme_btn.setToolTip(i18n.t(self.lang, \"theme_button\"))\n        self.own_row.restyle()\n        for row in self._partner_rows:\n            row.restyle()\n\n    def _toggle_theme(self):\n        \"\"\"One click: swap dark <-> light instantly, in place, and\n        remember the choice for the next launch.\"\"\"\n        self.theme_name = (\"light\" if self.theme_name == \"dark\"\n                           else \"dark\")\n        self.state.theme = self.theme_name\n        theme.apply_theme(QApplication.instance(), self.theme_name)\n        self._save()\n        self._apply_theme_styles()\n        self.refresh_bands()\n        self.refresh_slots()\n        self._settle_layout()\n\n    # ---------------- helpers ----------------\n\n    def _own(self) -> OwnSettings:\n        return self.state.own\n\n    def _instant(self) -> datetime:\n        own = self._own()\n        qdt = self.dt_edit.dateTime()\n        naive = datetime(qdt.date().year(), qdt.date().month(),\n                         qdt.date().day(), qdt.time().hour(),\n                         qdt.time().minute())\n        try:\n            zone = ZoneInfo(own.zone)\n        except Exception:\n            zone = ZoneInfo(\"UTC\")\n        return naive.replace(tzinfo=zone)\n\n    def _save(self):\n        self.state.lang = self.lang\n        tzcore.save_state(self.state)\n\n    def _selected_partner(self) -> Partner | None:\n        if 0 <= self._selected < len(self.state.partners):\n            return self.state.partners[self._selected]\n        return None\n\n    # ---------------- refresh ----------------\n\n    def _settle_layout(self):\n        \"\"\"Force the window layout to recompute now. Rebuilding the\n        band rows / chips (or flipping the layout direction for RTL\n        languages) invalidates layouts; without this, one frame can\n        be painted with stale, compressed geometry.\"\"\"\n        lay = self.centralWidget().layout()\n        if lay is not None:\n            lay.activate()\n\n    def refresh_all(self):\n        self._rebuild_partner_rows()\n        self.refresh_bands()\n        self.refresh_slots()\n        self.refresh_proposal()\n        self._settle_layout()\n\n    def _rebuild_partner_rows(self):\n        for row in self._partner_rows:\n            self.bands_layout.removeWidget(row)\n            row.hide()  # never paint a ghost while deletion pends\n            row.setParent(None)\n            row.deleteLater()\n        self._partner_rows = []\n        # insert after own_row (index 1..), before hint/stretch\n        for idx, _p in enumerate(self.state.partners):\n            row = BandRow()\n            row.apply_time_font(self.lang)\n            row.band.clicked.connect(\n                lambda i=idx: self._select_partner(i))\n            row.edit_btn.clicked.connect(\n                lambda _checked=False, i=idx: self._edit_partner(i))\n            self.bands_layout.insertWidget(1 + idx, row)\n            self._partner_rows.append(row)\n        self.no_partners_label.setVisible(not self.state.partners)\n\n    def _status_for(self, zone_name, country_code, weekend,\n                    work_start, work_end, instant):\n        \"\"\"(local_dt, status_kind, holiday_name, dst_date) for a side.\n        status_kind in {\"ok\", \"outside\", \"weekend\", \"holiday\"}.\"\"\"\n        local = instant.astimezone(ZoneInfo(zone_name))\n        day = local.date()\n        hol = tzcore.holiday_on(country_code, day)\n        weekend = tzcore.is_weekend(weekend, day)\n        in_hours = tzcore._within(day, local, work_start, work_end)\n        if hol:\n            kind = \"holiday\"\n        elif weekend:\n            kind = \"weekend\"\n        elif in_hours:\n            kind = \"ok\"\n        else:\n            kind = \"outside\"\n        dst = tzcore.dst_change_near(zone_name, day, within_days=7)\n        return local, kind, hol, dst\n\n    def _paint_row(self, row: BandRow, name, place, zone_name,\n                   country_code, weekend, work_start, work_end,\n                   instant, selected):\n        local, kind, hol, dst = self._status_for(\n            zone_name, country_code, weekend, work_start, work_end,\n            instant)\n        lang = self.lang\n        row.name_label.setText(name)\n        row.place_label.setText(place)\n        row.time_label.setText(local.strftime(\"%H:%M\"))\n        row.date_label.setText(i18n.fmt_date(local, lang))\n        if kind == \"ok\":\n            text, colour = i18n.t(lang, \"status_ok\"), theme.OK_GREEN\n        elif kind == \"weekend\":\n            text, colour = i18n.t(lang, \"status_weekend\"), theme.BAD_RED\n        elif kind == \"holiday\":\n            text = f\"{i18n.t(lang, 'status_holiday')}: {hol}\"\n            colour = theme.BAD_RED\n        else:\n            text, colour = i18n.t(lang, \"status_outside\"), theme.WARN_AMBER\n        row.status_label.setText(f\"● {text}\")\n        row.status_label.setStyleSheet(\n            f\"font-size: 13px; font-weight: 600; color: {colour};\")\n        row.dst_label.setText(\n            i18n.t(lang, \"dst_warning\", date=dst.strftime(\"%Y-%m-%d\"))\n            if dst else \"\")\n        badge = \"\"\n        if kind == \"holiday\":\n            badge = hol or \"\"\n        elif kind == \"weekend\":\n            badge = i18n.t(lang, \"status_weekend\")\n        row.band.configure(zone_name, work_start, work_end, instant,\n                           dimmed=kind in (\"weekend\", \"holiday\"),\n                           badge=badge, selected=selected)\n        row.edit_btn.setText(i18n.t(lang, \"edit\"))\n\n    def refresh_bands(self):\n        instant = self._instant()\n        own = self._own()\n        # input guidance: nonexistent / duplicated wall times (DST)\n        naive = instant.replace(tzinfo=None)\n        kind = tzcore.classify_local(own.zone, naive)\n        if kind == \"gap\":\n            self.time_warn_label.setText(i18n.t(self.lang, \"time_gap\"))\n        elif kind == \"ambiguous\":\n            self.time_warn_label.setText(\n                i18n.t(self.lang, \"time_ambiguous\"))\n        else:\n            self.time_warn_label.setText(\"\")\n        oc = own.country\n        place = f\"{own.zone} · {oc['name'] if oc else own.country_code}\"\n        self._paint_row(self.own_row, i18n.t(self.lang, \"own_label\"),\n                        place, own.zone, own.country_code, own.weekend,\n                        own.work_start, own.work_end, instant,\n                        selected=False)\n        for idx, partner in enumerate(self.state.partners):\n            if idx >= len(self._partner_rows):\n                break\n            place = (f\"{partner.city}, {partner.country_code} · \"\n                     f\"{partner.zone}\")\n            self._paint_row(self._partner_rows[idx], partner.name, place,\n                            partner.zone, partner.country_code,\n                            partner.weekend, partner.work_start,\n                            partner.work_end, instant,\n                            selected=(idx == self._selected))\n\n    def _select_partner(self, idx: int):\n        self._selected = idx\n        self._proposal_dt = None\n        self.refresh_bands()\n        self.refresh_slots()\n        self.refresh_proposal()\n\n    # ---------------- cursor controls ----------------\n\n    def _on_dt_changed(self, qdt: QDateTime):\n        self.time_slider.blockSignals(True)\n        self.time_slider.setValue(qdt.time().hour() * 60 + qdt.time().minute())\n        self.time_slider.blockSignals(False)\n        self._proposal_dt = None\n        self.refresh_bands()\n        self.refresh_proposal()\n\n    def _on_slider(self, value: int):\n        qdt = self.dt_edit.dateTime()\n        qdt.setTime(QTime(value // 60, value % 60))\n        self.dt_edit.setDateTime(qdt)   # triggers _on_dt_changed\n\n    # ---------------- partners CRUD ----------------\n\n    def _detail_lines(self, partner: Partner) -> list:\n        instant = self._instant()\n        res = tzcore.check_partner(instant, self._own(), partner)\n        lang = self.lang\n        if res.holiday_name:\n            status = f\"{i18n.t(lang, 'status_holiday')}: {res.holiday_name}\"\n        elif res.is_weekend:\n            status = i18n.t(lang, \"status_weekend\")\n        elif res.in_business_hours:\n            status = i18n.t(lang, \"status_ok\")\n        else:\n            status = i18n.t(lang, \"status_outside\")\n        lines = [\n            f\"{partner.name} — {partner.city}, {partner.country_code}\",\n            f\"{i18n.t(lang, 'col_local_time')}: {fmt_dt(res.local_dt, lang)} \"\n            f\"({res.offset_label}, {tzcore.fmt_diff_hours(res.diff_hours)})\",\n            f\"{i18n.t(lang, 'col_status')}: {status}\",\n        ]\n        if res.dst_change_date:\n            lines.append(i18n.t(\n                lang, \"dst_warning\",\n                date=res.dst_change_date.strftime(\"%Y-%m-%d\")))\n        return lines\n\n    def _add_partner(self):\n        dlg = PartnerDialog(self.lang, parent=self)\n        if dlg.exec() == QDialog.DialogCode.Accepted:\n            self.state.partners.append(dlg.result_partner())\n            self._selected = len(self.state.partners) - 1\n            self._save()\n            self.refresh_all()\n\n    def _edit_partner(self, idx: int):\n        if not (0 <= idx < len(self.state.partners)):\n            return\n        partner = self.state.partners[idx]\n        dlg = PartnerDialog(self.lang, partner,\n                            detail_lines=self._detail_lines(partner),\n                            parent=self)\n        if dlg.exec() == QDialog.DialogCode.Accepted:\n            if dlg.delete_requested:\n                del self.state.partners[idx]\n                self._selected = min(self._selected,\n                                     len(self.state.partners) - 1)\n            else:\n                self.state.partners[idx] = dlg.result_partner()\n                self._selected = idx\n            self._save()\n            self.refresh_all()\n\n    def _edit_own(self):\n        dlg = OwnSettingsDialog(self.lang, self._own(), parent=self)\n        if dlg.exec() == QDialog.DialogCode.Accepted:\n            self.state.own = dlg.result_own()\n            self._save()\n            self.refresh_all()\n\n    # ---------------- slots & chips ----------------\n\n    def refresh_slots(self):\n        # clear old chips\n        while self.chips_layout.count():\n            item = self.chips_layout.takeAt(0)\n            if item and item.widget():\n                item.widget().hide()  # no ghost while deletion pends\n                item.widget().deleteLater()\n        self._slots = []\n        partner = self._selected_partner()\n        if partner is None:\n            self.slot_status.setText(i18n.t(self.lang, \"select_partner\"))\n            return\n        qd = self.slot_date.date()\n        start_day = date(qd.year(), qd.month(), qd.day())\n        slots = tzcore.find_candidate_slots(\n            self._own(), partner, start_day, self.slot_days.value(),\n            duration_min=self.slot_duration.currentData(), max_results=24)\n        self._slots = slots\n        for s in slots:\n            text = (f\"{i18n.fmt_chip(s.own_start, self.lang)}\"\n                    f\"–{s.own_end.strftime('%H:%M')}\"\n                    f\"  →  {s.partner_start.strftime('%H:%M')}\"\n                    f\"–{s.partner_end.strftime('%H:%M')}\")\n            chip = QPushButton(text)\n            chip.setProperty(\"class\", \"primary\")\n            # Time strings read left-to-right in every UI language\n            # (same rule as the band axis), even in RTL layouts.\n            chip.setLayoutDirection(Qt.LayoutDirection.LeftToRight)\n            # Size the chip from the real font metrics of the font\n            # it will render with, plus its padding, so the full\n            # text is always visible — no clipping, uniform height.\n            cfont = QFont(chip.font())\n            cfont.setPixelSize(15)\n            cfont.setWeight(QFont.Weight.Bold)\n            fonts.polish_font(cfont, tabular=True)\n            chip.setFont(cfont)\n            text_w = QFontMetrics(cfont).horizontalAdvance(text)\n            chip.setFixedSize(text_w + 48, 44)\n            # the local font-size pins the rendered size to the\n            # measured font (the app stylesheet's button rule would\n            # otherwise override it and clip the text)\n            chip.setStyleSheet(\"font-size: 15px; padding: 6px 16px;\")\n            chip.clicked.connect(\n                lambda _c=False, slot=s: self._chip_clicked(slot))\n            self.chips_layout.addWidget(chip)\n        if slots:\n            self.slot_status.setText(\n                i18n.t(self.lang, \"slot_count\", count=len(slots)))\n        else:\n            self.slot_status.setText(i18n.t(self.lang, \"no_slots\"))\n\n    def _chip_clicked(self, slot: tzcore.Slot):\n        self._proposal_dt = (slot.own_start, slot.partner_start)\n        self.refresh_proposal()\n        self._copy_proposal()\n\n    # ---------------- proposal ----------------\n\n    def refresh_proposal(self):\n        partner = self._selected_partner()\n        if partner is None:\n            self.proposal_edit.setPlainText(\"\")\n            return\n        own = self._own()\n        if self._proposal_dt:\n            own_dt, partner_dt = self._proposal_dt\n        else:\n            own_dt = self._instant()\n            partner_dt = own_dt.astimezone(ZoneInfo(partner.zone))\n        lang = (self.proposal_lang_combo.currentData()\n                or partner.proposal_lang)\n        own_city = own.zone.split(\"/\")[-1].replace(\"_\", \" \")\n        text = i18n.proposal(\n            lang, name=partner.name,\n            own_time=fmt_dt(own_dt, lang), own_city=own_city,\n            partner_time=fmt_dt(partner_dt, lang),\n            partner_city=partner.city)\n        self.proposal_edit.setPlainText(text)\n\n    def _copy_proposal(self):\n        QApplication.clipboard().setText(self.proposal_edit.toPlainText())\n        self.copied_label.setText(i18n.t(self.lang, \"copied\"))\n\n    # ---------------- language ----------------\n\n    def _on_lang_changed(self):\n        code = self.lang_combo.currentData()\n        if code and code != self.lang:\n            self.lang = code\n            self._save()\n            self.retranslate()\n            self.refresh_all()\n\n    def retranslate(self):\n        lang = self.lang\n        app = QApplication.instance()\n        fonts.apply_language_font(app, lang)\n        self.own_row.apply_time_font(lang)\n        for row in self._partner_rows:\n            row.apply_time_font(lang)\n        app.setLayoutDirection(\n            Qt.LayoutDirection.RightToLeft if lang in i18n.RTL_LANGS\n            else Qt.LayoutDirection.LeftToRight)\n        self.setWindowTitle(appinfo.display_name(lang))\n        self.title_label.setText(appinfo.display_name(lang))\n        self.add_btn.setText(i18n.t(lang, \"add\"))\n        self.theme_btn.setToolTip(i18n.t(lang, \"theme_button\"))\n        self.dt_label.setText(i18n.t(lang, \"date_time\"))\n        self.now_btn.setText(i18n.t(lang, \"now_button\"))\n        self.slots_title.setText(i18n.t(lang, \"slots_group\"))\n        self.find_btn.setText(i18n.t(lang, \"find_slots\"))\n        self.proposal_title.setText(i18n.t(lang, \"proposal_group\"))\n        self.copy_btn.setText(i18n.t(lang, \"copy_button\"))\n        self.copied_label.setText(\"\")\n        self.no_partners_label.setText(i18n.t(lang, \"no_partners\"))\n\n\ndef main() -> int:\n    app = QApplication(sys.argv)\n    state = tzcore.load_state()\n    theme.apply_theme(app, state.theme)\n    fonts.apply_language_font(app, \"ja\")\n    win = MainWindow(state)\n    win.resize(1280, 880)\n    win.show()\n    return app.exec()\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"p": "appinfo.py", "s": 839, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Centralised app identity for the timezone / business-hours checker.\n\nThe display name lives ONLY here. Other modules must import from this\nfile and must not hard-code the display name elsewhere.\n\nFORMAL NAME: \"GlobalHours\" (decided by the user on 2026-11-15).\nThe idea-sheet name \"TimeZone Guard\" must NOT be used (same-name\nproducts exist). File names and the EXE name keep the ASCII form in\nFILE_BASE.\n\"\"\"\n\nAPP_ID = \"GlobalHours\"\nFILE_BASE = \"GlobalHours\"\nAPP_NAME_EN = \"GlobalHours\"\nAPP_NAME_JA = \"タイムゾーン・営業時間チェッカー\"\nVERSION = \"1.0.0\"\n\n\ndef display_name(lang: str) -> str:\n    \"\"\"Return the localised display name for *lang*.\n\n    Japanese uses the Japanese name; every other language uses English.\n    \"\"\"\n    if lang == \"ja\":\n        return APP_NAME_JA\n    return APP_NAME_EN\n"}, {"p": "assets/check-off-dis-lt.png", "s": 900, "b": 1}, {"p": "assets/check-off-dis.png", "s": 871, "b": 1}, {"p": "assets/check-off-hover-lt.png", "s": 870, "b": 1}, {"p": "assets/check-off-hover.png", "s": 820, "b": 1}, {"p": "assets/check-off-lt.png", "s": 842, "b": 1}, {"p": "assets/check-off.png", "s": 842, "b": 1}, {"p": "assets/check-on-dis-lt.png", "s": 1421, "b": 1}, {"p": "assets/check-on-dis.png", "s": 1357, "b": 1}, {"p": "assets/check-on-hover-lt.png", "s": 1470, "b": 1}, {"p": "assets/check-on-hover.png", "s": 1470, "b": 1}, {"p": "assets/check-on-lt.png", "s": 1448, "b": 1}, {"p": "assets/check-on.png", "s": 1448, "b": 1}, {"p": "assets/chevron-down-hot-lt.png", "s": 1195, "b": 1}, {"p": "assets/chevron-down-hot.png", "s": 1118, "b": 1}, {"p": "assets/chevron-down-lt.png", "s": 1194, "b": 1}, {"p": "assets/chevron-down.png", "s": 1287, "b": 1}, {"p": "assets/icon.icns", "s": 334600, "b": 1}, {"p": "assets/icon.ico", "s": 64907, "b": 1}, {"p": "assets/icon.png", "s": 138892, "b": 1}, {"p": "bands.py", "s": 11079, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"World-time band widgets for GlobalHours.\n\nBandWidget paints one 24-hour band for a timezone: a night -> dawn\n-> day -> dusk -> night gradient for the local day, the business\nhours as a glowing amber segment, and a shared vertical cursor at\nthe currently selected instant. Weekend / holiday bands are dimmed\nand carry a badge.\n\nColours come from the active theme (theme.palette()) at paint\ntime, so the one-click dark/light switch repaints every band in\nplace. The weekend/holiday veil is painted BEFORE the hour ticks,\nthe cursor and the badge, so those stay bright and readable on a\ndimmed band; the badge text itself uses the theme's high-contrast\nbadge colours and is elided to always fit inside the band.\n\nRTL note: the band's internal time axis is ALWAYS drawn 00:00 on\nthe left to 24:00 on the right, in every UI language including\nArabic. A time band is a map-like timeline: keeping one fixed\ndirection lets the eye compare stacked bands and follow the shared\ncursor. Qt's RTL mirroring still applies to the surrounding layout\n(labels, buttons), only the painted timeline keeps its direction.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom datetime import datetime\nfrom zoneinfo import ZoneInfo\n\nfrom PySide6.QtCore import QPoint, QRect, QRectF, QSize, Qt, Signal\nfrom PySide6.QtGui import (\n    QColor, QFont, QLinearGradient, QPainter, QPainterPath, QPen,\n)\nfrom PySide6.QtWidgets import QLayout, QSizePolicy, QWidget\n\nimport fonts\nimport theme\n\n\ndef _rgba(spec) -> QColor:\n    if isinstance(spec, str):\n        return QColor(spec)\n    return QColor(*spec)\n\n\ndef _minutes(hhmm: str) -> int:\n    hh, mm = hhmm.split(\":\")\n    return int(hh) * 60 + int(mm)\n\n\nclass BandWidget(QWidget):\n    \"\"\"One painted 24-hour band. Clicking selects it.\"\"\"\n\n    clicked = Signal()\n\n    def __init__(self, parent=None):\n        super().__init__(parent)\n        self.setMinimumHeight(84)\n        self.setSizePolicy(QSizePolicy.Policy.Expanding,\n                           QSizePolicy.Policy.Fixed)\n        self._zone = ZoneInfo(\"UTC\")\n        self._work_start = \"09:00\"\n        self._work_end = \"18:00\"\n        self._instant: datetime | None = None\n        self._dimmed = False\n        self._badge = \"\"\n        self._selected = False\n        self.setCursor(Qt.CursorShape.PointingHandCursor)\n\n    # -- configuration ------------------------------------------------\n    def configure(self, zone_name: str, work_start: str, work_end: str,\n                  instant: datetime, dimmed: bool, badge: str,\n                  selected: bool):\n        self._zone = ZoneInfo(zone_name)\n        self._work_start = work_start\n        self._work_end = work_end\n        self._instant = instant\n        self._dimmed = dimmed\n        self._badge = badge\n        self._selected = selected\n        self.update()\n\n    def mousePressEvent(self, event):  # noqa: N802 (Qt naming)\n        self.clicked.emit()\n        super().mousePressEvent(event)\n\n    # -- painting ------------------------------------------------------\n    def paintEvent(self, event):  # noqa: N802 (Qt naming)\n        pal = theme.palette()\n        amber = QColor(pal[\"BAND_AMBER\"])\n        amber_light = QColor(pal[\"BAND_AMBER_LIGHT\"])\n        amber_deep = QColor(pal[\"BAND_AMBER_DEEP\"])\n        p = QPainter(self)\n        p.setRenderHint(QPainter.RenderHint.Antialiasing)\n        p.setRenderHint(QPainter.RenderHint.TextAntialiasing)\n        rect = QRectF(self.rect()).adjusted(1, 1, -1, -1)\n        radius = 12.0\n        path = QPainterPath()\n        path.addRoundedRect(rect, radius, radius)\n        p.save()\n        p.setClipPath(path)\n\n        # day gradient (stops from the active theme)\n        grad = QLinearGradient(rect.left(), 0, rect.right(), 0)\n        for hour, colour in pal[\"BAND_STOPS\"]:\n            grad.setColorAt(hour / 24.0, QColor(colour))\n        p.fillRect(rect, grad)\n\n        w = rect.width()\n        def x_of(minutes: float) -> float:\n            return rect.left() + w * (minutes / 1440.0)\n\n        # business-hours segment (glowing amber)\n        s_min = _minutes(self._work_start)\n        e_min = _minutes(self._work_end)\n        seg = QRectF(x_of(s_min), rect.top() + 10,\n                     x_of(e_min) - x_of(s_min), rect.height() - 26)\n        for grow, alpha in ((7, 36), (4, 60), (2, 90)):\n            glow = QColor(amber)\n            glow.setAlpha(alpha)\n            p.setPen(Qt.PenStyle.NoPen)\n            p.setBrush(glow)\n            p.drawRoundedRect(seg.adjusted(-grow, -grow, grow, grow),\n                              10, 10)\n        seg_grad = QLinearGradient(0, seg.top(), 0, seg.bottom())\n        seg_grad.setColorAt(0.0, amber_light)\n        seg_grad.setColorAt(0.5, amber)\n        seg_grad.setColorAt(1.0, amber_deep)\n        p.setBrush(seg_grad)\n        p.setPen(Qt.PenStyle.NoPen)\n        p.drawRoundedRect(seg, 8, 8)\n        if pal[\"BAND_SEG_PEN\"] is not None:\n            # light theme: an outline keeps the segment clearly\n            # delimited on the bright sky gradient\n            p.setBrush(Qt.BrushStyle.NoBrush)\n            p.setPen(QPen(_rgba(pal[\"BAND_SEG_PEN\"]), 1.2))\n            p.drawRoundedRect(seg, 8, 8)\n\n        # dim for weekend / holiday — painted now, BEFORE the ticks,\n        # cursor and badge, so those stay bright and readable\n        if self._dimmed:\n            p.fillRect(rect, _rgba(pal[\"BAND_DIM\"]))\n\n        # hour ticks + labels (0, 3, 6 ... 24) along the bottom\n        tick_pen = _rgba(pal[\"BAND_TICK\"])\n        tick_text = _rgba(pal[\"BAND_TICK_TEXT\"])\n        p.setPen(QPen(tick_pen, 1))\n        font = QFont(self.font())\n        font.setPointSizeF(9.0)\n        fonts.polish_font(font, tabular=True)\n        p.setFont(font)\n        for hour in range(25):\n            x = x_of(hour * 60)\n            p.drawLine(int(x), int(rect.bottom() - 12),\n                       int(x), int(rect.bottom() - (16 if hour % 3 == 0 else 13)))\n            if hour % 3 == 0:\n                p.setPen(tick_text)\n                label = str(hour)\n                tw = p.fontMetrics().horizontalAdvance(label)\n                p.drawText(int(x - tw / 2), int(rect.bottom() - 1), label)\n                p.setPen(QPen(tick_pen, 1))\n\n        # shared cursor at the selected instant (local time here)\n        if self._instant is not None:\n            local = self._instant.astimezone(self._zone)\n            mins = local.hour * 60 + local.minute + local.second / 60.0\n            x = x_of(mins)\n            glow = QColor(amber)\n            glow.setAlpha(90)\n            p.setPen(QPen(glow, 5))\n            p.drawLine(int(x), int(rect.top()), int(x), int(rect.bottom()))\n            p.setPen(QPen(QColor(\"#FFFFFF\"), 2))\n            p.drawLine(int(x), int(rect.top()), int(x), int(rect.bottom()))\n            p.setPen(Qt.PenStyle.NoPen)\n            p.setBrush(amber)\n            p.drawEllipse(QPoint(int(x), int(rect.top() + 7)), 5, 5)\n\n        p.restore()\n\n        # badge (holiday name / weekend) at the top-right of the band.\n        # High-contrast pill; the text is elided so it can never\n        # spill outside the band, however long the holiday name is.\n        if self._badge:\n            font = QFont(self.font())\n            font.setPointSizeF(10.5)\n            font.setBold(True)\n            fonts.polish_font(font)\n            p.setFont(font)\n            fm = p.fontMetrics()\n            max_text_w = max(40.0, rect.width() - 30)\n            text = fm.elidedText(self._badge,\n                                 Qt.TextElideMode.ElideRight,\n                                 int(max_text_w))\n            tw = fm.horizontalAdvance(text)\n            badge = QRectF(max(rect.left() + 6,\n                               rect.right() - tw - 18),\n                           rect.top() + 5, tw + 14, 25)\n            p.setPen(Qt.PenStyle.NoPen)\n            p.setBrush(_rgba(pal[\"BAND_BADGE_BG\"]))\n            p.drawRoundedRect(badge, 10, 10)\n            p.setPen(_rgba(pal[\"BAND_BADGE_TEXT_DIM\"]) if self._dimmed\n                     else _rgba(pal[\"BAND_BADGE_TEXT\"]))\n            p.drawText(badge, Qt.AlignmentFlag.AlignCenter, text)\n\n        # frame / selection\n        p.setBrush(Qt.BrushStyle.NoBrush)\n        if self._selected:\n            p.setPen(QPen(amber, 2.5))\n        else:\n            p.setPen(QPen(QColor(pal[\"BAND_FRAME\"]), 1.2))\n        p.drawRoundedRect(rect, radius, radius)\n        p.end()\n\n\nclass FlowHost(QWidget):\n    \"\"\"Host widget that reports height-for-width from its FlowLayout,\n    so the chips area wraps and sizes correctly inside a QVBoxLayout.\"\"\"\n\n    def __init__(self, parent=None):\n        super().__init__(parent)\n        self._flow = FlowLayout(self, spacing=10)\n\n    def flow(self) -> \"FlowLayout\":\n        return self._flow\n\n    def hasHeightForWidth(self):  # noqa: N802\n        return True\n\n    def heightForWidth(self, width):  # noqa: N802\n        return self._flow.heightForWidth(width)\n\n\nclass FlowLayout(QLayout):\n    \"\"\"Simple wrapping layout for the candidate-slot chips.\"\"\"\n\n    def __init__(self, parent=None, margin=0, spacing=10):\n        super().__init__(parent)\n        self.setContentsMargins(margin, margin, margin, margin)\n        self._spacing = spacing\n        self._items = []\n\n    def addItem(self, item):  # noqa: N802\n        self._items.append(item)\n\n    def count(self):\n        return len(self._items)\n\n    def itemAt(self, index):  # noqa: N802\n        return self._items[index] if 0 <= index < len(self._items) else None\n\n    def takeAt(self, index):  # noqa: N802\n        return self._items.pop(index) if 0 <= index < len(self._items) else None\n\n    def expandingDirections(self):  # noqa: N802\n        return Qt.Orientation(0)\n\n    def hasHeightForWidth(self):  # noqa: N802\n        return True\n\n    def heightForWidth(self, width):  # noqa: N802\n        return self._do_layout(QRect(0, 0, width, 0), test_only=True)\n\n    def setGeometry(self, rect):  # noqa: N802\n        super().setGeometry(rect)\n        self._do_layout(rect, test_only=False)\n\n    def sizeHint(self):  # noqa: N802\n        return self.minimumSize()\n\n    def minimumSize(self):  # noqa: N802\n        size = QSize()\n        for item in self._items:\n            size = size.expandedTo(item.minimumSize())\n        m = self.contentsMargins()\n        size += QSize(m.left() + m.right(), m.top() + m.bottom())\n        return size\n\n    def _do_layout(self, rect, test_only):\n        m = self.contentsMargins()\n        eff = rect.adjusted(m.left(), m.top(), -m.right(), -m.bottom())\n        x, y, line_height = eff.x(), eff.y(), 0\n        for item in self._items:\n            hint = item.sizeHint()\n            next_x = x + hint.width() + self._spacing\n            if next_x - self._spacing > eff.right() and line_height > 0:\n                x = eff.x()\n                y += line_height + self._spacing\n                next_x = x + hint.width() + self._spacing\n                line_height = 0\n            if not test_only:\n                item.setGeometry(QRect(QPoint(x, y), hint))\n            x = next_x\n            line_height = max(line_height, hint.height())\n        return y + line_height - rect.y() + m.bottom()\n"}, {"p": "data.py", "s": 9743, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Country / city master data for GlobalHours.\n\nEach country entry:\n  code     ISO 3166-1 alpha-2 (also the `holidays` library code)\n  name     English display name\n  lang     default proposal-template language (one of the 13 UI\n           languages; falls back to \"en\")\n  weekend  tuple of Python weekday numbers (Mon=0 .. Sun=6) that are\n           non-working weekend days in that country\n  cities   list of (city name, IANA timezone name)\n\nThe list covers the major business countries. All timezone maths is\ndone with zoneinfo + tzdata and all holiday lookups with the bundled\n`holidays` data, so everything works fully offline.\n\"\"\"\n\nWEEKEND_SAT_SUN = (5, 6)\nWEEKEND_FRI_SAT = (4, 5)\n\nCOUNTRIES = [\n    # --- Asia-Pacific ---\n    {\"code\": \"JP\", \"name\": \"Japan\", \"lang\": \"ja\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Tokyo\", \"Asia/Tokyo\"), (\"Osaka\", \"Asia/Tokyo\")]},\n    {\"code\": \"KR\", \"name\": \"South Korea\", \"lang\": \"ko\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Seoul\", \"Asia/Seoul\")]},\n    {\"code\": \"CN\", \"name\": \"China\", \"lang\": \"zh\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Shanghai\", \"Asia/Shanghai\"), (\"Beijing\", \"Asia/Shanghai\"),\n                (\"Shenzhen\", \"Asia/Shanghai\")]},\n    {\"code\": \"HK\", \"name\": \"Hong Kong\", \"lang\": \"zh\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Hong Kong\", \"Asia/Hong_Kong\")]},\n    {\"code\": \"TW\", \"name\": \"Taiwan\", \"lang\": \"zh\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Taipei\", \"Asia/Taipei\")]},\n    {\"code\": \"SG\", \"name\": \"Singapore\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Singapore\", \"Asia/Singapore\")]},\n    {\"code\": \"MY\", \"name\": \"Malaysia\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Kuala Lumpur\", \"Asia/Kuala_Lumpur\")]},\n    {\"code\": \"ID\", \"name\": \"Indonesia\", \"lang\": \"id\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Jakarta\", \"Asia/Jakarta\"), (\"Denpasar (Bali)\", \"Asia/Makassar\"),\n                (\"Surabaya\", \"Asia/Jakarta\")]},\n    {\"code\": \"TH\", \"name\": \"Thailand\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Bangkok\", \"Asia/Bangkok\")]},\n    {\"code\": \"VN\", \"name\": \"Vietnam\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Ho Chi Minh City\", \"Asia/Ho_Chi_Minh\"), (\"Hanoi\", \"Asia/Ho_Chi_Minh\")]},\n    {\"code\": \"PH\", \"name\": \"Philippines\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Manila\", \"Asia/Manila\")]},\n    {\"code\": \"IN\", \"name\": \"India\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Mumbai\", \"Asia/Kolkata\"), (\"Delhi\", \"Asia/Kolkata\"),\n                (\"Bengaluru\", \"Asia/Kolkata\")]},\n    {\"code\": \"PK\", \"name\": \"Pakistan\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Karachi\", \"Asia/Karachi\")]},\n    {\"code\": \"BD\", \"name\": \"Bangladesh\", \"lang\": \"en\", \"weekend\": WEEKEND_FRI_SAT,\n     \"cities\": [(\"Dhaka\", \"Asia/Dhaka\")]},\n    {\"code\": \"NP\", \"name\": \"Nepal\", \"lang\": \"en\", \"weekend\": (5,),\n     \"cities\": [(\"Kathmandu\", \"Asia/Kathmandu\")]},\n    {\"code\": \"IR\", \"name\": \"Iran\", \"lang\": \"en\", \"weekend\": (4,),\n     \"cities\": [(\"Tehran\", \"Asia/Tehran\")]},\n    {\"code\": \"AU\", \"name\": \"Australia\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Sydney\", \"Australia/Sydney\"), (\"Melbourne\", \"Australia/Melbourne\"),\n                (\"Brisbane\", \"Australia/Brisbane\"), (\"Perth\", \"Australia/Perth\"),\n                (\"Adelaide\", \"Australia/Adelaide\")]},\n    {\"code\": \"NZ\", \"name\": \"New Zealand\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Auckland\", \"Pacific/Auckland\"), (\"Wellington\", \"Pacific/Auckland\")]},\n    # --- Europe ---\n    {\"code\": \"GB\", \"name\": \"United Kingdom\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"London\", \"Europe/London\"), (\"Edinburgh\", \"Europe/London\")]},\n    {\"code\": \"IE\", \"name\": \"Ireland\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Dublin\", \"Europe/Dublin\")]},\n    {\"code\": \"FR\", \"name\": \"France\", \"lang\": \"fr\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Paris\", \"Europe/Paris\"), (\"Lyon\", \"Europe/Paris\")]},\n    {\"code\": \"DE\", \"name\": \"Germany\", \"lang\": \"de\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Berlin\", \"Europe/Berlin\"), (\"Munich\", \"Europe/Berlin\"),\n                (\"Frankfurt\", \"Europe/Berlin\"), (\"Hamburg\", \"Europe/Berlin\")]},\n    {\"code\": \"IT\", \"name\": \"Italy\", \"lang\": \"it\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Rome\", \"Europe/Rome\"), (\"Milan\", \"Europe/Rome\")]},\n    {\"code\": \"ES\", \"name\": \"Spain\", \"lang\": \"es\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Madrid\", \"Europe/Madrid\"), (\"Barcelona\", \"Europe/Madrid\")]},\n    {\"code\": \"PT\", \"name\": \"Portugal\", \"lang\": \"pt\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Lisbon\", \"Europe/Lisbon\"), (\"Porto\", \"Europe/Lisbon\")]},\n    {\"code\": \"NL\", \"name\": \"Netherlands\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Amsterdam\", \"Europe/Amsterdam\"), (\"Rotterdam\", \"Europe/Amsterdam\")]},\n    {\"code\": \"BE\", \"name\": \"Belgium\", \"lang\": \"fr\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Brussels\", \"Europe/Brussels\")]},\n    {\"code\": \"CH\", \"name\": \"Switzerland\", \"lang\": \"de\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Zurich\", \"Europe/Zurich\"), (\"Geneva\", \"Europe/Zurich\")]},\n    {\"code\": \"AT\", \"name\": \"Austria\", \"lang\": \"de\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Vienna\", \"Europe/Vienna\")]},\n    {\"code\": \"PL\", \"name\": \"Poland\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Warsaw\", \"Europe/Warsaw\"), (\"Krakow\", \"Europe/Warsaw\")]},\n    {\"code\": \"CZ\", \"name\": \"Czechia\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Prague\", \"Europe/Prague\")]},\n    {\"code\": \"HU\", \"name\": \"Hungary\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Budapest\", \"Europe/Budapest\")]},\n    {\"code\": \"SE\", \"name\": \"Sweden\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Stockholm\", \"Europe/Stockholm\")]},\n    {\"code\": \"NO\", \"name\": \"Norway\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Oslo\", \"Europe/Oslo\")]},\n    {\"code\": \"DK\", \"name\": \"Denmark\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Copenhagen\", \"Europe/Copenhagen\")]},\n    {\"code\": \"FI\", \"name\": \"Finland\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Helsinki\", \"Europe/Helsinki\")]},\n    {\"code\": \"GR\", \"name\": \"Greece\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Athens\", \"Europe/Athens\")]},\n    {\"code\": \"TR\", \"name\": \"Turkiye\", \"lang\": \"tr\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Istanbul\", \"Europe/Istanbul\"), (\"Ankara\", \"Europe/Istanbul\")]},\n    {\"code\": \"RU\", \"name\": \"Russia\", \"lang\": \"ru\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Moscow\", \"Europe/Moscow\"), (\"Yekaterinburg\", \"Asia/Yekaterinburg\"),\n                (\"Novosibirsk\", \"Asia/Novosibirsk\"), (\"Vladivostok\", \"Asia/Vladivostok\")]},\n    {\"code\": \"UA\", \"name\": \"Ukraine\", \"lang\": \"ru\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Kyiv\", \"Europe/Kyiv\")]},\n    # --- Middle East & Africa ---\n    {\"code\": \"IL\", \"name\": \"Israel\", \"lang\": \"en\", \"weekend\": WEEKEND_FRI_SAT,\n     \"cities\": [(\"Tel Aviv\", \"Asia/Jerusalem\")]},\n    {\"code\": \"AE\", \"name\": \"United Arab Emirates\", \"lang\": \"ar\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Dubai\", \"Asia/Dubai\"), (\"Abu Dhabi\", \"Asia/Dubai\")]},\n    {\"code\": \"SA\", \"name\": \"Saudi Arabia\", \"lang\": \"ar\", \"weekend\": WEEKEND_FRI_SAT,\n     \"cities\": [(\"Riyadh\", \"Asia/Riyadh\")]},\n    {\"code\": \"EG\", \"name\": \"Egypt\", \"lang\": \"ar\", \"weekend\": WEEKEND_FRI_SAT,\n     \"cities\": [(\"Cairo\", \"Africa/Cairo\")]},\n    {\"code\": \"ZA\", \"name\": \"South Africa\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Johannesburg\", \"Africa/Johannesburg\"), (\"Cape Town\", \"Africa/Johannesburg\")]},\n    {\"code\": \"NG\", \"name\": \"Nigeria\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Lagos\", \"Africa/Lagos\")]},\n    {\"code\": \"KE\", \"name\": \"Kenya\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Nairobi\", \"Africa/Nairobi\")]},\n    # --- Americas ---\n    {\"code\": \"US\", \"name\": \"United States\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"New York\", \"America/New_York\"), (\"Chicago\", \"America/Chicago\"),\n                (\"Denver\", \"America/Denver\"), (\"Los Angeles\", \"America/Los_Angeles\"),\n                (\"San Francisco\", \"America/Los_Angeles\"), (\"Seattle\", \"America/Los_Angeles\"),\n                (\"Anchorage\", \"America/Anchorage\"), (\"Honolulu\", \"Pacific/Honolulu\")]},\n    {\"code\": \"CA\", \"name\": \"Canada\", \"lang\": \"en\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Toronto\", \"America/Toronto\"), (\"Montreal\", \"America/Toronto\"),\n                (\"Vancouver\", \"America/Vancouver\"), (\"Calgary\", \"America/Edmonton\")]},\n    {\"code\": \"MX\", \"name\": \"Mexico\", \"lang\": \"es\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Mexico City\", \"America/Mexico_City\"), (\"Cancun\", \"America/Cancun\"),\n                (\"Monterrey\", \"America/Monterrey\")]},\n    {\"code\": \"BR\", \"name\": \"Brazil\", \"lang\": \"pt\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Sao Paulo\", \"America/Sao_Paulo\"), (\"Rio de Janeiro\", \"America/Sao_Paulo\"),\n                (\"Manaus\", \"America/Manaus\")]},\n    {\"code\": \"AR\", \"name\": \"Argentina\", \"lang\": \"es\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Buenos Aires\", \"America/Argentina/Buenos_Aires\")]},\n    {\"code\": \"CL\", \"name\": \"Chile\", \"lang\": \"es\", \"weekend\": WEEKEND_SAT_SUN,\n     \"cities\": [(\"Santiago\", \"America/Santiago\")]},\n]\n\n_BY_CODE = {c[\"code\"]: c for c in COUNTRIES}\n\n\ndef country_by_code(code: str):\n    return _BY_CODE.get(code)\n\n\ndef country_for_zone(zone_name: str):\n    \"\"\"Best-effort country lookup for an IANA zone (used for the\n    user's own location defaults).\"\"\"\n    for c in COUNTRIES:\n        for _city, zone in c[\"cities\"]:\n            if zone == zone_name:\n                return c\n    return None\n"}, {"p": "fonts.py", "s": 5258, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Bundled fonts: Inter (Latin / digits) + Noto Sans JP (Japanese).\n\nThe app ships its own fonts so the UI looks the same (and modern) on\nevery machine instead of depending on whatever the OS happens to\noffer.  Both fonts are SIL OFL 1.1; see fonts/FONTS.txt.\n\nRegistration happens once at startup via QFontDatabase.  The UI font\nis then set per language: Qt walks the family list per glyph, so\nLatin and digits render in Inter while Japanese falls through to\nNoto Sans JP in the same widget.  Arabic keeps Inter for Latin and\nuses a Naskh-style system fallback for Arabic script (the task spec\nallows a system fallback there); Chinese / Korean use the bundled\nfonts first, then the platform's own CJK fonts.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\n\nfrom PySide6.QtGui import QFont, QFontDatabase\n\n_registered = False\n\n# Base UI size.  QSS rules refine per-widget sizes on top of this;\n# the point size only matters where QSS does not set one.\nBASE_POINT_SIZE = 11.0\n\n# Role weights.  Only weights that exist as real faces in BOTH\n# bundled families are used for the roles below: Inter ships\n# Regular / Medium / SemiBold / Bold and Noto Sans JP ships\n# Regular / Medium / Bold.  Asking Qt for a weight with no real\n# face (e.g. 800) makes the engine synthesise a smeared fake bold,\n# so headings use Bold (700) and buttons SemiBold (600 — a real\n# Inter face; Noto Sans JP resolves it to its Bold face).\nROLE_WEIGHTS = {\n    \"body\": QFont.Weight.Normal,        # 400 — labels, body text\n    \"medium\": QFont.Weight.Medium,      # 500 — secondary emphasis\n    \"button\": QFont.Weight.DemiBold,    # 600 — buttons, status\n    \"heading\": QFont.Weight.Bold,       # 700 — headings, clock\n}\n\n_TABULAR_TAG = None\n\n\ndef _tabular_tag():\n    global _TABULAR_TAG\n    if _TABULAR_TAG is None:\n        _TABULAR_TAG = QFont.Tag.fromString(\"tnum\")\n    return _TABULAR_TAG\n\n\ndef polish_font(font: QFont, *, tabular: bool = False) -> QFont:\n    \"\"\"Apply the app-wide rendering-quality settings to `font`:\n    explicit antialiasing (PreferAntialias + PreferQuality, full\n    hinting) instead of the platform default strategy, and — for\n    clocks and time ranges — the OpenType \"tnum\" feature so every\n    digit takes the same width and times line up in columns.\"\"\"\n    font.setStyleStrategy(\n        QFont.StyleStrategy.PreferAntialias\n        | QFont.StyleStrategy.PreferQuality)\n    font.setHintingPreference(QFont.HintingPreference.PreferFullHinting)\n    if tabular:\n        font.setFeature(_tabular_tag(), 1)\n    return font\n\n\ndef make_font(lang: str, *, point_size: float | None = None,\n              pixel_size: int | None = None,\n              weight: QFont.Weight | None = None,\n              tabular: bool = False) -> QFont:\n    \"\"\"Build a polished font on the family stack for `lang`.\"\"\"\n    font = QFont()\n    font.setFamilies(stack_for(lang))\n    if point_size is not None:\n        font.setPointSizeF(point_size)\n    if pixel_size is not None:\n        font.setPixelSize(pixel_size)\n    if weight is not None:\n        font.setWeight(weight)\n    return polish_font(font, tabular=tabular)\n\n_INTER = \"Inter\"\n_NOTO_JP = \"Noto Sans JP\"\n\n# Family stacks per UI language, most-preferred first.  Qt tries each\n# family in order until it finds the glyph it needs.\nSTACKS = {\n    \"ja\": [_INTER, _NOTO_JP, \"Yu Gothic UI\", \"Hiragino Sans\",\n           \"Noto Sans CJK JP\"],\n    \"zh\": [_INTER, _NOTO_JP, \"Microsoft YaHei UI\", \"PingFang SC\",\n           \"Noto Sans CJK SC\"],\n    \"ko\": [_INTER, _NOTO_JP, \"Malgun Gothic\", \"Apple SD Gothic Neo\",\n           \"Noto Sans CJK KR\"],\n    \"ar\": [_INTER, \"Noto Naskh Arabic\", \"Amiri\", \"Segoe UI\", \"Tahoma\"],\n}\nGENERIC_STACK = [_INTER, _NOTO_JP, \"Segoe UI\", \"Hiragino Sans\",\n                 \"Noto Sans CJK JP\", \"Noto Sans CJK SC\",\n                 \"Noto Sans CJK KR\", \"DejaVu Sans\"]\n\n\ndef base_dir() -> str:\n    \"\"\"Directory that holds fonts/ and assets/ (source tree, or the\n    PyInstaller _internal folder when frozen).\"\"\"\n    if getattr(sys, \"frozen\", False):\n        return getattr(sys, \"_MEIPASS\",\n                       os.path.dirname(os.path.abspath(sys.executable)))\n    return os.path.dirname(os.path.abspath(__file__))\n\n\ndef fonts_dir() -> str:\n    return os.path.join(base_dir(), \"fonts\")\n\n\ndef assets_dir() -> str:\n    return os.path.join(base_dir(), \"assets\")\n\n\ndef register_fonts() -> None:\n    \"\"\"Load every bundled font file into Qt (idempotent).\"\"\"\n    global _registered\n    if _registered:\n        return\n    _registered = True\n    folder = fonts_dir()\n    if not os.path.isdir(folder):\n        return\n    for name in sorted(os.listdir(folder)):\n        if name.lower().endswith((\".ttf\", \".otf\", \".ttc\")):\n            # A failed load is not fatal: Qt falls back to system\n            # fonts, which is exactly the old behaviour.\n            QFontDatabase.addApplicationFont(os.path.join(folder, name))\n\n\ndef stack_for(lang: str) -> list:\n    return list(STACKS.get(lang, GENERIC_STACK))\n\n\ndef apply_language_font(app, lang: str) -> None:\n    \"\"\"Set the application font to the stack for `lang`.\"\"\"\n    register_fonts()\n    font = QFont()\n    font.setFamilies(stack_for(lang))\n    font.setPointSizeF(BASE_POINT_SIZE)\n    polish_font(font)\n    app.setFont(font)\n"}, {"p": "fonts/FONTS.txt", "s": 889, "l": "plaintext", "c": "Bundled fonts — attribution and licenses\n=========================================\n\nThis application bundles the following open fonts.  Both are licensed\nunder the SIL Open Font License, Version 1.1 (OFL-1.1); the full\nlicense text for each font is included in this folder.\n\n1. Inter (Regular / Medium / SemiBold / Bold)\n   Copyright (c) 2016 The Inter Project Authors\n   (https://github.com/rsms/inter)\n   Source: official Inter release v4.1 (rsms/inter on GitHub)\n   License file: OFL-Inter.txt\n\n2. Noto Sans JP (Regular / Medium / Bold)\n   Copyright 2014-2021 Adobe (http://www.adobe.com/), with Reserved\n   Font Name 'Source'.  Source is a trademark of Adobe in the United\n   States and/or other countries.\n   Source: official Noto CJK repository (notofonts/noto-cjk on\n   GitHub), Sans/SubsetOTF/JP\n   License file: OFL-NotoSansJP.txt\n\nNo modifications were made to the font files.\n"}, {"p": "fonts/Inter-Bold.ttf", "s": 420428, "b": 1}, {"p": "fonts/Inter-Medium.ttf", "s": 417300, "b": 1}, {"p": "fonts/Inter-Regular.ttf", "s": 411640, "b": 1}, {"p": "fonts/Inter-SemiBold.ttf", "s": 419744, "b": 1}, {"p": "fonts/NotoSansJP-Bold.otf", "s": 4656448, "b": 1}, {"p": "fonts/NotoSansJP-Medium.otf", "s": 4549132, "b": 1}, {"p": "fonts/NotoSansJP-Regular.otf", "s": 4533028, "b": 1}, {"p": "fonts/OFL-Inter.txt", "s": 4380, "l": "plaintext", "c": "Copyright (c) 2016 The Inter Project Authors (https://github.com/rsms/inter)\n\nThis Font Software is licensed under the SIL Open Font License, Version 1.1.\nThis license is copied below, and is also available with a FAQ at:\nhttp://scripts.sil.org/OFL\n\n-----------------------------------------------------------\nSIL OPEN FONT LICENSE Version 1.1 - 26 February 2007\n-------------------------
