              add(\"money\", line_text[s:e], \"money_pattern\", {},\n                    box_for(s, e), (line_y, s))\n\n        # 5. masked -----------------------------------------------------\n        if \"masked\" in enabled_set:\n            for m in _MASKED_RE.finditer(line_text):\n                add(\"masked\", m.group(0), \"mask_chars\", {},\n                    box_for(m.start(), m.end()), (line_y, m.start()))\n\n        # 6. password ---------------------------------------------------\n        if \"password\" in enabled_set:\n            consumed = set()  # word indices already used as a label\n            n = len(line_words)\n            for phrase in _PASSWORD_PHRASES:\n                plen = len(phrase)\n                if plen > n:\n                    continue\n                for i in range(0, n - plen + 1):\n                    if any((i + k) in consumed for k in range(plen)):\n                        continue\n                    ok = True\n                    for k in range(plen):\n                        token = norm_texts[i + k]\n                        if k == plen - 1:\n                            token = token.rstrip(\":\").rstrip(\"：\")\n                        if token != phrase[k]:\n                            ok = False\n                            break\n                    if not ok:\n                        continue\n                    for k in range(plen):\n                        consumed.add(i + k)\n                    label_words = line_words[i:i + plen]\n                    lx = min(int(wd[\"x\"]) for wd in label_words)\n                    ly = min(int(wd[\"y\"]) for wd in label_words)\n                    lxe = max(int(wd[\"x\"]) + int(wd[\"w\"]) for wd in label_words)\n                    lye = max(int(wd[\"y\"]) + int(wd[\"h\"]) for wd in label_words)\n                    lw = lxe - lx\n                    lh = lye - ly\n                    right_words = line_words[i + plen:]\n                    if right_words:\n                        rx = min(int(wd[\"x\"]) for wd in right_words)\n                        ry = min(int(wd[\"y\"]) for wd in right_words)\n                        rxe = max(int(wd[\"x\"]) + int(wd[\"w\"]) for wd in right_words)\n                        rye = max(int(wd[\"y\"]) + int(wd[\"h\"]) for wd in right_words)\n                        box = _clip_box(rx - _PAD, ry - _PAD,\n                                        (rxe + _PAD) - (rx - _PAD),\n                                        (rye + _PAD) - (ry - _PAD),\n                                        img_w, img_h)\n                    else:\n                        est_w = max(160, lw * 3)\n                        est_h = lh\n                        # Stacked layout: if a word sits just below the\n                        # label and roughly under it, the field is most\n                        # likely below (e.g. login forms). Prefer a box\n                        # below the label that covers that content.\n                        below = []\n                        for wd in all_words:\n                            wx = int(wd.get(\"x\", 0)); wy = int(wd.get(\"y\", 0))\n                            wxe = wx + int(wd.get(\"w\", 0)); wye = wy + int(wd.get(\"h\", 0))\n                            if wy < lye - 2:\n                                continue\n                            if wy - lye > max(48, lh * 3):\n                                continue\n                            if wxe < lx - 8 or wx > lxe + 8:\n                                continue\n                            below.append((wx, wy, wxe, wye))\n                        if below:\n                            bx = lx\n                            by = lye + 4\n                            bw = max(est_w, max(b[2] for b in below) - lx + 8)\n                            bh = max(lh + 8, max(b[3] for b in below) - by + 6)\n                            box = _clip_box(bx, by, bw, bh, img_w, img_h)\n                        else:\n                            remaining = (img_w - lxe) if img_w else est_w\n                            if remaining < 40:\n                                # Place below the label with the same size.\n                                box = _clip_box(lx, lye, est_w, est_h, img_w, img_h)\n                            else:\n                                box = _clip_box(lxe, ly, est_w, est_h, img_w, img_h)\n                    label_text = \" \".join(\n                        str(wd.get(\"text\", \"\")) for wd in label_words\n                    )\n                    add(\"password\", label_text, \"password_estimate\", {},\n                        box, (line_y, spans[i][0]))\n\n        # 7. custom -----------------------------------------------------\n        if \"custom\" in enabled_set and custom_norm:\n            for nt in custom_norm:\n                start = 0\n                while True:\n                    idx = line_text.find(nt, start)\n                    if idx < 0:\n                        break\n                    add(\"custom\", line_text[idx:idx + len(nt)], \"custom_term\",\n                        {\"term\": nt}, box_for(idx, idx + len(nt)),\n                        (line_y, idx))\n                    start = idx + max(1, len(nt))\n\n    # De-duplicate: same range + same category -> one candidate.\n    seen = set()\n    uniq = []\n    for item in raw:\n        _, category, _, _, _, x, y, w, h = item\n        key = (category, x, y, w, h)\n        if key in seen:\n            continue\n        seen.add(key)\n        uniq.append(item)\n\n    # Deterministic ordering: by sort key (line top, span start), then\n    # category order, then position.\n    cat_index = {c: i for i, c in enumerate(CATEGORIES)}\n    uniq.sort(key=lambda it: (it[0][0], it[0][1], cat_index.get(it[1], 99), it[5], it[6]))\n\n    candidates: List[Candidate] = []\n    for idx, (_, category, text, reason_key, params, x, y, w, h) in enumerate(uniq, start=1):\n        candidates.append(Candidate(\n            id=idx, category=category, text=text, reason_key=reason_key,\n            reason_params=params, x=int(x), y=int(y), w=int(w), h=int(h),\n        ))\n    return candidates\n"}, {"p": "effects.py", "s": 3892, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Image effects (pixelate / blur / blackout) built on Pillow.\n\nGUI-independent. No display name is hard-coded here.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom PIL import Image, ImageDraw, ImageFilter\n\nEFFECTS = [\"pixelate\", \"blur\", \"blackout\"]\n\n# Blur is FIXED at this strength by design (user decision, 2026-11-15):\n# at low strengths blurred text could still be read back, so the blur\n# effect always uses this level and ignores any strength passed in.\n# The level is the maximum of the UI strength scale (radius 15 px) and\n# was verified by re-OCR: 0 of the planted secrets remained readable.\nBLUR_FIXED_STRENGTH = 10\nBLUR_FIXED_RADIUS = BLUR_FIXED_STRENGTH * 1.5\n\n# Pixelate (mosaic) is likewise FIXED (2026-11-15 design refresh: the\n# strength slider was removed from the UI entirely, so no effect can be\n# weakened by the user). The fixed level equals the former UI default\n# strength 6 (block 14 px). It was chosen by re-OCR verification\n# (quality/verify_pixelate_levels.py, flows A/B/C incl. a small-text\n# image at 14/20 px): 0 of 24 planted secrets remained readable.\nPIXELATE_FIXED_STRENGTH = 6\nPIXELATE_FIXED_BLOCK = 2 + PIXELATE_FIXED_STRENGTH * 2\n\n\ndef _clip_region(x, y, w, h, img_w, img_h):\n    x1 = max(0, int(x))\n    y1 = max(0, int(y))\n    x2 = min(img_w, int(x) + int(w))\n    y2 = min(img_h, int(y) + int(h))\n    if x2 <= x1 or y2 <= y1:\n        return None\n    return x1, y1, x2, y2\n\n\ndef apply_effects(pil_image, items):\n    \"\"\"Return a NEW PIL Image with the effects applied.\n\n    The input image is never modified.\n    items: iterable of (x, y, w, h, effect, strength) tuples.\n    The strength element is accepted for call compatibility but is\n    IGNORED for every effect: blur always uses BLUR_FIXED_STRENGTH and\n    pixelate always uses PIXELATE_FIXED_STRENGTH, so neither can ever\n    be weakened; blackout never used it. Regions are clipped to the\n    image bounds.\n    \"\"\"\n    result = pil_image.copy()\n    if not items:\n        return result\n\n    img_w, img_h = result.size\n\n    for item in items:\n        if item is None:\n            continue\n        x, y, w, h, effect, strength = item\n        if effect not in EFFECTS:\n            raise ValueError(f\"unknown effect: {effect!r}\")\n        try:\n            strength = int(strength)\n        except Exception:\n            strength = 1\n        strength = max(1, min(10, strength))\n\n        region = _clip_region(x, y, w, h, img_w, img_h)\n        if region is None:\n            continue\n        x1, y1, x2, y2 = region\n        rw = x2 - x1\n        rh = y2 - y1\n\n        if effect == \"blackout\":\n            draw = ImageDraw.Draw(result)\n            if result.mode == \"RGBA\":\n                fill = (0, 0, 0, 255)\n            elif result.mode in (\"LA\", \"PA\"):\n                fill = (0, 255)\n            elif result.mode == \"L\":\n                fill = 0\n            else:\n                fill = (0, 0, 0)\n            draw.rectangle([x1, y1, x2 - 1, y2 - 1], fill=fill)\n\n        elif effect == \"pixelate\":\n            # Fixed safe level: the requested strength is deliberately\n            # not honoured (see PIXELATE_FIXED_STRENGTH above).\n            block = PIXELATE_FIXED_BLOCK\n            crop = result.crop((x1, y1, x2, y2))\n            small_w = max(1, rw // block)\n            small_h = max(1, rh // block)\n            small = crop.resize((small_w, small_h), Image.NEAREST)\n            pixelated = small.resize((rw, rh), Image.NEAREST)\n            result.paste(pixelated, (x1, y1))\n\n        elif effect == \"blur\":\n            # Fixed safe level: the requested strength is deliberately\n            # not honoured for blur (see BLUR_FIXED_STRENGTH above).\n            radius = BLUR_FIXED_RADIUS\n            crop = result.crop((x1, y1, x2, y2))\n            blurred = crop.filter(ImageFilter.GaussianBlur(radius=radius))\n            result.paste(blurred, (x1, y1))\n\n    return result\n"}, {"p": "fonts.py", "s": 3131, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Bundled fonts: Inter (Latin / digits) + Noto Sans JP (Japanese).\n\nThe app ships its own fonts so the UI looks the same (and modern) on\nevery machine instead of depending on whatever the OS happens to\noffer.  Both fonts are SIL OFL 1.1; see fonts/FONTS.txt.\n\nRegistration happens once at startup via QFontDatabase.  The UI font\nis then set per language: Qt walks the family list per glyph, so\nLatin and digits render in Inter while Japanese falls through to\nNoto Sans JP in the same widget.  Arabic keeps Inter for Latin and\nuses a Naskh-style system fallback for Arabic script (the task spec\nallows a system fallback there); Chinese / Korean use the bundled\nfonts first, then the platform's own CJK fonts.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\n\nfrom PySide6.QtGui import QFont, QFontDatabase\n\n_registered = False\n\n# Base UI size: 13.5 px equivalents.  QSS rules refine per-widget\n# sizes on top of this; the point size only matters where QSS does\n# not set one.\nBASE_POINT_SIZE = 10.5\n\n_INTER = \"Inter\"\n_NOTO_JP = \"Noto Sans JP\"\n\n# Family stacks per UI language, most-preferred first.  Qt tries each\n# family in order until it finds the glyph it needs.\nSTACKS = {\n    \"ja\": [_INTER, _NOTO_JP, \"Yu Gothic UI\", \"Hiragino Sans\",\n           \"Noto Sans CJK JP\"],\n    \"zh\": [_INTER, _NOTO_JP, \"Microsoft YaHei UI\", \"PingFang SC\",\n           \"Noto Sans CJK SC\"],\n    \"ko\": [_INTER, _NOTO_JP, \"Malgun Gothic\", \"Apple SD Gothic Neo\",\n           \"Noto Sans CJK KR\"],\n    \"ar\": [_INTER, \"Noto Naskh Arabic\", \"Amiri\", \"Segoe UI\", \"Tahoma\"],\n}\nGENERIC_STACK = [_INTER, _NOTO_JP, \"Segoe UI\", \"Hiragino Sans\",\n                 \"Noto Sans CJK JP\", \"Noto Sans CJK SC\",\n                 \"Noto Sans CJK KR\", \"DejaVu Sans\"]\n\n\ndef base_dir() -> str:\n    \"\"\"Directory that holds fonts/ and assets/ (source tree, or the\n    PyInstaller _internal folder when frozen).\"\"\"\n    if getattr(sys, \"frozen\", False):\n        return getattr(sys, \"_MEIPASS\",\n                       os.path.dirname(os.path.abspath(sys.executable)))\n    return os.path.dirname(os.path.abspath(__file__))\n\n\ndef fonts_dir() -> str:\n    return os.path.join(base_dir(), \"fonts\")\n\n\ndef assets_dir() -> str:\n    return os.path.join(base_dir(), \"assets\")\n\n\ndef register_fonts() -> None:\n    \"\"\"Load every bundled font file into Qt (idempotent).\"\"\"\n    global _registered\n    if _registered:\n        return\n    _registered = True\n    folder = fonts_dir()\n    if not os.path.isdir(folder):\n        return\n    for name in sorted(os.listdir(folder)):\n        if name.lower().endswith((\".ttf\", \".otf\", \".ttc\")):\n            # A failed load is not fatal: Qt falls back to system\n            # fonts, which is exactly the old behaviour.\n            QFontDatabase.addApplicationFont(os.path.join(folder, name))\n\n\ndef stack_for(lang: str) -> list:\n    return list(STACKS.get(lang, GENERIC_STACK))\n\n\ndef apply_language_font(app, lang: str) -> None:\n    \"\"\"Set the application font to the stack for `lang`.\"\"\"\n    register_fonts()\n    font = QFont()\n    font.setFamilies(stack_for(lang))\n    font.setPointSizeF(BASE_POINT_SIZE)\n    app.setFont(font)\n"}, {"p": "fonts/FONTS.txt", "s": 889, "l": "plaintext", "c": "Bundled fonts — attribution and licenses\n=========================================\n\nThis application bundles the following open fonts.  Both are licensed\nunder the SIL Open Font License, Version 1.1 (OFL-1.1); the full\nlicense text for each font is included in this folder.\n\n1. Inter (Regular / Medium / SemiBold \"open_image\": \"이미지 열기\", \"paste_image\": \"붙여넣기\", \"add_region\": \"영역 추가\", \"export\": \"내보내기\",\n    \"copy_clipboard\": \"클립보드에 복사\", \"settings\": \"설정\", \"effect\": \"효과\",\n    \"effect_pixelate\": \"모자이크\", \"effect_blur\": \"흐림\", \"effect_blackout\": \"검게 가리기\",\n    \"strength_fixed_note\": \"안전을 위해 효과 강도는 텍스트를 읽을 수 없는 수준으로 고정되어 있으며 변경할 수 없습니다.\", \"candidates\": \"후보\", \"category\": \"카테고리\", \"detected_text\": \"감지된 텍스트\",\n    \"reason\": \"근거\", \"select_all_cat\": \"이 카테고리 전체 켜기/끄기\", \"final_preview\": \"최종 미리보기\",\n    \"confirm_export\": \"확인하고 저장\", \"save_as\": \"다른 이름으로 저장\",\n    \"overwrite_blocked\": \"원본 이미지와 같은 위치에는 저장할 수 없습니다. 원본을 보호하기 위해 다른 이름이나 폴더를 선택하세요.\",\n    \"ocr_unavailable\": \"OCR용 Tesseract를 찾지 못해 자동 감지를 사용할 수 없습니다. 수동으로 영역을 추가해 가릴 수는 있습니다. Mac에서는 Homebrew로 'brew install tesseract'를 실행하세요. Windows에서는 Tesseract OCR을 설치하고 PATH에 추가하거나 앱 옆에 두세요.\",\n    \"custom_terms\": \"기밀 용어(사용자 지정)\", \"add_term\": \"용어 추가\", \"remove_term\": \"용어 삭제\",\n    \"default_settings\": \"기본 설정\", \"cat_email\": \"이메일 주소\", \"cat_phone\": \"전화번호\",\n    \"cat_card\": \"카드 번호\", \"cat_money\": \"금액\", \"cat_password\": \"비밀번호류(추정)\",\n    \"cat_masked\": \"마스킹 문자\", \"cat_custom\": \"사용자 지정 용어\", \"cat_manual\": \"수동 영역\",\n    \"reason_email_pattern\": \"이메일 형식과 일치\", \"reason_phone_pattern\": \"전화번호 형식과 일치\",\n    \"reason_card_luhn_pass\": \"카드 번호 형식이며 Luhn 검사를 통과({digits}자리)\",\n    \"reason_card_luhn_fail\": \"카드 번호처럼 보이지만 Luhn 검사를 통과하지 못함({digits}자리)\",\n    \"reason_money_pattern\": \"금액 형식과 일치\", \"reason_mask_chars\": \"마스킹 문자(●, * 등)가 연속됨\",\n    \"reason_password_estimate\": \"비밀번호 입력란 근처에 있어 추정함(후보)\",\n    \"reason_custom_term\": \"등록한 기밀 용어와 일치\", \"reason_manual\": \"수동으로 추가한 영역\",\n    \"no_image\": \"이미지가 로드되지 않았습니다\", \"drop_hint\": \"여기에 이미지를 드래그 앤 드롭하세요(PNG / JPG / BMP / WebP)\",\n    \"preview_check_message\": \"내보내기 전에 반드시 확인하세요. 가리지 못한 곳은 없나요? 효과가 약해 읽힐 수 있는 곳은 없나요? 문제가 없으면 '확인하고 저장'을 누르세요.\",\n    \"saved\": \"저장했습니다\", \"language\": \"언어\", \"subtitle\": \"스크린샷의 개인정보를 공유 전에 가립니다\",\n    \"open_title\": \"이미지 선택\", \"open_filter\": \"이미지 (*.png *.jpg *.jpeg *.bmp *.webp)\",\n    \"save_title\": \"가린 이미지 저장\", \"cancel\": \"취소\", \"close\": \"닫기\", \"ok\": \"OK\",\n    \"status_ready\": \"이미지를 열거나 붙여넣거나 여기로 드래그하세요\", \"status_loaded\": \"'{name}'을(를) 불러왔습니다(후보 {count}건)\",\n    \"copied\": \"클립보드에 복사했습니다\", \"no_candidates\": \"아직 후보가 없습니다\", \"password_note\": \"후보(추정)\",\n    \"add_region_on\": \"영역 추가: 이미지 위에서 드래그하세요\", \"term_placeholder\": \"가릴 용어를 입력\",\n    \"default_effect\": \"기본 효과\", \"initial_categories\": \"처음에 켤 카테고리\", \"load_error\": \"불러오지 못했습니다: {error}\",\n    \"clipboard_no_image\": \"클립보드에 이미지가 없습니다\", \"delete_hint\": \"Delete 키로 선택한 영역 삭제\",\n    \"candidate_count\": \"후보 {count}건\", \"settings_title\": \"설정\", \"manual_region_text\": \"(수동 영역)\",\n}\n\nSTRINGS = {\n    \"ja\": JA, \"en\": EN, \"es\": ES, \"zh\": ZH, \"fr\": FR, \"de\": DE, \"pt\": PT,\n    \"ru\": RU, \"it\": IT, \"tr\": TR, \"ar\": AR, \"id\": ID, \"ko\": KO,\n}\n\n# Backwards-compatible alias\nTRANSLATIONS = STRINGS\n\n\ndef tr(lang, key, **kw):\n    \"\"\"Translate *key* for *lang*, formatting placeholders from **kw.\"\"\"\n    table = STRINGS.get(lang) or JA\n    text = table.get(key)\n    if text is None:\n        text = JA.get(key, key)\n    if kw:\n        try:\n            return text.format(**kw)\n        except (KeyError, IndexError, ValueError):\n            return text\n    return text\n\n# --- extra keys (async detection progress / oversized image guard) ---\n_EXTRA = {\n    \"ja\": {\"detecting\": \"検出中…\", \"image_too_large\": \"画像が大きすぎるため読み込めませんでした\"},\n    \"en\": {\"detecting\": \"Detecting…\", \"image_too_large\": \"The image is too large to load.\"},\n    \"es\": {\"detecting\": \"Detectando…\", \"image_too_large\": \"La imagen es demasiado grande para cargarla.\"},\n    \"zh\": {\"detecting\": \"正在检测…\", \"image_too_large\": \"图片太大，无法加载。\"},\n    \"fr\": {\"detecting\": \"Détection en cours…\", \"image_too_large\": \"L'image est trop grande pour être chargée.\"},\n    \"de\": {\"detecting\": \"Erkennung läuft…\", \"image_too_large\": \"Das Bild ist zu groß zum Laden.\"},\n    \"pt\": {\"detecting\": \"Detectando…\", \"image_too_large\": \"A imagem é grande demais para carregar.\"},\n    \"ru\": {\"detecting\": \"Идёт обнаружение…\", \"image_too_large\": \"Изображение слишком большое для загрузки.\"},\n    \"it\": {\"detecting\": \"Rilevamento in corso…\", \"image_too_large\": \"L'immagine è troppo grande da caricare.\"},\n    \"tr\": {\"detecting\": \"Algılanıyor…\", \"image_too_large\": \"Görüntü yüklenemeyecek kadar büyük.\"},\n    \"ar\": {\"detecting\": \"جارٍ الكشف…\", \"image_too_large\": \"الصورة كبيرة جدًا بحيث لا يمكن تحميلها.\"},\n    \"id\": {\"detecting\": \"Mendeteksi…\", \"image_too_large\": \"Gambar terlalu besar untuk dimuat.\"},\n    \"ko\": {\"detecting\": \"감지 중…\", \"image_too_large\": \"이미지가 너무 커서 불러올 수 없습니다.\"},\n}\nfor _lang_code, _pairs in _EXTRA.items():\n    STRINGS.setdefault(_lang_code, {}).update(_pairs)\n"}, {"p": "MakeApp-Mac.command", "s": 3285, "l": "bash", "c": "#!/bin/bash\n# Build RedactShot.app for macOS with PyInstaller.\n# A universal2 build is attempted first. If the installed Python or\n# libraries cannot produce universal2, the script retries for this Mac's\n# native CPU architecture and reports which one was built at the end.\n# Tesseract is NOT bundled; on Mac it is resolved separately\n# (e.g. brew install tesseract).\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\ncd \"$SCRIPT_DIR\" || exit 1\n\npause_and_exit() {\n  echo\n  echo \"$1\"\n  echo \"Press Enter to close this window.\"\n  read -r _ || true\n  exit 1\n}\n\nif ! command -v python3 >/dev/null 2>&1; then\n  cat <<'EOF'\nPython 3 was not found.\n\nInstall Python 3.10 or later in either of these ways:\n  1. Download the macOS installer from https://www.python.org/downloads/macos/\n  2. If Homebrew is already installed, run: brew install python\n\nThen double-click MakeApp-Mac.command again.\nEOF\n  pause_and_exit \"Python 3 is required.\"\nfi\n\nPYTHON_BIN=\"$(command -v python3)\"\nif ! \"$PYTHON_BIN\" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' >/dev/null 2>&1; then\n  pause_and_exit \"Python 3.10 or later is required. Please install a current version from python.org.\"\nfi\n\nVENV_DIR=\"$SCRIPT_DIR/.venv\"\nVENV_PY=\"$VENV_DIR/bin/python\"\n\nif [ ! -x \"$VENV_PY\" ]; then\n  echo \"Creating the RedactShot Python environment...\"\n  \"$PYTHON_BIN\" -m venv \"$VENV_DIR\" || pause_and_exit \"Could not create the Python virtual environment.\"\nfi\n\necho \"Installing application and build dependencies...\"\n\"$VENV_PY\" -m pip install --upgrade pip || pause_and_exit \"Could not update pip. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install -r \"$SCRIPT_DIR/requirements.txt\" || pause_and_exit \"Could not install the required Python packages. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install --upgrade pyinstaller || pause_and_exit \"Could not install PyInstaller. Check the network connection and try again.\"\n\nCOMMON_ARGS=(\n  --noconfirm\n  --clean\n  --windowed\n  --name RedactShot --icon assets/icon.icns\n  --add-data \"fonts:fonts\"\n  --add-data \"assets:assets\"\n  --exclude-module tkinter\n  --exclude-module unittest\n  --exclude-module pytest\n)\n\nBUILD_ARCH=\"\"\necho\necho \"Trying a universal2 build for Intel and Apple Silicon Macs...\"\nif \"$VENV_PY\" -m PyInstaller \"${COMMON_ARGS[@]}\" --target-arch universal2 \"$SCRIPT_DIR/app.py\"; then\n  BUILD_ARCH=\"universal2 (Intel and Apple Silicon)\"\nelse\n  echo\n  echo \"The universal2 build did not succeed. Retrying for this Mac's native architecture...\"\n  NATIVE_ARCH=\"$(uname -m)\"\n  if \"$VENV_PY\" -m PyInstaller \"${COMMON_ARGS[@]}\" \"$SCRIPT_DIR/app.py\"; then\n    BUILD_ARCH=\"native ($NATIVE_ARCH)\"\n  else\n    pause_and_exit \"PyInstaller could not build RedactShot.app.\"\n  fi\nfi\n\nAPP_PATH=\"$SCRIPT_DIR/dist/RedactShot.app\"\nif [ ! -d \"$APP_PATH\" ]; then\n  pause_and_exit \"The build finished without creating dist/RedactShot.app.\"\nfi\n\necho\necho \"Build complete.\"\necho \"Created: $APP_PATH\"\necho \"Architecture: $BUILD_ARCH\"\necho\necho \"This app is unsigned. The first time you open it, use Finder:\"\necho \"right-click RedactShot.app, choose Open, and confirm Open.\"\necho \"For OCR, install Tesseract separately with Homebrew:\"\necho \"  brew install tesseract\"\necho\necho \"Press Enter to close this window.\"\nread -r _ || true\n"}, {"p": "ocr.py", "s": 8945, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Local Tesseract OCR wrapper.\n\nGUI-independent. No display name is hard-coded here; the environment\nvariable name below is part of the interface contract, not a display\nname.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport io\nimport os\nimport re\nimport shutil\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nENV_TESSERACT = \"REDACTSHOT_TESSERACT\"\nLEGACY_ENV_TESSERACT = \"BLURSHIELD_TESSERACT\"\n\n\nclass OcrUnavailable(Exception):\n    \"\"\"Raised when no usable Tesseract executable can be found / run.\"\"\"\n\n\n_UI_TO_TESSERACT = {\n    \"ja\": \"jpn\",\n    \"en\": \"eng\",\n    \"es\": \"spa\",\n    \"zh\": \"chi_sim\",\n    \"fr\": \"fra\",\n    \"de\": \"deu\",\n    \"pt\": \"por\",\n    \"ru\": \"rus\",\n    \"it\": \"ita\",\n    \"tr\": \"tur\",\n    \"ar\": \"ara\",\n    \"id\": \"ind\",\n    \"ko\": \"kor\",\n}\n\n\ndef _app_dir() -> Path:\n    return Path(__file__).resolve().parent\n\n\ndef _find_tesseract():\n    \"\"\"Search in contract order; return a path/command string or None.\"\"\"\n    # 1. Environment variable.\n    env_val = os.environ.get(ENV_TESSERACT) or os.environ.get(LEGACY_ENV_TESSERACT)\n    if env_val:\n        env_val = env_val.strip()\n        if env_val:\n            if Path(env_val).exists():\n                return env_val\n            found = shutil.which(env_val)\n            if found:\n                return found\n            # An explicitly configured but missing path is not usable;\n            # fall through to the other locations.\n    # 2. Adjacent bundled binary.\n    app_dir = _app_dir()\n    if os.name == \"nt\" or sys.platform.startswith(\"win\"):\n        adjacent = app_dir / \"tesseract\" / \"tesseract.exe\"\n    else:\n        adjacent = app_dir / \"tesseract\" / \"tesseract\"\n    if adjacent.exists():\n        return str(adjacent)\n    # Also accept the .exe name on any platform (e.g. cross checks).\n    adjacent_exe = app_dir / \"tesseract\" / \"tesseract.exe\"\n    if adjacent_exe.exists():\n        return str(adjacent_exe)\n    # 3. PATH.\n    on_path = shutil.which(\"tesseract\")\n    if on_path:\n        return on_path\n    return None\n\n\ndef _tessdata_prefix():\n    \"\"\"Return the adjacent tessdata directory if one exists, else None.\"\"\"\n    app_dir = _app_dir()\n    candidates = [\n        app_dir / \"tessdata\",\n        app_dir / \"tesseract\" / \"tessdata\",\n    ]\n    for cand in candidates:\n        if cand.is_dir():\n            return str(cand)\n    return None\n\n\ndef languages_for_ui(ui_lang) -> list:\n    \"\"\"Tesseract language list: always jpn+eng, plus the UI language.\"\"\"\n    langs = [\"jpn\", \"eng\"]\n    if ui_lang:\n        primary = str(ui_lang).replace(\"_\", \"-\").split(\"-\")[0].strip().lower()\n        mapped = _UI_TO_TESSERACT.get(primary)\n        # Also allow passing a tesseract code directly.\n        if mapped is None and primary in _UI_TO_TESSERACT.values():\n            mapped = primary\n        if mapped and mapped not in langs:\n            langs.append(mapped)\n    return langs\n\n\ndef _parse_tsv(output: str) -> list:\n    words = []\n    if not output:\n        return words\n    reader = csv.DictReader(io.StringIO(output), delimiter=\"\\t\", quoting=csv.QUOTE_MINIMAL)\n    if reader.fieldnames is None:\n        return words\n    line_id_by_key = {}\n    next_line_id = 0\n    for row in reader:\n        if row is None:\n            continue\n        text = (row.get(\"text\") or \"\")\n        if not text.strip():\n            continue\n        try:\n            conf = float(row.get(\"conf\", -1))\n        except (TypeError, ValueError):\n            continue\n        if conf < 0:\n            continue\n        # Level 5 is a word; if level is present and not 5, skip it.\n        level = row.get(\"level\")\n        if level not in (None, \"\", \"5\"):\n            try:\n                if int(level) != 5:\n                    continue\n            except (TypeError, ValueError):\n                pass\n        try:\n            x = int(float(row.get(\"left\", 0)))\n            y = int(float(row.get(\"top\", 0)))\n            w = int(float(row.get(\"width\", 0)))\n            h = int(float(row.get(\"height\", 0)))\n        except (TypeError, ValueError):\n            continue\n        key = (row.get(\"block_num\"), row.get(\"par_num\"), row.get(\"line_num\"))\n        if key not in line_id_by_key:\n            line_id_by_key[key] = next_line_id\n            next_line_id += 1\n        words.append({\n            \"text\": text,\n            \"x\": x,\n            \"y\": y,\n            \"w\": w,\n            \"h\": h,\n            \"line\": line_id_by_key[key],\n        })\n    return words\n\n\n# ---------------------------------------------------------------------------\n# Post-processing of the raw word list (added after field testing on\n# synthetic screenshots, see quality/REPORT.md):\n#\n# 1. Tesseract frequently splits a contiguous CJK run into several\n#    \"words\" (e.g. a name read as two words, a company name as eight).\n#    Downstream detection joins words with spaces, so a registered term\n#    written without spaces would never match.  Merge same-line\n#    neighbours when BOTH contain a CJK character and the horizontal\n#    gap is at most 0.6x the smaller height.  Latin words are never\n#    merged (both sides must contain CJK), so real spaces survive.\n# 2. With the Japanese language data, Tesseract often returns the yen\n#    sign as a backslash (\"\\140,800\").  In Japanese text U+005C is the\n#    yen sign, so a leading backslash directly before a digit is\n#    normalised to \"¥\" when Japanese OCR data was used.\n# ---------------------------------------------------------------------------\n_CJK_RE = re.compile(r\"[぀-ヿ㐀-鿿豈-﫿＀-｠]\")\n_YEN_LEAD_RE = re.compile(r\"^\\\\(?=[0-9])\")\n\n\ndef _merge_cjk_words(words):\n    by_line = {}\n    order = []\n    for wd in words or []:\n        lid = wd.get(\"line\", 0)\n        if lid not in by_line:\n            by_line[lid] = []\n            order.append(lid)\n        by_line[lid].append(wd)\n    out = []\n    for lid in order:\n        line = sorted(by_line[lid], key=lambda d: (int(d.get(\"x\", 0)), int(d.get(\"y\", 0))))\n        cur = None\n        for wd in line:\n            if cur is not None:\n                gap = int(wd[\"x\"]) - (int(cur[\"x\"]) + int(cur[\"w\"]))\n                if (0 <= gap <= 0.6 * min(int(cur[\"h\"]), int(wd[\"h\"]))\n                        and _CJK_RE.search(str(cur.get(\"text\", \"\")))\n                        and _CJK_RE.search(str(wd.get(\"text\", \"\")))):\n                    x2 = max(int(cur[\"x\"]) + int(cur[\"w\"]), int(wd[\"x\"]) + int(wd[\"w\"]))\n                    y1 = min(int(cur[\"y\"]), int(wd[\"y\"]))\n                    y2 = max(int(cur[\"y\"]) + int(cur[\"h\"]), int(wd[\"y\"]) + int(wd[\"h\"]))\n                    cur = {\"text\": str(cur[\"text\"]) + str(wd[\"text\"]),\n                           \"x\": int(cur[\"x\"]), \"y\": y1,\n                           \"w\": x2 - int(cur[\"x\"]), \"h\": y2 - y1,\n                           \"line\": lid}\n                    continue\n            if cur is not None:\n                out.append(cur)\n            cur = dict(wd)\n        if cur is not None:\n            out.append(cur)\n    return out\n\n\ndef _normalize_yen_sign(words):\n    out = []\n    for wd in words or []:\n        wd = dict(wd)\n        text = str(wd.get(\"text\", \"\"))\n        if _YEN_LEAD_RE.match(text):\n            wd[\"text\"] = \"¥\" + text[1:]\n        out.append(wd)\n    return out\n\n\ndef run_ocr(image_path, ui_lang) -> list:\n    \"\"\"Run Tesseract on *image_path* and return a list of word dicts.\n\n    Raises OcrUnavailable when no Tesseract executable is found.\n    \"\"\"\n    exe = _find_tesseract()\n    if not exe:\n        raise OcrUnavailable(\n            \"Tesseract executable not found (checked \"\n            f\"{ENV_TESSERACT}, adjacent tesseract/ directory, and PATH)\"\n        )\n    langs = languages_for_ui(ui_lang)\n    # TSV output is requested with \"-c tessedit_create_tsv=1\" instead of\n    # the \"tsv\" config-file argument: a config file only works when the\n    # tessdata directory contains configs/tsv, which traineddata-only\n    # bundles (e.g. the one shipped with TranscribeGuard) do not have --\n    # there Tesseract silently falls back to plain text and no words\n    # are returned at all.  The -c form works in both layouts.\n    cmd = [exe, str(image_path), \"stdout\", \"-l\", \"+\".join(langs),\n           \"-c\", \"tessedit_create_tsv=1\"]\n\n    env = dict(os.environ)\n    prefix = _tessdata_prefix()\n    if prefix:\n        env[\"TESSDATA_PREFIX\"] = prefix\n\n    try:\n        proc = subprocess.run(\n            cmd,\n            capture_output=True,\n            text=True,\n            encoding=\"utf-8\",\n            errors=\"replace\",\n            env=env,\n        )\n    except OSError as exc:\n        raise OcrUnavailable(f\"failed to run Tesseract: {exc}\") from exc\n\n    if proc.returncode != 0:\n        stderr = (proc.stderr or \"\").strip()\n        raise OcrUnavailable(\n            f\"Tesseract failed with exit code {proc.returncode}\"\n            + (f\": {stderr}\" if stderr else \"\")\n        )\n    words = _merge_cjk_words(_parse_tsv(proc.stdout or \"\"))\n    if \"jpn\" in langs:\n        words = _normalize_yen_sign(words)\n    return words\n"}, {"p": "README-SOURCE.txt", "s": 1135, "l": "plaintext", "c": "RedactShot - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of RedactShot, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-RedactShot.bat (or: python app.py)\n- Mac: Start-RedactShot.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\nNotes:\nOCR機能にはTesseract（別途インストール）が必要です。配布中のアプリ版には同梱済みです。\nThe OCR features require Tesseract (installed separately). The distributed app builds include it.\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 8920, "l": "plaintext", "c": "スクショ安心フィルター / RedactShot\n================================================\n\nこれは何をするアプリ？ / What is this app?\n------------------------------------------------\n\nスクリーンショットを共有・送信する前に、写り込んだ個人情報や\n社外秘情報を隠すための Windows / Mac デスクトップアプリです。\n\n・画像（PNG / JPG / BMP / WebP）を開く、貼り付ける、または\nドラッグ＆ドロップすると、OCRで文字を読み取り、メールアドレス・\n電話番号・カード番号・金額・パスワード欄付近・伏せ字・登録した\n社外秘用語などを「候補」として自動検出します\n・候補は右側の一覧でカテゴリ・検出テキスト・根拠とともに表示され、\nチェックのオン／オフでプレビューに即時反映されます。カテゴリ\n単位の一括オン／オフもできます。パスワードは「候補（推定）」と\n明示されます（確定ではありません）\n・効果はモザイク／ぼかし／黒塗りの3種類から選べます。効果の強さは、\n弱いと文字が読めてしまうため、すべての効果で安全なレベルに\n固定されており変更できません\n・画像の上でドラッグして手動で範囲を追加でき、移動・リサイズ・\nDeleteキーでの削除もできます\n・書き出しは必ず「最終プレビュー」で完成画像を確認してから行います。\n保存時の初期名は「元の名前_redacted」です。元のファイルと\n同じ場所（同一パス）への保存は、警告して阻止します\n・クリップボードへのコピーもできます\n\n\nA Windows / Mac desktop app that hides personal and confidential\ninformation in screenshots before you share or send them.\nOpen, paste, or drag & drop an image (PNG / JPG / BMP / WebP); OCR\ndetects candidates such as email addresses, phone numbers, card\nnumbers, money amounts, text near password fields, masked characters,\nand your registered confidential terms. Candidates appear in a list\nwith category, detected text, and reason, and toggling them updates\nthe live preview (pixelate / blur / blackout; effect strength is\nfixed at a safe, unreadable level for every effect, because a weak\neffect can leave text readable, and cannot be weakened).\nYou can also add regions manually by dragging, move / resize them,\nand delete them with the Delete key. Export always goes through a\nfinal-preview confirmation dialog; the default file name is\n\"<original>_redacted\", and saving over the original path is blocked\nwith a warning. Copying to the clipboard is also supported.\n\n完全オフライン / Fully offline\n------------------------------------------------\nこのアプリはネットワーク通信を行いません。画像も検出\n結果も外部に送信されません。\nThis app makes no network connections. Images and\ndetection results are never sent anywhere.\n\n元画像は変更しません / The original is never modified\n------------------------------------------------\n元画像ファイルは一切変更しません。効果はコピーに対して\n適用され、別名で保存します。同一パスへの上書き保存は阻止します。\nThe original image file is never modified. Effects are\napplied to a copy and saved under a different name; saving to the\nexact same path is blocked.\n\nWindows での起動 / Running on Windows\n------------------------------------------------\n\n・EXE版: RedactShot.exe をダブルクリックします（Python不要）。\n・ソース版: ZIPを「すべて展開」し、展開したフォルダーで\nStart-RedactShot.bat をダブルクリックします。初回だけ必要な\nライブラリ（PySide6 / Pillow）を自動で入れます。黒い画面は\n使用中は開いたままにしてください。\n・ソース版でOCRを使う場合は Tesseract OCR が別途必要です。\n見つからない場合は案内が表示され、手動範囲のみで使えます。\n\n- EXE build: double-click RedactShot.exe (no Python needed).\n- Source build: extract the ZIP fully, then double-click\nStart-RedactShot.bat in the extracted folder. Required libraries\n(PySide6 / Pillow) are installed automatically on first run.\nKeep the black console window open while using the app.\n- OCR in the source build needs Tesseract OCR installed separately.\nIf it is not found, a notice is shown and manual regions still work.\n\nMac での起動 / Running on Mac\n------------------------------------------------\n\n対応環境は macOS 11（Big Sur）以降を想定しています。Mac版は、\nダウンロード後に Mac 自身で.app を組み立てる方式です。\n1. ZIPを展開します\n2. MakeApp-Mac.command をダブルクリックします（開けない場合は\n右クリックして「開く」を選びます）\n3. Python 3.10以降が無い場合は、案内に従って python.org または\nHomebrew で Python を入れてから再実行します\n4. MakeApp はまず universal2（Intel + Apple Silicon 両対応）を\n試し、失敗した場合はその Mac のチップ専用形式で作り直し、\n最後にどちらで作ったかを表示します\n5. dist フォルダーに RedactShot.app ができます\n・すぐに試したい場合は Start-RedactShot.command でソース版を\n直接起動できます\n・Mac用OCRには Tesseract が別途必要で、同梱しません。Homebrewで\n次を実行してください: brew install tesseract\n見つからない場合、OCRだけが使えず、手動範囲は使えます\n・署名のないアプリのため、初回は Finder で右クリック→「開く」で\n確認してください\n\nTarget: macOS 11 (Big Sur) or later. The Mac build is assembled on\nyour own Mac after download:\n1. Extract the ZIP. 2. Double-click MakeApp-Mac.command\n(if blocked, right-click and choose Open).\n3. If Python 3.10+ is missing, install it from python.org or\nHomebrew, then run MakeApp-Mac.command again.\n4. MakeApp tries universal2 first, falls back to your Mac's native\narchitecture, and reports which one was built at the end.\n5. RedactShot.app appears in the dist folder.\nTo try quickly, Start-RedactShot.command runs the source directly.\nOCR on Mac needs Tesseract separately (not bundled):\nbrew install tesseract\nWithout it, only OCR is unavailable; manual regions still work.\nThe app is unsigned, so confirm the first launch via right-click > Open.\n\n設定の保存先 / Settings location\n------------------------------------------------\n設定（言語・社外秘用語・既定の効果・カテゴリ初期値）は\nsettings.json に保存されます。\nWindows: %APPDATA%\\RedactShot\\settings.json\nMac: ~/Library/Application Support/RedactShot/settings.json\nLinux: ~/.local/share/RedactShot/settings.json\n\n同梱ファイル（ソース版） / Files (source build)\n------------------------------------------------\napp.py / appinfo.py / i18n.py … アプリ本体・表示名・多言語文字列\ndetect.py / effects.py / ocr.py … 検出・効果・OCRエンジン\nrequirements.txt … 必要なライブラリ（PySide6, Pillow）\nStart-RedactShot.bat … Windows ソース版起動用\nStart-RedactShot.command … Mac ソース版起動用\nMakeApp-Mac.command … Mac で.app を生成する用\nREADME.txt … このファイル\n\n正直な制限 / Honest limitations\n------------------------------------------------\n\n・本アプリは Linux 上のオフスクリーン／エミュレーション環境での\n起動確認までで、実物の Windows パソコンおよび実機 Mac での\n起動はまだ未検証です。\n・OCRの精度は画像の状態に依存します。検出候補と最終プレビューを\n必ず目で確認してください。特にパスワード候補は推定です。\n・候補の検出は決定的なパターン照合に基づきます。検出漏れがあり\n得るため、書き出し前の最終確認が重要です。\n\n- Verified only in Linux offscreen / emulation environments so far;\nlaunching on a real Windows PC and on a real Mac is NOT yet verified.\n- OCR accuracy depends on image quality. Always check the candidates\nand the final preview yourself; password candidates are estimates.\n- Detection is pattern-based and can miss items, so the final\npreview check before export matters.\n\n対応言語 / Languages\n------------------------------------------------\n画面表示は13言語に切り替えできます（日本語・English・Español・\n简体中文・Français・Deutsch・Português・Русский・Italiano・Türkçe・\nالعربية・Bahasa Indonesia・한국어）。アラビア語は右から左（RTL）\n表示になります。選んだ言語は保存されます。\nThe UI switches instantly among 13 languages; Arabic uses RTL layout.\nYour language choice is saved.\n"}, {"p": "requirements.txt", "s": 26, "l": "plaintext", "c": "PySide6>=6.5\nPillow>=10.0\n"}, {"p": "Start-RedactShot.bat", "s": 1188, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\necho ========================================\r\necho  RedactShot の起動\r\necho  本体は EXE版 RedactShot.exe を推奨します\r\necho ========================================\r\nif not exist app.py (\r\n  echo [エラー] app.py が見つかりません。\r\n  echo ZIPファイルを「すべて展開」して、展開したフォルダーの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nif not exist requirements.txt (\r\n  echo [エラー] requirements.txt が見つかりません。\r\n  echo ZIPファイルを「すべて展開」して、展開したフォルダーの中で実行してください。\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [エラー] Python が見つかりません。EXE版を使ってください（Python不要です）。\r\n  pause\r\n  exit /b 1\r\n)\r\necho ライブラリのインストール／確認をしています（初回のみ約200MB）...\r\n%PY% -m pip install --upgrade PySide6 Pillow\r\nif errorlevel 1 (\r\n  echo [エラー] ライブラリのインストールに失敗しました。ネット接続を確認してください。\r\n  pause\r\n  exit /b 1\r\n)\r\necho RedactShot を起動します。この黒い画面は開いたままにしてください（閉じるとアプリも終了します）。\r\n%PY% app.py\r\npause\r\n"}, {"p": "Start-RedactShot.command", "s": 1940, "l": "bash", "c": "#!/bin/bash\n# RedactShot launcher for macOS.\n# Creates a local virtual environment, installs the Python dependencies,\n# and starts the application.\n\nSCRIPT_DIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\ncd \"$SCRIPT_DIR\" || exit 1\n\npause_and_exit() {\n  echo\n  echo \"$1\"\n  echo \"Press Enter to close this window.\"\n  read -r _ || true\n  exit 1\n}\n\nif ! command -v python3 >/dev/null 2>&1; then\n  cat <<'EOF'\nPython 3 was not found.\n\nInstall Python 3.10 or later in either of these ways:\n  1. Download the macOS installer from https://www.python.org/downloads/macos/\n  2. If Homebrew is already installed, run: brew install python\n\nThen double-click Start-RedactShot.command again.\nEOF\n  pause_and_exit \"Python 3 is required.\"\nfi\n\nPYTHON_BIN=\"$(command -v python3)\"\nif ! \"$PYTHON_BIN\" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' >/dev/null 2>&1; then\n  pause_and_exit \"Python 3.10 or later is required. Please install a current version from python.org.\"\nfi\n\nVENV_DIR=\"$SCRIPT_DIR/.venv\"\nVENV_PY=\"$VENV_DIR/bin/python\"\n\nif [ ! -x \"$VENV_PY\" ]; then\n  echo \"Creating the RedactShot Python environment...\"\n  \"$PYTHON_BIN\" -m venv \"$VENV_DIR\" || pause_and_exit \"Could not create the Python virtual environment.\"\nfi\n\necho \"Checking RedactShot dependencies...\"\n\"$VENV_PY\" -m pip install --upgrade pip || pause_and_exit \"Could not update pip. Check the network connection and try again.\"\n\"$VENV_PY\" -m pip install -r \"$SCRIPT_DIR/requirements.txt\" || pause_and_exit \"Could not install the required Python packages. Check the network connection and try again.\"\n\nif ! command -v tesseract >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/tesseract ] && [ ! -x /usr/local/bin/tesseract ]; then\n  echo\n  echo \"Note: Tesseract OCR was not found. Manual regions will still work.\"\n  echo \"For OCR on macOS, install Homebrew from https://brew.sh/ and then run:\"\n  echo \"  brew install tesseract\"\n  echo\nfi\n\nexec \"$VENV_PY\" \"$SCRIPT_DIR/app.py\"\n"}, {"p": "tests/smoke_gui.py", "s": 5479, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen GUI smoke test (worker B).\n\nRun: QT_QPA_PLATFORM=offscreen python3 tests/smoke_gui.py\nChecks: main window builds, ar (RTL) language switch, PIL test image\nload via the OcrUnavailable path (no Tesseract in this environment),\nmanual region add (direct + via canvas signal), preview/final image\ngeneration, and construction of the final-preview dialog (export hand-off\npoint). No modal export dialog is executed.\n\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom PIL import Image, ImageDraw\n\nfrom PySide6.QtCore import Qt\nfrom PySide6.QtWidgets import QApplication, QDialog\n\nimport appinfo\nfrom app import FinalPreviewDialog, MainWindow, settings_path\nfrom i18n import tr\n\n\ndef main():\n    app = QApplication([])\n    win = MainWindow()\n    win.resize(1240, 800)\n    win.show()\n    app.processEvents()\n    assert win.isVisible() or True  # offscreen: just require construction\n    assert appinfo.APP_ID in win.windowTitle(), win.windowTitle()\n    assert win.title_label.text() == appinfo.display_name(\"ja\")\n    print(\"1. main window OK, title:\", win.windowTitle())\n\n    # language switch to Arabic (RTL) must not crash\n    win.apply_language(\"ar\")\n    app.processEvents()\n    assert app.layoutDirection() == Qt.LayoutDirection.RightToLeft\n    assert win.title_label.text() == appinfo.display_name(\"ar\")\n    print(\"2. ar / RTL switch OK, title:\", win.title_label.text())\n    win.apply_language(\"ja\")\n    app.processEvents()\n    assert app.layoutDirection() == Qt.LayoutDirection.LeftToRight\n    print(\"   back to ja OK\")\n\n    # settings path sanity\n    sp = settings_path()\n    assert sp.endswith(os.path.join(appinfo.APP_ID, \"settings.json\")), sp\n    print(\"3. settings path OK:\", sp)\n\n    # test image: striped pattern so pixelate visibly changes pixels\n    tmpdir = \"/tmp/blurshield_smoke\"\n    os.makedirs(tmpdir, exist_ok=True)\n    img_path = os.path.join(tmpdir, \"shot.png\")\n    img = Image.new(\"RGB\", (400, 200), (255, 255, 255))\n    d = ImageDraw.Draw(img)\n    for x in range(0, 400, 8):\n        if (x // 8) % 2 == 0:\n            d.rectangle([x, 0, x + 7, 199], fill=(0, 0, 0))\n    d.rectangle([20, 20, 180, 60], fill=(200, 30, 30))\n    img.save(img_path)\n\n    win.load_path(img_path)\n    # OCR now runs on a worker thread: pump events until it settles\n    import time as _time\n    for _ in range(200):\n        app.processEvents()\n        if getattr(win, \"_ocr_thread\", None) is None:\n            break\n        _time.sleep(0.05)\n    app.processEvents()\n    assert win.original_pil is not None and win.original_pil.size == (400, 200)\n    # No Tesseract here -> OcrUnavailable path: banner shown, manual-only\n    assert win.banner.isVisible(), \"OCR banner should be visible\"\n    assert win.banner.text() == tr(\"ja\", \"ocr_unavailable\")\n    assert win.candidates == []\n    print(\"4. image load + OcrUnavailable path OK (banner shown, 0 candidates)\")\n\n    # manual region add (direct API)\n    win.add_manual_region(20, 20, 160, 40)\n    app.processEvents()\n    assert len(win.candidates) == 1\n    cand = win.candidates[0]\n    assert cand.category == \"manual\" and cand.manual is True and cand.enabled is True\n    assert isinstance(cand.id, int), cand.id\n    print(\"5. manual region add OK, id:\", cand.id)\n\n    # manual region add via canvas signal (the drag-finished path)\n    win.canvas.regionCreated.emit(220, 100, 120, 50)\n    app.processEvents()\n    assert len(win.candidates) == 2\n    print(\"6. canvas regionCreated -> candidate OK, count:\", len(win.candidates))\n\n    # preview + full-res final image: effects must change the region pixels\n    # (region 2 covers the striped pattern, so pixelate changes it;\n    #  region 1 is a solid fill, so verify it with blackout instead)\n    final = win.build_final_image()\n    assert final is not None and final.size == (400, 200)\n    assert final.crop((220, 100, 340, 150)).tobytes() != \\\n        win.original_pil.crop((220, 100, 340, 150)).tobytes()\n    idx_blackout = win.effect_combo.findData(\"blackout\")\n    assert idx_blackout >= 0\n    win.effect_combo.setCurrentIndex(idx_blackout)\n    app.processEvents()\n    final_b = win.build_final_image()\n    assert final_b.getpixel((30, 30)) == (0, 0, 0), final_b.getpixel((30, 30))\n    win.effect_combo.setCurrentIndex(win.effect_combo.findData(\"pixelate\"))\n    app.processEvents()\n    # original untouched\n    assert win.original_pil.getpixel((30, 30)) == (200, 30, 30)\n    print(\"7. final image OK (pixelate + blackout applied to copy, original untouched)\")\n\n    # toggling a candidate off must restore its region in the preview build\n    win.candidates[0].enabled = False\n    final2 = win.build_final_image()\n    assert final2.crop((20, 20, 180, 60)).tobytes() == win.original_pil.crop((20, 20, 180, 60)).tobytes()\n    win.candidates[0].enabled = True\n    print(\"8. candidate on/off reflection OK\")\n\n    # final-preview dialog (export hand-off point) constructs and shows text\n    dlg = FinalPreviewDialog(win.build_final_image(), \"ja\", win)\n    assert dlg.btn_confirm.text() == tr(\"ja\", \"confirm_export\")\n    dlg.show()\n    app.processEvents()\n    print(\"9. final preview dialog OK, confirm button:\", dlg.btn_confirm.text())\n    dlg.reject()\n\n    # delete via canvas-requested path\n    win.delete_candidate(win.candidates[0].id)\n    assert len(win.candidates) == 1\n    print(\"10. delete candidate OK\")\n\n    print(\"SMOKE OK\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"p": "tests/test_detect.py", "s": 9685, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nimport detect\n\n\nALL = set(detect.CATEGORIES)\n\n\ndef word(text, x=0, y=0, w=None, h=20, line=0):\n    if w is None:\n        w = max(10, len(text) * 10)\n    return {\"text\": text, \"x\": x, \"y\": y, \"w\": w, \"h\": h, \"line\": line}\n\n\ndef line_words(texts, y=0, line=0, x0=0):\n    words = []\n    x = x0\n    for t in texts:\n        w = max(10, len(t) * 10)\n        words.append(word(t, x=x, y=y, w=w, line=line))\n        x += w + 10\n    return words\n\n\ndef run(words, custom=None, enabled=None, img_w=1000, img_h=200):\n    return detect.detect(words, img_w, img_h, custom or [], ALL if enabled is None else enabled)\n\n\ndef by_cat(cands, cat):\n    return [c for c in cands if c.category == cat]\n\n\n# --- normalize / luhn -------------------------------------------------------\n\ndef test_normalize_fullwidth_and_case():\n    assert detect.normalize(\"ＡＢＣ１２３\") == \"abc123\"\n    assert detect.normalize(\"AbC\") == \"abc\"\n\n\ndef test_luhn_pass():\n    assert detect.luhn_ok(\"4111111111111111\") is True\n\n\ndef test_luhn_fail():\n    assert detect.luhn_ok(\"4111111111111112\") is False\n\n\ndef test_luhn_rejects_non_digits():\n    assert detect.luhn_ok(\"\") is False\n    assert detect.luhn_ok(\"4111abcd\") is False\n\n\n# --- card -------------------------------------------------------------------\n\ndef test_card_luhn_pass_reason():\n    cands = run(line_words([\"4111111111111111\"]))\n    cards = by_cat(cands, \"card\")\n    assert len(cards) == 1\n    assert cards[0].reason_key == \"card_luhn_pass\"\n    assert cards[0].reason_params == {\"digits\": 16}\n\n\ndef test_card_luhn_fail_reason():\n    cands = run(line_words([\"4111111111111112\"]))\n    cards = by_cat(cands, \"card\")\n    assert len(cards) == 1\n    assert cards[0].reason_key == \"card_luhn_fail\"\n    assert cards[0].reason_params == {\"digits\": 16}\n\n\ndef test_card_with_spaces():\n    cands = run(line_words([\"4111\", \"1111\", \"1111\", \"1111\"]))\n    cards = by_cat(cands, \"card\")\n    assert len(cards) == 1\n    assert cards[0].reason_params == {\"digits\": 16}\n\n\n# --- phone ------------------------------------------------------------------\n\ndef test_phone_jp_hyphen():\n    cands = run(line_words([\"03-1234-5678\"]))\n    phones = by_cat(cands, \"phone\")\n    assert len(phones) == 1\n    assert phones[0].reason_key == \"phone_pattern\"\n    # 10 digits must not be misreported as a card.\n    assert by_cat(cands, \"card\") == []\n\n\ndef test_phone_continuous():\n    cands = run(line_words([\"09012345678\"]))\n    phones = by_cat(cands, \"phone\")\n    assert len(phones) == 1\n    assert by_cat(cands, \"card\") == []\n\n\ndef test_phone_continuous_not_part_of_longer_digits():\n    # 12-digit sequence starting with 0: the 10/11-digit phone must not\n    # be carved out of a longer digit string.\n    cands = run(line_words([\"090123456789\"]))\n    assert by_cat(cands, \"phone\") == []\n\n\ndef test_phone_international():\n    cands = run(line_words([\"+81\", \"90-1234-5678\"]))\n    phones = by_cat(cands, \"phone\")\n    assert len(phones) == 1\n    assert phones[0].text.startswith(\"+81\")\n\n\n# --- email ------------------------------------------------------------------\n\ndef test_email():\n    cands = run(line_words([\"taro@example.co.jp\"]))\n    emails = by_cat(cands, \"email\")\n    assert len(emails) == 1\n    assert emails[0].reason_key == \"email_pattern\"\n    assert emails[0].text == \"taro@example.co.jp\"\n\n\ndef test_email_split_across_words_no_false_positive():\n    # A bare \"@\" separated by spaces is not an email pattern.\n    cands = run(line_words([\"taro\", \"@\", \"example\"]))\n    assert by_cat(cands, \"email\") == []\n\n\n# --- money ------------------------------------------------------------------\n\ndef test_money_yen_symbol():\n    cands = run(line_words([\"¥12,345\"]))\n    money = by_cat(cands, \"money\")\n    assert len(money) == 1\n    assert money[0].reason_key == \"money_pattern\"\n\n\ndef test_money_dollar():\n    cands = run(line_words([\"$99.99\"]))\n    money = by_cat(cands, \"money\")\n    assert len(money) == 1\n\n\ndef test_money_yen_suffix():\n    cands = run(line_words([\"500円\"]))\n    money = by_cat(cands, \"money\")\n    assert len(money) == 1\n\n\ndef test_money_plain_number_is_not_money():\n    cands = run(line_words([\"12345\"]))\n    assert by_cat(cands, \"money\") == []\n\n\n# --- masked -----------------------------------------------------------------\n\ndef test_masked():\n    cands = run(line_words([\"●●●●●●\"]))\n    masked = by_cat(cands, \"masked\")\n    assert len(masked) == 1\n    assert masked[0].reason_key == \"mask_chars\"\n\n\ndef test_masked_too_short():\n    cands = run(line_words([\"●●\"]))\n    assert by_cat(cands, \"masked\") == []\n\n\n# --- password ---------------------------------------------------------------\n\ndef test_password_label_with_right_word():\n    words = [\n        word(\"パスワード\", x=0, y=0, w=80, h=20, line=0),\n        word(\"secret123\", x=100, y=0, w=90, h=20, line=0),\n    ]\n    cands = run(words)\n    pw = by_cat(cands, \"password\")\n    assert len(pw) == 1\n    assert pw[0].reason_key == \"password_estimate\"\n    # Candidate covers the word to the right of the label.\n    assert pw[0].x <= 100\n    assert pw[0].x + pw[0].w >= 190\n    assert pw[0].y <= 0 + 20 and pw[0].y + pw[0].h >= 0\n\n\ndef test_password_label_alone_estimates_box_to_the_right():\n    words = [word(\"password:\", x=0, y=10, w=80, h=20, line=0)]\n    cands = run(words, img_w=1000, img_h=200)\n    pw = by_cat(cands, \"password\")\n    assert len(pw) == 1\n    # Estimated box starts at the right edge of the label and is wide.\n    assert pw[0].x == 80\n    assert pw[0].w == max(160, 80 * 3)\n\n\ndef test_password_label_alone_near_right_edge_goes_below():\n    words = [word(\"password\", x=970, y=10, w=20, h=20, line=0)]\n    cands = run(words, img_w=1000, img_h=200)\n    pw = by_cat(cands, \"password\")\n    assert len(pw) == 1\n    # Less than 40px remains to the right, so the box goes below.\n    assert pw[0].y == 30\n    assert pw[0].x == 970\n\n\ndef test_password_non_label_word_not_detected():\n    cands = run(line_words([\"passwords\"]))\n    assert by_cat(cands, \"password\") == []\n\n\n# --- custom -----------------------------------------------------------------\n\ndef test_custom_exact_match():\n    cands = run(line_words([\"社外秘\"]), custom=[\"社外秘\"])\n    custom = by_cat(cands, \"custom\")\n    assert len(custom) == 1\n    assert custom[0].reason_key == \"custom_term\"\n\n\ndef test_custom_normalization_fullwidth_and_case():\n    # Fullwidth -> halfwidth and case differences still match.\n    cands = run(line_words([\"ＣＯＮＦＩＤＥＮＴＩＡＬ\"]), custom=[\"Confidential\"])\n    assert len(by_cat(cands, \"custom\")) == 1\n    cands2 = run(line_words([\"confidential\"]), custom=[\"ＣＯＮＦＩＤＥＮＴＩＡＬ\"])\n    assert len(by_cat(cands2, \"custom\")) == 1\n\n\ndef test_custom_no_match_when_term_differs_after_normalization():\n    # After normalisation the strings still differ -> no detection.\n    cands = run(line_words([\"ABC124\"]), custom=[\"ABC123\"])\n    assert by_cat(cands, \"custom\") == []\n    cands2 = run(line_words([\"社外\"]), custom=[\"社外秘\"])\n    assert by_cat(cands2, \"custom\") == []\n    # A shorter fragment of the registered term is not a match.\n    cands3 = run(line_words([\"confident\"]), custom=[\"Confidential\"])\n    assert by_cat(cands3, \"custom\") == []\n\n\ndef test_custom_substring_inside_word_is_detected_per_spec():\n    # Spec: substring exact match inside a word counts as a detection.\n    cands = run(line_words([\"xxSECRETxx\"]), custom=[\"SECRET\"])\n    assert len(by_cat(cands, \"custom\")) == 1\n\n\n# --- enabled / categories ---------------------------------------------------\n\ndef test_disabled_category_not_detected():\n    words = line_words([\"taro@example.co.jp\"])\n    cands = run(words, enabled={\"phone\", \"card\"})\n    assert by_cat(cands, \"email\") == []\n    cands_all = run(words, enabled=ALL)\n    assert len(by_cat(cands_all, \"email\")) == 1\n\n\ndef test_disabled_custom_not_detected():\n    words = line_words([\"社外秘\"])\n    cands = run(words, custom=[\"社外秘\"], enabled=set(ALL) - {\"custom\"})\n    assert by_cat(cands, \"custom\") == []\n\n\ndef test_candidate_fields_and_defaults():\n    cands = run(line_words([\"taro@example.co.jp\"]))\n    c = by_cat(cands, \"email\")[0]\n    assert isinstance(c.id, int)\n    assert c.enabled is True\n    assert c.manual is False\n    assert c.w > 0 and c.h > 0\n\n\ndef test_duplicate_candidates_merged():\n    # Same phone written in a way matched by two phone patterns must\n    # collapse to a single candidate for the same range/category.\n    cands = run(line_words([\"090-1234-5678\"]))\n    phones = by_cat(cands, \"phone\")\n    assert len(phones) == 1\n\n\ndef test_password_stacked_layout_prefers_below():\n    # Label alone on its line; a word sits just below under the label\n    # (stacked login form) -> candidate must be below and cover that word.\n    words = [\n        {\"text\": \"パスワード\", \"x\": 400, \"y\": 470, \"w\": 126, \"h\": 22, \"line\": 0},\n        {\"text\": \"xxxxxxxx\", \"x\": 420, \"y\": 532, \"w\": 240, \"h\": 27, \"line\": 1},\n    ]\n    cands = [c for c in detect.detect(words, 1600, 1000, [], ALL)\n             if c.category == \"password\"]\n    assert len(cands) == 1\n    c = cands[0]\n    assert c.y >= 492  # below the label\n    # overlaps the field area (400,505,800,70)\n    assert c.x < 1200 and c.x + c.w > 400 and c.y < 575 and c.y + c.h > 505\n\n\ndef test_password_no_below_evidence_keeps_right_estimate():\n    words = [\n        {\"text\": \"パスワード\", \"x\": 100, \"y\": 100, \"w\": 126, \"h\": 22, \"line\": 0},\n    ]\n    cands = [c for c in detect.detect(words, 1600, 1000, [], ALL)\n             if c.category == \"password\"]\n    assert len(cands) == 1\n    assert cands[0].x >= 226  # right of the label, as before\n"}, {"p": "tests/test_effects.py", "s": 6181, "l": "python", "c": "# -*- coding: utf-8 -*-\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nimport pytest\nfrom PIL import Image\n\nimport effects\n\n\ndef patterned_image(w=100, h=100):\n    \"\"\"Deterministic high-detail image (1px checkerboard + gradient).\"\"\"\n    img = Image.new(\"RGB\", (w, h))\n    px = img.load()\n    for yy in range(h):\n        for xx in range(w):\n            if (xx + yy) % 2 == 0:\n                px[xx, yy] = (255, 255, 255)\n            else:\n                px[xx, yy] = (0, 0, 0)\n    return img\n\n\ndef region_pixels(img, x, y, w, h):\n    return [img.getpixel((xx, yy)) for yy in range(y, y + h) for xx in range(x, x + w)]\n\n\ndef test_effects_list():\n    assert effects.EFFECTS == [\"pixelate\", \"blur\", \"blackout\"]\n\n\n@pytest.mark.parametrize(\"effect\", effects.EFFECTS)\ndef test_effect_changes_region_pixels(effect):\n    img = patterned_image()\n    before = region_pixels(img, 10, 10, 40, 40)\n    out = effects.apply_effects(img, [(10, 10, 40, 40, effect, 5)])\n    after = region_pixels(out, 10, 10, 40, 40)\n    assert after != before\n\n\n@pytest.mark.parametrize(\"effect\", effects.EFFECTS)\ndef test_original_image_unchanged(effect):\n    img = patterned_image()\n    snapshot = img.copy()\n    out = effects.apply_effects(img, [(10, 10, 40, 40, effect, 5)])\n    assert out is not img\n    assert list(img.getdata()) == list(snapshot.getdata())\n\n\n@pytest.mark.parametrize(\"effect\", effects.EFFECTS)\ndef test_outside_region_unchanged(effect):\n    img = patterned_image()\n    out = effects.apply_effects(img, [(10, 10, 40, 40, effect, 5)])\n    # Corners / areas outside the target region keep their pixels.\n    for pt in [(0, 0), (99, 0), (0, 99), (99, 99), (9, 10), (50, 10), (10, 50)]:\n        assert out.getpixel(pt) == img.getpixel(pt)\n\n\ndef test_blackout_fills_black():\n    img = patterned_image()\n    out = effects.apply_effects(img, [(10, 10, 40, 40, \"blackout\", 3)])\n    assert set(region_pixels(out, 10, 10, 40, 40)) == {(0, 0, 0)}\n\n\ndef test_pixelate_makes_uniform_blocks():\n    img = patterned_image()\n    out = effects.apply_effects(img, [(0, 0, 40, 40, \"pixelate\", 5)])\n    # With the fixed block size (14), pixels inside one block share a colour.\n    block_pixels = {out.getpixel((xx, yy)) for yy in range(0, 11) for xx in range(0, 11)}\n    assert len(block_pixels) == 1\n\n\ndef test_blur_reduces_checkerboard_contrast():\n    img = patterned_image()\n    out = effects.apply_effects(img, [(10, 10, 40, 40, \"blur\", 5)])\n    vals = {out.getpixel((xx, yy)) for yy in range(20, 30) for xx in range(20, 30)}\n    # Blurred interior is no longer pure black / pure white only.\n    assert any(v not in ((0, 0, 0), (255, 255, 255)) for v in vals)\n\n\ndef test_region_clipped_to_image_bounds():\n    img = patterned_image(50, 50)\n    out = effects.apply_effects(img, [(-20, -20, 60, 60, \"blackout\", 5)])\n    assert out.size == (50, 50)\n    assert out.getpixel((0, 0)) == (0, 0, 0)\n    assert out.getpixel((39, 39)) == (0, 0, 0)\n    # Outside the (clipped) region stays untouched.\n    assert out.getpixel((49, 49)) == img.getpixel((49, 49))\n\n\ndef test_empty_items_returns_equal_copy():\n    img = patterned_image()\n    out = effects.apply_effects(img, [])\n    assert out is not img\n    assert list(out.getdata()) == list(img.getdata())\n\n\ndef test_blur_strength_is_fixed():\n    # Blur ignores the requested strength entirely: the weakest and the\n    # strongest request must produce byte-identical output, so blur can\n    # never be weakened below the fixed safe level.\n    img = patterned_image()\n    weak = effects.apply_effects(img, [(10, 10, 40, 40, \"blur\", 1)])\n    mid = effects.apply_effects(img, [(10, 10, 40, 40, \"blur\", 5)])\n    strong = effects.apply_effects(img, [(10, 10, 40, 40, \"blur\", 10)])\n    assert list(weak.getdata()) == list(mid.getdata()) == list(strong.getdata())\n\n\ndef test_blur_fixed_level_fully_averages_detail():\n    # At the fixed level (radius = BLUR_FIXED_RADIUS), a 1px checkerboard\n    # in the interior of the region must be averaged to near-uniform\n    # mid-grey: no black/white detail survives that OCR could read.\n    assert effects.BLUR_FIXED_STRENGTH >= 5  # at/above the old \"recommended\" level\n    img = patterned_image()\n    out = effects.apply_effects(img, [(10, 10, 60, 60, \"blur\", 1)])\n    vals = [out.getpixel((xx, yy)) for yy in range(35, 55) for xx in range(35, 55)]\n    for v in vals:\n        assert all(100 <= ch <= 155 for ch in v), v\n\n\ndef test_pixelate_strength_is_fixed():\n    # Pixelate ignores the requested strength entirely (same design as\n    # blur): the weakest and the strongest request must produce\n    # byte-identical output, so pixelate can never be weakened below\n    # the fixed safe level.\n    img = Image.new(\"RGB\", (100, 100))\n    px = img.load()\n    for yy in range(100):\n        for xx in range(100):\n            px[xx, yy] = ((xx * 2) % 256, (yy * 2) % 256, (xx + yy) % 256)\n    weak = effects.apply_effects(img, [(0, 0, 60, 60, \"pixelate\", 1)])\n    mid = effects.apply_effects(img, [(0, 0, 60, 60, \"pixelate\", 6)])\n    strong = effects.apply_effects(img, [(0, 0, 60, 60, \"pixelate\", 10)])\n    assert list(weak.getdata()) == list(mid.getdata()) == list(strong.getdata())\n\n\ndef test_pixelate_fixed_level_block_size():\n    # The fixed level is the former default strength 6 (block 14 px),\n    # verified by re-OCR to leave 0 of 24 planted secrets readable.\n    assert effects.PIXELATE_FIXED_STRENGTH == 6\n    assert effects.PIXELATE_FIXED_BLOCK == 14\n    img = patterned_image()\n    out = effects.apply_effects(img, [(0, 0, 56, 56, \"pixelate\", 1)])\n    # Each 14x14 block is a single flat colour.\n    for by in (0, 14, 28):\n        for bx in (0, 14, 28):\n            block_pixels = {out.getpixel((xx, yy))\n                            for yy in range(by, by + 13) for xx in range(bx, bx + 13)}\n            assert len(block_pixels) == 1\n\n\ndef test_multiple_items_applied():\n    img = patterned_image()\n    out = effects.apply_effects(img, [\n        (0, 0, 20, 20, \"blackout\", 5),\n        (80, 80, 20, 20, \"blackout\", 5),\n    ])\n    assert out.getpixel((5, 5)) == (0, 0, 0)\n    assert out.getpixel((85, 85)) == (0, 0, 0)\n    assert out.getpixel((50, 50)) == img.getpixel((50, 50))\n"}, {"p": "theme.py", "s": 5108, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Modern flat theme for RedactShot (dark slate + magenta identity).\n\n2026 design refresh: bundled fonts (Inter + Noto Sans JP, see\nfonts.py), flat buttons with 10 px radii and role colours (magenta\nprimary, white secondary), custom-drawn combo chevrons and checkbox\nindicators (assets/, drawn with QPainter — no emoji glyphs), slim\nscrollbars, and card-style panels. Palette + stylesheet are applied\nat application level from main() BEFORE the main window is built.\n\"\"\"\n\nimport os\n\nimport fonts as _fonts\n\nBG = \"#ECEEF3\"             # soft light ground\nPANEL = \"#FFFFFF\"\nINK = \"#232838\"\nSUBINK = \"#6B7280\"\nACCENT = \"#D6336C\"         # magenta (primary)\nACCENT_DEEP = \"#A61E4D\"\nACCENT_HOVER = \"#C2255C\"\nACCENT_SOFT = \"#FCE4EE\"\nACCENT_WASH = \"#FFF7FA\"\nLINE = \"#D9DCE4\"\nLINE_STRONG = \"#C3C8D4\"\nHEADER = \"#1E2432\"         # dark slate\nHEADER_SUB = \"#C3C9D9\"\n\nUI_FAMILY_CSS = ('\"Inter\", \"Noto Sans JP\", \"Segoe UI\", '\n                 '\"Hiragino Sans\", sans-serif')\n\n\ndef _asset(name):\n    path = os.path.join(_fonts.base_dir(), \"assets\", name)\n    return path.replace(os.sep, \"/\")\n\n\ndef stylesheet():\n    chev = _asset(\"chevron-down.png\")\n    chev_hot = _asset(\"chevron-down-hot.png\")\n    chk_off = _asset(\"check-off.png\")\n    chk_off_h = _asset(\"check-off-hover.png\")\n    chk_on = _asset(\"check-on.png\")\n    chk_on_h = _asset(\"check-on-hover.png\")\n    chk_off_d = _asset(\"check-off-dis.png\")\n    chk_on_d = _asset(\"check-on-dis.png\")\n    return f\"\"\"\nQMainWindow {{ background: {BG}; }}\nQLabel {{ color: {INK}; }}\nQPushButton {{\n    background: {PANEL}; border: 1px solid {LINE}; border-radius: 10px;\n    padding: 7px 14px; font-weight: 600; color: {INK};\n}}\nQPushButton:hover {{ border-color: {ACCENT}; color: {ACCENT_DEEP}; background: {ACCENT_WASH}; }}\nQPushButton:pressed {{ background: {ACCENT_SOFT}; }}\nQPushButton:checked {{ background: {ACCENT}; border-color: {ACCENT}; color: #FFFFFF; }}\nQPushButton:disabled {{ color: #9AA0B0; border-color: #E3E5EC; background: #F4F5F8; }}\nQPushButton.primary {{\n    background: {ACCENT}; border: 1px solid {ACCENT}; color: #FFFFFF; font-weight: 700;\n}}\nQPushButton.primary:hover {{ background: {ACCENT_HOVER}; border-color: {ACCENT_HOVER}; color: #FFFFFF; }}\nQPushButton.primary:pressed {{ background: {ACCENT_DEEP}; border-color: {ACCENT_DEEP}; }}\nQComboBox {{\n    background: {PANEL}; border: 1px solid {LINE}; border-radius: 10px;\n    padding: 6px 10px; font-weight: 600; color: {INK};\n}}\nQComboBox:hover {{ border-color: {LINE_STRONG}; }}\nQComboBox:focus {{ border-color: {ACCENT}; }}\nQComboBox::drop-down {{ border: none; width: 24px; }}\nQComboBox::down-arrow {{ image: url({chev}); width: 12px; height: 12px; }}\nQComboBox::down-arrow:hover {{ image: url({chev_hot}); }}\nQComboBox QAbstractItemView {{\n    background: {PANEL}; border: 1px solid {LINE}; border-radius: 8px;\n    selection-background-color: {ACCENT_SOFT}; selection-color: {INK};\n    padding: 4px; outline: none;\n}}\nQLineEdit {{\n    background: {PANEL}; border: 1px solid {LINE}; border-radius: 10px; padding: 6px 10px;\n}}\nQLineEdit:focus {{ border-color: {ACCENT}; }}\nQCheckBox {{ font-weight: 600; spacing: 7px; }}\nQCheckBox::indicator {{ width: 18px; height: 18px; image: url({chk_off}); }}\nQCheckBox::indicator:hover {{ image: url({chk_off_h}); }}\nQCheckBox::indicator:checked {{ image: url({chk_on}); }}\nQCheckBox::indicator:checked:hover {{ image: url({chk_on_h}); }}\nQCheckBox::indicator:disabled {{ image: url({chk_off_d}); }}\nQCheckBox::indicator:checked:disabled {{ image: url({chk_on_d}); }}\nQListWidget {{ background: {PANEL}; border: 1px solid {LINE}; border-radius: 10px; padding: 4px; }}\nQListWidget::item {{ padding: 4px 6px; border-radius: 6px; }}\nQListWidget::item:selected {{ background: {ACCENT_SOFT}; color: {INK}; }}\nQScrollBar:vertical {{ background: transparent; width: 10px; margin: 2px; }}\nQScrollBar::handle:vertical {{ background: #C6CAD4; border-radius: 5px; min-height: 30px; }}\nQScrollBar::handle:vertical:hover {{ background: #A8ACBC; }}\nQScrollBar:horizontal {{ background: transparent; height: 10px; margin: 2px; }}\nQScrollBar::handle:horizontal {{ background: #C6CAD4; border-radius: 5px; min-width: 30px; }}\nQScrollBar::handle:horizontal:hover {{ background: #A8ACBC; }}\nQScrollBar::add-line, QScrollBar::sub-line {{ height: 0; width: 0; }}\nQScrollBar::add-page, QScrollBar::sub-page {{ background: transparent; }}\nQSplitter::handle {{ background: transparent; width: 6px; }}\nQDialog {{ background: {BG}; }}\n\"\"\"\n\n\ndef apply_theme(app) -> None:\n    \"\"\"Apply palette + stylesheet (call before building widgets).\"\"\"\n    from PySide6.QtGui import QColor, QPalette\n    _fonts.register_fonts()\n    pal = app.palette()\n    pal.setColor(QPalette.ColorRole.Window, QColor(BG))\n    pal.setColor(QPalette.ColorRole.Base, QColor(PANEL))\n    pal.setColor(QPalette.ColorRole.WindowText, QColor(INK))\n    pal.setColor(QPalette.ColorRole.Text, QColor(INK))\n    pal.setColor(QPalette.ColorRole.Highlight, QColor(ACCENT))\n    pal.setColor(QPalette.ColorRole.HighlightedText, QColor(\"#FFFFFF\"))\n    app.setPalette(pal)\n    app.setStyleSheet(stylesheet())\n"}]</script>

لتطبيقات", "to_top": "الصفحة الرئيسية", "dl_zip": "تنزيل الشيفرة المصدرية (ZIP)", "file_list": "الملفات", "copy": "نسخ", "copied": "تم النسخ", "copy_fail": "فشل النسخ", "bin_note": "ملف ثنائي (لا يُعرض)", "lines_unit": "سطر", "version": "الإصدار", "files_unit": "ملفات", "license": "رخصة MIT", "title_fmt": "الشيفرة المصدرية لـ {app} | get-quicknote"}, "id": {"back_list": "← Kembali ke daftar aplikasi", "to_top": "Beranda", "dl_zip": "Unduh kode sumber (ZIP)", "file_list": "File", "copy": "Salin", "copied": "Disalin", "copy_fail": "Gagal menyalin", "bin_note": "File biner (tidak ditampilkan)", "lines_unit": "baris", "version": "Versi", "files_unit": "file", "license": "Lisensi MIT", "title_fmt": "Kode sumber {app} | get-quicknote"}, "ko": {"back_list": "← 앱 목록으로 돌아가기", "to_top": "홈으로", "dl_zip": "소스 코드 다운로드 (ZIP)", "file_list": "파일 목록", "copy": "복사", "copied": "복사했습니다", "copy_fail": "복사에 실패했습니다", "bin_note": "바이너리 파일 (표시되지 않음)", "lines_unit": "행", "version": "버전", "files_unit": "파일", "license": "MIT 라이선스", "title_fmt": "{app} 소스 코드 | get-quicknote"}}</script>
<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
