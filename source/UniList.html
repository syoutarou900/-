<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('gq-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;}}catch(e){}})();</script>
<title>UniList のソースコード | get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#0D1526; --surface:#111C33; --surface2:#182747;
  --codebg:#0D1117; --ink:#E8EEF8; --muted:#93A5C4; --faint:#5B6E92; --line:#22314F;
  --line-soft:rgba(34,49,79,.55); --gutter-line:#21262D; --gutter-ink:#484F58;
  --accent:#3B82F6; --accent-strong:#60A5FA; --accent-soft:rgba(59,130,246,.16);
  --active-ink:#FFFFFF;
  --font-body:"Inter","Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F8FD; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#E7EFFD;
  --codebg:#FFFFFF; --ink:#0F1B33; --muted:#3B4A66; --faint:#64748B; --line:#DFE7F3;
  --line-soft:#E7EDF6; --gutter-line:#D8DEE4; --gutter-ink:#6E7781;
  --accent:#2563EB; --accent-strong:#1D4ED8; --accent-soft:rgba(37,99,235,.12);
  --active-ink:#1D4ED8;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:var(--accent-strong)}
/* ===== top bar ===== */
.topbar{flex:none;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;
  padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .appname{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .appname .ja{color:var(--muted);font-size:.82em;font-weight:700;margin-left:10px}
.topbar .meta{color:var(--faint);font-size:.85rem;white-space:nowrap}
.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:18px}
.topbar nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
.topbar nav a:hover{color:var(--ink)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 18px;border-radius:999px;
  box-shadow:0 8px 20px -6px rgba(37,99,235,.5);white-space:nowrap}
.dlbtn:hover{filter:brightness(1.12)}
.dlbtn svg{flex:none}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  cursor:pointer;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ic-moon{display:none}
:root[data-theme="light"] .themebtn .ic-moon{display:block}
:root[data-theme="light"] .themebtn .ic-sun{display:none}
.langpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.85rem;font-weight:700;
  line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;cursor:pointer;max-width:190px}
.langpick select:hover{border-color:var(--accent)}
/* ===== main split ===== */
.main{flex:1;display:flex;min-height:0}
.filelist{width:284px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--panel);
  border-right:1px solid var(--line)}
[dir="rtl"] .filelist{border-right:0;border-left:1px solid var(--line)}
.filelist .fl-head{padding:11px 16px;font-weight:800;font-size:.86rem;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.file-btn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);color:var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:.8rem;line-height:1.45;
  text-align:left;cursor:pointer;word-break:break-all}
.file-btn:hover{background:var(--surface2)}
.file-btn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);color:var(--active-ink)}
[dir="rtl"] .file-btn.active{box-shadow:inset -3px 0 0 var(--accent)}
.file-btn .sz{color:var(--faint);font-size:.7rem;flex:none}
.file-bin{padding:9px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);
  font-size:.8rem;line-height:1.45;color:var(--faint);word-break:break-all}
.file-bin .sz{font-size:.7rem;margin-left:8px}
.bin-note{display:block;font-family:var(--font-body);font-size:.72rem;color:#64748B;margin-top:1px}
/* ===== code pane ===== */
.codepane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--codebg)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .fname{font-family:var(--font-mono);font-size:.95rem;font-weight:700;word-break:break-all}
.toolbar .finfo{color:var(--muted);font-size:.85rem;white-space:nowrap}
.copybtn{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:7px 18px;border-radius:999px}
[dir="rtl"] .copybtn{margin-left:0;margin-right:auto}
.copybtn:hover{filter:brightness(1.12)}
.copybtn.done{background:#0E9F6E}
.code-scroll{flex:1;overflow:auto;min-height:0;direction:ltr}
.code-flex{display:flex;min-width:max-content;min-height:100%}
.gutter{flex:none;position:sticky;left:0;z-index:1;background:var(--codebg);
  border-right:1px solid var(--gutter-line);text-align:right;user-select:none;white-space:pre;
  font-family:var(--font-mono);font-size:16px;line-height:1.75;
  padding:16px 12px 24px 18px;color:var(--gutter-ink)}
.code-flex pre.code{flex:1;margin:0;padding:16px 28px 24px 20px;
  font-family:var(--font-mono);font-size:16px;line-height:1.75}
.code-flex pre.code code{font-family:inherit;font-size:inherit;line-height:inherit;
  background:transparent;padding:0;white-space:pre}
/* ===== highlight.js GitHub Dark (default) ===== */
.hljs{color:#E6EDF3;background:#0D1117}
.hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-variable,
.hljs-template-tag,.hljs-type,.hljs-variable.language_{color:#FF7B72}
.hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,
.hljs-title.function_{color:#D2A8FF}
.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,
.hljs-variable,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:#79C0FF}
.hljs-regexp,.hljs-string,.hljs-meta .hljs-string{color:#A5D6FF}
.hljs-built_in,.hljs-symbol{color:#FFA657}
.hljs-comment,.hljs-code,.hljs-formula{color:#8B949E}
.hljs-name,.hljs-quote,.hljs-selector-tag,.hljs-selector-pseudo{color:#7EE787}
.hljs-subst{color:#E6EDF3}
.hljs-section{color:#1F6FEB;font-weight:bold}
.hljs-bullet{color:#F2CC60}
.hljs-emphasis{color:#E6EDF3;font-style:italic}
.hljs-strong{color:#E6EDF3;font-weight:bold}
.hljs-addition{color:#AFF5B4;background-color:#033A16}
.hljs-deletion{color:#FFDCD7;background-color:#67060C}
.hljs-char.escape_,.hljs-link,.hljs-params,.hljs-property,.hljs-punctuation,.hljs-tag{/* purposely ignored */}
/* ===== highlight.js GitHub Light ===== */
:root[data-theme="light"] .hljs{color:#24292E;background:#FFFFFF}
:root[data-theme="light"] .hljs-doctag,:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-meta .hljs-keyword,:root[data-theme="light"] .hljs-template-variable,
:root[data-theme="light"] .hljs-template-tag,:root[data-theme="light"] .hljs-type,
:root[data-theme="light"] .hljs-variable.language_{color:#D73A49}
:root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.class_,
:root[data-theme="light"] .hljs-title.class_.inherited__,
:root[data-theme="light"] .hljs-title.function_{color:#6F42C1}
:root[data-theme="light"] .hljs-attr,:root[data-theme="light"] .hljs-attribute,
:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-meta,
:root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-operator,
:root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-selector-attr,
:root[data-theme="light"] .hljs-selector-class,:root[data-theme="light"] .hljs-selector-id{color:#005CC5}
:root[data-theme="light"] .hljs-regexp,:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-meta .hljs-string{color:#032F62}
:root[data-theme="light"] .hljs-built_in,:root[data-theme="light"] .hljs-symbol{color:#E36209}
:root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-code,
:root[data-theme="light"] .hljs-formula{color:#6A737D}
:root[data-theme="light"] .hljs-name,:root[data-theme="light"] .hljs-quote,
:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-selector-pseudo{color:#22863A}
:root[data-theme="light"] .hljs-subst{color:#24292E}
:root[data-theme="light"] .hljs-section{color:#005CC5;font-weight:bold}
:root[data-theme="light"] .hljs-bullet{color:#735C0F}
:root[data-theme="light"] .hljs-emphasis{color:#24292E;font-style:italic}
:root[data-theme="light"] .hljs-strong{color:#24292E;font-weight:bold}
:root[data-theme="light"] .hljs-addition{color:#22863A;background-color:#F0FFF4}
:root[data-theme="light"] .hljs-deletion{color:#B31D28;background-color:#FFEEF0}
@media (max-width:760px){
  .main{flex-direction:column}
  .filelist{width:auto;flex:none;max-height:158px;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line)}
  .filelist .fl-head{position:static}
  .filelist .fl-items{display:flex;flex-direction:row;overflow-x:auto}
  .file-btn,.file-bin{flex:none;border-bottom:0;border-right:1px solid var(--line-soft);
    white-space:nowrap;word-break:normal;align-items:center}
  .code-flex pre.code,.gutter{font-size:14.5px}
  .topbar .meta{display:none}
  .langpick select{max-width:140px}
}
</style>

<script type="application/json" id="filedata">[{"p": "app.py", "s": 27502, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"UniList GUI (PySide6, single codebase for Windows and macOS).\n\nFlow: open a customer/vendor list -> check/correct the proposed column\nroles -> find candidate duplicate groups (exact matches after\ndeterministic normalization only) -> compare side by side and choose\nthe value to keep per field -> merge ONLY the groups a human approves.\nThe original file is never modified; results are exported to a new\nfile, merges can be undone, sessions can be saved and resumed.\n\"\"\"\nimport json\nimport os\nimport sys\n\nfrom PySide6.QtCore import Qt, QSettings, QStandardPaths\nfrom PySide6.QtGui import QColor\nfrom PySide6.QtWidgets import (\n    QApplication, QButtonGroup, QComboBox, QFileDialog, QGroupBox,\n    QHBoxLayout, QLabel, QMainWindow, QMessageBox, QPushButton,\n    QRadioButton, QSplitter, QTableWidget, QTableWidgetItem,\n    QVBoxLayout, QWidget,\n)\n\nimport core\nimport normalize as nz\nfrom appinfo import APP_ID, APP_VERSION, display_name\nfrom i18n import LANG_NAMES, LANG_ORDER, RTL_LANGS, STRINGS, tr\n\nTIER_BG = {\"A\": \"#fde8e8\", \"B\": \"#fff6da\", \"C\": \"#eef1f4\"}\nTIER_FG = {\"A\": \"#b02a2a\", \"B\": \"#8a6d00\", \"C\": \"#5a6672\"}\n\n# Resolve typed role words in ANY UI language (plus the synonym table\n# in core.resolve_role, which covers many more variants).\n_ROLE_TEXT_LOOKUP = {}\nfor _lang in LANG_ORDER:\n    for _role in core.ROLES:\n        _txt = STRINGS[_lang].get(f\"role_{_role}\")\n        if _txt:\n            _ROLE_TEXT_LOOKUP[core._role_key(_txt)] = _role\n\n\ndef resolve_role_input(text):\n    role = core.resolve_role(text)\n    if role:\n        return role\n    return _ROLE_TEXT_LOOKUP.get(core._role_key(text or \"\"))\n\n\nclass MainWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.settings = QSettings(\"Muse\", APP_ID)\n        self.lang = self.settings.value(\"language\", \"ja\")\n        if self.lang not in LANG_ORDER:\n            self.lang = \"ja\"\n        self.engine = core.Engine()\n        self.groups = []\n        self.current_group = None\n        self._radio_groups = []      # per field: (QButtonGroup, [values])\n        self._merged_labels = []     # per field: QLabel in merged column\n        self._global_notdup = self._load_global_notdup()\n        self.engine.not_dup |= self._global_notdup\n\n        self.setWindowTitle(display_name(self.lang))\n        self.resize(1240, 780)\n        self.setAcceptDrops(True)\n        self._build_ui()\n        self.apply_language()\n\n    # -- not-duplicate global store -------------------------------------------\n    def _notdup_path(self):\n        base = QStandardPaths.writableLocation(\n            QStandardPaths.StandardLocation.AppDataLocation)\n        os.makedirs(base, exist_ok=True)\n        return os.path.join(base, \"notdup.json\")\n\n    def _load_global_notdup(self):\n        try:\n            with open(self._notdup_path(), \"r\", encoding=\"utf-8\") as fh:\n                return {frozenset(p) for p in json.load(fh)}\n        except Exception:\n            return set()\n\n    def _save_global_notdup(self):\n        try:\n            with open(self._notdup_path(), \"w\", encoding=\"utf-8\") as fh:\n                json.dump([sorted(p) for p in self.engine.not_dup],\n                          fh, ensure_ascii=False)\n        except Exception:\n            pass\n\n    # -- UI construction ---------------------------------------------------------\n    def _build_ui(self):\n        root = QWidget()\n        self.setCentralWidget(root)\n        main = QVBoxLayout(root)\n\n        head = QHBoxLayout()\n        title_box = QVBoxLayout()\n        self.title_label = QLabel()\n        self.title_label.setStyleSheet(\n            \"font-size: 20px; font-weight: 800; color: #1a6b4a;\")\n        self.subtitle_label = QLabel()\n        self.subtitle_label.setStyleSheet(\"color: #555;\")\n        title_box.addWidget(self.title_label)\n        title_box.addWidget(self.subtitle_label)\n        head.addLayout(title_box, 1)\n        self.lang_caption = QLabel()\n        head.addWidget(self.lang_caption)\n        self.lang_combo = QComboBox()\n        for code in LANG_ORDER:\n            self.lang_combo.addItem(LANG_NAMES[code], code)\n        self.lang_combo.setCurrentIndex(LANG_ORDER.index(self.lang))\n        self.lang_combo.currentIndexChanged.connect(self._on_lang_changed)\n        head.addWidget(self.lang_combo)\n        main.addLayout(head)\n\n        bar = QHBoxLayout()\n        self.btn_open = QPushButton()\n        self.btn_open.clicked.connect(self.open_file_dialog)\n        bar.addWidget(self.btn_open)\n        self.btn_save_session = QPushButton()\n        self.btn_save_session.clicked.connect(self.save_session_dialog)\n        bar.addWidget(self.btn_save_session)\n        self.btn_load_session = QPushButton()\n        self.btn_load_session.clicked.connect(self.load_session_dialog)\n        bar.addWidget(self.btn_load_session)\n        self.file_label = QLabel()\n        bar.addWidget(self.file_label, 1)\n        self.rows_label = QLabel()\n        bar.addWidget(self.rows_label)\n        main.addLayout(bar)\n\n        split = QSplitter(Qt.Orientation.Horizontal)\n\n        left = QWidget()\n        lv = QVBoxLayout(left)\n        self.columns_box = QGroupBox()\n        cl = QVBoxLayout(self.columns_box)\n        self.columns_table = QTableWidget(0, 2)\n        self.columns_table.verticalHeader().setVisible(False)\n        cl.addWidget(self.columns_table)\n        lv.addWidget(self.columns_box)\n        self.btn_detect = QPushButton()\n        self.btn_detect.setStyleSheet(\n            \"font-weight: 700; padding: 8px; background: #1a6b4a;\"\n            \" color: white; border-radius: 6px;\")\n        self.btn_detect.clicked.connect(self.run_detect)\n        lv.addWidget(self.btn_detect)\n        lv.addStretch(1)\n        split.addWidget(left)\n\n        right = QWidget()\n        rv = QVBoxLayout(right)\n        self.groups_box = QGroupBox()\n        gl = QVBoxLayout(self.groups_box)\n        self.groups_table = QTableWidget(0, 4)\n        self.groups_table.verticalHeader().setVisible(False)\n        self.groups_table.setSelectionBehavior(\n            QTableWidget.SelectionBehavior.SelectRows)\n        self.groups_table.setSelectionMode(\n            QTableWidget.SelectionMode.SingleSelection)\n        self.groups_table.itemSelectionChanged.connect(self._on_group_selected)\n        gl.addWidget(self.groups_table)\n        rv.addWidget(self.groups_box, 3)\n\n        self.preview_box = QGroupBox()\n        pv = QVBoxLayout(self.preview_box)\n        self.preview_hint = QLabel()\n        self.preview_hint.setWordWrap(True)\n        pv.addWidget(self.preview_hint)\n        self.preview_table = QTableWidget(0, 0)\n        self.preview_table.verticalHeader().setVisible(False)\n        pv.addWidget(self.preview_table)\n        prow = QHBoxLayout()\n        self.btn_apply = QPushButton()\n        self.btn_apply.clicked.connect(self.apply_merge)\n        prow.addWidget(self.btn_apply)\n        self.btn_notdup = QPushButton()\n        self.btn_notdup.clicked.connect(self.mark_not_duplicate)\n        prow.addWidget(self.btn_notdup)\n        prow.addStretch(1)\n        pv.addLayout(prow)\n        rv.addWidget(self.preview_box, 4)\n        split.addWidget(right)\n        split.setStretchFactor(0, 2)\n        split.setStretchFactor(1, 5)\n        main.addWidget(split, 1)\n\n        bottom = QHBoxLayout()\n        self.btn_undo = QPushButton()\n        self.btn_undo.clicked.connect(self.undo_merge)\n        bottom.addWidget(self.btn_undo)\n        self.btn_export = QPushButton()\n        self.btn_export.clicked.connect(self.export_dialog)\n        bottom.addWidget(self.btn_export)\n        self.btn_export_log = QPushButton()\n        self.btn_export_log.clicked.connect(self.export_log_dialog)\n        bottom.addWidget(self.btn_export_log)\n        self.merged_label = QLabel()\n        bottom.addWidget(self.merged_label)\n        bottom.addStretch(1)\n        main.addLayout(bottom)\n\n        self.hint_label = QLabel()\n        self.hint_label.setStyleSheet(\"color: #1a6b4a; font-weight: 600;\")\n        main.addWidget(self.hint_label)\n        self.status_label = QLabel()\n        self.status_label.setWordWrap(True)\n        main.addWidget(self.status_label)\n\n    # -- language ------------------------------------------------------------------\n    def apply_language(self):\n        lang = self.lang\n        self.setWindowTitle(display_name(lang))\n        self.title_label.setText(\n            f\"{display_name(lang)}  v{APP_VERSION}\")\n        self.subtitle_label.setText(tr(lang, \"app_subtitle\"))\n        self.lang_caption.setText(tr(lang, \"lang_label\"))\n        self.btn_open.setText(tr(lang, \"btn_open\"))\n        self.btn_save_session.setText(tr(lang, \"btn_save_session\"))\n        self.btn_load_session.setText(tr(lang, \"btn_load_session\"))\n        self.columns_box.setTitle(tr(lang, \"hdr_columns\"))\n        self.columns_table.setHorizontalHeaderLabels(\n            [tr(lang, \"col_column_name\"), tr(lang, \"col_role\")])\n        self.btn_detect.setText(tr(lang, \"btn_detect\"))\n        self.groups_box.setTitle(tr(lang, \"hdr_groups\"))\n        self.groups_table.setHorizontalHeaderLabels([\n            tr(lang, \"grp_col_tier\"), tr(lang, \"grp_col_reason\"),\n            tr(lang, \"grp_col_count\"), tr(lang, \"grp_col_representative\")])\n        self.preview_box.setTitle(tr(lang, \"hdr_preview\"))\n        self.preview_hint.setText(tr(lang, \"lbl_select_group\"))\n        self.btn_apply.setText(tr(lang, \"btn_apply_merge\"))\n        self.btn_notdup.setText(tr(lang, \"btn_not_dup\"))\n        self.btn_undo.setText(tr(lang, \"btn_undo\"))\n        self.btn_export.setText(tr(lang, \"btn_export\"))\n        self.btn_export_log.setText(tr(lang, \"btn_export_log\"))\n        self.hint_label.setText(tr(lang, \"hint_human\"))\n        self._refresh_file_label()\n        self._refresh_merged_label()\n        self._render_columns()\n        self._render_groups()\n        self._clear_preview()\n        app = QApplication.instance()\n        if app:\n            app.setLayoutDirection(\n                Qt.LayoutDirection.RightToLeft if lang in RTL_LANGS\n                else Qt.LayoutDirection.LeftToRight)\n\n    def _on_lang_changed(self, index):\n        self.lang = self.lang_combo.itemData(index)\n        self.settings.setValue(\"language\", self.lang)\n        self.apply_language()\n\n    # -- file loading ---------------------------------------------------------------\n    def _last_dir(self):\n        return self.settings.value(\"last_dir\", os.path.expanduser(\"~\"))\n\n    def open_file_dialog(self):\n        path, _ = QFileDialog.getOpenFileName(\n            self, tr(self.lang, \"dlg_open_title\"), self._last_dir(),\n            tr(self.lang, \"filter_data\"))\n        if path:\n            self.load_file(path)\n\n    def load_file(self, path):\n        try:\n            table = core.load_table(path)\n        except Exception as exc:  # unreadable file\n            self._status(tr(self.lang, \"msg_error\", detail=str(exc)))\n            return\n        self.settings.setValue(\"last_dir\", os.path.dirname(path))\n        self.engine.load(table, source_path=path)\n        self.engine.not_dup |= self._global_notdup\n        self.groups = []\n        self.current_group = None\n        self._render_columns()\n        self._render_groups()\n        self._clear_preview()\n        self._refresh_file_label()\n        self._refresh_merged_label()\n        self._status(tr(self.lang, \"msg_loaded\",\n                        name=os.path.basename(path),\n                        count=len(self.engine.rows)))\n\n    def dragEnterEvent(self, event):\n        if event.mimeData().hasUrls():\n            event.acceptProposedAction()\n\n    def dropEvent(self, event):\n        for url in event.mimeData().urls():\n            path = url.toLocalFile()\n            if os.path.splitext(path)[1].lower() in (\n                    \".csv\", \".tsv\", \".txt\", \".xlsx\", \".xlsm\"):\n                self.load_file(path)\n                break\n\n    def _refresh_file_label(self):\n        if self.engine.source_path:\n            self.file_label.setText(os.path.basename(self.engine.source_path))\n            self.rows_label.setText(\n                tr(self.lang, \"lbl_rows_count\", count=len(self.engine.rows)))\n        else:\n            self.file_label.setText(tr(self.lang, \"lbl_no_file\"))\n            self.rows_label.setText(\"\")\n\n    def _refresh_merged_label(self):\n        self.merged_label.setText(tr(\n            self.lang, \"lbl_merged_count\",\n            count=len(self.engine.merge_log)))\n\n    def _status(self, text):\n        self.status_label.setText(text)\n\n    # -- columns / roles ------------------------------------------------------------\n    def _render_columns(self):\n        eng = self.engine\n        self.columns_table.setRowCount(len(eng.headers))\n        for ci, header in enumerate(eng.headers):\n            item = QTableWidgetItem(header)\n            item.setFlags(item.flags() & ~Qt.ItemFlag.ItemIsEditable)\n            self.columns_table.setItem(ci, 0, item)\n            combo = QComboBox()\n            combo.setEditable(True)\n            for role in core.ROLES:\n                combo.addItem(tr(self.lang, f\"role_{role}\"), role)\n            combo.setCurrentText(tr(self.lang, f\"role_{eng.roles[ci]}\"))\n            combo.currentIndexChanged.connect(\n                lambda _i, c=ci, cb=combo: self._role_changed(c, cb))\n            if combo.lineEdit() is not None:\n                combo.lineEdit().editingFinished.connect(\n                    lambda c=ci, cb=combo: self._role_changed(c, cb))\n            self.columns_table.setCellWidget(ci, 1, combo)\n        self.columns_table.resizeColumnsToContents()\n\n    def _role_changed(self, ci, combo):\n        role = combo.currentData()\n        text = combo.currentText()\n        resolved = resolve_role_input(text)\n        if resolved is None:\n            if role is None:\n                role = \"other\"\n            self._status(tr(self.lang, \"msg_role_unresolved\", text=text))\n            resolved = role if role in core.ROLES else \"other\"\n        if ci < len(self.engine.roles):\n            self.engine.roles[ci] = resolved\n        combo.blockSignals(True)\n        combo.setCurrentText(tr(self.lang, f\"role_{resolved}\"))\n        combo.blockSignals(False)\n\n    def _collect_roles(self):\n        roles = []\n        for ci in range(self.columns_table.rowCount()):\n            combo = self.columns_table.cellWidget(ci, 1)\n            role = \"other\"\n            if combo is not None:\n                role = resolve_role_input(combo.currentText()) \\\n                    or combo.currentData() or \"other\"\n            roles.append(role)\n        if roles:\n            self.engine.set_roles(roles)\n        return roles\n\n    # -- detection / groups ------------------------------------------------------------\n    def run_detect(self):\n        if not self.engine.headers:\n            return\n        roles = self._collect_roles()\n        if not any(r in core.KEY_ROLES for r in roles):\n            self._status(tr(self.lang, \"msg_no_key_col\"))\n            return\n        self.groups = self.engine.detect()\n        self.current_group = None\n        self._render_groups()\n        self._clear_preview()\n        self._refresh_file_label()\n        if self.groups:\n            self._status(tr(self.lang, \"msg_groups_found\",\n                            count=len(self.groups)))\n        else:\n            self._status(tr(self.lang, \"msg_no_groups\"))\n\n    def _reason_text(self, group):\n        fields = \", \".join(tr(self.lang, f\"role_{r}\")\n                           for r in group.reasons)\n        text = tr(self.lang, \"reason_matched\", fields=fields)\n        if group.tier == \"C\":\n            text += \" — \" + tr(self.lang, \"tier_c_note\")\n        return text\n\n    def _representative(self, group):\n        name_cols = [i for i, r in enumerate(self.engine.roles)\n                     if r == \"name\"]\n        if name_cols:\n            for idx in group.row_indices:\n                v = self.engine.rows[idx][\"values\"][name_cols[0]]\n                if v.strip():\n                    return v\n        idx = group.row_indices[0]\n        return self.engine.rows[idx][\"values\"][0] if self.engine.headers else \"\"\n\n    def _render_groups(self):\n        t = self.groups_table\n        t.setRowCount(len(self.groups))\n        for gi, g in enumerate(self.groups):\n            tier_item = QTableWidgetItem(tr(self.lang, f\"tier_{g.tier}\"))\n            tier_item.setForeground(QColor(TIER_FG[g.tier]))\n            font = tier_item.font()\n            font.setBold(True)\n            tier_item.setFont(font)\n            cells = [tier_item,\n                     QTableWidgetItem(self._reason_text(g)),\n                     QTableWidgetItem(str(len(g.row_indices))),\n                     QTableWidgetItem(self._representative(g))]\n            for col, item in enumerate(cells):\n                item.setBackground(QColor(TIER_BG[g.tier]))\n                item.setFlags(item.flags() & ~Qt.ItemFlag.ItemIsEditable)\n                t.setItem(gi, col, item)\n        t.resizeColumnsToContents()\n\n    def _on_group_selected(self):\n        rows = self.groups_table.selectionModel().selectedRows()\n        if not rows:\n            return\n        gi = rows[0].row()\n        if 0 <= gi < len(self.groups):\n            self.current_group = self.groups[gi]\n            self._render_preview(self.current_group)\n\n    # -- merge preview ------------------------------------------------------------------\n    def _clear_preview(self):\n        self.preview_table.setRowCount(0)\n        self.preview_table.setColumnCount(0)\n        self._radio_groups = []\n        self._merged_labels = []\n        self.preview_hint.setText(tr(self.lang, \"lbl_select_group\"))\n\n    def _render_preview(self, group):\n        eng = self.engine\n        members = [eng.rows[i] for i in group.row_indices]\n        n_fields = len(eng.headers)\n        self.preview_table.setColumnCount(len(members) + 2)\n        headers = [tr(self.lang, \"col_field\")]\n        for mi, m in enumerate(members):\n            headers.append(self._member_title(m, mi))\n        headers.append(tr(self.lang, \"col_merged\"))\n        self.preview_table.setHorizontalHeaderLabels(headers)\n        self.preview_table.setRowCount(n_fields)\n        self._radio_groups = []\n        self._merged_labels = []\n        self.preview_hint.setText(self._reason_text(group))\n        for ci in range(n_fields):\n            field_item = QTableWidgetItem(eng.headers[ci])\n            field_item.setFlags(\n                field_item.flags() & ~Qt.ItemFlag.ItemIsEditable)\n            self.preview_table.setItem(ci, 0, field_item)\n            group_btns = QButtonGroup(self)\n            group_btns.setExclusive(True)\n            values = []\n            default_btn = None\n            for mi, m in enumerate(members):\n                value = m[\"values\"][ci]\n                values.append(value)\n                rb = QRadioButton(value if value.strip() else \"—\")\n                if not value.strip():\n                    rb.setEnabled(False)\n                rb.toggled.connect(\n                    lambda checked, r=ci: self._update_merged_cell(r))\n                self.preview_table.setCellWidget(ci, mi + 1, rb)\n                group_btns.addButton(rb)\n                if default_btn is None and value.strip():\n                    default_btn = rb\n            if default_btn is not None:\n                default_btn.setChecked(True)\n            self._radio_groups.append((group_btns, values))\n            lbl = QLabel()\n            self.preview_table.setCellWidget(ci, len(members) + 1, lbl)\n            self._merged_labels.append(lbl)\n            self._update_merged_cell(ci)\n        self.preview_table.resizeColumnsToContents()\n\n    def _member_title(self, member, mi):\n        name_cols = [i for i, r in enumerate(self.engine.roles)\n                     if r == \"name\"]\n        if name_cols:\n            v = member[\"values\"][name_cols[0]]\n            if v.strip():\n                return v\n        return tr(self.lang, \"member_label\", n=mi + 1)\n\n    def _update_merged_cell(self, ci):\n        if ci >= len(self._radio_groups):\n            return\n        group_btns, values = self._radio_groups[ci]\n        checked = group_btns.checkedButton()\n        text = \"\"\n        if checked is not None:\n            # find which member the checked button belongs to by order\n            for bi, btn in enumerate(group_btns.buttons()):\n                if btn is checked:\n                    text = values[bi]\n                    break\n        self._merged_labels[ci].setText(text)\n\n    def _current_choices(self):\n        choices = {}\n        for ci, (group_btns, values) in enumerate(self._radio_groups):\n            checked = group_btns.checkedButton()\n            val = \"\"\n            if checked is not None:\n                for bi, btn in enumerate(group_btns.buttons()):\n                    if btn is checked:\n                        val = values[bi]\n                        break\n            if not val:\n                val = self.engine.default_choices(\n                    self.current_group).get(ci, \"\") \\\n                    if self.current_group else \"\"\n            choices[ci] = val\n        return choices\n\n    # -- actions ----------------------------------------------------------------------\n    def apply_merge(self):\n        if self.current_group is None:\n            self._status(tr(self.lang, \"msg_select_group\"))\n            return\n        choices = self._current_choices()\n        self.engine.apply_merge(self.current_group, choices)\n        self.current_group = None\n        self._status(tr(self.lang, \"msg_merged\"))\n        self._refresh_merged_label()\n        self.run_detect()\n\n    def mark_not_duplicate(self):\n        if self.current_group is None:\n            self._status(tr(self.lang, \"msg_select_group\"))\n            return\n        self.engine.mark_not_duplicate(self.current_group)\n        self._save_global_notdup()\n        self.current_group = None\n        self._status(tr(self.lang, \"msg_notdup\"))\n        self.run_detect()\n\n    def undo_merge(self):\n        entry = self.engine.undo_last_merge()\n        if entry is not None:\n            self._status(tr(self.lang, \"msg_undone\"))\n            self._refresh_merged_label()\n            self._refresh_file_label()\n            self.run_detect()\n\n    def export_dialog(self):\n        if not self.engine.headers:\n            return\n        path, _ = QFileDialog.getSaveFileName(\n            self, tr(self.lang, \"dlg_export_title\"), self._last_dir(),\n            tr(self.lang, \"filter_export\"))\n        if not path:\n            return\n        if self.engine.source_path and os.path.abspath(path) == \\\n                os.path.abspath(self.engine.source_path):\n            QMessageBox.warning(self, display_name(self.lang),\n                                tr(self.lang, \"msg_overwrite_blocked\"))\n            return\n        table = self.engine.export_table()\n        try:\n            if path.lower().endswith(\".csv\"):\n                core.save_table_csv(table, path)\n            else:\n                if not path.lower().endswith(\".xlsx\"):\n                    path += \".xlsx\"\n                core.save_table_xlsx(table, path)\n        except Exception as exc:\n            self._status(tr(self.lang, \"msg_error\", detail=str(exc)))\n            return\n        self._status(tr(self.lang, \"msg_exported\",\n                        name=os.path.basename(path)))\n\n    def export_log_dialog(self):\n        if not self.engine.merge_log:\n            self._status(tr(self.lang, \"msg_no_groups\"))\n            return\n        path, _ = QFileDialog.getSaveFileName(\n            self, tr(self.lang, \"dlg_export_title\"), self._last_dir(),\n            \"CSV (*.csv)\")\n        if not path:\n            return\n        if not path.lower().endswith(\".csv\"):\n            path += \".csv\"\n        records = self.engine.log_records()\n        try:\n            with open(path, \"w\", encoding=\"utf-8-sig\", newline=\"\") as fh:\n                import csv as _csv\n                w = _csv.writer(fh, lineterminator=\"\\r\\n\")\n                w.writerow([\"when\", \"tier\", \"reasons\", \"members\",\n                            \"member_count\", \"chosen\"])\n                for r in records:\n                    w.writerow([r[\"when\"], r[\"tier\"], r[\"reasons\"],\n                                r[\"members\"], r[\"member_count\"], r[\"chosen\"]])\n        except Exception as exc:\n            self._status(tr(self.lang, \"msg_error\", detail=str(exc)))\n            return\n        self._status(tr(self.lang, \"msg_log_exported\",\n                        name=os.path.basename(path)))\n\n    def save_session_dialog(self):\n        if not self.engine.headers:\n            return\n        path, _ = QFileDialog.getSaveFileName(\n            self, tr(self.lang, \"dlg_save_session\"), self._last_dir(),\n            tr(self.lang, \"filter_session\"))\n        if not path:\n            return\n        if not path.lower().endswith(\".json\"):\n            path += \".json\"\n        self._collect_roles()\n        try:\n            self.engine.save_session(path)\n        except Exception as exc:\n            self._status(tr(self.lang, \"msg_error\", detail=str(exc)))\n            return\n        self._status(tr(self.lang, \"msg_session_saved\"))\n\n    def load_session_dialog(self):\n        path, _ = QFileDialog.getOpenFileName(\n            self, tr(self.lang, \"dlg_load_session\"), self._last_dir(),\n            tr(self.lang, \"filter_session\"))\n        if not path:\n            return\n        try:\n            self.engine.load_session(path)\n        except Exception as exc:\n            self._status(tr(self.lang, \"msg_error\", detail=str(exc)))\n            return\n        self.engine.not_dup |= self._global_notdup\n        self.groups = []\n        self.current_group = None\n        self._render_columns()\n        self._render_groups()\n        self._clear_preview()\n        self._refresh_file_label()\n        self._refresh_merged_label()\n        self._status(tr(self.lang, \"msg_session_loaded\"))\n\n\ndef _under_wine():\n    \"\"\"True only under Wine (ntdll exports wine_get_version only there).\n    Used solely for Wine-only stability workarounds; real Windows and\n    macOS are untouched.\"\"\"\n    try:\n        import ctypes\n        return hasattr(ctypes.WinDLL(\"ntdll\"), \"wine_get_version\")\n    except Exception:\n        return False\n\n\ndef main():\n    args = list(sys.argv)\n    if _under_wine():\n        # Wine-only: Qt's native (DirectWrite) font engine can fault in\n        # Wine 9.0 during font fallback, crashing the app intermittently\n        # at startup. The FreeType engine avoids that path. This branch\n        # never runs on real Windows or macOS.\n        args += [\"-platform\", \"windows:fontengine=freetype\"]\n    app = QApplication(args)\n    try:\n        import os as _os, sys as _sys\n        from PySide6.QtGui import QIcon as _QIcon\n        _ib = getattr(_sys, \"_MEIPASS\", None) or _os.path.dirname(_os.path.abspath(__file__))\n        _ip = _os.path.join(_ib, \"assets\", \"icon.png\")\n        if _os.path.exists(_ip):\n            app.setWindowIcon(_QIcon(_ip))\n    except Exception:\n        pass\n    app.setApplicationName(APP_ID)\n    app.setOrganizationName(\"Muse\")\n    if _under_wine():\n        try:\n            from PySide6.QtGui import QFont, QFontDatabase\n            families = set(QFontDatabase.families())\n            if families and \"Yu Gothic UI\" not in families \\\n                    and \"Segoe UI\" not in families:\n                fallback = \"Tahoma\" if \"Tahoma\" in families \\\n                    else sorted(families)[0]\n                app.setFont(QFont(fallback))\n        except Exception:\n            pass\n    win = MainWindow()\n    win.show()\n    return app.exec()\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"p": "appinfo.py", "s": 588, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Application name - THE single place that defines the product name.\n\n- Japanese UI title: UniList\n- All other languages' UI title: UniList\n- EXE name: UniList.exe / ZIP names: UniList-Windows.zip,\n  UniList-Source.zip (all derived from APP_FILE_STEM).\n\"\"\"\n\nAPP_ID = \"UniList\"\nAPP_FILE_STEM = \"UniList\"\nAPP_NAME_EN = \"UniList\"\nAPP_NAME_JA = \"UniList\"\n\nAPP_DISPLAY = {\n    \"ja\": \"UniList\",\n}\n\nAPP_VERSION = \"1.0.0\"\n\n\ndef display_name(lang):\n    \"\"\"Japanese UI shows UniList; every other language\n    shows UniList.\"\"\"\n    return APP_DISPLAY.get(lang, APP_NAME_EN)\n"}, {"p": "assets/icon.icns", "s": 165021, "b": 1}, {"p": "assets/icon.ico", "s": 32252, "b": 1}, {"p": "assets/icon.png", "s": 61886, "b": 1}, {"p": "core.py", "s": 20594, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"UniList core: table IO, column-role inference, deterministic\nduplicate-candidate detection, and the human-approved merge engine.\n\nSemi-auto rule (project-wide): the engine only PROPOSES candidate\ngroups whose normalized keys are exactly equal. Merging happens only\nfor groups a human explicitly approves, the source file is never\nmodified, every merge is logged and can be undone, and pairs a human\nmarks as 'not duplicates' are remembered.\n\"\"\"\nimport csv\nimport io\nimport json\nimport os\nimport re\nfrom datetime import date, datetime\n\nimport normalize as nz\n\nROLES = [\"name\", \"address\", \"phone\", \"email\", \"id\", \"other\"]\nKEY_ROLES = [\"name\", \"phone\", \"email\", \"id\", \"address\"]\n\n\n# ---------------------------------------------------------------------------\n# Table IO\n# ---------------------------------------------------------------------------\n\nclass Table:\n    def __init__(self, headers, rows, meta=None):\n        self.headers = headers          # list[str]\n        self.rows = rows                # list[list[str]]\n        self.meta = meta or {}\n\n\ndef detect_encoding(raw):\n    if raw.startswith(b\"\\xef\\xbb\\xbf\"):\n        return \"utf-8-sig\"\n    if raw.startswith(b\"\\xff\\xfe\") or raw.startswith(b\"\\xfe\\xff\"):\n        return \"utf-16\"\n    for enc in (\"utf-8\", \"shift_jis\", \"cp1252\"):\n        try:\n            raw.decode(enc)\n            return enc\n        except (UnicodeDecodeError, LookupError):\n            continue\n    return \"latin-1\"\n\n\ndef detect_delimiter(text):\n    sample = text[:8192]\n    try:\n        dialect = csv.Sniffer().sniff(sample, delimiters=\",;\\t|\")\n        return dialect.delimiter\n    except csv.Error:\n        pass\n    lines = [ln for ln in sample.splitlines() if ln.strip()][:10]\n    best, best_score = \",\", -1\n    for cand in (\",\", \";\", \"\\t\", \"|\"):\n        counts = [ln.count(cand) for ln in lines]\n        if counts and min(counts) > 0:\n            score = min(counts) * 100 - (max(counts) - min(counts))\n            if score > best_score:\n                best, best_score = cand, score\n    return best\n\n\ndef parse_csv_text(text, delimiter=None):\n    if delimiter is None:\n        delimiter = detect_delimiter(text)\n    reader = csv.reader(io.StringIO(text), delimiter=delimiter)\n    rows = [r for r in reader]\n    if not rows:\n        return Table([], []), delimiter\n    headers = [h.strip() for h in rows[0]]\n    body = []\n    for r in rows[1:]:\n        if len(r) < len(headers):\n            r = r + [\"\"] * (len(headers) - len(r))\n        body.append(r[:len(headers)])\n    return Table(headers, body), delimiter\n\n\ndef load_table(path):\n    ext = os.path.splitext(path)[1].lower()\n    if ext in (\".xlsx\", \".xlsm\"):\n        from openpyxl import load_workbook  # lazy: heavy import\n        wb = load_workbook(path, read_only=True, data_only=True)\n        ws = wb.active\n        rows = []\n        for row in ws.iter_rows(values_only=True):\n            rows.append([\"\" if c is None else\n                         (c.isoformat() if isinstance(c, (date, datetime))\n                          else str(c)) for c in row])\n        wb.close()\n        if not rows:\n            return Table([], [], {\"source_format\": \"xlsx\"})\n        headers = [h.strip() for h in rows[0]]\n        body = []\n        for r in rows[1:]:\n            if len(r) < len(headers):\n                r = r + [\"\"] * (len(headers) - len(r))\n            body.append(r[:len(headers)])\n        return Table(headers, body, {\"source_format\": \"xlsx\"})\n    with open(path, \"rb\") as fh:\n        raw = fh.read()\n    enc = detect_encoding(raw)\n    text = raw.decode(enc)\n    table, delim = parse_csv_text(text)\n    table.meta = {\"source_format\": \"csv\", \"encoding\": enc, \"delimiter\": delim}\n    return table\n\n\ndef save_table_csv(table, path, delimiter=\",\"):\n    with open(path, \"w\", encoding=\"utf-8-sig\", newline=\"\") as fh:\n        writer = csv.writer(fh, delimiter=delimiter, lineterminator=\"\\r\\n\")\n        writer.writerow(table.headers)\n        writer.writerows(table.rows)\n\n\ndef save_table_xlsx(table, path):\n    from openpyxl import Workbook  # lazy\n    wb = Workbook()\n    ws = wb.active\n    ws.append(table.headers)\n    for r in table.rows:\n        ws.append(r)\n    wb.save(path)\n\n\n# ---------------------------------------------------------------------------\n# Column roles: inference + robust resolution of human-typed text\n# ---------------------------------------------------------------------------\n\ndef _role_key(text):\n    \"\"\"Normalization for role words: width/case folded, spaces and\n    punctuation removed - so fullwidth, spaces, case and punctuation\n    variants of the same word resolve identically.\"\"\"\n    t = nz.base_normalize(text)\n    t = nz.fold_latin_accents(t)\n    return re.sub(r\"[\\s\\W_]+\", \"\", t, flags=re.UNICODE)\n\n\n_ROLE_SYNONYMS = {\n    \"name\": [\n        \"名前\", \"氏名\", \"名称\", \"会社名\", \"顧客名\", \"取引先名\", \"店名\", \"担当者名\",\n        \"name\", \"fullname\", \"company\", \"companyname\", \"customer\", \"customername\",\n        \"client\", \"account\", \"nombre\", \"empresa\", \"cliente\",\n        \"nom\", \"société\", \"societe\", \"clientnom\",\n        \"firmenname\", \"kundenname\", \"firma\", \"kunde\",\n        \"nome\", \"azienda\", \"cliente\", \"razãosocial\", \"razaosocial\",\n        \"название\", \"компания\", \"клиент\", \"наименование\",\n        \"isim\", \"şirket\", \"sirket\", \"müşteri\", \"musteri\", \"firmaadi\",\n        \"الاسم\", \"الشركة\", \"العميل\",\n        \"nama\", \"perusahaan\", \"pelanggan\",\n        \"이름\", \"회사명\", \"고객명\", \"상호\", \"거래처명\",\n        \"名称\", \"公司名\", \"客户名\", \"客戶名\", \"公司名稱\",\n    ],\n    \"address\": [\n        \"住所\", \"所在地\", \"アドレス\", \"address\", \"dirección\", \"direccion\",\n        \"endereço\", \"endereco\", \"adresse\", \"indirizzo\", \"адрес\", \"adres\",\n        \"العنوان\", \"عنوان\", \"alamat\", \"주소\", \"地址\", \"住址\",\n    ],\n    \"phone\": [\n        \"電話\", \"電話番号\", \"携帯\", \"携帯番号\", \"tel\", \"telephone\", \"phone\",\n        \"teléfono\", \"telefono\", \"telefone\", \"telefon\", \"téléphone\",\n        \"телефон\", \"هاتف\", \"الهاتف\", \"전화\", \"전화번호\", \"휴대폰\",\n        \"电话\", \"電話號碼\", \"fax\", \"ファックス\",\n    ],\n    \"email\": [\n        \"メール\", \"メールアドレス\", \"email\", \"e-mail\", \"mail\", \"correo\",\n        \"courriel\", \"e-mailadresse\", \"emailadresse\", \"posta\", \"eposta\",\n        \"электроннаяпочта\", \"почта\", \"البريد\", \"بريد\", \"이메일\", \"邮箱\",\n        \"郵件\", \"电子邮箱\", \"電子郵件\",\n    ],\n    \"id\": [\n        \"id\", \"番号\", \"顧客番号\", \"取引先コード\", \"コード\", \"法人番号\",\n        \"税番号\", \"code\", \"customerid\", \"clientid\", \"kundennummer\",\n        \"número\", \"numero\", \"código\", \"codigo\", \"codice\", \"numéro\",\n        \"номер\", \"код\", \"numara\", \"kod\", \"الرقم\", \"رقم\", \"nomor\",\n        \"번호\", \"고객번호\", \"사업자번호\", \"編號\", \"编号\", \"统一社会信用代码\",\n        \"vat\", \"taxid\", \"cif\", \"cnpj\", \"cpf\", \"rfc\",\n    ],\n}\n_ROLE_LOOKUP = {}\nfor _role, _words in _ROLE_SYNONYMS.items():\n    for _w in _words:\n        _ROLE_LOOKUP[_role_key(_w)] = _role\n# the canonical role names themselves also resolve\nfor _r in ROLES:\n    _ROLE_LOOKUP[_role_key(_r)] = _r\n\n\ndef resolve_role(text):\n    \"\"\"Resolve a human-typed role word to a canonical role, tolerating\n    fullwidth/halfwidth, case, spaces, punctuation and synonyms.\n    Returns None when it cannot be resolved.\"\"\"\n    if text is None:\n        return None\n    key = _role_key(str(text))\n    if not key:\n        return None\n    return _ROLE_LOOKUP.get(key)\n\n\n_EMAIL_RE = re.compile(r\"^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$\")\n_PHONE_RE = re.compile(r\"^\\+?[\\d\\s\\-()]{7,}$\")\n\n\ndef infer_roles(headers, rows):\n    \"\"\"Propose a role per column: header synonyms first, then value\n    patterns. Only the first 'name' column is kept as name (further\n    name-like columns stay usable but marked 'other' unless a human\n    promotes them).\"\"\"\n    roles = []\n    used_name = False\n    sample = rows[:200]\n    for ci, h in enumerate(headers):\n        role = resolve_role(h)\n        if role is None:\n            values = [r[ci] for r in sample if r[ci].strip()]\n            if values:\n                email_like = sum(1 for v in values if _EMAIL_RE.match(v.strip()))\n                phone_like = sum(1 for v in values\n                                 if _PHONE_RE.match(v.strip())\n                                 and len(re.sub(r\"\\D\", \"\", v)) >= 7)\n                if email_like >= max(1, len(values) // 2):\n                    role = \"email\"\n                elif phone_like >= max(1, len(values) // 2):\n                    role = \"phone\"\n            if role is None:\n                role = \"other\"\n        if role == \"name\":\n            if used_name:\n                role = \"other\"\n            else:\n                used_name = True\n        roles.append(role)\n    return roles\n\n\n# ---------------------------------------------------------------------------\n# Candidate detection (exact-after-normalization only)\n# ---------------------------------------------------------------------------\n\nclass Group:\n    \"\"\"One candidate duplicate group.\"\"\"\n    __slots__ = (\"row_indices\", \"tier\", \"reasons\", \"name_key\")\n\n    def __init__(self, row_indices, tier, reasons, name_key=\"\"):\n        self.row_indices = row_indices      # indices into engine.rows\n        self.tier = tier                    # \"A\" | \"B\" | \"C\"\n        self.reasons = reasons              # list of roles that matched\n        self.name_key = name_key\n\n    def __repr__(self):\n        return f\"<Group tier={self.tier} rows={self.row_indices} {self.reasons}>\"\n\n\nclass _UnionFind:\n    def __init__(self, n):\n        self.p = list(range(n))\n\n    def find(self, x):\n        while self.p[x] != x:\n            self.p[x] = self.p[self.p[x]]\n            x = self.p[x]\n        return x\n\n    def union(self, a, b):\n        ra, rb = self.find(a), self.find(b)\n        if ra != rb:\n            self.p[rb] = ra\n\n\ndef _field_keys(role, value):\n    \"\"\"All exact-match keys a cell contributes for its role.\"\"\"\n    if role == \"name\":\n        k = nz.normalize_name(value)\n        return {k} if k else set()\n    if role == \"phone\":\n        return nz.phone_keys(value)\n    if role == \"email\":\n        k = nz.normalize_email(value)\n        return {k} if k and \"@\" in k else set()\n    if role == \"id\":\n        k = nz.normalize_id(value)\n        return {k} if k else set()\n    if role == \"address\":\n        k = nz.normalize_address(value)\n        return {k} if k else set()\n    return set()\n\n\nclass Engine:\n    \"\"\"Working dataset + candidate detection + approved merges + undo\n    + learned not-a-duplicate pairs + session save/load.\"\"\"\n\n    def __init__(self):\n        self.headers = []\n        self.roles = []\n        self.rows = []              # list of {\"uid\": int, \"values\": [str]}\n        self._next_uid = 1\n        self.source_path = \"\"\n        self.merge_log = []         # list of dicts (see apply_merge)\n        self.not_dup = set()        # set of frozenset({sigA, sigB})\n        self._original = []         # snapshot at load: [{\"uid\",\"values\"}]\n\n    # -- loading -------------------------------------------------------------\n    def load(self, table, source_path=\"\"):\n        self.headers = list(table.headers)\n        self.rows = []\n        self._next_uid = 1\n        for r in table.rows:\n            self.rows.append({\"uid\": self._next_uid,\n                              \"values\": list(r)})\n            self._next_uid += 1\n        self._original = [{\"uid\": r[\"uid\"], \"values\": list(r[\"values\"])}\n                          for r in self.rows]\n        self.roles = infer_roles(self.headers, table.rows)\n        self.source_path = source_path\n        self.merge_log = []\n        return self\n\n    def set_roles(self, roles):\n        assert len(roles) == len(self.headers)\n        self.roles = list(roles)\n\n    def _role_cols(self, role):\n        return [i for i, r in enumerate(self.roles) if r == role]\n\n    # -- detection ------------------------------------------------------------\n    # Roles whose exact key can CREATE a candidate group. Address is a\n    # supporting reason only: a shared (possibly partial) address must\n    # never glue unrelated rows into a group on its own.\n    UNION_ROLES = (\"name\", \"phone\", \"email\", \"id\")\n\n    def detect(self):\n        \"\"\"Return candidate Groups. Deterministic, dict-based\n        (no O(n^2) pairwise scan).\"\"\"\n        n = len(self.rows)\n        uf = _UnionFind(n)\n        # per-row exact keys for every key role (computed once)\n        row_keys = []\n        for row in self.rows:\n            per_role = {}\n            for role in KEY_ROLES:\n                keys = set()\n                for ci in self._role_cols(role):\n                    keys |= _field_keys(role, row[\"values\"][ci])\n                per_role[role] = keys\n            row_keys.append(per_role)\n        # union rows that share an exact key in a union role\n        for role in self.UNION_ROLES:\n            m = {}\n            for idx in range(n):\n                for k in row_keys[idx][role]:\n                    m.setdefault(k, []).append(idx)\n            for idxs in m.values():\n                if len(idxs) >= 2:\n                    first = idxs[0]\n                    for other in idxs[1:]:\n                        uf.union(first, other)\n        comps = {}\n        for i in range(n):\n            comps.setdefault(uf.find(i), []).append(i)\n        name_cols = self._role_cols(\"name\")\n        groups = []\n        for members in comps.values():\n            if len(members) < 2:\n                continue\n            members = sorted(members)\n            # reasons: roles where >=2 members share one exact key\n            reasons = []\n            for role in KEY_ROLES:\n                seen = {}\n                for idx in members:\n                    for k in row_keys[idx][role]:\n                        seen[k] = seen.get(k, 0) + 1\n                if any(c >= 2 for c in seen.values()):\n                    reasons.append(role)\n            # name agreement: all members share one non-empty name key\n            name_key = \"\"\n            name_same = False\n            if name_cols:\n                keys = {nz.normalize_name(self.rows[idx][\"values\"][name_cols[0]])\n                        for idx in members}\n                if len(keys) == 1 and next(iter(keys)):\n                    name_same = True\n                    name_key = next(iter(keys))\n            if name_same and any(r in reasons\n                                 for r in (\"phone\", \"email\", \"address\")):\n                tier = \"A\"\n            elif name_same:\n                tier = \"B\"\n            elif any(r in reasons for r in (\"phone\", \"email\", \"id\")):\n                tier = \"C\"\n            else:\n                continue\n            # learned exclusions (pairs only)\n            if len(members) == 2:\n                sigs = frozenset(\n                    nz.row_signature(self.rows[i][\"values\"]) for i in members)\n                if len(sigs) == 2 and sigs in self.not_dup:\n                    continue\n            groups.append(Group(members, tier, reasons, name_key))\n        tier_order = {\"A\": 0, \"B\": 1, \"C\": 2}\n        groups.sort(key=lambda g: (tier_order[g.tier], -len(g.row_indices),\n                                   g.row_indices[0]))\n        return groups\n\n    # -- merging ---------------------------------------------------------------\n    def default_choices(self, group):\n        \"\"\"Per column: first non-empty value among members (row order).\"\"\"\n        choices = {}\n        for ci in range(len(self.headers)):\n            val = \"\"\n            for idx in group.row_indices:\n                v = self.rows[idx][\"values\"][ci]\n                if v.strip():\n                    val = v\n                    break\n            choices[ci] = val\n        return choices\n\n    def apply_merge(self, group, choices, when=None):\n        \"\"\"Merge one human-approved group. Returns the log entry.\"\"\"\n        members = [self.rows[i] for i in group.row_indices]\n        positions = list(group.row_indices)\n        merged_values = [choices.get(ci, \"\") for ci in range(len(self.headers))]\n        merged_uid = self._next_uid\n        self._next_uid += 1\n        entry = {\n            \"when\": when or datetime.now().isoformat(timespec=\"seconds\"),\n            \"tier\": group.tier,\n            \"reasons\": list(group.reasons),\n            \"members\": [{\"uid\": m[\"uid\"], \"values\": list(m[\"values\"]),\n                         \"position\": p}\n                        for m, p in zip(members, positions)],\n            \"merged_uid\": merged_uid,\n            \"merged_values\": list(merged_values),\n        }\n        member_uids = {m[\"uid\"] for m in members}\n        first_pos = min(positions)\n        new_rows = []\n        for i, row in enumerate(self.rows):\n            if i == first_pos:\n                new_rows.append({\"uid\": merged_uid, \"values\": list(merged_values)})\n            if row[\"uid\"] in member_uids:\n                continue\n            new_rows.append(row)\n        self.rows = new_rows\n        self.merge_log.append(entry)\n        return entry\n\n    def undo_last_merge(self):\n        \"\"\"Undo the most recent merge, restoring the original rows at\n        their original positions. Returns the undone entry or None.\"\"\"\n        if not self.merge_log:\n            return None\n        entry = self.merge_log.pop()\n        merged_uid = entry[\"merged_uid\"]\n        self.rows = [r for r in self.rows if r[\"uid\"] != merged_uid]\n        for m in sorted(entry[\"members\"], key=lambda x: x[\"position\"]):\n            pos = min(m[\"position\"], len(self.rows))\n            self.rows.insert(pos, {\"uid\": m[\"uid\"],\n                                   \"values\": list(m[\"values\"])})\n        return entry\n\n    # -- learned not-a-duplicate ----------------------------------------------\n    def mark_not_duplicate(self, group):\n        \"\"\"Record all pairs in the group as 'not duplicates' (learned).\n        Returns the number of pairs recorded.\"\"\"\n        sigs = [nz.row_signature(self.rows[i][\"values\"])\n                for i in group.row_indices]\n        count = 0\n        for a in range(len(sigs)):\n            for b in range(a + 1, len(sigs)):\n                if sigs[a] != sigs[b]:\n                    self.not_dup.add(frozenset((sigs[a], sigs[b])))\n                    count += 1\n        return count\n\n    # -- export ------------------------------------------------------------------\n    def export_table(self):\n        return Table(list(self.headers),\n                     [list(r[\"values\"]) for r in self.rows])\n\n    def log_records(self):\n        \"\"\"Merge log as flat rows for CSV export.\"\"\"\n        out = []\n        for e in self.merge_log:\n            names = []\n            name_cols = self._role_cols(\"name\")\n            for m in e[\"members\"]:\n                names.append(m[\"values\"][name_cols[0]] if name_cols else \"\")\n            chosen = \"; \".join(\n                f\"{self.headers[ci]}={v}\"\n                for ci, v in enumerate(e[\"merged_values\"]) if v)\n            out.append({\n                \"when\": e[\"when\"], \"tier\": e[\"tier\"],\n                \"reasons\": \"+\".join(e[\"reasons\"]),\n                \"members\": \" | \".join(names),\n                \"member_count\": len(e[\"members\"]),\n                \"chosen\": chosen,\n            })\n        return out\n\n    # -- session -------------------------------------------------------------------\n    def save_session(self, path):\n        data = {\n            \"version\": 1,\n            \"headers\": self.headers,\n            \"roles\": self.roles,\n            \"source_path\": self.source_path,\n            \"next_uid\": self._next_uid,\n            \"original\": self._original,\n            \"rows\": [{\"uid\": r[\"uid\"], \"values\": r[\"values\"]}\n                     for r in self.rows],\n            \"merge_log\": self.merge_log,\n            \"not_dup\": [sorted(p) for p in self.not_dup],\n        }\n        with open(path, \"w\", encoding=\"utf-8\") as fh:\n            json.dump(data, fh, ensure_ascii=False, indent=1)\n\n    def load_session(self, path):\n        with open(path, \"r\", encoding=\"utf-8\") as fh:\n            data = json.load(fh)\n        self.headers = data[\"headers\"]\n        self.roles = data[\"roles\"]\n        self.source_path = data.get(\"source_path\", \"\")\n        self._next_uid = data[\"next_uid\"]\n        self._original = data[\"original\"]\n        self.rows = [{\"uid\": r[\"uid\"], \"values\": list(r[\"values\"])}\n                     for r in data[\"rows\"]]\n        self.merge_log = data[\"merge_log\"]\n        self.not_dup = {frozenset(p) for p in data.get(\"not_dup\", [])}\n        return self\n"}, {"p": "i18n.py", "s": 43604, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"i18n for UniList - 13 languages, same structure/order as the\nuser's other apps. The app title itself comes from appinfo.py\n(Japanese UI: UniList; other languages: UniList).\"\"\"\n\nLANG_ORDER = [\"ja\", \"en\", \"es\", \"zh_CN\", \"fr\", \"de\", \"pt\", \"ru\", \"it\",\n              \"tr\", \"ar\", \"id\", \"ko\"]\nLANG_NAMES = {\n    \"ja\": \"日本語\", \"en\": \"English\", \"es\": \"Español\", \"zh_CN\": \"简体中文\",\n    \"fr\": \"Français\", \"de\": \"Deutsch\", \"pt\": \"Português\", \"ru\": \"Русский\",\n    \"it\": \"Italiano\", \"tr\": \"Türkçe\", \"ar\": \"العربية\",\n    \"id\": \"Bahasa Indonesia\", \"ko\": \"한국어\",\n}\nRTL_LANGS = {\"ar\"}\n\nJA = {\n    \"app_subtitle\": \"顧客・取引先リストの重複を、人が確認しながら1件にまとめるアプリ\",\n    \"lang_label\": \"表示言語:\",\n    \"btn_open\": \"📂 リストを開く\",\n    \"btn_save_session\": \"セッションを保存\",\n    \"btn_load_session\": \"セッションを開く\",\n    \"lbl_no_file\": \"ファイルが読み込まれていません\",\n    \"lbl_rows_count\": \"{count} 行\",\n    \
