\": \"통합했습니다. 취소할 수도 있습니다\",\n    \"msg_undone\": \"통합을 취소했습니다\",\n    \"msg_notdup\": \"'중복이 아님'으로 기록했습니다. 다음에 불러올 때도 후보에 나오지 않습니다\",\n    \"msg_exported\": \"내보냈습니다: {name}\",\n    \"msg_log_exported\": \"통합 로그를 내보냈습니다: {name}\",\n    \"msg_session_saved\": \"세션을 저장했습니다\",\n    \"msg_session_loaded\": \"세션을 불러왔습니다\",\n    \"msg_role_unresolved\": \"'{text}'의 역할을 알 수 없어 '기타'로 설정했습니다\",\n    \"msg_select_group\": \"먼저 후보 그룹을 선택하세요\",\n    \"msg_overwrite_blocked\": \"원본 파일과 같은 위치에는 내보낼 수 없습니다. 다른 파일 이름을 선택하세요\",\n    \"msg_no_key_col\": \"이름·전화·이메일·ID 중 하나의 역할을 가진 열이 필요합니다\",\n    \"msg_error\": \"오류: {detail}\",\n}\n\nSTRINGS = {\n    \"ja\": JA, \"en\": EN, \"es\": ES, \"zh_CN\": ZH, \"fr\": FR, \"de\": DE,\n    \"pt\": PT, \"ru\": RU, \"it\": IT, \"tr\": TR, \"ar\": AR, \"id\": ID, \"ko\": KO,\n}\n\n\ndef tr(lang, key, **params):\n    s = STRINGS.get(lang, EN).get(key) or EN.get(key) or key\n    if params:\n        try:\n            s = s.format(**params)\n        except (KeyError, IndexError):\n            pass\n    return s\n"}, {"p": "MakeApp-Mac.command", "s": 3577, "l": "bash", "c": "#!/bin/bash\n# UniList - build a standalone macOS app (UniList.app)\n#\n# How to use (this is the standard way to get the Mac app):\n#   1. Download the UniList-Source.zip and extract it.\n#   2. Double-click this file:  MakeApp-Mac.command\n#      (First time only: macOS may block it because it is unsigned.\n#       Right-click the file -> \"Open\" -> \"Open\" to run it once.)\n#   3. When the build finishes, the app appears in the \"dist\" folder:\n#         dist/UniList.app\n#   4. From then on, just double-click UniList.app to use it.\n#      (The .app is also unsigned, so the first launch of the app\n#       itself needs the same right-click -> \"Open\" once.)\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== UniList - build the macOS app ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Building the app needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + build tools -----------------------------------\nif [ ! -x \".venv-build/bin/python\" ]; then\n  echo \"Preparing the build environment (first run only)...\"\n  $PY -m venv .venv-build || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv-build/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv-build/bin/python -m pip install PySide6 openpyxl pyinstaller || { echo \"Failed to install the build tools. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nHOST_ARCH=\"$(uname -m)\"\necho \"This Mac's chip: $HOST_ARCH\"\necho \"Building UniList.app (this can take a few minutes)...\"\n\n# Try a universal2 build first (one app that runs on both Apple\n# Silicon and Intel Macs). The python.org Python and PySide6 are\n# universal2, so this normally succeeds. If this Mac's Python is\n# single-architecture, the universal build fails and we fall back to\n# a native build for this Mac's chip automatically.\nBUILT_ARCH=\"\"\nif .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name UniList --icon assets/icon.icns --target-arch universal2 app.py; then\n  BUILT_ARCH=\"universal2 (Apple Silicon + Intel)\"\nelse\n  echo \"\"\n  echo \"The universal2 build did not work on this Mac, so the app\"\n  echo \"is being built for this Mac's chip only ($HOST_ARCH).\"\n  echo \"\"\n  rm -rf dist build UniList.spec\n  if .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name UniList --icon assets/icon.icns app.py; then\n    BUILT_ARCH=\"native ($HOST_ARCH only)\"\n  else\n    echo \"The build failed. See the messages above.\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"Done! Your app is here:\"\necho \"  $(pwd)/dist/UniList.app\"\necho \"Architecture of the built app: $BUILT_ARCH\"\necho \"Supported systems: macOS 11 (Big Sur) or later.\"\necho \"\"\necho \"Double-click UniList.app to use it.\"\necho \"First launch only: if macOS blocks it, right-click the app\"\necho \"and choose \\\"Open\\\" once (the app is unsigned).\"\necho \"\"\nread -r -p \"Press Enter to close this window.\"\n"}, {"p": "normalize.py", "s": 8659, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Deterministic normalization for UniList.\n\nEvery comparison in this app is EXACT equality after the deterministic\nnormalization in this module. There is NO similarity / fuzzy matching\nanywhere (no difflib, no Levenshtein): two values are candidates only\nwhen their normalized keys are identical strings.\n\nThe legal-form tables are reused from MatchDetective (same project\nfamily, same deterministic approach).\n\"\"\"\nimport hashlib\nimport re\nimport unicodedata\n\n_SMALL_KANA = str.maketrans(\"ァィゥェォッャュョヮヵヶ\", \"アイウエオツヤユヨワカケ\")\n_HIRA_TO_KATA = {c: chr(c + 0x60) for c in range(0x3041, 0x3097)}\n\n\ndef base_normalize(s):\n    \"\"\"NFKC (fullwidth->halfwidth, halfwidth kana->fullwidth,\n    ㈱->(株) ...) plus case-folding.\"\"\"\n    if s is None:\n        return \"\"\n    return unicodedata.normalize(\"NFKC\", str(s)).casefold()\n\n\ndef fold_latin_accents(t):\n    \"\"\"Fold Latin accents (é->e, ü->u, ñ->n) deterministically.\n\n    Only characters in the Latin ranges are decomposed and stripped of\n    combining marks; other scripts (Japanese kana dakuten etc.) are\n    left untouched.\"\"\"\n    out = []\n    for ch in t:\n        if ord(ch) < 0x250:\n            d = unicodedata.normalize(\"NFD\", ch)\n            out.append(\"\".join(c for c in d\n                               if unicodedata.category(c) != \"Mn\"))\n        else:\n            out.append(ch)\n    return \"\".join(out)\n\n\n# --- legal-entity forms (reused from MatchDetective) -------------------------\n_JP_FORMS = [\"株式会社\", \"有限会社\", \"合同会社\", \"合名会社\", \"合資会社\",\n             \"一般社団法人\", \"一般財団法人\", \"公益社団法人\", \"公益財団法人\",\n             \"医療法人\", \"学校法人\", \"社会福祉法人\", \"特定非営利活動法人\",\n             \"(株)\", \"(有)\", \"（株）\", \"（有）\", \"(同)\", \"（同）\"]\n_KR_FORMS = [\"주식회사\", \"(주)\", \"유한회사\", \"유한책임회사\", \"합자회사\", \"합명회사\",\n             \"(유)\", \"(합)\"]\n_CN_FORMS = [\"股份有限公司\", \"有限责任公司\", \"有限公司\"]\n_AR_FORMS = [\"شركة ذات مسؤولية محدودة\", \"ذات مسؤولية محدودة\",\n             \"شركة مساهمة\", \"مؤسسة فردية\", \"ذ.م.م\", \"ذ م م\",\n             \"ش.م.م\", \"ش م م\", \"شركة\", \"مؤسسة\"]\n_TR_FORMS = [\"limited şirketi\", \"ltd. şti.\", \"ltd. sti.\", \"koll. şti.\",\n             \"kom. şti.\", \"a.ş.\", \"a.s.\", \"şti.\", \"sti.\"]\n_RU_FORMS = [\"ооо\", \"оао\", \"пао\", \"ао\", \"зао\", \"ип\"]\n_LEGAL_TOKENS = {\n    \"inc\", \"corp\", \"corporation\", \"ltd\", \"limited\", \"llc\", \"llp\", \"lp\",\n    \"co\", \"company\", \"pc\", \"pty\", \"pte\", \"pvt\", \"bvba\",\n    \"gmbh\", \"ag\", \"kg\", \"kgaa\", \"ohg\", \"ek\", \"ug\", \"eg\",\n    \"sa\", \"sas\", \"sarl\", \"sl\", \"srl\", \"spa\", \"sca\", \"lda\",\n    \"bv\", \"nv\", \"vof\", \"cv\",\n    \"ab\", \"as\", \"oy\", \"oyj\", \"aps\", \"ehf\",\n    \"ltda\", \"limitada\", \"eireli\", \"epp\", \"me\", \"unipessoal\",\n    \"ooo\", \"pao\", \"ao\", \"zao\", \"ip\",\n    \"pt\", \"perseroan\", \"terbatas\", \"ud\", \"firma\", \"fa\", \"koperasi\",\n    \"sro\", \"spzoo\", \"kft\", \"zrt\",\n}\n_LEGAL_PHRASES = [r\"s\\.?a\\.?\\s*de\\s*c\\.?v\\.?\", r\"s\\.?a\\.?\\s*de\\s*c\\.?v\",\n                  r\"sdn\\.?\\s*bhd\\.?\", r\"(?<![a-z])p\\.?t\\.?(?![a-z])\",\n                  r\"(?<![a-z])c\\.?v\\.?(?![a-z])\", r\"(?<![a-z])b\\.?v\\.?(?![a-z])\",\n                  r\"s\\.a\\.s\\.?\", r\"s\\.a\\.r\\.l\\.?\", r\"s\\.a\\.?\", r\"s\\.l\\.?\",\n                  r\"s\\.r\\.l\\.?\", r\"l\\.l\\.c\\.?\", r\"l\\.l\\.p\\.?\", r\"p\\.l\\.c\\.?\",\n                  r\"p\\.c\\.?\", r\"e\\.k\\.?\", r\"s\\.c\\.a\\.?\"]\n\n\ndef normalize_name(s):\n    \"\"\"Company / person name comparison key.\n\n    width/case folded, Latin accents folded, legal forms stripped,\n    hiragana unified to katakana, small kana unified, and all spaces\n    and punctuation removed. Equality of this key is the ONLY way two\n    names are considered 'the same name'.\"\"\"\n    t = base_normalize(s)\n    t = fold_latin_accents(t)\n    # Turkish fold: dotted/dotless i variants merge\n    t = t.replace(\"i̇\", \"i\").replace(\"ı\", \"i\")\n    for form in _JP_FORMS + _KR_FORMS + _CN_FORMS + _AR_FORMS + _TR_FORMS:\n        t = t.replace(form.casefold(), \" \")\n    if re.search(r\"[a-zа-яё]\", t):\n        # Latin/Cyrillic-script names: phrase + token legal-form stripping\n        for phrase in _LEGAL_PHRASES:\n            t = re.sub(phrase, \" \", t)\n        for form in _RU_FORMS:\n            t = re.sub(r\"(?<![0-9a-zа-яё])\" + form + r\"(?![0-9a-zа-яё])\",\n                       \" \", t)\n        tokens = re.findall(r\"[0-9a-z]+|[^\\s0-9a-z]\", t)\n        kept = []\n        buf = \"\"\n        for tok in tokens:\n            if re.fullmatch(r\"[0-9a-z]+\", tok):\n                if tok in _LEGAL_TOKENS:\n                    if buf:\n                        kept.append(buf)\n                        buf = \"\"\n                    continue\n                buf += tok\n            else:\n                if buf:\n                    kept.append(buf)\n                    buf = \"\"\n                kept.append(tok)\n        if buf:\n            kept.append(buf)\n        t = \"\".join(tok for tok in kept\n                    if not (re.fullmatch(r\"[0-9a-z]+\", tok) is None\n                            and not tok.strip(\"()[]{}.,&・/\\\\-_'\\\"«»„“”‚‘’\")))\n    t = t.translate(_HIRA_TO_KATA)\n    t = t.translate(_SMALL_KANA)\n    if t.endswith(\"集团\"):\n        t = t[:-2]\n    # final key: no spaces, no punctuation at all\n    t = re.sub(r\"[\\s\\W_]+\", \"\", t, flags=re.UNICODE)\n    return t.strip()\n\n\n# --- phone -------------------------------------------------------------------\n# Common country calling codes (for deterministic trunk / CC handling).\n_COUNTRY_CODES = [\n    \"886\", \"852\", \"853\", \"420\", \"358\", \"353\", \"380\", \"234\", \"254\",\n    \"81\", \"82\", \"86\", \"44\", \"33\", \"49\", \"61\", \"91\", \"55\", \"34\", \"39\",\n    \"31\", \"65\", \"84\", \"66\", \"62\", \"60\", \"63\", \"64\", \"41\", \"46\", \"47\",\n    \"45\", \"48\", \"90\", \"52\", \"54\", \"56\", \"51\", \"27\", \"20\", \"36\", \"43\",\n    \"32\", \"30\", \"351\", \"7\", \"1\",\n]\n_EXT_RE = re.compile(r\"(?i)(ext\\.?|extension|x|内線|;)\\s*\\d+\\s*$\")\n\n\ndef phone_keys(s):\n    \"\"\"Return a SET of deterministic keys for a phone number.\n\n    The set always contains the full digit string (country code kept,\n    '00' international prefix folded into it). International numbers\n    also yield their national significant number (country code\n    stripped); domestic numbers also yield their trunk-'0'-stripped\n    form. Two numbers match when their key sets intersect - still\n    exact string equality, just over the canonical variants.\"\"\"\n    if s is None:\n        return set()\n    t = unicodedata.normalize(\"NFKC\", str(s)).strip()\n    if not t:\n        return set()\n    t = _EXT_RE.sub(\"\", t)\n    international = t.startswith(\"+\") or t.startswith(\"00\")\n    digits = re.sub(r\"\\D\", \"\", t)\n    if not digits:\n        return set()\n    if t.startswith(\"00\"):\n        digits = digits[2:]\n        international = True\n    keys = {digits}\n    if international:\n        for cc in _COUNTRY_CODES:\n            if digits.startswith(cc) and len(digits) > len(cc) + 3:\n                keys.add(digits[len(cc):])\n                break\n    elif digits.startswith(\"0\"):\n        keys.add(digits[1:])\n    return {k for k in keys if len(k) >= 5}\n\n\ndef normalize_phone(s):\n    \"\"\"Primary (display) phone key: the longest canonical digit form.\"\"\"\n    keys = phone_keys(s)\n    if not keys:\n        return \"\"\n    return max(keys, key=len)\n\n\ndef normalize_email(s):\n    \"\"\"Email key: width/case folded, spaces removed. Exact match only.\"\"\"\n    t = base_normalize(s)\n    return re.sub(r\"\\s+\", \"\", t).strip()\n\n\ndef normalize_address(s):\n    \"\"\"Address key: width/case folded, Latin accents folded, digits\n    unified by NFKC, all spaces and punctuation removed.\"\"\"\n    t = base_normalize(s)\n    t = fold_latin_accents(t)\n    t = t.translate(_HIRA_TO_KATA)\n    t = t.translate(_SMALL_KANA)\n    t = re.sub(r\"[\\s\\W_]+\", \"\", t, flags=re.UNICODE)\n    return t.strip()\n\n\ndef normalize_id(s):\n    \"\"\"ID key (corporate number, customer code, tax id...): width/case\n    folded, spaces and hyphens removed. Exact match only.\"\"\"\n    t = base_normalize(s)\n    return re.sub(r\"[\\s\\-‐ー]+\", \"\", t).strip()\n\n\ndef normalize_generic(s):\n    \"\"\"Loose-but-deterministic key used for row signatures:\n    width/case fold + whitespace collapse.\"\"\"\n    t = base_normalize(s)\n    return re.sub(r\"\\s+\", \" \", t).strip()\n\n\ndef row_signature(values):\n    \"\"\"Content-based signature of a row (stable across sessions and\n    reloads of the same file). Used for the learned 'not a duplicate'\n    pairs so the judgement survives reloading the list.\"\"\"\n    joined = \"\\x1f\".join(normalize_generic(v) for v in values)\n    return hashlib.sha1(joined.encode(\"utf-8\")).hexdigest()\n"}, {"p": "README-SOURCE.txt", "s": 893, "l": "plaintext", "c": "UniList - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of UniList, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-UniList.bat (or: python app.py)\n- Mac: Start-UniList.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 7388, "l": "plaintext", "c": "================================================================\nUniList（ユニリスト） v1.0.0\n顧客・取引先リストの重複を、人が確認しながら1件にまとめるアプリ\n================================================================\n\n■ このアプリがすること\n顧客・取引先リスト（CSV／Excel）を読み込むと、国ごとの表記ルールで\n名前・電話・メール・住所・IDを正規化し、「重複らしいグループ」を\n候補として提示します。左右比較のプレビューで項目ごとに\n「どちらの値を残すか」を選んで統合できます。\n\n■ 大切な約束\n・統合するのは、人が承認したグループだけです。\nアプリが勝手に消すことはありません。\n・元ファイルは一切変更しません。結果は新しいファイルに書き出します。\n・統合はいつでも取り消せます。統合ログとセッション保存で、\nいつでも元に戻せる記録が残ります。\n・候補の判定に「あいまいな照合（類似度・ファジー）」は使いません。\n正規化した結果が完全に一致したものだけが候補になります。\n・「重複ではない」と判断したペアは記録され、次回読み込み時も\n候補に出なくなります。\n・オフラインで動作します。外部への送信・連携はありません。\n\n■ 候補の段位（確からしさは類似度ではなく決定的な段位で表示）\nA：名前が一致し、電話・メール・住所のいずれかも一致（強い候補）\nB：名前のみ一致\nC：電話・メール・IDのいずれかが一致するが名前は一致しない\n（社名変更などの可能性があるため、理由を明示して弱い候補として表示）\n各候補には「どの項目が完全一致したか」が必ず表示されます。\n\n================================================================\n■ Windows（EXE版）の使い方\n================================================================\n※EXE版は 64ビット（x64）向けです。Windows 10／11 の64ビット版で\n  お使いください。\n1. UniList-Windows.zip をダウンロードして展開します。\n2. フォルダの中の UniList.exe をダブルクリックします。\n※フォルダごと使う形です。EXEだけを外に出すと動きません。\n※署名のないアプリのため、初回起動時にWindowsの保護\n（SmartScreen）の警告が出る場合があります。その場合は\n「詳細情報」→「実行」の順に進んでください。\n\n■ Windows（ソース版）の使い方\n1. UniList-Source.zip を展開します。\n2. Start-UniList.bat をダブルクリックします。\n初回だけ必要なライブラリを自動で入れます（Pythonが必要です）。\n\n================================================================\n■ Mac での使い方（ダウンロード配布の流れ）\n================================================================\nMac版は「アプリ生成スクリプト」をダウンロードして、\nお使いのMac上でアプリ本体を生成する形です。\n対応は macOS 11（Big Sur）以降です。それより古いmacOSの\nIntel Macは対象外です。\n生成される .app は、実行したMacのチップに合わせて組み立てられます。\n通常は Apple Silicon と Intel の両方で動く universal2 版ができ、\n環境によってはそのMac専用（Apple Silicon機ならarm64、\nIntel機ならx86_64）の版になります。どちらで作れたかは、\n生成スクリプトの最後に画面表示されます。\n\n1. UniList-Source.zip をダウンロードして展開します。\n2. 展開したフォルダの中の「MakeApp-Mac.command」を\nダブルクリックします。\n※初回だけ、macOSに止められる場合があります。その場合は\nファイルを右クリック→「開く」→「開く」で実行してください\n（署名のないスクリプトのための、macOS標準の手順です）。\n※Python 3 が無いMacでは、スクリプトが検出して入手方法\n（python.org のインストーラ／Homebrew／Xcodeコマンドライン\nツール）を画面に表示します。入れた後、もう一度ダブルクリック\nしてください。\n3. 生成が終わると、同じフォルダの「dist」の中に\n「UniList.app」ができます。\n4. 以後は UniList.app をダブルクリックして使います。\n※.app も署名がないため、初回起動時だけ右クリック→「開く」\nが必要です。\n\nソースから直接起動したい場合は「Start-UniList.command」\nでも起動できます（初回は環境を自動で用意します）。\n\nMac版は、開発側にMac実機がないため実機未検証です。\nWindows版と同じソースコード（Python＋PySide6）で動作する設計で、\n.app はお使いのMac上で上記スクリプトが生成します。\n\n================================================================\n■ 使い方の流れ（共通）\n================================================================\n1. リストを開く（CSV／TSV／xlsx／txt。文字コードと区切り文字は自動判定）\n2. 「列の役割」を確認する（アプリが推定して提示します。\n違っていたら画面で直せます。直接文字を打って修正しても、\n全角・半角や同義語のゆれは自動で吸収します）\n3. 「重複候補を探す」を押す\n4. 候補グループを選ぶと左右比較のプレビューが出ます。\n項目ごとに残す値を選んでください\n5. 「このグループを統合する」を押したグループだけが統合されます\n6. 統合済みリストを新しいファイルに書き出します\n\n================================================================\n■ 制限\n================================================================\n・名前の正規化は表記ルールに基づく決定的な処理です。\n漢数字の住所番地や、読みが全く異なる略称までは同一と判定しません\n（違う相手を候補に出さないための設計です）。\n・電話番号は国番号と国内の「0」をそろえて比較します。\n・大きなリスト（5万行程度）でも実用速度で動作します。\n\n================================================================\nEnglish summary\n================================================================\nUniList merges duplicate customers/vendors\nin a CSV/Excel list into one record. Candidates are EXACT matches\nafter deterministic normalization only - no fuzzy/similarity\nmatching. A human approves each group in a side-by-side preview,\nchoosing the value to keep per field. The original file is never\nmodified, merges can be undone, and pairs marked \"not duplicates\"\nare remembered. Windows: run UniList.exe (64-bit x64) from\nthe extracted folder. macOS 11 (Big Sur) or later: extract\nUniList-Source.zip, double-click MakeApp-Mac.command\n(right-click -> Open the first time), and it builds\ndist/UniList.app on your Mac - universal2 when possible,\notherwise native to your Mac's chip (older macOS on Intel Macs is\nnot supported). The macOS build has not been verified on a real\nMac (no Mac was available to the developer).\n"}, {"p": "requirements.txt", "s": 17, "l": "plaintext", "c": "PySide6\nopenpyxl\n"}, {"p": "Start-UniList.bat", "s": 409, "l": "dos", "c": "@echo off\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo app.py not found. Please extract the whole ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\npython -c \"import PySide6, openpyxl\" 2> nul\r\nif errorlevel 1 (\r\n  echo Installing required libraries (first run only)...\r\n  python -m pip install -r requirements.txt\r\n)\r\npython app.py\r\nif errorlevel 1 (\r\n  echo.\r\n  echo UniList stopped with an error. See above.\r\n  pause\r\n)\r\n"}, {"p": "Start-UniList.command", "s": 1598, "l": "bash", "c": "#!/bin/bash\n# UniList - macOS source launcher\n# Double-click this file to run UniList from the source code.\n# First launch only: if macOS blocks it, right-click the file and\n# choose \"Open\" once.\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== UniList (macOS, from source) ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"UniList needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + dependencies (first run only) -----------------\nif [ ! -x \".venv/bin/python\" ]; then\n  echo \"Preparing the app environment (first run only)...\"\n  $PY -m venv .venv || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv/bin/python -m pip install -r requirements.txt || { echo \"Failed to install the required libraries. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nexec .venv/bin/python app.py\n"}, {"p": "tests/test_nayose.py", "s": 12453, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tests for UniList core + GUI smoke.\n\nKey guarantees under test:\n- candidates are EXACT matches after deterministic normalization\n  (no fuzzy/similarity matching anywhere, enforced by a source scan)\n- tier A/B/C judgement is deterministic\n- only approved groups merge; merges can be undone exactly\n- export row-count invariant holds\n- 'not a duplicate' learning persists across reloads and sessions\n\"\"\"\nimport os\nimport sys\nimport time\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport pytest\n\nimport core\nimport normalize as nz\n\n\ndef make_engine(rows, headers=(\"名前\", \"住所\", \"電話\", \"メール\", \"ID\")):\n    eng = core.Engine()\n    eng.load(core.Table(list(headers), [list(r) for r in rows]))\n    return eng\n\n\n# ---------------------------------------------------------------------------\n# Normalization\n# ---------------------------------------------------------------------------\n\ndef test_name_jp_legal_forms():\n    assert nz.normalize_name(\"株式会社サクラ\") == nz.normalize_name(\"(株)さくら\")\n    assert nz.normalize_name(\"有限会社タナカ\") == nz.normalize_name(\"タナカ（有）\")\n    assert nz.normalize_name(\"合同会社ABC\") == nz.normalize_name(\"abc\")\n\n\ndef test_name_western_legal_forms():\n    assert nz.normalize_name(\"Alphacorp Inc.\") == nz.normalize_name(\"ALPHACORP\")\n    assert nz.normalize_name(\"Beta GmbH\") == nz.normalize_name(\"beta\")\n    assert nz.normalize_name(\"Acme B.V.\") == nz.normalize_name(\"acme\")\n    assert nz.normalize_name(\"Acme Pte. Ltd.\") == nz.normalize_name(\"ACME\")\n    assert nz.normalize_name(\"Delta S.A. de C.V.\") == nz.normalize_name(\"delta\")\n\n\ndef test_name_accent_folding():\n    assert nz.normalize_name(\"Müller GmbH\") == nz.normalize_name(\"MULLER\")\n    assert nz.normalize_name(\"Café René SARL\") == nz.normalize_name(\"cafe rene\")\n\n\ndef test_name_kana_folding():\n    assert nz.normalize_name(\"さくら\") == nz.normalize_name(\"サクラ\")\n    assert nz.normalize_name(\"じゃぱん\") == nz.normalize_name(\"ジャパン\")\n    assert nz.normalize_name(\"ｻｸﾗ\") == nz.normalize_name(\"サクラ\")\n\n\ndef test_name_width_and_case():\n    assert nz.normalize_name(\"ＡＢＣ商事\") == nz.normalize_name(\"abc商事\")\n\n\ndef test_phone_normalization():\n    assert nz.phone_keys(\"03-1234-5678\") == nz.phone_keys(\"0312345678\")\n    # international vs domestic trunk\n    assert nz.phone_keys(\"+81 90-1234-5678\") & nz.phone_keys(\"090-1234-5678\")\n    assert nz.phone_keys(\"0081-90-1234-5678\") & nz.phone_keys(\"090-1234-5678\")\n    # different numbers must not match\n    assert not (nz.phone_keys(\"03-1234-5678\") & nz.phone_keys(\"03-1234-5679\"))\n\n\ndef test_email_normalization():\n    assert nz.normalize_email(\" Foo@Example.COM \") == \"foo@example.com\"\n    assert nz.normalize_email(\"ｆｏｏ@example.com\") == \"foo@example.com\"\n\n\ndef test_address_normalization():\n    assert nz.normalize_address(\"東京都港区1-2-3\") == \\\n        nz.normalize_address(\"東京都 港区 １－２－３\")\n    assert nz.normalize_address(\"Hauptstraße 5\") == \\\n        nz.normalize_address(\"Hauptstrasse 5\")\n\n\ndef test_id_normalization():\n    assert nz.normalize_id(\"T1-2345-6789\") == nz.normalize_id(\"t123456789\")\n\n\n# ---------------------------------------------------------------------------\n# Column roles\n# ---------------------------------------------------------------------------\n\ndef test_role_inference_and_typed_resolution():\n    eng = make_engine([[\"x\", \"y\", \"z\", \"w\", \"v\"]],\n                      headers=(\"会社名\", \"住所\", \"電話番号\", \"メールアドレス\", \"顧客番号\"))\n    assert eng.roles == [\"name\", \"address\", \"phone\", \"email\", \"id\"]\n    # typed corrections tolerate width / case / spaces / synonyms\n    assert core.resolve_role(\"ＮＡＭＥ\") == \"name\"\n    assert core.resolve_role(\"会社 名\") == \"name\"\n    assert core.resolve_role(\"Telephone\") == \"phone\"\n    assert core.resolve_role(\"でんわ\") is None  # not a synonym: unresolved\n    assert core.resolve_role(\"住所\") == \"address\"\n    assert core.resolve_role(\"???\") is None\n\n\n# ---------------------------------------------------------------------------\n# Candidate detection / tiers\n# ---------------------------------------------------------------------------\n\ndef test_tier_a_name_and_phone():\n    eng = make_engine([\n        [\"株式会社サクラ\", \"東京\", \"03-1234-5678\", \"a@sakura.jp\", \"\"],\n        [\"(株)さくら\", \"大阪\", \"0312345678\", \"b@sakura.jp\", \"\"],\n    ])\n    groups = eng.detect()\n    assert len(groups) == 1\n    assert groups[0].tier == \"A\"\n    assert \"name\" in groups[0].reasons and \"phone\" in groups[0].reasons\n\n\ndef test_tier_b_name_only():\n    eng = make_engine([\n        [\"株式会社サクラ\", \"東京\", \"03-1111-1111\", \"a@x.jp\", \"\"],\n        [\"サクラ\", \"大阪\", \"06-2222-2222\", \"b@y.jp\", \"\"],\n    ])\n    groups = eng.detect()\n    assert len(groups) == 1 and groups[0].tier == \"B\"\n\n\ndef test_tier_c_contact_same_name_different():\n    eng = make_engine([\n        [\"サクラ商事\", \"東京\", \"03-1234-5678\", \"\", \"\"],\n        [\"サクラ物産\", \"大阪\", \"03-1234-5678\", \"\", \"\"],\n    ])\n    groups = eng.detect()\n    assert len(groups) == 1 and groups[0].tier == \"C\"\n    assert \"phone\" in groups[0].reasons\n\n\ndef test_three_member_group():\n    eng = make_engine([\n        [\"株式会社サクラ\", \"東京\", \"03-1234-5678\", \"\", \"\"],\n        [\"サクラ\", \"大阪\", \"06-9999-9999\", \"\", \"\"],\n        [\"(株)サクラ\", \"名古屋\", \"052-888-8888\", \"c@sakura.jp\", \"\"],\n    ])\n    groups = eng.detect()\n    assert len(groups) == 1 and len(groups[0].row_indices) == 3\n\n\ndef test_similar_but_not_equal_names_do_not_match():\n    eng = make_engine([\n        [\"サクラ商事\", \"東京\", \"03-1111-1111\", \"a@x.jp\", \"\"],\n        [\"サクラ商会\", \"大阪\", \"06-2222-2222\", \"b@y.jp\", \"\"],\n        [\"サクラ商事2\", \"名古屋\", \"052-333-3333\", \"c@z.jp\", \"\"],\n    ])\n    assert eng.detect() == []\n\n\ndef test_detection_performance_50k_rows():\n    rows = []\n    for i in range(25000):\n        rows.append([f\"会社{i}\", \"東京\", f\"03-{i:04d}-0000\", f\"u{i}@x.jp\", \"\"])\n        rows.append([f\"会社{i}\", \"大阪\", f\"06-{i:04d}-0000\", f\"v{i}@y.jp\", \"\"])\n    eng = make_engine(rows)\n    start = time.time()\n    groups = eng.detect()\n    elapsed = time.time() - start\n    assert len(groups) == 25000\n    assert elapsed < 20.0  # dict-based grouping; typically ~2-4s\n\n\n# ---------------------------------------------------------------------------\n# Merge / undo / export invariant\n# ---------------------------------------------------------------------------\n\ndef test_merge_with_chosen_values_and_undo():\n    original = [\n        [\"株式会社サクラ\", \"東京\", \"03-1234-5678\", \"a@sakura.jp\", \"\"],\n        [\"(株)さくら\", \"大阪\", \"0312345678\", \"b@sakura.jp\", \"\"],\n        [\"タナカ\", \"名古屋\", \"052-111-2222\", \"t@tanaka.jp\", \"\"],\n    ]\n    eng = make_engine(original)\n    group = eng.detect()[0]\n    choices = eng.default_choices(group)\n    choices[1] = \"大阪\"  # human picks the second row's address\n    eng.apply_merge(group, choices)\n    assert len(eng.rows) == 2\n    merged = eng.rows[0][\"values\"]\n    assert merged[1] == \"大阪\"\n    assert len(eng.merge_log) == 1\n    eng.undo_last_merge()\n    assert [r[\"values\"] for r in eng.rows] == original\n\n\ndef test_export_row_count_invariant():\n    rows = [\n        [\"株式会社サクラ\", \"東京\", \"03-1234-5678\", \"\", \"\"],\n        [\"サクラ\", \"大阪\", \"0312345678\", \"\", \"\"],\n        [\"(株)サクラ\", \"名古屋\", \"052-000-0000\", \"\", \"\"],\n        [\"タナカ\", \"福岡\", \"092-111-1111\", \"\", \"\"],\n    ]\n    eng = make_engine(rows)\n    group = eng.detect()[0]\n    assert len(group.row_indices) == 3\n    eng.apply_merge(group, eng.default_choices(group))\n    out = eng.export_table()\n    assert len(out.rows) == len(rows) - (3 - 1)\n\n\n# ---------------------------------------------------------------------------\n# Not-a-duplicate learning\n# ---------------------------------------------------------------------------\n\ndef test_not_duplicate_learning_persists_across_reload(tmp_path):\n    rows = [\n        [\"サクラ商事\", \"東京\", \"03-1234-5678\", \"\", \"\"],\n        [\"サクラ物産\", \"大阪\", \"03-1234-5678\", \"\", \"\"],\n    ]\n    eng = make_engine(rows)\n    group = eng.detect()[0]\n    eng.mark_not_duplicate(group)\n    assert eng.detect() == []\n    learned = set(eng.not_dup)\n    # reload the same file in a fresh engine, carrying the learned pairs\n    eng2 = make_engine(rows)\n    eng2.not_dup |= learned\n    assert eng2.detect() == []\n\n\ndef test_session_roundtrip_keeps_merges_and_learning(tmp_path):\n    rows = [\n        [\"株式会社サクラ\", \"東京\", \"03-1234-5678\", \"\", \"\"],\n        [\"サクラ\", \"大阪\", \"0312345678\", \"\", \"\"],\n        [\"タナカ\", \"名古屋\", \"052-111-2222\", \"\", \"\"],\n    ]\n    eng = make_engine(rows)\n    group = eng.detect()[0]\n    eng.apply_merge(group, eng.default_choices(group))\n    path = str(tmp_path / \"session.json\")\n    eng.save_session(path)\n    eng2 = core.Engine()\n    eng2.load_session(path)\n    assert len(eng2.rows) == 2\n    assert len(eng2.merge_log) == 1\n    # undo still works after a session reload\n    eng2.undo_last_merge()\n    assert [r[\"values\"] for r in eng2.rows] == rows\n\n\n# ---------------------------------------------------------------------------\n# File IO\n# ---------------------------------------------------------------------------\n\ndef test_load_shift_jis_and_semicolon(tmp_path):\n    path = tmp_path / \"list.csv\"\n    path.write_bytes(\"名前;電話\\nサクラ;03-1234-5678\\n\".encode(\"shift_jis\"))\n    table = core.load_table(str(path))\n    assert table.headers == [\"名前\", \"電話\"]\n    assert table.rows[0][0] == \"サクラ\"\n\n\ndef test_xlsx_roundtrip(tmp_path):\n    table = core.Table([\"名前\", \"電話\"],\n                       [[\"サクラ\", \"03-1234-5678\"], [\"タナカ\", \"06-1111-2222\"]])\n    path = str(tmp_path / \"out.xlsx\")\n    core.save_table_xlsx(table, path)\n    loaded = core.load_table(path)\n    assert loaded.headers == [\"名前\", \"電話\"]\n    assert len(loaded.rows) == 2\n\n\n# ---------------------------------------------------------------------------\n# Guard rails: no fuzzy matching, i18n completeness\n# ---------------------------------------------------------------------------\n\ndef test_no_fuzzy_matching_libraries():\n    import re as _re\n    root = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))\n    pattern = _re.compile(\n        r\"(?m)^\\s*(?:import|from)\\s+(difflib|levenshtein|fuzzywuzzy|\"\n        r\"rapidfuzz|jellyfish|thefuzz)\\b\")\n    for fname in os.listdir(root):\n        if fname.endswith(\".py\"):\n            with open(os.path.join(root, fname), encoding=\"utf-8\") as fh:\n                src = fh.read()\n            assert not pattern.search(src), f\"fuzzy import in {fname}\"\n            assert \"get_close_matches\" not in src, fname\n\n\ndef test_i18n_all_languages_complete():\n    import i18n\n    base = set(i18n.STRINGS[\"ja\"].keys())\n    assert len(base) >= 50\n    for lang in i18n.LANG_ORDER:\n        assert set(i18n.STRINGS[lang].keys()) == base, lang\n\n\n# ---------------------------------------------------------------------------\n# GUI smoke\n# ---------------------------------------------------------------------------\n\ndef test_gui_smoke(tmp_path):\n    from PySide6.QtWidgets import QApplication\n    app = QApplication.instance() or QApplication([])\n    import app as app_module\n    win = app_module.MainWindow()\n    csv_path = tmp_path / \"list.csv\"\n    csv_path.write_text(\n        \"会社名,住所,電話,メール,ID\\n\"\n        \"株式会社サクラ,東京,03-1234-5678,a@sakura.jp,\\n\"\n        \"(株)さくら,大阪,0312345678,b@sakura.jp,\\n\"\n        \"タナカ,名古屋,052-111-2222,t@tanaka.jp,\\n\",\n        encoding=\"utf-8\")\n    win.load_file(str(csv_path))\n    assert len(win.engine.rows) == 3\n    win.run_detect()\n    assert len(win.groups) == 1 and win.groups[0].tier == \"A\"\n    win.groups_table.selectRow(0)\n    app.processEvents()\n    assert win.current_group is not None\n    win.apply_merge()\n    assert len(win.engine.rows) == 2\n    win.undo_merge()\n    assert len(win.engine.rows) == 3\n    # language switching incl. RTL Arabic must not break the window\n    for code in (\"en\", \"ar\", \"ko\", \"ja\"):\n        idx = app_module.LANG_ORDER.index(code)\n        win.lang_combo.setCurrentIndex(idx)\n        app.processEvents()\n        assert win.lang == code\n    win.close()\n"}]</script>

<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
