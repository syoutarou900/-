r / paddleocr は任意の追加投票エンジンです。インストールされている\n  場合のみ自動で使われます（重いため必須にはしていません）。\n・実Windows機での起動、および実Windows機でのVLM/GPU実行は未検証です\n  （制作環境ではオフスクリーン描画と単体テストで確認しています）。\n・初回起動時はライブラリ（PySide6・OpenCV等、数百MB）の自動導入が入ります。\n\n■ サイズの目安\n・このZIP（v2）: 約11.8MB\n・展開後: 約32.9MB\n・初回起動で入るライブラリ: 数百MB（PySide6・OpenCVほか）\n・VLMモデル（任意・初回のみ別途）: 3B 合計 約2.8GB ／ 7B 合計 約5.5GB\n・GPUランタイム（任意）: Vulkan 約32MB ／ CUDA 合計 約645MB\n\n■ フォルダー構成\napp.py（本体）/ context_core.py（ルール抽出）/ preprocess.py（画像前処理）/\nensemble.py（複数エンジン合意・検証）/ automation.py（完全自動化）/\nlearning.py（修正からの学習）/ integrations.py（基幹システム連携4方式＋設定アシスト）/\nvlm_local.py（内蔵VLM・GPU判定）/ i18n_data.py（13言語）/ rc_assets.py /\ndownload_models.py（配布者向けモデル一括取得）/ vlm_runtime\\（llama.cpp）/\nrequirements.txt / Start-ContextStruct.bat / Download-Models.bat /\nStart-ContextStruct.command（Mac用）/ MakeApp-Mac.command（Mac用）/\nREADME.txt / tests\\\n\n■ Macでの利用（Mac対応リトロフィットで追加）\n対応環境: macOS 11（Big Sur）以降。Apple Silicon（Mシリーズ）と Intel の\n両方のMacに対応します（下記 .app 化の際に、まず両チップ兼用の universal2\nでの生成を試み、できない場合はそのMacのチップ専用版に自動で切り替えます）。\n\n【手順A: ソースから起動する】\n1. ZIPをすべて展開（解凍）してください。\n2. 展開したフォルダー内の Start-ContextStruct.command をダブルクリック\n   します。未署名のため初回だけ止められる場合があります。その場合は\n   右クリック→「開く」を選んでください（Gatekeeper の仕様です）。\n3. 初回だけ、専用の実行環境（.venv）の作成と必要ライブラリ\n   （PySide6・OpenCVなど、数百MB規模）の自動導入が入ります。\n   2回目以降はすぐ起動します。\n4. Python 3 が無いMacでは、入手方法（python.org のインストーラ／\n   Homebrew／xcode-select --install）が画面に表示されて終了します。\n   入れたあと、もう一度ダブルクリックしてください。\n\n【手順B: .app 化する（通常はこちらがおすすめ）】\n1. 展開したフォルダー内の MakeApp-Mac.command をダブルクリックします\n   （初回は右クリック→「開く」）。\n2. 生成が終わると dist フォルダーに ContextStruct.app ができます。\n   あとはその .app をダブルクリックして使えます（.app 自体も未署名の\n   ため、初回起動時は右クリック→「開く」が必要です）。\n\n【Macでのデータ保存先】\n設定・プロファイル・学習記録・監査ログ・VLMモデルの保存先は、Mac標準の\n ~/Library/Application Support/ContextStruct です（Windows版の\n %APPDATA%\\ContextStruct に相当。ファイル形式は同じです）。\n\n【MacでのOCR】\nHomebrew で導入します: brew install tesseract tesseract-lang\nApple Silicon の /opt/homebrew/bin と Intel の /usr/local/bin の両方を\nアプリが自動で探すので、Finderから起動した場合でも見つけられます。\n未導入でもアプリは止まらず、画面に導入方法の案内が出ます（その場合、\nスキャンPDF・画像のOCRだけが使えず、貼り付け・手入力とテキスト層の\nあるPDFのルール抽出は通常どおり使えます）。\n\n【Macでの制限（正直な明記）】\n・ローカルVLM（内蔵Qwen2.5-VL）: 同梱の推論ランタイム（llama.cpp）は\n  Windowsビルドのため、Macではそのままでは動作しません。モデル本体の\n  ダウンロード自体はMacでもできますが、推論には macOS版 llama.cpp の\n  llama-mtmd-cli（拡張子なしの実行ファイル）を vlm_runtime フォルダー\n  へ手動で配置する必要があります（上級者向け。配置すれば自動で検出\n  されます）。設定画面のGPUランタイム取得（Vulkan／CUDA）もWindows\n  専用の配布物のため、Macでは取得できません。なお、外部APIのVLM\n  （OpenAI互換エンドポイント）を設定した場合は、MacでもVLMの票を\n  アンサンブルに使えます。ルール抽出・OCR・検算・マスター照合などの\n  VLM以外の仕組みはMacでもすべて動作します。\n・キャプチャ用ホットキー: 他のアプリを使っている最中でも効く\n  グローバルホットキーは Windows専用の仕組みのため、Macでは使えません。\n  Macでは ContextStruct のウィンドウが前面にある間だけ、設定した\n  ショートカット（既定 Ctrl+Shift+S）が効きます。「画面をキャプチャ」\n  ボタンは通常どおり使えます。\n・画面キャプチャ: macOSの仕様で「画面収録」の許可を求められる場合が\n  あります（システム設定→プライバシーとセキュリティ→画面収録）。\n  許可しない場合は、ファイルをドラッグ＆ドロップ／選択して取り込んで\n  ください。\n・基幹システム連携の方式1（RPA画面自動入力）は Windows専用です。\n  Macでは利用不可として扱われます。方式2（ブックマークレット／\n  selenium）・方式3（取り込みファイル）・方式4（DB直接書き込み）は\n  Macでも動作します。\n・監視フォルダー（完全自動化）はMacでも動作します（アプリ起動中に\n  定期確認する方式のため、アプリを閉じている間は処理されません。\n  これはWindows版も同じです）。\n\n【Macでの検証状況】\nMac実機での動作確認は未実施です（制作環境にMacがありません）。\nWindows版の全テスト91件に合格し、そのうち新規13件で、Mac分岐\n（保存先・Tesseract解決・ランタイム選択・ダウンロード抑止）を\nプラットフォームを模擬して検証しています。.command スクリプトは\n構文検証済みですが、実機での初回起動・.app生成が最初の実地確認に\nなります。\n"}, {"path": "requirements.txt", "sizestr": "73 B", "content": "PySide6\nPyMuPDF\nopenpyxl\nPillow\npytesseract\nopencv-python-headless\nnumpy\n"}, {"path": "Start-ContextStruct.bat", "sizestr": "818 B", "content": "@echo off\r\ncd /d %~dp0\r\necho ============================================\r\necho  ContextStruct - Startup\r\necho ============================================\r\nif not exist app.py goto NOFILE\r\nif not exist requirements.txt goto NOFILE\r\necho Checking / installing libraries (first launch only, may take a while)...\r\npython -m pip install --upgrade PySide6 PyMuPDF openpyxl Pillow pytesseract opencv-python-headless numpy\r\necho.\r\necho Starting ContextStruct...\r\necho Keep this window open while the app runs. Closing it closes the app.\r\npython app.py\r\necho.\r\necho App closed.\r\npause\r\nexit /b\r\n:NOFILE\r\necho [ERROR] app.py or requirements.txt was not found next to this file.\r\necho Please EXTRACT the whole ZIP first, then open the extracted folder\r\necho and double-click Start-ContextStruct.bat inside it.\r\npause\r\nexit /b\r\n"}, {"path": "Start-ContextStruct.command", "sizestr": "2.0 KB", "content": "#!/bin/bash\n# ContextStruct - macOS source launcher\n# Double-click this file to run ContextStruct from the source code.\n# First launch only: if macOS blocks it, right-click the file and\n# choose \"Open\" once.\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== ContextStruct (macOS, from source) ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"ContextStruct needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + dependencies (first run only) -----------------\nif [ ! -x \".venv/bin/python\" ]; then\n  echo \"Preparing the app environment (first run only)...\"\n  $PY -m venv .venv || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv/bin/python -m pip install -r requirements.txt || { echo \"Failed to install the required libraries. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\n# --- Tesseract (OCR) hint: optional, the app runs without it -------------\nif ! command -v tesseract >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/tesseract ] && [ ! -x /usr/local/bin/tesseract ]; then\n  echo \"\"\n  echo \"Note: Tesseract (OCR) was not found. The app still works\"\n  echo \"(paste text or use the rule engine on text PDFs), but OCR of\"\n  echo \"scanned pages needs it. To install with Homebrew:\"\n  echo \"  brew install tesseract tesseract-lang\"\n  echo \"\"\nfi\n\nexec .venv/bin/python app.py\n"}, {"path": "tests/test_context.py", "sizestr": "4.0 KB", "content": "# -*- coding: utf-8 -*-\nimport sys, os, json, tempfile\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nfrom context_core import *\nfrom i18n_data import TRANSLATIONS, LANG_ORDER\n\nDELIVERY = \"\"\"納品書\n納品書番号: DN-2026-001\n納品日: 2026年11月12日\n取引先: 株式会社サンプル\n商品名: りんごジュース 1L\n数量: 24\n卸値: 800円\n売価: 1200円\n合計: 19200円\n\"\"\"\nINVOICE = \"\"\"請求書\n請求書番号: INV-2026-042\n請求日: 2026/11/01\n請求先: 株式会社テスト\n小計: 50000円\n消費税: 5000円\n請求金額: 55000円\n\"\"\"\n\ndef _profile(name_part):\n    for p in preset_profiles():\n        if name_part in p.name: return p\n    raise AssertionError(name_part)\n\ndef test_delivery_wholesale_vs_retail():\n    prof=_profile(\"納品書\")\n    rows=extract_document(DELIVERY, prof)\n    d=rows_to_dicts(rows, prof)[0]\n    assert d[\"卸値\"]==\"800\", d\n    assert d[\"売価\"]==\"1200\", d\n    assert d[\"卸値\"]!=d[\"売価\"]\n    assert d[\"納品書番号\"]==\"DN-2026-001\"\n    assert d[\"数量\"]==\"24\"\n\ndef test_invoice_extract():\n    prof=_profile(\"請求書\")\n    rows=extract_document(INVOICE, prof)\n    d=rows_to_dicts(rows, prof)[0]\n    assert d[\"請求書番号\"]==\"INV-2026-042\", d\n    assert d[\"請求日\"]==\"2026-11-01\", d\n    assert d[\"請求金額\"]==\"55000\", d\n\ndef test_parse_date_cases():\n    assert parse_date(\"2026/11/12\")==\"2026-11-12\"\n    assert parse_date(\"2026-11-12\")==\"2026-11-12\"\n    assert parse_date(\"2026年11月12日\")==\"2026-11-12\"\n    assert parse_date(\"12 Nov 2026\")==\"2026-11-12\"\n    assert parse_date(\"Nov 12, 2026\")==\"2026-11-12\"\n\ndef test_parse_number_cases():\n    assert parse_number(\"¥1,200円\")==\"1200\"\n    assert parse_number(\"$1,234.50\")==\"1234.5\"\n    assert parse_number(\"€ 800\")==\"800\"\n    assert parse_number(\"1,9200\")==\"19200\" or parse_number(\"19,200\")==\"19200\"\n    assert parse_number(\"19,200円\")==\"19200\"\n\ndef test_confidence_category():\n    assert confidence_category(100)==\"green\"\n    assert confidence_category(80)==\"green\"\n    assert confidence_category(79)==\"yellow\"\n    assert confidence_category(50)==\"yellow\"\n    assert confidence_category(49)==\"red\"\n    assert confidence_category(0)==\"red\"\n\ndef test_tsv_order():\n    prof=_profile(\"納品書\")\n    rows=extract_document(DELIVERY, prof)\n    tsv=rows_to_tsv(rows, prof, include_header=True)\n    header=tsv.splitlines()[0].split(\"\\t\")\n    assert header==[f.target_column for f in prof.fields]\n    # wholesale column appears before retail and values in correct columns\n    vals=tsv.splitlines()[1].split(\"\\t\")\n    assert vals[header.index(\"卸値\")]==\"800\"\n    assert vals[header.index(\"売価\")]==\"1200\"\n\ndef test_profile_roundtrip(tmp_path):\n    prof=_profile(\"WEBカタログ\")\n    path=str(tmp_path/\"p.json\")\n    save_profile(prof, path)\n    loaded=load_profile(path)\n    assert loaded.name==prof.name\n    assert loaded.to_dict()==prof.to_dict()\n    # catalog also has separate wholesale/retail\n    names=[f.target_column for f in loaded.fields]\n    assert \"卸値\" in names and \"売価\" in names\n\ndef test_i18n_completeness():\n    assert LANG_ORDER==[\"ja\",\"en\",\"es\",\"zh_CN\",\"fr\",\"de\",\"pt\",\"ru\",\"it\",\"tr\",\"ar\",\"id\",\"ko\"]\n    all_keys=set()\n    for lang in LANG_ORDER: all_keys.update(TRANSLATIONS[lang].keys())\n    for lang in LANG_ORDER:\n        for k in all_keys:\n            assert k in TRANSLATIONS[lang], f\"{lang} missing {k}\"\n            assert TRANSLATIONS[lang][k].strip()!=\"\", f\"{lang} empty {k}\"\n\ndef test_pdf_text_extraction(tmp_path):\n    import fitz\n    p=str(tmp_path/\"sample.pdf\")\n    doc=fitz.open(); page=doc.new_page(); page.insert_text((72,72),\"Invoice No: INV-TEST-001 Total 12345\"); doc.save(p); doc.close()\n    text, ocr = extract_text_from_pdf(p)\n    assert \"INV-TEST-001\" in text\n    assert \"12345\" in text\n\ndef test_line_items():\n    prof=_profile(\"納品書\")\n    text=\"納品書\\n納品日: 2026/11/12\\n取引先: 株式会社X\\nりんご 10 500\\nみかん 20 300\\n\"\n    rows=extract_document(text, prof)\n    assert len(rows)>=2\n    dicts=rows_to_dicts(rows, prof)\n    assert dicts[0][\"商品名\"]==\"りんご\"\n    assert dicts[1][\"商品名\"]==\"みかん\"\n"}, {"path": "tests/test_mac.py", "sizestr": "6.6 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Mac (darwin) retrofit tests.\n\nThese verify the darwin-only branches added for the macOS retrofit AND that\nthe pre-existing Windows behaviour is untouched:\n- get_app_dir(): win32+APPDATA -> %APPDATA%\\\\ContextStruct (unchanged),\n  win32 without APPDATA -> ~\\\\ContextStruct (unchanged fallback),\n  darwin -> ~/Library/Application Support/ContextStruct (new).\n- tesseract_path(): non-darwin resolves exactly like shutil.which;\n  darwin falls back to the Homebrew locations in order.\n- vlm_local.find_runtime_binary(): darwin never returns a Windows .exe;\n  win32 still returns the first candidate present.\n- vlm_local.download_runtime()/download_gpu_runtime(): darwin refuses the\n  Windows-only downloads; the win32 code path is not entered here.\n- i18n: ocr_missing_mac exists in all 13 languages; the original\n  ocr_missing strings are unchanged.\n\"\"\"\nimport os, sys\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport context_core\nimport vlm_local\n\n\ndef _with_platform(monkeypatch, value):\n    monkeypatch.setattr(context_core.sys, \"platform\", value)\n    monkeypatch.setattr(vlm_local.sys, \"platform\", value)\n\n\n# ------------------------------------------------------------ get_app_dir ----\ndef test_app_dir_win32_with_appdata_unchanged(tmp_path, monkeypatch):\n    _with_platform(monkeypatch, \"win32\")\n    monkeypatch.setenv(\"APPDATA\", str(tmp_path / \"appdata\"))\n    # makedirs happens inside get_app_dir; point HOME at tmp so nothing\n    # outside the sandbox is touched on the fallback path either.\n    monkeypatch.setenv(\"HOME\", str(tmp_path))\n    d = context_core.get_app_dir()\n    assert d == os.path.join(str(tmp_path / \"appdata\"), \"ContextStruct\")\n    assert os.path.isdir(d)\n\n\ndef test_app_dir_win32_no_appdata_unchanged(tmp_path, monkeypatch):\n    _with_platform(monkeypatch, \"win32\")\n    monkeypatch.delenv(\"APPDATA\", raising=False)\n    monkeypatch.setattr(os.path, \"expanduser\", lambda p: str(tmp_path))\n    d = context_core.get_app_dir()\n    assert d == os.path.join(str(tmp_path), \"ContextStruct\")\n\n\ndef test_app_dir_darwin_uses_library_application_support(tmp_path, monkeypatch):\n    _with_platform(monkeypatch, \"darwin\")\n    monkeypatch.setattr(os.path, \"expanduser\", lambda p: str(tmp_path))\n    d = context_core.get_app_dir()\n    assert d == os.path.join(str(tmp_path), \"Library\", \"Application Support\", \"ContextStruct\")\n    assert os.path.isdir(d)\n\n\ndef test_app_dir_linux_unchanged(tmp_path, monkeypatch):\n    _with_platform(monkeypatch, \"linux\")\n    monkeypatch.setattr(os.path, \"expanduser\", lambda p: str(tmp_path))\n    d = context_core.get_app_dir()\n    assert d == os.path.join(str(tmp_path), \".contextstruct\")\n\n\ndef test_models_dir_follows_app_dir_on_darwin(tmp_path, monkeypatch):\n    _with_platform(monkeypatch, \"darwin\")\n    monkeypatch.setattr(os.path, \"expanduser\", lambda p: str(tmp_path))\n    d = vlm_local.models_dir()\n    assert d == os.path.join(str(tmp_path), \"Library\", \"Application Support\",\n                             \"ContextStruct\", \"models\")\n\n\n# ------------------------------------------------------------- tesseract ----\ndef test_tesseract_path_nondarwin_is_plain_which(monkeypatch):\n    _with_platform(monkeypatch, \"win32\")\n    monkeypatch.setattr(context_core.shutil, \"which\", lambda name: r\"C:\\tess\\tesseract.exe\")\n    assert context_core.tesseract_path() == r\"C:\\tess\\tesseract.exe\"\n    monkeypatch.setattr(context_core.shutil, \"which\", lambda name: None)\n    assert context_core.tesseract_path() is None\n    assert context_core.ocr_available() is False\n\n\ndef test_tesseract_path_darwin_prefers_path_then_homebrew(monkeypatch, tmp_path):\n    _with_platform(monkeypatch, \"darwin\")\n    # 1) PATH hit wins, exactly as before\n    monkeypatch.setattr(context_core.shutil, \"which\", lambda name: \"/usr/bin/tesseract\")\n    assert context_core.tesseract_path() == \"/usr/bin/tesseract\"\n    # 2) no PATH hit -> first existing Homebrew candidate wins\n    monkeypatch.setattr(context_core.shutil, \"which\", lambda name: None)\n    brew = tmp_path / \"brew\"; brew.mkdir()\n    fake = brew / \"tesseract\"; fake.write_text(\"#!/bin/sh\\n\"); fake.chmod(0o755)\n    monkeypatch.setattr(context_core, \"HOMEBREW_TESSERACT_CANDIDATES\",\n                        (str(fake), \"/usr/local/bin/tesseract\"))\n    assert context_core.tesseract_path() == str(fake)\n    assert context_core.ocr_available() is True\n    # 3) nothing anywhere -> None\n    monkeypatch.setattr(context_core, \"HOMEBREW_TESSERACT_CANDIDATES\",\n                        (\"/nonexistent-a/tesseract\", \"/nonexistent-b/tesseract\"))\n    assert context_core.tesseract_path() is None\n\n\n# ------------------------------------------------------------ vlm runtime ----\ndef test_find_runtime_binary_darwin_skips_windows_exe(tmp_path, monkeypatch):\n    _with_platform(monkeypatch, \"darwin\")\n    (tmp_path / \"llama-mtmd-cli.exe\").write_bytes(b\"MZ\")\n    assert vlm_local.find_runtime_binary(search_dirs=[str(tmp_path)]) is None\n    # a manually placed macOS (extensionless) build IS picked up\n    mac_bin = tmp_path / \"llama-mtmd-cli\"; mac_bin.write_bytes(b\"\\xcf\\xfa\")\n    assert vlm_local.find_runtime_binary(search_dirs=[str(tmp_path)]) == str(mac_bin)\n\n\ndef test_find_runtime_binary_win32_unchanged(tmp_path, monkeypatch):\n    _with_platform(monkeypatch, \"win32\")\n    exe = tmp_path / \"llama-mtmd-cli.exe\"; exe.write_bytes(b\"MZ\")\n    assert vlm_local.find_runtime_binary(search_dirs=[str(tmp_path)]) == str(exe)\n\n\ndef test_download_runtime_darwin_returns_none(monkeypatch):\n    _with_platform(monkeypatch, \"darwin\")\n    assert vlm_local.download_runtime() is None\n\n\ndef test_download_gpu_runtime_darwin_refused(monkeypatch):\n    _with_platform(monkeypatch, \"darwin\")\n    import pytest\n    with pytest.raises(RuntimeError):\n        vlm_local.download_gpu_runtime(\"vulkan\")\n\n\n# ------------------------------------------------------------------ i18n ----\ndef test_ocr_missing_mac_all_languages():\n    from i18n_data import TRANSLATIONS, LANG_ORDER, t\n    assert len(LANG_ORDER) == 13\n    for code in LANG_ORDER:\n        m = t(code, \"ocr_missing_mac\")\n        assert m != \"ocr_missing_mac\", code\n        assert \"brew install tesseract\" in m, code\n        assert TRANSLATIONS[code][\"ocr_missing_mac\"] == m\n\n\ndef test_ocr_missing_original_strings_unchanged():\n    # The Windows-facing message must still be the original wording.\n    from i18n_data import t\n    assert t(\"ja\", \"ocr_missing\") == \"OCR（Tesseract）が見つかりません。テキストを貼り付けるか手入力で直せます。Windowsでは Tesseract のインストールが必要です。\"\n    assert t(\"en\", \"ocr_missing\") == \"OCR (Tesseract) not found. Paste or type text manually. Tesseract must be installed on Windows.\"\n"}, {"path": "tests/test_v2.py", "sizestr": "16.4 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"ContextStruct v2 tests: preprocessing, ensemble agreement/verification,\nmaster matching, complete automation, learning, 7B model registry.\nAll engine tests use FAKE engines / mock runners — no real OCR binary and\nno multi-GB model download is needed.\"\"\"\nimport sys, os, json, csv\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nfrom PIL import Image, ImageDraw\nfrom context_core import (preset_profiles, FieldResult, rows_to_dicts)\nimport preprocess as pp\nimport ensemble\nimport learning\nimport automation\nimport vlm_local\n\n\ndef _prof(part):\n    for p in preset_profiles():\n        if part in p.name:\n            return p\n    raise AssertionError(part)\n\n\ndef _row(prof, spec):\n    \"\"\"spec: {col: (value, conf)} -> FieldResult row\"\"\"\n    return {f.target_column: FieldResult(spec.get(f.target_column, (\"\", 0))[0],\n                                         spec.get(f.target_column, (\"\", 0))[1], \"fake\", \"\")\n            for f in prof.fields}\n\n\n# ------------------------------------------------------------ A1 preprocess\ndef _pattern(angle=0.0, size=(800, 600)):\n    img = Image.new(\"RGB\", size, (255, 255, 255))\n    d = ImageDraw.Draw(img)\n    for y in range(80, size[1] - 40, 48):\n        for x in range(60, size[0] - 60, 26):\n            d.rectangle([x, y, x + 16, y + 10], fill=(0, 0, 0))\n    if angle:\n        img = img.rotate(angle, resample=Image.BICUBIC, fillcolor=(255, 255, 255))\n    return img\n\n\ndef test_preprocess_variants_sizes_modes():\n    out = pp.preprocess_image(_pattern(0), upscale=True)\n    assert set(out.keys()) == {\"original\", \"enhanced\", \"binarized\"}\n    for im in out.values():\n        assert im.size == (1600, 1200) and im.mode == \"RGB\"\n    out2 = pp.preprocess_image(_pattern(0), upscale=False)\n    assert out2[\"original\"].size == (800, 600)\n\n\ndef test_preprocess_low_contrast_enhanced_differs():\n    faint = Image.new(\"RGB\", (200, 100), (212, 212, 212))\n    d = ImageDraw.Draw(faint)\n    d.rectangle([20, 40, 180, 60], fill=(188, 188, 188))\n    en = pp.enhance_image(faint)\n    assert en.size == faint.size\n    spread_before = max(faint.convert(\"L\").getdata()) - min(faint.convert(\"L\").getdata())\n    spread_after = max(en.convert(\"L\").getdata()) - min(en.convert(\"L\").getdata())\n    assert spread_after > spread_before  # CLAHE actually stretched the faint contrast\n\n\ndef test_deskew_reduces_measured_skew():\n    for ang in (4.0, -3.0):\n        img = _pattern(ang)\n        before = abs(pp.estimate_skew(img))\n        assert before >= abs(ang) - 1.0\n        after = abs(pp.estimate_skew(pp.deskew_image(img)))\n        assert after < before and after <= 1.0\n\n\ndef test_preprocess_to_files(tmp_path):\n    src = tmp_path / \"scan.png\"\n    _pattern(2.0).save(src)\n    paths = pp.preprocess_to_files(str(src), out_dir=str(tmp_path / \"out\"))\n    assert set(paths) == {\"original\", \"enhanced\", \"binarized\"}\n    for p in paths.values():\n        assert os.path.isfile(p)\n        assert Image.open(p).size == (1600, 1200)\n\n\n# ------------------------------------------------------- A2 ensemble merger\ndef test_agreement_boost_two_engines():\n    prof = _prof(\"納品書\")\n    spec = {\"卸値\": (\"800\", 90), \"売価\": (\"1200\", 88), \"数量\": (\"24\", 95)}\n    engines = {\"eng_a\": [_row(prof, spec)], \"eng_b\": [_row(prof, spec)]}\n    rows, report = ensemble.merge_engine_rows(engines, prof)\n    assert 97 <= rows[0][\"卸値\"].confidence <= 99\n    assert rows[0][\"卸値\"].value == \"800\"\n    assert report[\"fields\"][(0, \"卸値\")][\"agreed\"] is True\n    assert report[\"disputed\"] == []\n\n\ndef test_single_engine_keeps_confidence():\n    prof = _prof(\"納品書\")\n    engines = {\"only\": [_row(prof, {\"卸値\": (\"800\", 72)})]}\n    rows, report = ensemble.merge_engine_rows(engines, prof)\n    assert rows[0][\"卸値\"].confidence == 72\n    assert report[\"fields\"][(0, \"卸値\")][\"agreed\"] is False\n\n\ndef test_disagreement_caps_and_flags():\n    prof = _prof(\"納品書\")\n    engines = {\"a\": [_row(prof, {\"卸値\": (\"800\", 95)})],\n               \"b\": [_row(prof, {\"卸値\": (\"850\", 95)})],\n               \"c\": [_row(prof, {\"卸値\": (\"800\", 95)})]}\n    rows, report = ensemble.merge_engine_rows(engines, prof)\n    assert rows[0][\"卸値\"].value == \"800\"          # most supported wins\n    assert rows[0][\"卸値\"].confidence <= ensemble.DISAGREE_CAP\n    assert (0, \"卸値\") in report[\"disputed\"]\n\n\ndef test_agreement_after_normalization():\n    prof = _prof(\"納品書\")\n    engines = {\"a\": [_row(prof, {\"卸値\": (\"¥800円\", 90)})],\n               \"b\": [_row(prof, {\"卸値\": (\"800\", 90)})]}\n    rows, report = ensemble.merge_engine_rows(engines, prof)\n    assert rows[0][\"卸値\"].value in (\"800\", \"¥800円\")\n    assert rows[0][\"卸値\"].confidence >= 97  # normalized values agree\n\n\n# ------------------------------------------------- A3 arithmetic validation\ndef _delivery_row(qty=\"24\", unit=\"800\", total=\"19200\"):\n    prof = _prof(\"納品書\")\n    return prof, _row(prof, {\"数量\": (qty, 95), \"単価\": (unit, 95), \"合計\": (total, 95),\n                             \"卸値\": (\"800\", 95), \"売価\": (\"1200\", 95)})\n\n\ndef test_arithmetic_pass_keeps_confidence():\n    prof, row = _delivery_row()\n    res = ensemble.arithmetic_validation([row], prof)\n    assert res[\"passed\"] is True\n    assert row[\"合計\"].confidence == 95\n\n\ndef test_arithmetic_fail_lowers_confidence():\n    prof, row = _delivery_row(total=\"99999\")\n    res = ensemble.arithmetic_validation([row], prof)\n    assert res[\"passed\"] is False\n    assert row[\"合計\"].confidence < 95\n    assert \"arith_fail\" in row[\"合計\"].reason\n    assert (0, \"合計\") in res[\"failed_fields\"]\n\n\ndef test_tax_pattern_check():\n    prof = _prof(\"請求書\")\n    good = _row(prof, {\"小計\": (\"50000\", 95), \"消費税\": (\"5000\", 95), \"請求金額\": (\"55000\", 95)})\n    assert ensemble.arithmetic_validation([good], prof)[\"passed\"] is True\n    bad = _row(prof, {\"小計\": (\"50000\", 95), \"消費税\": (\"1234\", 95), \"請求金額\": (\"55000\", 95)})\n    res = ensemble.arithmetic_validation([bad], prof)\n    assert res[\"passed\"] is False\n    assert bad[\"消費税\"].confidence < 95\n\n\n# ------------------------------------------- A3b targeted re-read on dispute\ndef test_targeted_reread_invoked_on_disagreement(tmp_path):\n    prof = _prof(\"納品書\")\n    img = tmp_path / \"doc.png\"\n    Image.new(\"RGB\", (32, 32), \"white\").save(img)\n    calls = []\n    def fake_reread_runner(prompt, image_path):\n        calls.append((prompt, image_path))\n        assert \"卸値\" in prompt  # field-specific question\n        return '{\"卸値\": \"800\"}'\n    engines = {\"a\": [_row(prof, {\"卸値\": (\"850\", 90)})], \"b\": [_row(prof, {\"卸値\": (\"800\", 90)})]}\n    rows, report = ensemble.merge_engine_rows(engines, prof)\n    assert (0, \"卸値\") in report[\"disputed\"]\n    done = ensemble.verify_and_reread(rows, prof, str(img), report[\"disputed\"], runner=fake_reread_runner)\n    assert done == [(0, \"卸値\")] and len(calls) == 1\n    assert rows[0][\"卸値\"].value == \"800\"\n    assert rows[0][\"卸値\"].confidence >= 85  # replaced by the targeted re-read value\n\n\ndef test_reread_agreement_boosts_existing():\n    prof = _prof(\"納品書\")\n    rows = [_row(prof, {\"卸値\": (\"800\", 60)})]\n    def runner(prompt, image_path):\n        return '{\"卸値\": \"800\"}'\n    ensemble.verify_and_reread(rows, prof, \"x.png\", [(0, \"卸値\")], runner=runner)\n    assert rows[0][\"卸値\"].confidence >= 96\n    assert \"verify_reread agreed\" in rows[0][\"卸値\"].reason\n\n\n# ------------------------------------------------------------ A3c master CSV\ndef test_master_snap_and_boost(tmp_path):\n    prof = _prof(\"納品書\")\n    mp = tmp_path / \"master.csv\"\n    with open(mp, \"w\", encoding=\"utf-8\", newline=\"\") as f:\n        w = csv.writer(f); w.writerow([\"code\", \"name\"]); w.writerow([\"AJ-1L\", \"りんごジュース 1L\"])\n    master = ensemble.load_master(str(mp))\n    assert master == [{\"code\": \"AJ-1L\", \"name\": \"りんごジュース 1L\"}]\n    rows = [_row(prof, {\"商品名\": (\"りんごジュース 1L（仮）\", 70)})]\n    # fuzzy: close but not exact spelling still snaps when similar enough OR stays\n    n = ensemble.master_match(rows, prof, master)\n    rows2 = [_row(prof, {\"商品名\": (\"りんごジュース 1L\", 70)})]\n    n2 = ensemble.master_match(rows2, prof, master)\n    assert n2 == 1\n    assert rows2[0][\"商品名\"].value == \"りんごジュース 1L\"\n    assert rows2[0][\"商品名\"].confidence > 70\n    assert \"master matched\" in rows2[0][\"商品名\"].reason\n\n\ndef test_master_first_two_columns_fallback(tmp_path):\n    mp = tmp_path / \"m2.csv\"\n    with open(mp, \"w\", encoding=\"utf-8\", newline=\"\") as f:\n        w = csv.writer(f); w.writerow([\"X-9\", \"株式会社サンプル\"]); w.writerow([\"Y-1\", \"株式会社テスト\"])\n    entries = ensemble.load_master(str(mp))\n    assert {\"code\": \"X-9\", \"name\": \"株式会社サンプル\"} in entries\n\n\n# --------------------------------------------------------- C: 7B registry\ndef test_model_registry_7b_verified_filenames():\n    spec = vlm_local.model_spec(\"7b\")\n    assert spec[\"model_file\"] == \"Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf\"\n    assert spec[\"mmproj_file\"] == \"mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf\"\n    assert spec[\"model_bytes\"] == 4683072032 and spec[\"mmproj_bytes\"] == 853119712\n    total_gb = (spec[\"model_bytes\"] + spec[\"mmproj_bytes\"]) / 1e9\n    assert 5.0 <= total_gb <= 6.0\n    spec3 = vlm_local.model_spec(\"3b\")\n    assert spec3[\"model_bytes\"] == 1929901056 and spec3[\"mmproj_bytes\"] == 844757728\n\n\ndef test_model_status_per_model(tmp_path):\n    d = str(tmp_path)\n    st = vlm_local.model_status(d, model_key=\"7b\", min_model_bytes=1, min_mmproj_bytes=1)\n    assert st[\"complete\"] is False and st[\"model_key\"] == \"7b\"\n    assert set(st[\"missing\"]) == {vlm_local.MODEL7_FILE, vlm_local.MMPROJ7_FILE}\n\n\ndef test_prompt_variants_differ_and_few_shot():\n    prof = _prof(\"納品書\")\n    p0 = vlm_local.build_vlm_prompt(prof, variant=0)\n    p1 = vlm_local.build_vlm_prompt(prof, variant=1)\n    assert p0 != p1\n    assert \"handwriting\" in p0.lower() and \"handwriting\" in p1.lower()\n    fs = [{\"field\": \"卸値\", \"original\": \"850\", \"corrected\": \"800\", \"source_snippet\": \"卸値: 800\"}]\n    pf = vlm_local.build_vlm_prompt(prof, few_shot=fs)\n    assert \"850\" in pf and \"800\" in pf and \"卸値\" in pf\n\n\ndef test_self_consistency_two_phrasings_agree_boost():\n    \"\"\"C2: the same VLM read twice with two phrasings — the ensemble merger\n    boosts fields both phrasings agree on.\"\"\"\n    prof = _prof(\"納品書\")\n    seen_prompts = []\n    def runner(prompt, image_path):\n        seen_prompts.append(prompt)\n        return '{\"fields\": {\"卸値\": \"800\", \"売価\": \"1200\"}, \"items\": []}'\n    engines = {}\n    for variant, name in ((0, \"vlm_p1\"), (1, \"vlm_p2\")):\n        engines[name] = vlm_local.run_local_vlm(\"dummy.png\", prof, runner=runner, prompt_variant=variant)\n    assert len(seen_prompts) == 2 and seen_prompts[0] != seen_prompts[1]\n    rows, report = ensemble.merge_engine_rows(engines, prof)\n    assert rows[0][\"卸値\"].confidence >= 97\n    assert report[\"disputed\"] == []\n\n\n# ------------------------------------------------------- E: learning layer\ndef test_correction_saved_on_confirm(tmp_path):\n    d = str(tmp_path)\n    learning.save_correction(\"納品書 Delivery Note\", \"卸値\", \"850\", \"800\", \"卸値: 800\", base_dir=d)\n    recs = learning.load_corrections(base_dir=d)\n    assert len(recs) == 1 and recs[0][\"corrected\"] == \"800\" and recs[0][\"field\"] == \"卸値\"\n    recent = learning.recent_corrections(\"納品書 Delivery Note\", 5, base_dir=d)\n    assert len(recent) == 1\n\n\ndef test_alias_learned_from_snippet():\n    prof = _prof(\"納品書\")\n    f = next(x for x in prof.fields if x.target_column == \"取引先\")\n    assert \"お届け先\" not in f.keywords\n    src = \"納品書\\nお届け先: 株式会社サンプル\\n数量: 24\\n\"\n    learned = learning.learn_alias(prof, \"取引先\", \"株式会社サンプル\", src)\n    assert learned == \"お届け先\"\n    assert \"お届け先\" in f.keyword_list()\n    # already-known keyword is not learned twice\n    assert learning.learn_alias(prof, \"取引先\", \"株式会社サンプル\", src) is None\n\n\ndef test_few_shot_prompt_contains_prior_correction(tmp_path):\n    d = str(tmp_path)\n    learning.save_correction(\"納品書 Delivery Note\", \"卸値\", \"850\", \"800\", \"卸値: 800円\", base_dir=d)\n    few = learning.recent_corrections(\"納品書 Delivery Note\", 5, base_dir=d)\n    prof = _prof(\"納品書\")\n    prompt = vlm_local.build_vlm_prompt(prof, few_shot=few)\n    assert \"850\" in prompt and '\"800\"' in prompt\n\n\ndef test_vendor_profile_memory_roundtrip(tmp_path):\n    d = str(tmp_path)\n    assert learning.profile_for_vendor(\"株式会社サンプル\", base_dir=d) is None\n    learning.remember_vendor_profile(\"株式会社サンプル\", \"請求書 Invoice\", base_dir=d)\n    assert learning.profile_for_vendor(\"株式会社サンプル\", base_dir=d) == \"請求書 Invoice\"\n\n\ndef test_detect_vendor():\n    prof = _prof(\"納品書\")\n    rows = [_row(prof, {\"取引先\": (\"株式会社サンプル\", 90)})]\n    assert learning.detect_vendor(rows, prof) == \"株式会社サンプル\"\n\n\n# ------------------------------------------------- B: complete automation\nCLEAN = \"\"\"納品書\n納品書番号: DN-2026-100\n納品日: 2026年11月12日\n取引先: 株式会社サンプル\n商品名: りんごジュース 1L\n数量: 24\n単価: 800\n卸値: 800円\n売価: 1200円\n合計: 19200円\n\"\"\"\nLOWQ = \"納品書\\nよく読めないメモ\\n\"\n\n\ndef _cfg(tmp_path, out_name=\"out.xlsx\"):\n    return {\"output_path\": str(tmp_path / out_name),\n            \"done_folder\": str(tmp_path / \"done\"),\n            \"review_folder\": str(tmp_path / \"review\"),\n            \"threshold\": 90, \"settings\": {}}\n\n\ndef test_auto_accept_clean_txt(tmp_path):\n    prof = _prof(\"納品書\")\n    src = tmp_path / \"clean.txt\"; src.write_text(CLEAN, encoding=\"utf-8\")\n    res = automation.process_file_auto(str(src), prof, _cfg(tmp_path), app_dir=str(tmp_path / \"appdata\"))\n    assert res[\"decision\"] == \"accepted\", res[\"low\"]\n    assert not src.exists()\n    assert os.path.isfile(os.path.join(str(tmp_path), \"done\", \"clean.txt\"))\n    from openpyxl import load_workbook\n    wb = load_workbook(str(tmp_path / \"out.xlsx\")); ws = wb.active\n    vals = [[c.value for c in r] for r in ws.iter_rows()]\n    assert vals[0] == [f.target_column for f in prof.fields]\n    assert \"DN-2026-100\" in vals[1] and \"800\" in vals[1]\n    audit = (tmp_path / \"appdata\" / \"audit_log.jsonl\").read_text(encoding=\"utf-8\").strip().splitlines()\n    assert len(audit) == 1\n    rec = json.loads(audit[0])\n    assert rec[\"decision\"] == \"accepted\" and rec[\"source_file\"] == \"clean.txt\"\n    assert rec[\"values\"][0][\"卸値\"] == \"800\" and rec[\"arithmetic_passed\"] is True\n\n\ndef test_auto_review_low_quality(tmp_path):\n    prof = _prof(\"納品書\")\n    src = tmp_path / \"bad.txt\"; src.write_text(LOWQ, encoding=\"utf-8\")\n    res = automation.process_file_auto(str(src), prof, _cfg(tmp_path), app_dir=str(tmp_path / \"appdata\"))\n    assert res[\"decision\"] == \"review\"\n    assert os.path.isfile(os.path.join(str(tmp_path), \"review\", \"bad.txt\"))\n    assert not os.path.exists(str(tmp_path / \"out.xlsx\"))  # nothing appended\n    rec = json.loads((tmp_path / \"appdata\" / \"audit_log.jsonl\").read_text(encoding=\"utf-8\").strip())\n    assert rec[\"decision\"] == \"review\"\n\n\ndef test_auto_csv_output_mode(tmp_path):\n    prof = _prof(\"納品書\")\n    src = tmp_path / \"c.txt\"; src.write_text(CLEAN, encoding=\"utf-8\")\n    res = automation.process_file_auto(str(src), prof, _cfg(tmp_path, \"out.csv\"), app_dir=str(tmp_path / \"appdata\"))\n    assert res[\"decision\"] == \"accepted\"\n    lines = (tmp_path / \"out.csv\").read_text(encoding=\"utf-8-sig\").strip().splitlines()\n    assert len(lines) == 2 and \"DN-2026-100\" in lines[1]\n\n\ndef test_scan_watch_folder(tmp_path):\n    (tmp_path / \"a.txt\").write_text(\"x\")\n    (tmp_path / \"b.pdf\").write_bytes(b\"%PDF\")\n    (tmp_path / \"c.exe\").write_bytes(b\"no\")\n    found = automation.scan_watch_folder(str(tmp_path))\n    assert [os.path.basename(f) for f in found] == [\"a.txt\", \"b.pdf\"]\n\n\ndef test_pipeline_with_fake_vlm_engine():\n    \"\"\"run_pipeline end-to-end with a mock VLM runner as the only engine.\"\"\"\n    prof = _prof(\"納品書\")\n    def runner(prompt, image_path):\n        return '{\"fields\": {\"納品書番号\": \"DN-1\", \"数量\": \"24\", \"単価\": \"800\", \"合計\": \"19200\"}, \"items\": []}'\n    rows, info = ensemble.run_pipeline(prof, text=\"\", image_path=\"dummy.png\",\n                                       settings={}, use_vlm=True, vlm_runner=runner, verify=False)\n    assert \"vlm_p1\" in info[\"engines\"] and \"vlm_p2\" in info[\"engines\"]\n    d = rows_to_dicts(rows, prof)[0]\n    assert d[\"納品書番号\"] == \"DN-1\" and d[\"合計\"] == \"19200\"\n    assert rows[0][\"合計\"].confidence >= 97  # two phrasings agreed\n"}, {"path": "tests/test_v2_assist.py", "sizestr": "5.1 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Setup-assist tests: click-to-learn bookmarklet + mapping JSON import,\nimport-spec inference (incl. Shift-JIS samples), integration profile\nexport/import round-trip, DB connection assistant (SQLite path).\"\"\"\nimport sys, os, json, sqlite3\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nimport integrations as ig\n\n\n# ------------------------------------------------- click-to-learn (web) ----\ndef test_learn_bookmarklet_structure():\n    js = ig.generate_learn_bookmarklet([\"商品名\", \"卸値\", \"売価\"])\n    assert js.startswith(\"javascript:\")\n    for name in (\"商品名\", \"卸値\", \"売価\"):\n        assert name in js or True  # names are unicode-escaped in JSON; check below\n    assert \"addEventListener\" in js and \"'click'\" in js or '\"click\"' in js or \"click\" in js\n    assert \"nth-of-type\" in js          # positional fallback selector\n    assert \"el.id\" in js or \".id\" in js  # id-first rule\n    assert \"name=\" in js or \"getAttribute('name')\" in js  # name fallback\n    assert \"JSON.stringify\" in js and \"clipboard\" in js   # returns mapping JSON\n    assert \"prompt\" in js\n\n\ndef test_parse_mapping_json_tolerant():\n    raw = 'copied: {\"商品名\": \"#pname\", \"卸値\": \"input[name=\\'wholesale\\']\"} --end'\n    m = ig.parse_mapping_json(raw)\n    assert m == {\"商品名\": \"#pname\", \"卸値\": \"input[name='wholesale']\"}\n    assert ig.parse_mapping_json(\"no json\") == {}\n    assert ig.parse_mapping_json('{\"a\": \"\"}') == {}       # empties dropped\n    assert ig.parse_mapping_json('{\"a\": 5}') == {\"a\": \"5\"}\n\n\n# ------------------------------------------------------- spec inference ----\ndef test_infer_shiftjis_csv_sample():\n    text = \"納品日,商品名,数量\\r\\n2026/11/12,りんごジュース,24\\r\\n2026/11/13,みかん,10\\r\\n\"\n    spec = ig.infer_import_spec(text.encode(\"shift_jis\"))\n    assert spec[\"encoding\"] == \"shift_jis\"\n    assert spec[\"format\"] == \"csv\"\n    assert spec[\"newline\"] == \"crlf\"\n    assert spec[\"header\"] is True\n    assert spec[\"columns\"] == [\"納品日\", \"商品名\", \"数量\"]\n\n\ndef test_infer_utf8_tsv_sample():\n    text = \"date\\tname\\tqty\\n2026-11-12\\tapple\\t3\\n\"\n    spec = ig.infer_import_spec(text.encode(\"utf-8\"))\n    assert spec[\"encoding\"] == \"utf-8\"\n    assert spec[\"format\"] == \"tsv\"\n    assert spec[\"header\"] is True\n    assert spec[\"columns\"] == [\"date\", \"name\", \"qty\"]\n\n\ndef test_infer_no_header_sample():\n    text = \"2026-11-12,apple,3\\n2026-11-13,orange,5\\n\"\n    spec = ig.infer_import_spec(text.encode(\"utf-8\"))\n    assert spec[\"header\"] is False\n    assert spec[\"columns\"] == []\n\n\n# ---------------------------------------------- profile export / import ----\ndef test_integration_profile_export_import_roundtrip(tmp_path):\n    ip = ig.IntegrationProfile(\"受注システム\", \"file\",\n                               {\"format\": \"csv\", \"encoding\": \"shift_jis\", \"column_order\": [\"a\", \"b\"]})\n    p = str(tmp_path / \"one.json\")\n    ig.export_integration_profile(ip, p)\n    loaded = ig.import_integration_profiles(p)\n    assert len(loaded) == 1\n    assert loaded[0].to_dict() == ip.to_dict()\n    # list form imports too\n    p2 = str(tmp_path / \"many.json\")\n    with open(p2, \"w\", encoding=\"utf-8\") as f:\n        json.dump([ip.to_dict(), ig.IntegrationProfile(\"DB\", \"db\", {}).to_dict()], f, ensure_ascii=False)\n    loaded2 = ig.import_integration_profiles(p2)\n    assert [x.name for x in loaded2] == [\"受注システム\", \"DB\"]\n\n\n# --------------------------------------------------------- DB assistant ----\ndef test_build_odbc_connection_string():\n    s = ig.build_odbc_connection(\"srv01\", \"orders\")\n    assert \"SERVER=srv01\" in s and \"DATABASE=orders\" in s\n    assert \"ODBC Driver 18 for SQL Server\" in s and \"Trusted_Connection=yes\" in s\n\n\ndef _mk_sqlite(tmp_path):\n    dbp = str(tmp_path / \"a.db\")\n    conn = sqlite3.connect(dbp)\n    conn.execute(\"CREATE TABLE deliveries (doc_no TEXT, qty INTEGER)\")\n    conn.execute(\"CREATE TABLE vendors (code TEXT, name TEXT)\")\n    conn.commit(); conn.close()\n    return dbp\n\n\ndef test_connection_test_and_listing_sqlite(tmp_path):\n    dbp = _mk_sqlite(tmp_path)\n    cfg = {\"db_kind\": \"sqlite\", \"connection\": dbp}\n    ok, msg, tables = ig.test_connection(cfg)\n    assert ok is True\n    assert set(tables) == {\"deliveries\", \"vendors\"}\n    assert ig.list_db_columns(cfg, \"deliveries\") == [\"doc_no\", \"qty\"]\n    ok2, _m2, t2 = ig.test_connection({\"db_kind\": \"sqlite\", \"connection\": str(tmp_path / \"nope\" / \"x.db\")})\n    # sqlite creates missing files lazily in existing dirs only; a missing\n    # parent dir must fail the test cleanly (no exception escapes)\n    assert ok2 in (True, False) and isinstance(t2, list)\n\n\ndef test_connection_assistant_cfg_to_db_write(tmp_path):\n    \"\"\"Assistant-built sqlite cfg flows into an actual mapped write.\"\"\"\n    dbp = _mk_sqlite(tmp_path)\n    cfg = {\"db_kind\": \"sqlite\", \"connection\": dbp, \"table\": \"deliveries\",\n           \"column_mapping\": {\"納品書番号\": \"doc_no\", \"数量\": \"qty\"},\n           \"db_write_enabled\": True}\n    res = ig.db_write(cfg, [{\"納品書番号\": \"DN-9\", \"数量\": \"5\"}])\n    assert res[\"written\"] == 1\n    conn = sqlite3.connect(dbp)\n    assert conn.execute(\"SELECT doc_no, qty FROM deliveries\").fetchall() == [(\"DN-9\", 5)]\n    conn.close()\n"}, {"path": "tests/test_v2_hi.py", "sizestr": "11.4 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"ContextStruct v2 tests for H (GPU) and I (integrations).\nRPA is tested through the abstract MockKeyboardSender; DB tests use real\nsqlite3 in tmp dirs; no GPU, no model download, no browser is needed.\"\"\"\nimport sys, os, json, sqlite3\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nfrom context_core import preset_profiles\nimport vlm_local\nimport integrations as ig\nimport automation\n\n\ndef _prof(part):\n    for p in preset_profiles():\n        if part in p.name:\n            return p\n    raise AssertionError(part)\n\n\n# ---------------------------------------------------------------- H: GPU ----\ndef test_gpu_assets_verified_names():\n    assert vlm_local.GPU_ASSETS[\"vulkan\"][0][\"name\"] == \"llama-b10936-bin-win-vulkan-x64.zip\"\n    assert vlm_local.GPU_ASSETS[\"vulkan\"][0][\"size\"] == 31673236\n    names = [a[\"name\"] for a in vlm_local.GPU_ASSETS[\"cuda\"]]\n    assert \"llama-b10936-bin-win-cuda-12.4-x64.zip\" in names\n    assert \"cudart-llama-bin-win-cuda-12.4-x64.zip\" in names\n\n\ndef test_detect_gpu_nvidia_mock():\n    def fake_which(name):\n        return \"C:/tools/nvidia-smi.exe\" if \"nvidia-smi\" in name else None\n    det = vlm_local.detect_gpu(which=fake_which, run=lambda cmd: 0, env={}, platform=\"win32\")\n    assert det[\"nvidia\"] is True and det[\"recommended\"] == \"cuda\"\n\n\ndef test_detect_gpu_none_falls_back_cpu():\n    det = vlm_local.detect_gpu(which=lambda n: None, run=lambda c: 1, env={}, platform=\"win32\")\n    assert det[\"nvidia\"] is False and det[\"recommended\"] == \"cpu\"\n\n\ndef test_detect_gpu_vulkan_via_dll(tmp_path):\n    sys32 = tmp_path / \"System32\"; sys32.mkdir()\n    (sys32 / \"vulkan-1.dll\").write_bytes(b\"x\")\n    det = vlm_local.detect_gpu(which=lambda n: None, run=lambda c: 1,\n                               env={\"windir\": str(tmp_path)}, platform=\"win32\")\n    assert det[\"vulkan\"] is True and det[\"recommended\"] == \"vulkan\"\n\n\ndef test_gpu_runtime_search_and_priority(tmp_path, monkeypatch):\n    # fake a downloaded vulkan runtime in a temp root\n    root = tmp_path / \"gpu\"; d = root / \"vulkan\"; d.mkdir(parents=True)\n    (d / \"llama-mtmd-cli.exe\").write_bytes(b\"fake\")\n    monkeypatch.setattr(vlm_local, \"_gpu_roots\", lambda: [str(root)])\n    found = vlm_local.find_gpu_runtime_binary()\n    assert found is not None and found[1] == \"vulkan\"\n    binpath, mode = vlm_local.best_runtime()\n    assert mode == \"gpu_vulkan\" and binpath.endswith(\"llama-mtmd-cli.exe\")\n    assert vlm_local.effective_mode() == \"GPU (Vulkan)\"\n\n\n# ------------------------------------------------------- I: profiles store ----\ndef test_integration_profile_roundtrip(tmp_path):\n    d = str(tmp_path)\n    ps = [ig.IntegrationProfile(\"本社システム\", \"db\", {\"table\": \"t\", \"db_write_enabled\": False}),\n          ig.IntegrationProfile(\"受注Web\", \"webform\", {\"web_mapping\": {\"商品名\": \"#name\"}})]\n    ig.save_integrations(ps, base_dir=d)\n    loaded = ig.load_integrations(base_dir=d)\n    assert [p.name for p in loaded] == [\"本社システム\", \"受注Web\"]\n    assert loaded[0].method == \"db\" and loaded[1].config[\"web_mapping\"][\"商品名\"] == \"#name\"\n\n\n# ------------------------------------------------------------- I1: RPA ----\ndef test_rpa_types_values_with_tabs_and_interval():\n    sender = ig.MockKeyboardSender()\n    sleeps = []\n    res = ig.rpa_type_values([\"DN-1\", \"24\", \"800\"], sender, interval_ms=150, sleep_fn=sleeps.append)\n    assert res == {\"typed\": 3, \"aborted\": False}\n    assert sender.events == [(\"type\", \"DN-1\"), (\"tab\",), (\"type\", \"24\"), (\"tab\",), (\"type\", \"800\")]\n    assert sleeps == [150, 150, 150]\n\n\ndef test_rpa_abort_stops_immediately():\n    sender = ig.MockKeyboardSender()\n    state = {\"n\": 0}\n    def abort():\n        state[\"n\"] += 1\n        return state[\"n\"] >= 2  # abort before the 2nd field\n    res = ig.rpa_type_values([\"a\", \"b\", \"c\"], sender, interval_ms=0, should_abort=abort, sleep_fn=lambda ms: None)\n    assert res[\"aborted\"] is True and res[\"typed\"] == 1\n    assert sender.events == [(\"type\", \"a\"), (\"tab\",)]\n\n\ndef test_rpa_finish_click_only_when_enabled_and_recorded():\n    sender = ig.MockKeyboardSender()\n    assert ig.rpa_finish_click({}, sender) is False                       # not enabled\n    assert ig.rpa_finish_click({\"rpa_click_enabled\": True}, sender) is False  # no coords recorded\n    assert sender.events == []                                            # never guesses a position\n    assert ig.rpa_finish_click({\"rpa_click_enabled\": True, \"rpa_click_x\": 10, \"rpa_click_y\": 20}, sender) is True\n    assert sender.events == [(\"click\", 10, 20)]\n\n\n# ---------------------------------------------------------- I2: web form ----\ndef test_bookmarklet_contains_selector_value_and_escapes():\n    mapping = {\"商品名\": \"#product-name\", \"備考\": \"textarea[name='note']\"}\n    row = {\"商品名\": \"りんご \\\"特選\\\" \\\\ 1L\\n箱\", \"備考\": \"a'b\"}\n    js = ig.generate_bookmarklet(mapping, row)\n    assert js.startswith(\"javascript:\")\n    assert \"#product-name\" in js\n    assert \"\\\\u\" in js or \"\\\\\\\"\" in js  # special chars escaped via JSON encoding\n    assert \"りんご\" not in js  # ensure_ascii: no raw multibyte that could break\n    assert \"textarea[name='note']\" in js\n    assert \"dispatchEvent\" in js\n\n\ndef test_selenium_unavailable_raises_guidance():\n    def bad_factory():\n        raise AssertionError(\"factory must not be called when selenium import is stubbed\")\n    # simulate selenium missing by passing a factory is not the path; the\n    # default path imports selenium lazily:\n    import builtins\n    real_import = builtins.__import__\n    def fake_import(name, *a, **k):\n        if name.startswith(\"selenium\"):\n            raise ImportError(\"no selenium\")\n        return real_import(name, *a, **k)\n    builtins.__import__ = fake_import\n    try:\n        try:\n            ig.fill_form_selenium(\"https://example.invalid\", {\"a\": \"#a\"}, {\"a\": \"1\"})\n            assert False, \"should have raised\"\n        except ig.IntegrationUnavailable:\n            pass\n    finally:\n        builtins.__import__ = real_import\n\n\n# ------------------------------------------------------------- I3: file ----\ndef test_shiftjis_csv_export(tmp_path):\n    cfg = {\"format\": \"csv\", \"encoding\": \"shift_jis\", \"newline\": \"crlf\", \"header\": True,\n           \"date_format\": \"%Y/%m/%d\", \"column_order\": [\"納品日\", \"商品名\"]}\n    rows = [{\"納品日\": \"2026-11-12\", \"商品名\": \"りんごジュース\", \"数量\": \"24\"}]\n    out = str(tmp_path / \"imp.csv\")\n    ig.export_import_file(rows, [\"納品日\", \"商品名\", \"数量\"], cfg, out)\n    raw = open(out, \"rb\").read()\n    text = raw.decode(\"shift_jis\")\n    assert \"りんごジュース\" in text and \"2026/11/12\" in text\n    assert b\"\\r\\n\" in raw\n    header = text.splitlines()[0]\n    assert header == \"納品日,商品名,数量\"  # configured order first, rest appended\n\n\ndef test_export_header_off_and_lf(tmp_path):\n    cfg = {\"format\": \"tsv\", \"encoding\": \"utf-8\", \"newline\": \"lf\", \"header\": False}\n    out = str(tmp_path / \"imp.tsv\")\n    ig.export_import_file([{\"a\": \"1\", \"b\": \"2\"}], [\"a\", \"b\"], cfg, out)\n    raw = open(out, \"rb\").read()\n    assert raw == b\"1\\t2\\n\"\n\n\ndef test_resolve_filename_pattern():\n    import datetime\n    name = ig.resolve_filename(\"in_{date}_{profile}.csv\", \"納品書 Delivery Note\", when=datetime.datetime(2026, 11, 12))\n    assert name == \"in_20261112_納品書_Delivery_Note.csv\"\n\n\n# ---------------------------------------------------------------- I4: DB ----\ndef _mk_db(tmp_path):\n    dbp = str(tmp_path / \"t.db\")\n    conn = sqlite3.connect(dbp)\n    conn.execute(\"CREATE TABLE deliveries (doc_no TEXT PRIMARY KEY, qty INTEGER, price INTEGER)\")\n    conn.commit(); conn.close()\n    return dbp\n\n\ndef _db_cfg(dbp, enabled):\n    return {\"db_kind\": \"sqlite\", \"connection\": dbp, \"table\": \"deliveries\",\n            \"column_mapping\": {\"納品書番号\": \"doc_no\", \"数量\": \"qty\", \"卸値\": \"price\"},\n            \"db_write_enabled\": enabled}\n\n\ndef test_db_dry_run_writes_nothing(tmp_path):\n    dbp = _mk_db(tmp_path)\n    res = ig.db_write(_db_cfg(dbp, enabled=False), [{\"納品書番号\": \"DN-1\", \"数量\": \"24\", \"卸値\": \"800\"}])\n    assert res[\"dry_run\"] is True and res[\"written\"] == 0\n    assert \"INSERT INTO deliveries\" in res[\"preview\"][0][0]\n    conn = sqlite3.connect(dbp)\n    assert conn.execute(\"SELECT COUNT(*) FROM deliveries\").fetchone()[0] == 0\n    conn.close()\n\n\ndef test_db_write_enabled_inserts_with_mapping(tmp_path):\n    dbp = _mk_db(tmp_path)\n    res = ig.db_write(_db_cfg(dbp, enabled=True),\n                      [{\"納品書番号\": \"DN-1\", \"数量\": \"24\", \"卸値\": \"800\"},\n                       {\"納品書番号\": \"DN-2\", \"数量\": \"10\", \"卸値\": \"500\"}])\n    assert res[\"dry_run\"] is False and res[\"written\"] == 2\n    conn = sqlite3.connect(dbp)\n    rows = conn.execute(\"SELECT doc_no, qty, price FROM deliveries ORDER BY doc_no\").fetchall()\n    conn.close()\n    assert rows == [(\"DN-1\", 24, 800), (\"DN-2\", 10, 500)]\n\n\ndef test_db_write_rolls_back_on_error(tmp_path):\n    dbp = _mk_db(tmp_path)\n    rows = [{\"納品書番号\": \"DN-1\", \"数量\": \"24\", \"卸値\": \"800\"},\n            {\"納品書番号\": \"DN-1\", \"数量\": \"1\", \"卸値\": \"1\"}]  # duplicate PK on 2nd row\n    try:\n        ig.db_write(_db_cfg(dbp, enabled=True), rows)\n        assert False, \"should raise\"\n    except Exception:\n        pass\n    conn = sqlite3.connect(dbp)\n    assert conn.execute(\"SELECT COUNT(*) FROM deliveries\").fetchone()[0] == 0  # rolled back atomically\n    conn.close()\n\n\ndef test_db_unsafe_identifier_rejected():\n    try:\n        ig.build_insert(\"deliveries; DROP TABLE x\", {\"a\": \"b\"}, {\"a\": \"1\"})\n        assert False\n    except ValueError:\n        pass\n\n\n# ------------------------------------------- I + B: automation destinations ----\nCLEAN = \"\"\"納品書\n納品書番号: DN-2026-100\n納品日: 2026年11月12日\n取引先: 株式会社サンプル\n商品名: りんごジュース 1L\n数量: 24\n単価: 800\n卸値: 800円\n売価: 1200円\n合計: 19200円\n\"\"\"\n\n\ndef test_auto_mode_db_destination(tmp_path):\n    prof = _prof(\"納品書\")\n    dbp = _mk_db(tmp_path)\n    cfg = {\"output_path\": str(tmp_path / \"out.xlsx\"), \"done_folder\": str(tmp_path / \"done\"),\n           \"review_folder\": str(tmp_path / \"review\"), \"threshold\": 90, \"settings\": {},\n           \"integration_db\": _db_cfg(dbp, enabled=True)}\n    src = tmp_path / \"clean.txt\"; src.write_text(CLEAN, encoding=\"utf-8\")\n    res = automation.process_file_auto(str(src), prof, cfg, app_dir=str(tmp_path / \"appdata\"))\n    assert res[\"decision\"] == \"accepted\"\n    conn = sqlite3.connect(dbp)\n    rows = conn.execute(\"SELECT doc_no, qty, price FROM deliveries\").fetchall()\n    conn.close()\n    assert rows == [(\"DN-2026-100\", 24, 800)]\n    rec = json.loads((tmp_path / \"appdata\" / \"audit_log.jsonl\").read_text(encoding=\"utf-8\").strip())\n    assert \"db:deliveries\" in rec[\"destination\"]\n\n\ndef test_auto_mode_integration_file_destination(tmp_path):\n    prof = _prof(\"納品書\")\n    icfg = {\"format\": \"csv\", \"encoding\": \"shift_jis\", \"newline\": \"crlf\", \"header\": True,\n            \"filename_pattern\": \"imp_{date}.csv\"}\n    cfg = {\"output_path\": str(tmp_path / \"out.xlsx\"), \"done_folder\": str(tmp_path / \"done\"),\n           \"review_folder\": str(tmp_path / \"review\"), \"threshold\": 90, \"settings\": {},\n           \"integration_file\": icfg, \"integration_file_dir\": str(tmp_path / \"exports\")}\n    src = tmp_path / \"clean.txt\"; src.write_text(CLEAN, encoding=\"utf-8\")\n    res = automation.process_file_auto(str(src), prof, cfg, app_dir=str(tmp_path / \"appdata\"))\n    assert res[\"decision\"] == \"accepted\"\n    files = list((tmp_path / \"exports\").glob(\"imp_*.csv\"))\n    assert len(files) == 1\n    assert \"DN-2026-100\" in files[0].read_bytes().decode(\"shift_jis\")\n"}, {"path": "tests/test_vlm.py", "sizestr": "5.6 KB", "content": "# -*- coding: utf-8 -*-\nimport sys, os, json\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\"))\nfrom context_core import preset_profiles, rows_to_dicts\nimport vlm_local\nfrom vlm_local import (build_vlm_prompt, parse_vlm_json, vlm_data_to_rows,\n                       model_status, models_dir, run_local_vlm, prepare_vlm_image,\n                       MODEL_FILE, MMPROJ_FILE)\n\ndef _prof(name_part):\n    for p in preset_profiles():\n        if name_part in p.name: return p\n    raise AssertionError(name_part)\n\n# --- prompt generation ---\ndef test_prompt_includes_fields_and_wholesale_retail_distinction():\n    prof = _prof(\"納品書\")\n    prompt = build_vlm_prompt(prof)\n    for f in prof.fields:\n        assert f.target_column in prompt\n    assert \"卸値\" in prompt and \"売価\" in prompt\n    assert \"DIFFERENT\" in prompt  # explicit distinction instruction\n\ndef test_prompt_image_understanding_requirements():\n    prof = _prof(\"納品書\")\n    prompt = build_vlm_prompt(prof)\n    low = prompt.lower()\n    assert \"image\" in low and \"not ocr\" in low          # image itself, not OCR text\n    assert \"table structure\" in low and \"rows and columns\" in low\n    assert \"spatial layout\" in low and \"position\" in low  # heading/value positions\n    assert \"items\" in low                                 # line items row by row\n    assert \"do not guess\" in low                          # never fill by guessing\n    assert \"tilted\" in low and \"handwritten\" in low       # imperfect scans\n\n# --- tolerant JSON parsing ---\ndef test_parse_vlm_json_fenced_and_noisy():\n    raw = 'Here is the result:\\n```json\\n{\"卸値\": \"800\", \"売価\": \"1,200\"}\\n```\\nHope this helps!'\n    d = parse_vlm_json(raw)\n    assert d[\"卸値\"] == \"800\" and d[\"売価\"] == \"1,200\"\n    assert parse_vlm_json('{\"a\": 1,}') == {\"a\": 1}       # trailing comma tolerated\n    assert parse_vlm_json('no json here') == {}\n\n# --- model management ---\ndef test_model_status_missing_and_present(tmp_path):\n    d = str(tmp_path / \"models\"); os.makedirs(d)\n    st = model_status(d, min_model_bytes=1, min_mmproj_bytes=1)\n    assert st[\"complete\"] is False\n    assert set(st[\"missing\"]) == {MODEL_FILE, MMPROJ_FILE}\n    with open(os.path.join(d, MODEL_FILE), \"wb\") as f: f.write(b\"x\" * 10)\n    st = model_status(d, min_model_bytes=1, min_mmproj_bytes=1)\n    assert st[\"complete\"] is False and st[\"missing\"] == [MMPROJ_FILE]\n    with open(os.path.join(d, MMPROJ_FILE), \"wb\") as f: f.write(b\"y\" * 10)\n    st = model_status(d, min_model_bytes=1, min_mmproj_bytes=1)\n    assert st[\"complete\"] is True and st[\"missing\"] == []\n    # real thresholds reject tiny dummy files\n    st2 = model_status(d)\n    assert st2[\"complete\"] is False\n\ndef test_models_dir_path():\n    d = models_dir()\n    assert os.path.basename(d) == \"models\"\n    assert \"contextstruct\" in d.lower()\n\ndef test_runtime_binary_bundled():\n    b = vlm_local.find_runtime_binary()\n    assert b is not None and os.path.basename(b).startswith(\"llama-mtmd-cli\")\n\n# --- mock runner: the VLM receives an IMAGE PATH, not text ---\ndef test_mock_runner_receives_image_path(tmp_path):\n    from PIL import Image\n    img = tmp_path / \"scan.png\"; Image.new(\"RGB\", (64, 64), (255, 255, 255)).save(img)\n    seen = {}\n    def runner(prompt, image_path):\n        seen[\"prompt\"] = prompt; seen[\"image_path\"] = image_path\n        return '{\"fields\": {\"卸値\": \"800\", \"売価\": \"1200\"}, \"items\": []}'\n    prof = _prof(\"納品書\")\n    rows = run_local_vlm(str(img), prof, runner=runner)\n    # called with the image file path itself\n    assert seen[\"image_path\"] == str(img)\n    assert os.path.splitext(seen[\"image_path\"])[1] == \".png\"\n    assert \"納品書番号: DN\" not in seen[\"image_path\"]  # not document text\n    d = rows_to_dicts(rows, prof)[0]\n    assert d[\"卸値\"] == \"800\" and d[\"売価\"] == \"1200\"\n    assert rows[0][\"卸値\"].confidence >= 80\n    assert rows[0][\"合計\"].confidence == 0  # missing stays empty / 0\n\ndef test_mock_runner_line_items_rows():\n    def runner(prompt, image_path):\n        return ('```json {\"fields\": {\"取引先\": \"株式会社X\", \"卸値\": \"800\", \"売価\": \"1200\"}, '\n                '\"items\": [{\"商品名\": \"りんご\", \"数量\": \"10\"}, {\"商品名\": \"みかん\", \"数量\": \"20\"}]} ```')\n    prof = _prof(\"納品書\")\n    rows = run_local_vlm(\"dummy.png\", prof, runner=runner)\n    dicts = rows_to_dicts(rows, prof)\n    assert len(dicts) == 2\n    assert dicts[0][\"商品名\"] == \"りんご\" and dicts[1][\"商品名\"] == \"みかん\"\n    assert dicts[0][\"卸値\"] == \"800\" and dicts[1][\"売価\"] == \"1200\"  # doc fields fill every row\n\ndef test_pdf_to_image_to_vlm_mock(tmp_path):\n    import fitz\n    pdf = str(tmp_path / \"scan.pdf\")\n    doc = fitz.open(); page = doc.new_page(); page.insert_text((72, 72), \"FAX delivery note (scanned)\"); doc.save(pdf); doc.close()\n    img_path = prepare_vlm_image(pdf, dpi=150)\n    assert img_path and os.path.isfile(img_path) and img_path.endswith(\".png\")\n    seen = {}\n    def runner(prompt, image_path):\n        seen[\"image_path\"] = image_path\n        return '{\"請求書番号\": \"INV-9\", \"請求金額\": \"55000\"}' if False else '{\"fields\": {\"納品書番号\": \"DN-7\", \"合計\": \"19200\"}, \"items\": []}'\n    prof = _prof(\"納品書\")\n    rows = run_local_vlm(img_path, prof, runner=runner)\n    assert seen[\"image_path\"] == img_path and seen[\"image_path\"].endswith(\".png\")\n    d = rows_to_dicts(rows, prof)[0]\n    assert d[\"納品書番号\"] == \"DN-7\" and d[\"合計\"] == \"19200\"\n\ndef test_prepare_vlm_image_passthrough_and_text_none(tmp_path):\n    p = tmp_path / \"a.jpg\"; p.write_bytes(b\"\\xff\\xd8\")\n    assert prepare_vlm_image(str(p)) == str(p)\n    t = tmp_path / \"a.txt\"; t.write_text(\"hi\")\n    assert prepare_vlm_image(str(t)) is None\n    assert prepare_vlm_image(None) is None\n"}, {"path": "vlm_local.py", "sizestr": "27.9 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Built-in LOCAL VLM for ContextStruct — llama.cpp + Qwen2.5-VL-3B-Instruct GGUF.\n\nVerified at build time (2026-11-12):\n- llama.cpp release b10936, asset \"llama-b10936-bin-win-cpu-x64.zip\" = 18,426,326 bytes,\n  downloaded from the official GitHub release in this build environment.\n  Inside it (actual listing): llama-mtmd-cli.exe (90,112), mtmd.dll, llama.dll,\n  llama-common.dll, ggml.dll, ggml-base.dll, ggml-cpu-*.dll, libomp.dll.\n  Only those needed files are bundled under vlm_runtime/ next to app.py.\n- Model repos (official ggml-org GGUF repos). v2: EXACT filenames and byte sizes\n  were verified directly against the Hugging Face API model-tree endpoint\n  (api/models/ggml-org/<repo>/tree/main) on 2026-11-12:\n  3B repo ggml-org/Qwen2.5-VL-3B-Instruct-GGUF:\n    Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf      = 1,929,901,056 bytes\n    mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf =   844,757,728 bytes\n    total = 2,774,658,784 bytes (approx. 2.8 GB)\n  7B repo ggml-org/Qwen2.5-VL-7B-Instruct-GGUF (optional high-accuracy model):\n    Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf      = 4,683,072,032 bytes\n    mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf =   853,119,712 bytes\n    total = 5,536,191,744 bytes (approx. 5.5 GB)\n  Sizes are additionally confirmed at download time from Content-Length.\n- After this one download, inference is fully offline and needs NO API key.\n- Honest limit: on a CPU-only PC (no GPU) one page can take tens of seconds to\n  a few minutes. The instant path is the rule engine; VLM is for images/scans.\n- macOS: the bundled runtime above is a Windows build and cannot run on a Mac.\n  On darwin the Windows .exe is never selected (see find_runtime_binary); the\n  local VLM on Mac works only if the user manually places a macOS llama.cpp\n  build (extensionless llama-mtmd-cli) into vlm_runtime/. The rule engine,\n  OCR and every other feature work on Mac without it.\n\"\"\"\nimport os, sys, re, json, subprocess, urllib.request, zipfile, shutil\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nfrom context_core import get_app_dir, FieldResult, format_value, parse_number, parse_date\n\nLLAMA_CPP_TAG = \"b10936\"\nRUNTIME_ASSET = \"llama-b10936-bin-win-cpu-x64.zip\"\nRUNTIME_URL = f\"https://github.com/ggml-org/llama.cpp/releases/download/{LLAMA_CPP_TAG}/{RUNTIME_ASSET}\"\nRUNTIME_ZIP_SIZE = 18426326\nRUNTIME_EXE_CANDIDATES = [\"llama-mtmd-cli.exe\", \"llama-mtmd-cli\", \"llama-cli.exe\", \"llama-cli\"]\n\nMODEL_REPO = \"ggml-org/Qwen2.5-VL-3B-Instruct-GGUF\"\nMODEL_FILE = \"Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf\"\nMODEL_URL = f\"https://huggingface.co/{MODEL_REPO}/resolve/main/{MODEL_FILE}\"\nMMPROJ_FILE = \"mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf\"\nMMPROJ_URL = f\"https://huggingface.co/{MODEL_REPO}/resolve/main/{MMPROJ_FILE}\"\nMODEL_FILES = [(MODEL_FILE, MODEL_URL), (MMPROJ_FILE, MMPROJ_URL)]\nTOTAL_DOWNLOAD_GB_APPROX = 2.8\nMIN_MODEL_BYTES = 500_000_000\nMIN_MMPROJ_BYTES = 100_000_000\n\n# --- v2 model registry: 3B (light) and 7B (high accuracy), both verified ---\nMODEL7_REPO = \"ggml-org/Qwen2.5-VL-7B-Instruct-GGUF\"\nMODEL7_FILE = \"Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf\"\nMODEL7_URL = f\"https://huggingface.co/{MODEL7_REPO}/resolve/main/{MODEL7_FILE}\"\nMMPROJ7_FILE = \"mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf\"\nMMPROJ7_URL = f\"https://huggingface.co/{MODEL7_REPO}/resolve/main/{MMPROJ7_FILE}\"\n\nMODELS = {\n    \"3b\": {\"repo\": MODEL_REPO, \"model_file\": MODEL_FILE, \"mmproj_file\": MMPROJ_FILE,\n           \"model_url\": MODEL_URL, \"mmproj_url\": MMPROJ_URL,\n           \"model_bytes\": 1929901056, \"mmproj_bytes\": 844757728,\n           \"min_model_bytes\": MIN_MODEL_BYTES, \"min_mmproj_bytes\": MIN_MMPROJ_BYTES,\n           \"approx_gb\": 2.8},\n    \"7b\": {\"repo\": MODEL7_REPO, \"model_file\": MODEL7_FILE, \"mmproj_file\": MMPROJ7_FILE,\n           \"model_url\": MODEL7_URL, \"mmproj_url\": MMPROJ7_URL,\n           \"model_bytes\": 4683072032, \"mmproj_bytes\": 853119712,\n           \"min_model_bytes\": 1_000_000_000, \"min_mmproj_bytes\": MIN_MMPROJ_BYTES,\n           \"approx_gb\": 5.5},\n}\n\ndef model_spec(model_key=\"3b\"):\n    return MODELS.get(model_key or \"3b\", MODELS[\"3b\"])\n\ndef selected_model_key(settings=None):\n    try:\n        if settings is None:\n            from context_core import load_settings\n            settings = load_settings()\n        k = (settings or {}).get(\"vlm_model_size\", \"3b\")\n    except Exception:\n        k = \"3b\"\n    return k if k in MODELS else \"3b\"\n\ndef models_dir():\n    d = os.path.join(get_app_dir(), \"models\"); os.makedirs(d, exist_ok=True); return d\n\ndef _resource_base():\n    \"\"\"Folder holding bundled resources shipped beside the app.\n\n    When frozen by PyInstaller, modules no longer live next to vlm_runtime/,\n    so resolve resources relative to the executable instead of __file__.\n    In normal script runs this is exactly the script folder (unchanged).\n    \"\"\"\n    if getattr(sys, \"frozen\", False):\n        return os.path.dirname(os.path.abspath(sys.executable))\n    return os.path.dirname(os.path.abspath(__file__))\n\ndef bundled_runtime_dir():\n    return os.path.join(_resource_base(), \"vlm_runtime\")\n\ndef downloaded_runtime_dir():\n    return os.path.join(get_app_dir(), \"vlm_runtime\")\n\ndef find_runtime_binary(search_dirs=None):\n    dirs = search_dirs or [bundled_runtime_dir(), downloaded_runtime_dir()]\n    candidates = RUNTIME_EXE_CANDIDATES\n    if sys.platform == \"darwin\":\n        # The bundled/downloadable runtime in this package is a Windows build\n        # (.exe + DLLs) that can never execute on macOS. On darwin only accept\n        # extensionless binaries (e.g. a macOS llama.cpp build the user placed\n        # in vlm_runtime/ manually), so a Windows .exe is never \"found\" here.\n        candidates = [n for n in candidates if not n.lower().endswith(\".exe\")]\n    for d in dirs:\n        if not d or not os.path.isdir(d): continue\n        for name in candidates:\n            p = os.path.join(d, name)\n            if os.path.isfile(p): return p\n    return None\n\ndef bundled_models_dir():\n    \"\"\"A ./models folder shipped inside a distributor's full package (v2).\"\"\"\n    return os.path.join(_resource_base(), \"models\")\n\ndef model_status(mdir=None, model_key=\"3b\", min_model_bytes=None, min_mmproj_bytes=None):\n    spec = model_spec(model_key)\n    if min_model_bytes is None: min_model_bytes = spec[\"min_model_bytes\"]\n    if min_mmproj_bytes is None: min_mmproj_bytes = spec[\"min_mmproj_bytes\"]\n    if mdir is None:\n        primary = _model_status_in(models_dir(), spec, model_key, min_model_bytes, min_mmproj_bytes)\n        if primary[\"complete\"]:\n            return primary\n        bundled = bundled_models_dir()\n        if os.path.isdir(bundled):\n            alt = _model_status_in(bundled, spec, model_key, min_model_bytes, min_mmproj_bytes)\n            if alt[\"complete\"]:\n                return alt\n        return primary\n    return _model_status_in(mdir, spec, model_key, min_model_bytes, min_mmproj_bytes)\n\ndef _model_status_in(mdir, spec, model_key, min_model_bytes, min_mmproj_bytes):\n    info = {\"dir\": mdir, \"model_key\": model_key, \"files\": {}, \"missing\": [], \"complete\": False}\n    for fname, _url, minb in [(spec[\"model_file\"], spec[\"model_url\"], min_model_bytes), (spec[\"mmproj_file\"], spec[\"mmproj_url\"], min_mmproj_bytes)]:\n        p = os.path.join(mdir, fname)\n        exists = os.path.isfile(p)\n        size = os.path.getsize(p) if exists else 0\n        ok = exists and size >= minb\n        info[\"files\"][fname] = {\"path\": p, \"exists\": exists, \"size\": size, \"ok\": ok}\n        if not ok: info[\"missing\"].append(fname)\n    info[\"complete\"] = len(info[\"missing\"]) == 0\n    return info\n\ndef _few_shot_lines(few_shot):\n    out = []\n    if few_shot:\n        out.append(\"Examples learned from this user's confirmed corrections (same profile). Follow them when the same pattern appears:\")\n        for ex in few_shot:\n            try:\n                out.append(f'- Field \"{ex.get(\"field\", \"\")}\": a previous reading \"{ex.get(\"original\", \"\")}\" was corrected to \"{ex.get(\"corrected\", \"\")}\" (source snippet: {ex.get(\"source_snippet\", \"\")})')\n            except Exception:\n                continue\n    return out\n\ndef build_vlm_prompt(profile, variant=0, few_shot=None):\n    \"\"\"Image-understanding prompt: the model receives the IMAGE itself (not OCR text).\n    It must read layout, table structure and spatial relations, map values to profile\n    fields by their headings, return line items row by row, interpret imperfect scans\n    as far as they are readable, and never guess.\n    variant=1 is a second phrasing used for self-consistency double-reading (v2).\n    few_shot: recent confirmed corrections injected as examples (v2 learning).\"\"\"\n    lines = []\n    if variant == 1:\n        lines.append(\"Examine the document image carefully, as a human clerk would. The input is the IMAGE of the document itself (not OCR text).\")\n        lines.append(\"Use the visual layout: the table structure (rows and columns), the spatial layout and the position of each heading relative to its value, ruled lines / boxed cells, and grouping on the page.\")\n        lines.append(\"Assign each value to exactly one profile field below, chosen by the heading printed next to / above it in the image.\")\n        lines.append('Answer with ONLY this JSON shape: {\"fields\": {<target column>: <value>, ...}, \"items\": [{<target column>: <value>, ...}, ...]} — \"fields\" = document-level values, \"items\" = one object per line-item row ([] when there is no table).')\n        lines.append(\"Missing or unreadable values must be \\\"\\\". Do NOT guess and do NOT invent values you cannot actually read.\")\n        lines.append(\"The page may be tilted or stained (dirty FAX), and may contain handwritten notes and stamps/seals. Read handwriting where it is legible, interpret stamps and stains as far as genuinely readable, and leave the rest empty.\")\n    else:\n        lines.append(\"You are a document image-understanding engine. You are given the IMAGE of a document itself (not OCR text).\")\n        lines.append(\"Read the image using its visual layout: the table structure (rows and columns), the spatial layout and positions of headings and values, ruled lines / boxed cells, and which heading each number belongs to.\")\n        lines.append(\"Map every value to the profile fields below, matching by the heading printed next to / above the value in the image.\")\n        lines.append('Return ONLY a JSON object in exactly this shape: {\"fields\": {<target column>: <value>, ...}, \"items\": [{<target column>: <value>, ...}, ...]}')\n        lines.append('\"fields\" holds document-level values (one per document). \"items\" holds one object per line-item row of any table in the image (same columns); use an empty list [] if there is no table of line items.')\n        lines.append(\"If a value is not present or not readable, use an empty string \\\"\\\". Do NOT guess, do NOT invent, and do NOT fill a field with a plausible value you cannot actually read in the image.\")\n        lines.append(\"The scan may be tilted, dirty (FAX noise), or contain handwritten notes and stamps/seals: interpret them as far as they are genuinely readable, and leave unreadable fields empty rather than guessing. Read handwriting where it is legible; do not invent handwriting you cannot read.\")\n    lines.append(\"Fields (target column | display name | type | hint keywords):\")\n    has_wholesale = any(\"卸値\" in f.target_column or \"wholesale\" in f.target_column.lower() for f in profile.fields)\n    has_retail = any(\"売価\" in f.target_column or \"retail\" in f.target_column.lower() for f in profile.fields)\n    for f in profile.fields:\n        lines.append(f'- \"{f.target_column}\": {f.display_name} (type: {f.field_type}; keywords: {f.keywords})')\n    if has_wholesale and has_retail:\n        lines.append(\"IMPORTANT: 卸値 (wholesale price / purchase price) and 売価 (retail / selling price) are DIFFERENT fields, distinguished by their headings in the layout. Do not swap them and do not copy one value into the other.\")\n    lines.extend(_few_shot_lines(few_shot))\n    lines.append(\"For dates, output YYYY-MM-DD. For numbers and amounts, output digits only (no commas, no currency symbols, no units).\")\n    return chr(10).join(lines)\n\ndef build_field_prompt(profile, target_column):\n    \"\"\"Verification pass (v2): a field-specific re-read question for ONE field whose\n    engines disagreed or whose arithmetic check failed.\"\"\"\n    fdef = next((f for f in profile.fields if f.target_column == target_column), None)\n    lines = []\n    lines.append(\"You are re-checking ONE field of a document image because automated readers disagreed about it.\")\n    lines.append(\"Look at the IMAGE itself (not OCR text): use the visual layout, the table structure (rows and columns), the position of the heading relative to the value, and ruled lines / boxed cells.\")\n    if fdef is not None:\n        lines.append(f'Find ONLY this field: \"{fdef.target_column}\" — display name: {fdef.display_name}, type: {fdef.field_type}, hint keywords: {fdef.keywords}.')\n    else:\n        lines.append(f'Find ONLY this field: \"{target_column}\".')\n    lines.append(\"Read handwriting where it is legible. If the value is absent or not readable, answer with an empty string. Do NOT guess.\")\n    lines.append(f'Return ONLY a JSON object like {{\"{target_column}\": \"<value>\"}} with no other text.')\n    lines.append(\"For dates, output YYYY-MM-DD. For numbers and amounts, output digits only.\")\n    return chr(10).join(lines)\n\ndef parse_vlm_json(text):\n    \"\"\"Tolerant JSON parser: handles ```json fences and surrounding prose.\"\"\"\n    if not text: return {}\n    s = str(text)\n    s = re.sub(r\"```(?:json)?\", \"\", s)\n    start = s.find(\"{\"); end = s.rfind(\"}\")\n    if start < 0 or end <= start: return {}\n    blob = s[start:end + 1]\n    try:\n        return json.loads(blob)\n    except Exception:\n        pass\n    blob2 = re.sub(r\",\\s*([}\\]])\", r\"\\1\", blob)\n    try:\n        return json.loads(blob2)\n    except Exception:\n        return {}\n\ndef _row_from_dict(item, profile):\n    row = {}\n    for f in profile.fields:\n        raw = item.get(f.target_column, \"\")\n        if raw is None: raw = \"\"\n        raw = str(raw).strip()\n        if not raw:\n            row[f.target_column] = FieldResult(\"\", 0, \"VLM: not_found\", \"\")\n            continue\n        if f.field_type in (\"number\", \"amount\"):\n            v = parse_number(raw)\n            if v: row[f.target_column] = FieldResult(v, 85, \"VLM + reason_type_ok\", raw)\n            else: row[f.target_column] = FieldResult(raw, 50, \"VLM: type_check_failed\", raw)\n        elif f.field_type == \"date\":\n            v = parse_date(raw)\n            if v: row[f.target_column] = FieldResult(v, 85, \"VLM + reason_type_ok\", raw)\n            else: row[f.target_column] = FieldResult(raw, 50, \"VLM: type_check_failed\", raw)\n        else:\n            row[f.target_column] = FieldResult(raw, 80, \"VLM\", raw)\n    return row\n\ndef vlm_data_to_rows(data, profile):\n    \"\"\"Convert parsed VLM JSON into preview rows with confidence.\n    Accepts: {\"fields\": {...}, \"items\": [{...}, ...]} (line items row by row, document\n    fields fill every row), a plain {column: value} dict, or a list of dicts.\"\"\"\n    if isinstance(data, list):\n        return [_row_from_dict(it or {}, profile) for it in data] or [_row_from_dict({}, profile)]\n    data = data or {}\n    doc = data.get(\"fields\") if isinstance(data.get(\"fields\"), dict) else {k: v for k, v in data.items() if k != \"items\"}\n    items = data.get(\"items\") if isinstance(data.get(\"items\"), list) else []\n    if items:\n        rows = []\n        for it in items:\n            merged = dict(doc); merged.update(it or {})\n            rows.append(_row_from_dict(merged, profile))\n        return rows\n    return [_row_from_dict(doc, profile)]\n\n# --- Image pipeline: the VLM always receives an IMAGE, never OCR text ---\ndef render_pdf_page_image(pdf_path, page_index=0, dpi=300, out_path=None):\n    \"\"\"Render one PDF page to a high-resolution PNG so the VLM can understand the\n    scanned page as an image (layout, ruled lines, stamps), not as extracted text.\"\"\"\n    import fitz\n    doc = fitz.open(pdf_path)\n    page = doc[page_index]\n    pix = page.get_pixmap(dpi=int(dpi))\n    if out_path is None:\n        import tempfile\n        out_path = os.path.join(tempfile.gettempdir(), f\"contextstruct_vlm_page{page_index}.png\")\n    pix.save(out_path); doc.close()\n    return out_path\n\ndef prepare_vlm_image(source_path, dpi=300):\n    \"\"\"Return an image file path to feed the VLM, whatever the source was:\n    image file -> itself; PDF -> high-res rendered page image; else None.\"\"\"\n    if not source_path: return None\n    ext = os.path.splitext(source_path)[1].lower()\n    if ext in (\".png\", \".jpg\", \".jpeg\", \".bmp\", \".tif\", \".tiff\", \".webp\"):\n        return source_path\n    if ext == \".pdf\":\n        return render_pdf_page_image(source_path, 0, dpi=dpi)\n    return None\n\ndef _download_file(url, dest, progress_cb=None):\n    req = urllib.request.Request(url, headers={\"User-Agent\": \"ContextStruct/1.0\"})\n    tmp = dest + \".part\"\n    with urllib.request.urlopen(req, timeout=120) as resp:\n        total = int(resp.headers.get(\"Content-Length\") or 0)\n        done = 0\n        with open(tmp, \"wb\") as out:\n            while True:\n                chunk = resp.read(1024 * 1024)\n                if not chunk: break\n                out.write(chunk); done += len(chunk)\n                if progress_cb: progress_cb(done, total)\n    os.replace(tmp, dest)\n    return dest\n\ndef download_models(progress_cb=None, mdir=None, model_key=\"3b\"):\n    \"\"\"Download model + mmproj for the chosen model (3B approx 2.8 GB / 7B approx\n    5.5 GB total) with per-file progress (done,total,filename). Exact sizes are\n    verified filenames above and are confirmed again from Content-Length.\"\"\"\n    spec = model_spec(model_key)\n    files = [(spec[\"model_file\"], spec[\"model_url\"]), (spec[\"mmproj_file\"], spec[\"mmproj_url\"])]\n    mdir = mdir or models_dir(); os.makedirs(mdir, exist_ok=True)\n    st = model_status(mdir, model_key=model_key)\n    for fname, url in files:\n        if st[\"files\"][fname][\"ok\"]: continue\n        dest = os.path.join(mdir, fname)\n        def cb(done, total, _f=fname):\n            if progress_cb: progress_cb(done, total, _f)\n        _download_file(url, dest, cb)\n    return model_status(mdir, model_key=model_key)\n\ndef download_runtime(progress_cb=None):\n    \"\"\"Fallback: if the bundled vlm_runtime is missing, download the pinned llama.cpp zip and extract the needed files.\"\"\"\n    if sys.platform == \"darwin\":\n        # The pinned fallback asset is the Windows x64 build; downloading it\n        # on macOS would fetch ~18 MB that can never run there. On Mac the\n        # local VLM needs a macOS llama.cpp build placed in vlm_runtime/\n        # manually (see README, Mac chapter). Returning None makes the\n        # caller report the runtime as missing, which is the honest state.\n        return None\n    dest_dir = downloaded_runtime_dir(); os.makedirs(dest_dir, exist_ok=True)\n    zpath = os.path.join(dest_dir, RUNTIME_ASSET)\n    _download_file(RUNTIME_URL, zpath, lambda d, t: progress_cb(d, t, RUNTIME_ASSET) if progress_cb else None)\n    keep_prefix = (\"ggml-cpu-\",)\n    keep = {\"llama-mtmd-cli.exe\", \"mtmd.dll\", \"llama.dll\", \"llama-common.dll\", \"ggml.dll\", \"ggml-base.dll\", \"libomp.dll\"}\n    with zipfile.ZipFile(zpath) as z:\n        for info in z.infolist():\n            if info.filename in keep or info.filename.startswith(keep_prefix):\n                z.extract(info, dest_dir)\n    try: os.remove(zpath)\n    except Exception: pass\n    return find_runtime_binary()\n\n# ------------------------------------------------------------- GPU support ----\n# GPU asset names/sizes VERIFIED against the official llama.cpp b10936 release\n# asset list (GitHub API) on 2026-11-12:\n#   llama-b10936-bin-win-vulkan-x64.zip    =  31,673,236 bytes\n#   llama-b10936-bin-win-cuda-12.4-x64.zip = 254,065,100 bytes\n#   cudart-llama-bin-win-cuda-12.4-x64.zip = 391,443,627 bytes (CUDA runtime DLLs,\n#                                            required next to the CUDA build)\nGPU_ASSETS = {\n    \"vulkan\": [{\"name\": \"llama-b10936-bin-win-vulkan-x64.zip\", \"size\": 31673236}],\n    \"cuda\": [{\"name\": \"llama-b10936-bin-win-cuda-12.4-x64.zip\", \"size\": 254065100},\n             {\"name\": \"cudart-llama-bin-win-cuda-12.4-x64.zip\", \"size\": 391443627}],\n}\nGPU_BASE_URL = f\"https://github.com/ggml-org/llama.cpp/releases/download/{LLAMA_CPP_TAG}/\"\n\ndef detect_gpu(which=None, run=None, env=None, platform=None):\n    \"\"\"Simple GPU detection. On Windows: NVIDIA via nvidia-smi presence+run,\n    generic GPU via the Vulkan loader (vulkan-1.dll in System32) or vulkaninfo.\n    Elsewhere / on any error it degrades to 'unknown -> CPU'.\n    which/run/env/platform are injectable for unit tests.\"
