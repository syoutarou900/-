odels on other systems). For a re-zipped full package, copy that models folder next to\napp.py as ./models in the package: at runtime ContextStruct checks the\napp data dir first and then the bundled ./models folder, so a package\nthat contains ./models works on end-user PCs with no download at all.\nThe full flow is documented in README.txt (\"配布者向けフルパッケージ\").\n\nExit code 0 when every file verifies, 1 otherwise. No GUI required.\n\"\"\"\nimport os, sys\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nimport vlm_local\n\n\ndef _fmt(n):\n    return f\"{n:,} bytes ({n / 1e9:.2f} GB)\"\n\n\ndef main():\n    mdir = vlm_local.models_dir()\n    print(\"=\" * 68)\n    print(\" ContextStruct — VLM model pre-fetch (3B + 7B)\")\n    print(f\" Models dir: {mdir}\")\n    print(\"=\" * 68)\n    ok_all = True\n\n    if not vlm_local.find_runtime_binary():\n        print(\"\\n[Runtime] bundled llama.cpp not found — downloading fallback runtime…\")\n        try:\n            vlm_local.download_runtime(lambda d, t, f: print(f\"  {f}: {d * 100 // t if t else 0}%\", end=\"\\r\"))\n            print(\"\\n[Runtime] OK\")\n        except Exception as e:\n            print(f\"\\n[Runtime] FAILED: {e}\")\n            ok_all = False\n    else:\n        print(f\"\\n[Runtime] bundled OK: {vlm_local.find_runtime_binary()}\")\n\n    for key in (\"3b\", \"7b\"):\n        spec = vlm_local.model_spec(key)\n        print(f\"\\n[{key.upper()}] {spec['repo']}  (total approx. {spec['approx_gb']} GB)\")\n        def cb(done, total, fname, _k=key):\n            if total:\n                print(f\"  {fname}: {done * 100 // total}% ({done:,}/{total:,})\", end=\"\\r\")\n        try:\n            st = vlm_local.download_models(cb, model_key=key)\n        except Exception as e:\n            print(f\"\\n[{key.upper()}] DOWNLOAD FAILED: {e}\")\n            ok_all = False\n            continue\n        print()\n        for fname, expected in ((spec[\"model_file\"], spec[\"model_bytes\"]), (spec[\"mmproj_file\"], spec[\"mmproj_bytes\"])):\n            info = st[\"files\"][fname]\n            real = info[\"size\"]\n            match = (real == expected)\n            status = \"OK (size verified)\" if match else (\"OK (present, size differs from API listing)\" if info[\"ok\"] else \"MISSING/INCOMPLETE\")\n            if not info[\"ok\"]:\n                ok_all = False\n            print(f\"  {fname}\\n    expected {_fmt(expected)}\\n    on disk  {_fmt(real)}  -> {status}\")\n    print(\"\\n\" + \"=\" * 68)\n    print(\" RESULT:\", \"ALL MODELS READY\" if ok_all else \"SOME FILES FAILED — re-run to resume/complete\")\n    print(\"=\" * 68)\n    return 0 if ok_all else 1\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}, {"path": "ensemble.py", "sizestr": "18.0 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Ensemble extraction + verification — ContextStruct v2 (accuracy upgrade).\n\nMultiple engines read the same document, each returning\n{target_column: (value, confidence)} rows:\n  * PDF text layer / typed text  -> rule engine (context_core.extract_document)\n  * Tesseract OCR                -> rule engine over OCR text of the ORIGINAL\n                                    image and of the preprocessed variants\n                                    (enhanced / binarized) — separate voters\n  * easyocr / paddleocr          -> optional voters, only if importable\n  * local VLM (llama.cpp)        -> image understanding, read TWICE with two\n                                    prompt phrasings (self-consistency)\n  * external API VLM             -> optional cloud engine (maximum accuracy)\n\nA merger votes per field: values that agree (after normalization) across\n>= 2 engines are boosted to 97-99; a single engine keeps its own confidence;\non disagreement the most-supported value wins but its confidence is capped\nand the field is flagged for the verification pass.\n\nVerification pass:\n  (a) arithmetic checks (qty x unit price vs total, item sum vs total,\n      consumption-tax 8%/10% pattern) — failures lower confidence;\n  (b) targeted VLM re-read of disputed / failed fields with a\n      field-specific question (vlm_local.run_field_reread);\n  (c) master matching against a product/vendor master CSV — a fuzzy snap\n      (>= 0.85) to a master entry boosts confidence.\n\"\"\"\nimport os, csv, difflib, sys\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nfrom context_core import (FieldResult, extract_document, format_value, ocr_available,\n                          ocr_image)\nimport vlm_local\n\nAGREE_MIN, AGREE_MAX = 97, 99\nDISAGREE_CAP = 65\n\n\ndef normalize_value(value, field_type):\n    if value is None:\n        return \"\"\n    v = format_value(str(value), field_type) if field_type else str(value).strip()\n    if field_type in (None, \"text\"):\n        v = \" \".join(str(value).strip().split()).casefold()\n    return v\n\n\n# ---------------------------------------------------------------- merger ----\ndef merge_engine_rows(engine_rows, profile):\n    \"\"\"engine_rows: {engine_name: [ {col: FieldResult}, ... ]}.\n    Returns (merged_rows, report) where report = {\n        'disputed': [(row_index, col), ...],\n        'fields': {(row_index, col): {'engines': [...], 'agreed': bool,\n                                      'disagreement': bool}}}\"\"\"\n    ftypes = {f.target_column: f.field_type for f in profile.fields}\n    cols = [f.target_column for f in profile.fields]\n    n_rows = 0\n    for rows in engine_rows.values():\n        n_rows = max(n_rows, len(rows or []))\n    if n_rows == 0:\n        n_rows = 1\n    merged, report = [], {\"disputed\": [], \"fields\": {}}\n    for ri in range(n_rows):\n        row = {}\n        for col in cols:\n            cands = []  # (engine, raw_value, norm, conf, snippet)\n            for eng, rows in engine_rows.items():\n                if not rows or ri >= len(rows):\n                    continue\n                fr = rows[ri].get(col)\n                if fr is None:\n                    continue\n                val = fr.value if hasattr(fr, \"value\") else str(fr)\n                conf = fr.confidence if hasattr(fr, \"confidence\") else 50\n                if val is None or str(val).strip() == \"\":\n                    continue\n                norm = normalize_value(val, ftypes.get(col, \"text\"))\n                if norm == \"\":\n                    continue\n                cands.append((eng, str(val), norm, int(conf), getattr(fr, \"snippet\", \"\") or \"\"))\n            if not cands:\n                row[col] = FieldResult(\"\", 0, \"not_found\", \"\")\n                report[\"fields\"][(ri, col)] = {\"engines\": [], \"agreed\": False, \"disagreement\": False}\n                continue\n            groups = {}\n            for c in cands:\n                groups.setdefault(c[2], []).append(c)\n            # winner: most supporters, then highest total confidence\n            winner_norm, winner = max(groups.items(), key=lambda kv: (len(kv[1]), sum(x[3] for x in kv[1])))\n            disagreement = len(groups) > 1\n            best = max(winner, key=lambda x: x[3])\n            engines = [x[0] for x in winner]\n            if len(winner) >= 2:\n                avg = sum(x[3] for x in winner) / len(winner)\n                conf = max(AGREE_MIN, min(AGREE_MAX, int(round(avg)) + 5))\n                reason = f\"agreement x{len(winner)} [{', '.join(engines)}]\"\n                agreed = True\n            else:\n                conf = best[3]\n                reason = f\"{best[0]}: single\"\n                agreed = False\n            if disagreement:\n                conf = min(conf, DISAGREE_CAP)\n                reason += \" + disagreement (verify)\"\n                report[\"disputed\"].append((ri, col))\n            row[col] = FieldResult(best[1], conf, reason, best[4])\n            report[\"fields\"][(ri, col)] = {\"engines\": engines, \"agreed\": agreed, \"disagreement\": disagreement}\n        merged.append(row)\n    return merged, report\n\n\n# ------------------------------------------------------------- arithmetic ----\ndef _num(fr):\n    if fr is None:\n        return None\n    v = fr.value if hasattr(fr, \"value\") else fr\n    try:\n        return float(str(v).replace(\",\", \"\")) if str(v).strip() != \"\" else None\n    except Exception:\n        return None\n\n\ndef _find_col(profile, hints):\n    for f in profile.fields:\n        hay = (f.display_name + \" \" + f.target_column).lower()\n        if any(h.lower() in hay for h in hints):\n            return f.target_column\n    return None\n\n\ndef _penalize(fr, points, reason):\n    if fr is None or not fr.value:\n        return\n    fr.confidence = max(5, fr.confidence - points)\n    if reason not in fr.reason:\n        fr.reason = (fr.reason + \" + \" + reason).strip(\" +\")\n\n\ndef arithmetic_validation(rows, profile, tol_abs=2.0, tol_ratio=0.01):\n    \"\"\"Mutates FieldResults (lowers confidence + adds reason) on failed checks.\n    Returns {'passed': bool, 'checks': [str], 'failed_fields': [(ri, col)]}.\n    'passed' is True when nothing checkable exists (nothing failed).\"\"\"\n    checks, failed = [], []\n    qty_c = _find_col(profile, [\"数量\", \"qty\", \"quantity\"])\n    unit_c = _find_col(profile, [\"単価\", \"unit price\"])\n    total_c = _find_col(profile, [\"合計\", \"請求金額\", \"total\", \"amount due\"])\n    subtotal_c = _find_col(profile, [\"小計\", \"subtotal\"])\n    tax_c = _find_col(profile, [\"消費税\", \"税額\", \"tax\"])\n    if total_c == subtotal_c:\n        total_c = None\n\n    def tol(expected):\n        return max(tol_abs, abs(expected) * tol_ratio)\n\n    # qty x unit price summed over rows ~= total\n    if qty_c and unit_c and total_c and rows:\n        s, any_pair = 0.0, False\n        for r in rows:\n            q, u = _num(r.get(qty_c)), _num(r.get(unit_c))\n            if q is not None and u is not None:\n                s += q * u\n                any_pair = True\n        total = _num(rows[0].get(total_c))\n        if any_pair and total is not None:\n            if abs(s - total) <= tol(total):\n                checks.append(\"qty*unit ~= total: OK\")\n            else:\n                checks.append(f\"qty*unit ({s}) != total ({total}): FAIL\")\n                for ri, r in enumerate(rows):\n                    _penalize(r.get(qty_c), 10, \"arith_fail\")\n                    _penalize(r.get(unit_c), 10, \"arith_fail\")\n                    _penalize(r.get(total_c), 25, \"arith_fail: qty*unit != total\")\n                    failed.append((ri, total_c))\n    # consumption tax pattern: tax ~= subtotal * 10% or * 8%; total ~= subtotal + tax\n    if subtotal_c and tax_c and rows:\n        sub, tax = _num(rows[0].get(subtotal_c)), _num(rows[0].get(tax_c))\n        if sub is not None and tax is not None:\n            ok_rate = any(abs(tax - sub * r) <= tol(sub * r) for r in (0.10, 0.08))\n            if ok_rate:\n                checks.append(\"tax rate 8%/10%: OK\")\n            else:\n                checks.append(f\"tax ({tax}) != subtotal ({sub}) x 8%/10%: FAIL\")\n                for ri, r in enumerate(rows):\n                    _penalize(r.get(tax_c), 20, \"arith_fail: tax rate\")\n                    failed.append((ri, tax_c))\n            if total_c:\n                total = _num(rows[0].get(total_c))\n                if total is not None and abs(sub + tax - total) > tol(total):\n                    checks.append(f\"subtotal+tax ({sub + tax}) != total ({total}): FAIL\")\n                    for ri, r in enumerate(rows):\n                        _penalize(r.get(total_c), 20, \"arith_fail: subtotal+tax != total\")\n                        failed.append((ri, total_c))\n                elif total is not None:\n                    checks.append(\"subtotal+tax ~= total: OK\")\n    return {\"passed\": len(failed) == 0, \"checks\": checks, \"failed_fields\": failed}\n\n\n# ---------------------------------------------------------------- master ----\ndef load_master(path):\n    \"\"\"Master CSV: uses columns named code/name when present, else the first\n    two columns. Returns [{'code':..., 'name':...}, ...].\"\"\"\n    entries = []\n    if not path or not os.path.isfile(path):\n        return entries\n    with open(path, encoding=\"utf-8-sig\", errors=\"ignore\", newline=\"\") as f:\n        rows = list(csv.reader(f))\n    if not rows:\n        return entries\n    header = [c.strip().lower() for c in rows[0]]\n    code_i = header.index(\"code\") if \"code\" in header else 0\n    name_i = header.index(\"name\") if \"name\" in header else (1 if len(header) > 1 else 0)\n    body = rows[1:] if (\"code\" in header or \"name\" in header) else rows\n    for r in body:\n        if not r:\n            continue\n        code = r[code_i].strip() if code_i < len(r) else \"\"\n        name = r[name_i].strip() if name_i < len(r) else \"\"\n        if code or name:\n            entries.append({\"code\": code, \"name\": name})\n    return entries\n\n\nNAME_HINTS = (\"商品名\", \"品名\", \"名称\", \"取引先\", \"請求先\", \"product\", \"name\", \"vendor\", \"customer\", \"item\")\nCODE_HINTS = (\"コード\", \"型番\", \"code\", \"sku\", \"品番\")\n\n\ndef master_match(rows, profile, master, threshold=0.85):\n    \"\"\"Snap name/code fields to master entries (fuzzy, difflib). Mutates rows.\n    Returns the number of fields snapped/matched.\"\"\"\n    if not master:\n        return 0\n    names = [e[\"name\"] for e in master if e[\"name\"]]\n    codes = [e[\"code\"] for e in master if e[\"code\"]]\n    count = 0\n    for f in profile.fields:\n        hay = (f.display_name + \" \" + f.target_column).lower()\n        is_code = any(h in hay for h in CODE_HINTS)\n        is_name = (not is_code) and any(h in hay for h in NAME_HINTS)\n        if not (is_code or is_name):\n            continue\n        pool = codes if is_code else names\n        if not pool:\n            continue\n        for r in rows:\n            fr = r.get(f.target_column)\n            if fr is None or not fr.value:\n                continue\n            best, best_ratio = None, 0.0\n            for cand in pool:\n                ratio = difflib.SequenceMatcher(None, str(fr.value).casefold(), cand.casefold()).ratio()\n                if ratio > best_ratio:\n                    best, best_ratio = cand, ratio\n            if best is not None and best_ratio >= threshold:\n                if best != fr.value:\n                    fr.value = best\n                fr.confidence = min(99, fr.confidence + (5 if best_ratio >= 0.999 else 10))\n                if \"master matched\" not in fr.reason:\n                    fr.reason = (fr.reason + \" + master matched\").strip(\" +\")\n                count += 1\n    return count\n\n\n# ------------------------------------------------------- verification pass ----\ndef verify_and_reread(rows, profile, image_path, disputed, runner=None, model_key=None):\n    \"\"\"Targeted VLM re-read for disputed/failed fields. runner is injectable\n    (tests). Returns the list of (row_index, col) actually re-read.\"\"\"\n    if not image_path or not disputed:\n        return []\n    done, seen = [], set()\n    for ri, col in disputed:\n        if (ri, col) in seen or ri >= len(rows):\n            continue\n        seen.add((ri, col))\n        try:\n            fr = vlm_local.run_field_reread(image_path, profile, col, runner=runner, model_key=model_key)\n        except Exception:\n            fr = None\n        if fr is None or not fr.value:\n            continue\n        current = rows[ri].get(col)\n        if current is not None and current.value == fr.value:\n            current.confidence = max(current.confidence, 96)\n            current.reason = (current.reason + \" + verify_reread agreed\").strip(\" +\")\n        else:\n            rows[ri][col] = FieldResult(fr.value, min(fr.confidence, 90),\n                                         fr.reason + \" (verify_reread replaced)\", fr.snippet)\n        done.append((ri, col))\n    return done\n\n\n# ------------------------------------------------------------- collection ----\ndef optional_ocr_text(image_path):\n    \"\"\"easyocr / paddleocr as extra voters — LAZY import only (they pull in\n    torch and are deliberately NOT in requirements). Returns text or None.\"\"\"\n    try:\n        import easyocr  # noqa\n        reader = easyocr.Reader([\"ja\", \"en\"], gpu=False, verbose=False)\n        res = reader.readtext(image_path, detail=0)\n        if res:\n            return \"\\n\".join(res)\n    except Exception:\n        pass\n    try:\n        from paddleocr import PaddleOCR  # noqa\n        ocr = PaddleOCR(use_angle_cls=True, lang=\"japan\", show_log=False)\n        res = ocr.ocr(image_path, cls=True)\n        lines = []\n        for page in (res or []):\n            for item in (page or []):\n                try:\n                    lines.append(item[1][0])\n                except Exception:\n                    pass\n        if lines:\n            return \"\\n\".join(lines)\n    except Exception:\n        pass\n    return None\n\n\ndef collect_engine_rows(profile, text=\"\", source_path=None, image_path=None, settings=None,\n                        vlm_runner=None, use_vlm=False, few_shot=None, ocr_fn=None,\n                        text_engine_name=\"text_rules\", include_ocr_variants=True):\n    \"\"\"Gather rows from every available engine. Missing engines are skipped\n    silently — the merger works with whatever voted.\"\"\"\n    settings = settings or {}\n    engines = {}\n    if text and text.strip():\n        try:\n            engines[text_engine_name] = extract_document(text, profile)\n        except Exception:\n            pass\n    # --- OCR voters: original + preprocessed variants (dirty FAX / handwriting path)\n    if image_path and os.path.isfile(image_path):\n        ocr_texts = {}\n        if ocr_available():\n            lang_hint = settings.get(\"ocr_lang\", \"jpn+eng\")\n            fn = ocr_fn or (lambda im: ocr_image(im, lang_hint))\n            try:\n                from PIL import Image\n                targets = [(\"orig\", image_path)]\n                if include_ocr_variants:\n                    try:\n                        import preprocess\n                        for vname, vpath in preprocess.preprocess_to_files(image_path).items():\n                            if vname in (\"enhanced\", \"binarized\"):\n                                targets.append((vname, vpath))\n                    except Exception:\n                        pass\n                for vname, vpath in targets:\n                    try:\n                        t = fn(Image.open(vpath))\n                    except Exception:\n                        t = None\n                    if t and t.strip():\n                        ocr_texts[vname] = t\n            except Exception:\n                pass\n        for vname, t in ocr_texts.items():\n            try:\n                engines[f\"ocr_{vname}\"] = extract_document(t, profile)\n            except Exception:\n                pass\n        if settings.get(\"optional_ocr\"):\n            t = optional_ocr_text(image_path)\n            if t and t.strip():\n                try:\n                    engines[\"optional_ocr\"] = extract_document(t, profile)\n                except Exception:\n                    pass\n    # --- local VLM: self-consistency double read (two phrasings)\n    if use_vlm and image_path:\n        for variant, name in ((0, \"vlm_p1\"), (1, \"vlm_p2\")):\n            try:\n                engines[name] = vlm_local.run_local_vlm(\n                    image_path, profile, runner=vlm_runner, prompt_variant=variant,\n                    few_shot=few_shot, model_key=(settings.get(\"vlm_model_size\") or None))\n            except Exception:\n                pass\n    # --- external API VLM (cloud maximum) as one more voter\n    if image_path and settings.get(\"vlm_use_api\") and settings.get(\"vlm_endpoint\") and settings.get(\"vlm_model\"):\n        try:\n            from context_core import call_vlm\n            result = call_vlm(image_path, profile, settings)\n            if result:\n                engines[\"api_cloud\"] = vlm_local.vlm_data_to_rows({\"fields\": result}, profile)\n        except Exception:\n            pass\n    return engines\n\n\ndef run_pipeline(profile, text=\"\", source_path=None, image_path=None, settings=None,\n                 vlm_runner=None, use_vlm=False, few_shot=None, master=None, ocr_fn=None,\n                 text_engine_name=\"text_rules\", verify=True):\n    \"\"\"Full v2 pipeline: collect -> merge -> master -> arithmetic -> targeted\n    re-read of disputed/failed fields. Returns (rows, info dict).\"\"\"\n    engines = collect_engine_rows(profile, text=text, source_path=source_path,\n                                  image_path=image_path, settings=settings,\n                                  vlm_runner=vlm_runner, use_vlm=use_vlm,\n                                  few_shot=few_shot, ocr_fn=ocr_fn,\n                                  text_engine_name=text_engine_name)\n    rows, report = merge_engine_rows(engines, profile)\n    snapped = master_match(rows, profile, master) if master else 0\n    arith = arithmetic_validation(rows, profile)\n    reread = []\n    if verify and image_path:\n        disputed = list(dict.fromkeys(report[\"disputed\"] + arith[\"failed_fields\"]))\n        if disputed:\n            reread = verify_and_reread(rows, profile, image_path, disputed,\n                                       runner=vlm_runner,\n                                       model_key=(settings or {}).get(\"vlm_model_size\") or None)\n    info = {\"engines\": sorted(engines.keys()), \"report\": report, \"arithmetic\": arith,\n            \"master_snapped\": snapped, \"reread\": reread}\n    return rows, info\n"}, {"path": "i18n_data.py", "sizestr": "123.3 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"i18n dictionary for ContextStruct - 13 languages \"Entegrasyonlar isteğe bağlı gelişmiş özelliklerdir. Ayarlanmadan da ana akış (bırak → yapılandır → onayla → kopyala / Excel) tamamen çalışır.\",\"web_learn_copy\":\"ÖĞRENME bookmarklet'ini kopyala (alanlara tıklayın)\",\"web_import_map\":\"Eşleştirme JSON'unu içe aktar\",\"web_map_imported\":\"Eşleştirme içe aktarıldı\",\"file_infer\":\"Örnek dosyadan özellikleri çıkar\",\"file_infer_done\":\"Çıkarıldı. Lütfen gözden geçirip ince ayar yapın.\",\"db_server\":\"Sunucu adı\",\"db_database\":\"Veritabanı adı\",\"db_test\":\"Bağlantıyı test et\",\"db_test_ok\":\"Bağlandı\",\"db_test_ng\":\"Bağlanılamadı\",\"db_browse_sqlite\":\"SQLite dosyası seç\",\"db_assist\":\"Bağlantı yardımcısı (dize, tür ve aşağıdaki alanlardan oluşturulur)\"},\n\"ar\":{\"int_optional_note\":\"التكاملات ميزات متقدمة اختيارية. وحتى دون إعدادها، يعمل التدفق الرئيسي (إسقاط ← هيكلة ← تأكيد ← نسخ / Excel) بالكامل.\",\"web_learn_copy\":\"نسخ bookmarklet التعلم (انقر على الحقول)\",\"web_import_map\":\"استيراد JSON المطابقة\",\"web_map_imported\":\"تم استيراد المطابقة\",\"file_infer\":\"استنتاج المواصفات من ملف عينة\",\"file_infer_done\":\"تم الاستنتاج. راجع واضبط.\",\"db_server\":\"اسم الخادم\",\"db_database\":\"اسم قاعدة البيانات\",\"db_test\":\"اختبار الاتصال\",\"db_test_ok\":\"تم الاتصال\",\"db_test_ng\":\"تعذر الاتصال\",\"db_browse_sqlite\":\"اختيار ملف SQLite\",\"db_assist\":\"مساعد الاتصال (يبني سلسلة الاتصال من النوع والحقول أدناه)\"},\n\"id\":{\"int_optional_note\":\"Integrasi adalah fitur lanjutan opsional. Tanpa diatur pun, alur utama (jatuhkan → strukturkan → konfirmasi → salin / Excel) berfungsi sepenuhnya.\",\"web_learn_copy\":\"Salin bookmarklet BELAJAR (klik bidang untuk mengajar)\",\"web_import_map\":\"Impor JSON pemetaan\",\"web_map_imported\":\"Pemetaan diimpor\",\"file_infer\":\"Simpulkan spesifikasi dari file contoh\",\"file_infer_done\":\"Disimpulkan. Tinjau dan sesuaikan.\",\"db_server\":\"Nama server\",\"db_database\":\"Nama database\",\"db_test\":\"Uji koneksi\",\"db_test_ok\":\"Terhubung\",\"db_test_ng\":\"Tidak dapat terhubung\",\"db_browse_sqlite\":\"Pilih file SQLite\",\"db_assist\":\"Asisten koneksi (menyusun string koneksi dari jenis dan bidang di bawah)\"},\n\"ko\":{\"int_optional_note\":\"연계는 선택 사항인 고급 기능입니다. 설정하지 않아도 본체 흐름(드롭 → 구조화 → 확인 → 복사 / Excel 내보내기)은 완전히 사용할 수 있습니다.\",\"web_learn_copy\":\"학습용 북마클릿 복사(칸을 클릭해서 가르치기)\",\"web_import_map\":\"대응표 JSON 가져오기\",\"web_map_imported\":\"대응표를 가져왔습니다\",\"file_infer\":\"샘플 파일에서 사양 추정\",\"file_infer_done\":\"추정했습니다. 확인하고 미세 조정하세요.\",\"db_server\":\"서버 이름\",\"db_database\":\"데이터베이스 이름\",\"db_test\":\"연결 테스트\",\"db_test_ok\":\"연결되었습니다\",\"db_test_ng\":\"연결할 수 없었습니다\",\"db_browse_sqlite\":\"SQLite 파일 선택\",\"db_assist\":\"연결 도우미(종류와 아래 칸으로 연결 문자열을 조립합니다)\"},\n}\nfor _lang, _d in EXTRA_V4.items():\n    TRANSLATIONS[_lang].update(_d)\n\n# --- v3 design pass: card titles for the unified dialog design (all 13 languages) ---\nEXTRA_V5 = {\n\"ja\":{\"card_general\":\"一般設定\",\"int_profiles\":\"連携先一覧\"},\n\"en\":{\"card_general\":\"General\",\"int_profiles\":\"Integration profiles\"},\n\"es\":{\"card_general\":\"General\",\"int_profiles\":\"Perfiles de integración\"},\n\"zh_CN\":{\"card_general\":\"常规设置\",\"int_profiles\":\"連携配置一览\"},\n\"fr\":{\"card_general\":\"Général\",\"int_profiles\":\"Profils d'intégration\"},\n\"de\":{\"card_general\":\"Allgemein\",\"int_profiles\":\"Integrationsprofile\"},\n\"pt\":{\"card_general\":\"Geral\",\"int_profiles\":\"Perfis de integração\"},\n\"ru\":{\"card_general\":\"Общие\",\"int_profiles\":\"Профили интеграции\"},\n\"it\":{\"card_general\":\"Generali\",\"int_profiles\":\"Profili di integrazione\"},\n\"tr\":{\"card_general\":\"Genel\",\"int_profiles\":\"Entegrasyon profilleri\"},\n\"ar\":{\"card_general\":\"عام\",\"int_profiles\":\"ملفات تعريف التكامل\"},\n\"id\":{\"card_general\":\"Umum\",\"int_profiles\":\"Profil integrasi\"},\n\"ko\":{\"card_general\":\"일반 설정\",\"int_profiles\":\"연계 프로필 목록\"},\n}\nfor _lang, _d in EXTRA_V5.items():\n    TRANSLATIONS[_lang].update(_d)\n\n# --- Mac retrofit: OCR-missing guidance for macOS (Homebrew) — all 13 languages.\n# Used ONLY when sys.platform == \"darwin\" (see app.ocr_missing_message);\n# the original ocr_missing strings above stay untouched for Windows.\nEXTRA_MAC = {\n\"ja\":{\"ocr_missing_mac\":\"OCR（Tesseract）が見つかりません。テキストを貼り付けるか手入力で直せます。Macでは Homebrew で導入できます: brew install tesseract tesseract-lang\"},\n\"en\":{\"ocr_missing_mac\":\"OCR (Tesseract) not found. Paste or type text manually. On Mac, install it with Homebrew: brew install tesseract tesseract-lang\"},\n\"es\":{\"ocr_missing_mac\":\"OCR (Tesseract) no encontrado. Pega o escribe el texto manualmente. En Mac, instálalo con Homebrew: brew install tesseract tesseract-lang\"},\n\"zh_CN\":{\"ocr_missing_mac\":\"未找到 OCR (Tesseract)。请粘贴或手动输入文本。Mac 上可用 Homebrew 安装：brew install tesseract tesseract-lang\"},\n\"fr\":{\"ocr_missing_mac\":\"OCR (Tesseract) introuvable. Collez ou saisissez le texte. Sur Mac, installez-le avec Homebrew : brew install tesseract tesseract-lang\"},\n\"de\":{\"ocr_missing_mac\":\"OCR (Tesseract) nicht gefunden. Text einfügen oder tippen. Auf dem Mac per Homebrew installieren: brew install tesseract tesseract-lang\"},\n\"pt\":{\"ocr_missing_mac\":\"OCR (Tesseract) não encontrado. Cole ou digite o texto. No Mac, instale com o Homebrew: brew install tesseract tesseract-lang\"},\n\"ru\":{\"ocr_missing_mac\":\"OCR (Tesseract) не найден. Вставьте или введите текст вручную. На Mac установите через Homebrew: brew install tesseract tesseract-lang\"},\n\"it\":{\"ocr_missing_mac\":\"OCR (Tesseract) non trovato. Incolla o digita il testo. Su Mac installalo con Homebrew: brew install tesseract tesseract-lang\"},\n\"tr\":{\"ocr_missing_mac\":\"OCR (Tesseract) bulunamadı. Metni yapıştırın veya yazın. Mac'te Homebrew ile kurun: brew install tesseract tesseract-lang\"},\n\"ar\":{\"ocr_missing_mac\":\"لم يتم العثور على OCR (Tesseract). الصق النص أو اكتبه يدويًا. على Mac ثبّته عبر Homebrew: brew install tesseract tesseract-lang\"},\n\"id\":{\"ocr_missing_mac\":\"OCR (Tesseract) tidak ditemukan. Tempel atau ketik teks manual. Di Mac, pasang dengan Homebrew: brew install tesseract tesseract-lang\"},\n\"ko\":{\"ocr_missing_mac\":\"OCR(Tesseract)을 찾을 수 없습니다. 텍스트를 붙여넣거나 직접 입력하세요. Mac에서는 Homebrew로 설치할 수 있습니다: brew install tesseract tesseract-lang\"},\n}\nfor _lang, _d in EXTRA_MAC.items():\n    TRANSLATIONS[_lang].update(_d)\n"}, {"path": "integrations.py", "sizestr": "22.7 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Core-system integrations — ContextStruct v2 (user point I).\n\nFour delivery methods, all built into the app. HONEST SCOPE, shown in the\nUI and README: the mechanisms live in the app, but using one requires\nper-system information supplied by the user (CSS selectors, the target\nsystem's import spec, DB connection details and that company's\npermission). Nothing here guesses a destination.\n\nMethod 1  RPA keyboard auto-entry: types confirmed values into whatever\n          application the user focused, value -> Tab -> value -> ...\n          Windows uses ctypes SendInput; other platforms go through the\n          abstract KeyboardSender (unit tests use the mock). Safety:\n          3-second countdown (GUI), Esc aborts immediately, per-field\n          interval is configurable. The final \"register\" click is a\n          SEPARATE opt-in: it only clicks coordinates the user recorded\n          by clicking the real button; never a guessed position.\nMethod 2  Web-form DOM: field -> CSS selector mapping. Generates a\n          bookmarklet (JavaScript string) that fills the form in the\n          user's browser; optionally drives a real browser via selenium\n          when importable (no driver bundled).\nMethod 3  Import file: CSV/TSV/Excel with encoding (UTF-8 / Shift-JIS),\n          newline (CRLF/LF), header on/off, date format, column order\n          and a dated filename pattern. Also usable as the unattended\n          automation output destination.\nMethod 4  Direct DB write: sqlite (stdlib) or ODBC (pyodbc, lazy).\n          Dry-run by default: builds and previews the INSERT statements\n          without writing. Real writes require the profile's explicit\n          \"enable DB write\" toggle, run in one transaction, and are\n          recorded in the audit log by the caller.\n\"\"\"\nimport os, re, csv, io, json, sys, datetime\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nfrom context_core import get_app_dir\n\nMETHODS = (\"rpa\", \"webform\", \"file\", \"db\")\n\n\nclass IntegrationUnavailable(Exception):\n    pass\n\n\n# ------------------------------------------------------------- profiles ----\nclass IntegrationProfile:\n    def __init__(self, name=\"\", method=\"file\", config=None):\n        self.name = name\n        self.method = method if method in METHODS else \"file\"\n        self.config = dict(config or {})\n\n    def to_dict(self):\n        return {\"name\": self.name, \"method\": self.method, \"config\": self.config}\n\n    @staticmethod\n    def from_dict(d):\n        return IntegrationProfile(d.get(\"name\", \"\"), d.get(\"method\", \"file\"), d.get(\"config\") or {})\n\n\ndef integrations_path(base_dir=None):\n    return os.path.join(base_dir or get_app_dir(), \"integrations.json\")\n\n\ndef load_integrations(base_dir=None):\n    p = integrations_path(base_dir)\n    if os.path.exists(p):\n        try:\n            with open(p, encoding=\"utf-8\") as f:\n                return [IntegrationProfile.from_dict(d) for d in json.load(f)]\n        except Exception:\n            pass\n    return []\n\n\ndef save_integrations(profiles, base_dir=None):\n    p = integrations_path(base_dir)\n    os.makedirs(os.path.dirname(p), exist_ok=True)\n    with open(p, \"w\", encoding=\"utf-8\") as f:\n        json.dump([x.to_dict() for x in profiles], f, ensure_ascii=False, indent=2)\n    return p\n\n\n# ------------------------------------------------- method 1: RPA keyboard ----\nclass KeyboardSender:\n    \"\"\"Abstract keyboard/mouse sender (the unit-testable layer).\"\"\"\n    def type_text(self, text):\n        raise NotImplementedError\n    def press_tab(self):\n        raise NotImplementedError\n    def click(self, x, y):\n        raise NotImplementedError\n\n\nclass MockKeyboardSender(KeyboardSender):\n    def __init__(self):\n        self.events = []\n    def type_text(self, text):\n        self.events.append((\"type\", text))\n    def press_tab(self):\n        self.events.append((\"tab\",))\n    def click(self, x, y):\n        self.events.append((\"click\", x, y))\n\n\nclass WinKeyboardSender(KeyboardSender):\n    \"\"\"Windows SendInput sender (ctypes). Only constructed on win32.\"\"\"\n    def __init__(self):\n        import ctypes\n        self.ctypes = ctypes\n        self.user32 = ctypes.windll.user32\n        KEYEVENTF_UNICODE = 0x0004\n        self._KEYEVENTF_UNICODE = KEYEVENTF_UNICODE\n        self._KEYEVENTF_KEYUP = 0x0002\n        self._INPUT_KEYBOARD = 1\n        self._INPUT_MOUSE = 0\n        self._MOUSEEVENTF_LEFTDOWN = 0x0002\n        self._MOUSEEVENTF_LEFTUP = 0x0004\n        self._MOUSEEVENTF_ABSOLUTE = 0x8000\n        self._MOUSEEVENTF_MOVE = 0x0001\n\n        class KEYBDINPUT(ctypes.Structure):\n            _fields_ = [(\"wVk\", ctypes.c_ushort), (\"wScan\", ctypes.c_ushort),\n                        (\"dwFlags\", ctypes.c_ulong), (\"time\", ctypes.c_ulong),\n                        (\"dwExtraInfo\", ctypes.POINTER(ctypes.c_ulong))]\n        class MOUSEINPUT(ctypes.Structure):\n            _fields_ = [(\"dx\", ctypes.c_long), (\"dy\", ctypes.c_long),\n                        (\"mouseData\", ctypes.c_ulong), (\"dwFlags\", ctypes.c_ulong),\n                        (\"time\", ctypes.c_ulong), (\"dwExtraInfo\", ctypes.POINTER(ctypes.c_ulong))]\n        class _U(ctypes.Union):\n            _fields_ = [(\"ki\", KEYBDINPUT), (\"mi\", MOUSEINPUT)]\n        class INPUT(ctypes.Structure):\n            _fields_ = [(\"type\", ctypes.c_ulong), (\"u\", _U)]\n        self._INPUT, self._KEYBDINPUT, self._MOUSEINPUT, self._U = INPUT, KEYBDINPUT, MOUSEINPUT, _U\n\n    def _send(self, inp):\n        self.user32.SendInput(1, self.ctypes.byref(inp), self.ctypes.sizeof(inp))\n\n    def _key(self, vk=0, scan=0, flags=0):\n        inp = self._INPUT()\n        inp.type = self._INPUT_KEYBOARD\n        inp.u.ki = self._KEYBDINPUT(vk, scan, flags, 0, None)\n        self._send(inp)\n\n    def type_text(self, text):\n        for ch in str(text):\n            code = ord(ch)\n            self._key(0, code, self._KEYEVENTF_UNICODE)\n            self._key(0, code, self._KEYEVENTF_UNICODE | self._KEYEVENTF_KEYUP)\n\n    def press_tab(self):\n        self._key(0x09, 0, 0)\n        self._key(0x09, 0, self._KEYEVENTF_KEYUP)\n\n    def click(self, x, y):\n        sw = self.user32.GetSystemMetrics(0) or 1920\n        sh = self.user32.GetSystemMetrics(1) or 1080\n        inp = self._INPUT()\n        inp.type = self._INPUT_MOUSE\n        inp.u.mi = self._MOUSEINPUT(int(x * 65535 / max(1, sw - 1)), int(y * 65535 / max(1, sh - 1)),\n                                    0, self._MOUSEEVENTF_MOVE | self._MOUSEEVENTF_ABSOLUTE, 0, None)\n        self._send(inp)\n        for fl in (self._MOUSEEVENTF_LEFTDOWN, self._MOUSEEVENTF_LEFTUP):\n            inp2 = self._INPUT()\n            inp2.type = self._INPUT_MOUSE\n            inp2.u.mi = self._MOUSEINPUT(0, 0, 0, fl, 0, None)\n            self._send(inp2)\n\n\ndef make_sender():\n    if sys.platform.startswith(\"win\"):\n        return WinKeyboardSender()\n    raise IntegrationUnavailable(\"RPA keyboard sending is only available on Windows\")\n\n\ndef esc_pressed():\n    \"\"\"True while Esc is held (Windows). Always False elsewhere.\"\"\"\n    if not sys.platform.startswith(\"win\"):\n        return False\n    try:\n        import ctypes\n        return bool(ctypes.windll.user32.GetAsyncKeyState(0x1B) & 0x8000)\n    except Exception:\n        return False\n\n\ndef rpa_type_values(values, sender, interval_ms=150, should_abort=None, sleep_fn=None):\n    \"\"\"Type values in order: value, Tab, value, ... (no trailing Tab).\n    Aborts BEFORE the next field when should_abort() is true.\n    Returns {'typed': n, 'aborted': bool}.\"\"\"\n    import time as _time\n    sleep_fn = sleep_fn or (lambda ms: _time.sleep(ms / 1000.0))\n    typed = 0\n    for i, v in enumerate(values):\n        if should_abort and should_abort():\n            return {\"typed\": typed, \"aborted\": True}\n        sender.type_text(\"\" if v is None else str(v))\n        typed += 1\n        if i < len(values) - 1:\n            sender.press_tab()\n        if interval_ms:\n            sleep_fn(interval_ms)\n    return {\"typed\": typed, \"aborted\": False}\n\n\ndef rpa_finish_click(cfg, sender):\n    \"\"\"The optional final 'register' click. Fires ONLY when the profile has\n    it enabled AND coordinates were recorded by the user. Never guesses.\"\"\"\n    if not cfg.get(\"rpa_click_enabled\"):\n        return False\n    x, y = cfg.get(\"rpa_click_x\"), cfg.get(\"rpa_click_y\")\n    if x is None or y is None:\n        return False\n    sender.click(int(x), int(y))\n    return True\n\n\n# ------------------------------------------------- method 2: web form DOM ----\ndef _js_str(s):\n    return json.dumps(\"\" if s is None else str(s), ensure_ascii=True)\n\n\ndef generate_bookmarklet(mapping, row):\n    \"\"\"mapping: {field_column: css_selector}; row: {field_column: value}.\n    Returns a javascript: bookmarklet that fills the mapped form fields and\n    fires input/change events so frameworks notice the values.\"\"\"\n    lines = [\"(function(){\", \"function setV(sel,val){var el=document.querySelector(sel);if(!el)return;var d=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el),'value');if(d&&d.set){d.set.call(el,val);}else{el.value=val;}el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}\"]\n    for col, sel in mapping.items():\n        if not sel:\n            continue\n        lines.append(f\"setV({_js_str(sel)},{_js_str(row.get(col, ''))});\")\n    lines.append(\"})();\")\n    return \"javascript:\" + \"\".join(lines)\n\n\ndef fill_form_selenium(url, mapping, row, driver_factory=None):\n    \"\"\"Optional direct browser fill via selenium (lazy import; no driver is\n    bundled). Raises IntegrationUnavailable when selenium is absent.\"\"\"\n    if driver_factory is None:\n        try:\n            from selenium import webdriver\n        except Exception:\n            raise IntegrationUnavailable(\"selenium is not installed; use the bookmarklet instead\")\n        driver_factory = webdriver.Chrome\n    driver = driver_factory()\n    try:\n        driver.get(url)\n        for col, sel in mapping.items():\n            if not sel:\n                continue\n            el = driver.find_element(\"css selector\", sel)\n            el.clear()\n            el.send_keys(\"\" if row.get(col) is None else str(row.get(col)))\n    finally:\n        pass  # leave the browser open for the user to review/submit\n    return driver\n\n\n# ---------------------------------------------------- method 3: import file ----\ndef resolve_filename(pattern, profile_name=\"\", when=None):\n    when = when or datetime.datetime.now()\n    name = (pattern or \"export_{date}.csv\")\n    name = name.replace(\"{date}\", when.strftime(\"%Y%m%d\")).replace(\"{datetime}\", when.strftime(\"%Y%m%d_%H%M%S\"))\n    name = name.replace(\"{profile}\", re.sub(r\"[^\\w\\-]\", \"_\", profile_name or \"data\"))\n    return name\n\n\ndef _format_dates(value, date_fmt):\n    if not date_fmt or not value:\n        return value\n    s = str(value)\n    try:\n        dt = datetime.datetime.strptime(s, \"%Y-%m-%d\")\n        return dt.strftime(date_fmt)\n    except Exception:\n        return value\n\n\ndef ordered_columns(cfg, profile_columns):\n    order = cfg.get(\"column_order\") or []\n    cols = [c for c in order if c in profile_columns]\n    cols += [c for c in profile_columns if c not in cols]\n    return cols\n\n\ndef export_import_file(rows_dicts, profile_columns, cfg, out_path, append=False):\n    \"\"\"Write rows in the target system's import format.\n    cfg: format(csv/tsv/xlsx), encoding(utf-8/shift_jis), newline(crlf/lf),\n    header(bool), date_format(strftime or ''), column_order(list).\n    For csv/tsv with append=True and an existing file, rows are appended\n    without a header. Returns out_path.\"\"\"\n    fmt = (cfg.get(\"format\") or \"csv\").lower()\n    cols = ordered_columns(cfg, profile_columns)\n    date_fmt = cfg.get(\"date_format\") or \"\"\n    data = [{c: _format_dates(r.get(c, \"\"), date_fmt) for c in cols} for r in rows_dicts]\n    os.makedirs(os.path.dirname(os.path.abspath(out_path)), exist_ok=True)\n    if fmt == \"xlsx\":\n        from openpyxl import Workbook, load_workbook\n        if append and os.path.isfile(out_path):\n            wb = load_workbook(out_path); ws = wb.active\n        else:\n            wb = Workbook(); ws = wb.active\n            if cfg.get(\"header\", True):\n                ws.append(cols)\n        for d in data:\n            ws.append([d[c] for c in cols])\n        wb.save(out_path)\n        return out_path\n    delim = \"\\t\" if fmt == \"tsv\" else \",\"\n    enc = \"shift_jis\" if (cfg.get(\"encoding\") or \"utf-8\").lower().startswith(\"shift\") else \"utf-8\"\n    newline = \"\\r\\n\" if (cfg.get(\"newline\") or \"crlf\").lower() == \"crlf\" else \"\\n\"\n    exists = append and os.path.isfile(out_path) and os.path.getsize(out_path) > 0\n    mode = \"a\" if exists else \"w\"\n    with io.open(out_path, mode, encoding=enc, newline=\"\") as fh:\n        w = csv.DictWriter(fh, fieldnames=cols, delimiter=delim, lineterminator=newline)\n        if not exists and cfg.get(\"header\", True):\n            w.writeheader()\n        w.writerows(data)\n    return out_path\n\n\n# ------------------------------------------------------ method 4: direct DB ----\n_IDENT_RE = re.compile(r\"^[A-Za-z_][A-Za-z0-9_]*$\")\n\n\ndef _check_ident(name, what=\"identifier\"):\n    if not _IDENT_RE.match(str(name or \"\")):\n        raise ValueError(f\"unsafe {what}: {name!r}\")\n    return str(name)\n\n\ndef build_insert(table, mapping, row):\n    \"\"\"Parameterized INSERT. mapping: {field_column: db_column}.\n    Table/column identifiers are validated (they cannot be bound as\n    parameters); values are always bound.\"\"\"\n    _check_ident(table, \"table name\")\n    cols, params = [], []\n    for field_col, db_col in mapping.items():\n        if not db_col:\n            continue\n        cols.append(_check_ident(db_col, \"column name\"))\n        params.append(row.get(field_col, \"\"))\n    sql = f\"INSERT INTO {table} ({', '.join(cols)}) VALUES ({', '.join(['?'] * len(cols))})\"\n    return sql, params\n\n\ndef db_preview(cfg, rows_dicts):\n    mapping = cfg.get(\"column_mapping\") or {}\n    return [build_insert(cfg.get(\"table\", \"\"), mapping, r) for r in rows_dicts]\n\n\ndef db_write(cfg, rows_dicts, force_dry_run=None):\n    \"\"\"Returns {'dry_run': bool, 'preview': [(sql, params)], 'written': n}.\n    Dry-run unless the profile explicitly enables writes (cfg\n    db_write_enabled) — force_dry_run overrides for tests/UI preview.\"\"\"\n    preview = db_preview(cfg, rows_dicts)\n    enabled = bool(cfg.get(\"db_write_enabled\", False))\n    dry = (not enabled) if force_dry_run is None else bool(force_dry_run)\n    if dry:\n        return {\"dry_run\": True, \"preview\": preview, \"written\": 0}\n    kind = (cfg.get(\"db_kind\") or \"sqlite\").lower()\n    conn_str = cfg.get(\"connection\", \"\")\n    written = 0\n    if kind == \"sqlite\":\n        import sqlite3\n        conn = sqlite3.connect(conn_str)\n        try:\n            cur = conn.cursor()\n            for sql, params in preview:\n                cur.execute(sql, params)\n                written += 1\n            conn.commit()\n        except Exception:\n            conn.rollback()\n            raise\n        finally:\n            conn.close()\n    elif kind == \"odbc\":\n        try:\n            import pyodbc\n        except Exception:\n            raise IntegrationUnavailable(\"pyodbc is not installed; ODBC writes are unavailable\")\n        conn = pyodbc.connect(conn_str)\n        try:\n            cur = conn.cursor()\n            for sql, params in preview:\n                cur.execute(sql, params)\n                written += 1\n            conn.commit()\n        except Exception:\n            conn.rollback()\n            raise\n        finally:\n            conn.close()\n    else:\n        raise ValueError(f\"unknown db kind: {kind}\")\n    return {\"dry_run\": False, \"preview\": preview, \"written\": written}\n\n\n# ============================================================ setup assist ====\n# Added so non-technical users never have to hand-write technical settings:\n# click-to-learn web mappings, import-spec inference from a sample file,\n# profile export/import (one expert sets it up, everyone imports it), and a\n# form-based DB connection assistant with a connection test.\n\ndef generate_learn_bookmarklet(field_names):\n    \"\"\"A bookmarklet that LEARNS the field->selector mapping by clicking.\n    Run it on the target form: it asks, in order, 'click the input for\n    <field>'; each click records a selector (id first, then name, then an\n    nth-of-type path); at the end it returns the mapping as JSON (clipboard\n    + prompt display) which the app imports back.\"\"\"\n    fields_js = json.dumps(list(field_names), ensure_ascii=True)\n    js = []\n    js.append(\"(function(){\")\n    js.append(f\"var FIELDS={fields_js};var result={{}};var i=0;\")\n    js.append(\"function selOf(el){if(el.id){return '#'+el.id;}if(el.getAttribute('name')){return el.tagName.toLowerCase()+'[name=\\\"'+el.getAttribute('name')+'\\\"]';}var parts=[];var n=el;while(n&&n.nodeType===1&&n.tagName!=='BODY'){var ix=1;var s=n.previousElementSibling;while(s){if(s.tagName===n.tagName){ix++;}s=s.previousElementSibling;}parts.unshift(n.tagName.toLowerCase()+':nth-of-type('+ix+')');n=n.parentElement;}return parts.join(' > ');}\")\n    js.append(\"var bar=document.createElement('div');bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999999;background:#1d46a8;color:#fff;font:16px sans-serif;padding:10px;text-align:center';document.body.appendChild(bar);\")\n    js.append(\"function done(){var j=JSON.stringify(result);bar.textContent='DONE';if(navigator.clipboard){navigator.clipboard.writeText(j);}window.prompt('Copy this mapping JSON and import it in ContextStruct:',j);document.removeEventListener('click',h,true);bar.remove();}\")\n    js.append(\"function h(e){e.preventDefault();e.stopPropagation();result[FIELDS[i]]=selOf(e.target);i++;if(i>=FIELDS.length){done();}else{bar.textContent=FIELDS[i];}}\")\n    js.append(\"if(FIELDS.length===0){return;}bar.textContent=FIELDS[0];document.addEventListener('click',h,true);\")\n    js.append(\"})();\")\n    return \"javascript:\" + \"\".join(js)\n\n\ndef parse_mapping_json(text):\n    \"\"\"Tolerant import of a mapping JSON produced by the learn bookmarklet\n    (or a hand-shared profile snippet). Returns {field: selector} strings only.\"\"\"\n    if not text:\n        return {}\n    s = str(text)\n    start, end = s.find(\"{\"), s.rfind(\"}\")\n    if start < 0 or end <= start:\n        return {}\n    try:\n        data = json.loads(s[start:end + 1])\n    except Exception:\n        return {}\n    if not isinstance(data, dict):\n        return {}\n    return {str(k): str(v) for k, v in data.items() if v is not None and str(v) != \"\"}\n\n\ndef infer_import_spec(data):\n    \"\"\"Infer an import-file spec (method 3 draft) from sample bytes:\n    encoding (UTF-8 tried first, then Shift-JIS), delimiter, newline,\n    header presence and the column list. Returns a config draft dict.\"\"\"\n    if isinstance(data, (bytes, bytearray)):\n        raw = bytes(data)\n        text, enc = None, \"utf-8\"\n        for cand_enc, label in ((\"utf-8-sig\", \"utf-8\"), (\"shift_jis\", \"shift_jis\")):\n            try:\n                text = raw.decode(cand_enc)\n                enc = label\n                break\n            except Exception:\n                continue\n        if text is None:\n            text = raw.decode(\"utf-8\", errors=\"ignore\")\n            enc = \"utf-8\"\n    else:\n        text, enc = str(data), \"utf-8\"\n    newline = \"crlf\" if \"\\r\\n\" in text else \"lf\"\n    lines = [ln for ln in text.splitlines() if ln.strip()][:6]\n    sample = \"\\n\".join(lines)\n    delim = \",\"\n    try:\n        delim = csv.Sniffer().sniff(sample, delimiters=\",\\t;\").delimiter\n    except Exception:\n        counts = {d: sum(ln.count(d) for ln in lines) for d in (\",\", \"\\t\", \";\")}\n        delim = max(counts, key=counts.get) if lines else \",\"\n        if counts.get(delim, 0) == 0:\n            delim = \",\"\n    fmt = \"tsv\" if delim == \"\\t\" else \"csv\"\n    rows = []\n    try:\n        rows = list(csv.reader(io.StringIO(text), delimiter=delim))\n        rows = [r for r in rows if any(c.strip() for c in r)][:4]\n    except Exception:\n        rows = []\n    header = False\n    columns = []\n    if rows:\n        first = [c.strip() for c in rows[0]]\n        def _numeric(s):\n            try:\n                float(str(s).replace(\",\", \"\"))\n                return True\n            except Exception:\n                return False\n        first_textual = all((not _numeric(c)) and c != \"\" for c in first)\n        second_differs = len(rows) < 2 or any(_numeric(c) for c in rows[1]) or rows[1] != rows[0]\n        try:\n            sniff_header = csv.Sniffer().has_header(sample)\n        except Exception:\n            sniff_header = False\n        header = bool(first_textual and second_differs) or bool(sniff_header and first_textual)\n        if header:\n            columns = first\n    return {\"format\": fmt, \"encoding\": enc, \"newline\": newline, \"header\": header,\n            \"delimiter\": delim, \"columns\": columns,\n            \"column_order\": columns}\n\n\ndef export_integration_profile(profile, path):\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        json.dump(profile.to_dict(), f, ensure_ascii=False, indent=2)\n    return path\n\n\ndef import_integration_profiles(path):\n    \"\"\"Import one profile object or a list of them from a JSON file.\"\"\"\n    with open(path, encoding=\"utf-8\") as f:\n        data = json.load(f)\n    if isinstance(data, dict):\n        data = [data]\n    return [IntegrationProfile.from_dict(d) for d in data if isinstance(d, dict)]\n\n\n# ------------------------------------------------------- DB assistant ----\ndef build_odbc_connection(server, database, driver=\"ODBC Driver 18 for SQL Server\",\n                          trusted=True, user=\"\", password=\"\"):\n    parts = [f\"DRIVER={{{driver}}}\", f\"SERVER={server}\", f\"DATABASE={database}\"]\n    if trusted:\n        parts.append(\"Trusted_Connection=yes\")\n    else:\n        parts.append(f\"UID={user}\")\n        parts.append(f\"PWD={password}\")\n    return \";\".join(parts) + \";\"\n\n\ndef _connect(cfg):\n    kind = (cfg.get(\"db_kind\") or \"sqlite\").lower()\n    if kind == \"sqlite\":\n        import sqlite3\n        return sqlite3.connect(cfg.get(\"connection\", \"\"))\n    try:\n        import pyodbc\n    except Exception:\n        raise IntegrationUnavailable(\"pyodbc is not installed; ODBC is unavailable\")\n    return pyodbc.connect(cfg.get(\"connection\", \"\"))\n\n\ndef list_db_tables(cfg):\n    conn = _connect(cfg)\n    try:\n        if (cfg.get(\"db_kind\") or \"sqlite\").lower() == \"sqlite\":\n            rows = conn.execute(\"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name\").fetchall()\n            return [r[0] for r in rows]\n        cur = conn.cursor()\n        return [r.table_name for r in cur.tables(tableType=\"TABLE\")]\n    finally:\n        conn.close()\n\n\ndef list_db_columns(cfg, table):\n    _check_ident(table, \"table name\")\n    conn = _connect(cfg)\n    try:\n        if (cfg.get(\"db_kind\") or \"sqlite\").lower() == \"sqlite\":\n            rows = conn.execute(f\"PRAGMA table_info({table})\").fetchall()\n            return [r[1] for r in rows]\n        cur = conn.cursor()\n        return [r.column_name for r in cur.columns(table=table)]\n    finally:\n        conn.close()\n\n\ndef test_connection(cfg):\n    \"\"\"Returns (ok, message, tables). Never raises.\"\"\"\n    try:\n        tables = list_db_tables(cfg)\n        return True, f\"OK ({len(tables)} tables)\", tables\n    except Exception as e:\n        return False, str(e), []\n"}, {"path": "learning.py", "sizestr": "5.8 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Learning from corrections — ContextStruct v2 (user point 7).\n\nHONEST SCOPE: this is in-context / dictionary learning, NOT model retraining.\nThe VLM weights never change. What the app learns is:\n  1. a correction store (learning.jsonl) — every confirmed human edit;\n  2. keyword aliases — a word found next to a corrected value in the source\n     text becomes a new keyword for that field in the profile (persisted,\n     visible in the profile editor);\n  3. few-shot examples — the most recent corrections for the active profile\n     are injected into the VLM prompt;\n  4. per-vendor profile memory — the profile last confirmed for a detected\n     vendor is auto-suggested next time that vendor appears.\n\nThe heavy engines themselves (llama.cpp, Tesseract, OpenCV) are native\nC/C++ programs orchestrated by Python; that combination is what raises\nquality — the learning layer only steers them with the user's own data.\n\"\"\"\nimport os, re, json, difflib, datetime, sys\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\nfrom context_core import get_app_dir\n\nVENDOR_HINTS = (\"取引先\", \"請求先\", \"納入先\", \"宛先\", \"vendor\", \"customer\", \"bill to\", \"supplier\", \"会社名\")\n\n\ndef _now():\n    return datetime.datetime.now().isoformat(timespec=\"seconds\")\n\n\ndef learning_path(base_dir=None):\n    return os.path.join(base_dir or get_app_dir(), \"learning.jsonl\")\n\n\ndef save_correction(profile_name, field_column, original, corrected, source_snippet=\"\", base_dir=None):\n    \"\"\"Append one confirmed correction. Returns the stored record.\"\"\"\n    rec = {\"timestamp\": _now(), \"profile\": profile_name, \"field\": field_column,\n           \"original\": original or \"\", \"corrected\": corrected or \"\",\n           \"source_snippet\": (source_snippet or \"\")[:300]}\n    p = learning_path(base_dir)\n    os.makedirs(os.path.dirname(p), exist_ok=True)\n    with open(p, \"a\", encoding=\"utf-8\") as f:\n        f.write(json.dumps(rec, ensure_ascii=False) + \"\\n\")\n    return rec\n\n\ndef load_corrections(base_dir=None):\n    p = learning_path(base_dir)\n    out = []\n    if os.path.exists(p):\n        with open(p, encoding=\"utf-8\") as f:\n            for line in f:\n                line = line.strip()\n                if line:\n                    try:\n                        out.append(json.loads(line))\n                    except Exception:\n                        pass\n    return out\n\n\ndef recent_corrections(profile_name, limit=5, base_dir=None):\n    recs = [r for r in load_corrections(base_dir) if r.get(\"profile\") == profile_name]\n    return recs[-limit:]\n\n\n_SEPARATORS = \" \\t:：=|/・,、\"\n\n\ndef learn_alias(profile, field_column, corrected_value, source_text):\n    \"\"\"If the corrected value appears in the source text preceded by a word\n    that is not yet a keyword of the field, add that word as a keyword alias.\n    Mutates the profile's field; returns the learned word or None.\"\"\"\n    if not corrected_value or not source_text:\n        return None\n    fdef = next((f for f in profile.fields if f.target_column == field_column), None)\n    if fdef is None:\n        return None\n    existing = {k.lower() for k in fdef.keyword_list()}\n    for line in str(source_text).splitlines():\n        idx = line.find(str(corrected_value))\n        if idx < 0:\n            continue\n        before = line[:idx].rstrip(_SEPARATORS)\n        if not before:\n            continue\n        # last token before the value (split on whitespace / colons / brackets)\n        token = re.split(r\"[\\s:：=|/・,、()（）\\[\\]]+\", before)[-1].strip()\n        if not token or len(token) > 30:\n            continue\n        if token.lower() in existing:\n            return None  # already known — nothing to learn\n        if re.fullmatch(r\"[\\d,.\\-]+\", token):\n            continue  # a number is not a keyword\n        if any(kw and kw.lower() in token.lower() for kw in existing):\n            return None  # token already contains a known keyword\n        fdef.keywords = (fdef.keywords + \",\" + token) if fdef.keywords else token\n        return token\n    return None\n\n\n# ------------------------------------------------------- vendor memory ----\ndef vendor_memory_path(base_dir=None):\n    return os.path.join(base_dir or get_app_dir(), \"vendor_profiles.json\")\n\n\ndef _load_vendor_memory(base_dir=None):\n    p = vendor_memory_path(base_dir)\n    if os.path.exists(p):\n        try:\n            with open(p, encoding=\"utf-8\") as f:\n                return json.load(f)\n        except Exception:\n            pass\n    return {}\n\n\ndef remember_vendor_profile(vendor, profile_name, base_dir=None):\n    vendor = (vendor or \"\").strip()\n    if not vendor:\n        return\n    mem = _load_vendor_memory(base_dir)\n    mem[vendor] = {\"profile\": profile_name, \"timestamp\": _now()}\n    p = vendor_memory_path(base_dir)\n    os.makedirs(os.path.dirname(p), exist_ok=True)\n    with open(p, \"w\", encoding=\"utf-8\") as f:\n        json.dump(mem, f, ensure_ascii=False, indent=2)\n\n\ndef profile_for_vendor(vendor, base_dir=None):\n    vendor = (vendor or \"\").strip()\n    if not vendor:\n        return None\n    mem = _load_vendor_memory(base_dir)\n    if vendor in mem:\n        return mem[vendor].get(\"profile\")\n    # fuzzy: closest remembered vendor name\n    best, best_r = None, 0.0\n    for name, rec in mem.items():\n        r = difflib.SequenceMatcher(None, vendor, name).ratio()\n        if r > best_r:\n            best, best_r = rec.get(\"profile\"), r\n    return best if best_r >= 0.9 else None\n\n\ndef detect_vendor(rows, profile):\n    \"\"\"Return the value of the vendor-like field of the first row, if any.\"\"\"\n    if not rows:\n        return \"\"\n    for f in profile.fields:\n        hay = (f.display_name + \" \" + f.target_column).lower()\n        if any(h in hay for h in VENDOR_HINTS):\n            fr = rows[0].get(f.target_column)\n            v = fr.value if fr is not None and hasattr(fr, \"value\") else (str(fr) if fr else \"\")\n            if v:\n                return v\n    return \"\"\n"}, {"path": "MakeApp-Mac.command", "sizestr": "3.9 KB", "content": "#!/bin/bash\n# ContextStruct - build a standalone macOS app (ContextStruct.app)\n#\n# How to use (this is the standard way to get the Mac app):\n#   1. Download the ContextStruct source ZIP and extract it.\n#   2. Double-click this file:  MakeApp-Mac.command\n#      (First time only: macOS may block it because it is unsigned.\n#       Right-click the file -> \"Open\" -> \"Open\" to run it once.)\n#   3. When the build finishes, the app appears in the \"dist\" folder:\n#         dist/ContextStruct.app\n#   4. From then on, just double-click ContextStruct.app to use it.\n#      (The .app is also unsigned, so the first launch of the app\n#       itself needs the same right-click -> \"Open\" once.)\n#\n# Notes:\n#   * The bundled vlm_runtime/ in this package is the Windows llama.cpp\n#     build and is NOT embedded into the Mac app (it cannot run on\n#     macOS). The rule engine, OCR and all other features work in the\n#     Mac app; only the built-in local VLM needs a macOS llama.cpp\n#     build placed manually (see the README Mac chapter).\ncd \"$(dirname \"$0\")\" || exit 1\n\necho \"=== ContextStruct - build the macOS app ===\"\n\n# --- Python 3 check ------------------------------------------------------\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Building the app needs Python 3. Please install it in one of\"\n  echo \"these ways, then double-click this file again:\"\n  echo \"\"\n  echo \"  1) Download the installer from https://www.python.org/downloads/macos/\"\n  echo \"     and run it (recommended for most users).\"\n  echo \"  2) If you use Homebrew:  brew install python\"\n  echo \"  3) Or run this in Terminal:  xcode-select --install\"\n  echo \"     (installs Apple's Command Line Tools, which include Python 3).\"\n  echo \"\"\n  read -r -p \"Press Enter to close this window.\"\n  exit 1\nfi\n\nPY=python3\necho \"Using: $($PY --version 2>&1)\"\n\n# --- Virtual environment + build tools -----------------------------------\nif [ ! -x \".venv-build/bin/python\" ]; then\n  echo \"Preparing the build environment (first run only)...\"\n  $PY -m venv .venv-build || { echo \"Failed to create the environment.\"; read -r -p \"Press Enter to close.\"; exit 1; }\n  .venv-build/bin/python -m pip install --upgrade pip >/dev/null 2>&1\n  .venv-build/bin/python -m pip install -r requirements.txt pyinstaller || { echo \"Failed to install the build tools. Check your network connection.\"; read -r -p \"Press Enter to close.\"; exit 1; }\nfi\n\nHOST_ARCH=\"$(uname -m)\"\necho \"This Mac's chip: $HOST_ARCH\"\necho \"Building ContextStruct.app (this can take a few minutes)...\"\n\n# Try a universal2 build first (one app that runs on both Apple\n# Silicon and Intel Macs). The python.org Python and PySide6 are\n# universal2, so this normally succeeds. If this Mac's Python is\n# single-architecture, the universal build fails and we fall back to\n# a native build for this Mac's chip automatically.\nBUILT_ARCH=\"\"\nif .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name ContextStruct --icon assets/icon.icns --target-arch universal2 app.py; then\n  BUILT_ARCH=\"universal2 (Apple Silicon + Intel)\"\nelse\n  echo \"\"\n  echo \"The universal2 build did not work on this Mac, so the app\"\n  echo \"is being built for this Mac's chip only ($HOST_ARCH).\"\n  echo \"\"\n  rm -rf dist build ContextStruct.spec\n  if .venv-build/bin/python -m PyInstaller --noconfirm --windowed --name ContextStruct --icon assets/icon.icns app.py; then\n    BUILT_ARCH=\"native ($HOST_ARCH only)\"\n  else\n    echo \"The build failed. See the messages above.\"\n    read -r -p \"Press Enter to close.\"\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"Done! Your app is here:\"\necho \"  $(pwd)/dist/ContextStruct.app\"\necho \"Architecture of the built app: $BUILT_ARCH\"\necho \"Supported systems: macOS 11 (Big Sur) or later.\"\necho \"\"\necho \"Double-click ContextStruct.app to use it.\"\necho \"First launch only: if macOS blocks it, right-click the app\"\necho \"and choose \\\"Open\\\" once (the app is unsigned).\"\necho \"\"\nread -r -p \"Press Enter to close this window.\"\n"}, {"path": "preprocess.py", "sizestr": "7.6 KB", "content": "# -*- coding: utf-8 -*-\n\"\"\"Image preprocessing for ContextStruct v2 — maximize OCR/VLM accuracy on\nscanned paper, FAX and photographed documents.\n\nPipeline (OpenCV when available, Pillow fallback otherwise):\n  1. upscale x2 (small scans become readable)\n  2. deskew (estimate skew angle from dark-pixel geometry, rotate back)\n  3. denoise\n  4. CLAHE contrast enhancement  -> 'enhanced' variant\n  5. adaptive binarization       -> 'binarized' variant\n\n`preprocess_image()` returns {variant_name: PIL.Image} with keys\n'original', 'enhanced', 'binarized'. `preprocess_to_files()` saves the\nvariants as temporary PNGs so they can be fed to OCR engines and to the\nlocal VLM (which always receives an image, never text).\n\nAll functions are unit-testable without any OCR binary: they operate on\nPIL images only.\n\"\"\"\nimport os, math, tempfile\n\ntry:\n    import cv2\n    import numpy as np\n    HAS_CV2 = True\nexcept Exception:  # pragma: no cover - exercised only on cv2-less installs\n    cv2 = None\n    np = None\n    HAS_CV2 = False\n\nfrom PIL import Image, ImageOps, ImageEnhance, ImageFilter\n\nMAX_SKEW_SEARCH = 15.0  # degrees; beyond this it is not a scan skew but a photo\n\n\n# ---------------------------------------------------------------- skew ----\ndef estimate_skew(pil_image):\n    \"\"\"Estimate the skew angle (degrees) of the text lines in an image.\n    Positive angle means the image is rotated counter-clockwise by that much.\n    Returns 0.0 when no reliable estimate exists.\"\"\"\n    if pil_image is None:\n        return 0.0\n    if HAS_CV2:\n        try:\n            return _estimate_skew_cv2(pil_image)\n        except Exception:\n            pass\n    try:\n        return _estimate_skew_projection(pil_image)\n    except Exception:\n        return 0.0\n\n\ndef _estimate_skew_cv2(pil_image):\n    img = pil_image.convert(\"L\")\n    # downscale for speed\n    w, h = img.size\n    scale = 1000.0 / max(w, h) if max(w, h) > 1000 else 1.0\n    if scale < 1.0:\n        img = img.resize((max(1, int(w * scale)), max(1, int(h * scale))))\n    arr = np.array(img)\n    _, bw = cv2.threshold(arr, 0, 255, cv2.THRESH_BINARY_INV + cv2.THRESH_OTSU)\n    coords = np.column_stack(np.where(bw > 0))\n    if len(coords) < 100:\n        return 0.0\n    rect = cv2.minAreaRect(coords[:, ::-1].astype(np.float32))\n    angle = float(rect[-1])\n    # minAreaRect angle conventions differ by version; normalize to (-45, 45]\n    if angle < -45:\n        angle += 90.0\n    if angle > 45:\n        angle -= 90.0\n    # coords were (row, col); minAreaRect on (x=col, y=row) flips the sign\n    angle = -angle\n    if abs(angle) < 0.05 or abs(angle) > MAX_SKEW_SEARCH:\n        return 0.0 if abs(angle) < 0.05 else angle\n    return angle\n\n\ndef _estimate_skew_projection(pil_image):\n    \"\"\"Fallback: projection-profile search over small angles (Pillow/numpy-free\n    implementation using PIL rotations on a downscaled binary image).\"\"\"\n    img = pil_image.convert(\"L\")\n    w, h = img.size\n    scale = 500.0 / max(w, h) if max(w, h) > 500 else 1.0\n    if scale < 1.0:\n        img = img.resize((max(1, int(w * scale)), max(1, int(h * scale))))\n    bw = img.point(lambda p: 0 if p < 128 else 255)\n    best_angle, best_score = 0.0, -1.0\n    a = -5.0\n    while a <= 5.0:\n        rot = bw.rotate(a, resample=Image.BILINEAR, fillcolor=255)\n        px = rot.load()\n        rw, rh = rot.size\n        score = 0.0\n        prev = None\n        for y in range(rh):\n            row_dark = sum(1 for x in range(0, rw, 3) if px[x, y] == 0)\n            if prev is not None:\n                score += abs(row_dark - prev)\n            prev = row_dark\n        if score > best_score:\n            best_score, best_angle = score, a\n        a += 0.5\n    return -best_angle\n\n\ndef deskew_image(pil_image):\n    \"\"\"Return a deskewed copy. Uses the estimated skew; no-op when ~0.\"\"\"\n    angle = estimate_skew(pil_image)\n    if abs(angle) < 0.1:\n        return pil_image.copy()\n    # estimate_skew reports the content's own rotation (PIL convention);\n    # undoing it needs the opposite rotation in both backends (verified\n    # empirically on synthetic rotated patterns).\n    if HAS_CV2:\n        arr = np.array(pil_image.convert(\"RGB\"))\n        h, w = arr.shape[:2]\n        center = (w // 2, h // 2)\n        m = cv2.getRotationMatrix2D(center, -angle, 1.0)\n        out = cv2.warpAffine(arr, m, (w, h), flags=cv2.INTER_CUBIC,\n                             borderMode=cv2.BORDER_CONSTANT, borderValue=(255, 255, 255))\n        return Image.fromarray(out)\n    return pil_image.rotate(-angle, resample=Image.BICUBIC, expand=False, fillcolor=(255, 255, 255))\n\n\n# ------------------------------------------------------------- variants ----\ndef _to_gray_array(pil_image):\n    return np.array(pil_image.convert(\"L\"))\n\n\ndef enhance_image(pil_image):\n    \"\"\"Denoise + CLAHE contrast enhancement (grayscale, kept as RGB for VLM).\"\"\"\n    if HAS_CV2:\n        gray = _to_gray_array(pil_image)\n        den = cv2.fastNlMeansDenoising(gray, None, 10, 7, 21)\n        clahe = cv2.createCLAHE(clipLimit=2.0, tileGridSize=(8, 8))\n        out = clahe.apply(den)\n        return Image.fromarray(out).convert(\"RGB\")\n    img = pil_image.convert(\"L\").filter(ImageFilter.MedianFilter(size=3))\n    img = ImageOps.autocontrast(img, cutoff=1)\n    img = ImageEnhance.Contrast(img).enhance(1.4)\n    return img.convert(\"RGB\")\n\n\ndef binarize_image(pil_image):\n    \"\"\"Adaptive binarization: black text on white, tolerant of uneven FAX light.\"\"\"\n    if HAS_CV2:\n        gray = _to_gray_array(pil_image)\n        den = cv2.GaussianBlur(gray, (3, 3), 0)\n        out = cv2.adaptiveThreshold(den, 255, cv2.ADAPTIVE_THRESH_GAUSSIAN_C,\n                                    cv2.THRESH_BINARY, 31, 12)\n        return Image.fromarray(out).convert(\"RGB\")\n    img = pil_image.convert(\"L\")\n    # simple global fallback: Otsu via histogram midpoint of bimodal peaks\n    hist = img.histogram()\n    total = sum(hist)\n    sum_all = sum(i * h for i, h in enumerate(hist))\n    w_b = sum_b = 0\n    max_var, thresh = -1, 128\n    for i, h in enumerate(hist):\n        w_b += h\n        if w_b == 0:\n            continue\n        w_f = total - w_b\n        if w_f == 0:\n            break\n        sum_b += i * h\n        m_b = sum_b / w_b\n        m_f = (sum_all - sum_b) / w_f\n        var = w_b * w_f * (m_b - m_f) ** 2\n        if var > max_var:\n            max_var, thresh = var, i\n    return img.point(lambda p: 255 if p > thresh else 0).convert(\"RGB\")\n\n\ndef upscale_image(pil_image, factor=2):\n    w, h = pil_image.size\n    resample = Image.LANCZOS\n    if HAS_CV2:\n        arr = np.array(pil_image.convert(\"RGB\"))\n        out = cv2.resize(arr, (w * factor, h * factor), interpolation=cv2.INTER_CUBIC)\n        return Image.fromarray(out)\n    return pil_image.resize((w * factor, h * factor), resample)\n\n\ndef preprocess_image(pil_image, upscale=True):\n    \"\"\"Full pipeline. Returns {'original': deskewed-upscaled, 'enhanced': ...,\n    'binarized': ...} as PIL images (RGB).\"\"\"\n    img = pil_image.convert(\"RGB\")\n    base = deskew_image(img)\n    if upscale:\n        base = upscale_image(base, 2)\n    return {\n        \"original\": base,\n        \"enhanced\": enhance_image(base),\n        \"binarized\": binarize_image(base),\n    }\n\n\ndef preprocess_to_files(source_path, out_dir=None, upscale=True):\n    \"\"\"Load an image file, preprocess, save variants as PNGs, return\n    {variant: path}. Used to feed extra OCR/VLM voters.\"\"\"\n    img = Image.open(source_path)\n    variants = preprocess_image(img, upscale=upscale)\n    out_dir = out_dir or tempfile.mkdtemp(prefix=\"contextstruct_pre_\")\n    os.makedirs(out_dir, exist_ok=True)\n    base = os.path.splitext(os.path.basename(source_path))[0]\n    paths = {}\n    for name, im in variants.items():\n        p = os.path.join(out_dir, f\"{base}_{name}.png\")\n        im.save(p)\n        paths[name] = p\n    return paths\n"}, {"path": "rc_assets.py", "sizestr": "4.8 KB", "content": "# Resource object code (Python 3)\n# Created by: object code\n# Created by: The Resource Compiler for Qt version 6.12.0\n# WARNING! All changes made in this file will be lost!\n\nfrom PySide6 import QtCore\n\nqt_resource_data = b\"\\\n\\x00\\x00\\x00\\x98\\\n\\x89\\\nPNG\\x0d\\x0a\\x1a\\x0a\\x00\\x00\\x00\\x0dIHDR\\x00\\\n\\x00\\x00\\x1c\\x00\\x00\\x00\\x1c\\x08\\x06\\x00\\x00\\x00r\\x0d\\xdf\\x94\\\n\\x00\\x00\\x00_IDATx\\x9cc`\\x18\\x05\\xa3`\\\n\\xd8\\x02\\x95\\xb0\\x13\\xff\\xc9\\xd1\\xc7Dm\\x87\\xd0\\xc4B\\x98\\\n\\xef\\xc8\\xf1\\xe5\ )\n- Mac: Start-ContextStruct.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\nNotes:\nAIモデル（約2.8GB）と推論ランタイムのバイナリは含まれていません。モデルはアプリの初回起動時に自動でダウンロードされます。OCR機能にはTesseract（別途インストール）が必要です。\nThe AI model (about 2.8 GB) and the inference runtime binaries are not included. The model is downloaded automatically on first launch. The OCR features require Tesseract (installed separately).\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"path": "README.txt", "sizestr": "22.6 KB", "content": "ContextStruct v2 ― 非構造化資料（PDF・画像）の「文脈特化型・即時構造化アシスタント」\n========================================================================\n\n■ これは何をするアプリか\nFAXのPDF、スキャンした納品書、レイアウトがバラバラなWEBカタログなどから、\n自社の業務ルール（プロファイル）に沿って必要な数値・項目を拾い、\n登録フォーマット（Excelの列順）に整えて取り出す Windows デスクトップアプリです。\n※ Mac対応リトロフィット（2026-11-14）で、Macでもソースから起動し、利用者の\n   Mac上で .app 化できる形になりました。Macでの手順と制限は末尾の\n   「■ Macでの利用」章に正直にまとめています。Windowsの動作は従来と同一です。\n「卸値」と「売価」のように、見出しで区別される金額も別々の項目として扱えます。\nv2 では、精度の最大化（複数エンジンの合意＋検証）、完全自動化（監視フォルダー）、\n大規模モデル級の品質への接近（7Bモデル＋自己整合）、修正からの学習、\nGPU対応、基幹システム連携（4方式＋設定アシスト）を追加しました。\n\n■ 使いかた（初回）\n1. ZIPをすべて展開（解凍）してください。展開せずに中身を直接実行しないでください。\n2. 展開したフォルダー内の Start-ContextStruct.bat をダブルクリックします。\n3. 初回だけ、必要なライブラリ（PySide6・OpenCVなど、数百MB規模）を自動で入れます。\n   2回目以降は確認だけですぐ起動します。\n4. 起動中は黒い画面（コマンド画面）を閉じないでください。閉じるとアプリも終了します。\n5. PDF／画像／テキストを大きな枠へドラッグ＆ドロップ（クリックでも選択可）し、\n   プロファイルを選び、「構造化する（抽出）」を押します。\n6. 確認モードで色を確認します（緑＝信頼度80以上／黄＝50〜79／赤＝50未満・未検出）。\n   セルはその場で直せます（直すと信頼度100の手動確定になります）。\n7. 「確定してコピー」でExcelへそのまま貼り付けできます。Excel／CSV出力、JSONコピーも可能です。\n画面キャプチャボタン（ホットキー Ctrl+Shift+S、設定で変更可）でも取り込めます。\n\n■ 精度を上げる仕組み（v2-A/D: アンサンブル＋検証）\n・画像の前処理（preprocess.py）: OpenCVで傾き補正・ノイズ除去・コントラスト強調\n  （CLAHE）・適応二値化・2倍拡大を行い、「原画／強調／二値化」のバリエーションを\n  OCR・VLMへ渡します。汚れたFAXや手書き混じりの読み取りを底上げします。\n・複数エンジンの合意: PDFテキスト層、Tesseract OCR（原画＋前処理バリエーションが\n  それぞれ投票）、内蔵VLM、（任意で）easyocr/paddleocr、外部API VLM が同じ文書を読み、\n  項目ごとに投票します。2つ以上のエンジンが一致した値は信頼度97〜99へ引き上げ、\n  意見が割れた値は信頼度に上限を付けて検証対象にします。\n・検証パス: (a) 検算 ― 数量×単価≒合計、明細の合計、消費税8%/10%のパターンを照合し、\n  合わない項目の信頼度を下げます。(b) 項目別の再読 ― 意見が割れた／検算に失敗した\n  項目だけ、VLMへ「その項目だけ」の質問で再読します。(c) マスター照合 ― 設定で\n  指定した商品・取引先マスターCSV（code,name 列、または先頭2列）にあいまい照合し、\n  一致すればマスターの表記にそろえて信頼度を上げます。\n※ それでも「精度100%の保証」はできません。人間でも判読できない汚れ・崩れた手書きは\n   読めません。読めない項目は推測で埋めず空欄＋低信頼度で出す設計です。\n   完全自動モード（下記）以外では、必ず確認モードで人の目を通してください。\n\n■ 完全自動化（v2-B: 任意機能）\n・監視フォルダー: 設定で監視フォルダー・出力先・処理済みフォルダー・要確認フォルダー・\n  自動確定のしきい値（既定90）を指定すると、新しく入ったファイルを自動処理します。\n  全項目の信頼度がしきい値以上で検算も通れば、出力先（Excel/CSV、または連携先）へ\n  自動で追加し、監査ログ（audit_log.jsonl）に「いつ・どのファイル・どの値・\n  信頼度・どのエンジンが合意したか」を記録して、元ファイルを処理済みフォルダーへ\n  移します。条件を満たさないファイルは要確認フォルダーへ移り、アプリ内の\n  要確認キューからクリックで通常の確認モードで開けます。\n・バッチ自動: メイン画面の「完全自動モード」をONにして複数ファイルを落とすと、\n  1つずつ自動処理し、結果（自動確定／要確認の件数）を表示します。\n・このモードは「人の確認なしに登録する」モードです。使うかどうかは利用者の\n  判断であり、有効化した事実と全処理は監査ログに残ります。\n\n■ 内蔵ローカルVLM（APIキー不要・完全オフライン動作）\n・推論ランタイム: llama.cpp 公式 Windows x64 CPU ビルド b10936 の\n  llama-mtmd-cli.exe と必要DLLを、このアプリの vlm_runtime フォルダーに同梱済みです。\n・モデルは2種類から選べます（設定画面）:\n  - 3B（軽量）: Qwen2.5-VL-3B-Instruct GGUF\n      本体 Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf = 1,929,901,056 bytes\n      mmproj mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf = 844,757,728 bytes\n      合計 2,774,658,784 bytes（約2.8GB）\n  - 7B（高精度）: Qwen2.5-VL-7B-Instruct GGUF\n      本体 Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf = 4,683,072,032 bytes\n      mmproj mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf = 853,119,712 bytes\n      合計 5,536,191,744 bytes（約5.5GB）\n  ファイル名とサイズは Hugging Face 公式APIで実在を確認済みです。\n・モデル本体は大きいためZIPには入れていません。初回のVLM利用時、または\n  ダウンロードボタンから、進捗バー付きで %APPDATA%\\ContextStruct\\models へ\n  自動ダウンロードします。ダウンロード後は完全オフラインで動作し、APIキーは不要です。\n・自己整合（v2-C）: VLMは同じ画像を「言い回しの違う2つのプロンプト」で2回読み、\n  一致した項目の信頼度を上げ、割れた項目は検証パスの再読に回します。\n・外部API（OpenAI互換エンドポイント）を設定した場合は「最大精度・クラウド」として\n  アンサンブルの1票になります（既定はOFF。使う場合のみAPIキーが必要です）。\n・画像理解とOCRの違い: OCR＝文字の読み取りのみ（補助）。VLM＝画像そのものを見て、\n  表の行列構造・見出しと数値の位置関係・罫線の欄を読み、項目へ対応付けます。\n  画像ファイルはそのまま、スキャンPDFはページを高解像度（最低200DPI）で\n  画像化してからVLMへ渡します。手書きは「読める範囲で」解釈します。\n\n■ GPU対応（v2-H: 任意）\n・グラフィックボード搭載PCでは、GPU版ランタイムでVLMを高速化できます。\n  設定画面から llama.cpp 公式の GPU版を取得できます:\n  Vulkan版（llama-b10936-bin-win-vulkan-x64.zip、31,673,236 bytes）と\n  CUDA版（llama-b10936-bin-win-cuda-12.4-x64.zip、254,065,100 bytes ＋\n  cudart-llama-bin-win-cuda-12.4-x64.zip、391,443,627 bytes）。\n・GPU版がある場合はそちらを優先して起動し、GPUへレイヤーをオフロード（-ngl）します。\n  起動に失敗した場合は自動でCPU版へ戻ります。\n・内蔵グラフィックスのみのPCではCPU動作になります。設定画面に現在の実行モード\n  （CPU / GPU(Vulkan) / GPU(CUDA)）と検出結果が表示されます。\n  ※「GPU無し」とはグラフィックボード（GPU）が無いという意味で、\n    内蔵グラフィックスのみのPCではCPUで処理します。\n\n■ 学習（v2-E: モデルの再学習ではありません）\n・確定した修正は learning.jsonl に記録されます。\n・キーワード学習: 修正した値の近くにあった未知の見出し語を、その項目の\n  キーワードとしてプロファイルへ自動追加します（プロファイル編集で確認できます）。\n・VLMへの例示: 同じプロファイルの直近の修正5件を、VLMのプロンプトへ例として渡します。\n・取引先ごとの記憶: 取引先ごとに最後に使ったプロファイルを覚え、次回自動で選びます。\n・正直な位置づけ: これはモデルの再学習（ファインチューニング）ではなく、\n  辞書と文脈（プロンプト）による学習です。重い処理を担うのはネイティブの\n  C/C++エンジン（llama.cpp・Tesseract・OpenCV）で、Pythonがそれらを取りまとめています。\n\n■ 基幹システム連携（v2-I: 任意の上級機能）\n連携は任意の上級機能です。未設定でも本体の流れ（ドロップ→構造化→確認→\nコピー／Excel出力）は完全に使えます。対象は確認モードで確定した行\n（完全自動モードでは自動確定した行）です。\n・方式1 RPA画面自動入力: 対象画面の先頭欄にフォーカスして実行すると、\n  値を「入力→Tab→入力…」で自動入力します。開始前3秒カウントダウン、\n  Escキーで即時中止、項目ごとの間隔は設定可能です。最後の「登録」クリックは\n  任意機能で、利用者が実物の登録ボタンをクリックして座標を記録した場合に\n  限り、その記録済み座標だけをクリックします（記録なしに推測でクリックしません）。\n・方式2 Webフォーム連携: 項目→CSSセレクタの対応表から、ブラウザで実行すると\n  フォームへ値を流し込むブックマークレットを生成します。selenium が入っている\n  環境では、URLを開いて直接入力する経路も使えます（ドライバは同梱しません）。\n・方式3 取り込みファイル連携: 形式（CSV/TSV/Excel）・文字コード（UTF-8/Shift-JIS）・\n  改行（CRLF/LF）・ヘッダー有無・日付書式・列の並び・日付入りのファイル名を\n  指定して書き出します。完全自動モードの出力先としても選べます。\n・方式4 データベース直接書き込み: 既定はドライラン（実行予定のINSERT文を\n  プレビューするだけで書きません）。連携プロファイルで「DB直接書き込みを\n  有効化」を明示ONにした場合だけ、トランザクションで書き込み、監査ログにも\n  記録します。sqlite は標準機能で動作し、ODBCは pyodbc がある場合のみ使えます。\n・完全自動モードの出力先に選べるのは方式3と方式4（有効化済み）だけです。\n  方式1・2は画面操作が前提のため手動実行のみです。\n\n■ 連携の設定アシスト（手入力を減らす仕組み）\n・Webフォーム「クリックで欄を覚える」: 学習用ブックマークレットを対象フォームで\n  実行すると、項目名の順に案内が出るので、対応する入力欄をクリックしていくだけで\n  対応表（CSSセレクタ）のJSONが得られます。アプリ側の「対応表JSONを取り込む」で\n  読み込めます（セレクタは id優先→name→位置パスの順で自動生成されます）。\n・取り込み仕様の自動推定: 取引先のサンプル取り込みファイル（CSV/TSV）を\n  連携ダイアログへドロップするか「サンプルファイルから仕様を推定」を使うと、\n  文字コード（UTF-8/Shift-JIS）・区切り・ヘッダー有無・列順を推定して\n  方式3の下書きを自動作成します。あとは確認と微調整だけです。\n・連携プロファイルの書き出し／読み込み: 連携プロファイルをJSONで出し入れできます。\n  会社の中で詳しい人が1回設定してプロファイルを配れば、全員が読み込んで\n  そのまま使えます。個人サイト等で「プロファイル例」を配る運用も可能です。\n・DB接続アシスタント: 接続文字列を手で書く代わりに、種類（SQLiteはファイル選択／\n  ODBC）・サーバー名・DB名をフォームに入れ、「接続テスト」で接続を確認してから、\n  テーブルは一覧から、列の対応はテーブルの列一覧からドロップダウンで選べます。\n・運用上の注意: DB接続情報は各会社の管理者のものを使ってください。\n  アプリや配布サイトに、他社の接続情報を同梱することは決してありません。\n  4方式とも仕組みはアプリに内蔵されていますが、実際に使うには連携先ごとの\n  情報（セレクタ・取り込み仕様・DB接続情報とその会社の許可）が利用者側で必要です。\n  接続先を推測する機能はありません。\n\n■ 配布者向けフルパッケージ（サイト配布用）\nモデルまで含めた完全版を自分のサイトで配りたい場合は:\n1. Download-Models.bat を実行（または python download_models.py）すると、\n   3Bと7Bの両モデル（合計 約8.3GB）をダウンロードし、サイズを検証します。\n2. ダウンロード先（%APPDATA%\\ContextStruct\\models）の中身を、展開した\n   ContextStruct フォルダー直下の models フォルダーへコピーしてください。\n   アプリは起動時にアプリデータ側→同梱 models フォルダーの順で探すため、\n   models を含むZIPを配れば、利用者はダウンロードなしで使えます。\n3. フォルダー全体を再圧縮して配布してください（約8.4GB規模になります）。\n\n■ プロファイル（文脈）の編集\nプロファイル編集画面で、表示名・出力列名・キーワード（カンマ区切り）・種類\n（テキスト／数値／日付／金額）・必須を、追加・削除・並べ替えできます。\n保存先は %APPDATA%\\ContextStruct で、JSONの書き出し／読み込みもできます。\n同梱プリセット: 納品書／請求書／WEBカタログ商品／汎用。\n納品書とWEBカタログには「卸値」と「売価」が別項目で入っています。\n\n■ 表示言語（13言語）\n日本語／English／Español／简体中文／Français／Deutsch／Português／Русский／\nItaliano／Türkçe／العربية（RTL表示）／Bahasa Indonesia／한국어\nヘッダー右上のセレクタで切り替え、設定は保存されます。v2の新機能\n（完全自動化・連携・GPU・学習・設定アシスト）の文字列も全13言語に収録しています。\n\n■ 正直な制限（必ずお読みください）\n・精度100%の保証はありません（上記参照）。完全自動モードは利用者が選ぶ\n  無人登録であり、全件が監査ログに残る前提の機能です。\n・GPUのないCPUパソコンでは、VLMは1ページに数十秒〜数分かかる場合があります\n  （7Bはさらに時間がかかります）。「即時」に終わるのはルール抽出の方です。\n・OCRを使うには、Windows側に Tesseract 本体のインストールが必要です\n  （公式配布: https://github.com/UB-Mannheim/tesseract/wiki など。\n   日本語データ jpn を含め、PATHを通してください）。未導入でもアプリは止まらず、\n   抽出テキスト欄へ貼り付け・手入力してルール抽出できます。\n  Macでは Homebrew で導入します（brew install tesseract tesseract-lang。\n  詳細は末尾の「■ Macでの利用」章）。\n  easyoc
