 dialog strings, kept in one block for easy proofreading.\n_ABOUT = {\n    \"ja\": (\"このアプリについて\", \"コピーしたテキストを自動で種類分け（URL・金額・日付・住所・コード・メール・その他）して、このパソコンの中だけに保存します。通信は一切しません。貼りたいものを人が選ぶ「半自動」の道具です。\"),\n    \"en\": (\"About\", \"Copied text is sorted automatically (URL / amount / date / address / code / email / other) and stored only on this computer. Nothing is ever sent over the network. You pick what to paste - a semi-automatic tool by design.\"),\n    \"es\": (\"Acerca de\", \"El texto copiado se clasifica automáticamente (URL / importe / fecha / dirección / código / correo / otro) y se guarda solo en este ordenador. Nunca se envía nada por la red. Tú eliges qué pegar: una herramienta semiautomática a propósito.\"),\n    \"zh_CN\": (\"关于\", \"复制的文本会被自动分类（网址/金额/日期/地址/代码/邮箱/其他），并且只保存在这台电脑中。不会进行任何网络通信。粘贴什么由人来选择——这是一个刻意设计的“半自动”工具。\"),\n    \"fr\": (\"À propos\", \"Le texte copié est trié automatiquement (URL / montant / date / adresse / code / e-mail / autre) et stocké uniquement sur cet ordinateur. Rien n'est jamais envoyé sur le réseau. C'est vous qui choisissez quoi coller : un outil semi-automatique par conception.\"),\n    \"de\": (\"Info\", \"Kopierter Text wird automatisch sortiert (URL / Betrag / Datum / Adresse / Code / E-Mail / Sonstiges) und nur auf diesem Computer gespeichert. Es wird nie etwas über das Netzwerk gesendet. Sie wählen, was eingefügt wird - ein bewusst halbautomatisches Werkzeug.\"),\n    \"pt\": (\"Sobre\", \"O texto copiado é classificado automaticamente (URL / valor / data / endereço / código / e-mail / outro) e guardado apenas neste computador. Nada é enviado pela rede. Você escolhe o que colar: uma ferramenta semiautomática por design.\"),\n    \"ru\": (\"О программе\", \"Скопированный текст автоматически сортируется (URL / сумма / дата / адрес / код / почта / прочее) и хранится только на этом компьютере. Ничего никогда не отправляется по сети. Что вставлять — выбираете вы: это намеренно полуавтоматический инструмент.\"),\n    \"it\": (\"Informazioni\", \"Il testo copiato viene ordinato automaticamente (URL / importo / data / indirizzo / codice / e-mail / altro) e conservato solo su questo computer. Nulla viene mai inviato in rete. Scegli tu cosa incollare: uno strumento semiautomatico per scelta.\"),\n    \"tr\": (\"Hakkında\", \"Kopyalanan metin otomatik olarak sıralanır (URL / tutar / tarih / adres / kod / e-posta / diğer) ve yalnızca bu bilgisayarda saklanır. Ağ üzerinden hiçbir şey gönderilmez. Neyi yapıştıracağınızı siz seçersiniz; bilinçli olarak yarı otomatik bir araçtır.\"),\n    \"ar\": (\"حول التطبيق\", \"يُفرز النص المنسوخ تلقائيًا (رابط / مبلغ / تاريخ / عنوان / رمز / بريد / أخرى) ويُحفظ على هذا الحاسوب فقط. لا يُرسل أي شيء عبر الشبكة أبدًا. وأنت تختار ما تريد لصقه؛ أداة شبه تلقائية عن قصد.\"),\n    \"id\": (\"Tentang\", \"Teks yang disalin diurutkan secara otomatis (URL / jumlah / tanggal / alamat / kode / email / lainnya) dan disimpan hanya di komputer ini. Tidak ada yang pernah dikirim melalui jaringan. Anda yang memilih apa yang ditempel - alat semi-otomatis secara sengaja.\"),\n    \"ko\": (\"이 앱 정보\", \"복사한 텍스트를 자동으로 분류(URL・금액・날짜・주소・코드・메일・기타)해 이 컴퓨터 안에만 저장합니다. 네트워크 통신은 일절 하지 않습니다. 붙여넣을 항목은 사람이 선택하는 '반자동' 도구입니다.\"),\n}\nfor _lang, (_title, _body) in _ABOUT.items():\n    TRANSLATIONS[_lang][\"about\"] = _title\n    TRANSLATIONS[_lang][\"about_body\"] = _body\n"}, {"p": "MakeApp-Mac.command", "s": 3209, "l": "bash", "c": "#!/bin/bash\n# ClipStock - build a macOS .app with PyInstaller\n# Double-click this file in Finder on a Mac. The app is built into\n#   dist/ClipStock.app\n# It first tries a universal2 build (runs on both Apple silicon and\n# Intel Macs). If that fails, it retries for this Mac's own CPU only\n# and tells you which kind was produced.\n#\n# Note: the built app is unsigned. To open it the first time,\n# right-click (Control-click) the app and choose \"Open\".\nset -u\ncd \"$(dirname \"$0\")\"\n\necho \"===============================================\"\necho \" ClipStock - build macOS app\"\necho \"===============================================\"\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Please install Python 3 first, then run this file again:\"\n  echo \"  https://www.python.org/downloads/macos/\"\n  echo \"  (Download the universal2 macOS installer.)\"\n  echo \"\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found next to this file.\"\n  echo \"Please extract the whole ZIP first, then try again.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -x .venv-build/bin/python ]; then\n  echo \"Creating the build environment (.venv-build)...\"\n  python3 -m venv .venv-build || {\n    echo \"Failed to create the Python environment.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\nPY=.venv-build/bin/python\n\necho \"Installing / updating build libraries...\"\n\"$PY\" -m pip install --upgrade pip >/dev/null 2>&1\n\"$PY\" -m pip install -r requirements.txt pyinstaller || {\n  echo \"Failed to install libraries. Check your network connection.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\n}\n\nARCH=\"$(uname -m)\"\necho \"This Mac's CPU: $ARCH\"\n\nbuild_app() {\n  # $1 = extra target-arch args (may be empty)\n  \"$PY\" -m PyInstaller --noconfirm --windowed --name ClipStock --icon assets/icon.icns \\\n    --exclude-module tkinter $1 app.py\n}\n\necho \"\"\necho \"Trying a universal2 build (Apple silicon + Intel)...\"\nif build_app \"--target-arch universal2\" && [ -d dist/ClipStock.app ]; then\n  echo \"\"\n  echo \"===============================================\"\n  echo \" Done: dist/ClipStock.app\"\n  echo \" Build type: universal2 (Apple silicon + Intel)\"\n  echo \"===============================================\"\nelse\n  echo \"\"\n  echo \"universal2 build failed. Retrying for this Mac only ($ARCH)...\"\n  rm -rf build dist ClipStock.spec\n  if build_app \"\" && [ -d dist/ClipStock.app ]; then\n    echo \"\"\n    echo \"===============================================\"\n    echo \" Done: dist/ClipStock.app\"\n    echo \" Build type: $ARCH only (this Mac's CPU)\"\n    echo \"===============================================\"\n  else\n    echo \"\"\n    echo \"Build failed. See the messages above for details.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  fi\nfi\n\necho \"\"\necho \"First launch of the built app: it is unsigned, so macOS may\"\necho \"block a plain double-click. Right-click (Control-click)\"\necho \"ClipStock.app and choose \\\"Open\\\" once.\"\necho \"ClipStock lives in the menu bar after launch.\"\necho \"\"\necho \"Press Enter to close this window.\"\nread -r _\n"}, {"p": "MakeExe-ClipStock.bat", "s": 776, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo [Error] app.py not found. Please extract the whole ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [Error] Python not found.\r\n  pause\r\n  exit /b 1\r\n)\r\necho Installing libraries and PyInstaller...\r\n%PY% -m pip install --upgrade PySide6-Essentials PyInstaller\r\nif errorlevel 1 (\r\n  echo [Error] Install failed.\r\n  pause\r\n  exit /b 1\r\n)\r\n%PY% -m PyInstaller --noconfirm --onefile --windowed --name ClipStock --icon assets\\icon.ico --add-data \"assets;assets\" app.py\r\nif errorlevel 1 (\r\n  echo [Error] EXE build failed.\r\n  pause\r\n  exit /b 1\r\n)\r\necho Done: dist\\ClipStock.exe\r\npause\r\n"}, {"p": "README-SOURCE.txt", "s": 1289, "l": "plaintext", "c": "ClipStock - Source Code (version 1.0.0)\n============================================================\nThis ZIP contains the full source code of ClipStock, published so that\nanyone can inspect what the app does, or build it themselves.\nマルウェアやスパイウェアの類は含まれていません。中身を自由にご確認ください。\n\n\n- Python 3.11 or later\n- pip install -r requirements.txt\n\n\n- Windows: Start-ClipStock.bat (or: python app.py)\n- Mac: Start-ClipStock.command (or: python3 app.py)\n\n\n- Windows (.exe): MakeExe-*.bat (uses PyInstaller) — if included\n- Mac (.app): MakeApp-Mac.command\n\nNotes:\nコピー履歴はこのパソコンの中だけに保存され、アプリが通信することは一切ありません。カード番号のような形式のテキストは、初期設定では履歴に保存されません。\nClipboard history is stored only on this computer, and the app makes no network connections. Card-number-like text is not saved to history by default.\n\n\n\n(c) 2026 Furutaka (フルタカ)\nThe app is free for personal and commercial use.\nこのアプリは個人利用・商用利用ともに完全無料です。\nSource published for transparency. / 透明性のために公開しています。\nSite: https://theta-three-28.vercel.app/\n"}, {"p": "README.txt", "s": 4408, "l": "plaintext", "c": "ClipStock - コピペ履歴・スマートウォッチャー (Version 1.0.0)\n============================================================\n\n\nコピーしたテキストを自動で種類分け（URL／金額／日付／住所／コード／\nメール／その他）して履歴に貯める常駐アプリです。分類は決まった形式の\n判定だけで行い、各項目に「なぜその種類になったか」の根拠も表示します。\n\n■ 使い方\n- Windows（EXE版）: ClipStock.exe をダブルクリック。タスクトレイに\n常駐します。パネルはトレイのアイコンか、Ctrl+Shift+V で開きます。\n- Windows（ソース版）: Start-ClipStock.bat をダブルクリック。\n自分でEXEを作る場合は MakeExe-ClipStock.bat を使います。\n- Mac: Start-ClipStock.command で起動（ソース版）。\n.app化は MakeApp-Mac.command をダブルクリック（キット形式）。\n- パネルで項目をクリックすると、そのテキストがクリップボードに戻り\nます。貼り付け自体は、貼りたい場所で Ctrl+V（Macは Command+V）を\n押して人が行います。アプリが勝手に貼ることはありません。\n\n■ 作業セット\nコピーの間隔が設定時間（初期設定30分）以上あくと、自動で新しい\n「作業セット」に分かれます。「新しいセットを開始」ボタンで手動で\n区切ることもでき、名前も変えられます。\n\n■ プライバシー（大切な注意）\n- 履歴はこのパソコンの中だけに保存されます。通信は一切しません。\n- パスワードなど人に見せたくないものも、コピーすれば履歴に残ります。\n残したくない時は「記録を一時停止」してください。\n- カード番号らしい形式（チェックディジット一致）は、初期設定では\n保存しません（設定で変更できます）。\n- 履歴は初期設定で24時間たつと自動で消えます（変更可）。ピン留め\nした項目は自動消去されません。\n\n■ Macでの制限（正直なお知らせ）\n- Mac版ではグローバルホットキー（Ctrl+Shift+V）は使えません。\nパネルはメニューバーのアイコンから開いてください。\n- Mac版は未署名のため、初回は右クリック→「開く」が必要です。\n- Macでの自動起動はアプリ内設定では行えません。システム設定の\n「ログイン項目」に手動で追加してください。\n\n■ 保存場所\n- Windows: %APPDATA%\\ClipStock （settings.json / history.json）\n- Mac: ~/Library/Application Support/ClipStock\n\n■ 動作環境\n- Windows 10/11（64bit）、macOS 11以降\n- 画面表示は13言語に切替できます（設定画面の「表示言語」）。\n\n------------------------------------------------------------\n\nClipStock (Version 1.0.0) - clipboard history watcher.\nCopied text is sorted automatically into kinds (URL / amount / date /\naddress / code / email / other) using fixed format rules only, and each\nitem shows the reason for its kind. History is stored ONLY on your\ncomputer - the app never communicates over the network.\n\n- Windows (EXE): run ClipStock.exe. It lives in the task tray; open\nthe panel from the tray icon or with Ctrl+Shift+V.\n- Windows (source): Start-ClipStock.bat. To build your own EXE, use\nMakeExe-ClipStock.bat.\n- Mac: Start-ClipStock.command (source), or build an.app with\nMakeApp-Mac.command (kit form).\n- Click an item in the panel to put it back on the clipboard. Pasting\nitself is always done by you (Ctrl+V / Command+V). The app never\npastes on its own.\n- Work sets: copies split into a new set after a quiet gap (30 min by\ndefault), or manually with the \"Start a new set\" button.\n- Privacy: passwords and other private text WILL stay in the history\nif you copy them - use \"Pause recording\" when needed. Card-number\nshaped text (checksum match) is not saved by default. History is\nauto-deleted after 24 hours by default (configurable); pinned items\nare kept.\n- Mac limitations: the global hotkey is Windows-only (open the panel\nfrom the menu-bar icon); the app is unsigned, so right-click > Open\non first launch; autostart on Mac is via System Settings > Login\nItems, not from inside the app.\n- Data: Windows %APPDATA%\\ClipStock, Mac ~/Library/Application\nSupport/ClipStock. UI available in 13 languages.\n"}, {"p": "requirements.txt", "s": 24, "l": "plaintext", "c": "PySide6-Essentials>=6.6\n"}, {"p": "Start-ClipStock.bat", "s": 677, "l": "dos", "c": "@echo off\r\nchcp 932 >nul\r\ncd /d %~dp0\r\nif not exist app.py (\r\n  echo [Error] app.py not found. Please extract the whole ZIP first.\r\n  pause\r\n  exit /b 1\r\n)\r\nset PY=\r\nwhere python >nul 2>nul && set PY=python\r\nif not defined PY (\r\n  where py >nul 2>nul && set PY=py\r\n)\r\nif not defined PY (\r\n  echo [Error] Python not found. Please install Python 3 first.\r\n  pause\r\n  exit /b 1\r\n)\r\n%PY% -c \"import PySide6\" >nul 2>nul\r\nif errorlevel 1 (\r\n  echo Installing libraries (first launch only)...\r\n  %PY% -m pip install -r requirements.txt\r\n  if errorlevel 1 (\r\n    echo [Error] Install failed. Check your network connection.\r\n    pause\r\n    exit /b 1\r\n  )\r\n)\r\nstart \"\" /min %PY% app.py\r\n"}, {"p": "Start-ClipStock.command", "s": 1932, "l": "bash", "c": "#!/bin/bash\n# ClipStock - macOS launcher (source version)\n# Double-click this file in Finder to run ClipStock.\n# First launch creates a private Python environment (.venv) next to this\n# file and installs the required libraries; later launches are fast.\n# ClipStock lives in the menu bar (tray). Closing the window keeps it\n# running; quit from the tray icon's menu.\nset -u\ncd \"$(dirname \"$0\")\"\n\necho \"===============================================\"\necho \" ClipStock (macOS launcher)\"\necho \"===============================================\"\n\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"\"\n  echo \"Python 3 was not found on this Mac.\"\n  echo \"Please install Python 3 first, then double-click this file again:\"\n  echo \"  1. Open https://www.python.org/downloads/macos/\"\n  echo \"  2. Download and run the macOS installer (universal2).\"\n  echo \"     (Or, if a dialog offers to install the Command Line\"\n  echo \"      Developer Tools, you may install those instead.)\"\n  echo \"\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -f app.py ]; then\n  echo \"app.py not found next to this file.\"\n  echo \"Please extract the whole ZIP first, then try again.\"\n  echo \"Press Enter to close this window.\"\n  read -r _\n  exit 1\nfi\n\nif [ ! -x .venv/bin/python ]; then\n  echo \"First launch: creating the Python environment (.venv)...\"\n  python3 -m venv .venv || {\n    echo \"Failed to create the Python environment.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\nPY=.venv/bin/python\n\nif ! \"$PY\" -c \"import PySide6\" >/dev/null 2>&1; then\n  echo \"Installing libraries (first launch only)...\"\n  \"$PY\" -m pip install --upgrade pip >/dev/null 2>&1\n  \"$PY\" -m pip install -r requirements.txt || {\n    echo \"Failed to install libraries. Check your network connection.\"\n    echo \"Press Enter to close this window.\"\n    read -r _\n    exit 1\n  }\nfi\n\necho \"Starting ClipStock...\"\nexec \"$PY\" app.py\n"}, {"p": "store.py", "s": 5279, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"\nClipStock - history store (pure logic, no Qt dependency).\n\nHolds copied items grouped into \"work sets\":\n- A new set starts automatically when the gap since the previous copy is\n  at least `gap_seconds` (default 1800 = 30 minutes).\n- The user can also start a new set manually at any time.\n- Set names are generated from the start date/time and can be renamed.\n\nItems can be pinned; pinned items are exempt from automatic expiry.\nExpiry removes unpinned items older than the configured TTL.\nThe store persists to a local JSON file only (no network, ever).\n\"\"\"\nimport json\nimport os\nimport time\nimport uuid\n\nDEFAULT_GAP_SECONDS = 1800\n\n\ndef _new_id():\n    return uuid.uuid4().hex[:12]\n\n\nclass Store:\n    def __init__(self, gap_seconds=DEFAULT_GAP_SECONDS):\n        self.gap_seconds = gap_seconds\n        self.items = []          # list of dicts, oldest first\n        self.sets = []           # list of dicts {id, name, created}\n        self.current_set_id = None\n        self._last_ts = None\n\n    # ---------- sets ----------\n    def _auto_set_name(self, ts):\n        lt = time.localtime(ts)\n        return time.strftime(\"%Y-%m-%d %H:%M\", lt)\n\n    def start_set(self, ts=None, name=None):\n        ts = time.time() if ts is None else ts\n        s = {\"id\": _new_id(), \"name\": name or self._auto_set_name(ts),\n             \"created\": ts}\n        self.sets.append(s)\n        self.current_set_id = s[\"id\"]\n        return s\n\n    def rename_set(self, set_id, name):\n        for s in self.sets:\n            if s[\"id\"] == set_id:\n                s[\"name\"] = name\n                return True\n        return False\n\n    def get_set(self, set_id):\n        for s in self.sets:\n            if s[\"id\"] == set_id:\n                return s\n        return None\n\n    def _ensure_set_for(self, ts):\n        if self.current_set_id is None or self.get_set(self.current_set_id) is None:\n            return self.start_set(ts)\n        if self._last_ts is not None and ts - self._last_ts >= self.gap_seconds:\n            return self.start_set(ts)\n        return self.get_set(self.current_set_id)\n\n    # ---------- items ----------\n    def add(self, text, kind, reason, ts=None):\n        \"\"\"Add a copied text. Consecutive duplicates are not stored twice.\n        Returns the item dict, or None when skipped as a duplicate.\"\"\"\n        ts = time.time() if ts is None else ts\n        if self.items and self.items[-1][\"text\"] == text:\n            self._last_ts = ts\n            return None\n        workset = self._ensure_set_for(ts)\n        item = {\"id\": _new_id(), \"text\": text, \"kind\": kind,\n                \"reason\": reason, \"ts\": ts, \"pinned\": False,\n                \"set_id\": workset[\"id\"]}\n        self.items.append(item)\n        self._last_ts = ts\n        return item\n\n    def delete_item(self, item_id):\n        before = len(self.items)\n        self.items = [i for i in self.items if i[\"id\"] != item_id]\n        return len(self.items) != before\n\n    def set_pinned(self, item_id, pinned):\n        for i in self.items:\n            if i[\"id\"] == item_id:\n                i[\"pinned\"] = bool(pinned)\n                return True\n        return False\n\n    def clear_all(self):\n        self.items = []\n        self.sets = []\n        self.current_set_id = None\n        self._last_ts = None\n\n    def expire(self, ttl_seconds, now=None):\n        \"\"\"Remove unpinned items older than ttl_seconds.\n        ttl_seconds=None means 'never expire'. Returns removed count.\n        Sets that become empty (and are not current) are dropped.\"\"\"\n        if ttl_seconds is None:\n            return 0\n        now = time.time() if now is None else now\n        cutoff = now - ttl_seconds\n        before = len(self.items)\n        self.items = [i for i in self.items\n                      if i[\"pinned\"] or i[\"ts\"] >= cutoff]\n        removed = before - len(self.items)\n        used = {i[\"set_id\"] for i in self.items}\n        self.sets = [s for s in self.sets\n                     if s[\"id\"] in used or s[\"id\"] == self.current_set_id]\n        return removed\n\n    def items_in_set(self, set_id):\n        return [i for i in self.items if i[\"set_id\"] == set_id]\n\n    # ---------- persistence ----------\n    def to_dict(self):\n        return {\"items\": self.items, \"sets\": self.sets,\n                \"current_set_id\": self.current_set_id,\n                \"last_ts\": self._last_ts}\n\n    @classmethod\n    def from_dict(cls, data, gap_seconds=DEFAULT_GAP_SECONDS):\n        st = cls(gap_seconds=gap_seconds)\n        if isinstance(data, dict):\n            st.items = [i for i in data.get(\"items\", []) if isinstance(i, dict)]\n            st.sets = [s for s in data.get(\"sets\", []) if isinstance(s, dict)]\n            st.current_set_id = data.get(\"current_set_id\")\n            st._last_ts = data.get(\"last_ts\")\n        return st\n\n    def save(self, path):\n        tmp = path + \".tmp\"\n        with open(tmp, \"w\", encoding=\"utf-8\") as f:\n            json.dump(self.to_dict(), f, ensure_ascii=False)\n        os.replace(tmp, path)\n\n    @classmethod\n    def load(cls, path, gap_seconds=DEFAULT_GAP_SECONDS):\n        try:\n            with open(path, \"r\", encoding=\"utf-8\") as f:\n                data = json.load(f)\n        except Exception:\n            data = {}\n        return cls.from_dict(data, gap_seconds=gap_seconds)\n"}, {"p": "tests/test_classifier.py", "s": 5160, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tests for the deterministic classifier and the sensitive-shape check.\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom classifier import classify, is_sensitive, luhn_ok\n\n\ndef kind(text):\n    return classify(text)[0]\n\n\ndef reason(text):\n    return classify(text)[1]\n\n\n# ---------- URL ----------\ndef test_url_http():\n    assert kind(\"https://example.com/path?q=1\") == \"url\"\n    assert reason(\"https://example.com\") == \"url\"\n\n\ndef test_url_www():\n    assert kind(\"www.example.co.jp/item/123\") == \"url\"\n\n\ndef test_url_beats_email_like():\n    # Contains '@' but starts with a scheme: URL is checked first.\n    assert kind(\"https://user@example.com/x\") == \"url\"\n\n\n# ---------- Email ----------\ndef test_email():\n    assert kind(\"taro.yamada+tag@example.co.jp\") == \"email\"\n    assert reason(\"a@b.com\") == \"email\"\n\n\ndef test_email_needs_tld():\n    assert kind(\"taro@localhost\") != \"email\"\n\n\n# ---------- Amount ----------\ndef test_amount_symbol():\n    assert kind(\"¥12,800\") == \"amount\"\n    assert reason(\"¥12,800\") == \"amount_symbol\"\n    assert kind(\"$1,234.56\") == \"amount\"\n    assert kind(\"€99\") == \"amount\"\n\n\ndef test_amount_unit():\n    assert kind(\"12,800円\") == \"amount\"\n    assert reason(\"500 USD\") == \"amount_unit\"\n    assert kind(\"3,000ウォン\") == \"amount\"\n\n\ndef test_amount_thousands():\n    assert kind(\"1,234,567\") == \"amount\"\n    assert reason(\"12,345\") == \"amount_thousands\"\n\n\ndef test_plain_small_number_is_not_amount():\n    # A bare number without separators/symbol/unit stays 'other'\n    # (it may be a quantity, a page number, anything).\n    assert kind(\"42\") == \"other\"\n    assert kind(\"2026\") == \"other\"\n\n\n# ---------- Date ----------\ndef test_date_iso():\n    assert kind(\"2026-11-17\") == \"date\"\n    assert kind(\"2026/1/5\") == \"date\"\n\n\ndef test_date_japanese():\n    assert kind(\"2026年11月17日\") == \"date\"\n\n\ndef test_date_dmy():\n    assert kind(\"17/11/2026\") == \"date\"\n    assert kind(\"03-04-2026\") == \"date\"\n\n\ndef test_datetime_and_time():\n    assert kind(\"2026-11-17 09:30\") == \"date\"\n    assert kind(\"09:30\") == \"date\"\n    assert reason(\"09:30:15\") == \"time\"\n\n\ndef test_date_beats_code():\n    # A date-shaped string must not fall into the digit-code rule.\n    assert kind(\"2026-11-17\") == \"date\"\n\n\n# ---------- Address ----------\ndef test_address_japanese():\n    assert kind(\"愛知県名古屋市中村区名駅1丁目1-1\") == \"address\"\n    assert reason(\"東京都新宿区西新宿2-8-1\") == \"address_jp\"\n\n\ndef test_address_japanese_postal():\n    assert kind(\"〒450-0002 愛知県名古屋市中村区名駅1-1\") == \"address\"\n\n\ndef test_address_english():\n    assert kind(\"1600 Amphitheatre Parkway\") != \"address\"  # no street suffix\n    assert kind(\"350 Fifth Avenue\") == \"address\"\n    assert reason(\"12 Main Street\") == \"address_en\"\n\n\ndef test_address_needs_number():\n    # Street word alone without a number is not an address.\n    assert kind(\"Main Street\") != \"address\"\n\n\n# ---------- Code ----------\ndef test_code_mixed():\n    assert kind(\"ABC-1234\") == \"code\"\n    assert reason(\"SKU_9982-X\") == \"code_mixed\"\n    assert kind(\"AB12CD\") == \"code\"\n\n\ndef test_code_digits():\n    assert kind(\"4901234567890\") == \"code\"      # JAN-like 13 digits\n    assert kind(\"090-1234-5678\") == \"code\"      # digit sequence w/ hyphens\n    assert reason(\"4901234\") == \"code_digits\"\n\n\ndef test_code_needs_letter_and_digit():\n    assert kind(\"HELLO\") != \"code\"   # letters only\n    assert kind(\"hello-world\") != \"code\"\n\n\n# ---------- Other / shape guards ----------\ndef test_multiline_is_other():\n    assert kind(\"一行目\\n二行目\") == \"other\"\n    assert reason(\"a\\nb\") == \"multiline\"\n\n\ndef test_long_text_is_other():\n    assert kind(\"あ\" * 600) == \"other\"\n    assert reason(\"x\" * 501) == \"long\"\n\n\ndef test_plain_words_other():\n    assert kind(\"こんにちは\") == \"other\"\n    assert kind(\"会議室A\") == \"other\"  # letter+digit but has non-ASCII char\n    assert kind(\"\") == \"other\"\n    assert kind(\"   \") == \"other\"\n    assert kind(None) == \"other\"\n\n\ndef test_amount_beats_code_for_thousands():\n    # '1,234' has digits and a comma: amount rule runs before code.\n    assert kind(\"1,234\") == \"amount\"\n\n\n# ---------- Sensitive shapes ----------\ndef test_luhn():\n    assert luhn_ok(\"4111111111111111\") is True    # Visa test number\n    assert luhn_ok(\"4111111111111112\") is False\n    assert luhn_ok(\"\") is False\n    assert luhn_ok(\"abcd\") is False\n\n\ndef test_sensitive_card():\n    assert is_sensitive(\"4111 1111 1111 1111\") == \"card\"\n    assert is_sensitive(\"4111-1111-1111-1111\") == \"card\"\n    assert is_sensitive(\"4111111111111111\") == \"card\"\n\n\ndef test_sensitive_not_card_when_luhn_fails():\n    assert is_sensitive(\"4111 1111 1111 1112\") is None\n    assert is_sensitive(\"1234 5678 9012 3456\") is None\n\n\ndef test_sensitive_label():\n    assert is_sensitive(\"password: hunter2\") == \"secret_label\"\n    assert is_sensitive(\"パスワード：abc123\") == \"secret_label\"\n\n\ndef test_sensitive_normal_text():\n    assert is_sensitive(\"https://example.com\") is None\n    assert is_sensitive(\"普通の文章です\") is None\n    assert is_sensitive(None) is None\n"}, {"p": "tests/test_i18n.py", "s": 1046, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"All 13 languages must carry every key, with no empty strings.\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom i18n_data import LANG_ORDER, TRANSLATIONS, t\n\n\ndef test_all_languages_present():\n    assert list(TRANSLATIONS.keys()) == LANG_ORDER\n    assert len(LANG_ORDER) == 13\n\n\ndef test_all_keys_everywhere():\n    base = set(TRANSLATIONS[\"ja\"].keys())\n    assert len(base) >= 60\n    for lang in LANG_ORDER:\n        keys = set(TRANSLATIONS[lang].keys())\n        assert keys == base, (lang, base ^ keys)\n\n\ndef test_no_empty_strings():\n    for lang in LANG_ORDER:\n        for key, val in TRANSLATIONS[lang].items():\n            assert isinstance(val, str) and val.strip(), (lang, key)\n\n\ndef test_format_placeholders():\n    for lang in LANG_ORDER:\n        out = t(lang, \"count_fmt\", count=5)\n        assert \"5\" in out, lang\n\n\ndef test_fallback():\n    assert t(\"xx\", \"tab_all\") == TRANSLATIONS[\"ja\"][\"tab_all\"]\n    assert t(\"ja\", \"no_such_key\") == \"no_such_key\"\n"}, {"p": "tests/test_store.py", "s": 4032, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Tests for the history store: sets, dedup, pin, expiry, persistence.\"\"\"\nimport os\nimport sys\nimport tempfile\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom store import Store\n\nT0 = 1_700_000_000.0\n\n\ndef test_first_add_creates_set():\n    st = Store()\n    item = st.add(\"https://example.com\", \"url\", \"url\", ts=T0)\n    assert item is not None\n    assert len(st.sets) == 1\n    assert item[\"set_id\"] == st.sets[0][\"id\"]\n    assert st.current_set_id == st.sets[0][\"id\"]\n\n\ndef test_consecutive_duplicate_skipped():\n    st = Store()\n    st.add(\"abc\", \"other\", \"other\", ts=T0)\n    assert st.add(\"abc\", \"other\", \"other\", ts=T0 + 10) is None\n    assert len(st.items) == 1\n\n\ndef test_nonconsecutive_duplicate_kept():\n    st = Store()\n    st.add(\"abc\", \"other\", \"other\", ts=T0)\n    st.add(\"xyz\", \"other\", \"other\", ts=T0 + 10)\n    assert st.add(\"abc\", \"other\", \"other\", ts=T0 + 20) is not None\n    assert len(st.items) == 3\n\n\ndef test_gap_starts_new_set():\n    st = Store(gap_seconds=1800)\n    st.add(\"a\", \"other\", \"other\", ts=T0)\n    st.add(\"b\", \"other\", \"other\", ts=T0 + 1799)\n    assert len(st.sets) == 1\n    st.add(\"c\", \"other\", \"other\", ts=T0 + 1799 + 1800)\n    assert len(st.sets) == 2\n    assert st.items[-1][\"set_id\"] == st.sets[1][\"id\"]\n\n\ndef test_manual_set_and_rename():\n    st = Store()\n    st.add(\"a\", \"other\", \"other\", ts=T0)\n    s2 = st.start_set(ts=T0 + 60, name=\"午後の作業\")\n    assert s2[\"name\"] == \"午後の作業\"\n    st.add(\"b\", \"other\", \"other\", ts=T0 + 70)\n    assert st.items[-1][\"set_id\"] == s2[\"id\"]\n    assert st.rename_set(s2[\"id\"], \"請求書の転記\") is True\n    assert st.get_set(s2[\"id\"])[\"name\"] == \"請求書の転記\"\n    assert st.rename_set(\"missing\", \"x\") is False\n\n\ndef test_auto_set_name_is_datetime():\n    st = Store()\n    s = st.start_set(ts=T0)\n    assert len(s[\"name\"]) == 16 and s[\"name\"][4] == \"-\"\n\n\ndef test_delete_and_pin():\n    st = Store()\n    a = st.add(\"a\", \"other\", \"other\", ts=T0)\n    b = st.add(\"b\", \"other\", \"other\", ts=T0 + 1)\n    assert st.set_pinned(a[\"id\"], True) is True\n    assert st.items[0][\"pinned\"] is True\n    assert st.delete_item(b[\"id\"]) is True\n    assert len(st.items) == 1\n    assert st.delete_item(\"missing\") is False\n\n\ndef test_expire_removes_old_unpinned_only():\n    st = Store()\n    old = st.add(\"old\", \"other\", \"other\", ts=T0)\n    pinned = st.add(\"keep\", \"other\", \"other\", ts=T0 + 1)\n    st.set_pinned(pinned[\"id\"], True)\n    st.add(\"new\", \"other\", \"other\", ts=T0 + 100000)\n    removed = st.expire(ttl_seconds=3600, now=T0 + 100000)\n    assert removed == 1\n    texts = [i[\"text\"] for i in st.items]\n    assert texts == [\"keep\", \"new\"]\n    assert old[\"id\"] not in [i[\"id\"] for i in st.items]\n\n\ndef test_expire_none_means_never():\n    st = Store()\n    st.add(\"a\", \"other\", \"other\", ts=T0)\n    assert st.expire(ttl_seconds=None, now=T0 + 10**9) == 0\n    assert len(st.items) == 1\n\n\ndef test_expire_drops_empty_sets():\n    st = Store(gap_seconds=60)\n    st.add(\"a\", \"other\", \"other\", ts=T0)\n    st.add(\"b\", \"other\", \"other\", ts=T0 + 3600)\n    assert len(st.sets) == 2\n    st.expire(ttl_seconds=60, now=T0 + 3600)\n    assert len(st.sets) == 1  # first set became empty and was dropped\n\n\ndef test_clear_all():\n    st = Store()\n    st.add(\"a\", \"other\", \"other\", ts=T0)\n    st.clear_all()\n    assert st.items == [] and st.sets == [] and st.current_set_id is None\n\n\ndef test_save_load_roundtrip():\n    st = Store(gap_seconds=900)\n    st.add(\"https://example.com\", \"url\", \"url\", ts=T0)\n    st.add(\"¥100\", \"amount\", \"amount_symbol\", ts=T0 + 5)\n    with tempfile.TemporaryDirectory() as d:\n        path = os.path.join(d, \"history.json\")\n        st.save(path)\n        st2 = Store.load(path, gap_seconds=900)\n    assert [i[\"text\"] for i in st2.items] == [\"https://example.com\", \"¥100\"]\n    assert st2.current_set_id == st.current_set_id\n    assert len(st2.sets) == 1\n\n\ndef test_load_missing_file_is_empty():\n    st = Store.load(\"/nonexistent/dir/history.json\")\n    assert st.items == [] and st.sets == []\n"}, {"p": "tests/test_theme.py", "s": 4540, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Theme support: both themes complete, settings round-trip, instant\nswitching re-skins the panel, settings dialog carries the theme combo.\nRun with QT_QPA_PLATFORM=offscreen.\"\"\"\nimport json\nimport os\nimport sys\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport app as appmod\nfrom themes import THEMES, get_theme\n\n\ndef test_both_themes_complete():\n    assert set(THEMES) == {\"dark\", \"light\"}\n    for name, th in THEMES.items():\n        assert th[\"qss\"].strip(), name\n        assert set(th[\"kind_colors\"]) == set(appmod.KINDS), name\n        for key in (\"pinned_card_qss\", \"pin_on_color\", \"status_recording\",\n                    \"status_paused\", \"shadow_top\", \"shadow_list\"):\n            assert key in th, (name, key)\n        assert len(th[\"shadow_top\"]) == 4 and len(th[\"shadow_list\"]) == 4\n    # the two themes really are different skins\n    assert THEMES[\"dark\"][\"qss\"] != THEMES[\"light\"][\"qss\"]\n    assert THEMES[\"dark\"][\"kind_colors\"] != THEMES[\"light\"][\"kind_colors\"]\n\n\ndef test_get_theme_fallback():\n    assert get_theme(\"light\") is THEMES[\"light\"]\n    assert get_theme(\"nope\") is THEMES[\"dark\"]\n    assert get_theme(None) is THEMES[\"dark\"]\n\n\ndef test_theme_settings_roundtrip(tmp_path, monkeypatch):\n    monkeypatch.setattr(appmod, \"settings_path\",\n                        lambda: os.path.join(str(tmp_path), \"settings.json\"))\n    s = dict(appmod.DEFAULT_SETTINGS)\n    s[\"theme\"] = \"light\"\n    appmod.save_settings(s)\n    loaded = appmod.load_settings()\n    assert loaded[\"theme\"] == \"light\"\n    # a bogus stored value falls back to dark instead of breaking\n    with open(appmod.settings_path(), \"w\", encoding=\"utf-8\") as f:\n        json.dump({\"theme\": \"rainbow\"}, f)\n    assert appmod.load_settings()[\"theme\"] == \"dark\"\n\n\ndef _make_panel(tmp_path, monkeypatch, theme=None):\n    monkeypatch.setattr(appmod, \"config_dir\", lambda: str(tmp_path))\n    monkeypatch.setattr(appmod, \"settings_path\",\n                        lambda: os.path.join(str(tmp_path), \"settings.json\"))\n    monkeypatch.setattr(appmod, \"history_path\",\n                        lambda: os.path.join(str(tmp_path), \"history.json\"))\n    if theme is not None:\n        with open(appmod.settings_path(), \"w\", encoding=\"utf-8\") as f:\n            json.dump({\"theme\": theme}, f)\n    from PySide6.QtWidgets import QApplication\n    qapp = QApplication.instance() or QApplication([])\n    qapp.setQuitOnLastWindowClosed(False)\n    panel = appmod.Panel(qapp)\n    return qapp, panel\n\n\ndef test_panel_starts_in_saved_theme(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch, theme=\"light\")\n    assert panel.theme is THEMES[\"light\"]\n    panel.quit_app()\n    qapp2, panel2 = _make_panel(tmp_path, monkeypatch, theme=\"dark\")\n    assert panel2.theme is THEMES[\"dark\"]\n    panel2.quit_app()\n\n\ndef test_apply_theme_switches_stylesheet_and_rows(tmp_path, monkeypatch):\n    import time\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    panel.store.add(\"https://a.example\", \"url\", \"url\", ts=time.time())\n    panel.store.add(\"¥3,000\", \"amount\", \"amount_symbol\",\n                    ts=time.time() + 1)\n    panel.refresh_all()\n    panel.settings[\"theme\"] = \"light\"\n    panel.apply_theme()\n    assert panel.theme is THEMES[\"light\"]\n    assert qapp.styleSheet() == THEMES[\"light\"][\"qss\"]\n    # rows were rebuilt under the light theme without losing items\n    assert panel.list.count() >= 2\n    panel.settings[\"theme\"] = \"dark\"\n    panel.apply_theme()\n    assert qapp.styleSheet() == THEMES[\"dark\"][\"qss\"]\n    panel.quit_app()\n\n\ndef test_settings_dialog_theme_combo(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    dlg = appmod.SettingsDialog(panel)\n    assert dlg.theme_combo.count() == 2\n    assert dlg.theme_combo.itemData(0) == \"dark\"\n    assert dlg.theme_combo.itemData(1) == \"light\"\n    dlg.theme_combo.setCurrentIndex(1)\n    s = dict(panel.settings)\n    dlg.apply_to(s)\n    assert s[\"theme\"] == \"light\"\n    dlg.theme_combo.setCurrentIndex(0)\n    dlg.apply_to(s)\n    assert s[\"theme\"] == \"dark\"\n    panel.quit_app()\n\n\ndef test_light_theme_rtl_and_all_languages(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch, theme=\"light\")\n    from i18n_data import LANG_ORDER\n    for lang in LANG_ORDER:\n        panel.settings[\"language\"] = lang\n        panel.retranslate()\n        panel.refresh_all()\n        panel.apply_theme()  # re-skin under every language incl. ar RTL\n    panel.quit_app()\n"}, {"p": "tests/test_ui.py", "s": 6187, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Offscreen UI smoke tests: panel builds, clipboard flow, filtering,\nrobustness against empty / huge / weird input. Run with\nQT_QPA_PLATFORM=offscreen.\"\"\"\nimport os\nimport sys\nimport time\n\nos.environ.setdefault(\"QT_QPA_PLATFORM\", \"offscreen\")\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport app as appmod\n\n\ndef _make_panel(tmp_path, monkeypatch):\n    monkeypatch.setattr(appmod, \"config_dir\",\n                        lambda: str(tmp_path))\n    monkeypatch.setattr(appmod, \"settings_path\",\n                        lambda: os.path.join(str(tmp_path), \"settings.json\"))\n    monkeypatch.setattr(appmod, \"history_path\",\n                        lambda: os.path.join(str(tmp_path), \"history.json\"))\n    from PySide6.QtWidgets import QApplication\n    qapp = QApplication.instance() or QApplication([])\n    qapp.setQuitOnLastWindowClosed(False)\n    panel = appmod.Panel(qapp)\n    return qapp, panel\n\n\ndef test_panel_builds_and_records(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from PySide6.QtWidgets import QApplication\n    QApplication.clipboard().setText(\"https://example.com/test\")\n    qapp.processEvents()\n    assert len(panel.store.items) == 1\n    assert panel.store.items[0][\"kind\"] == \"url\"\n    QApplication.clipboard().setText(\"¥12,800\")\n    qapp.processEvents()\n    assert len(panel.store.items) == 2\n    assert panel.store.items[1][\"kind\"] == \"amount\"\n    panel.quit_app()\n\n\ndef test_sensitive_blocked_by_default(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from PySide6.QtWidgets import QApplication\n    QApplication.clipboard().setText(\"4111 1111 1111 1111\")\n    qapp.processEvents()\n    assert len(panel.store.items) == 0\n    panel.quit_app()\n\n\ndef test_pause_blocks_recording(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from PySide6.QtWidgets import QApplication\n    panel.settings[\"paused\"] = True\n    QApplication.clipboard().setText(\"hello world\")\n    qapp.processEvents()\n    assert len(panel.store.items) == 0\n    panel.quit_app()\n\n\ndef test_robust_inputs(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from PySide6.QtWidgets import QApplication\n    for weird in [\"\", \"   \", \"\\n\\n\", \"🎉\" * 50, \"a\" * 99999,\n                  \"<script>alert(1)<\/script>\", \"\\x00\\x01\", \"日本語　テスト\"]:\n        QApplication.clipboard().setText(weird)\n        qapp.processEvents()\n    # empty/whitespace are skipped; the rest must not crash anything\n    panel.refresh_all()\n    panel.quit_app()\n\n\ndef _rows(panel):\n    \"\"\"(headers, items) among the list rows, via the UserRole marker.\"\"\"\n    from PySide6.QtCore import Qt\n    headers = items = 0\n    for i in range(panel.list.count()):\n        data = panel.list.item(i).data(Qt.UserRole)\n        if data and data[0] == \"header\":\n            headers += 1\n        elif data and data[0] == \"item\":\n            items += 1\n    return headers, items\n\n\ndef test_filter_and_search(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    panel.store.add(\"https://a.example\", \"url\", \"url\", ts=time.time())\n    panel.store.add(\"taro@example.com\", \"email\", \"email\",\n                    ts=time.time() + 1)\n    panel.refresh_all()\n    # one work-set header row + two item rows\n    assert _rows(panel) == (1, 2)\n    panel._set_filter(\"email\")\n    assert _rows(panel) == (1, 1)\n    panel._set_filter(None)\n    panel.search_edit.setText(\"taro@\")\n    panel.refresh_list()\n    assert _rows(panel) == (1, 1)\n    panel.quit_app()\n\n\ndef test_set_headers_group_items(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    now = time.time()\n    panel.store.add(\"https://a.example\", \"url\", \"url\", ts=now)\n    panel.store.start_set()\n    panel.store.add(\"¥3,000\", \"amount\", \"amount_symbol\", ts=now + 1)\n    panel.refresh_all()\n    assert _rows(panel) == (2, 2)  # two sets -> two headers\n    panel.quit_app()\n\n\ndef test_delete_needs_confirmation(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from PySide6.QtWidgets import QMessageBox\n    panel.store.add(\"https://a.example\", \"url\", \"url\", ts=time.time())\n    item_id = panel.store.items[0][\"id\"]\n    # Cancel path: clickedButton() -> None keeps the item.\n    monkeypatch.setattr(QMessageBox, \"exec\", lambda self: 0)\n    monkeypatch.setattr(QMessageBox, \"clickedButton\", lambda self: None)\n    panel.delete_item(item_id)\n    assert len(panel.store.items) == 1\n    # OK path: clickedButton() returns the accept-role button object.\n    sentinel = object()\n    monkeypatch.setattr(QMessageBox, \"addButton\",\n                        lambda self, *a, **k: sentinel)\n    monkeypatch.setattr(QMessageBox, \"clickedButton\",\n                        lambda self: sentinel)\n    panel.delete_item(item_id)\n    assert len(panel.store.items) == 0\n    panel.quit_app()\n\n\ndef test_enter_activation_restores(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from PySide6.QtCore import Qt\n    from PySide6.QtWidgets import QApplication\n    panel.store.add(\"https://enter.example\", \"url\", \"url\",\n                    ts=time.time())\n    panel.refresh_all()\n    for i in range(panel.list.count()):\n        li = panel.list.item(i)\n        if li.data(Qt.UserRole) and li.data(Qt.UserRole)[0] == \"item\":\n            panel._on_item_activated(li)\n            break\n    assert QApplication.clipboard().text() == \"https://enter.example\"\n    panel.quit_app()\n\n\ndef test_detail_dialog_builds(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from PySide6.QtWidgets import QDialog\n    monkeypatch.setattr(QDialog, \"exec\", lambda self: 0)\n    panel.store.add(\"x\" * 500, \"other\", \"long\", ts=time.time())\n    panel.show_detail(panel.store.items[0])  # must not raise / block\n    panel.quit_app()\n\n\ndef test_language_switch_all(tmp_path, monkeypatch):\n    qapp, panel = _make_panel(tmp_path, monkeypatch)\n    from i18n_data import LANG_ORDER\n    for lang in LANG_ORDER:\n        panel.settings[\"language\"] = lang\n        panel.retranslate()\n        panel.refresh_all()\n    panel.quit_app()\n"}, {"p": "themes.py", "s": 17275, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"Visual themes for ClipStock: \"dark\" and \"light\" (2026 refresh).\n\nEach theme provides the full application stylesheet plus the handful of\ncolours that Python code applies directly (kind badges / accent bars,\nthe pinned-row card, the pin star, the status text and the drop\nshadows), so a theme switch re-skins every surface consistently.\n\nTypography: the app bundles the Inter typeface (assets/fonts) and\nprefers it everywhere; the fallback chain keeps native platforms\nlooking right (Segoe UI Variable / Segoe UI on Windows, Hiragino on\nmacOS, Yu Gothic / Noto Sans CJK for Japanese glyphs Inter lacks).\nWeights are used deliberately: 600 for titles and primary actions,\n500 for buttons and row text, 400 for body copy.\n\"\"\"\n\nFONT_FAMILIES = [\n    \"Inter\", \"Segoe UI Variable Text\", \"Segoe UI\", \"Yu Gothic UI\",\n    \"Hiragino Sans\", \"Noto Sans CJK JP\", \"Noto Sans\",\n]\nFONT_FAMILY_QSS = \", \".join('\"%s\"' % f for f in FONT_FAMILIES)\n\nKIND_COLORS_DARK = {\n    \"url\": \"#4FB0F5\", \"email\": \"#B197FC\", \"amount\": \"#FFC53D\",\n    \"date\": \"#3ED598\", \"address\": \"#FF8FBE\", \"code\": \"#38D9C4\",\n    \"other\": \"#A5B4CC\",\n}\n# Deeper, more saturated variants so the badges stay easy to tell apart\n# on a white background (badge text switches to white in this theme).\nKIND_COLORS_LIGHT = {\n    \"url\": \"#0B7CC4\", \"email\": \"#7A4FD0\", \"amount\": \"#CE7A00\",\n    \"date\": \"#0C9B6C\", \"address\": \"#D6337F\", \"code\": \"#0E7C74\",\n    \"other\": \"#64748B\",\n}\n\nQSS_DARK = \"\"\"\nQWidget {\n    color: #EDF0FA; font-size: 10.5pt; font-family: FONTLIST;\n}\nQMainWindow, QWidget#centralRoot {\n    background: qlineargradient(x1:0, y1:0, x2:0, y2:1,\n        stop:0 #181C36, stop:1 #101223);\n}\nQFrame#topCard {\n    background: qlineargradient(x1:0, y1:0, x2:1, y2:1,\n        stop:0 #2F356B, stop:0.55 #252B57, stop:1 #1E2347);\n    border: 1px solid rgba(139, 127, 245, 0.42); border-radius: 16px;\n}\nQLabel#appTitle { font-size: 16pt; font-weight: 600; color: #FFFFFF; }\nQLabel#appSub { color: #A3ACC9; font-size: 9.5pt; }\nQLabel#statusDot { font-size: 10.5pt; font-weight: 600; }\nQLabel#countLabel { color: #8E97B4; font-size: 9.5pt; }\nQLineEdit {\n    background: #1E2242; border: 1px solid rgba(255, 255, 255, 0.10);\n    border-radius: 11px; padding: 8px 12px;\n    selection-background-color: #5A4FD0; selection-color: #FFFFFF;\n}\nQLineEdit:focus { border: 1px solid #8B7FF5; background: #222750; }\nQComboBox {\n    background: #1E2242; border: 1px solid rgba(255, 255, 255, 0.10);\n    border-radius: 11px; padding: 7px 10px; min-width: 90px;\n    selection-background-color: #5A4FD0; selection-color: #FFFFFF;\n}\nQComboBox:focus { border: 1px solid #8B7FF5; }\nQComboBox::drop-down {\n    subcontrol-origin: padding; subcontrol-position: center right;\n    width: 22px; border-left: 1px solid rgba(255, 255, 255, 0.07);\n    border-top-right-radius: 10px; border-bottom-right-radius: 10px;\n    background: rgb لتطبيقات", "to_top": "الصفحة الرئيسية", "dl_zip": "تنزيل الشيفرة المصدرية (ZIP)", "file_list": "الملفات", "copy": "نسخ", "copied": "تم النسخ", "copy_fail": "فشل النسخ", "bin_note": "ملف ثنائي (لا يُعرض)", "lines_unit": "سطر", "version": "الإصدار", "files_unit": "ملفات", "license": "رخصة MIT", "title_fmt": "الشيفرة المصدرية لـ {app} | get-quicknote"}, "id": {"back_list": "← Kembali ke daftar aplikasi", "to_top": "Beranda", "dl_zip": "Unduh kode sumber (ZIP)", "file_list": "File", "copy": "Salin", "copied": "Disalin", "copy_fail": "Gagal menyalin", "bin_note": "File biner (tidak ditampilkan)", "lines_unit": "baris", "version": "Versi", "files_unit": "file", "license": "Lisensi MIT", "title_fmt": "Kode sumber {app} | get-quicknote"}, "ko": {"back_list": "← 앱 목록으로 돌아가기", "to_top": "홈으로", "dl_zip": "소스 코드 다운로드 (ZIP)", "file_list": "파일 목록", "copy": "복사", "copied": "복사했습니다", "copy_fail": "복사에 실패했습니다", "bin_note": "바이너리 파일 (표시되지 않음)", "lines_unit": "행", "version": "버전", "files_unit": "파일", "license": "MIT 라이선스", "title_fmt": "{app} 소스 코드 | get-quicknote"}}</script>
<script>
const FILES = JSON.parse(document.getElementById('filedata').textContent);
const I18N = JSON.parse(document.getElementById('i18ndata').textContent);
const APP_NAME = document.getElementById('appdata').dataset.app;
const APP_VER = document.getElementById('appdata').dataset.ver;
const listEl = document.getElementById('flItems');
const flHeadEl = document.getElementById('flHead');
const fnameEl = document.getElementById('fname');
const finfoEl = document.getElementById('finfo');
const gutterEl = document.getElementById('gutter');
const codeEl = document.getElementById('code');
const scrollEl = document.getElementById('codeScroll');
const copyBtn = document.getElementById('copyBtn');
const metaEl = document.getElementById('metaLine');
let current = -1;
let lang = 'ja';
try {
  const saved = localStorage.getItem('gq-lang');
  if (saved && I18N[saved]) lang = saved;
} catch(e) {}
let T = I18N[lang] || I18N.ja;

function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function lineCount(t){
  if (t.length === 0) return 0;
  const n = t.split('\n').length;
  return t.endsWith('\n') ? n - 1 : n;
}
function renderList(){
  listEl.innerHTML = '';
  FILES.forEach((f, i) => {
    if (f.b) {
      const d = document.createElement('div');
      d.className = 'file-bin';
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      const note = document.createElement('span');
      note.className = 'bin-note'; note.textContent = T.bin_note;
      d.appendChild(name); d.appendChild(sz); d.appendChild(note);
      listEl.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'file-btn'; b.dataset.i = i;
      if (i === current) b.classList.add('active');
      const name = document.createElement('span');
      name.textContent = f.p;
      const sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = fmtSize(f.s);
      b.appendChild(name); b.appendChild(sz);
      b.addEventListener('click', () => show(i));
      listEl.appendChild(b);
    }
  });
}
function show(i){
  const f = FILES[i];
  if (!f || f.b) return;
  current = i;
  document.querySelectorAll('.file-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === i));
  const lc = lineCount(f.c);
  fnameEl.textContent = f.p;
  finfoEl.textContent = lc + ' ' + T.lines_unit + ' ／ ' + fmtSize(f.s);
  let g = '';
  for (let n = 1; n <= lc; n++) g += n + '\n';
  gutterEl.textContent = g;
  codeEl.className = 'hljs language-' + (f.l || 'plaintext');
  codeEl.removeAttribute('data-highlighted');
  codeEl.textContent = f.c;
  if (f.l && f.l !== 'plaintext' && window.hljs) {
    try { hljs.highlightElement(codeEl); } catch(e) {}
  }
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
}
function applyLang(code){
  if (!I18N[code]) code = 'ja';
  lang = code; T = I18N[code];
  document.documentElement.lang = (code === 'zh') ? 'zh-Hans' : code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = T.title_fmt.replace('{app}', APP_NAME);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[k]) el.textContent = T[k];
  });
  metaEl.textContent = T.version + ' ' + APP_VER + ' ／ ' + FILES.length + ' ' + T.files_unit + ' ／ ' + T.license;
  flHeadEl.textContent = T.file_list + ' (' + FILES.length + ')';
  copyBtn.textContent = T.copy;
  renderList();
  if (current >= 0) show(current);
}
copyBtn.addEventListener('click', async () => {
  if (current < 0) return;
  const text = FILES[current].c;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e2) {}
    document.body.removeChild(ta);
  }
  copyBtn.textContent = ok ? T.copied : T.copy_fail;
  copyBtn.classList.toggle('done', ok);
  setTimeout(() => { copyBtn.textContent = T.copy; copyBtn.classList.remove('done'); }, 1600);
});
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gq-theme', next); } catch(e) {}
});
const langSel = document.getElementById('langSel');
langSel.value = lang;
langSel.addEventListener('change', () => {
  try { localStorage.setItem('gq-lang', langSel.value); } catch(e) {}
  applyLang(langSel.value);
});
applyLang(lang);
const init = FILES.findIndex(f => !f.b && f.p === 'app.py');
show(init >= 0 ? init : FILES.findIndex(f => !f.b));
</script>
</body>
</html>
