<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ClipStock のソースコード | get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#0D1526; --surface:#111C33; --surface2:#182747;
  --codebg:#0D1117; --ink:#E8EEF8; --muted:#93A5C4; --faint:#5B6E92; --line:#22314F;
  --line-soft:rgba(34,49,79,.55); --gutter-line:#21262D; --gutter-ink:#484F58;
  --accent:#3B82F6; --accent-strong:#60A5FA; --accent-soft:rgba(59,130,246,.16);
  --active-ink:#FFFFFF;
  --font-body:"Inter","Noto Sans JP",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F8FD; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#E7EFFD;
  --codebg:#FFFFFF; --ink:#0F1B33; --muted:#3B4A66; --faint:#64748B; --line:#DFE7F3;
  --line-soft:#E7EDF6; --gutter-line:#D8DEE4; --gutter-ink:#6E7781;
  --accent:#2563EB; --accent-strong:#1D4ED8; --accent-soft:rgba(37,99,235,.12);
  --active-ink:#1D4ED8;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:var(--accent-strong)}
/* ===== top bar ===== */
.topbar{flex:none;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;
  padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .appname{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .appname .ja{color:var(--muted);font-size:.82em;font-weight:700;margin-left:10px}
.topbar .meta{color:var(--faint);font-size:.85rem;white-space:nowrap}
.topbar .controls{margin-left:auto;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:18px}
.topbar nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
.topbar nav a:hover{color:var(--ink)}
.dlbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.92rem;text-decoration:none;padding:9px 18px;border-radius:999px;
  box-shadow:0 8px 20px -6px rgba(37,99,235,.5);white-space:nowrap}
.dlbtn:hover{filter:brightness(1.12)}
.dlbtn svg{flex:none}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  cursor:pointer;flex:none}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ic-moon{display:none}
:root[data-theme="light"] .themebtn .ic-moon{display:block}
:root[data-theme="light"] .themebtn .ic-sun{display:none}
.langpick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.85rem;font-weight:700;
  line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;cursor:pointer;max-width:190px}
.langpick select:hover{border-color:var(--accent)}
/* ===== main split ===== */
.main{flex:1;display:flex;min-height:0}
.filelist{width:284px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--panel);
  border-right:1px solid var(--line)}
[dir="rtl"] .filelist{border-right:0;border-left:1px solid var(--line)}
.filelist .fl-head{padding:11px 16px;font-weight:800;font-size:.86rem;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.file-btn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);color:var(--ink);
  padding:9px 16px;font-family:var(--font-mono);font-size:.8rem;line-height:1.45;
  text-align:left;cursor:pointer;word-break:break-all}
.file-btn:hover{background:var(--surface2)}
.file-btn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);color:var(--active-ink)}
[dir="rtl"] .file-btn.active{box-shadow:inset -3px 0 0 var(--accent)}
.file-btn .sz{color:var(--faint);font-size:.7rem;flex:none}
.file-bin{padding:9px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);
  font-size:.8rem;line-height:1.45;color:var(--faint);word-break:break-all}
.file-bin .sz{font-size:.7rem;margin-left:8px}
.bin-note{display:block;font-family:var(--font-body);font-size:.72rem;color:#64748B;margin-top:1px}
/* ===== code pane ===== */
.codepane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--codebg)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.toolbar .fname{font-family:var(--font-mono);font-size:.95rem;font-weight:700;word-break:break-all}
.toolbar .finfo{color:var(--muted);font-size:.85rem;white-space:nowrap}
.copybtn{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.88rem;padding:7px 18px;border-radius:999px}
[dir="rtl"] .copybtn{margin-left:0;margin-right:auto}
.copybtn:hover{filter:brightness(1.12)}
.copybtn.done{background:#0E9F6E}
.code-scroll{flex:1;overflow:auto;min-height:0;direction:ltr}
.code-flex{display:flex;min-width:max-content;min-height:100%}
.gutter{flex:none;position:sticky;left:0;z-index:1;background:var(--codebg);
  border-right:1px solid var(--gutter-line);text-align:right;user-select:none;white-space:pre;
  font-family:var(--font-mono);font-size:16px;line-height:1.75;
  padding:16px 12px 24px 18px;color:var(--gutter-ink)}
.code-flex pre.code{flex:1;margin:0;padding:16px 28px 24px 20px;
  font-family:var(--font-mono);font-size:16px;line-height:1.75}
.code-flex pre.code code{font-family:inherit;font-size:inherit;line-height:inherit;
  background:transparent;padding:0;white-space:pre}
/* ===== highlight.js GitHub Dark (default) ===== */
.hljs{color:#E6EDF3;background:#0D1117}
.hljs-doctag,.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-template-variable,
.hljs-template-tag,.hljs-type,.hljs-variable.language_{color:#FF7B72}
.hljs-title,.hljs-title.class_,.hljs-title.class_.inherited__,
.hljs-title.function_{color:#D2A8FF}
.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,
.hljs-variable,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:#79C0FF}
.hljs-regexp,.hljs-string,.hljs-meta .hljs-string{color:#A5D6FF}
.hljs-built_in,.hljs-symbol{color:#FFA657}
.hljs-comment,.hljs-code,.hljs-formula{color:#8B949E}
.hljs-name,.hljs-quote,.hljs-selector-tag,.hljs-selector-pseudo{color:#7EE787}
.hljs-subst{color:#E6EDF3}
.hljs-section{color:#1F6FEB;font-weight:bold}
.hljs-bullet{color:#F2CC60}
.hljs-emphasis{color:#E6EDF3;font-style:italic}
.hljs-strong{color:#E6EDF3;font-weight:bold}
.hljs-addition{color:#AFF5B4;background-color:#033A16}
.hljs-deletion{color:#FFDCD7;background-color:#67060C}
.hljs-char.escape_,.hljs-link,.hljs-params,.hljs-property,.hljs-punctuation,.hljs-tag{/* purposely ignored */}
/* ===== highlight.js GitHub Light ===== */
:root[data-theme="light"] .hljs{color:#24292E;background:#FFFFFF}
:root[data-theme="light"] .hljs-doctag,:root[data-theme="light"] .hljs-keyword,
:root[data-theme="light"] .hljs-meta .hljs-keyword,:root[data-theme="light"] .hljs-template-variable,
:root[data-theme="light"] .hljs-template-tag,:root[data-theme="light"] .hljs-type,
:root[data-theme="light"] .hljs-variable.language_{color:#D73A49}
:root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.class_,
:root[data-theme="light"] .hljs-title.class_.inherited__,
:root[data-theme="light"] .hljs-title.function_{color:#6F42C1}
:root[data-theme="light"] .hljs-attr,:root[data-theme="light"] .hljs-attribute,
:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-meta,
:root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-operator,
:root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-selector-attr,
:root[data-theme="light"] .hljs-selector-class,:root[data-theme="light"] .hljs-selector-id{color:#005CC5}
:root[data-theme="light"] .hljs-regexp,:root[data-theme="light"] .hljs-string,
:root[data-theme="light"] .hljs-meta .hljs-string{color:#032F62}
:root[data-theme="light"] .hljs-built_in,:root[data-theme="light"] .hljs-symbol{color:#E36209}
:root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-code,
:root[data-theme="light"] .hljs-formula{color:#6A737D}
:root[data-theme="light"] .hljs-name,:root[data-theme="light"] .hljs-quote,
:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-selector-pseudo{color:#22863A}
:root[data-theme="light"] .hljs-subst{color:#24292E}
:root[data-theme="light"] .hljs-section{color:#005CC5;font-weight:bold}
:root[data-theme="light"] .hljs-bullet{color:#735C0F}
:root[data-theme="light"] .hljs-emphasis{color:#24292E;font-style:italic}
:root[data-theme="light"] .hljs-strong{color:#24292E;font-weight:bold}
:root[data-theme="light"] .hljs-addition{color:#22863A;background-color:#F0FFF4}
:root[data-theme="light"] .hljs-deletion{color:#B31D28;background-color:#FFEEF0}
@media (max-width:760px){
  .main{flex-direction:column}
  .filelist{width:auto;flex:none;max-height:158px;overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--line)}
  .filelist .fl-head{position:static}
  .filelist .fl-items{display:flex;flex-direction:row;overflow-x:auto}
  .file-btn,.file-bin{flex:none;border-bottom:0;border-right:1px solid var(--line-soft);
    white-space:nowrap;word-break:normal;align-items:center}
  .code-flex pre.code,.gutter{font-size:14.5px}
  .topbar .meta{display:none}
  .langpick select{max-width:140px}
}
</style>

<script type="application/json" id="filedata">[{"p": "app.py", "s": 41051, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"\nClipStock - コピペ履歴・スマートウォッチャー\nClipboard-history resident app.\n\n- Watches the clipboard and stores copied text, auto-classified into\n  kinds (URL / amount / date / address / code / email / other) by\n  deterministic patterns only, each with a human-readable reason.\n- Items are grouped into \"work sets\" (auto-split after a quiet gap,\n  or manually). Open the panel (tray / Ctrl+Shift+V on Windows), pick\n  an item, and it goes back onto the clipboard; pasting itself is\n  always done by the user (Ctrl+V). The app never pastes by itself.\n- History is stored ONLY locally (JSON under the per-user app data\n  folder). No network communication of any kind.\n- Privacy: auto-expiry (default 24h), recording pause, and card-number\n  shaped text (Luhn) is not stored by default.\n- UI in 13 languages with instant switching (i18n_data.py).\n\"\"\"\nimport ctypes\nimport json\nimport os\nimport sys\nimport time\n\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\n\nfrom PySide6.QtCore import Qt, QThread, QTimer, Signal\nfrom PySide6.QtGui import (QAction, QColor, QCursor, QFont, QFontDatabase,\n                           QIcon, QKeySequence, QShortcut)\nfrom PySide6.QtWidgets import (\n    QApplication, QButtonGroup, QCheckBox, QComboBox, QDialog,\n    QDialogButtonBox, QGraphicsDropShadowEffect, QHBoxLayout, QInputDialog,\n    QFrame, QLabel, QLineEdit, QListWidget, QListWidgetItem, QMainWindow,\n    QMenu, QMessageBox, QPlainTextEdit, QPushButton, QSystemTrayIcon,\n    QVBoxLayout, QWidget,\n)\n\nfrom appinfo import APP_ID, APP_NAME_EN, APP_NAME_JA, HOTKEY_LABEL, VERSION\nfrom classifier import classify, is_sensitive\nfrom i18n_data import LANG_NAMES, LANG_ORDER, RTL_LANGS, t\nfrom store import Store\n\nMAX_STORED_TEXT = 100000     # robustness: never store gigantic copies\nMAX_ITEMS = 2000             # housekeeping cap (oldest unpinned dropped)\n\nDEFAULT_SETTINGS = {\n    \"language\": \"ja\",\n    \"expire\": \"24h\",         # 1h / 24h / 7d / 30d / never\n    \"gap_minutes\": 30,       # work-set auto-split gap\n    \"block_sensitive\": True,\n    \"autostart\": False,\n    \"paused\": False,\n    \"theme\": \"dark\",         # dark / light\n}\nEXPIRE_SECONDS = {\"1h\": 3600, \"24h\": 86400, \"7d\": 604800,\n                  \"30d\": 2592000, \"never\": None}\nEXPIRE_KEYS = [(\"1h\", \"expire_1h\"), (\"24h\", \"expire_24h\"), (\"7d\", \"expire_7d\"),\n               (\"30d\", \"expire_30d\"), (\"never\", \"expire_never\")]\nGAP_OPTIONS = [(10, \"gap_10m\"), (30, \"gap_30m\"), (60, \"gap_60m\")]\nKINDS = [\"url\", \"email\", \"amount\", \"date\", \"address\", \"code\", \"other\"]\n\nfrom themes import FONT_FAMILIES, THEMES, get_theme  # noqa: E402\n\nBUNDLED_FONTS = (\"Inter-Regular.ttf\", \"Inter-Medium.ttf\",\n                 \"Inter-SemiBold.ttf\", \"Inter-Bold.ttf\")\n\n\ndef load_app_fonts():\n    \"\"\"Register the bundled Inter typeface (assets/fonts) with Qt.\n\n    Inter covers Latin text and digits with a modern, even look on\n    every platform; glyphs it lacks (e.g. Japanese) fall back through\n    FONT_FAMILIES to the platform's native UI fonts.\n    \"\"\"\n    for name in BUNDLED_FONTS:\n        try:\n            QFontDatabase.addApplicationFont(asset_path(\"fonts/\" + name))\n        except Exception:\n            pass\n\n# Backward-compatible aliases (the dark theme is the original design).\nKIND_COLORS = THEMES[\"dark\"][\"kind_colors\"]\nQSS = THEMES[\"dark\"][\"qss\"]\n\n\ndef config_dir():\n    if sys.platform == \"darwin\":\n        path = os.path.join(os.path.expanduser(\"~\"),\n                            \"Library\", \"Application Support\", APP_ID)\n    else:\n        base = os.environ.get(\"APPDATA\")\n        if base:\n            path = os.path.join(base, APP_ID)\n        else:\n            path = os.path.join(os.path.expanduser(\"~\"), \".\" + APP_ID.lower())\n    os.makedirs(path, exist_ok=True)\n    return path\n\n\ndef settings_path():\n    return os.path.join(config_dir(), \"settings.json\")\n\n\ndef history_path():\n    return os.path.join(config_dir(), \"history.json\")\n\n\ndef load_settings():\n    s = dict(DEFAULT_SETTINGS)\n    try:\n        with open(settings_path(), \"r\", encoding=\"utf-8\") as f:\n            data = json.load(f)\n        s.update({k: v for k, v in data.items() if k in s})\n    except Exception:\n        pass\n    if s[\"language\"] not in LANG_ORDER:\n        s[\"language\"] = \"ja\"\n    if s[\"expire\"] not in EXPIRE_SECONDS:\n        s[\"expire\"] = \"24h\"\n    if s[\"gap_minutes\"] not in (10, 30, 60):\n        s[\"gap_minutes\"] = 30\n    if s[\"theme\"] not in THEMES:\n        s[\"theme\"] = \"dark\"\n    return s\n\n\ndef save_settings(s):\n    try:\n        with open(settings_path(), \"w\", encoding=\"utf-8\") as f:\n            json.dump(s, f, ensure_ascii=False, indent=2)\n    except Exception:\n        pass\n\n\ndef set_autostart(enable):\n    \"\"\"Windows autostart via HKCU Run. No-op elsewhere (the Mac manual\n    explains the manual Login Items route).\"\"\"\n    if sys.platform != \"win32\":\n        return\n    try:\n        import winreg\n        key = winreg.OpenKey(\n            winreg.HKEY_CURRENT_USER,\n            r\"Software\\Microsoft\\Windows\\CurrentVersion\\Run\",\n            0, winreg.KEY_SET_VALUE)\n        if enable:\n            if getattr(sys, \"frozen\", False):\n                cmd = '\"%s\" --tray' % sys.executable\n            else:\n                cmd = '\"%s\" \"%s\" --tray' % (sys.executable,\n                                            os.path.abspath(__file__))\n            winreg.SetValueEx(key, APP_ID, 0, winreg.REG_SZ, cmd)\n        else:\n            try:\n                winreg.DeleteValue(key, APP_ID)\n            except FileNotFoundError:\n                pass\n        winreg.CloseKey(key)\n    except Exception:\n        pass\n\n\ndef asset_path(name):\n    base = os.path.dirname(os.path.abspath(__file__))\n    p = os.path.join(base, \"assets\", name)\n    if os.path.exists(p):\n        return p\n    meipass = getattr(sys, \"_MEIPASS\", None)\n    if meipass:\n        p2 = os.path.join(meipass, \"assets\", name)\n        if os.path.exists(p2):\n            return p2\n    return p\n\n\n# ----------------------------------------------------------------------\n# Windows global hotkey (Ctrl+Shift+V) via RegisterHotKey.\n# ----------------------------------------------------------------------\nclass _MSG(ctypes.Structure):\n    _fields_ = [(\"hwnd\", ctypes.c_void_p), (\"message\", ctypes.c_uint),\n                (\"wParam\", ctypes.c_size_t), (\"lParam\", ctypes.c_ssize_t),\n                (\"time\", ctypes.c_uint), (\"pt_x\", ctypes.c_long),\n                (\"pt_y\", ctypes.c_long)]\n\n\nclass HotkeyThread(QThread):\n    \"\"\"Global hotkey (Ctrl+Shift+V) on a dedicated worker thread (Windows).\n\n    The hotkey is registered on this thread and its Win32 message loop runs\n    here, so the GUI thread's Qt event dispatcher never touches raw native\n    messages. (An earlier design used QAbstractNativeEventFilter +\n    RegisterHotKey on the GUI thread; under Wine that destabilised the Qt\n    event loop within seconds — page fault inside Qt6Core — so it was\n    replaced with this thread-based design.)\n    \"\"\"\n\n    triggered = Signal()\n    HOTKEY_ID = 0xC57C\n    WM_HOTKEY = 0x0312\n    WM_QUIT = 0x0012\n\n    def __init__(self, parent=None):\n        super().__init__(parent)\n        self.registered = False\n        self._tid = None\n\n    def run(self):\n        if sys.platform != \"win32\":\n            return\n        try:\n            user32 = ctypes.windll.user32\n            kernel32 = ctypes.windll.kernel32\n            self._tid = kernel32.GetCurrentThreadId()\n            MOD_CONTROL, MOD_SHIFT, VK_V = 0x0002, 0x0004, 0x56\n            if not user32.RegisterHotKey(None, self.HOTKEY_ID,\n                                         MOD_CONTROL | MOD_SHIFT, VK_V):\n                return\n            self.registered = True\n            msg = _MSG()\n            while True:\n                ret = user32.GetMessageW(ctypes.byref(msg), None, 0, 0)\n                if ret <= 0:\n                    break\n                if msg.message == self.WM_HOTKEY and msg.wParam == self.HOTKEY_ID:\n                    self.triggered.emit()\n            user32.UnregisterHotKey(None, self.HOTKEY_ID)\n            self.registered = False\n        except Exception:\n            self.registered = False\n\n    def stop(self):\n        if self._tid:\n            try:\n                ctypes.windll.user32.PostThreadMessageW(\n                    self._tid, self.WM_QUIT, 0, 0)\n            except Exception:\n                pass\n        self.wait(2000)\n\n\n\nclass ItemRow(QWidget):\n    \"\"\"One history row: accent bar, kind badge, excerpt, meta, actions.\n\n    Pinned items are unmistakable: gold accent bar, warm-tinted card and\n    a filled \"pinned\" badge next to the gold star.\n    \"\"\"\n\n    def __init__(self, panel, item):\n        super().__init__()\n        self.setObjectName(\"rowCard\")\n        self.panel = panel\n        self.item = item\n        theme = panel.theme\n        if item[\"pinned\"]:\n            self.setStyleSheet(theme[\"pinned_card_qss\"])\n        lay = QHBoxLayout(self)\n        lay.setContentsMargins(10, 8, 9, 8)\n        lay.setSpacing(9)\n\n        def _grad(hex_color):\n            c = QColor(hex_color)\n            return (\"background: qlineargradient(x1:0, y1:0, x2:0, y2:1, \"\n                    \"stop:0 %s, stop:1 %s);\" % (c.lighter(118).name(),\n                                               c.darker(106).name()))\n\n        bar = QLabel()\n        bar.setFixedWidth(4)\n        bar_color = theme[\"pin_bar\"] if item[\"pinned\"] else theme[\n            \"kind_colors\"].get(item[\"kind\"], \"#94A3B8\")\n        bar.setStyleSheet(_grad(bar_color) + \" border-radius:2px;\")\n        lay.addWidget(bar)\n\n        chip = QLabel(panel.tt(\"kind_\" + item[\"kind\"]))\n        chip.setObjectName(\"kindChip\")\n        chip.setStyleSheet(_grad(theme[\"kind_colors\"].get(\n            item[\"kind\"], \"#94A3B8\")))\n        chip.setAlignment(Qt.AlignCenter)\n        chip.setMinimumWidth(58)\n        lay.addWidget(chip, 0, Qt.AlignTop)\n\n        mid = QVBoxLayout()\n        mid.setSpacing(1)\n        preview = \" \".join(item[\"text\"].split())\n        if len(preview) > 95:\n            preview = preview[:95] + \"…\"\n        text_label = QLabel(preview)\n        text_label.setObjectName(\"rowText\")\n        text_label.setToolTip(item[\"text\"][:2000])\n        mid.addWidget(text_label)\n        lt = time.localtime(item[\"ts\"])\n        meta = QLabel(\"%s  ·  %s\" % (\n            time.strftime(\"%m/%d %H:%M\", lt),\n            panel.tt(\"reason_\" + item[\"reason\"])))\n        meta.setObjectName(\"rowMeta\")\n        mid.addWidget(meta)\n        lay.addLayout(mid, 1)\n\n        if item[\"pinned\"]:\n            badge = QLabel(panel.tt(\"pinned_badge\"))\n            badge.setObjectName(\"pinnedBadge\")\n            lay.addWidget(badge, 0, Qt.AlignTop)\n\n        pin_btn = QPushButton(\"★\" if item[\"pinned\"] else \"☆\")\n        pin_btn.setObjectName(\"miniBtn\")\n        pin_btn.setProperty(\"class\", \"miniBtn\")\n        pin_btn.setToolTip(panel.tt(\"unpin\" if item[\"pinned\"] else \"pin\"))\n        if item[\"pinned\"]:\n            pin_btn.setStyleSheet(\n                \"color:%s;\" % theme[\"pin_on_color\"])\n        pin_btn.clicked.connect(\n            lambda _=False, iid=item[\"id\"]: panel.toggle_pin(iid))\n        lay.addWidget(pin_btn, 0, Qt.AlignTop)\n\n        del_btn = QPushButton(\"×\")\n        del_btn.setProperty(\"class\", \"miniBtn\")\n        del_btn.setToolTip(panel.tt(\"delete_item\"))\n        del_btn.clicked.connect(\n            lambda _=False, iid=item[\"id\"]: panel.delete_item(iid))\n        lay.addWidget(del_btn, 0, Qt.AlignTop)\n\n\nclass SetHeader(QWidget):\n    \"\"\"Divider row in the list: work-set name, its time span, item count.\"\"\"\n\n    def __init__(self, panel, name, span_text, count):\n        super().__init__()\n        self.setObjectName(\"setHeader\")\n        lay = QHBoxLayout(self)\n        lay.setContentsMargins(11, 5, 11, 5)\n        lay.setSpacing(8)\n        dot = QLabel()\n        dot.setFixedSize(8, 8)\n        dot.setStyleSheet(\"background:#7C6FF0; border-radius:4px;\")\n        lay.addWidget(dot)\n        title = QLabel(name)\n        title.setObjectName(\"setHeaderTitle\")\n        lay.addWidget(title)\n        lay.addStretch(1)\n        meta = QLabel(\"%s · %s\" % (span_text,\n                                   panel.tt(\"count_fmt\", count=count)))\n        meta.setObjectName(\"setHeaderMeta\")\n        lay.addWidget(meta)\n\n\nclass SettingsDialog(QDialog):\n    def __init__(self, panel):\n        super().__init__(panel)\n        self.panel = panel\n        self.setWindowTitle(panel.tt(\"settings_title\"))\n        self.setMinimumWidth(430)\n        lay = QVBoxLayout(self)\n        lay.setSpacing(11)\n        lay.setContentsMargins(18, 16, 18, 16)\n        s = panel.settings\n\n        def row(label_key, widget):\n            r = QHBoxLayout()\n            lab = QLabel(panel.tt(label_key))\n            lab.setMinimumWidth(170)\n            r.addWidget(lab)\n            r.addWidget(widget, 1)\n            lay.addLayout(r)\n\n        self.lang_combo = QComboBox()\n        for code in LANG_ORDER:\n            self.lang_combo.addItem(LANG_NAMES[code], code)\n        self.lang_combo.setCurrentIndex(LANG_ORDER.index(s[\"language\"]))\n        row(\"language_label\", self.lang_combo)\n\n        self.theme_combo = QComboBox()\n        self.theme_combo.addItem(panel.tt(\"theme_dark\"), \"dark\")\n        self.theme_combo.addItem(panel.tt(\"theme_light\"), \"light\")\n        self.theme_combo.setCurrentIndex(\n            1 if s.get(\"theme\", \"dark\") == \"light\" else 0)\n        row(\"theme_label\", self.theme_combo)\n\n        self.expire_combo = QComboBox()\n        for value, key in EXPIRE_KEYS:\n            self.expire_combo.addItem(panel.tt(key), value)\n        idx = [v for v, _ in EXPIRE_KEYS].index(s[\"expire\"])\n        self.expire_combo.setCurrentIndex(idx)\n        row(\"expire_label\", self.expire_combo)\n\n        self.gap_combo = QComboBox()\n        for value, key in GAP_OPTIONS:\n            self.gap_combo.addItem(panel.tt(key), value)\n        idx = [v for v, _ in GAP_OPTIONS].index(s[\"gap_minutes\"])\n        self.gap_combo.setCurrentIndex(idx)\n        row(\"gap_label\", self.gap_combo)\n\n        self.block_cb = QCheckBox(panel.tt(\"block_sensitive_label\"))\n        self.block_cb.setChecked(bool(s[\"block_sensitive\"]))\n        lay.addWidget(self.block_cb)\n\n        self.pause_cb = QCheckBox(panel.tt(\"pause_label\"))\n        self.pause_cb.setChecked(bool(s[\"paused\"]))\n        lay.addWidget(self.pause_cb)\n\n        self.autostart_cb = None\n        if sys.platform == \"win32\":\n            self.autostart_cb = QCheckBox(panel.tt(\"autostart_label\"))\n            self.autostart_cb.setChecked(bool(s[\"autostart\"]))\n            lay.addWidget(self.autostart_cb)\n\n        note = QLabel(panel.tt(\"privacy_note\"))\n        note.setObjectName(\"noteBox\")\n        note.setWordWrap(True)\n        lay.addWidget(note)\n\n        buttons = QDialogButtonBox(QDialogButtonBox.Ok | QDialogButtonBox.Cancel)\n        buttons.button(QDialogButtonBox.Ok).setText(panel.tt(\"ok\"))\n        buttons.button(QDialogButtonBox.Cancel).setText(panel.tt(\"cancel\"))\n        buttons.accepted.connect(self.accept)\n        buttons.rejected.connect(self.reject)\n        lay.addWidget(buttons)\n\n    def apply_to(self, settings):\n        settings[\"language\"] = self.lang_combo.currentData()\n        settings[\"theme\"] = self.theme_combo.currentData()\n        settings[\"expire\"] = self.expire_combo.currentData()\n        settings[\"gap_minutes\"] = self.gap_combo.currentData()\n        settings[\"block_sensitive\"] = self.block_cb.isChecked()\n        settings[\"paused\"] = self.pause_cb.isChecked()\n        if self.autostart_cb is not None:\n            settings[\"autostart\"] = self.autostart_cb.isChecked()\n        return settings\n\n\nclass Panel(QMainWindow):\n    def __init__(self, app):\n        super().__init__()\n        self.app_ref = app\n        self.first_run = not os.path.exists(settings_path())\n        self.settings = load_settings()\n        self.store = Store.load(history_path(),\n                                gap_seconds=self.settings[\"gap_minutes\"] * 60)\n        self.lang = self.settings[\"language\"]\n        self.theme = get_theme(self.settings[\"theme\"])\n        self._setting_clipboard = False\n        self._last_block_notice = 0.0\n        self._filter_kind = None       # None = all kinds\n        self._selected_set = None      # None = all sets\n        self._save_timer = QTimer(self)\n        self._save_timer.setSingleShot(True)\n        self._save_timer.timeout.connect(self._save_now)\n        self._search_timer = QTimer(self)\n        self._search_timer.setSingleShot(True)\n        self._search_timer.timeout.connect(self.refresh_list)\n\n        self.setWindowTitle(\"%s - %s\" % (APP_NAME_EN, APP_NAME_JA))\n        self.setWindowIcon(QIcon(asset_path(\"icon.png\")))\n        self.resize(600, 660)\n        self.setMinimumSize(480, 520)\n        self._build_ui()\n        self.tray = None\n        self.retranslate()\n        self._run_expire()\n        self.refresh_all()\n\n        clipboard = QApplication.clipboard()\n        clipboard.dataChanged.connect(self.on_clipboard_changed)\n        expire_timer = QTimer(self)\n        expire_timer.timeout.connect(self._run_expire)\n        expire_timer.start(10 * 60 * 1000)\n        self._expire_timer = expire_timer\n\n        self.hotkey = HotkeyThread(self)\n        self.hotkey.triggered.connect(self.toggle_panel)\n        if sys.platform == \"win32\":\n            # Start the tray icon and the global hotkey a few seconds\n            # after launch: creating them inside the first moments of\n            # process startup proved fragile under Wine (intermittent\n            # Qt6Core page fault at startup), and a short delay is\n            # invisible in normal use.\n            QTimer.singleShot(2500, self._build_tray)\n            QTimer.singleShot(4000, self.hotkey.start)\n\n    # ---------- helpers ----------\n    def tt(self, key, **kw):\n        return t(self.lang, key, **kw)\n\n    def _save_soon(self):\n        self._save_timer.start(400)\n\n    def _save_now(self):\n        try:\n            self.store.save(history_path())\n        except Exception:\n            pass\n        save_settings(self.settings)\n\n    def _run_expire(self):\n        ttl = EXPIRE_SECONDS.get(self.settings[\"expire\"])\n        try:\n            removed = self.store.expire(ttl)\n        except Exception:\n            removed = 0\n        if removed:\n            self._save_soon()\n            self.refresh_all()\n\n    def _housekeep(self):\n        # Cap total items so the JSON and the panel stay light forever.\n        if len(self.store.items) > MAX_ITEMS:\n            excess = len(self.store.items) - MAX_ITEMS\n            kept = []\n            for i in self.store.items:\n                if excess > 0 and not i[\"pinned\"]:\n                    excess -= 1\n                    continue\n                kept.append(i)\n            self.store.items = kept\n\n    # ---------- UI ----------\n    def _build_ui(self):\n        central = QWidget()\n        central.setObjectName(\"centralRoot\")\n        self.setCentralWidget(central)\n        root = QVBoxLayout(central)\n        root.setContentsMargins(16, 14, 16, 14)\n        root.setSpacing(10)\n\n        # Sticky control card: title, search and filters stay pinned at\n        # the top while only the history list scrolls underneath.\n        top = QFrame()\n        top.setObjectName(\"topCard\")\n        shadow = QGraphicsDropShadowEffect(top)\n        shadow.setBlurRadius(self.theme[\"shadow_top_blur\"])\n        shadow.setOffset(0, self.theme[\"shadow_top_dy\"])\n        shadow.setColor(QColor(*self.theme[\"shadow_top\"]))\n        top.setGraphicsEffect(shadow)\n        self._top_shadow = shadow\n        top_lay = QVBoxLayout(top)\n        top_lay.setContentsMargins(13, 11, 13, 11)\n        top_lay.setSpacing(8)\n\n        head = QHBoxLayout()\n        icon_lab = QLabel()\n        pix = QIcon(asset_path(\"icon.png\")).pixmap(40, 40)\n        icon_lab.setPixmap(pix)\n        head.addWidget(icon_lab)\n        titles = QVBoxLayout()\n        titles.setSpacing(0)\n        self.title_label = QLabel(APP_NAME_EN)\n        self.title_label.setObjectName(\"appTitle\")\n        titles.addWidget(self.title_label)\n        self.sub_label = QLabel()\n        self.sub_label.setObjectName(\"appSub\")\n        self.sub_label.setWordWrap(True)\n        titles.addWidget(self.sub_label)\n        head.addLayout(titles, 1)\n        self.status_label = QLabel()\n        self.status_label.setObjectName(\"statusDot\")\n        head.addWidget(self.status_label)\n        top_lay.addLayout(head)\n\n        self.search_edit = QLineEdit()\n        self.search_edit.textChanged.connect(\n            lambda _s: self._search_timer.start(120))\n        top_lay.addWidget(self.search_edit)\n\n        chips = QHBoxLayout()\n        chips.setSpacing(6)\n        self.chip_group = QButtonGroup(self)\n        self.chip_group.setExclusive(True)\n        self.chip_buttons = {}\n        all_btn = QPushButton()\n        all_btn.setProperty(\"class\", \"chip\")\n        all_btn.setCheckable(True)\n        all_btn.setChecked(True)\n        all_btn.clicked.connect(lambda: self._set_filter(None))\n        self.chip_group.addButton(all_btn)\n        chips.addWidget(all_btn)\n        self.chip_buttons[None] = all_btn\n        for kind in KINDS:\n            b = QPushButton()\n            b.setProperty(\"class\", \"chip\")\n            b.setCheckable(True)\n            b.clicked.connect(lambda _=False, k=kind: self._set_filter(k))\n            self.chip_group.addButton(b)\n            chips.addWidget(b)\n            self.chip_buttons[kind] = b\n        chips.addStretch(1)\n        top_lay.addLayout(chips)\n\n        set_row = QHBoxLayout()\n        self.set_label = QLabel()\n        set_row.addWidget(self.set_label)\n        self.set_combo = QComboBox()\n        self.set_combo.currentIndexChanged.connect(self._on_set_changed)\n        set_row.addWidget(self.set_combo, 1)\n        self.new_set_btn = QPushButton()\n        self.new_set_btn.setObjectName(\"accentBtn\")\n        self.new_set_btn.clicked.connect(self.start_new_set)\n        set_row.addWidget(self.new_set_btn)\n        self.rename_btn = QPushButton()\n        self.rename_btn.clicked.connect(self.rename_current_set)\n        set_row.addWidget(self.rename_btn)\n        top_lay.addLayout(set_row)\n        root.addWidget(top)\n\n        self.list = QListWidget()\n        list_shadow = QGraphicsDropShadowEffect(self.list)\n        list_shadow.setBlurRadius(self.theme[\"shadow_list_blur\"])\n        list_shadow.setOffset(0, self.theme[\"shadow_list_dy\"])\n        list_shadow.setColor(QColor(*self.theme[\"shadow_list\"]))\n        self.list.setGraphicsEffect(list_shadow)\n        self._list_shadow = list_shadow\n        self.list.setUniformItemSizes(False)\n        self.list.itemClicked.connect(self._on_item_activated)\n        self.list.itemActivated.connect(self._on_item_activated)\n        self.list.itemDoubleClicked.connect(self._on_item_double_clicked)\n        root.addWidget(self.list, 1)\n        esc = QShortcut(QKeySequence(\"Esc\"), self)\n        esc.activated.connect(self.hide)\n        self.empty_label = QLabel()\n        self.empty_label.setObjectName(\"countLabel\")\n        self.empty_label.setAlignment(Qt.AlignCenter)\n        self.empty_label.setWordWrap(True)\n        root.addWidget(self.empty_label)\n\n        foot = QHBoxLayout()\n        self.count_label = QLabel()\n        self.count_label.setObjectName(\"countLabel\")\n        foot.addWidget(self.count_label)\n        foot.addStretch(1)\n        self.pause_btn = QPushButton()\n        self.pause_btn.clicked.connect(self.toggle_pause)\n        foot.addWidget(self.pause_btn)\n        self.clear_btn = QPushButton()\n        self.clear_btn.setObjectName(\"dangerBtn\")\n        self.clear_btn.clicked.connect(self.clear_all)\n        foot.addWidget(self.clear_btn)\n        self.settings_btn = QPushButton()\n        self.settings_btn.clicked.connect(self.open_settings)\n        foot.addWidget(self.settings_btn)\n        root.addLayout(foot)\n\n        self.hotkey_label = QLabel()\n        self.hotkey_label.setObjectName(\"countLabel\")\n        root.addWidget(self.hotkey_label)\n\n    def _build_tray(self):\n        self.tray = None\n        if not QSystemTrayIcon.isSystemTrayAvailable():\n            return\n        self.tray = QSystemTrayIcon(QIcon(asset_path(\"icon.png\")), self)\n        self.tray.setToolTip(APP_NAME_EN)\n        menu = QMenu()\n        self.act_open = QAction(self)\n        self.act_open.triggered.connect(self.show_panel)\n        menu.addAction(self.act_open)\n        self.act_pause = QAction(self)\n        self.act_pause.triggered.connect(self.toggle_pause)\n        menu.addAction(self.act_pause)\n        self.act_new_set = QAction(self)\n        self.act_new_set.triggered.connect(self.start_new_set)\n        menu.addAction(self.act_new_set)\n        menu.addSeparator()\n        self.act_settings = QAction(self)\n        self.act_settings.triggered.connect(self.open_settings)\n        menu.addAction(self.act_settings)\n        self.act_about = QAction(self)\n        self.act_about.triggered.connect(self.show_about)\n        menu.addAction(self.act_about)\n        menu.addSeparator()\n        self.act_quit = QAction(self)\n        self.act_quit.triggered.connect(self.quit_app)\n        menu.addAction(self.act_quit)\n        self.tray.setContextMenu(menu)\n        self.tray.activated.connect(self._on_tray_activated)\n        self.tray.show()\n        self.retranslate()\n\n    def _on_tray_activated(self, reason):\n        if reason in (QSystemTrayIcon.Trigger, QSystemTrayIcon.DoubleClick):\n            self.toggle_panel()\n\n    # ---------- theme ----------\n    def apply_theme(self):\n        \"\"\"Re-skin the whole app for settings[\"theme\"], instantly.\n\n        Swaps the application stylesheet, re-colours the drop shadows\n        and the status text, and rebuilds the history rows so the kind\n        badges / accent bars pick up the new theme's colours.\n        \"\"\"\n        self.theme = get_theme(self.settings.get(\"theme\", \"dark\"))\n        self.app_ref.setStyleSheet(self.theme[\"qss\"])\n        if hasattr(self, \"_top_shadow\"):\n            self._top_shadow.setColor(QColor(*self.theme[\"shadow_top\"]))\n            self._top_shadow.setBlurRadius(self.theme[\"shadow_top_blur\"])\n            self._top_shadow.setOffset(0, self.theme[\"shadow_top_dy\"])\n            self._list_shadow.setColor(QColor(*self.theme[\"shadow_list\"]))\n            self._list_shadow.setBlurRadius(self.theme[\"shadow_list_blur\"])\n            self._list_shadow.setOffset(0, self.theme[\"shadow_list_dy\"])\n        self._update_status()\n        self.refresh_list()\n\n    # ---------- texts ----------\n    def retranslate(self):\n        self.lang = self.settings[\"language\"]\n        rtl = self.lang in RTL_LANGS\n        self.app_ref.setLayoutDirection(\n            Qt.RightToLeft if rtl else Qt.LeftToRight)\n        self.sub_label.setText(self.tt(\"app_subtitle\"))\n        self.search_edit.setPlaceholderText(self.tt(\"search_placeholder\"))\n        self.chip_buttons[None].setText(self.tt(\"tab_all\"))\n        for kind in KINDS:\n            self.chip_buttons[kind].setText(self.tt(\"kind_\" + kind))\n        self.set_label.setText(self.tt(\"set_label\"))\n        self.new_set_btn.setText(self.tt(\"new_set\"))\n        self.rename_btn.setText(self.tt(\"rename\"))\n        self.clear_btn.setText(self.tt(\"clear_all\"))\n        self.settings_btn.setText(self.tt(\"settings\"))\n        if sys.platform == \"win32\":\n            self.hotkey_label.setText(\"%s · %s\" % (\n                self.tt(\"hotkey_hint\"), self.tt(\"kb_hint\")))\n        else:\n            self.hotkey_label.setText(self.tt(\"kb_hint\"))\n        self._update_status()\n        if self.tray is not None:\n            self.act_open.setText(self.tt(\"tray_open\"))\n            self.act_pause.setText(\n                self.tt(\"tray_resume\" if self.settings[\"paused\"]\n                        else \"tray_pause\"))\n            self.act_new_set.setText(self.tt(\"tray_new_set\"))\n            self.act_settings.setText(self.tt(\"tray_settings\"))\n            self.act_about.setText(self.tt(\"about\"))\n            self.act_quit.setText(self.tt(\"tray_quit\"))\n\n    def _update_status(self):\n        paused = self.settings[\"paused\"]\n        self.status_label.setText(\n            \"⏸ %s\" % self.tt(\"status_paused\") if paused\n            else \"● %s\" % self.tt(\"status_recording\"))\n        self.status_label.setStyleSheet(\n            \"color:%s;\" % (self.theme[\"status_paused\"] if paused\n                           else self.theme[\"status_recording\"]))\n        self.pause_btn.setText(\n            self.tt(\"tray_resume\" if paused else \"tray_pause\"))\n\n    # ---------- list / filtering ----------\n    def _set_filter(self, kind):\n        self._filter_kind = kind\n        self.refresh_list()\n\n    def _on_set_changed(self, _idx):\n        self._selected_set = self.set_combo.currentData()\n        self.refresh_list()\n\n    def refresh_all(self):\n        self._refresh_set_combo()\n        self.refresh_list()\n\n    def _refresh_set_combo(self):\n        current = self._selected_set\n        self.set_combo.blockSignals(True)\n        self.set_combo.clear()\n        self.set_combo.addItem(self.tt(\"all_sets\"), None)\n        for s in reversed(self.store.sets):\n            n = len(self.store.items_in_set(s[\"id\"]))\n            self.set_combo.addItem(\"%s (%d)\" % (s[\"name\"], n), s[\"id\"])\n        idx = 0\n        if current is not None:\n            for i in range(self.set_combo.count()):\n                if self.set_combo.itemData(i) == current:\n                    idx = i\n                    break\n            else:\n                self._selected_set = None\n        self.set_combo.setCurrentIndex(idx)\n        self.set_combo.blockSignals(False)\n        self.rename_btn.setEnabled(self._selected_set is not None)\n\n    def _visible_items(self):\n        query = self.search_edit.text().strip().lower()\n        out = []\n        for item in reversed(self.store.items):\n            if self._selected_set is not None \\\n                    and item[\"set_id\"] != self._selected_set:\n                continue\n            if self._filter_kind is not None \\\n                    and item[\"kind\"] != self._filter_kind:\n                continue\n            if query and query not in item[\"text\"].lower():\n                continue\n            out.append(item)\n        return out\n\n    def refresh_list(self):\n        items = self._visible_items()\n        self.list.clear()\n        # Group consecutive items under a work-set header (name, time\n        # span, count) so the panel reads as time-ordered work blocks.\n        groups = []\n        for item in items:\n            if groups and groups[-1][0] == item[\"set_id\"]:\n                groups[-1][1].append(item)\n            else:\n                groups.append((item[\"set_id\"], [item]))\n        for set_id, group_items in groups:\n            s = self.store.get_set(set_id)\n            name = s[\"name\"] if s else \"\"\n            first = time.localtime(group_items[-1][\"ts\"])\n            last = time.localtime(group_items[0][\"ts\"])\n            if time.strftime(\"%m/%d\", first) == time.strftime(\"%m/%d\", last):\n                span = \"%s %s–%s\" % (\n                    time.strftime(\"%m/%d\", last),\n                    time.strftime(\"%H:%M\", first),\n                    time.strftime(\"%H:%M\", last))\n            else:\n                span = \"%s – %s\" % (\n                    time.strftime(\"%m/%d %H:%M\", first),\n                    time.strftime(\"%m/%d %H:%M\", last))\n            header = SetHeader(self, name, span, len(group_items))\n            li = QListWidgetItem()\n            li.setData(Qt.UserRole, (\"header\", set_id))\n            li.setFlags(Qt.ItemIsEnabled)  # not selectable: keys skip it\n            li.setSizeHint(header.sizeHint())\n            self.list.addItem(li)\n            self.list.setItemWidget(li, header)\n            for item in group_items:\n                li = QListWidgetItem()\n                li.setData(Qt.UserRole, (\"item\", item[\"id\"]))\n                row = ItemRow(self, item)\n                li.setSizeHint(row.sizeHint())\n                self.list.addItem(li)\n                self.list.setItemWidget(li, row)\n        self.count_label.setText(self.tt(\"count_fmt\", count=len(items)))\n        self.empty_label.setText(\n            self.tt(\"empty_label\") if not self.store.items else \"\")\n        self.empty_label.setVisible(not self.store.items)\n\n    # ---------- actions ----------\n    def _item_from_list_item(self, li):\n        if li is None:\n            return None\n        data = li.data(Qt.UserRole)\n        if not data or data[0] != \"item\":\n            return None\n        for item in self.store.items:\n            if item[\"id\"] == data[1]:\n                return item\n        return None\n\n    def _on_item_activated(self, li):\n        item = self._item_from_list_item(li)\n        if item is not None:\n            self.restore_item(item)\n\n    def _on_item_double_clicked(self, li):\n        item = self._item_from_list_item(li)\n        if item is not None:\n            self.show_detail(item)\n\n    def show_detail(self, item):\n        dlg = QDialog(self)\n        dlg.setWindowTitle(self.tt(\"detail_title\"))\n        dlg.resize(520, 340)\n        lay = QVBoxLayout(dlg)\n        lay.setContentsMargins(16, 14, 16, 14)\n        lay.setSpacing(10)\n        lt = time.localtime(item[\"ts\"])\n        meta = QLabel(\"%s · %s · %s\" % (\n            self.tt(\"kind_\" + item[\"kind\"]),\n            time.strftime(\"%Y/%m/%d %H:%M\", lt),\n            self.tt(\"reason_\" + item[\"reason\"])))\n        meta.setObjectName(\"rowMeta\")\n        lay.addWidget(meta)\n        body = QPlainTextEdit()\n        body.setReadOnly(True)\n        body.setPlainText(item[\"text\"])\n        lay.addWidget(body, 1)\n        btn_row = QHBoxLayout()\n        btn_row.addStretch(1)\n        restore_btn = QPushButton(self.tt(\"restore_btn\"))\n        restore_btn.setObjectName(\"accentBtn\")\n        restore_btn.clicked.connect(\n            lambda: (dlg.accept(), self.restore_item(item)))\n        btn_row.addWidget(restore_btn)\n        close_btn = QPushButton(self.tt(\"ok\"))\n        close_btn.clicked.connect(dlg.accept)\n        btn_row.addWidget(close_btn)\n        lay.addLayout(btn_row)\n        dlg.exec()\n\n    def restore_item(self, item):\n        self._setting_clipboard = True\n        try:\n            QApplication.clipboard().setText(item[\"text\"])\n        except Exception:\n            self._setting_clipboard = False\n            return\n        QTimer.singleShot(600, self._clear_clipboard_flag)\n        self.hide()\n        if self.tray is not None:\n            self.tray.showMessage(APP_NAME_EN, self.tt(\"restored_hint\"),\n                                  QSystemTrayIcon.Information, 1600)\n\n    def _clear_clipboard_flag(self):\n        self._setting_clipboard = False\n\n    def toggle_pin(self, item_id):\n        for i in self.store.items:\n            if i[\"id\"] == item_id:\n                self.store.set_pinned(item_id, not i[\"pinned\"])\n                break\n        self._save_soon()\n        self.refresh_list()\n\n    def delete_item(self, item_id):\n        box = QMessageBox(self)\n        box.setWindowTitle(self.tt(\"delete_item\"))\n        box.setText(self.tt(\"delete_confirm\"))\n        ok_b = box.addButton(self.tt(\"ok\"), QMessageBox.AcceptRole)\n        box.addButton(self.tt(\"cancel\"), QMessageBox.RejectRole)\n        box.exec()\n        if box.clickedButton() is not ok_b:\n            return\n        self.store.delete_item(item_id)\n        self._save_soon()\n        self.refresh_all()\n\n    def clear_all(self):\n        box = QMessageBox(self)\n        box.setWindowTitle(self.tt(\"clear_all_title\"))\n        box.setText(self.tt(\"clear_all_confirm\"))\n        ok_b = box.addButton(self.tt(\"ok\"), QMessageBox.AcceptRole)\n        box.addButton(self.tt(\"cancel\"), QMessageBox.RejectRole)\n        box.exec()\n        if box.clickedButton() is ok_b:\n            self.store.clear_all()\n            self._selected_set = None\n            self._save_soon()\n            self.refresh_all()\n\n    def start_new_set(self):\n        self.store.start_set()\n        self._selected_set = self.store.current_set_id\n        self._save_soon()\n        self.refresh_all()\n\n    def rename_current_set(self):\n        if self._selected_set is None:\n            return\n        s = self.store.get_set(self._selected_set)\n        if s is None:\n            return\n        name, ok = QInputDialog.getText(\n            self, self.tt(\"rename_title\"), self.tt(\"rename_prompt\"),\n            text=s[\"name\"])\n        if ok and name.strip():\n            self.store.rename_set(s[\"id\"], name.strip())\n            self._save_soon()\n            self._refresh_set_combo()\n\n    def toggle_pause(self):\n        self.settings[\"paused\"] = not self.settings[\"paused\"]\n        self._save_soon()\n        self._update_status()\n        self.retranslate()\n\n    def open_settings(self):\n        dlg = SettingsDialog(self)\n        if dlg.exec() == QDialog.Accepted:\n            old_lang = self.settings[\"language\"]\n            old_theme = self.settings[\"theme\"]\n            dlg.apply_to(self.settings)\n            self.store.gap_seconds = self.settings[\"gap_minutes\"] * 60\n            set_autostart(self.settings[\"autostart\"])\n            self._save_now()\n            self._run_expire()\n            if self.settings[\"theme\"] != old_theme:\n                self.apply_theme()\n            if self.settings[\"language\"] != old_lang:\n                self.retranslate()\n                self.refresh_all()\n            else:\n                self._update_status()\n                self.refresh_all()\n\n    def show_about(self):\n        box = QMessageBox(self)\n        box.setWindowTitle(self.tt(\"about\"))\n        box.setIconPixmap(QIcon(asset_path(\"icon.png\")).pixmap(64, 64))\n        box.setText(\"%s  %s\\n%s\\n\\n%s\" % (\n            APP_NAME_EN, VERSION, APP_NAME_JA, self.tt(\"about_body\")))\n        box.setStandardButtons(QMessageBox.Ok)\n        box.button(QMessageBox.Ok).setText(self.tt(\"ok\"))\n        box.exec()\n\n    # ---------- panel visibility ----------\n    def show_panel(self):\n        self._run_expire()\n        self.refresh_all()\n        if not self.isVisible():\n            screen = QApplication.screenAt(QCursor.pos()) \\\n                or QApplication.primaryScreen()\n            geo = screen.availableGeometry()\n            x = geo.x() + (geo.width() - self.width()) // 2\n            y = geo.y() + (geo.height() - self.height()) // 2\n            self.move(x, y)\n        self.show()\n        self.raise_()\n        self.activateWindow()\n        self.search_edit.setFocus()\n\n    def toggle_panel(self):\n        if self.isVisible():\n            self.hide()\n        else:\n            self.show_panel()\n\n    def closeEvent(self, event):\n        # Closing the window only hides it; the app stays in the tray.\n        event.ignore()\n        self.hide()\n\n    # ---------- clipboard ----------\n    def on_clipboard_changed(self):\n        if self._setting_clipboard:\n            self._setting_clipboard = False\n            return\n        if self.settings[\"paused\"]:\n            return\n        try:\n            text = QApplication.clipboard().text()\n        except Exception:\n            return\n        if not text or not text.strip():\n            return\n        if len(text) > MAX_STORED_TEXT:\n            return\n        if self.settings[\"block_sensitive\"]:\n            sens = is_sensitive(text)\n            if sens:\n                now = time.time()\n                if now - self._last_block_notice > 10 and self.tray is not None:\n                    self._last_block_notice = now\n                    key = \"blocked_card\" if sens == \"card\" else \"blocked_secret\"\n                    self.tray.showMessage(APP_NAME_EN, self.tt(key),\n                                          QSystemTrayIcon.Information, 2000)\n                return\n        kind, reason = classify(text)\n        item = self.store.add(text, kind, reason)\n        if item is not None:\n            self._housekeep()\n            self._save_soon()\n            if self.isVisible():\n                self.refresh_all()\n\n    def quit_app(self):\n        self._save_now()\n        try:\n            self.hotkey.stop()\n        except Exception:\n            pass\n        QApplication.quit()\n\n\ndef main():\n    if getattr(sys, \"frozen\", False):\n        # Packaged (PyInstaller) starts reach Qt initialisation much\n        # faster than source starts; under Wine that intermittently\n        # raced the session services at startup (Qt6Core page fault\n        # within the first seconds, ~half of launches). A short settle\n        # pause before creating the QApplication avoids the window.\n        time.sleep(3)\n    app = QApplication(sys.argv)\n    app.setApplicationName(APP_NAME_EN)\n    app.setApplicationVersion(VERSION)\n    app.setQuitOnLastWindowClosed(False)\n    load_app_fonts()\n    font = QFont()\n    font.setFamilies(FONT_FAMILIES)\n    font.setPointSizeF(10.5)\n    app.setFont(font)\n    app.setStyleSheet(get_theme(load_settings()[\"theme\"])[\"qss\"])\n    panel = Panel(app)\n    # A manual launch opens the panel (like the sibling apps); the\n    # autostart entry passes --tray to start quietly in the tray.\n    # The first show is deferred a moment so the event loop is already\n    # running when the window appears (startup robustness).\n    if \"--tray\" not in sys.argv:\n        QTimer.singleShot(600, panel.show_panel)\n    sys.exit(app.exec())\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"p": "appinfo.py", "s": 420, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"ClipStock - app identity.\n\nThe display name lives ONLY here so a later rename touches one place.\n(Provisional name: the formal name is decided by the user after delivery.)\n\"\"\"\nAPP_ID = \"ClipStock\"                 # folder names, file names, settings dir\nAPP_NAME_EN = \"ClipStock\"\nAPP_NAME_JA = \"コピペ履歴・スマートウォッチャー\"\nVERSION = \"1.0.0\"\nHOTKEY_LABEL = \"Ctrl+Shift+V\"\n"}, {"p": "assets/fonts/Inter-Bold.ttf", "s": 420428, "b": 1}, {"p": "assets/fonts/Inter-LICENSE.txt", "s": 4380, "l": "plaintext", "c": "Copyright (c) 2016 The Inter Project Authors (https://github.com/rsms/inter)\n\nThis Font Software is licensed under the SIL Open Font License, Version 1.1.\nThis license is copied below, and is also available with a FAQ at:\nhttp://scripts.sil.org/OFL\n\n-----------------------------------------------------------\nSIL OPEN FONT LICENSE Version 1.1 - 26 February 2007\n-----------------------------------------------------------\n\nPREAMBLE\nThe goals of the Open Font License (OFL) are to : "assets/fonts/Inter-Medium.ttf", "s": 417300, "b": 1}, {"p": "assets/fonts/Inter-Regular.ttf", "s": 411640, "b": 1}, {"p": "assets/fonts/Inter-SemiBold.ttf", "s": 419744, "b": 1}, {"p": "assets/icon.icns", "s": 83008, "b": 1}, {"p": "assets/icon.ico", "s": 30780, "b": 1}, {"p": "assets/icon.png", "s": 25683, "b": 1}, {"p": "build_win.sh", "s": 332, "l": "bash", "c": "#!/bin/bash\nexport WINEPREFIX=\"$HOME/workspace/wine-prefix\"\nexport WINEDEBUG=-all\nexport DISPLAY=:99\nWINE64=\"$HOME/workspace/exe-build/wine-local/usr/lib/wine/wine64\"\ncd \"$HOME/workspace/wine-prefix/drive_c/clip-history\" || exit 1\n\"$WINE64\" \"C:\\\\Python312\\\\python.exe\" -m PyInstaller --noconfirm ClipStock.spec\necho \"BUILD_EXIT=$?\"\n"}, {"p": "classifier.py", "s": 6848, "l": "python", "c": "# -*- coding: utf-8 -*-\n\"\"\"\nClipStock - deterministic text classifier for copied text.\n\nEvery copied text is sorted into exactly one kind using ONLY deterministic\npatterns (regular expressions and fixed character rules, evaluated in the\nfixed order below). No fuzzy matching, no similarity scoring, no machine\nlearning - this follows the user's all-apps rule.\n\nKinds: url / email / amount / date / address / code / other\n\nclassify(text) -> (kind, reason_key)\n  reason_key is a key suffix used with i18n (\"reason_\" + reason_key) so the\n  UI can show WHY the text was classified that way, in the user's language.\n\nDecision order (first match wins):\n  0. empty / multi-line / very long text        -> other\n  1. URL      (http://, https://, www. ...)\n  2. Email    (local@domain.tld, whole string)\n  3. Amount   (currency symbol / unit / thousands separators)\n  4. Date     (numeric dates, Japanese dates, times)\n  5. Address  (Japanese prefecture pattern / English street suffix)\n  6. Code     (letter+digit mix / digit sequences with separators)\n  7. other\n\nis_sensitive(text) -> reason_key or None\n  Deterministic \"looks secret\" checks used by the privacy filter:\n  - a 13-19 digit sequence (spaces / hyphens allowed) that passes Luhn\n  - a leading \"password:\" / \"passwd=\" style label\n\"\"\"\nimport re\n\nMAX_CLASSIFY_LEN = 500\n\n# --- 1. URL -------------------------------------------------------------\n_RE_URL = re.compile(r\"^(https?://|www\\.)\\S+$\", re.IGNORECASE)\n\n# --- 2. Email -----------------------------------------------------------\n_RE_EMAIL = re.compile(r\"^[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}$\")\n\n# --- 3. Amount ----------------------------------------------------------\n_CURRENCY_SYMBOLS = \"¥$€£₹₽\"\n_CURRENCY_UNITS = (\n    \"円|ドル|ユーロ|ポンド|元|ウォン|フラン|ルーブル|レアル|ペソ|\"\n    \"USD|JPY|EUR|GBP|CNY|KRW|CHF|INR|RUB|BRL|MXN|TRY|AED\"\n)\n_RE_AMOUNT_SYMBOL = re.compile(\n    r\"^[\" + _CURRENCY_SYMBOLS + r\"]\\s?\\d[\\d,]*(\\.\\d+)?$\")\n_RE_AMOUNT_UNIT = re.compile(\n    r\"^\\d[\\d,]*(\\.\\d+)?\\s?(\" + _CURRENCY_UNITS + r\")$\")\n_RE_AMOUNT_THOUSANDS = re.compile(r\"^\\d{1,3}(,\\d{3})+(\\.\\d+)?$\")\n\n# --- 4. Date / time -----------------------------------------------------\n_RE_DATE_ISO = re.compile(r\"^\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}$\")\n_RE_DATE_JP = re.compile(r\"^\\d{4}年\\d{1,2}月\\d{1,2}日$\")\n_RE_DATE_DMY = re.compile(r\"^\\d{1,2}[-/]\\d{1,2}[-/]\\d{2,4}$\")\n_RE_DATETIME = re.compile(\n    r\"^\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}[ T]\\d{1,2}:\\d{2}(:\\d{2})?$\")\n_RE_TIME = re.compile(r\"^\\d{1,2}:\\d{2}(:\\d{2})?$\")\n\n# --- 5. Address ---------------------------------------------------------\n_RE_POSTAL_JP = re.compile(r\"^〒?\\s?\\d{3}-\\d{4}\")\n_RE_PREF = re.compile(r\"(東京都|北海道|(?:京都|大阪)府|[^\\s]{2,3}県)\")\n_RE_CITY = re.compile(r\"[^\\s]{1,6}(市|区|町|村)\")\n_RE_BANCHI = re.compile(r\"(\\d+丁目|\\d+[-−]\\d+|\\d+番地)\")\n_RE_STREET_EN = re.compile(\n    r\"\\b(Street|St\\.|Avenue|Ave\\.|Road|Rd\\.|Boulevard|Blvd\\.|\"\n    r\"Lane|Ln\\.|Drive|Dr\\.|Court|Ct\\.)\\b\", re.IGNORECASE)\n_RE_HAS_DIGIT = re.compile(r\"\\d\")\n\n# --- 6. Code ------------------------------------------------------------\n_RE_CODE_MIXED = re.compile(r\"^[A-Za-z0-9][A-Za-z0-9\\-_/]{2,}$\")\n_RE_CODE_DIGITS = re.compile(r\"^\\d[\\d\\-]{5,}\\d$\")\n\n\ndef _is_japanese_address(s):\n    \"\"\"Deterministic JP address shape: prefecture + municipality + number.\n    A bare digit-hyphen sequence (e.g. a phone number) must NOT match the\n    postal-code rule: the postal prefix only counts when it carries the\n    〒 mark or is followed by an actual address element.\"\"\"\n    if s.startswith(\"〒\") and _RE_POSTAL_JP.match(s):\n        return True\n    m = _RE_POSTAL_JP.match(s)\n    if m and (_RE_PREF.search(s) or _RE_CITY.search(s)):\n        return True\n    if _RE_PREF.search(s) and _RE_CITY.search(s) and _RE_BANCHI.search(s):\n        return True\n    return False\n\n\ndef _is_english_address(s):\n    \"\"\"English address shape: street suffix word plus a house number digit,\n    and at least two words (a bare product name cannot match).\"\"\"\n    return bool(_RE_STREET_EN.search(s) and _RE_HAS_DIGIT.search(s)\n                and \" \" in s)\n\n\ndef classify(text):\n    \"\"\"Return (kind, reason_key). See module docstring for the order.\"\"\"\n    if text is None:\n        return \"other\", \"other\"\n    s = text.strip()\n    if not s:\n        return \"other\", \"other\"\n    if \"\\n\" in s or \"\\r\" in s:\n        return \"other\", \"multiline\"\n    if len(s) > MAX_CLASSIFY_LEN:\n        return \"other\", \"long\"\n\n    # 1. URL\n    if _RE_URL.match(s):\n        return \"url\", \"url\"\n    # 2. Email\n    if _RE_EMAIL.match(s):\n        return \"email\", \"email\"\n    # 3. Amount\n    if _RE_AMOUNT_SYMBOL.match(s):\n        return \"amount\", \"amount_symbol\"\n    if _RE_AMOUNT_UNIT.match(s):\n        return \"amount\", \"amount_unit\"\n    if _RE_AMOUNT_THOUSANDS.match(s):\n        return \"amount\", \"amount_thousands\"\n    # 4. Date / time\n    if (_RE_DATETIME.match(s) or _RE_DATE_ISO.match(s)\n            or _RE_DATE_JP.match(s) or _RE_DATE_DMY.match(s)):\n        return \"date\", \"date\"\n    if _RE_TIME.match(s):\n        return \"date\", \"time\"\n    # 5. Address\n    if _is_japanese_address(s):\n        return \"address\", \"address_jp\"\n    if _is_english_address(s):\n        return \"address\", \"address_en\"\n    # 6. Code\n    if _RE_CODE_MIXED.match(s):\n        has_letter = any(c.isalpha() for c in s)\n        has_digit = any(c.isdigit() for c in s)\n        if has_letter and has_digit:\n            return \"code\", \"code_mixed\"\n    if _RE_CODE_DIGITS.match(s):\n        digits = sum(c.isdigit() for c in s)\n        if digits >= 7:\n            return \"code\", \"code_digits\"\n    # 7. Fallback\n    return \"other\", \"other\"\n\n\ndef luhn_ok(digits):\n    \"\"\"Standard Luhn checksum over a string of decimal digits.\"\"\"\n    if not digits or not digits.isdigit():\n        return False\n    total = 0\n    alt = False\n    for ch in reversed(digits):\n        d = ord(ch) - 48\n        if alt:\n            d *= 2\n            if d > 9:\n                d -= 9\n        total += d\n        alt = not alt\n    return total % 10 == 0\n\n\n_RE_DIGIT_SEQ = re.compile(r\"\\d[\\d \\-]{11,}\\d\")\n_RE_SECRET_LABEL = re.compile(\n    r\"^(password|passwd|pwd|パスワード|暗証番号)\\s*[:：=]\", re.IGNORECASE)\n\n\ndef is_sensitive(text):\n    \"\"\"Return a reason key ('card' / 'secret_label') or None.\n\n    Only deterministic shapes are treated as sensitive: a digit sequence\n    that passes the Luhn check (payment-card shape), or an explicit\n    password-style label at the start of the text.\n    \"\"\"\n    if text is None:\n        return None\n    s = text.strip()\n    if not s or \"\\n\" in s:\n        return None\n    if _RE_SECRET_LABEL.match(s):\n        return \"secret_label\"\n    for m in _RE_DIGIT_SEQ.finditer(s):\n        digits = re.sub(r\"\\D\", \"\", m.group(0))\n        if 13 <= len(digits) <= 19 and luhn_ok(digits):\n            return \"card\"\n    return None\n"}, {"p": "ClipStock.spec", "s": 740, "l": "python", "c": "#
