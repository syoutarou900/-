# =====================================================================
# get-quicknote Desktop Tools - Windows build (all 13 apps)
#
# 前提: リポジトリの直下に各アプリのフォルダ (ClipStock, TashikaMail, ...) が
#       ある構成。各アプリのフォルダで、そのアプリの requirements.txt を
#       入れてから PyInstaller でビルドします。
# ビルド手順は、配布中の最終ビルドで使った MakeExe-*.bat / PyInstaller の
# spec ファイル / ビルドログの内容を再現したものです。
# Python 3.12 は、元のビルド環境 (Python 3.12.10) に合わせています。
# =====================================================================

name: Build Windows apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ClipStock
            extra_pip: ''
            build: 'python -m PyInstaller --noconfirm ClipStock.spec'
            artifact_path: 'ClipStock/dist/ClipStock.exe'
          - app: ContextStruct
            extra_pip: ''
            build: 'python -m PyInstaller --noconfirm --onedir --windowed --name ContextStruct app.py'
            artifact_path: 'ContextStruct/dist/ContextStruct'
          - app: DropLauncher
            extra_pip: 'pypdf imageio-ffmpeg'
            build: 'python -m PyInstaller --noconfirm --onefile --windowed --name DropLauncher --icon assets/icon.ico --add-data "assets;assets" --collect-all imageio_ffmpeg app.py'
