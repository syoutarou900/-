      # SignPath Foundation の審査に通ったら、下のコメントを外して有効化します。
      # これは「ビルドした成果物(artifact)を SignPath に送って署名してもらう」
      # ためのステップです。有効化の前に、リポジトリの Settings > Secrets に
      # SIGNPATH_API_TOKEN を登録し、organization-id などを自分の値に
      # 書き換えてください（詳しくは設置手順のREADMEを見てください）。
