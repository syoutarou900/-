      #     project-slug: <YOUR-PROJECT-SLUG>
      #     signing-policy-slug: <YOUR-SIGNING-POLICY-SLUG>
      #     artifact-configuration-slug: <YOUR-ARTIFACT-CONFIGURATION-SLUG>
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
