<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="アプリ作成初心者が作成した無料デスクトップツール一覧。軽快な動作で、完全無料。">
<title>自作アプリ一覧 - get-quicknote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+Arabic:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F8FD;
  --surface: #FFFFFF;
  --ink: #0F1B33;
  --muted: #4F5E78;
  --line: #DFE7F3;
  --accent: #2563EB;
  --accent-strong: #1D4ED8;
  --accent-soft: #E7EFFD;
  --glow: #C4D9FF;
  --glow-2: #D3F4EE;
  --cjk: "Noto Sans JP", "Noto Sans SC", "Noto Sans KR", "Noto Sans Arabic";
  --font-display: "Plus Jakarta Sans", "Inter", var(--cjk), system-ui, sans-serif;
  --font-body: "Inter", var(--cjk), system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", "Malgun Gothic", Meiryo, sans-serif;
  color-scheme: light;
}
:root:lang(zh) { --cjk: "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", "Noto Sans Arabic"; }
:root:lang(ko) { --cjk: "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", "Noto Sans Arabic"; }
:root:lang(ar) { --cjk: "Noto Sans Arabic", "Noto Sans JP", "Noto Sans SC", "Noto Sans KR"; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle 620px at 88% 0%, var(--glow), transparent 70%),
    radial-gradient(circle 520px at 0% 22%, var(--glow-2), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.8;
  line-break: strict;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: clip;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1280px; margin-inline: auto; padding-inline: 24px; }
:root:lang(ar) * { letter-spacing: 0 !important; }

/* Header */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; text-decoration: none; direction: ltr; }
.logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(145deg, #3B82F6, #1D4ED8); box-shadow: 0 8px 16px -6px rgba(37, 99, 235, 0.55); }
.nav-right { display: flex; align-items: center; gap: 8px; }
.lang-pick { position: relative; display: inline-flex; align-items: center; }
.lang-pick svg { position: absolute; top: 50%; translate: 0 -50%; pointer-events: none; }
.lang-pick .globe { inset-inline-start: 12px; color: var(--accent); }
.lang-pick .chev { inset-inline-end: 11px; color: var(--muted); }
.lang-pick select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 0.85rem; font-weight: 700; line-height: 1.4; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding-block: 8px; padding-inline: 36px 32px; cursor: pointer; max-width: 100%; transition: border-color 0.15s; }
.lang-pick select:hover { border-color: #B9CBEA; }
.nav-dl { font-size: 0.9rem; font-weight: 700; color: var(--accent-strong); text-decoration: none; padding: 8px 14px; border-radius: 999px; transition: background 0.15s; }
.nav-dl:hover { background: var(--accent-soft); }

/* Hero */
.hero { display: block; padding-block: 50px 40px; width: 100%; text-align: left; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 700; line-height: 1.4; color: var(--accent-strong); background: var(--accent-soft); padding: 8px 16px; border-radius: 999px; }
.eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 5.2vw, 4.2rem); line-height: 1.25; letter-spacing: -0.02em; margin: 24px 0 0; width: 100%; }
h1 em { font-style: normal; color: var(--accent); }

/* Apps List Section */
.apps-section { padding-bottom: 80px; }
.apps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 32px; margin-top: 32px; }
.app-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px; box-shadow: 0 10px 30px -10px rgba(15, 27, 51, 0.08); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; }
.app-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px -12px rgba(37, 99, 235, 0.18); }

/* App Preview Image */
.app-image { width: 100%; aspect-ratio: 16 / 10; background: #0F172A; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid var(--line); display: grid; place-items: center; }
.app-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.app-image-placeholder { color: #8FA0C4; font-size: 0.85rem; font-weight: 600; text-align: center; padding: 12px; line-height: 1.5; }

.app-info h3 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; margin: 0 0 12px; color: var(--ink); }
.app-info p { margin: 0 0 24px; color: var(--muted); font-size: 1rem; line-height: 1.6; white-space: pre-line; }

.
