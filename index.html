  function setLang(lang) {
    if (!dict[lang]) lang = "en";
    var t = dict[lang];
    var root = document.documentElement;
    root.lang = HTML_LANG[lang] || lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var v = t[el.getAttribute("data-i18n")];
      if (v !== undefined) el.innerHTML = v;
    });
    select.value = lang;
    try { localStorage.setItem("gq-lang", lang); } catch (e) {}
  }

  function detect() {
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var code = String(list[i]).toLowerCase().split("-")[0];
      if (code === "in") code = "id";
      if (dict[code]) return code;
    }
    return "en";
  }

  var saved = null;
  try { saved = localStorage.getItem("gq-lang"); } catch (e) {}
  select.addEventListener("change", function () { setLang(select.value); });
  setLang(saved && dict[saved] ? saved : detect());
