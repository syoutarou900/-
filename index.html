<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Floating Memo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

    <!-- ヘルパーやヒーローセクション（必要に応じて調整してください） -->
    <header class="py-16 text-center">
        <h1 class="text-4xl font-bold mb-4">Smart Floating Memo</h1>
        <p class="text-slate-400">デスクトップをスマートに彩るフロートメモアプリ</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <!-- 主な特徴セクション -->
        <section class="mb-20">
            <h2 class="text-3xl font-bold mb-12 text-center">主な特徴</h2>
            
            <!-- サブコピーのテキスト要素を削除し、見出しから直接カードグリッドへ接続 -->

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- カード1: 超高速・軽量動作 -->
                <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl hover:border-slate-600 transition-all">
                    <div class="w-12 h-12 flex items-center justify-center bg-blue-500/10 text-blue-400 rounded-xl mb-6 text-xl">
                        ⚡
                    </div>
                    <h3 class="text-xl font-semibold mb-3">超高速・軽量動作</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">無駄なプロセスを削ぎ落とし、PCのリソースを圧迫せずにスムーズに動作します。</p>
                </div>

                <!-- カード2: モダンな3Dデザイン -->
                <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl hover:border-slate-600 transition-all">
                    <div class="w-12 h-12 flex items-center justify-center bg-blue-500/10 text-blue-400 rounded-xl mb-6 text-xl">
                        🎨
                    </div>
                    <h3 class="text-xl font-semibold mb-3">モダンな3Dデザイン</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">ダークモードを基調とした美しく没入感のあるインターフェースを採用しています。</p>
                </div>

                <!-- カード3: 安全・プライベート -->
                <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl hover:border-slate-600 transition-all">
                    <div class="w-12 h-12 flex items-center justify-center bg-blue-500/10 text-blue-400 rounded-xl mb-6 text-xl">
                        🔒
                    </div>
                    <h3 class="text-xl font-semibold mb-3">安全・プライベート</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">外部サーバーへの不要なデータ送信を行わず、安心してローカルでご利用いただけます。</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
