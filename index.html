  }

  var saved = null;
  try { saved = localStorage.getItem("gq-lang"); } catch (e) {}
  select.addEventListener("change", function () { setLang(select.value); });
  setLang(saved && dict[saved] ? saved : detect());

  if (DOWNLOAD_URL) {
    document.querySelectorAll(".js-dl").forEach(function (a) { a.setAttribute("href", DOWNLOAD_URL); });
  } else {
    document.querySelectorAll(".dl .js-dl").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); });
    });
  }
})();
</script>
</body>
</html>
